scrLotes As screen:
    ContentLanguage: =""
    Fill: =ThemeBg
    OnVisible: |-
        =Set(gvarTxLot, Blank());
        UpdateContext({
            ctxFiltroEstadoLot: "Por aplicar",
            ctxDesdeFechaLot: DateValue("1900-01-01"),
            ctxDescargandoLot: false,
            ctxAplicandoLot: false,
            ctxSacandoLot: false,
            ctxDlgAplicadoLot: false,
            ctxDlgSacarLot: false,
            ctxDlTokenLot: "",
            ctxDlgDevolverLot: false,
            ctxDevolviendoLot: false,
            ctxSacadoOkLot: false,
            ctxPasoOkLot: false,
            ctxDlgResumenLot: false,
            ctxVeredictoLot: "",
            ctxMensajeLot: ""
        });
        Reset(tabFechaLot);
        Reset(inpBuscarLot);
        Select(btnActualizarLot);
        Set(gvarCajeroLot, First(colCajerosLot));
        Set(gvarLote, First(
            SortByColumns(
                Filter('CH-Tbl-TransactionBatches',
                    Cajero.User = gvarCajeroLot.cajero,
                    ( ctxFiltroEstadoLot = "Todos" )
                    || ( ctxFiltroEstadoLot = "Aplicados"
                         && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                    || ( ctxFiltroEstadoLot = "Por aplicar"
                         && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                    ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                    ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                ),
                "createdon", SortOrder.Descending
            )
        ))

    "FileDownloader1 As 'CashHub File Downloader'":
        Content: |-
            =// ARMA EL ARCHIVO EN EL NAVEGADOR, sin navegar a Dataverse.
            //
            // La descarga vieja era Download(".../sanic_csvcore/$value"): una NAVEGACION,
            // en la que Power Fx no puede poner un header Authorization. Lo unico que la
            // autenticaba era la cookie del org, que los usuarios de negocio no tienen
            // —viven en apps.powerapps.com—. Les daba HTTP 401 y una pestaña en blanco. Y
            // muda: el Download() queda FUERA del alcance de cualquier IfError, asi que la
            // app ni se enteraba de que habia fallado.
            //
            // Mide 1x1 y queda detras del header a proposito: es un componente de
            // COMPORTAMIENTO, no de presentacion. NO se le pone Visible: =false porque un
            // componente que no se renderiza no recibe los cambios de propiedad — y
            // entonces no bajaria nunca nada.
            ctxCsvLot
        DisplayMode: =DisplayMode.Edit
        ExpectedBytes: |-
            =// Bytes que el servidor dice haber archivado. El componente los compara con
            // los que realmente arma: si no coinciden, NO baja nada y lo reporta. Un CSV
            // cortado entrando a un core bancario es peor que una descarga que falla.
            ctxCsvBytesLot
        FileName: =ctxCsvNombreLot
        Height: =1
        MimeType: ="text/csv;charset=utf-8"
        Trigger: |-
            =// Dispara por CAMBIO de token, no por valor presente: si no, cualquier
            // re-render volveria a bajar el archivo y el usuario juntaria copias.
            ctxDlTokenLot
        Width: =1
        X: =0
        Y: =0
        ZIndex: =1

    lblErrorDescargaLot As label:
        BorderRadius: =8
        Color: =RGBA(255, 255, 255, 1)
        Fill: =ThemeDanger
        FontWeight: =FontWeight.Semibold
        Height: =44
        PaddingLeft: =14
        PaddingRight: =14
        Size: =9
        Text: |-
            =// EL FALLO TIENE QUE VERSE. Con Download() no habia forma de mostrarlo: no
            // era una operacion de la app y no habia nada que reportar. Ahora el
            // componente informa, y esto lo pone en pantalla.
            $"No se pudo bajar el CSV del lote: {FileDownloader1.Status}"
        VerticalAlign: =VerticalAlign.Middle
        Visible: |-
            =// Se limpia sola: cada intento borra el token antes de empezar, asi que el
            // cartel de un fallo viejo no sobrevive al siguiente intento.
            !IsBlank(ctxDlTokenLot)
            && !IsBlank(FileDownloader1.Status)
            && FileDownloader1.Status <> "ok"
        Width: =Parent.Width - 32
        X: =16
        Y: =LayHeaderH + 12
        ZIndex: =200

    cmpHeaderLot As cmpHeader:
        Activo: ="Lotes"
        Height: =LayHeaderH
        OnCheques: =Navigate(scrCheques, ScreenTransition.None)
        OnCorte: =Navigate(scrCorte, ScreenTransition.None)
        OnLotes: =Navigate(scrLotes, ScreenTransition.None)
        OnManual: =Navigate(scrManual, ScreenTransition.None)
        Subtitulo: ="Lotes"
        Width: =Parent.Width
        ZIndex: =2

    cntBodyLot As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =Color.Transparent
        Height: =Parent.Height - LayHeaderH
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        Y: =LayHeaderH
        ZIndex: =3

        cmpRailLot As cmpRailCajeros:
            Datos: =AddColumns(DropColumns(colCajerosLot, lotesPorAplicar), pendientesCorte, 0, totalNio, 0, totalUsd, 0, totalEur, 0)
            Height: =Parent.Height
            OnActualizar: =Select(btnActualizarLot)
            OnSeleccion: |-
                =Set(gvarCajeroLot, cmpRailLot.CajeroSel);
