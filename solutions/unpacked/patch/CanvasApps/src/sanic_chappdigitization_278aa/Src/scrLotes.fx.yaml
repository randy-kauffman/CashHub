                            // generando y ARCHIVANDO el CSV: la API lo lee, no lo regenera, para
                            // que lo que se baja y lo que queda archivado sean el mismo archivo.
                            UpdateContext({ctxDescargandoLot: true, ctxDlTokenLot: ""});
                            IfError(
