scrLotes As screen:
    ContentLanguage: =""
    Fill: =ThemeBg
    OnVisible: |-
        =Set(gvarTxLot, Blank());
        UpdateContext({
            ctxFiltroEstadoLot: "Por aplicar",
            ctxDesdeFechaLot: DateValue("1900-01-01"),
            ctxDescargandoLot: false,
            ctxAplicandoLot: false,
            ctxSacandoLot: false,
            ctxDlgAplicadoLot: false,
            ctxDlgSacarLot: false
        });
        Reset(tabFechaLot);
        Reset(inpBuscarLot);
        Select(btnActualizarLot);
        Set(gvarCajeroLot, First(colCajerosLot));
        Set(gvarLote, First(
            SortByColumns(
                Filter('CH-Tbl-TransactionBatches',
                    Cajero.User = gvarCajeroLot.cajero,
                    ( ctxFiltroEstadoLot = "Todos" )
                    || ( ctxFiltroEstadoLot = "Aplicados"
                         && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                    || ( ctxFiltroEstadoLot = "Por aplicar"
                         && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                    ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                    ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                ),
                "createdon", SortOrder.Descending
            )
        ))

    cmpHeaderLot As cmpHeader:
        Activo: ="Lotes"
        Height: =LayHeaderH
        OnCheques: =Navigate(scrCheques, ScreenTransition.None)
        OnCorte: =Navigate(scrCorte, ScreenTransition.None)
        OnLotes: =Navigate(scrLotes, ScreenTransition.None)
        OnManual: =Navigate(scrManual, ScreenTransition.None)
        Subtitulo: ="Lotes"
        Width: =Parent.Width
        ZIndex: =1

    cntBodyLot As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =Color.Transparent
        Height: =Parent.Height - LayHeaderH
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        Y: =LayHeaderH
        ZIndex: =2

        cmpRailLot As cmpRailCajeros:
            Datos: =AddColumns(DropColumns(colCajerosLot, lotesPorAplicar), pendientesCorte, 0, totalNio, 0, totalUsd, 0, totalEur, 0)
            Height: =Parent.Height
            OnActualizar: =Select(btnActualizarLot)
            OnSeleccion: |-
                =Set(gvarCajeroLot, cmpRailLot.CajeroSel);
                Set(gvarTxLot, Blank());
                Set(gvarLote, First(
                    SortByColumns(
                        Filter('CH-Tbl-TransactionBatches',
                            Cajero.User = gvarCajeroLot.cajero,
                            ( ctxFiltroEstadoLot = "Todos" )
                            || ( ctxFiltroEstadoLot = "Aplicados"
                                 && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                            || ( ctxFiltroEstadoLot = "Por aplicar"
                                 && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                            ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                            ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                        ),
                        "createdon", SortOrder.Descending
                    )
                ))
            Titulo: ="CAJEROS CON LOTES"
            Width: =LayRailW
            ZIndex: =1

        cntMainLo As groupContainer.manualLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Parent.Width - LayRailW
            X: =LayRailW
            ZIndex: =2

            cntListaCardLot As groupContainer.manualLayoutContainer:
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =ThemeSurface
                Height: =Parent.Height - 2*LayGutter
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =LayCardR
                RadiusBottomRight: =LayCardR
                RadiusTopLeft: =LayCardR
                RadiusTopRight: =LayCardR
                Width: =(Parent.Width - 2*LayGutter - LayGap) * 0.385
                X: =LayGutter
                Y: =LayGutter
                ZIndex: =1

                cntSegEstadoLo As groupContainer.manualLayoutContainer:
                    BorderColor: =ThemeLine
                    BorderThickness: =1
                    DropShadow: =DropShadow.Light
                    Fill: =ThemeSurface2
                    Height: =34
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    RadiusBottomLeft: =9
                    RadiusBottomRight: =9
                    RadiusTopLeft: =9
                    RadiusTopRight: =9
                    Width: =Parent.Width - 2*12
                    X: =12
                    Y: =10
                    ZIndex: =1

                    btnSegPorAplicarLot As button:
                        BorderColor: =App.Theme.Colors.Primary
                        BorderThickness: =0
                        Color: =If(ctxFiltroEstadoLot = "Por aplicar", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =If(ctxFiltroEstadoLot = "Por aplicar", ThemeSurface, Color.Transparent)
                        FontWeight: =If(ctxFiltroEstadoLot = "Por aplicar", FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.Height - 6
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: |-
                            =UpdateContext({ctxFiltroEstadoLot: "Por aplicar"});
                            Set(gvarTxLot, Blank());
                            Set(gvarLote, First(
                                SortByColumns(
                                    Filter('CH-Tbl-TransactionBatches',
                                        Cajero.User = gvarCajeroLot.cajero,
                                        ( ctxFiltroEstadoLot = "Todos" )
                                        || ( ctxFiltroEstadoLot = "Aplicados"
                                             && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                        || ( ctxFiltroEstadoLot = "Por aplicar"
                                             && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                        ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                        ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                    ),
                                    "createdon", SortOrder.Descending
                                )
                            ))
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =App.Theme.Colors.Darker40
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =15
                        Text: ="Por aplicar"
                        Width: =(Parent.Width - 6) / 3
                        X: =3
                        Y: =3
                        ZIndex: =1

                    btnSegAplicadosLot As button:
                        BorderColor: =App.Theme.Colors.Primary
                        BorderThickness: =0
                        Color: =If(ctxFiltroEstadoLot = "Aplicados", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =If(ctxFiltroEstadoLot = "Aplicados", ThemeSurface, Color.Transparent)
                        FontWeight: =If(ctxFiltroEstadoLot = "Aplicados", FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.Height - 6
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: |-
                            =UpdateContext({ctxFiltroEstadoLot: "Aplicados"});
                            Set(gvarTxLot, Blank());
                            Set(gvarLote, First(
                                SortByColumns(
                                    Filter('CH-Tbl-TransactionBatches',
                                        Cajero.User = gvarCajeroLot.cajero,
                                        ( ctxFiltroEstadoLot = "Todos" )
                                        || ( ctxFiltroEstadoLot = "Aplicados"
                                             && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                        || ( ctxFiltroEstadoLot = "Por aplicar"
                                             && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                        ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                        ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                    ),
                                    "createdon", SortOrder.Descending
                                )
                            ))
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =App.Theme.Colors.Darker40
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =15
                        Text: ="Aplicados"
                        Width: =(Parent.Width - 6) / 3
                        X: =btnSegPorAplicarLot.X + btnSegPorAplicarLot.Width
                        Y: =3
                        ZIndex: =2

                    btnSegTodosLot As button:
                        BorderColor: =App.Theme.Colors.Primary
                        BorderThickness: =0
                        Color: =If(ctxFiltroEstadoLot = "Todos", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =If(ctxFiltroEstadoLot = "Todos", ThemeSurface, Color.Transparent)
                        FontWeight: =If(ctxFiltroEstadoLot = "Todos", FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.Height - 6
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: |-
                            =UpdateContext({ctxFiltroEstadoLot: "Todos"});
                            Set(gvarTxLot, Blank());
                            Set(gvarLote, First(
                                SortByColumns(
                                    Filter('CH-Tbl-TransactionBatches',
                                        Cajero.User = gvarCajeroLot.cajero,
                                        ( ctxFiltroEstadoLot = "Todos" )
                                        || ( ctxFiltroEstadoLot = "Aplicados"
                                             && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                        || ( ctxFiltroEstadoLot = "Por aplicar"
                                             && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                        ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                        ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                    ),
                                    "createdon", SortOrder.Descending
                                )
                            ))
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =App.Theme.Colors.Darker40
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =15
                        Text: ="Todos"
                        Width: =(Parent.Width - 6) / 3
                        X: =btnSegAplicadosLot.X + btnSegAplicadosLot.Width
                        Y: =3
                        ZIndex: =3

                inpBuscarLot As text:
                    BorderColor: =ThemeLine
                    BorderThickness: =2
                    Color: =RGBA(0, 0, 0, 1)
                    Default: =
                    DelayOutput: =true
                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    DisabledFill: =RGBA(244, 244, 244, 1)
                    FocusedBorderThickness: =4
                    Height: =32
                    HintText: ="⌕ N° de lote…"
                    HoverBorderColor: =App.Theme.Colors.Darker40
                    HoverColor: =RGBA(0, 0, 0, 1)
                    HoverFill: =App.Theme.Colors.Lighter70
                    RadiusBottomLeft: =8
                    RadiusBottomRight: =8
                    RadiusTopLeft: =8
                    RadiusTopRight: =8
                    Size: =9
                    Width: =Parent.Width - 2*12
                    X: =12
                    Y: =cntSegEstadoLo.Y + cntSegEstadoLo.Height + 10
                    ZIndex: =2

                tabFechaLot As modernTabList:
                    Font: =Font.'Open Sans'
                    Height: =30
                    Items: |-
                        =Table({Value:"Cualquier fecha"},{Value:"Hoy"},{Value:"Últimos 7 días"},{Value:"Este mes"})
                    OnChange: |-
                        =UpdateContext({ctxDesdeFechaLot:
                            Switch(tabFechaLot.Selected.Value,
                                "Hoy", Today(),
                                "Últimos 7 días", DateAdd(Today(), -7, TimeUnit.Days),
                                "Este mes", Date(Year(Today()), Month(Today()), 1),
                                DateValue("1900-01-01"))});
                        Set(gvarTxLot, Blank());
                        Set(gvarLote, First(
                            SortByColumns(
                                Filter('CH-Tbl-TransactionBatches',
                                    Cajero.User = gvarCajeroLot.cajero,
                                    ( ctxFiltroEstadoLot = "Todos" )
                                    || ( ctxFiltroEstadoLot = "Aplicados"
                                         && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                    || ( ctxFiltroEstadoLot = "Por aplicar"
                                         && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                    ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                    ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                ),
                                "createdon", SortOrder.Descending
                            )
                        ))
                    Width: =Parent.Width - 2*12
                    X: =12
                    Y: =inpBuscarLot.Y + inpBuscarLot.Height + 8
                    ZIndex: =3

                lblListaSubLot As label:
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Fill: =ThemeSurface2
                    FontWeight: =FontWeight.Semibold
                    Height: =28
                    PaddingLeft: =12
                    Size: =7.88
                    Text: =$"Lotes de {Coalesce(gvarCajeroLot.cajeroNombre, "—")}"
                    Width: =Parent.Width
                    Y: =tabFechaLot.Y + tabFechaLot.Height + 10
                    ZIndex: =4

                galLotesLot As gallery.galleryVertical:
                    '#CopilotOverlayLabel': ="Filtered"
                    BorderColor: =App.Theme.Colors.Darker40
                    DelayItemLoading: =true
                    Height: =Parent.Height - Self.Y - 8
                    Items: |-
                        =SortByColumns(
                            Filter('CH-Tbl-TransactionBatches',
                                Cajero.User = gvarCajeroLot.cajero,
                                ( ctxFiltroEstadoLot = "Todos" )
                                || ( ctxFiltroEstadoLot = "Aplicados"
                                     && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                || ( ctxFiltroEstadoLot = "Por aplicar"
                                     && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                          || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                          || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                            ),
                            "createdon", SortOrder.Descending
                        )
                    Layout: =Layout.Vertical
                    LoadingSpinner: =LoadingSpinner.Data
                    OnSelect: |-
                        =Set(gvarLote, ThisItem);
                        Set(gvarTxLot, Blank())
                    TemplateSize: =52
                    Width: =Parent.Width - 2*12
                    X: =12
                    Y: =lblListaSubLot.Y + lblListaSubLot.Height
                    ZIndex: =5

                    shpLoteSelLot As rectangle:
                        BorderColor: =App.Theme.Colors.Darker40
                        Fill: =If(ThisItem.TransactionBatches = gvarLote.TransactionBatches, ThemeAccentSoft, Color.Transparent)
                        Height: =52
                        Width: =Parent.TemplateWidth
                        ZIndex: =1

                    shpLoteSelBarraLot As rectangle:
                        BorderColor: =App.Theme.Colors.Darker40
                        Fill: =ThemeAccent
                        Height: =52
                        Visible: =ThisItem.TransactionBatches = gvarLote.TransactionBatches
                        Width: =3
                        ZIndex: =2

                    btnLoteFilaLot As button:
                        BorderColor: =App.Theme.Colors.Primary
                        BorderStyle: =BorderStyle.None
                        Color: =App.Theme.Colors.PrimaryForeground
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =Color.Transparent
                        Font: =App.Theme.Font
                        FontWeight: =FontWeight.Semibold
                        Height: =52
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =Color.Transparent
                        OnSelect: =Select(Parent)
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =Color.Transparent
                        Size: =15
                        Text: =""
                        Width: =Parent.TemplateWidth
                        ZIndex: =3

                    lblLoteNombreLot As label:
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =RGBA(0, 0, 0, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        OnSelect: =Select(Parent)
                        Size: =13
                        Text: =ThisItem.Name
                        Width: =Parent.TemplateWidth - 110
                        X: =13
                        Y: =8
                        ZIndex: =4

                    lblLoteMetaLot As label:
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =ThemeInk3
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        Height: =16
                        OnSelect: =Select(Parent)
                        Size: =13
                        Text: =Text(ThisItem.'Created On', FmtFecha)
                        Width: =Parent.TemplateWidth - 110
                        X: =13
                        Y: =30
                        ZIndex: =5

                    pilLoteEstadoLot As button:
                        BorderColor: =App.Theme.Colors.Primary
                        Color: |-
                            =Switch(ThisItem.BatchStatus,
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, ThemeWarn,
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  ThemeOk, ThemeInfo)
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        DisplayMode: =DisplayMode.View
                        Fill: |-
                            =Switch(ThisItem.BatchStatus,
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, ThemeWarnSoft,
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  ThemeOkSoft, ThemeInfoSoft)
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: =Select(Parent)
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =App.Theme.Colors.Darker40
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Size: =7.88
                        Text: |-
                            =Switch(ThisItem.BatchStatus,
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Generado,  "Generado",
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, "Ingresado",
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado,  "Aprobado",
                                'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  "Aplicado", "—")
                        Width: =84
                        X: =Parent.TemplateWidth - 96
                        Y: =15
                        ZIndex: =6

                cmpEmptyListaLot As cmpEmpty:
                    Glifo: ="⛁"
                    Height: =galLotesLot.Height
                    Mensaje: ="Sin lotes para este filtro."
                    Visible: |-
                        =IsEmpty(
                            SortByColumns(
                                Filter('CH-Tbl-TransactionBatches',
                                    Cajero.User = gvarCajeroLot.cajero,
                                    ( ctxFiltroEstadoLot = "Todos" )
                                    || ( ctxFiltroEstadoLot = "Aplicados"
                                         && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                    || ( ctxFiltroEstadoLot = "Por aplicar"
                                         && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                    ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                    ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                ),
                                "createdon", SortOrder.Descending
                            )
                        )
                    Width: =Parent.Width - 2*12
                    X: =12
                    Y: =galLotesLot.Y
                    ZIndex: =6

            cntDetalleCardLot As groupContainer.manualLayoutContainer:
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =ThemeSurface
                Height: =Parent.Height - 2*LayGutter
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =LayCardR
                RadiusBottomRight: =LayCardR
                RadiusTopLeft: =LayCardR
                RadiusTopRight: =LayCardR
                Width: =Parent.Width - LayGutter - Self.X
                X: =cntListaCardLot.X + cntListaCardLot.Width + LayGap
                Y: =LayGutter
                ZIndex: =2

                cntDetHeadLot As groupContainer.manualLayoutContainer:
                    DropShadow: =DropShadow.Light
                    Fill: =Color.Transparent
                    Height: =54
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    RadiusBottomLeft: =4
                    RadiusBottomRight: =4
                    RadiusTopLeft: =4
                    RadiusTopRight: =4
                    Visible: =!IsBlank(gvarLote)
                    Width: =Parent.Width
                    ZIndex: =1

                    lblDetTituloLot As label:
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =RGBA(0, 0, 0, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Size: =12
                        Text: =$"Lote {gvarLote.Name}"
                        Width: =Parent.Width - 130
                        X: =16
                        Y: =8
                        ZIndex: =1

                    lblDetSubLot As label:
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =ThemeInk3
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        Height: =16
                        Size: =8.25
                        Text: =$"{Coalesce(gvarCajeroLot.cajeroNombre, gvarLote.Cajero.'Full Name')} · generado {Text(gvarLote.'Created On', FmtFecha)}"
                        Width: =Parent.Width - 130
