                Height: =32
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =App.Theme.Colors.Darker10
                OnSelect: |-
                    =// El motivo viaja EN EL MISMO Patch que el estado. El guard lo exige asi a
                    // proposito: si se guardara aparte, un motivo viejo de una devolucion
                    // anterior alcanzaria para colar una devolucion nueva sin explicar nada.
                    UpdateContext({ctxDevolviendoLot: true, ctxPasoOkLot: false});
                    IfError(
                        Patch('CH-Tbl-TransactionBatches',
                            LookUp('CH-Tbl-TransactionBatches', TransactionBatches = gvarLote.TransactionBatches),
                            { BatchStatus: 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto,
                              'Motivo de la devolucion': inpMotivoDevLot.Text });
                        UpdateContext({ctxPasoOkLot: true}),
                        Notify("No se pudo devolver el lote: " & FirstError.Message, NotificationType.Error)
                    );
                    // El dialogo se cierra SOLO si la devolucion entro. Si el servidor la
                    // rechazo —segregacion de funciones, por ejemplo— el motivo escrito no
                    // se pierde y el usuario ve el error con el dialogo todavia abierto.
                    If(ctxPasoOkLot,
                        Set(gvarLote, LookUp('CH-Tbl-TransactionBatches',
                            TransactionBatches = gvarLote.TransactionBatches));
                        Reset(inpMotivoDevLot);
                        Notify("Lote marcado como Devuelto. Ya se le pueden sacar transacciones.", NotificationType.Success);
                        UpdateContext({ctxDlgDevolverLot: false})
                    );
                    UpdateContext({ctxDevolviendoLot: false})
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                Size: =10
                Text: ="Marcar Devuelto"
                Width: =130
                X: =Parent.Width - 20 - Self.Width
                Y: =Parent.Height - 20 - 32
