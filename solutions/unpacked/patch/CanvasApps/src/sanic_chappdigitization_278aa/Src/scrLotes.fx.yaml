            btnDlgSacarOkLot As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderStyle: =BorderStyle.None
                Color: =ThemeSurface
                DisabledBorderColor: =Color.Transparent
                DisabledColor: =ThemeInk3
                DisabledFill: =ThemeLineSoft
                DisplayMode: =If(ctxSacandoLot Or IsBlank(inpMotivoLot.Text), DisplayMode.Disabled, DisplayMode.Edit)
                Fill: =ThemeDanger
                FontWeight: =FontWeight.Semibold
                Height: =32
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =App.Theme.Colors.Darker10
                OnSelect: |-
                    =// DOS BUGS ARREGLADOS ACA, Y EL SEGUNDO ERA EL PELIGROSO.
                    //
                    // 1. SE MANDABA EL ID EQUIVOCADO. TransactionID es el numero VISIBLE
                    //    ("1068"; el grid lo muestra como T-0000001068), no la clave. El
                    //    Custom API espera un GUID, asi que la llamada moria en la puerta
                    //    con "Cannot convert the literal '1068' to the expected type
                    //    'Edm.Guid'" y la transaccion nunca salia del lote. La clave es
                    //    'CH-Tbl-Transactions', que es como se llama la PK en Power Fx.
                    //
                    // 2. AVISABA EN VERDE AUNQUE FALLARA. El primer argumento de IfError
                    //    era una CADENA: la llamada, y despues el Notify de exito. En una
                    //    cadena de comportamiento el error del primer paso NO corta lo que
                    //    sigue, y el valor de la cadena termina siendo el del ultimo paso
                    //    —el Notify, que no falla—. IfError veia "sin error", jamas corria
                    //    el fallback, y el usuario leia "Transaccion sacada del lote"
                    //    mientras la transaccion seguia adentro. Peor: el
                    //    Set(gvarTxLot, Blank()) tambien corria, borraba la seleccion y
                    //    dejaba la pantalla como si hubiera pasado algo.
                    //
                    //    Ahora IfError envuelve SOLO la llamada, el exito se marca con una
                    //    bandera DENTRO del camino feliz, y el aviso verde depende de esa
                    //    bandera. El aviso sale del resultado, no del orden de las lineas.
                    UpdateContext({ctxSacandoLot: true, ctxSacadoOkLot: false});
                    IfError(
                        With(
                            { r: Environment.sanic_CHRemoveFromCut({
                                TransactionId: gvarTxLot.'CH-Tbl-Transactions',
                                Motivo: inpMotivoLot.Text }) },
                            Set(gvarLote, Patch(gvarLote,
                                { TotalNIO: r.TotalNIO, TotalUSD: r.TotalUSD, TotalEUR: r.TotalEUR }));
                            UpdateContext({ctxSacadoOkLot: true})
                        ),
                        Notify("No se pudo sacar del lote: " & FirstError.Message, NotificationType.Error)
                    );
                    If(ctxSacadoOkLot,
                        Set(gvarTxLot, Blank());
                        Clear(colHistLot);
                        Select(btnActualizarLot);
                        Notify("Transacción sacada del lote y devuelta a Manual.", NotificationType.Success)
                    );
                    UpdateContext({ctxSacandoLot: false, ctxDlgSacarLot: false})
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                Size: =10
                Text: ="Sacar del lote"
                Width: =130
                X: =Parent.Width - 20 - Self.Width
                Y: =Parent.Height - 20 - 32
                ZIndex: =9

