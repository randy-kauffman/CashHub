    btnActualizarLot As button:
        BorderThickness: =0
        Color: =ThemeInk
        Fill: =Color.Transparent
        Height: =1
        HoverFill: =Color.Transparent
        OnSelect: |-
            =// LA carga de la pantalla, para poder repetirla sin salir y volver a entrar.
            Refresh('CH-Tbl-TransactionBatches');
            ClearCollect(colCajerosLot,
                Filter(
                    ForAll(
                        ParseJSON(Environment.sanic_CHWorkloadByCashier().Workload) As w,
                        {
                            cajero:          GUID(Text(w.cajero)),
                            cajeroNombre:    Text(w.cajeroNombre),
                            mesa:            Text(w.mesa),
                            lotesPorAplicar: Value(w.lotesPorAplicar),
                            badge:           Value(w.lotesPorAplicar)
                        }
                    ),
                    lotesPorAplicar > 0
                )
            );
            UpdateContext({ ctxUltimaActLot: Now() })
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =Color.Transparent
        TabIndex: =-1
        Text: =""
        Visible: =false
        Width: =1
        X: =2
        Y: =758
        ZIndex: =96

    tmrActualizarLot As timer:
        BorderThickness: =0
        Color: =ThemeInk
        Fill: =Color.Transparent
        Height: =1
        HoverFill: =Color.Transparent
        OnTimerEnd: |-
            =// Cada minuto, y NUNCA con una operacion en curso: refrescar debajo de
            // alguien que esta confirmando algo es la peor forma de ayudar.
            If(!ctxAplicandoLot && !ctxDescargandoLot && !ctxSacandoLot && !ctxDlgAplicadoLot && !ctxDlgSacarLot, Select(btnActualizarLot))
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =Color.Transparent
        Repeat: =true
        Start: =true
        TabIndex: =-1
        Text: =""
        Visible: =false
        Width: =1
        X: =6
        Y: =758
        ZIndex: =97


