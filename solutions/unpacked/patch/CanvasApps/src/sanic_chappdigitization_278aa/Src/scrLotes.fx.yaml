                                        });
                                        UpdateContext({ ctxDlTokenLot: Text(Now(), "[$-en-US]yyyymmddhhmmssfff") })
                                    )
                                ),
                                Notify("No se pudo descargar el CSV: " & FirstError.Message, NotificationType.Error)
                            );
                            UpdateContext({ctxDescargandoLot: false})
