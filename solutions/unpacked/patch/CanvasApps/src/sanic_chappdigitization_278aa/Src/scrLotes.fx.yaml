                        OnSelect: |-
                            =// EL AVISO SALE DEL RESULTADO, NO DEL ORDEN DE LAS LINEAS. Antes el Notify
                            // de exito vivia DENTRO del primer argumento de IfError, en la misma
                            // cadena que el Patch. En una cadena de comportamiento el error del
                            // primer paso NO corta lo que sigue, y el valor de la cadena termina
                            // siendo el del ultimo paso —el Notify, que no falla—: IfError veia
                            // "sin error", nunca corria el fallback, y el usuario leia que todo
                            // habia salido bien mientras el servidor lo habia rechazado.
                            //
                            // Ahora IfError envuelve SOLO la escritura, y el exito se marca con
                            // una bandera adentro del camino feliz.
                            UpdateContext({ctxPasoOkLot: false});
                            IfError(
                                Patch('CH-Tbl-TransactionBatches', LookUp('CH-Tbl-TransactionBatches',TransactionBatches = gvarLote.TransactionBatches ),
                                    { BatchStatus: 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado });
                                UpdateContext({ctxPasoOkLot: true}),
                                Notify("No se pudo marcar Ingresado: " & FirstError.Message, NotificationType.Error)
                            );
                            If(ctxPasoOkLot,
                                Set(gvarLote, LookUp('CH-Tbl-TransactionBatches',
                                    TransactionBatches = gvarLote.TransactionBatches));
                                Notify("Lote marcado como Ingresado.", NotificationType.Success)
                            )
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =App.Theme.Colors.Darker40
