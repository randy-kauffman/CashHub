                            // Download(".../sanic_csvcore/$value"), que es una navegacion del
                            // navegador: Power Fx no puede ponerle un header Authorization, asi
                            // que lo unico que la autenticaba era la cookie del org. Los usuarios
                            // de negocio no la tienen y recibian un 401 mudo, fuera del alcance
