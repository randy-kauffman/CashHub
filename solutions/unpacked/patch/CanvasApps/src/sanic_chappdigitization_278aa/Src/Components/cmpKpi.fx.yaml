cmpKpi As CanvasComponent:
    ChildTabPriority: =true
    ContentLanguage: =""
    EnableChildFocus: =true
    Etiqueta: ="Text"
    Fill: =RGBA(0, 0, 0, 0)
    Height: =640
    Valor: ="Text"
    Visible: =true
    Width: =640
    X: =0
    Y: =0

    cntFondoKpi As groupContainer.manualLayoutContainer:
        BorderColor: =ThemeLine
        BorderStyle: =BorderStyle.None
        BorderThickness: =1
        Fill: =ThemeSurface
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =11
        RadiusBottomRight: =11
        RadiusTopLeft: =11
        RadiusTopRight: =11
        Width: =Parent.Width
        ZIndex: =1

        lblValKpi As label:
            BorderColor: =App.Theme.Colors.Darker40
            Color: =RGBA(0, 0, 0, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            FontWeight: =FontWeight.Bold
            Height: =26
            Size: =16.5
            Text: =cmpKpi.Valor
            Width: =Parent.Width-30
            X: =15
            Y: =32
            ZIndex: =1

        lblLabKpi As label:
            BorderColor: =App.Theme.Colors.Darker40
            Color: =ThemeInk3
            DisabledColor: =RGBA(166, 166, 166, 1)
            FontWeight: =FontWeight.Bold
            Height: =14
            Size: =7.88
            Text: =Upper(cmpKpi.Etiqueta)
            Width: =Parent.Width-30
            X: =15
            Y: =10
            ZIndex: =2

