    cmpVacioMov As cmpEmpty:
        Glifo: ="⛁"
        Height: =galMovMov.Height
        Mensaje: |-
            =If(IsBlank(gvarCajeroMov),
                "Elegí un cajero del panel izquierdo para ver sus movimientos.",
                If(!IsEmpty(colDiasMov),
                   "Sin movimientos en esta fecha. Abajo están los días en que este cajero sí tuvo.",
                   "Este cajero no tiene movimientos registrados."))
        Visible: =IsEmpty(galMovMov.AllItems)
        Width: =galMovMov.Width
        X: =galMovMov.X
        Y: =galMovMov.Y
        ZIndex: =12

    galDiasMov As gallery.galleryVertical:
        DelayItemLoading: =true
        Height: =Min(CountRows(colDiasMov) * 30 + 24, 220)
        Items: =colDiasMov
        Layout: =Layout.Vertical
        ShowScrollbar: =true
        TemplateSize: =30
        Visible: |-
            =// EL VACIO TIENE QUE SER UN CARTEL, NO UN CALLEJON. Que la fecha elegida no
            // tenga nada es una respuesta legitima; dejar al operador probando fechas a mano
            // hasta dar con la buena, no.
            !IsBlank(gvarCajeroMov) && IsEmpty(colCuboMov) && !IsEmpty(colDiasMov)
        Width: =420
        X: =galMovMov.X + (galMovMov.Width - 420) / 2
        Y: =galMovMov.Y + galMovMov.Height / 2 + 24
        ZIndex: =16

        btnDiaMov As button:
            BorderColor: =ThemeLine
            BorderThickness: =1
            Color: =ThemeInk2
            Fill: =ThemeSurface
            FontWeight: =FontWeight.Semibold
            Height: =26
            HoverFill: =ThemeSurface2
            OnSelect: |-
                =UpdateContext({ctxDiaMov: ThisItem.fecha});
                Reset(dtpDiaMov);
                Select(btnCargarCuboMov)
            RadiusBottomLeft: =7
            RadiusBottomRight: =7
            RadiusTopLeft: =7
            RadiusTopRight: =7
            Size: =8.25
            Text: |-
                =// Concatenacion en vez de interpolacion: un $"..." con comillas anidadas
                // adentro de {} no resolvia y el boton salia VACIO — se veia una caja blanca
                // sin texto, que es justo lo que reporto el usuario.
                Text(ThisItem.fecha, "dd/mm/yyyy") & "   ·   " & Text(ThisItem.cantidad) & " transacciones"
            Width: =420
            X: =0
            ZIndex: =1

    btnRefrescarMov As button:
        BorderColor: =ThemeLine
        BorderThickness: =1
        Color: =ThemeInk2
        Fill: =ThemeSurface
        FontWeight: =FontWeight.Semibold
        Height: =32
        HoverFill: =ThemeSurface2
        OnSelect: |-
            =// Explicito y a mano, sin temporizador. Esta es una vista de auditoria, no una
            // lista de trabajo pendiente: refrescar sola una grilla de 5.000 filas mientras
            // el operador la esta recorriendo lo haria perder el lugar. El boton dice cuando
            // fue la ultima vez, que es lo que hace falta para saber si mirar de nuevo.
            Select(btnCargarCuboMov)
        RadiusBottomLeft: =7
        RadiusBottomRight: =7
        RadiusTopLeft: =7
        RadiusTopRight: =7
        Size: =9
        Text: |-
            =If(IsBlank(ctxUltimaActMov), "Actualizar",
                "Actualizar · " & Text(ctxUltimaActMov, "hh:mm"))
        Width: =150
        X: =btnHoyMov.X - 8 - Self.Width
        Y: =LayHeaderH + 16
        ZIndex: =15

    btnCargarCajerosMov As button:
        BorderThickness: =0
        Fill: =Color.Transparent
        Height: =1
        HoverFill: =Color.Transparent
        OnSelect: |-
            =// El rail sale del mismo API que las otras pantallas, pero SIN filtrar por
            // pendientes: aca se consulta el historico, y un cajero sin trabajo pendiente
            // igual tuvo movimientos ayer.
            ClearCollect(colCajerosMov,
                ForAll(
                    ParseJSON(Environment.sanic_CHWorkloadByCashier().Workload) As w,
                    {
                        cajero:       GUID(Text(w.cajero)),
                        cajeroNombre: Text(w.cajeroNombre)
                    }
                )
            )
        PressedFill: =Color.Transparent
        Text: =""
        Width: =1
        ZIndex: =13

    btnCargarCuboMov As button:
        BorderThickness: =0
        Fill: =Color.Transparent
        Height: =1
        HoverFill: =Color.Transparent
        OnSelect: |-
            =// Refresh primero, SIEMPRE: el cubo lo calcula el servidor y siempre viene
            // fresco, pero la tabla de abajo lee del datasource y sin esto se queda con lo
            // que habia en cache cuando se abrio la app.
            Refresh('CH-Tbl-Transactions');
            UpdateContext({ctxUltimaActMov: Now()});
            // El cubo: 12 filas como mucho, con TODO el dia agregado del lado del servidor.
            // De ahi salen el resumen grande y los contadores de los chips sin volver a
            // consultar cada vez que se toca uno. Sumar en el cliente toparia en 500 filas y
            // daria un resumen incompleto sin avisar.
            If(IsBlank(gvarCajeroMov),
                Clear(colCuboMov),
                UpdateContext({ctxCargandoMov: true});
                IfError(
                    With(
                        { r: Environment.sanic_CHCashierDay({
                            CajeroId: gvarCajeroMov.cajero,
                            Desde: ctxDiaMov,
                            Hasta: DateAdd(ctxDiaMov, 1, TimeUnit.Days) }) },
                        ClearCollect(colCuboMov,
                            ForAll(ParseJSON(r.Cube) As c,
                                {
                                    moneda:      Text(c.moneda),
                                    tipo:        Text(c.tipo),
                                    via:         Text(c.via),
                                    signo:       Value(c.signo),
                                    efectivo:    Value(c.efectivo),
                                    chequeBac:   Value(c.chequeBac),
                                    chequeOtros: Value(c.chequeOtros),
                                    total:       Value(c.total),
                                    cantidad:    Value(c.cantidad)
                                }));
                        ClearCollect(colDiasMov,
                            ForAll(ParseJSON(r.Days) As x,
                                { fecha: DateValue(Text(x.fecha)), cantidad: Value(x.cantidad) }))
                    ),
                    Clear(colCuboMov);
                    Notify("No se pudo cargar el resumen del cajero: " & FirstError.Message, NotificationType.Error)
                );
                UpdateContext({ctxCargandoMov: false})
            )
        PressedFill: =Color.Transparent
        Text: =""
        Width: =1
        ZIndex: =14

