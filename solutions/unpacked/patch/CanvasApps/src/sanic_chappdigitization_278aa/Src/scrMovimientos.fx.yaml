            FontWeight: =FontWeight.Semibold
            Height: =30
            HoverColor: =If(ThisItem.clave = ctxFiltroMov, ThemeSurface, ThemeInk)
            HoverFill: =If(ThisItem.clave = ctxFiltroMov, ThemeInk, ThemeSurface2)
            OnSelect: |-
                =UpdateContext({ctxFiltroMov: ThisItem.clave})
            RadiusBottomLeft: =15
            RadiusBottomRight: =15
            RadiusTopLeft: =15
            RadiusTopRight: =15
            Size: =8.25
            Text: =ThisItem.texto & "  " & Text(ThisItem.cant)
            Width: =128
            ZIndex: =1

