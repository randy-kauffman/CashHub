Screens:
  scrLotes:
    Properties:
      Fill: =ThemeBg
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(gvarTxLot, Blank());
        UpdateContext({
            ctxFiltroEstadoLot: "Por aplicar",
            ctxDesdeFechaLot: DateValue("1900-01-01"),
            ctxDescargandoLot: false,
            ctxAplicandoLot: false,
            ctxSacandoLot: false,
            ctxDlgAplicadoLot: false,
            ctxDlgSacarLot: false
        });
        Reset(tabFechaLot);
        Reset(inpBuscarLot);
        ClearCollect(colCajerosLot,
            Filter(
                ForAll(
                    ParseJSON(Environment.sanic_CHWorkloadByCashier().Workload) As w,
                    {
                        cajero:          GUID(Text(w.cajero)),
                        cajeroNombre:    Text(w.cajeroNombre),
                        mesa:            Text(w.mesa),
                        lotesPorAplicar: Value(w.lotesPorAplicar),
                        badge:           Value(w.lotesPorAplicar)
                    }
                ),
                lotesPorAplicar > 0
            )
        );
        Set(gvarCajeroLot, First(colCajerosLot));
        Set(gvarLote, First(
            SortByColumns(
                Filter('CH-Tbl-TransactionBatches',
                    Cajero.User = gvarCajeroLot.cajero,
                    ( ctxFiltroEstadoLot = "Todos" )
                    || ( ctxFiltroEstadoLot = "Aplicados"
                         && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                    || ( ctxFiltroEstadoLot = "Por aplicar"
                         && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                    ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                    ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                ),
                "createdon", SortOrder.Descending
            )
        ))
    Children:
      - cmpHeaderLot:
          Control: CanvasComponent
          ComponentName: cmpHeader
          Properties:
            Activo: ="Lotes"
            Height: =LayHeaderH
            OnCheques: =Navigate(scrCheques, ScreenTransition.None)
            OnCorte: =Navigate(scrCorte, ScreenTransition.None)
            OnLotes: =Navigate(scrLotes, ScreenTransition.None)
            OnManual: =Navigate(scrManual, ScreenTransition.None)
            Subtitulo: ="Lotes"
            Titulo: ="Digitación"
            Width: =Parent.Width
      - cntBodyLot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - LayHeaderH
            Width: =Parent.Width
            Y: =LayHeaderH
          Children:
            - cmpRailLot:
                Control: CanvasComponent
                ComponentName: cmpRailCajeros
                Properties:
                  Datos: =AddColumns(DropColumns(colCajerosLot, lotesPorAplicar), pendientesCorte, 0, totalNio, 0, totalUsd, 0, totalEur, 0)
                  Height: =Parent.Height
                  OnSeleccion: |-
                    =Set(gvarCajeroLot, cmpRailLot.CajeroSel);
                    Set(gvarTxLot, Blank());
                    Set(gvarLote, First(
                        SortByColumns(
                            Filter('CH-Tbl-TransactionBatches',
                                Cajero.User = gvarCajeroLot.cajero,
                                ( ctxFiltroEstadoLot = "Todos" )
                                || ( ctxFiltroEstadoLot = "Aplicados"
                                     && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                || ( ctxFiltroEstadoLot = "Por aplicar"
                                     && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                          || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                          || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                            ),
                            "createdon", SortOrder.Descending
                        )
                    ))
                  Titulo: ="CAJEROS CON LOTES"
                  Width: =LayRailW
            - cntMainLo:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =Color.Transparent
                  Height: =Parent.Height
                  Width: =Parent.Width - LayRailW
                  X: =LayRailW
                Children:
                  - cntListaCardLot:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =Parent.Height - 2*LayGutter
                        RadiusBottomLeft: =LayCardR
                        RadiusBottomRight: =LayCardR
                        RadiusTopLeft: =LayCardR
                        RadiusTopRight: =LayCardR
                        Width: =(Parent.Width - 2*LayGutter - LayGap) * 0.385
                        X: =LayGutter
                        Y: =LayGutter
                      Children:
                        - cntSegEstadoLo:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =1
                              Fill: =ThemeSurface2
                              Height: =34
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =10
                            Children:
                              - btnSegPorAplicarLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(ctxFiltroEstadoLot = "Por aplicar", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxFiltroEstadoLot = "Por aplicar", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxFiltroEstadoLot = "Por aplicar", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxFiltroEstadoLot: "Por aplicar"});
                                      Set(gvarTxLot, Blank());
                                      Set(gvarLote, First(
                                          SortByColumns(
                                              Filter('CH-Tbl-TransactionBatches',
                                                  Cajero.User = gvarCajeroLot.cajero,
                                                  ( ctxFiltroEstadoLot = "Todos" )
                                                  || ( ctxFiltroEstadoLot = "Aplicados"
                                                       && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                                  || ( ctxFiltroEstadoLot = "Por aplicar"
                                                       && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                                  ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                                  ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                              ),
                                              "createdon", SortOrder.Descending
                                          )
                                      ))
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Text: ="Por aplicar"
                                    Width: =(Parent.Width - 6) / 3
                                    X: =3
                                    Y: =3
                              - btnSegAplicadosLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(ctxFiltroEstadoLot = "Aplicados", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxFiltroEstadoLot = "Aplicados", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxFiltroEstadoLot = "Aplicados", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxFiltroEstadoLot: "Aplicados"});
                                      Set(gvarTxLot, Blank());
                                      Set(gvarLote, First(
                                          SortByColumns(
                                              Filter('CH-Tbl-TransactionBatches',
                                                  Cajero.User = gvarCajeroLot.cajero,
                                                  ( ctxFiltroEstadoLot = "Todos" )
                                                  || ( ctxFiltroEstadoLot = "Aplicados"
                                                       && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                                  || ( ctxFiltroEstadoLot = "Por aplicar"
                                                       && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                                  ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                                  ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                              ),
                                              "createdon", SortOrder.Descending
                                          )
                                      ))
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Text: ="Aplicados"
                                    Width: =(Parent.Width - 6) / 3
                                    X: =btnSegPorAplicarLot.X + btnSegPorAplicarLot.Width
                                    Y: =3
                              - btnSegTodosLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(ctxFiltroEstadoLot = "Todos", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxFiltroEstadoLot = "Todos", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxFiltroEstadoLot = "Todos", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxFiltroEstadoLot: "Todos"});
                                      Set(gvarTxLot, Blank());
                                      Set(gvarLote, First(
                                          SortByColumns(
                                              Filter('CH-Tbl-TransactionBatches',
                                                  Cajero.User = gvarCajeroLot.cajero,
                                                  ( ctxFiltroEstadoLot = "Todos" )
                                                  || ( ctxFiltroEstadoLot = "Aplicados"
                                                       && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                                  || ( ctxFiltroEstadoLot = "Por aplicar"
                                                       && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                                  ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                                  ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                              ),
                                              "createdon", SortOrder.Descending
                                          )
                                      ))
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Text: ="Todos"
                                    Width: =(Parent.Width - 6) / 3
                                    X: =btnSegAplicadosLot.X + btnSegAplicadosLot.Width
                                    Y: =3
                        - inpBuscarLot:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =ThemeLine
                              Default: =
                              DelayOutput: =true
                              Font: =Font.'Open Sans'
                              Height: =32
                              HintText: ="⌕ N° de lote…"
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =cntSegEstadoLo.Y + cntSegEstadoLo.Height + 10
                        - tabFechaLot:
                            Control: ModernTabList@1.0.1
                            Properties:
                              Font: =Font.'Open Sans'
                              Height: =30
                              Items: =Table({Value:"Cualquier fecha"},{Value:"Hoy"},{Value:"Últimos 7 días"},{Value:"Este mes"})
                              OnChange: |-
                                =UpdateContext({ctxDesdeFechaLot:
                                    Switch(tabFechaLot.Selected.Value,
                                        "Hoy", Today(),
                                        "Últimos 7 días", DateAdd(Today(), -7, TimeUnit.Days),
                                        "Este mes", Date(Year(Today()), Month(Today()), 1),
                                        DateValue("1900-01-01"))});
                                Set(gvarTxLot, Blank());
                                Set(gvarLote, First(
                                    SortByColumns(
                                        Filter('CH-Tbl-TransactionBatches',
                                            Cajero.User = gvarCajeroLot.cajero,
                                            ( ctxFiltroEstadoLot = "Todos" )
                                            || ( ctxFiltroEstadoLot = "Aplicados"
                                                 && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                            || ( ctxFiltroEstadoLot = "Por aplicar"
                                                 && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                            ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                            ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                        ),
                                        "createdon", SortOrder.Descending
                                    )
                                ))
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =inpBuscarLot.Y + inpBuscarLot.Height + 8
                        - lblListaSubLot:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk3
                              Fill: =ThemeSurface2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              PaddingLeft: =12
                              Size: =7.88
                              Text: =$"Lotes de {Coalesce(gvarCajeroLot.cajeroNombre, "—")}"
                              Width: =Parent.Width
                              Y: =tabFechaLot.Y + tabFechaLot.Height + 10
                        - galLotesLot:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Parent.Height - Self.Y - 8
                              Items: |-
                                =SortByColumns(
                                    Filter('CH-Tbl-TransactionBatches',
                                        Cajero.User = gvarCajeroLot.cajero,
                                        ( ctxFiltroEstadoLot = "Todos" )
                                        || ( ctxFiltroEstadoLot = "Aplicados"
                                             && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                        || ( ctxFiltroEstadoLot = "Por aplicar"
                                             && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                        ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                        ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                    ),
                                    "createdon", SortOrder.Descending
                                )
                              OnSelect: |-
                                =Set(gvarLote, ThisItem);
                                Set(gvarTxLot, Blank())
                              TemplateSize: =52
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =lblListaSubLot.Y + lblListaSubLot.Height
                            Children:
                              - shpLoteSelLot:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =If(ThisItem.TransactionBatches = gvarLote.TransactionBatches, ThemeAccentSoft, Color.Transparent)
                                    Height: =52
                                    Width: =Parent.TemplateWidth
                              - shpLoteSelBarraLot:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeAccent
                                    Height: =52
                                    Visible: =ThisItem.TransactionBatches = gvarLote.TransactionBatches
                                    Width: =3
                              - btnLoteFilaLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Fill: =Color.Transparent
                                    Height: =52
                                    HoverFill: =Color.Transparent
                                    OnSelect: =Select(Parent)
                                    PressedFill: =Color.Transparent
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                              - lblLoteNombreLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Text: =ThisItem.Name
                                    Width: =Parent.TemplateWidth - 110
                                    X: =13
                                    Y: =8
                              - lblLoteMetaLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =ThemeInk3
                                    Font: =Font.'Open Sans'
                                    Height: =16
                                    OnSelect: =Select(Parent)
                                    Text: =Text(ThisItem.'Created On', FmtFecha)
                                    Width: =Parent.TemplateWidth - 110
                                    X: =13
                                    Y: =30
                              - pilLoteEstadoLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: |-
                                      =Switch(ThisItem.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, ThemeWarn,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  ThemeOk, ThemeInfo)
                                    DisplayMode: =DisplayMode.View
                                    Fill: |-
                                      =Switch(ThisItem.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, ThemeWarnSoft,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  ThemeOkSoft, ThemeInfoSoft)
                                    Font: =Font.'Open Sans'
                                    Height: =22
                                    OnSelect: =Select(Parent)
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =7.88
                                    Text: |-
                                      =Switch(ThisItem.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Generado,  "Generado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, "Ingresado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado,  "Aprobado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  "Aplicado", "—")
                                    Width: =84
                                    X: =Parent.TemplateWidth - 96
                                    Y: =15
                        - cmpEmptyListaLot:
                            Control: CanvasComponent
                            ComponentName: cmpEmpty
                            Properties:
                              Glifo: ="⛁"
                              Height: =galLotesLot.Height
                              Mensaje: ="Sin lotes para este filtro."
                              Visible: |-
                                =IsEmpty(
                                    SortByColumns(
                                        Filter('CH-Tbl-TransactionBatches',
                                            Cajero.User = gvarCajeroLot.cajero,
                                            ( ctxFiltroEstadoLot = "Todos" )
                                            || ( ctxFiltroEstadoLot = "Aplicados"
                                                 && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                            || ( ctxFiltroEstadoLot = "Por aplicar"
                                                 && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                            ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                            ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                        ),
                                        "createdon", SortOrder.Descending
                                    )
                                )
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =galLotesLot.Y
                  - cntDetalleCardLot:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =Parent.Height - 2*LayGutter
                        RadiusBottomLeft: =LayCardR
                        RadiusBottomRight: =LayCardR
                        RadiusTopLeft: =LayCardR
                        RadiusTopRight: =LayCardR
                        Width: =Parent.Width - LayGutter - Self.X
                        X: =cntListaCardLot.X + cntListaCardLot.Width + LayGap
                        Y: =LayGutter
                      Children:
                        - cntDetHeadLot:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Color.Transparent
                              Height: =54
                              Visible: =!IsBlank(gvarLote)
                              Width: =Parent.Width
                            Children:
                              - lblDetTituloLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    Size: =12
                                    Text: =$"Lote {gvarLote.Name}"
                                    Width: =Parent.Width - 130
                                    X: =16
                                    Y: =8
                              - lblDetSubLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =ThemeInk3
                                    Font: =Font.'Open Sans'
                                    Height: =16
                                    Size: =8.25
                                    Text: =$"{Coalesce(gvarCajeroLot.cajeroNombre, gvarLote.Cajero.'Full Name')} · generado {Text(gvarLote.'Created On', FmtFecha)}"
                                    Width: =Parent.Width - 130
                                    X: =16
                                    Y: =30
                              - cmpPilDetEstadoLot:
                                  Control: CanvasComponent
                                  ComponentName: cmpPildora
                                  Properties:
                                    Height: =22
                                    Texto: |-
                                      =Switch(gvarLote.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Generado,  "Generado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, "Ingresado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado,  "Aprobado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  "Aplicado", "—")
                                    Tono: |-
                                      =Switch(gvarLote.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, "warn",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  "ok", "info")
                                    Width: =84
                                    X: =Parent.Width - 16 - Self.Width
                                    Y: =16
                              - shpDetHeadLineaLot:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeLine
                                    Height: =1
                                    Width: =Parent.Width
                                    Y: =Parent.Height - 1
                        - cntOpsLot:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Color.Transparent
                              Height: =48
                              Visible: =!IsBlank(gvarLote)
                              Width: =Parent.Width
                              Y: =cntDetHeadLot.Y + cntDetHeadLot.Height
                            Children:
                              - btnMarcarIngresadoLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeAccent
                                    BorderThickness: =1
                                    Color: =ThemeAccent
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =32
                                    HoverFill: =ThemeAccentSoft
                                    OnSelect: |-
                                      =IfError(
                                          Patch('CH-Tbl-TransactionBatches', LookUp('CH-Tbl-TransactionBatches',TransactionBatches = gvarLote.TransactionBatches ),
                                              { BatchStatus: 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado });
                                          Set(gvarLote, LookUp('CH-Tbl-TransactionBatches',
                                              TransactionBatches = gvarLote.TransactionBatches));
                                          Notify("Lote marcado como Ingresado.", NotificationType.Success),
                                          Notify("No se pudo marcar Ingresado: " & FirstError.Message, NotificationType.Error)
                                      )
                                    Size: =10
                                    Text: ="Marcar como Ingresado"
                                    Visible: =gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                    Width: =176
                                    X: =16
