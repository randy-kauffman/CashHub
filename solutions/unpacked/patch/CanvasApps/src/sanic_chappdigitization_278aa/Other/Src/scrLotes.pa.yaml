Screens:
  scrLotes:
    Properties:
      Fill: =ThemeBg
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =Set(gvarTxLot, Blank());
        UpdateContext({
            ctxFiltroEstadoLot: "Por aplicar",
            ctxDesdeFechaLot: DateValue("1900-01-01"),
            ctxDescargandoLot: false,
            ctxAplicandoLot: false,
            ctxSacandoLot: false,
            ctxDlgAplicadoLot: false,
            ctxDlgSacarLot: false
        });
        Reset(tabFechaLot);
        Reset(inpBuscarLot);
        Select(btnActualizarLot);
        Set(gvarCajeroLot, First(colCajerosLot));
        Set(gvarLote, First(
            SortByColumns(
                Filter('CH-Tbl-TransactionBatches',
                    Cajero.User = gvarCajeroLot.cajero,
                    ( ctxFiltroEstadoLot = "Todos" )
                    || ( ctxFiltroEstadoLot = "Aplicados"
                         && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                    || ( ctxFiltroEstadoLot = "Por aplicar"
                         && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                              || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                    ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                    ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                ),
                "createdon", SortOrder.Descending
            )
        ))
    Children:
      - cmpHeaderLot:
          Control: CanvasComponent
          ComponentName: cmpHeader
          Properties:
            Activo: ="Lotes"
            Height: =LayHeaderH
            OnCheques: =Navigate(scrCheques, ScreenTransition.None)
            OnCorte: =Navigate(scrCorte, ScreenTransition.None)
            OnLotes: =Navigate(scrLotes, ScreenTransition.None)
            OnManual: =Navigate(scrManual, ScreenTransition.None)
            Subtitulo: ="Lotes"
            Titulo: ="Digitación"
            Width: =Parent.Width
      - cntBodyLot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - LayHeaderH
            Width: =Parent.Width
            Y: =LayHeaderH
      - cmpDlgAplicadoLot:
          Control: CanvasComponent
          ComponentName: cmpDialogo
          Properties:
            AnchoCard: =420
            Height: =Parent.Height
            Mostrar: =ctxDlgAplicadoLot
            OkHabilitado: =!ctxAplicandoLot
            OnCancelar: |-
              =UpdateContext({ctxDlgAplicadoLot: false})
            OnOk: |-
              =UpdateContext({ctxAplicandoLot: true});
              IfError(
                  Patch('CH-Tbl-TransactionBatches', LookUp('CH-Tbl-TransactionBatches', TransactionBatches = gvarLote.TransactionBatches) ,
                      { BatchStatus: 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado });
                  Set(gvarLote, LookUp('CH-Tbl-TransactionBatches',
                      TransactionBatches = gvarLote.TransactionBatches));
                  Notify("Lote aplicado.", NotificationType.Success),
                  Notify("No se pudo aplicar: " & FirstError.Message, NotificationType.Error)
              );
              UpdateContext({ctxAplicandoLot: false, ctxDlgAplicadoLot: false})
            Texto: ="El lote pasa a Aplicado (ya ingresado al core). El servidor registra quién y cuándo. Esta acción cierra el ciclo del lote."
            TextoCancelar: ="Cancelar"
            TextoOk: ="Sí, marcar Aplicado"
            Titulo: =$"¿Marcar el lote {gvarLote.Name} como Aplicado?"
            Tono: ="ok"
            Visible: =ctxDlgAplicadoLot
            Width: =Parent.Width
      - cntDlgSacarLot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =ThemeOverlay
            Height: =Parent.Height
            Visible: =ctxDlgSacarLot
            Width: =Parent.Width
          Children:
            - btnDlgSacarBloqueoLot:
                Control: Classic/Button@2.2.0
                Properties:
                  Fill: =Color.Transparent
                  Height: =Parent.Height
                  HoverFill: =Color.Transparent
                  PressedFill: =Color.Transparent
                  Text: =""
                  Width: =Parent.Width
            - cntDlgSacarCardLot:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.Regular
                  Fill: =ThemeSurface
                  Height: =362
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  Width: =440
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - shpDlgSacarIcoLot:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ThemeDangerSoft
                        Height: =34
                        Width: =34
                        X: =20
                        Y: =20
                  - lblDlgSacarTitLot:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        Size: =10.88
                        Text: =$"¿Sacar {gvarTxLot.Name} del lote {gvarLote.Name}?"
                        Width: =Parent.Width - Self.X - 44
                        X: =shpDlgSacarIcoLot.X + shpDlgSacarIcoLot.Width + 10
                        Y: =20
                  - lblDlgSacarTxtLot:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        Text: =$"La transacción ({Switch(Text(gvarTxLot.Currency), "NIO", SimboloNIO, "USD", SimboloUSD, "EUR", SimboloEUR, Text(gvarTxLot.Currency))} {Text(gvarTxLot.Total, FmtMoney)} · {Coalesce(gvarTxLot.RelatedDepositRecounting.Name, "—")}) se desasigna del lote y vuelve al circuito manual. Los totales del lote se recalculan."
                        Width: =Parent.Width - Self.X - 20
                        X: =lblDlgSacarTitLot.X
                        Y: =lblDlgSacarTitLot.Y + 24
                  - icoDlgSacarXLot:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Cancelar"
                        Color: =ThemeInk3
                        Height: =18
                        HoverColor: =ThemeInk
                        Icon: =Icon.Cancel
                        OnSelect: |-
                          =UpdateContext({ctxDlgSacarLot: false})
                        Width: =18
                        X: =Parent.Width - 20 - 18
                        Y: =20
                  - lblDlgSacarMotivoLabLot:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =16
                        Size: =8.25
                        Text: ="Motivo del rechazo del core"
                        Width: =Parent.Width - 2*20
                        X: =20
                        Y: =116
                  - inpMotivoLot:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ThemeLine
                        Default: =
                        Fill: =ThemeSurface
                        Font: =Font.'Open Sans'
                        Height: =64
                        HintText: |-
                          ="Ej: cuenta inexistente en IBS Branch, moneda no habilitada…"
                        Mode: =TextMode.MultiLine
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Width: =Parent.Width - 2*20
                        X: =20
                        Y: =136
                  - cntDlgSacarBannerLot:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =ThemeWarnSoft
                        Height: =52
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Width: =Parent.Width - 2*20
                        X: =20
                        Y: =208
                      Children:
                        - lblDlgSacarBannerLot:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =ThemeWarn
                              Font: =Font.'Open Sans'
                              Height: =36
                              Size: =8.25
                              Text: ="El motivo queda registrado en la transacción para auditoría (se ve luego en su historial). Fuera del lote, la transacción no vuelve sola a un corte automático."
                              Width: =Parent.Width - 26
                              X: =13
                              Y: =8
                  - btnDlgSacarCancelLot:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Color: =ThemeInk2
                        Fill: =Color.Transparent
                        Font: =Font.'Open Sans'
                        Height: =32
                        HoverFill: =ThemeSurface2
                        OnSelect: |-
                          =UpdateContext({ctxDlgSacarLot: false})
                        Size: =10
                        Text: ="Cancelar"
                        Width: =96
                        X: =btnDlgSacarOkLot.X - 10 - Self.Width
                        Y: =btnDlgSacarOkLot.Y
                  - btnDlgSacarOkLot:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =ThemeSurface
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        DisplayMode: =If(ctxSacandoLot Or IsBlank(inpMotivoLot.Text), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =ThemeDanger
                        Font: =Font.'Open Sans'
                        Height: =32
                        OnSelect: |-
                          =UpdateContext({ctxSacandoLot: true});
                          IfError(
                              With(
                                  { r: Environment.sanic_CHRemoveFromCut({ TransactionId: gvarTxLot.TransactionID, Motivo: inpMotivoLot.Text }) },
                                  Set(gvarLote, Patch(gvarLote,
                                      { TotalNIO: r.TotalNIO, TotalUSD: r.TotalUSD, TotalEUR: r.TotalEUR }))
                              );
                              Set(gvarTxLot, Blank());
                              Clear(colHistLot);
                              Notify("Transacción sacada del lote y devuelta a Manual.", NotificationType.Success),
                              Notify("No se pudo sacar del lote: " & FirstError.Message, NotificationType.Error)
                          );
                          UpdateContext({ctxSacandoLot: false, ctxDlgSacarLot: false})
                        Size: =10
                        Text: ="Sacar del lote"
                        Width: =130
                        X: =Parent.Width - 20 - Self.Width
                        Y: =Parent.Height - 20 - 32
      - btnActualizarLot:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =ThemeInk
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Normal
            Height: =1
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Color.Transparent
            OnSelect: |-
              =// LA carga de la pantalla, para poder repetirla sin salir y volver a entrar.
              Refresh('CH-Tbl-TransactionBatches');
              ClearCollect(colCajerosLot,
                  Filter(
                      ForAll(
                          ParseJSON(Environment.sanic_CHWorkloadByCashier().Workload) As w,
                          {
                              cajero:          GUID(Text(w.cajero)),
                              cajeroNombre:    Text(w.cajeroNombre),
                              mesa:            Text(w.mesa),
                              lotesPorAplicar: Value(w.lotesPorAplicar),
                              badge:           Value(w.lotesPorAplicar)
                          }
                      ),
                      lotesPorAplicar > 0
                  )
              );
              UpdateContext({ ctxUltimaActLot: Now() })
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.Transparent
            Size: =13
            TabIndex: =-1
            Text: =""
            Visible: =false
            Width: =1
            X: =2
            Y: =758
      - tmrActualizarLot:
          Control: Timer@2.1.0
          Properties:
            Align: =%Align.RESERVED%.Center
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =%BorderStyle.RESERVED%.Solid
            BorderThickness: =0
            Color: =ThemeInk
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            DisplayMode: =%DisplayMode.RESERVED%.Edit
            Fill: =Color.Transparent
            Font: =%Font.RESERVED%.'Open Sans'
            FontWeight: =%FontWeight.RESERVED%.Normal
            Height: =1
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Color.Transparent
            OnTimerEnd: |-
              =// Cada minuto, y NUNCA con una operacion en curso: refrescar debajo de
              // alguien que esta confirmando algo es la peor forma de ayudar.
              If(!ctxAplicandoLot && !ctxDescargandoLot && !ctxSacandoLot && !ctxDlgAplicadoLot && !ctxDlgSacarLot, Select(btnActualizarLot))
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.Transparent
            Repeat: =true
            Start: =true
            TabIndex: =-1
            Text: =""
            VerticalAlign: =%VerticalAlign.RESERVED%.Middle
            Visible: =false
            Width: =1
            X: =6
            Y: =758
