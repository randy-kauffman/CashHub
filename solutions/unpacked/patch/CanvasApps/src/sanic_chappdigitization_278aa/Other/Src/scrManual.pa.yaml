Screens:
  scrManual:
    Properties:
      Fill: =ThemeBg
      OnVisible: |-
        =UpdateContext({
            ctxSegManual: "Pendientes",
            ctxOrdenMan: "Fecha",
            ctxErrorMan: Blank()
        });
        Select(btnCargarMan);
        Set(gvarCajeroMan, cmpRailMan.CajeroSel);
        Set(
            gvarTxMan,
            First(
                Sort(
                Filter(
                    'CH-Tbl-Transactions',
                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                        && BatchStatus = Blank()
                        && TransactionStatus = Blank()
                        && Cajero.User = gvarCajeroMan.cajero
                ),
                'Created On', SortOrder.Ascending
            )
            )
        );
        Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan);
        Reset(inpCampoMontoMan);  Reset(inpCampoRefMan);
        SetFocus(inpCampoCuentaMan);
        Environment.sanic_CHWorkloadByCashier().Workload
    Children:
      - cmpHeaderMan:
          Control: CanvasComponent
          ComponentName: cmpHeader
          Properties:
            Activo: ="Manual"
            Height: =LayHeaderH
            OnCheques: =Navigate(scrCheques)
            OnCorte: =Navigate(scrCorte)
            OnLotes: =Navigate(scrLotes)
            OnManual: =false
            Subtitulo: ="Aplicación manual"
            Titulo: ="Digitación"
            Width: =Parent.Width
      - cntBodyMan:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - LayHeaderH
            Width: =Parent.Width
            Y: =LayHeaderH
      - btnCargarMan:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =ThemeInk
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Normal
            Height: =1
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Color.Transparent
            OnSelect: |-
              =// LA carga de la pantalla. Vivia dentro de OnVisible y por eso la unica forma de
              // refrescar era salir y volver a entrar.
              Refresh('CH-Tbl-Transactions');
              ClearCollect(
                  colCajerosMan,
                  Filter(
                      ForAll(
                          Table(ParseJSON(Environment.sanic_CHWorkloadByCashier().Workload)),
                          {
                              cajero:           GUID(Text(ThisRecord.Value.cajero)),
                              cajeroNombre:     Text(ThisRecord.Value.cajeroNombre),
                              mesa:             Text(ThisRecord.Value.mesa),
                              pendientesManual: Value(ThisRecord.Value.pendientesManual),
                              badge:            Text(Value(ThisRecord.Value.pendientesManual))
                          }
                      ),
                      pendientesManual > 0
                  )
              );
              UpdateContext({ ctxUltimaActMan: Now() })
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.Transparent
            Size: =13
            TabIndex: =-1
            Text: =""
            Visible: =false
            Width: =1
            X: =2
            Y: =758
      - tmrActualizarMan:
          Control: Timer@2.1.0
          Properties:
            Align: =%Align.RESERVED%.Center
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =%BorderStyle.RESERVED%.Solid
            BorderThickness: =0
            Color: =ThemeInk
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            DisplayMode: =%DisplayMode.RESERVED%.Edit
            Fill: =Color.Transparent
            Font: =%Font.RESERVED%.'Open Sans'
            FontWeight: =%FontWeight.RESERVED%.Normal
            Height: =1
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Color.Transparent
            OnTimerEnd: |-
              =// Cada minuto, y NUNCA con una operacion en curso: refrescar debajo de
              // alguien que esta confirmando algo es la peor forma de ayudar.
              If(true, Select(btnCargarMan))
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.Transparent
            Repeat: =true
            Start: =true
            TabIndex: =-1
            Text: =""
            VerticalAlign: =%VerticalAlign.RESERVED%.Middle
            Visible: =false
            Width: =1
            X: =6
            Y: =758
