                            Properties:
                              BorderThickness: =0
                              Color: =ThemeInk
                              Fill: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Segoe UI'
                              Height: =44
                              HoverColor: =ThemeInk
                              HoverFill: =ThemeSurface2
                              OnSelect: =Select(Parent)
                              PressedFill: =ThemeAccentSoft
                              Size: =10
                              Text: =""
                              Width: =galChequesChq.Width
                        - icoCheckChq:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: ="Seleccionar cheque " & ThisItem.CheckNumber
                              Color: =If(!IsBlank(LookUp(colSelChq, 'CH-Tbl-Checks' = ThisItem.'CH-Tbl-Checks')), ThemeAccent, ThemeLineStrong)
                              DisabledColor: =ThemeLine
                              DisplayMode: =If(ThisItem.CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =20
                              Icon: =If(ThisItem.CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado, Icon.CheckBadge, Icon.Blocked)
                              OnSelect: |-
                                =// icoCheckChq.OnSelect — el guard de selección deja de ser cosmético:
                                // sólo Recontado entra a colSelChq (CheckGuard rechazaría cualquier otro).
                                If( ThisItem.CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado,
                                    If( !IsBlank(LookUp(colSelChq, 'CH-Tbl-Checks' = ThisItem.'CH-Tbl-Checks')),
                                        RemoveIf(colSelChq, 'CH-Tbl-Checks' = ThisItem.'CH-Tbl-Checks'),
                                        Collect(colSelChq, ThisItem) ) )
                              Width: =20
                              X: =7
                              Y: =12
                        - lblCelNumeroChq:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeAccent
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9
                              Text: =ThisItem.CheckNumber
                              Width: =galChequesChq.Width * 0.14
                              X: =34
                              Y: =12
                        - lblCelClienteChq:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk
                              Font: =Font.'Segoe UI'
                              Height: =20
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9.5
                              Text: |-
                                =IfError(
                                    Coalesce(ThisItem.Bag.ReceptionID.RemitentClient.Name, ThisItem.Bag.ReceptionID.RemitentName, "—"),
                                    Coalesce(ThisItem.Bag.ReceptionID.RemitentName, "—")
                                )
                              Visible: =scrCheques.Width >= 1100
                              Width: =galChequesChq.Width * 0.24
                              X: =34 + galChequesChq.Width * 0.14
                              Y: =12
                        - lblCelTulaChq:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Segoe UI'
                              Height: =20
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9.5
                              Text: =Coalesce(ThisItem.Bag.BagID, "—")
                              Width: =galChequesChq.Width * 0.10
                              Wrap: =false
                              X: =34 + galChequesChq.Width * 0.38
                              Y: =12
                        - lblCelMontoChq:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ThemeInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9.5
                              Text: |-
                                =Switch(ThisItem.CheckCurrency,
                                    'CH-Ch-Currency'.NIO, SimboloNIO,
                                    'CH-Ch-Currency'.USD, SimboloUSD,
                                    'CH-Ch-Currency'.EUR, SimboloEUR,
                                    ""
                                ) & " " & Text(ThisItem.CheckAmount, FmtMoney)
                              Width: =galChequesChq.Width * 0.16 - 16
                              X: =34 + galChequesChq.Width * 0.48
                              Y: =12
                        - pilCelEstadoChq:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =If(Self.Fill = ThemeSunk, 1, 0)
                              Color: |-
                                =Switch(ThisItem.CheckStatus,
                                    'CheckStatus (CH-Tbl-Checks)'.Recontado,               ThemePos,
                                    'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion',  ThemeAccent,
                                    'CheckStatus (CH-Tbl-Checks)'.'No Recibido',           ThemeNeg,
                                    'CheckStatus (CH-Tbl-Checks)'.Recibido,                ThemeAccentInk,
                                    'CheckStatus (CH-Tbl-Checks)'.Rebotado,                ThemeDanger,
                                    ThemeInk3)
                              DisplayMode: =DisplayMode.View
                              Fill: |-
                                =Switch(ThisItem.CheckStatus,
                                    'CheckStatus (CH-Tbl-Checks)'.Recontado,               ThemePosSoft,
                                    'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion',  ThemeAccentSoft,
                                    'CheckStatus (CH-Tbl-Checks)'.'No Recibido',           ThemeNegSoft,
                                    'CheckStatus (CH-Tbl-Checks)'.Recibido,                ThemeAccent,
                                    'CheckStatus (CH-Tbl-Checks)'.Rebotado,                ThemeDangerSoft,
                                    ThemeSunk)
                              Font: =Font.'Segoe UI'
                              Height: =22
                              HoverBorderColor: =Self.BorderColor
                              HoverColor: =Self.Color
                              HoverFill: =Self.Fill
                              OnSelect: =Select(Parent)
                              PaddingLeft: =0
                              PaddingRight: =0
                              PressedBorderColor: =Self.BorderColor
                              PressedFill: =Self.Fill
                              Size: =9
                              Text: |-
                                =Switch(ThisItem.CheckStatus,
                                    'CheckStatus (CH-Tbl-Checks)'.Recontado,               "Recontado",
                                    'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion',  "Enviado",
                                    'CheckStatus (CH-Tbl-Checks)'.'No Recibido',           "No recibido",
                                    'CheckStatus (CH-Tbl-Checks)'.Recibido,                "Recibido",
                                    'CheckStatus (CH-Tbl-Checks)'.Digitado,                "Digitado",
                                    'CheckStatus (CH-Tbl-Checks)'.Rebotado,                "Rebotado",
                                    "Sin estado")
                              Width: =Len(Self.Text) * 7 + 12
                              X: =34 + galChequesChq.Width * 0.64
                              Y: =11
                        - lblCelSellosChq:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Segoe UI'
                              Height: =20
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9
                              Text: |-
                                =Switch(ThisItem.CheckStatus,
                                    'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion',
                                        If(IsBlank(ThisItem.'Enviado el'), "—", "Env. " & Text(ThisItem.'Enviado el', FmtFechaCorta)),
                                    'CheckStatus (CH-Tbl-Checks)'.'No Recibido',
                                        If(IsBlank(ThisItem.'No recibido el'), "—", "No rec. " & Text(ThisItem.'No recibido el', FmtFechaCorta)),
                                    'CheckStatus (CH-Tbl-Checks)'.Recibido,
                                        If(IsBlank(ThisItem.'Recibido el'), "—", "Rec. " & Text(ThisItem.'Recibido el', FmtFechaCorta)),
                                    "—")
                              Visible: =scrCheques.Width >= 1100
                              Width: =galChequesChq.Width * 0.16 - 34
                              X: =34 + galChequesChq.Width * 0.80
                              Y: =12
                        - shpSepChq:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ThemeLine
                              Height: =1
                              OnSelect: =Select(Parent)
                              Width: =galChequesChq.Width
                              Y: =43
                  - icoVacioChq:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =ThemeInk3
                        Height: =32
                        Icon: =Icon.Journal
                        Visible: =CountRows(galChequesChq.AllItems) = 0 && !ctxCargandoChq
                        Width: =32
                        X: =cardChequesChq.Width / 2 - 16
                        Y: =cardChequesChq.Height / 2 - 60
                  - lblVacioTituloChq:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ThemeInk2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          =If(CountRows(colChequesChq) = 0,
                              "No hay cheques de esta fecha ni pendientes de los últimos 30 días",
                              "Ningún cheque en este estado")
                        Visible: =CountRows(galChequesChq.AllItems) = 0 && !ctxCargandoChq
                        Width: =cardChequesChq.Width - 32
                        X: =16
                        Y: =cardChequesChq.Height / 2 - 18
                  - lblVacioTextoChq:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =ThemeInk3
                        Font: =Font.'Segoe UI'
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9.5
                        Text: |-
                          =If(CountRows(colChequesChq) = 0,
                              "Probá otra fecha: los cheques Recontado y No recibido de los últimos 30 días se arrastran solos.",
                              "Cambiá el filtro de Estado o elegí «Todos».")
                        Visible: =CountRows(galChequesChq.AllItems) = 0 && !ctxCargandoChq
                        Width: =cardChequesChq.Width - 32
                        X: =16
                        Y: =cardChequesChq.Height / 2 + 6
      - cntConfirmChq:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =ctxConfirmReenvChq
            Width: =Parent.Width
          Children:
            - cardConfirmChq:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =176
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =460
                  X: =(cntConfirmChq.Width - 460) / 2
                  Y: =(cntConfirmChq.Height - 176) / 2
                Children:
                  - lblConfirmChq:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk
                        Font: =Font.'Segoe UI'
                        Height: =84
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10.5
                        Text: |-
                          ="Se van a reenviar a digitación los "
                          & CountRows(Filter(colChequesChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido'))
                          & " cheques No recibido de la ventana cargada (el día elegido más los pendientes de los últimos 30 días), estén o no visibles con el filtro actual."
                        Width: =420
                        X: =20
                        Y: =18
                  - btnConfirmNoChq:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Color: =ThemeInk2
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverBorderColor: =ThemeLine
                        HoverColor: =ThemeInk2
                        HoverFill: =ThemeSurface2
                        OnSelect: |-
                          =UpdateContext({ctxConfirmReenvChq: false})
                        PressedBorderColor: =ThemeLine
                        PressedColor: =ThemeInk2
                        PressedFill: =ThemeSunk
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9.5
                        Text: ="Cancelar"
                        Width: =110
                        X: =200
                        Y: =118
                  - btnConfirmSiChq:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =ThemeAccentInk
                        Fill: =ThemeAccent
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverColor: =ThemeAccentInk
                        HoverFill: =ColorFade(ThemeAccent, -10%)
                        OnSelect: |-
                          =UpdateContext({ctxConfirmReenvChq: false, ctxCargandoChq: true, ctxEnviandoChq: true});

                          // Sólo 'No Recibido' → 'Enviado a digitacion' es reenvío legal (CheckGuard).
                          // Se toma de la colección cargada, NO de la selección: los No Recibido salen
                          // deshabilitados en la grilla y nunca entran a colSelChq.
                          ClearCollect(colReenviarChq,
                              Filter(colChequesChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido')
                          );

                          ClearCollect(colEnvioResChq,
                              ForAll(colReenviarChq As C,
                                  IfError(
                                      Patch('CH-Tbl-Checks', C,
                                          { CheckStatus: 'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion' }
                                      ),
                                      { OkChq: false, MsgChq: FirstError.Message },
                                      { OkChq: true,  MsgChq: "" }
                                  )
                              )
                          );
                          UpdateContext({
                              ctxEnviadosChq:   CountRows(Filter(colEnvioResChq, OkChq)),
                              ctxRechazadosChq: CountRows(Filter(colEnvioResChq, !OkChq)),
                              ctxDescartadosChq: 0
                          });

                          Refresh('CH-Tbl-Checks');
                          Select(btnActualizarChq);

                          Notify(
                              ctxEnviadosChq & " reenviado(s) a digitación"
                              & If(ctxRechazadosChq > 0,
                                   " · " & ctxRechazadosChq & " rechazado(s) por el servidor: "
                                   & Coalesce(LookUp(colEnvioResChq, !OkChq, MsgChq), ""),
                                   ""),
                              If(ctxRechazadosChq > 0, NotificationType.Warning, NotificationType.Success)
                          );
                          UpdateContext({ctxCargandoChq: false, ctxEnviandoChq: false})
                        PressedColor: =ThemeAccentInk
                        PressedFill: =ColorFade(ThemeAccent, -20%)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9.5
                        Text: ="Sí, reenviar"
                        Width: =130
                        X: =320
                        Y: =118
      - cntCargandoChq:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =ctxCargandoChq
            Width: =Parent.Width
          Children:
            - lblCargandoChq:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =Color.White
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: =If(ctxEnviandoChq, "Enviando cheques...", "Actualizando...")
                  Width: =Parent.Width
                  Y: =Parent.Height / 2 - 12
