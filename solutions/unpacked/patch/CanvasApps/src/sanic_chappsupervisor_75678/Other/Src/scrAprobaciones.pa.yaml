                                                IsBlank(galBandejaApr.Selected) || IsBlank(galBandejaApr.Selected.RequestResources),
                                                "{}",
                                                galBandejaApr.Selected.RequestResources
                                            )
                                    }
                                );

                                // 2) GUID de tula: "BagGUID" en 8 tipos, "GUID" en Remapear/Eliminar.
                                //    NUNCA "BagID" — esa clave es el NÚMERO de tula (bug de la app vieja).
                                UpdateContext(
                                    {
                                        ctxBagGuidApr:
                                            Coalesce(
                                                IfError(GUID(Text(ParseJSON(ctxResApr).BagGUID)), Blank()),
                                                IfError(GUID(Text(ParseJSON(ctxResApr).GUID)), Blank())
                                            )
                                    }
                                );

                                // 3) Registros frescos (1 request cada uno, por clave primaria)
                                UpdateContext(
                                    {
                                        ctxBagApr:
                                            If(
                                                IsBlank(ctxBagGuidApr),
                                                Blank(),
                                                LookUp('CH-Tbl-Bags', 'CH-Tbl-Bags' = ctxBagGuidApr)
                                            )
                                    }
                                );
                                UpdateContext(
                                    {
                                        ctxSesGuidApr:
                                            Coalesce(
                                                ctxBagApr.RecountingSession.'CH-Tbl-RecountingSession',
                                                IfError(GUID(Text(ParseJSON(ctxResApr).RecountingSessionGUID)), Blank())
                                            )
                                    }
                                );
                                UpdateContext(
                                    {
                                        ctxSesionApr:
                                            If(
                                                IsBlank(ctxSesGuidApr),
                                                Blank(),
                                                LookUp('CH-Tbl-RecountingSessions', 'CH-Tbl-RecountingSession' = ctxSesGuidApr)
                                            )
                                    }
                                );

                                // 4) Depósitos RECONTADOS de la tula — comparación PK a PK (delegable)
                                If(
                                    IsBlank(ctxBagGuidApr),
                                    Clear(colRecApr),
                                    ClearCollect(
                                        colRecApr,
                                        Filter('CH-Tbl-DepositsRecountings', BagID.'CH-Tbl-Bags' = ctxBagGuidApr)
                                    )
                                );

                                // 5) Depósitos DECLARADOS de la bolsa declarada — 1 salto, delegable.
                                //    Trae también los declarados NO recontados (los que la vieja perdía).
                                If(
                                    IsBlank(ctxBagApr) || IsBlank(ctxBagApr.BagDeclarationID),
                                    Clear(colDecApr),
                                    ClearCollect(
                                        colDecApr,
                                        Filter(
                                            'CH-Tbl-DeclaredDeposits',
                                            DeclaredBag.'CH-Tbl-DeclaredBags' = ctxBagApr.BagDeclarationID.'CH-Tbl-DeclaredBags'
                                        )
                                    )
                                );

                                // 6.a) Pares declarado/recontado POR DEPÓSITO y POR COMPONENTE.
                                //      MISMA unidad de cálculo que el motor de asientos de §11 9.a/9.b:
                                //      lo que el supervisor firma es exactamente lo que se contabiliza.
                                Clear(colParApr);
                                ForAll(
                                    colRecApr As R,
                                    With(
                                        {
                                            D: LookUp(
                                                colDecApr,
                                                RelatedRecountedDeposit.'CH-Tbl-DepositsRecounting' = R.'CH-Tbl-DepositsRecounting'
                                            )
                                        },
                                        Collect(
                                            colParApr,
                                            {Cur: Text(R.Currency), Comp: "Efectivo",      Dec: Coalesce(D.CashAmount, 0),            Rec: Coalesce(R.CashAmount, 0)},
                                            {Cur: Text(R.Currency), Comp: "Cheques BAC",   Dec: Coalesce(D.BACLocalCheckAmount, 0),   Rec: Coalesce(R.BACLocalCheckAmount, 0)},
                                            {Cur: Text(R.Currency), Comp: "Otros cheques", Dec: Coalesce(D.OtherLocalCheckAmount, 0), Rec: Coalesce(R.OtherLocaCheckAmount, 0)}
                                        )
                                    )
                                );
                                // declarados que NADIE recontó → Faltante puro (espeja §11 9.b)
                                ForAll(
                                    Filter(colDecApr, IsBlank(RelatedRecountedDeposit)) As D2,
                                    Collect(
                                        colParApr,
                                        {Cur: Text(D2.Currency), Comp: "Efectivo",      Dec: Coalesce(D2.CashAmount, 0),            Rec: 0},
                                        {Cur: Text(D2.Currency), Comp: "Cheques BAC",   Dec: Coalesce(D2.BACLocalCheckAmount, 0),   Rec: 0},
                                        {Cur: Text(D2.Currency), Comp: "Otros cheques", Dec: Coalesce(D2.OtherLocalCheckAmount, 0), Rec: 0}
                                    )
                                );

                                // 6.b) Una fila por componente × moneda, con Sobrante y Faltante SIN compensar
                                Clear(colDifApr);
                                ForAll(
                                    GroupBy(colParApr, Cur, Comp, Filas) As G,
                                    With(
                                        {
                                            dec: Coalesce(Sum(G.Filas, Dec), 0),
                                            rec: Coalesce(Sum(G.Filas, Rec), 0),
                                            sob: Coalesce(Sum(G.Filas, Max(Rec - Dec, 0)), 0),
                                            fal: Coalesce(Sum(G.Filas, Abs(Min(Rec - Dec, 0))), 0),
                                            sim: Switch(G.Cur, "NIO", SimboloNIO, "USD", SimboloUSD, "EUR", SimboloEUR, G.Cur)
                                        },
                                        If(
                                            dec <> 0 || rec <> 0,
                                            Collect(colDifApr, {Comp: G.Comp & " " & sim, Dec: dec, Rec: rec, Sob: sob, Fal: fal})
                                        )
                                    )
                                );

                                Reset(galDifApr);
                                UpdateContext(
                                    {
                                        ctxCargadoIdApr:
                                            Coalesce(
                                                galBandejaApr.Selected.'CH-Tbl-ApprovalRequest',
                                                GUID("00000000-0000-0000-0000-000000000000")
                                            ),
                                        ctxCargandoApr: false
                                    }
                                )
                              PressedColor: =ThemeInk3
                              PressedFill: =ThemeSurface2
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =11
                              Text: ="↻"
                              Tooltip: ="Recargar el detalle"
                              Width: =30
                              X: =cardDetalleApr.Width - 46
                              Y: =14
      - cntConfirmApr:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =ctxConfirmApr <> ""
            Width: =Parent.Width
          Children:
            - cardConfirmApr:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =260
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =460
                  X: =(cntConfirmApr.Width - 460) / 2
                  Y: =(cntConfirmApr.Height - 260) / 2
                Children:
                  - lblConfirmTituloApr:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =If(ctxConfirmApr = "aprobar", "Confirmar aprobación", "Confirmar rechazo")
                        Width: =420
                        X: =20
                        Y: =18
                  - lblConfirmTextoApr:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Segoe UI'
                        Height: =52
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9.5
                        Text: |-
                          =If(
                              ctxConfirmApr = "aprobar",
                              "Vas a aprobar «" & galBandejaApr.Selected.RequestType & "»"
                              & If(IsBlank(ctxBagApr), "", " de la tula " & ctxBagApr.BagID)
                              & If(
                                  galBandejaApr.Selected.RequestType = "Tula con diferencia"
                                  || galBandejaApr.Selected.RequestType = "Tula recontada sin declaracion",
                                  ". " & lblAvisoAsientosApr.Text,
                                  ". Esta solicitud no genera asientos contables."
                              ),
                              "Vas a rechazar «" & galBandejaApr.Selected.RequestType & "»"
                              & If(IsBlank(ctxBagApr), "", " de la tula " & ctxBagApr.BagID)
                              & ". La acción revierte lo que la solicitud haya dejado en curso."
                          )
                        Width: =420
                        X: =20
                        Y: =44
                  - lblMotivoEtqApr:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =14
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8.5
                        Text: ="MOTIVO DEL RECHAZO (OBLIGATORIO)"
                        Visible: =ctxConfirmApr = "rechazar"
                        Width: =420
                        X: =20
                        Y: =104
                  - inpMotivoApr:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Color: =ThemeInk
                        Default: =""
                        Fill: =ThemeSurface2
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =56
                        HintText: ="Por qué se rechaza — queda en StatusReason"
                        HoverBorderColor: =ThemeLine
                        HoverColor: =ThemeInk
                        HoverFill: =ThemeSurface2
                        Mode: =TextMode.MultiLine
                        Size: =9.5
                        Visible: =ctxConfirmApr = "rechazar"
                        Width: =420
                        X: =20
                        Y: =124
                  - btnCancelarConfirmApr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Color: =ThemeInk2
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Normal
                        Height: =38
                        HoverBorderColor: =ThemeLine
                        HoverColor: =ThemeInk2
                        HoverFill: =ThemeSurface2
                        OnSelect: |-
                          =Reset(inpMotivoApr);
                          UpdateContext({ctxConfirmApr: ""})
                        PressedBorderColor: =ThemeLine
                        PressedColor: =ThemeInk2
                        PressedFill: =ThemeSurface2
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9.5
                        Text: ="Cancelar"
                        Width: =120
                        X: =20
                        Y: =200
                  - btnConfirmarAprobarApr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =ThemeAccentInk
                        Fill: =ThemeAccent
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HoverColor: =ThemeAccentInk
                        HoverFill: =ColorFade(ThemeAccent, -10%)
                        OnSelect: |-
                          =UpdateContext({ctxCargandoApr: true});

                          // UNA sola llamada. La CAPI sanic_CHResolveApprovalRequest autoriza, aplica el
                          // efecto y marca la solicitud EN LA MISMA TRANSACCION. Antes esto eran dos
                          // escrituras sueltas desde aca: si la segunda fallaba, la solicitud quedaba
                          // resuelta y el efecto sin ejecutar (una decision apuntando a la nada).
                          //
                          // Las reglas y los efectos NO se reimplementan aca a proposito: viven en el
                          // servidor, bajo test. El veredicto negativo vuelve como DATO (Outcome =
                          // "Blocked" + Message), nunca como fault, porque Power Fx descarta el mensaje
                          // de los faults de plugin y mostraria un "Network error" generico.
                          IfError(
                              With(
                                  {
                                      _r: Environment.sanic_CHResolveApprovalRequest(
                                          {
                                              ApprovalRequestId: galBandejaApr.Selected.'CH-Tbl-ApprovalRequest',
                                              Decision: "Approve",
                                              Reason: Trim(inpMotivoApr.Text)
                                          }
                                      )
                                  },
                                  Notify(
                                      _r.Message,
                                      If(
                                          _r.Outcome = "Blocked",
                                          NotificationType.Error,
                                          NotificationType.Success
                                      )
                                  )
                              ),
                              // Solo llega aca si la llamada NO pudo hacerse (privilegios, red). Los
                              // rechazos de negocio ya viajaron como dato en la rama de arriba.
                              Notify(
                                  "No se pudo aprobar la solicitud: " & FirstError.Message,
                                  NotificationType.Error
                              )
                          );

                          // Cierre — SIEMPRE fuera de la rama de exito
                          Reset(inpMotivoApr);
                          UpdateContext({ctxCargandoApr: false, ctxConfirmApr: ""});
                          Refresh('CH-Tbl-ApprovalRequests');
                          Select(btnRecargarDetalleApr)
                        PressedColor: =ThemeAccentInk
                        PressedFill: =ColorFade(ThemeAccent, -20%)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9.5
                        Text: ="Sí, aprobar y contabilizar"
                        Visible: =ctxConfirmApr = "aprobar"
                        Width: =208
                        X: =232
                        Y: =200
                  - btnConfirmarRechazarApr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =ThemeAccentInk
                        DisplayMode: =If(IsBlank(Trim(inpMotivoApr.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =ThemeDanger
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HoverColor: =ThemeAccentInk
                        HoverFill: =ColorFade(ThemeDanger, -10%)
                        OnSelect: |-
                          =UpdateContext({ctxCargandoApr: true});

                          // UNA sola llamada. La CAPI sanic_CHResolveApprovalRequest autoriza, aplica el
                          // efecto y marca la solicitud EN LA MISMA TRANSACCION. Antes esto eran dos
                          // escrituras sueltas desde aca: si la segunda fallaba, la solicitud quedaba
                          // resuelta y el efecto sin ejecutar (una decision apuntando a la nada).
                          //
                          // Las reglas y los efectos NO se reimplementan aca a proposito: viven en el
                          // servidor, bajo test. El veredicto negativo vuelve como DATO (Outcome =
                          // "Blocked" + Message), nunca como fault, porque Power Fx descarta el mensaje
                          // de los faults de plugin y mostraria un "Network error" generico.
                          IfError(
                              With(
                                  {
                                      _r: Environment.sanic_CHResolveApprovalRequest(
                                          {
                                              ApprovalRequestId: galBandejaApr.Selected.'CH-Tbl-ApprovalRequest',
                                              Decision: "Reject",
                                              Reason: Trim(inpMotivoApr.Text)
                                          }
                                      )
                                  },
                                  Notify(
                                      _r.Message,
                                      If(
                                          _r.Outcome = "Blocked",
                                          NotificationType.Error,
                                          NotificationType.Success
                                      )
                                  )
                              ),
                              // Solo llega aca si la llamada NO pudo hacerse (privilegios, red). Los
                              // rechazos de negocio ya viajaron como dato en la rama de arriba.
                              Notify(
                                  "No se pudo rechazar la solicitud: " & FirstError.Message,
                                  NotificationType.Error
                              )
                          );

                          // Cierre — SIEMPRE fuera de la rama de exito
                          Reset(inpMotivoApr);
                          UpdateContext({ctxCargandoApr: false, ctxConfirmApr: ""});
                          Refresh('CH-Tbl-ApprovalRequests');
                          Select(btnRecargarDetalleApr)
                        PressedColor: =ThemeAccentInk
                        PressedFill: =ColorFade(ThemeDanger, -20%)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9.5
                        Text: ="Sí, rechazar"
                        Visible: =ctxConfirmApr = "rechazar"
                        Width: =208
                        X: =232
                        Y: =200
