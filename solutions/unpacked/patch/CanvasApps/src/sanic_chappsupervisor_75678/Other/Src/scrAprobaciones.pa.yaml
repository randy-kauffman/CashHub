Screens:
  scrAprobaciones:
    Properties:
      Fill: =ThemeBg
      LoadingSpinnerColor: =ThemeAccent
      OnVisible: |-
        =UpdateContext(
            {
                ctxSegApr: "pendientes",
                ctxConfirmApr: "",
                ctxCargandoApr: false,
                ctxResueltaApr: false,
                ctxCargadoIdApr: GUID("00000000-0000-0000-0000-000000000000")
            }
        );
        Reset(inpBuscarApr);
        Reset(inpMotivoApr);
        Reset(galBandejaApr);
        Select(btnActualizarApr)
    Children:
      - cmpNavApr:
          Control: CanvasComponent
          ComponentName: cmpNav
          Properties:
            Height: =Parent.Height
            Width: =214
      - cntBodyApr:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =14
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =18
            PaddingLeft: =26
            PaddingRight: =26
            PaddingTop: =22
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width - cmpNavApr.Width
            X: =cmpNavApr.Width
          Children:
            - cntTituloApr:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =3
                  LayoutMinHeight: =52
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblTituloApr:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        LayoutMinHeight: =26
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Aprobaciones"
                  - lblSubtituloApr:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Segoe UI'
                        Height: =20
                        LayoutMinHeight: =20
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10.5
                        Text: ="Solicitudes que requieren tu firma. No podés aprobar lo que vos mismo solicitaste."
            - cardFiltrosApr:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  FillPortions: =0
                  Height: =74
                  LayoutMinHeight: =74
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - segPendApr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Color: =If(ctxSegApr = "pendientes", ThemeAccentInk, ThemeInk2)
                        Fill: =If(ctxSegApr = "pendientes", ThemeAccent, ThemeSurface2)
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverBorderColor: =ThemeLine
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        OnSelect: |-
                          =Reset(inpMotivoApr);
                          UpdateContext({ctxSegApr: "pendientes", ctxConfirmApr: ""});
                          Reset(galBandejaApr);
                          Select(btnRecargarDetalleApr)
                        PressedBorderColor: =ThemeLine
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =0
                        RadiusTopLeft: =8
                        RadiusTopRight: =0
                        Size: =9.5
                        Text: ="Pendientes  " & CountRows(Filter('CH-Tbl-ApprovalRequests', ApprovalStatus = Blank()))
                        Width: =152
                        X: =16
                        Y: =20
                  - segHistApr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Color: =If(ctxSegApr = "historico", ThemeAccentInk, ThemeInk2)
                        Fill: =If(ctxSegApr = "historico", ThemeAccent, ThemeSurface2)
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HoverBorderColor: =ThemeLine
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        OnSelect: |-
                          =Reset(inpMotivoApr);
                          UpdateContext({ctxSegApr: "historico", ctxConfirmApr: ""});
                          Reset(galBandejaApr);
                          Select(btnRecargarDetalleApr)
                        PressedBorderColor: =ThemeLine
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =8
                        RadiusTopLeft: =0
                        RadiusTopRight: =8
                        Size: =9.5
                        Text: ="Histórico"
                        Width: =110
                        X: =168
                        Y: =20
                  - lblBuscarApr:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =14
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8.5
                        Text: ="BUSCAR"
                        Width: =120
                        X: =298
                        Y: =10
                  - inpBuscarApr:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Clear: =true
                        Color: =ThemeInk
                        Default: =""
                        Fill: =ThemeSurface2
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =34
                        HintText: ="Tipo, número de solicitud o número de tula…"
                        HoverBorderColor: =ThemeLine
                        HoverColor: =ThemeInk
                        HoverFill: =ThemeSurface2
                        PaddingLeft: =30
                        Size: =9.5
                        Width: =cardFiltrosApr.Width - 640
                        X: =298
                        Y: =26
                  - icoBuscarApr:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =ThemeInk3
                        DisplayMode: =DisplayMode.View
                        Height: =16
                        Icon: =Icon.Search
                        Width: =16
                        X: =306
                        Y: =35
                  - cirSyncApr:
                      Control: Circle@2.3.0
                      Properties:
                        Fill: =ThemeAccent
                        Height: =8
                        Width: =8
                        X: =cardFiltrosApr.Width - 320
                        Y: =40
                  - lblSyncApr:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8.5
                        Text: =If(IsBlank(ctxUltimaActApr), "Bandeja al día", "Actualizado " & Text(ctxUltimaActApr, "HH:mm:ss"))
                        Width: =160
                        X: =cardFiltrosApr.Width - 304
                        Y: =32
                  - btnActualizarApr:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =ThemeAccentInk
                        Fill: =ThemeAccent
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverColor: =ThemeAccentInk
                        HoverFill: =ColorFade(ThemeAccent, -10%)
                        OnSelect: |-
                          =Refresh('CH-Tbl-ApprovalRequests');
                          UpdateContext({ctxUltimaActApr: Now()});
                          Reset(galBandejaApr);
                          Select(btnRecargarDetalleApr)
                        PressedColor: =ThemeAccentInk
                        PressedFill: =ColorFade(ThemeAccent, -20%)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9.5
                        Text: ="↻  Actualizar"
                        Width: =124
                        X: =cardFiltrosApr.Width - 140
                        Y: =28
            - cntMasterDetalleApr:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(scrAprobaciones.Width >= 1212, cntBodyApr.Height - 194, 1240)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMinHeight: =If(scrAprobaciones.Width >= 1212, cntBodyApr.Height - 194, 1240)
                  LayoutMinWidth: =16
                  LayoutWrap: =true
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cardBandejaApr:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        FillPortions: =5
                        Height: =If(scrAprobaciones.Width >= 1212, cntMasterDetalleApr.Height, 610)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =380
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                      Children:
                        - lblBandejaTituloApr:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10.5
                              Text: ="Bandeja de solicitudes"
                              Width: =7 * Len(Self.Text) + 8
                              X: =16
                              Y: =12
                        - pilBandejaCountApr:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =If(Self.Fill = ThemeSunk, 1, 0)
                              Color: =ThemeInk3
                              DisplayMode: =DisplayMode.View
                              Fill: =ThemeSunk
                              Font: =Font.'Segoe UI'
                              Height: =22
                              HoverBorderColor: =Self.BorderColor
                              HoverColor: =Self.Color
                              HoverFill: =Self.Fill
                              PaddingLeft: =0
                              PaddingRight: =0
                              PressedBorderColor: =Self.BorderColor
                              PressedFill: =Self.Fill
                              Size: =9
                              Text: =CountRows(galBandejaApr.AllItems) & If(ctxSegApr = "pendientes", " pendientes", " resueltas")
                              Width: =12 + 7 * Len(Self.Text)
                              X: =lblBandejaTituloApr.X + lblBandejaTituloApr.Width + 10
                              Y: =11
                        - shpLineaHeadApr:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ThemeLine
                              Height: =1
                              Width: =cardBandejaApr.Width
                              Y: =44
                        - galBandejaApr:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              DelayItemLoading: =false
                              Height: =cardBandejaApr.Height - 45
                              Items: |-
                                =If(
                                    ctxSegApr = "pendientes",
                                    SortByColumns(
                                        Filter(
                                            'CH-Tbl-ApprovalRequests',
                                            ApprovalStatus = Blank()
                                            && (
                                                StartsWith(RequestType, inpBuscarApr.Text)
                                                || StartsWith(Name, inpBuscarApr.Text)
                                                || StartsWith(BagNumber, inpBuscarApr.Text)
                                            )
                                        ),
                                        "createdon",
                                        SortOrder.Descending
                                    ),
                                    SortByColumns(
                                        Filter(
                                            'CH-Tbl-ApprovalRequests',
                                            ApprovalStatus <> Blank()
                                            && (
                                                StartsWith(RequestType, inpBuscarApr.Text)
                                                || StartsWith(Name, inpBuscarApr.Text)
                                                || StartsWith(BagNumber, inpBuscarApr.Text)
                                            )
                                        ),
                                        "createdon",
                                        SortOrder.Descending
                                    )
                                )
                              LoadingSpinner: =LoadingSpinner.None
                              OnSelect: |-
                                =Reset(inpMotivoApr);
                                UpdateContext({ctxConfirmApr: ""});
                                Select(btnRecargarDetalleApr)
                              TemplateFill: =If(ThisItem.'CH-Tbl-ApprovalRequest' = galBandejaApr.Selected.'CH-Tbl-ApprovalRequest', ThemeAccentSoft, ThemeSurface)
                              TemplatePadding: =0
                              TemplateSize: =58
                              Width: =cardBandejaApr.Width
                              Y: =45
                            Children:
                              - btnFilaApr:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =ThemeInk
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =58
                                    HoverColor: =ThemeInk
                                    HoverFill: =ThemeSurface2
                                    OnSelect: =Select(Parent)
                                    PressedColor: =ThemeInk
                                    PressedFill: =ThemeAccentSoft
                                    Size: =10
                                    Text: =""
                                    Width: =galBandejaApr.Width
                              - lblFilaTipoApr:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =ThemeInk
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10.5
                                    Text: =ThisItem.RequestType
                                    Width: |-
                                      =galBandejaApr.Width - 28
                                      - If(ctxSegApr = "historico", 92, 0)
                                      - If(scrAprobaciones.Width >= 1100, 116, 0)
                                    X: =14
                                    Y: =9
                              - lblFilaMetaApr:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =ThemeInk3
                                    Font: =Font.'Segoe UI'
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =8.5
                                    Text: =ThisItem.Name & "  ·  " & ThisItem.'Created By'.'Full Name'
                                    Width: |-
                                      =galBandejaApr.Width - 28
                                      - If(ctxSegApr = "historico", 92, 0)
                                      - If(scrAprobaciones.Width >= 1100, 116, 0)
                                    X: =14
                                    Y: =29
                              - pilFilaEstadoApr:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeLine
                                    BorderThickness: =If(Self.Fill = ThemeSunk, 1, 0)
                                    Color: =If(ThisItem.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado, ThemePos, ThemeDanger)
                                    DisplayMode: =DisplayMode.View
                                    Fill: =If(ThisItem.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado, ThemePosSoft, ThemeDangerSoft)
                                    Font: =Font.'Segoe UI'
                                    Height: =22
                                    HoverBorderColor: =Self.BorderColor
                                    HoverColor: =Self.Color
                                    HoverFill: =Self.Fill
                                    OnSelect: =Select(Parent)
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PressedBorderColor: =Self.BorderColor
                                    PressedFill: =Self.Fill
                                    Size: =9
                                    Text: =Text(ThisItem.ApprovalStatus)
                                    Visible: =ctxSegApr = "historico" && !IsBlank(ThisItem.ApprovalStatus)
                                    Width: =12 + 7 * Len(Self.Text)
                                    X: =galBandejaApr.Width - If(scrAprobaciones.Width >= 1100, 130, 14) - Self.Width
                                    Y: =18
                              - lblFilaCuandoApr:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =ThemeInk3
                                    Font: =Font.'Segoe UI'
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =8.5
                                    Text: |-
                                      =With(
                                          { d: DateValue(ThisItem.'Created On') },
                                          If(
                                              d = Today(), "hoy " & Text(ThisItem.'Created On', "HH:mm"),
                                              d = DateAdd(Today(), -1, TimeUnit.Days), "ayer " & Text(ThisItem.'Created On', "HH:mm"),
                                              Text(ThisItem.'Created On', FmtFechaCorta)
                                          )
                                      )
                                    Visible: =scrAprobaciones.Width >= 1100
                                    Width: =100
                                    X: =galBandejaApr.Width - 116
                                    Y: =20
                              - shpSepFilaApr:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeLine
                                    Height: =1
                                    OnSelect: =Select(Parent)
                                    Width: =galBandejaApr.Width
                                    Y: =57
                        - icoVacioBandejaApr:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =ThemeInk3
                              Height: =32
                              Icon: =Icon.CheckBadge
                              Visible: =CountRows(galBandejaApr.AllItems) = 0 && !ctxCargandoApr
                              Width: =32
                              X: =cardBandejaApr.Width / 2 - 16
                              Y: =cardBandejaApr.Height / 2 - 60
                        - lblVacioBandejaTitApr:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =ThemeInk2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =If(ctxSegApr = "pendientes", "No hay solicitudes pendientes", "No hay solicitudes resueltas con ese criterio")
                              Visible: =CountRows(galBandejaApr.AllItems) = 0 && !ctxCargandoApr
                              Width: =cardBandejaApr.Width - 40
                              X: =20
                              Y: =cardBandejaApr.Height / 2 - 18
                        - lblVacioBandejaTxtApr:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =ThemeInk3
                              Font: =Font.'Segoe UI'
                              Height: =36
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9.5
                              Text: =If(ctxSegApr = "pendientes", "Todo lo que requería tu firma ya fue resuelto.", "Probá con otro texto de búsqueda o volvé a Pendientes.")
                              Visible: =CountRows(galBandejaApr.AllItems) = 0 && !ctxCargandoApr
                              Width: =cardBandejaApr.Width - 40
                              X: =20
                              Y: =cardBandejaApr.Height / 2 + 4
                  - cardDetalleApr:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        FillPortions: =4
                        Height: =If(scrAprobaciones.Width >= 1212, cntMasterDetalleApr.Height, 610)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =550
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                      Children:
                        - cntDetStackApr:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =cardDetalleApr.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =14
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =14
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =!IsBlank(galBandejaApr.Selected)
                              Width: =cardDetalleApr.Width
                            Children:
                              - cntDetCabeceraApr:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =54
                                    LayoutMinHeight: =54
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblDetTituloApr:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ThemeInk
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Text: |-
                                            =galBandejaApr.Selected.RequestType
                                            & If(
                                                !IsBlank(ctxBagApr),
                                                " — " & ctxBagApr.BagID,
                                                IsBlank(galBandejaApr.Selected.Name),
                                                "",
                                                " — " & galBandejaApr.Selected.Name
                                            )
                                          Width: =cntDetCabeceraApr.Width - 46
                                    - lblDetSubApr:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ThemeInk3
                                          Font: =Font.'Segoe UI'
                                          Height: =26
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =9
                                          Text: |-
                                            ="Solicitada por " & galBandejaApr.Selected.'Created By'.'Full Name'
                                            & If(IsBlank(ctxSesionApr.CountingDesk.Name), "", " (" & ctxSesionApr.CountingDesk.Name & ")")
                                            & If(IsBlank(ctxSesionApr.Name), "", "  ·  sesión " & ctxSesionApr.Name)
                                            & "  ·  " & Text(galBandejaApr.Selected.'Created On', FmtFecha)
                                            & If(IsBlank(galBandejaApr.Selected.ApprovalStatus), "", "  ·  " & Text(galBandejaApr.Selected.ApprovalStatus))
                                            & If(IsBlank(galBandejaApr.Selected.SolvedBy), "", " por " & galBandejaApr.Selected.SolvedBy.'Full Name')
                                            & If(IsBlank(galBandejaApr.Selected.ResolutionDatetime), "", " el " & Text(galBandejaApr.Selected.ResolutionDatetime, FmtFecha))
                                          Width: =cntDetCabeceraApr.Width - 46
                                          Y: =26
                              - cntDetStaleApr:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =ThemeWarn
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =ThemeWarnSoft
                                    FillPortions: =0
                                    Height: =36
                                    LayoutMinHeight: =36
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Visible: =ctxCargadoIdApr <> galBandejaApr.Selected.'CH-Tbl-ApprovalRequest'
                                  Children:
                                    - lblDetStaleApr:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ThemeWarn
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =9
                                          Text: ="El detalle no corresponde a la solicitud seleccionada."
                                          Width: =cntDetStaleApr.Width - 130
                                          X: =12
                                          Y: =9
                                    - btnDetStaleApr:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =ThemeWarn
                                          BorderThickness: =1
                                          Color: =ThemeWarn
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Font: =Font.'Segoe UI'
                                          Height: =24
                                          HoverBorderColor: =ThemeWarn
                                          HoverColor: =ThemeWarn
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          OnSelect: =Select(btnRecargarDetalleApr)
                                          PressedBorderColor: =ThemeWarn
                                          PressedColor: =ThemeWarn
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          Size: =9
                                          Text: ="↻  Cargar"
                                          Width: =106
                                          X: =cntDetStaleApr.Width - 118
                                          Y: =6
                              - htmlDetalleApr:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =App.Theme.Colors.Darker40
                                    Color: =ThemeInk2
