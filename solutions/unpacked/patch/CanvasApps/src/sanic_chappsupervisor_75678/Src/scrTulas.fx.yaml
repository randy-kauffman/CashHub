            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =52
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            ZIndex: =1

            lblTituloTula As label:
