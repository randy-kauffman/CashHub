                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =22
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =12
                Text: |-
                    =Switch(ctxSegTula,
                        "todas",      "No hay tulas en el rango de fechas seleccionado",
                        "esclusa",    "No hay tulas en esclusa en este rango",
                        "boveda",     "No hay tulas almacenadas en bóveda en este rango",
                        "cajero",     "No hay tulas asignadas a cajero en este rango",
                        "pendrec",    "No hay tulas pendientes de revisión por recuento en este rango",
                        "procesadas", "No hay tulas recontadas en este rango",
                        "No hay tulas para mostrar"
                    )
                Visible: |-
                    =CountRows(Filter(colTulasTula, ctxSegTula = "todas" || SegTula = ctxSegTula)) = 0
                    && !ctxCargandoTula
                Width: =cardTablaTula.Width - 32
                X: =16
                Y: =cardTablaTula.Height / 2 - 18
                ZIndex: =27

    cntCargandoTula As groupContainer.manualLayoutContainer:
        Fill: =RGBA(0, 0, 0, 0.35)
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        Visible: =ctxCargandoTula
        Width: =Parent.Width
        ZIndex: =3

        lblCargandoTula As label:
            Align: =Align.Center
            BorderColor: =App.Theme.Colors.Darker40
            Color: =Color.White
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =Font.'Segoe UI'
            Height: =24
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Cargando tulas..."
            Width: =cntCargandoTula.Width
            Y: =cntCargandoTula.Height / 2 - 12
            ZIndex: =1

    cntDlgDevTula As groupContainer.manualLayoutContainer:
        Fill: =RGBA(0, 0, 0, 0.45)
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        Visible: =ctxDlgDevTula
        Width: =Parent.Width
        ZIndex: =4

        cardDlgDevTula As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Regular
            Fill: =ThemeSurface
            Height: =306
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Width: =Min(560, Parent.Width - 80)
            X: =(Parent.Width - Self.Width) / 2
            Y: =Max(24, (Parent.Height - Self.Height) / 2)
            ZIndex: =1

            lblDlgDevTitTula As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =28
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =13.5
                Text: ="Devolver la tula " & ctxTulaDevTula.BagID
                Width: =cardDlgDevTula.Width - 48
                X: =24
                Y: =22
                ZIndex: =1

            lblDlgDevSubTula As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk2
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                Height: =38
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =10
                Text: ="La tula sale de la mesa y queda libre para que otro cajero la tome. Esto NO se puede deshacer."
                Width: =cardDlgDevTula.Width - 48
                X: =24
                Y: =54
                ZIndex: =2

            shpDlgDevAvisoTula As rectangle:
                Fill: =ThemeWarnSoft
                Height: =104
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Width: =cardDlgDevTula.Width - 48
                X: =24
                Y: =100
                ZIndex: =3

            lblDlgDevDetalleTula As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                Height: =88
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =9.5
                Text: |-
                    ="Se borra TODO el recuento de esta tula: sus depósitos, sus cheques y sus denominaciones. Se desvincula la declaración del cliente, que vuelve a quedar disponible. La tula queda en cero, como si nunca hubiera pasado por una mesa." & Char(10) &
                    "Las aprobaciones que ya dio un supervisor NO se borran: quedan como constancia."
                Width: =cardDlgDevTula.Width - 80
                X: =40
                Y: =108
                ZIndex: =4

            btnDlgDevCancelarTula As button:
                BorderColor: =ThemeLine
                BorderThickness: =1
                Color: =ThemeInk2
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =ThemeSurface
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =38
                HoverBorderColor: =ThemeLineStrong
                HoverColor: =ThemeInk
                HoverFill: =ThemeSurface2
                OnSelect: |-
                    =UpdateContext({ctxDlgDevTula: false})
                PressedBorderColor: =ThemeLineStrong
                PressedColor: =ThemeInk
                PressedFill: =ThemeSurface2
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =10
                Text: ="Cancelar"
                Width: =120
                X: =cardDlgDevTula.Width - 24 - 120 - 12 - 176
                Y: =cardDlgDevTula.Height - 60
                ZIndex: =5

            btnDlgDevConfirmarTula As button:
                BorderColor: =ThemeWarn
                BorderThickness: =0
                Color: =ThemeSurface
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =ThemeLine
                DisplayMode: =If(ctxDevEnCursoTula, DisplayMode.Disabled, DisplayMode.Edit)
                Fill: =ThemeWarn
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =38
                HoverColor: =ThemeSurface
                HoverFill: =ThemeWarn
                OnSelect: |-
                    =// Doble clic o Enter repetido dispararian DOS barridos. El primero
                    // deja la tula en "Devuelta" y el segundo choca contra el guard, pero
                    // el cajero veria un error que no significa nada.
                    UpdateContext({ctxDevEnCursoTula: true});
                    IfError(
                        UpdateContext({
                            ctxRespDevTula: Environment.sanic_CHReturnBagForReassignment(
                                { BagId: Text(ctxTulaDevTula.'CH-Tbl-Bags'), Reason: "Devuelta por el supervisor" }
                            )
                        }),
                        Notify("No se pudo devolver la tula: " & FirstError.Message, NotificationType.Error);
                        UpdateContext({ ctxRespDevTula: Blank() })
                    );
                    If(
                        ctxRespDevTula.Outcome = "Returned",
                        Notify(ctxRespDevTula.Message, NotificationType.Success);
                        UpdateContext({ctxDlgDevTula: false});
                        Select(btnActualizarTula),
                        !IsBlank(ctxRespDevTula.Outcome),
                        Notify(ctxRespDevTula.Message, NotificationType.Error)
                    );
                    UpdateContext({ctxDevEnCursoTula: false})
                PressedColor: =ThemeSurface
                PressedFill: =ThemeWarn
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =10
                Text: =If(ctxDevEnCursoTula, "Devolviendo…", "Sí, devolver y borrar")
                Width: =176
                X: =cardDlgDevTula.Width - 24 - 176
                Y: =cardDlgDevTula.Height - 60
                ZIndex: =6

