                Color: =ThemeInk3
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(244, 244, 244, 1)
                Height: =16
                Icon: =Icon.Search
                Width: =16
                X: =352
                Y: =39
                ZIndex: =7

            lblCreadoPorTula As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8.5
                Text: ="CREADO POR"
                Width: =120
                X: =cardFiltrosTula.Width - 236
                Y: =10
                ZIndex: =8

            drpCreadoPorTula As dropdown:
