                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =30
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =30
                LayoutMinWidth: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =18
                Text: ="Localización de tulas"
                Width: =480
                ZIndex: =1

            lblSubtituloTula As label:
