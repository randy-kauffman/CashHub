                BorderThickness: =1
                ChevronBackground: =ThemeSurface
                ChevronDisabledBackground: =RGBA(166, 166, 166, 1)
                ChevronDisabledFill: =RGBA(244, 244, 244, 1)
                ChevronFill: =ThemeInk2
                ChevronHoverBackground: =ThemeSurface2
                ChevronHoverFill: =ThemeAccent
                Color: =ThemeInk
                Default: =Coalesce(LookUp(colCreadoresTula, CreadorGuid = ctxCreadorSelTula).CreadorNombre, "Cualquiera")
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =ThemeSurface
                Font: =Font.'Segoe UI'
                Height: =34
                HoverColor: =ThemeInk
                HoverFill: =ThemeSurface2
                Items: =colCreadoresTula
                OnChange: |-
                    =UpdateContext({ctxCreadorSelTula: drpCreadoPorTula.Selected.CreadorGuid});
                    Select(btnActualizarTula)
                PressedColor: =ThemeAccentInk
                PressedFill: =ThemeAccent
                SelectionColor: =ThemeAccentInk
                SelectionFill: =ThemeAccent
                Size: =10
                Width: =220
                X: =cardFiltrosTula.Width - 236
                Y: =30
                ZIndex: =9

            cirSyncTula As circle:
                BorderColor: =App.Theme.Colors.Darker40
                Fill: =ThemeAccent
                Height: =8
                Width: =8
                X: =16
                Y: =84
                ZIndex: =10

            lblSyncTula As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                Height: =20
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8.5
                Text: |-
                    =If(IsBlank(ctxUltimaActTula), "Sin actualizar", "Actualizado " & Text(ctxUltimaActTula, "HH:mm:ss"))
                Width: =260
                X: =30
                Y: =76
                ZIndex: =11

            btnActualizarTula As button:
                BorderColor: =ThemeLine
                BorderThickness: =1
                Color: =ThemeAccent
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =RGBA(0, 0, 0, 0)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =26
                HoverBorderColor: =ThemeLine
                HoverColor: =ThemeAccent
                HoverFill: =ThemeAccentSoft
                OnSelect: |-
                    =UpdateContext({ctxCargandoTula: true});
                    IfError(
                        // 1) LA consulta: una sola, delegable, con ventana temporal obligatoria.
                        //    El AddColumns MATERIALIZA en la carga los cuatro textos de lookup y el
                        //    segmento: la galería después no hace NI UN fetch por fila (fix del N+1),
                        //    y el segmentado y los contadores trabajan 100% en local.
                        ClearCollect(colTulasTula,
                            AddColumns(
                                Filter('CH-Tbl-Bags',
                                    'Created On' >= Coalesce(dtDesdeTula.SelectedDate, DateAdd(Today(), -30, TimeUnit.Days))
                                    && 'Created On' < DateAdd(Coalesce(dtHastaTula.SelectedDate, Today()), 1, TimeUnit.Days)
                                    && (IsBlank(ctxCreadorSelTula) || 'Created By'.User = ctxCreadorSelTula)
                                    // B-3 ya en el entorno: el espejo ReceiptIdMirror permite buscar
                                    // por número de recibo sin romper la delegación.
                                    && (
                                        StartsWith(BagID, inpBuscarTula.Text)
                                        || StartsWith(ReceiptIdMirror, inpBuscarTula.Text)
                                    )
                                ),
                                SegTula,
                                Switch(BagStatus,
                                    'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa',                             "esclusa",
                                    'BagStatus (CH-Tbl-Bags)'.'Pendiente de revision por supervisor - esclusa',  "esclusa",
                                    'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda',                            "boveda",
                                    'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero',                               "cajero",
                                    'BagStatus (CH-Tbl-Bags)'.'Devuelta para reasignacion',                      "devuelta",
                                    'BagStatus (CH-Tbl-Bags)'.'Pendiente de revision por supervisor - recuento', "pendrec",
                                    'BagStatus (CH-Tbl-Bags)'.Recontada,                                         "procesadas",
                                    "otros"
                                ),
                                ReciboTula,      ReceptionID.ReceiptID,      // 1 salto, UNA vez por fila cargada
                                ClienteTula,     ReceptionID.RemitentName,   // 1 salto (NO se dot-walkea a Client)
                                CreadoPorTula,   'Created By'.'Full Name',   // 1 salto
                                CreadorGuidTula, 'Created By'.User           // GUID: es lo que filtra, delegable
                            )
                        );
                    
                        // 2) Combo "Creado por" = los creadores REALES de la ventana cargada.
                        //    Se reconstruye SOLO cuando no hay creador seleccionado: si hubiera uno,
                        //    la colección tendría un único creador y el combo se quedaría sin las
                        //    demás opciones. Cero consultas extra: nombres y GUIDs ya vienen
                        //    materializados del paso 1. Dedupe con GroupBy, NO con ForAll+LookUp
                        //    (ForAll no garantiza orden de evaluación => duplicados intermitentes).
                        If(
                            IsBlank(ctxCreadorSelTula),
                            ClearCollect(colCreadoresTula,
                                // GUID TIPADO: If(false, GUID(...)) siembra la columna con tipo.
                                // Blank() pelado deja la columna sin tipo y el Collect siguiente falla.
                                {CreadorNombre: "Cualquiera",
                                 CreadorGuid: If(false, GUID("00000000-0000-0000-0000-000000000000"))}
                            );
                            Collect(colCreadoresTula,
                                ForAll(
                                    GroupBy(
                                        Filter(colTulasTula, !IsBlank(CreadorGuidTula)),
                                        CreadoPorTula, CreadorGuidTula, FilasTula
                                    ) As G,
                                    {CreadorNombre: G.CreadoPorTula, CreadorGuid: G.CreadorGuidTula}
                                )
                            )
                        );
                    
                        UpdateContext({ctxUltimaActTula: Now()}),
                    
                        // rama de error del IfError
                        Notify("No se pudieron cargar las tulas: " & FirstError.Message, NotificationType.Error)
                    );
                    UpdateContext({ctxCargandoTula: false});
                    Reset(galTulasTula)
                PressedBorderColor: =ThemeLine
                PressedColor: =ThemeAccent
                PressedFill: =ThemeAccentSoft
                RadiusBottomLeft: =6
                RadiusBottomRight: =6
                RadiusTopLeft: =6
                RadiusTopRight: =6
                Size: =9
                Text: ="↻  Actualizar"
                Width: =124
                X: =cardFiltrosTula.Width - 140
                Y: =74
                ZIndex: =12

        cntSegTula As groupContainer.horizontalAutoLayoutContainer:
