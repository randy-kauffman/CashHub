scrTulas As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =ThemeAccent
    OnVisible: |-
        =UpdateContext({
            ctxSegTula: "esclusa",
            ctxSortTula: "creado",
            ctxSortAscTula: false,
            // El modal de devolucion arranca CERRADO en cada visita: sin este reset,
            // volver aca desde otra pantalla te encuentra el dialogo abierto sobre una
            // tula que ya no es la que estabas mirando.
            ctxDlgDevTula: false,
            ctxDevEnCursoTula: false,
            // Defaults() y no Blank(): el label del titulo lee .BagID y sin el registro
            // tipado la expresion no resuelve.
            ctxTulaDevTula: Defaults('CH-Tbl-Bags')
        });
        If(
            IsEmpty(colTulasTula),
            Select(btnActualizarTula)   // primera visita: carga sola
        );
        Reset(galTulasTula)

    cmpNavTula As cmpNav:
        Height: =Parent.Height

    cntBodyTula As groupContainer.verticalAutoLayoutContainer:
