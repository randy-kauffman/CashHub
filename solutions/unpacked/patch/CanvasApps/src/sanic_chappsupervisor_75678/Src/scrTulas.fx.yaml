        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =18
        PaddingLeft: =26
        PaddingRight: =26
        PaddingTop: =22
        Width: =Parent.Width - cmpNavTula.Width
        X: =cmpNavTula.Width
        ZIndex: =2

