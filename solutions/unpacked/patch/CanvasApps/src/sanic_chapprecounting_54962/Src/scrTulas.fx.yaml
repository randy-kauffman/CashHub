scrTulas As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =ThemeAccent
    OnVisible: |-
        =// ===== 0. GUARDA DE SESION — 03 no existe sin sesion resuelta =====
        //   Los bloques 1, 2 y 3 viven en el ELSE de esta guarda: sin sesion no se toca
        //   el estado local ni se dispara UNA sola consulta. Navigate() NO corta la
        //   formula (01 §7.10), asi que sin el else las dos consultas de
        //   btnCargarSesionTul se disparaban igual, filtrando por una PK vacia.
        // La sesion pudo MORIR mientras el cajero estaba en otra pantalla: el
        // supervisor la cierra y gvarSesion sigue en memoria como si nada. Se relee
        // con Refresh —LookUp solo sirve del cache— y si esta cerrada se limpia,
        // para que la guarda de abajo la trate como "no hay sesion".
        Refresh('CH-Tbl-RecountingSessions');
        If(
            !IsBlank(gvarSesion.'CH-Tbl-RecountingSession') &&
            LookUp(
                'CH-Tbl-RecountingSessions',
                'CH-Tbl-RecountingSession' = gvarSesion.'CH-Tbl-RecountingSession'
            ).SessionForciblyClosed,
            Notify(
                "Su sesión de recuento fue cerrada por un supervisor. Abra una sesión nueva para seguir trabajando.",
                NotificationType.Error,
                6000
            );
            Set(gvarSesion, Blank());
            Set(gvarTula, Blank());
            Set(gvarSesionDetalle, Blank())
        );
        
        If(
            IsBlank(gvarSesion.'CH-Tbl-RecountingSession'),
        
            Notify(
                "No hay una sesión de conteo abierta. Vuelva a la pantalla de sesión.",
                NotificationType.Error
            );
            //Select(btnIrSesionTul)
            Blank()
            ,
        
            // ===== 1. ESTADO LOCAL — todo el contexto de la pantalla, de una =====
            UpdateContext(
                {
                    ctxScanTul:          "",
                    ctxTulaElegidaTul:   Defaults('CH-Tbl-Bags'),
                    ctxDeclElegidaTul:   Defaults('CH-Tbl-DeclaredBags'),
                    ctxPickTulaTul:      Defaults('CH-Tbl-Bags'),
                    ctxPickDeclTul:      Defaults('CH-Tbl-DeclaredBags'),
                    ctxTulaFrescaTul:    Defaults('CH-Tbl-Bags'),
                    ctxDetalleTul:       Defaults('CH-Tbl-RecountingSessionDetails'),
                    ctxSolicitudPrevTul: Defaults('CH-Tbl-ApprovalRequests'),
                    ctxDlgTulaTul:       false,
                    ctxDlgDeclTul:       false,
                    ctxDlgSinDecTul:     false,
                    ctxEsperandoTul:     false,
                    ctxRechazadaTul:     false
                }
            );
        
            // ===== 2. GLOBALES DE TULA — el hub no tiene tula abierta =====
            Set(gvarTula, Blank());
            Set(gvarSesionDetalle, Blank());
            Set(gvarDeclaredBag, Blank());
            Set(gvarSolicitud, Blank());
        
            // ===== 3. DATOS DE LA SESION (una consulta delegable por universo) =====
            //   El motor btnCargarSesionTul (§5.2) tiene las consultas: aca solo se lo invoca.
            Clear(colTulasCandidatasTul);
            Clear(colDeclaradasCandidatasTul);
            Select(btnCargarSesionTul)
        );
        
        // ===== 4. UI: la galeria y el input NO arrastran la visita anterior =====
        //   Va FUERA de la guarda, siempre: son tres llamadas locales sin costo, y dejar el
        //   input limpio y con foco tambien es lo correcto en el camino de salida.
        Reset(galTulasTul);
        Reset(inpScanTul);
        SetFocus(inpScanTul)

