    btnCargarSesionTul As button:
        BorderThickness: =0
        Color: =ThemeInk
        Fill: =Color.Transparent
        FontWeight: =FontWeight.Semibold
        Height: =1
        HoverFill: =Color.Transparent
        OnSelect: |-
            =// MOTOR: las dos consultas de la sesion, en paralelo.
            // Forma PRINCIPAL de 03 §5.2: el espejo E-1 (RecountingSessionMirror en
            // CH-Tbl-DepositsRecountings) esta DESPLEGADO y backfilled (05-backend-espejos.md),
            // asi que la consulta de depositos delega en 1 salto y las dos ramas son
            // independientes: van en Concurrent.
            Concurrent(
                ClearCollect(
                    colTulasSesionTul,
                    SortByColumns(
                        Filter(
                            'CH-Tbl-Bags',
                            RecountingSession.'CH-Tbl-RecountingSession' = gvarSesion.'CH-Tbl-RecountingSession'
                        ),
                        "modifiedon",
                        SortOrder.Descending
                    )
                ),
                ClearCollect(
                    colDepositosSesionTul,
                    Filter(
                        'CH-Tbl-DepositsRecountings',
                        RecountingSessionMirror.'CH-Tbl-RecountingSession' = gvarSesion.'CH-Tbl-RecountingSession'
                    )
                )
            )
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =Color.Transparent
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =9
        TabIndex: =-1
        Text: =""
        Width: =1
        Y: =767
        ZIndex: =43

    btnResolverDeclaracionTul As button:
        BorderThickness: =0
        Color: =ThemeInk
        Fill: =Color.Transparent
        FontWeight: =FontWeight.Semibold
        Height: =1
        HoverFill: =Color.Transparent
        OnSelect: |-
            =If(
                // ===== (1) SIN DECLARACION: ruta de solicitud al supervisor =====
                CountRows(colDeclaradasCandidatasTul) = 0,
            
                    // ¿ya hay una solicitud de HOY, de este cajero, para este numero de tula?
                    UpdateContext(
                        {
                            ctxSolicitudPrevTul:
                                First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ApprovalRequests',
                                            RequestType = "Tula sin declaracion" &&
                                            BagNumber   = ctxScanTul &&
                                            'Created By'.User = gvarUser.User &&
                                            'Created On' >= Today()
                                        ),
                                        'Created On',
                                        SortOrder.Descending
                                    )
                                )
                        }
                    );
                    If(
                        // ¿es de ESTA tula y de ESTA sesion? Los dos GUID viajan en RequestResources
                        !IsBlank(ctxSolicitudPrevTul.'CH-Tbl-ApprovalRequest') &&
                        !IsBlank(Find(Text(ctxTulaElegidaTul.'CH-Tbl-Bags'), ctxSolicitudPrevTul.RequestResources)) &&
                        !IsBlank(Find(Text(gvarSesion.'CH-Tbl-RecountingSession'), ctxSolicitudPrevTul.RequestResources)),
            
                        If(
                            // sigue pendiente ⇒ NO se duplica: se re-adopta y se vuelve a esperar
                            IsBlank(ctxSolicitudPrevTul.ApprovalStatus),
                                Set(gvarSolicitud, ctxSolicitudPrevTul);
                                UpdateContext({ ctxEsperandoTul: true, ctxRechazadaTul: false }),
            
                            // ya aprobada ⇒ se consume: abrimos sin declaracion.
                            //
                            //   PERO NO SI LA TULA ESTA DEVUELTA. Una aprobacion "de hoy,
                            //   de este cajero, para esta tula y esta sesion" sigue
                            //   calzando despues de una devolucion: no cambia el dia, ni
                            //   el cajero, ni la tula, ni la sesion. El cajero volvia a
                            //   entrar sin que nadie autorizara NADA sobre el nuevo ciclo.
                            //
                            //   El estado es la señal que los distingue, y no hace falta
                            //   una marca nueva: aprobar esta solicitud ASIGNA la tula al
                            //   cajero, asi que una tula que sigue en Devuelta con una
                            //   solicitud aprobada solo puede tener la del ciclo ANTERIOR.
                            //   Cae a la ultima rama y se vuelve a pedir permiso.
                            //
                            //   Las PENDIENTES si se re-adoptan (rama de arriba): esa es
                            //   la del ciclo actual, el cajero esta esperando por ella, y
                            //   duplicarla le crearia dos solicitudes al supervisor.
                            ctxSolicitudPrevTul.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado &&
                            ctxTulaElegidaTul.BagStatus <> 'BagStatus (CH-Tbl-Bags)'.'Devuelta para reasignacion',
                                Set(gvarSolicitud, ctxSolicitudPrevTul);
                                UpdateContext({ ctxDeclElegidaTul: Defaults('CH-Tbl-DeclaredBags') });
                                Select(btnAbrirNuevaTul),
            
                            // rechazada ⇒ el cajero puede volver a pedirla: dialogo B3
                            UpdateContext({ ctxDlgSinDecTul: true })
                        ),
                        UpdateContext({ ctxDlgSinDecTul: true })
                    ),
            
                // ===== (2) MAS DE UNA DECLARACION: el cajero desambigua (dialogo B2) =====
                CountRows(colDeclaradasCandidatasTul) > 1,
                    UpdateContext({ ctxDlgDeclTul: true }),
            
                // ===== (3) EXACTAMENTE UNA: camino feliz, directo al conteo =====
                UpdateContext({ ctxDeclElegidaTul: First(colDeclaradasCandidatasTul) });
                Select(btnAbrirNuevaTul)
            )
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =Color.Transparent
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =9
        TabIndex: =-1
        Text: =""
        Width: =1
        X: =2
        Y: =767
        ZIndex: =44

    btnAbrirNuevaTul As button:
        BorderThickness: =0
        Color: =ThemeInk
        Fill: =Color.Transparent
        FontWeight: =FontWeight.Semibold
        Height: =1
        HoverFill: =Color.Transparent
        OnSelect: |-
            =// ===== 1. RE-LECTURA POR PK: la tula pudo cambiar mientras el cajero decidia =====
            UpdateContext(
                {
                    ctxTulaFrescaTul:
                        LookUp('CH-Tbl-Bags', 'CH-Tbl-Bags' = ctxTulaElegidaTul.'CH-Tbl-Bags')
                }
            );
            
            If(
                // ---- ya no existe ----
                IsBlank(ctxTulaFrescaTul.'CH-Tbl-Bags'),
                    Notify("La tula ya no está disponible. Actualice la lista y vuelva a escanearla.", NotificationType.Error);
                    Reset(inpScanTul);
                    SetFocus(inpScanTul),
            
                // ---- se la llevo otro (o cambio de estado) ----
                //   OJO con la excepcion: cuando la tula va SIN DECLARACION, la
                //   aprobacion del supervisor YA la deja "Asignada a cajero" con esta
                //   misma sesion. El poll ve el visto bueno, manda a abrirla, y esta
                //   guarda la encontraba fuera de boveda y acusaba a otro cajero de
                //   habersela llevado. Se la habia llevado ella misma.
                !(ctxTulaFrescaTul.BagStatus in EstadosTomables) &&
                !(
                    ctxTulaFrescaTul.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero' &&
                    ctxTulaFrescaTul.RecountingSession.'CH-Tbl-RecountingSession' =
                        gvarSesion.'CH-Tbl-RecountingSession'
                ),
                    Notify(
                        "La tula " & ctxTulaFrescaTul.BagID & " ya no está disponible para tomarla: otro cajero pudo llevársela. No se abrió nada.",
                        NotificationType.Error
                    );
                    Reset(inpScanTul);
                    SetFocus(inpScanTul),
            
                // ---- camino feliz ----
                If(
                    IsBlank(ctxDeclElegidaTul.'CH-Tbl-DeclaredBags'),
            
                    // (a) SIN declaracion: BagDeclarationID queda en blanco
                    IfError(
                        Set(
                            gvarTula,
                            If(
                                // La aprobacion ya la dejo asignada a esta sesion: se
                                // toma tal cual. Re-escribir el MISMO estado obliga al
                                // guard del servidor a evaluar una transicion que no
                                // existe, y no hay nada que ganar con eso.
                                ctxTulaFrescaTul.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero' &&
                    ctxTulaFrescaTul.RecountingSession.'CH-Tbl-RecountingSession' =
                        gvarSesion.'CH-Tbl-RecountingSession',
                                ctxTulaFrescaTul,
                                Patch(
                                    'CH-Tbl-Bags',
                                    ctxTulaFrescaTul,
                                    {
                                        BagStatus:         'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero',
                                        RecountingSession: gvarSesion
                                    }
                                )
                            )
                        ),
                        Notify("No se pudo abrir la tula: " & FirstError.Message, NotificationType.Error);
                        Set(gvarTula, Blank())
                    );
                    Set(gvarDeclaredBag, Blank()),
            
                    // (b) CON declaracion: se escribe el enlace en las DOS puntas
                    IfError(
                        Set(
                            gvarTula,
                            Patch(
                                'CH-Tbl-Bags',
                                ctxTulaFrescaTul,
                                {
                                    BagStatus:         'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero',
                                    RecountingSession: gvarSesion,
                                    BagDeclarationID:  ctxDeclElegidaTul
                                }
                            )
                        ),
                        Notify("No se pudo abrir la tula: " & FirstError.Message, NotificationType.Error);
                        Set(gvarTula, Blank())
                    );
                    If(
                        IsBlank(gvarTula.'CH-Tbl-Bags'),
                        Set(gvarDeclaredBag, Blank()),
                        IfError(
                            Set(
                                gvarDeclaredBag,
                                Patch('CH-Tbl-DeclaredBags', ctxDeclElegidaTul, { BagID: gvarTula })
                            ),
                            Notify(
                                "La tula se abrió, pero no se pudo enlazar la declaración: " & FirstError.Message,
                                NotificationType.Error
                            );
                            Set(gvarDeclaredBag, Blank())
                        )
                    )
                );
            
                // ---- 2. sin tula patcheada NO se sigue ----
                If(
                    IsBlank(gvarTula.'CH-Tbl-Bags'),
                    Reset(inpScanTul); SetFocus(inpScanTul),
                    Select(btnEntrarConteoTul)
                )
            )
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =Color.Transparent
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =9
        TabIndex: =-1
        Text: =""
        Width: =1
        X: =4
        Y: =767
        ZIndex: =45

    btnReabrirTul As button:
        BorderThickness: =0
        Color: =ThemeInk
        Fill: =Color.Transparent
        FontWeight: =FontWeight.Semibold
        Height: =1
        HoverFill: =Color.Transparent
        OnSelect: |-
            =// Retomar NO patchea nada: la tula ya es del cajero (o ya esta Recontada).
            //
            // EL Refresh NO ES DECORATIVO. LookUp contra un datasource sirve del CACHE
            // del cliente, y la tula ya esta ahi desde que se cargo colTulasSesionTul.
            // Sin invalidar primero, esta "relectura" devuelve la version VIEJA —con su
            // sesion vieja— y el control de abajo pasa siempre: comprobabamos contra la
            // misma foto que queriamos descartar. Es la forma D-5 que tmrPollCon de 04
            // ya usaba para exactamente esto.
            Refresh('CH-Tbl-Bags');
            IfError(
                Set(gvarTula, LookUp('CH-Tbl-Bags', 'CH-Tbl-Bags' = ctxTulaElegidaTul.'CH-Tbl-Bags')),
                Notify("No se pudo releer la tula: " & FirstError.Message, NotificationType.Error);
                Set(gvarTula, Blank())
            );
            
            If(
                IsBlank(gvarTula.'CH-Tbl-Bags'),
                Notify("La tula ya no está disponible. Toque el botón Actualizar para refrescar la lista.", NotificationType.Error),
            
                // ---- LA TULA PUEDE HABER CAMBIADO DE MANOS ----
                //   colTulasSesionTul es una FOTO del momento en que se cargo la
                //   pantalla, no un vivo. Releer la tula (arriba) no alcanzaba: se
                //   comprobaba solo que EXISTIERA. Si el supervisor la devolvio para
                //   reasignacion mientras la lista estaba en pantalla, la fila seguia
                //   ahi y el cajero volvia a entrar a una tula que ya no es suya.
                //
                //   La pregunta correcta es "¿sigue en MI sesion?", no "¿en que estado
                //   esta?": una devolucion le deja la sesion en blanco, y si otro cajero
                //   la tomo, la sesion es la de el. Una tula Recontada conserva su
                //   sesion, asi que este control no rompe el retome de solo lectura.
                IsBlank(gvarTula.RecountingSession.'CH-Tbl-RecountingSession') ||
                gvarTula.RecountingSession.'CH-Tbl-RecountingSession'
                    <> gvarSesion.'CH-Tbl-RecountingSession',
                    Notify(
                        "La tula " & Trim(gvarTula.BagID) & " ya no está en su sesión: fue devuelta " &
                        "para reasignación. Si la va a recontar, escanéela de nuevo.",
                        NotificationType.Error
                    );
                    Set(gvarTula, Blank());
                    Select(btnCargarSesionTul),
            
                // la declaracion se relee COMPLETA por PK: 04 necesita sus totales, no la anotacion
                If(
                    IsBlank(gvarTula.BagDeclarationID.'CH-Tbl-DeclaredBags'),
                    Set(gvarDeclaredBag, Blank()),
                    Set(
                        gvarDeclaredBag,
                        LookUp(
                            'CH-Tbl-DeclaredBags',
                            'CH-Tbl-DeclaredBags' = gvarTula.BagDeclarationID.'CH-Tbl-DeclaredBags'
                        )
                    )
                );
                Select(btnEntrarConteoTul)
            )
