    btnAbrirTul As button:
        BorderThickness: =0
        Color: =ThemeSurface
        DisabledBorderColor: =Color.Transparent
        DisabledColor: =ThemeInk3
        DisabledFill: =ThemeLineSoft
        DisplayMode: |-
            =If(
                gvarIdentidadOk && !IsBlank(Trim(inpScanTul.Text)),
                DisplayMode.Edit,
                DisplayMode.Disabled
            )
        Fill: =ThemeAccent
        FontWeight: =FontWeight.Semibold
        Height: =44
        HoverFill: =ThemeAccentDark
        OnSelect: |-
            =// ===== 1. Estado limpio: cada escaneo empieza de cero =====
            UpdateContext(
                {
                    ctxScanTul:        Trim(inpScanTul.Text),
                    ctxTulaElegidaTul: Defaults('CH-Tbl-Bags'),
                    ctxDeclElegidaTul: Defaults('CH-Tbl-DeclaredBags'),
                    ctxPickTulaTul:    Defaults('CH-Tbl-Bags'),
                    ctxPickDeclTul:    Defaults('CH-Tbl-DeclaredBags'),
                    ctxDlgTulaTul:     false,
                    ctxDlgDeclTul:     false,
                    ctxDlgSinDecTul:   false
                }
            );
            
            If(
                IsBlank(ctxScanTul),
                Notify("Escanee o digite un número de tula.", NotificationType.Warning),
            
                // ===== 2. DOS consultas delegables, una por universo, en paralelo =====
                Concurrent(
                                ClearCollect(
                                    colTulasCandidatasTul,
                                    SortByColumns(
                                        Filter(
                                            'CH-Tbl-Bags' As T,
                                            T.BagID = ctxScanTul &&
                                            (
                                                T.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda' ||
                                                T.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Devuelta para reasignacion' ||
                                                T.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa'  ||
                                                T.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero'
                                            )
                                        ),
                                        "createdon",
                                        SortOrder.Descending
                                    )
                                ),
                                ClearCollect(
                                    colDeclaradasCandidatasTul,
                                    SortByColumns(
                                        Filter(
                                            'CH-Tbl-DeclaredBags' As D,
                                            D.BagNumber = ctxScanTul && IsBlank(D.BagID)
                                        ),
                                        "createdon",
                                        SortOrder.Descending
                                    )
                                )
                );
            
                // ===== 3. La decision, en un solo If encadenado =====
                If(
                    // (A) no hay ninguna tula recontable con ese numero
                    CountRows(colTulasCandidatasTul) = 0,
                        Notify(
                            "La tula " & ctxScanTul & " no está disponible para reconteo: no existe, no fue recibida o ya fue recontada.",
                            NotificationType.Error
                        );
                        Reset(inpScanTul);
                        SetFocus(inpScanTul),
            
                    // (B) homonimas: el cajero desambigua (dialogo B1)
                    CountRows(colTulasCandidatasTul) > 1,
                        UpdateContext({ ctxDlgTulaTul: true }),
            
                    // (C) una sola, y ya esta abierta en ESTA sesion: se retoma
                    First(colTulasCandidatasTul).BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero' &&
                    First(colTulasCandidatasTul).RecountingSession.'CH-Tbl-RecountingSession'
                        = gvarSesion.'CH-Tbl-RecountingSession',
                        UpdateContext({ ctxTulaElegidaTul: First(colTulasCandidatasTul) });
                        Select(btnReabrirTul),
            
                    // (D) una sola, pero no se puede abrir
                    !(First(colTulasCandidatasTul).BagStatus in EstadosTomables),
                        Notify(
                            "La tula " & ctxScanTul & " no está disponible para tomarla: puede estar todavía en esclusa o asignada a otro cajero.",
                            NotificationType.Warning
                        );
                        Reset(inpScanTul);
                        SetFocus(inpScanTul),
            
                    // (E) una sola, en boveda: seguimos con la declaracion
                    UpdateContext({ ctxTulaElegidaTul: First(colTulasCandidatasTul) });
                    Select(btnResolverDeclaracionTul)
                )
            )
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =ThemeAccentDark
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
