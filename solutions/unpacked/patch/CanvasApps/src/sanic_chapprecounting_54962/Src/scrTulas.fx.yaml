        ZIndex: =47

    tmrVigilaSesionTul As timer:
        BorderThickness: =0
        Color: =ThemeInk
        Duration: =20000
        Fill: =Color.Transparent
        Height: =1
        HoverFill: =Color.Transparent
        OnTimerEnd: |-
            =// VIGILA QUE LA SESION SIGA VIVA, desde la lista de tulas.
            //   El vigilante que ya existia (tmrVigilaTulaCon) vive en la pantalla de
            //   CONTEO y arranca solo con una tula abierta. Un cajero parado en esta
            //   lista —sin tula, sin solicitud pendiente— no tenia NADA que lo
            //   controlara: el supervisor le cerraba la sesion y el no se enteraba
            //   hasta que intentara algo. La comprobacion de OnVisible tampoco
            //   alcanza: corre al ENTRAR, y aca el cajero se queda.
            //
            //   Refresh antes del LookUp: sin invalidar el cache se relee la copia
            //   local y la sesion parece viva para siempre.
            Refresh('CH-Tbl-RecountingSessions');
            If(
                LookUp(
                    'CH-Tbl-RecountingSessions',
                    'CH-Tbl-RecountingSession' = gvarSesion.'CH-Tbl-RecountingSession'
                ).SessionForciblyClosed,
                Notify(
                    "Su sesión de recuento fue cerrada por un supervisor. Abra una sesión " &
                    "nueva para seguir trabajando; las tulas que tenía en la mesa quedaron " &
                    "libres para reasignar.",
                    NotificationType.Error,
                    6000
                );
                Set(gvarSesion, Blank());
                Set(gvarTula, Blank());
                Set(gvarSesionDetalle, Blank());
                Navigate(scrSesion)
            )
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =Color.Transparent
        Repeat: =true
        Start: |-
            =// Corre SIEMPRE que haya sesion, tambien mientras el cajero espera una
            // aprobacion: que la sesion muera justo en esa espera es de los peores
            // momentos para no enterarse.
            !IsBlank(gvarSesion.'CH-Tbl-RecountingSession')
        TabIndex: =-1
        Text: =""
        Visible: =false
        Width: =1
        X: =14
        Y: =767
        ZIndex: =55

    tmrPollTul As timer:
        BorderThickness: =0
        Color: =ThemeInk
        Duration: =15000
        Fill: =Color.Transparent
        Height: =1
        HoverFill: =Color.Transparent
        OnTimerEnd: |-
            =// UNA consulta delegable, por PK. OnTimerStart queda VACIO: cero Refresh por tick.
            Set(
                gvarSolicitud,
                LookUp(
                    'CH-Tbl-ApprovalRequests',
                    'CH-Tbl-ApprovalRequest' = gvarSolicitud.'CH-Tbl-ApprovalRequest'
                )
            );
            If(
                // ---- APROBADO: se abre la tula, sin declaracion ----
                gvarSolicitud.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado,
                    Refresh('CH-Tbl-Bags');
                    UpdateContext(
                        {
                            ctxEsperandoTul:   false,
                            ctxRechazadaTul:   false,
                            ctxDeclElegidaTul: Defaults('CH-Tbl-DeclaredBags')
                        }
                    );
                    Select(btnAbrirNuevaTul),
            
                // ---- RECHAZADO: BLOQUEA, no libera ----
                gvarSolicitud.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Rechazado,
                    Refresh('CH-Tbl-Bags');
                    UpdateContext({ ctxEsperandoTul: false, ctxRechazadaTul: true }),
            
                // ---- ni una ni otra: SIGUE PENDIENTE. No se hace NADA ----
                false
            )
        PressedFill: =Color.Transparent
        Repeat: =true
        Size: =9
        Start: =ctxEsperandoTul && !IsBlank(gvarSolicitud.'CH-Tbl-ApprovalRequest')
        Text: =""
        Visible: =false
        Width: =1
        X: =10
        Y: =767
        ZIndex: =48

