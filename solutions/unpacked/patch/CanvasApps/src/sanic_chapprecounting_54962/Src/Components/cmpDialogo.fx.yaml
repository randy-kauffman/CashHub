cmpDialogo As CanvasComponent:
    OnCancelar():
        ThisProperty:
            Default: =
    OnConfirmar():
        ThisProperty:
            Default: =
    AnchoCard: =400
    Contorno: =false
    Fill: =ThemeOverlay
    Height: =768
    Icono: =""
    MostrarCerrar: =true
    Peligro: =false
    Subtitulo: =""
    TextoCancelar: ="Cancelar"
    TextoConfirmar: ="Continuar"
    Titulo: ="¿Confirmás?"
    Tono: ="info"
    Width: =1366
    X: =0
    Y: =0
    ZIndex: =1

    btnBloqueoDlg As button:
        BorderThickness: =0
        Color: =ThemeInk
        Fill: =Color.Transparent
        Height: =Parent.Height
        HoverFill: =Color.Transparent
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =Color.Transparent
        Size: =9
        TabIndex: =-1
        Text: =""
        Width: =Parent.Width
        ZIndex: =1

    cntCardDlg As groupContainer.manualLayoutContainer:
        BorderColor: =ThemeLine
        BorderThickness: =1
        DropShadow: =DropShadow.Regular
        Fill: =ThemeSurface
        Height: =btnConfirmarDlg.Y + btnConfirmarDlg.Height + 19
        RadiusBottomLeft: =13
        RadiusBottomRight: =13
        RadiusTopLeft: =13
        RadiusTopRight: =13
        Width: =cmpDialogo.AnchoCard
        X: =(Parent.Width - Self.Width) / 2
        Y: =(Parent.Height - Self.Height) / 2
        ZIndex: =2

        btnIcoDlg As button:
            BorderThickness: =0
            Color: =ThemeInk
            DisplayMode: =DisplayMode.View
            Fill: =Switch(cmpDialogo.Tono, "ok", ThemeOkSoft, "warn", ThemeWarnSoft, "danger", ThemeDangerSoft, ThemeInfoSoft)
            Height: =34
            HoverFill: =Switch(cmpDialogo.Tono, "ok", ThemeOkSoft, "warn", ThemeWarnSoft, "danger", ThemeDangerSoft, ThemeInfoSoft)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedFill: =Switch(cmpDialogo.Tono, "ok", ThemeOkSoft, "warn", ThemeWarnSoft, "danger", ThemeDangerSoft, ThemeInfoSoft)
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Size: =9
            Text: =""
            Visible: =!IsBlank(cmpDialogo.Icono)
            Width: =34
            X: =22
            Y: =17
            ZIndex: =1

        icoTipoDlg As icon:
            Color: =Switch(cmpDialogo.Tono, "ok", ThemeOk, "warn", ThemeWarn, "danger", ThemeDanger, ThemeInfo)
            Height: =18
            Icon: =Switch(cmpDialogo.Icono, "check", Icon.Check, "lock", Icon.Lock, "trash", Icon.Trash, "sync", Icon.Sync, "blocked", Icon.Blocked, "warning", Icon.Warning, Icon.Information)
            Visible: =btnIcoDlg.Visible
            Width: =18
            X: =btnIcoDlg.X + 8
            Y: =btnIcoDlg.Y + 8
            ZIndex: =2

        lblTituloDlg As label:
            AutoHeight: =true
            Color: =ThemeInk
            FontWeight: =FontWeight.Bold
            Height: =22
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =10.88
            Text: =cmpDialogo.Titulo
            Width: =Parent.Width - Self.X - 44
            X: =If(IsBlank(cmpDialogo.Icono), 22, btnIcoDlg.X + btnIcoDlg.Width + 10)
            Y: =17
            ZIndex: =3

        lblSubtituloDlg As label:
            AutoHeight: =true
            Color: =ThemeInk2
            Height: =54
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =9
            Text: =cmpDialogo.Subtitulo
            VerticalAlign: =VerticalAlign.Top
            Visible: =!IsBlank(cmpDialogo.Subtitulo)
            Width: =Parent.Width - Self.X - 22
            X: =lblTituloDlg.X
            Y: =lblTituloDlg.Y + lblTituloDlg.Height + 6
            ZIndex: =4

        icoCerrarDlg As icon:
            AccessibleLabel: ="Cerrar"
            Color: =ThemeInk3
            Height: =18
            HoverColor: =ThemeInk
            Icon: =Icon.Cancel
            OnSelect: =Select(btnCancelarDlg)
            TabIndex: =0
            Visible: =cmpDialogo.MostrarCerrar
            Width: =18
            X: =Parent.Width - 36
            Y: =17
            ZIndex: =5

        btnCancelarDlg As button:
            BorderColor: =ThemeLine
            BorderThickness: =1
            Color: =ThemeInk2
            DisabledBorderColor: =Color.Transparent
            DisabledColor: =ThemeInk3
            DisabledFill: =ThemeLineSoft
            Fill: =Color.Transparent
            FontWeight: =FontWeight.Semibold
            Height: =32
            HoverFill: =ThemeSurface2
            OnSelect: =cmpDialogo.OnCancelar()
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedFill: =ThemeSurface2
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =9
            Text: =cmpDialogo.TextoCancelar
            Width: =14 + 6.6 * Len(Self.Text)
            X: =btnConfirmarDlg.X - 8 - Self.Width
            Y: =btnConfirmarDlg.Y
            ZIndex: =6

        btnConfirmarDlg As button:
            BorderColor: =ThemeAccent
            BorderThickness: =If(cmpDialogo.Contorno, 1, 0)
            Color: =If(cmpDialogo.Contorno, ThemeAccent, ThemeSurface)
            DisabledBorderColor: =Color.Transparent
            DisabledColor: =ThemeInk3
            DisabledFill: =ThemeLineSoft
            Fill: =If(cmpDialogo.Contorno, ThemeSurface, If(cmpDialogo.Peligro, ThemeDanger, ThemeAccent))
            FontWeight: =FontWeight.Semibold
            Height: =32
            HoverFill: =If(cmpDialogo.Contorno, ThemeAccentSoft, If(cmpDialogo.Peligro, ThemeDanger, ThemeAccentDark))
            OnSelect: =cmpDialogo.OnConfirmar()
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedFill: =If(cmpDialogo.Contorno, ThemeAccentSoft, If(cmpDialogo.Peligro, ThemeDanger, ThemeAccentDark))
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =9
            Text: =cmpDialogo.TextoConfirmar
            Width: =14 + 6.6 * Len(Self.Text)
            X: =Parent.Width - 22 - Self.Width
            Y: =lblSubtituloDlg.Y + lblSubtituloDlg.Height + 20
            ZIndex: =7

