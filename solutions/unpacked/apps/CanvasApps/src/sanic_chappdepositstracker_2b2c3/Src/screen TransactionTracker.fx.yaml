                        AlignInContainer: =AlignInContainer.Start
                        BasePaletteColor: =RGBA(189, 178, 176, 1)
                        BorderColor: =
                        DisplayMode: =DisplayMode.Edit
                        FontColor: =
                        Height: =32
                        Icon: ="Search"
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =32
                        LayoutMinWidth: =96
                        OnSelect: |
                            =UpdateContext({varScreenSpinnerLabel: "Cargando..."});
                            Switch(
                                DropdownCanvas1.Selected.Value,
                                ///////Lote de recepcion////////
                                "Lote de recepcion",
                                Set(
                                    gvarSelectedBag,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedReceptionID,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedDetail,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedRB,
                                    LookUp(
                                        'CH-Tbl-ReceptionBatches',
                                        Upper(Trim(TextInputCanvas1.Value)) = Name
                                    )
                                );
                                ,
                                "Planilla",
                                Set(
                                    gvarSelectedBag,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedReceptionID,
                                    LookUp(
                                        'CH-Tbl-Receptions',
                                        ReceiptID = Upper(Trim(TextInputCanvas1.Value))
                                    )
                                );
                                Set(
                                    gvarSelectedDetail,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedRB,
                                    Blank()
                                );
                                If(
                                    IsBlank(gvarSelectedReceptionID),
                                    Notify(
                                        "Planilla no encontrada",
                                        Icon.Warning
                                    ),
                                    Set(
                                        gvarSelectedRB,
                                        gvarSelectedReceptionID.ReceptionBatch
                                    );
                                ),
                                "Tula",
                                Set(
                                    gvarSelectedBag,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedReceptionID,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedDetail,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedRB,
                                    Blank()
                                );
                                Set(
                                    gvarSelectedBag,
                                    LookUp(
                                        'CH-Tbl-Bags',
                                        BagID = Upper(Trim(TextInputCanvas1.Value))
                                    )
                                );
                                If(
                                    IsBlank(gvarSelectedBag),
                                    Notify(
                                        "Tula no encontrada",
                                        Icon.Warning
                                    ),
                                    Set(
                                        gvarSelectedReceptionID,
                                        gvarSelectedBag.ReceptionID
                                    );
                                    Set(
                                        gvarSelectedRB,
                                        gvarSelectedReceptionID.ReceptionBatch
                                    );
                                )
                            );
                            UpdateContext({varScreenSpinnerLabel: ""});
                        Text: ="Search"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =96
                        X: =0
                        Y: =0
                        ZIndex: =1

