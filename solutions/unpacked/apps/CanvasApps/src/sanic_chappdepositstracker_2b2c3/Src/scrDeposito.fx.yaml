            Size: =8.5
            Text: |-
                ="Un depósito puede generar más de una transacción: el monto recontado viaja como Deposito y las diferencias como Faltante o Sobrante. Si la tula llegó sin declaración, la transacción nace como Sin declaracion."
            Width: =shpTxsCard.Width * 0.96966
            X: =shpTxsCard.X + shpTxsCard.Width * 0.01517
            Y: =shpTxsCard.Y + shpTxsCard.Height - 38
