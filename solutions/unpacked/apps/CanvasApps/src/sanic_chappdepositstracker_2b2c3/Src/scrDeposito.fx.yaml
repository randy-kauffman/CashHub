        galTxs As gallery.galleryVertical:
            BorderColor: =App.Theme.Colors.Darker40
            DelayItemLoading: =true
            Height: =lblTxsNota.Y - 8 - Self.Y
            Items: =Filter('CH-Tbl-Transactions', RelatedDepositRecounting.'CH-Tbl-DepositsRecounting' = gvarDep.'CH-Tbl-DepositsRecounting')
            Layout: =Layout.Vertical
            LoadingSpinner: =LoadingSpinner.Data
            TemplatePadding: =0
            TemplateSize: =42
            Width: =shpTxsCard.Width * 0.96966
            X: =shpTxsCard.X + shpTxsCard.Width * 0.01517
            Y: =320
            ZIndex: =14

            shpXFilaSep As rectangle:
                BorderColor: =App.Theme.Colors.Darker40
                Fill: =ThemeLineSoft
                Height: =1
                OnSelect: =Select(Parent)
                Width: =Parent.TemplateWidth
                Y: =41
                ZIndex: =2

            lblXFilaId As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Semibold
                Height: =22
                OnSelect: =Select(Parent)
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =10
                Text: =ThisItem.Name
                Width: =Parent.TemplateWidth * 0.10172
                Y: =10
                ZIndex: =3

            pilXFilaTipo As button:
                BorderColor: =ThemeLineSoft
                BorderThickness: =If(Self.Fill = ThemeSurface2, 1, 0)
                Color: =Switch(ThisItem.TransactionType, 'TransactionType (CH-Tbl-Transactions)'.Deposito, ThemeInfo, 'TransactionType (CH-Tbl-Transactions)'.Faltante, ThemeCrit, 'TransactionType (CH-Tbl-Transactions)'.Sobrante, ThemeWarn, ThemeInk2)
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                DisplayMode: =DisplayMode.View
                Fill: =Switch(ThisItem.TransactionType, 'TransactionType (CH-Tbl-Transactions)'.Deposito, ThemeInfoSoft, 'TransactionType (CH-Tbl-Transactions)'.Faltante, ThemeCritSoft, 'TransactionType (CH-Tbl-Transactions)'.Sobrante, ThemeWarnSoft, ThemeSurface2)
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Semibold
                Height: =26
