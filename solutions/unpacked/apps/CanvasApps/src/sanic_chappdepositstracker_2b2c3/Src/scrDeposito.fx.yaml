        pilDepDif As button:
            BorderColor: =ThemeLineSoft
            BorderThickness: =If(Self.Fill = ThemeSurface2, 1, 0)
            Color: |+
                =With({
                    _dif: (gvarDep.CashAmount + gvarDep.BACLocalCheckAmount + gvarDep.OtherLocaCheckAmount)
                        - (gvarDep.decEf + gvarDep.decBac + gvarDep.decOtr)},
                If(Abs(_dif) < 0.005, ThemeOk, ThemeCrit))
                
                
            DisabledBorderColor: =RGBA(244, 244, 244, 1)
            DisabledColor: =RGBA(166, 166, 166, 1)
            DisabledFill: =RGBA(244, 244, 244, 1)
            DisplayMode: =DisplayMode.View
            Fill: |+
                =With({
                    _dif: (gvarDep.CashAmount + gvarDep.BACLocalCheckAmount + gvarDep.OtherLocaCheckAmount)
                        - (gvarDep.decEf + gvarDep.decBac + gvarDep.decOtr)},
                If(Abs(_dif) < 0.005, ThemeOkSoft, ThemeCritSoft))
                
                
            Font: =App.Theme.Font
            FontWeight: =FontWeight.Semibold
            Height: =26
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =App.Theme.Colors.Darker10
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =App.Theme.Colors.Darker40
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Size: =9
            Text: |-
                =// pilDepDif.Text — la diferencia del depósito, CON símbolo de moneda
                With({
                    _dif: (gvarDep.CashAmount + gvarDep.BACLocalCheckAmount + gvarDep.OtherLocaCheckAmount)
                        - (gvarDep.decEf + gvarDep.decBac + gvarDep.decOtr),
                    _sim: Switch(gvarDep.Currency,
                        'CH-Ch-Currency'.NIO, SimboloNIO,
                        'CH-Ch-Currency'.USD, SimboloUSD,
                        SimboloEUR)},
                If(Abs(_dif) < 0.005, "Sin diferencia",
                   If(_dif < 0, $"Faltante {_sim} {Text(Abs(_dif), FmtMoney)}",
                      $"Sobrante {_sim} {Text(_dif, FmtMoney)}")))
            Width: =shpFichaCardDep.Width * 0.19727
            X: =shpFichaCardDep.X + shpFichaCardDep.Width * 0.33839
            Y: =110
            ZIndex: =27

