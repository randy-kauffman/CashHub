                Properties:
                  Fill: =ThemeLineSoft
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =600
                  Y: =41
            - lblTFilaId:
                Control: Label@2.5.1
                Properties:
                  Color: =ThemeInk
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =10
                  Text: =ThisItem.BagID
                  Width: =140
                  Wrap: =false
                  Y: =10
            - pilTFilaEstado:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ThemeLineSoft
                  BorderThickness: =If(Self.Fill = ThemeSurface2, 1, 0)
                  Color: |-
                    =Switch(
                        ThisItem.BagStatus,
                        'BagStatus (CH-Tbl-Bags)'.Recontada,
                        ThemeOk,
                        'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero',
                        ThemeWarn,
                        'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa',
                        ThemeInfo,
                        'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda',
                        ThemeInfo,
                        ThemeCrit
                    )
                  DisplayMode: =DisplayMode.View
                  Fill: =Switch(ThisItem.BagStatus, 'BagStatus (CH-Tbl-Bags)'.Recontada, ThemeOkSoft, 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero', ThemeWarnSoft, 'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa', ThemeInfoSoft, 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda', ThemeInfoSoft, ThemeCritSoft)
                  Height: =26
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Size: =9
                  Text: =ThisItem.BagStatus
                  Width: =8 + 7*Len(Self.Text)
                  X: =140 + (lblTCol2.Width - Self.Width) / 2
                  Y: =8
            - pilTFilaDif:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ThemeLineSoft
                  BorderThickness: =If(Self.Fill = ThemeSurface2, 1, 0)
                  Color: =If(ThisItem.BagStatus <> 'BagStatus (CH-Tbl-Bags)'.Recontada, ThemeInk2, If(ThisItem.HasDifference, ThemeCrit, ThemeOk))
                  DisplayMode: =DisplayMode.View
                  Fill: =If(ThisItem.BagStatus <> 'BagStatus (CH-Tbl-Bags)'.Recontada, ThemeSurface2, If(ThisItem.HasDifference, ThemeCritSoft, ThemeOkSoft))
                  Height: =26
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Size: =9
                  Text: =If(ThisItem.BagStatus <> 'BagStatus (CH-Tbl-Bags)'.Recontada, "Pendiente", If(ThisItem.HasDifference, "Con diferencia", "Sin diferencia"))
