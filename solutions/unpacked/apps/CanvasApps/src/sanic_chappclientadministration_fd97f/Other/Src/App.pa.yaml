App:
  Properties:
    OnStart: |-
      =Set(
          gvarSideMenu,
          Table(
              {
                  Icon: "People",
                  Label: "Clientes",
                  Screen: 'screen Clients',
                  Tooltip: "Power Apps Tooltip"
              },
              {
                  Icon: "BranchCompare",
                  Label: "Solicitudes de cambio",
                  Screen: 'screen RFC',
                  Tooltip: "Power BI Tooltip"
              }
          )
      );


      //ClearCollect(colAADGroups, Office365Groups.ListOwnedGroupsV3().value);

      // Membresia por checkMemberGroups (transitiva, en lotes de 20): reemplaza el ForAll +
      // ListGroupMembers serial que hacia N llamadas y perdia usuarios mas alla de la pagina 1.
      // Fail-CLOSED: si Graph falla no se otorga ningun permiso (los botones de crear/aprobar RFC
      // no aparecen) y se avisa. El gate real es el GuardChangeRequestApprovalPlugin server-side.
      Clear(colClientDataPermissions);
      Clear(colMyGroupIds);
      Set(gvarPermError, false);
      ClearCollect(
          colPermGroupIds,
          Distinct(
              Filter('CH-Tbl-ClientDataChangePermissions', !IsBlank(AADGroupID)),
              Substitute(Trim(AADGroupID), " ", "")
          )
      );
      ForAll(
          Sequence(RoundUp(CountRows(colPermGroupIds) / 20, 0)) As batch,
          IfError(
              Collect(
                  colMyGroupIds,
                  ForAll(
                      Table(
                          Office365Groups.HttpRequest(
                              "https://graph.microsoft.com/v1.0/me/checkMemberGroups",
                              "POST",
                              "{""groupIds"": [" &
                                  Concat(
                                      LastN(
                                          FirstN(colPermGroupIds, batch.Value * 20),
                                          Min(20, CountRows(colPermGroupIds) - (batch.Value - 1) * 20)
                                      ),
                                      """" & Value & """",
                                      ","
                                  ) &
                              "]}"
                          ).value
                      ),
                      {GroupId: Text(Value)}
                  )
              ),
              Set(gvarPermError, true)
          )
      );
      If(
          gvarPermError,
          Notify(
              "No se pudieron verificar tus permisos (Graph). Recarga la app; si persiste, avisa a soporte.",
              NotificationType.Warning
          ),
          ClearCollect(
              colClientDataPermissions,
              Filter(
                  'CH-Tbl-ClientDataChangePermissions' As Permission,
                  Substitute(Trim(Permission.AADGroupID), " ", "") in colMyGroupIds.GroupId
              )
          )
      );

      Set(
          gvarUser,
          LookUp(
              Users,
              'Primary Email' = User().Email
          )
      );
      If(
          !IsBlank(Param("RFC")),
          Set(
              gvarSelectedChangeRequest,
              LookUp(
                  'CH-Tbl-ClientDataChangeRequests',
                  'CH-Tbl-ClientDataChangeRequest' = GUID(Param("RFC"))
              )
          );
          Set(gvarSelectedClient, gvarSelectedChangeRequest.RelatedClient)
      )
    StartScreen: ='screen Splash'
    Theme: =PowerAppsTheme
