      - formRFC_Cliente_1:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            DataSource: ='CH-Tbl-ClientDataChangeRequests'
            Fill: =RGBA(255, 255, 255, 1)
            Height: =341
            OnFailure: |-
              =UpdateContext({varShowScreenSpinner: false, varShowScreenSpinnerLabel: "",varShowSidePanel: false});
              UpdateContext(
                      {
                          varShowSidePanel: Blank(),
                          varRelatedClient: Blank(),
                          varTargetRecordID: Blank(),
                          varChangeStatus: Blank(),
                          varReason: Blank(),
                          varTargetTable: Blank(),
                          varTablePluralName: Blank(),
                          varRFCType: Blank(),
                          varTableDisplayName: Blank(),
                           varShowScreenSpinner: false
                      }
                  );
            OnReset: |-
              =UpdateContext({varShowScreenSpinner: false, varShowScreenSpinnerLabel: "",varShowSidePanel: false});
              UpdateContext(
                      {
                          varShowSidePanel: Blank(),
                          varRelatedClient: Blank(),
                          varTargetRecordID: Blank(),
                          varChangeStatus: Blank(),
                          varReason: Blank(),
                          varTargetTable: Blank(),
                          varTablePluralName: Blank(),
                          varRFCType: Blank(),
                          varTableDisplayName: Blank(),
                           varShowScreenSpinner: false
                      }
                  );
            OnSuccess: "=UpdateContext({varRFC: formRFC_Cliente_1.LastSubmit});\nNotify(\n    \"RFC creado con exito\",\n    NotificationType.Success\n);\nIf(\n    varRFC.Type = 'Type (CH-Tbl-ClientDataChangeRequests)'.Create,\n    Switch(\n        varTableDisplayName,\n        \"Sucursales\",\n//Name\n        Patch(\n            'CH-Tbl-ClientDataChangeRequestLines',\n            Defaults('CH-Tbl-ClientDataChangeRequestLines'),\n            {\n                NewValue: Trim(DataCardValue2.Text),\n                ChangeRequestID: varRFC,\n                'Field Definition': LookUp(\n                    'CH-Tbl-ClientTableLogicalFieldNames',\n                    Name = \"Sucursal\" && Table = \"sanic_chtblclientbranch\"\n                ),\n                ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted\n            }\n        );\n        //Cliente\nPatch(\n            'CH-Tbl-ClientDataChangeRequestLines',\n            Defaults('CH-Tbl-ClientDataChangeRequestLines'),\n            {\n                NewValue: gvarSelectedClient.'CH-Tbl-Client',\n                ChangeRequestID: varRFC,\n                'Field Definition': LookUp(\n                    'CH-Tbl-ClientTableLogicalFieldNames',\n                    Name = \"Cliente\" && Table = \"sanic_chtblclientbranch\"\n                ),\n                ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted\n            }\n        );\n        ,\n        \"Emails\",\n    //Email\n        Patch(\n            'CH-Tbl-ClientDataChangeRequestLines',\n            Defaults('CH-Tbl-ClientDataChangeRequestLines'),\n            {\n                NewValue: Trim(DataCardValue5.Text),\n                ChangeRequestID: varRFC,\n                'Field Definition': LookUp(\n                    'CH-Tbl-ClientTableLogicalFieldNames',\n                    Name = \"Correo electronico\" && Table = \"sanic_chtblclientemail\"\n                ),\n                ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted\n            }\n        );\n        //Cliente\nPatch(\n            'CH-Tbl-ClientDataChangeRequestLines',\n            Defaults('CH-Tbl-ClientDataChangeRequestLines'),\n            {\n                NewValue: gvarSelectedClient.'CH-Tbl-Client',\n                ChangeRequestID: varRFC,\n                'Field Definition': LookUp(\n                    'CH-Tbl-ClientTableLogicalFieldNames',\n                    Name = \"Cliente\" && Table = \"sanic_chtblclientemail\"\n                ),\n                ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted\n            }\n        );\n        //AlwaysNotify\nPatch(\n            'CH-Tbl-ClientDataChangeRequestLines',\n            Defaults('CH-Tbl-ClientDataChangeRequestLines'),\n            {\n                NewValue: Text(DataCardValue8.Selected.Value),\n                ChangeRequestID: varRFC,\n                'Field Definition': LookUp(\n                    'CH-Tbl-ClientTableLogicalFieldNames',\n                    Name = \"Notificar siempre\" && Table = \"sanic_chtblclientemail\"\n                ),\n                ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted\n            }\n        );\n    );\n    \n);\nUpdateContext(\n    {\n        varShowScreenSpinner: false,\n        varShowScreenSpinnerLabel: \"\",\n        varShowSidePanel: false\n    }\n);\nUpdateContext(\n    {\n        varShowSidePanel: Blank(),\n        varRelatedClient: Blank(),\n        varTargetRecordID: Blank(),\n        varChangeStatus: Blank(),\n        varReason: Blank(),\n        varTargetTable: Blank(),\n        varTablePluralName: Blank(),\n        varRFCType: Blank(),\n        varTableDisplayName: Blank(),\n        varShowScreenSpinner: false,\n        varDialogEditShow: false,\n        varDialogActivateShow: false\n    }\n);\nResetForm(formSucursales);\nResetForm(formCorreos);\nReset(txtInp);\nIf(\n    varRFC.Type = 'Type (CH-Tbl-ClientDataChangeRequests)'.Update,\n    Set(\n        gvarSelectedChangeRequest,\n        varRFC\n    );\n    Navigate(\n        'screen ChangeRequestDetails',\n        ScreenTransition.Fade,{ FromScreen: App.ActiveScreen }\n    )\n);\n"
