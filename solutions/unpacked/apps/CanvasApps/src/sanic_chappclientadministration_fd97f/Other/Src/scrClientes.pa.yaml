Screens:
  scrClientes:
    Properties:
      Fill: =ThemeBg
      OnVisible: |-
        =// 1) Estado local a default (gotcha 8.3 — no arrastrar estado de la visita anterior)
        UpdateContext({
            ctxSegEstadoCli: "Activos",
            ctxPagCli: 1,
            ctxPagTamCli: 50,
            ctxOrdenAscCli: true,
            ctxPanelAltaCli: false,
            ctxGuardandoCli: false
        });
        Reset(inpBusqCli);
        // 2) RFCs sin resolver (badge "RFC en curso" + KPIs) — acotada por ESTADO server-side.
        //    Filtro delegable: ORs sobre el mismo picklist. Se re-ejecuta al volver de crear
        //    una solicitud (el boton del panel la refresca, y este OnVisible tambien).
        ClearCollect(
            colRfcEnCursoCli,
            Filter(
                'CH-Tbl-ClientDataChangeRequests',
                'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft
                || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted
                || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved
            )
        );
        // 3) Listado inicial: segmento "Activos", sin texto de busqueda (Search con "" devuelve todo)
        ClearCollect(
            colClientesCli,
            Search(
                Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active),
                Trim(inpBusqCli.Text),
                Name, CIFBCO, CIFCOM
            )
        )
    Children:
      - cmpAppHeaderCli:
          Control: CanvasComponent
          ComponentName: cmpAppHeader
          Properties:
            Activo: ="Clientes"
            Height: =fxHeaderH
            OnClientes: =false
            OnSolicitudes: =Navigate(scrSolicitudes, ScreenTransition.None)
            RolTexto: =gvarRolTexto
            Subtitulo: ="Maestro de clientes"
            Titulo: ="Administración de Clientes"
            Width: =Parent.Width
      - cntToolbarCli:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =54
            Width: =Parent.Width
            Y: =fxHeaderH
          Children:
            - cntSegEstadoCli:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface2
                  Height: =34
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  Width: =btnSegTodosCli.X + btnSegTodosCli.Width + 3
                  X: =fxGutter
                  Y: =(Parent.Height - 34)/2
                Children:
                  - btnSegTodosCli:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ctxSegEstadoCli = "Todos", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        Fill: =If(ctxSegEstadoCli = "Todos", ThemeSurface, Color.Transparent)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ctxSegEstadoCli = "Todos", FontWeight.Semibold, FontWeight.Normal)
                        Height: =28
                        HoverFill: =If(ctxSegEstadoCli = "Todos", ThemeSurface, ThemeSurface2)
                        OnSelect: |-
                          =UpdateContext({ctxSegEstadoCli: "Todos", ctxPagCli: 1});
                          ClearCollect(
                              colClientesCli,
                              Search('CH-Tbl-Clients', Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM)
                          )
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Todos"
                        Width: =Len(Self.Text) * 6 + 22
                        X: =btnSegPendientesCli.X + btnSegPendientesCli.Width + 3
                        Y: =3
                  - btnSegPendientesCli:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ctxSegEstadoCli = "Pendientes", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        Fill: =If(ctxSegEstadoCli = "Pendientes", ThemeSurface, Color.Transparent)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ctxSegEstadoCli = "Pendientes", FontWeight.Semibold, FontWeight.Normal)
                        Height: =28
                        HoverFill: =If(ctxSegEstadoCli = "Pendientes", ThemeSurface, ThemeSurface2)
                        OnSelect: |-
                          =UpdateContext({ctxSegEstadoCli: "Pendientes", ctxPagCli: 1});
                          ClearCollect(
                              colClientesCli,
                              Search(
                                  Filter(
                                      'CH-Tbl-Clients',
                                      RecordStatus = 'CH-Ch-RecordStatus'.PendingApproval
                                      || RecordStatus = 'CH-Ch-RecordStatus'.PendingDeactivation
                                  ),
                                  Trim(inpBusqCli.Text),
                                  Name, CIFBCO, CIFCOM
                              )
                          )
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: |-
                          ="Pendientes (" & CountRows(
                              Filter(
                                  'CH-Tbl-Clients',
                                  RecordStatus = 'CH-Ch-RecordStatus'.PendingApproval
                                  || RecordStatus = 'CH-Ch-RecordStatus'.PendingDeactivation
                              )
                          ) & ")"
                        Width: =Len(Self.Text) * 6 + 22
                        X: =btnSegInactivosCli.X + btnSegInactivosCli.Width + 3
                        Y: =3
                  - btnSegInactivosCli:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ctxSegEstadoCli = "Inactivos", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        Fill: =If(ctxSegEstadoCli = "Inactivos", ThemeSurface, Color.Transparent)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ctxSegEstadoCli = "Inactivos", FontWeight.Semibold, FontWeight.Normal)
                        Height: =28
                        HoverFill: =If(ctxSegEstadoCli = "Inactivos", ThemeSurface, ThemeSurface2)
                        OnSelect: |-
                          =UpdateContext({ctxSegEstadoCli: "Inactivos", ctxPagCli: 1});
                          ClearCollect(
                              colClientesCli,
                              Search(
                                  Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Inactive),
                                  Trim(inpBusqCli.Text),
                                  Name, CIFBCO, CIFCOM
                              )
                          )
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Inactivos (" & CountRows(Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Inactive)) & ")"
                        Width: =Len(Self.Text) * 6 + 22
                        X: =btnSegActivosCli.X + btnSegActivosCli.Width + 3
                        Y: =3
                  - btnSegActivosCli:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ctxSegEstadoCli = "Activos", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        Fill: =If(ctxSegEstadoCli = "Activos", ThemeSurface, Color.Transparent)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ctxSegEstadoCli = "Activos", FontWeight.Semibold, FontWeight.Normal)
                        Height: =28
                        HoverFill: =If(ctxSegEstadoCli = "Activos", ThemeSurface, ThemeSurface2)
                        OnSelect: |-
                          =UpdateContext({ctxSegEstadoCli: "Activos", ctxPagCli: 1});
                          ClearCollect(
                              colClientesCli,
                              Search(
                                  Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active),
                                  Trim(inpBusqCli.Text),
                                  Name, CIFBCO, CIFCOM
                              )
                          )
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Activos (" & CountRows(Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active)) & ")"
                        Width: =Len(Self.Text) * 6 + 22
                        X: =3
                        Y: =3
            - cntBusqCli:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =Color.Transparent
                  Height: =32
                  Width: =Min(340, Parent.Width * 0.25)
                  X: =cntSegEstadoCli.X + cntSegEstadoCli.Width + fxGap
                  Y: =(Parent.Height - 32)/2
                Children:
                  - icoLupaBusqCli:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =ThemeInk3
                        Height: =16
                        Icon: =Icon.Search
                        Width: =16
                        X: =10
                        Y: =(Parent.Height - 16)/2
                  - inpBusqCli:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ThemeLine
                        Default: =
                        DelayOutput: =true
                        Fill: =ThemeSurface
                        Font: =Font.'Open Sans'
                        Height: =Parent.Height
                        HintText: ="Nombre, CIF BCO o CIF COM…"
                        HoverBorderColor: =ThemeLine
                        OnChange: |-
                          =UpdateContext({ctxPagCli: 1});
                          Switch(
                              ctxSegEstadoCli,
                              "Activos",
                              ClearCollect(
                                  colClientesCli,
                                  Search(
                                      Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active),
                                      Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM
                                  )
                              ),
                              "Inactivos",
                              ClearCollect(
                                  colClientesCli,
                                  Search(
                                      Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Inactive),
                                      Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM
                                  )
                              ),
                              "Pendientes",
                              ClearCollect(
                                  colClientesCli,
                                  Search(
                                      Filter(
                                          'CH-Tbl-Clients',
                                          RecordStatus = 'CH-Ch-RecordStatus'.PendingApproval
                                          || RecordStatus = 'CH-Ch-RecordStatus'.PendingDeactivation
                                      ),
                                      Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM
                                  )
                              ),
                              ClearCollect(
                                  colClientesCli,
                                  Search('CH-Tbl-Clients', Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM)
                              )
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Width: =Parent.Width - 32
                        X: =32
            - btnNuevoClienteCli:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =ThemeSurface
                  DisabledBorderColor: =Color.Transparent
                  DisabledColor: =ThemeInk3
                  DisabledFill: =ThemeLineSoft
                  Fill: =ThemeAccent
                  Font: =Font.'Open Sans'
                  Height: =32
                  HoverFill: =ThemeAccentDark
                  OnSelect: |-
                    =Reset(inpNombrePanCli);
                    Reset(inpCifBcoPanCli);
                    Reset(inpCifComPanCli);
                    Reset(inpMotivoPanCli);
                    UpdateContext({ctxPanelAltaCli: true})
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =9
                  Text: ="+ Nuevo cliente"
                  Visible: =!IsBlank(LookUp(colMisPermisos, Name = "sanic_chtblclient" && Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Contributor))
                  Width: =150
                  X: =Parent.Width - fxGutter - Self.Width
                  Y: =(Parent.Height - 32)/2
      - cntBodyCli:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Parent.Width
            Y: =cntToolbarCli.Y + cntToolbarCli.Height
          Children:
            - cntKpiActivosCli:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =fxKpiH
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =(Parent.Width - fxGutter*2 - fxGap*3) / 4
                  X: =fxGutter
                Children:
                  - lblKpiActivosValCli:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =16.5
                        Text: =Text(CountRows(Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active)))
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =22
                  - lblKpiActivosLabCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =14
                        Size: =7.88
                        Text: ="CLIENTES ACTIVOS"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =8
            - cntKpiRfcCli:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =fxKpiH
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =(Parent.Width - fxGutter*2 - fxGap*3) / 4
                  X: =cntKpiActivosCli.X + cntKpiActivosCli.Width + fxGap
                Children:
                  - lblKpiRfcSubCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        Height: =14
                        Size: =8.25
                        Text: ="solicitudes sin resolver"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =48
                  - lblKpiRfcValCli:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =16.5
                        Text: =Text(CountRows(Distinct(Filter(colRfcEnCursoCli, !IsBlank(RelatedClient)), Text(RelatedClient.'CH-Tbl-Client'))))
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =22
                  - lblKpiRfcLabCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =14
                        Size: =7.88
                        Text: ="CON RFC EN CURSO"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =8
            - cntKpiAltasCli:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =fxKpiH
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =(Parent.Width - fxGutter*2 - fxGap*3) / 4
                  X: =cntKpiRfcCli.X + cntKpiRfcCli.Width + fxGap
                Children:
                  - lblKpiAltasSubCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        Height: =14
                        Size: =8.25
                        Text: ="esperando aprobación"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =48
                  - lblKpiAltasValCli:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =16.5
                        Text: =Text(CountRows(Filter(colRfcEnCursoCli, Type = 'Type (CH-Tbl-ClientDataChangeRequests)'.Create && 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted)))
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =22
                  - lblKpiAltasLabCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =14
                        Size: =7.88
                        Text: ="ALTAS PENDIENTES"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =8
            - cntKpiHoyCli:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =fxKpiH
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =(Parent.Width - fxGutter*2 - fxGap*3) / 4
                  X: =cntKpiAltasCli.X + cntKpiAltasCli.Width + fxGap
                Children:
                  - lblKpiHoySubCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        Height: =14
                        Size: =8.25
                        Text: =CountRows(Filter(colRfcEnCursoCli, 'Created On' >= Today())) & " sin resolver"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =48
                  - lblKpiHoyValCli:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =16.5
                        Text: =Text(CountRows(Filter('CH-Tbl-ClientDataChangeRequests', 'Created On' >= Today())))
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =22
                  - lblKpiHoyLabCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =14
                        Size: =7.88
                        Text: ="SOLICITUDES HOY"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =8
            - cntGrillaCli:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =Parent.Height - Self.Y - fxGap
                  RadiusBottomLeft: =fxCardR
                  RadiusBottomRight: =fxCardR
                  RadiusTopLeft: =fxCardR
                  RadiusTopRight: =fxCardR
                  Width: =Parent.Width - fxGutter*2
                  X: =fxGutter
                  Y: =cntKpiActivosCli.Y + cntKpiActivosCli.Height + fxGap
                Children:
                  - btnColClienteCli:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderThickness: =0
                        Color: =ThemeInk2
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        Fill: =Color.Transparent
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        HoverColor: =ThemeInk2
                        HoverFill: =ThemeSurface2
                        OnSelect: |-
                          =UpdateContext({ctxOrdenAscCli: !ctxOrdenAscCli, ctxPagCli: 1})
                        Size: =7.5
                        Text: ="CLIENTE " & If(ctxOrdenAscCli, "▼", "▲")
                        Width: =(Parent.Width - 32 - fxGap) * 0.29
                        X: =16
                        Y: =6
                  - lblColCifBcoCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =16
                        Size: =7.5
                        Text: ="CIF BCO"
                        Width: =(Parent.Width - 32 - fxGap) * 0.14
                        X: =btnColClienteCli.X + btnColClienteCli.Width
                        Y: =10
                  - lblColCifComCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =16
                        Size: =7.5
                        Text: ="CIF COM"
                        Width: =(Parent.Width - 32 - fxGap) * 0.14
                        X: =lblColCifBcoCli.X + lblColCifBcoCli.Width
                        Y: =10
                  - lblColEstadoCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =16
                        Size: =7.5
                        Text: ="ESTADO"
                        Width: =(Parent.Width - 32 - fxGap) * 0.14
                        X: =lblColCifComCli.X + lblColCifComCli.Width + fxGap
                        Y: =10
                  - lblColSolicitudCli:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =16
                        Size: =7.5
                        Text: ="SOLICITUD"
                        Width: =(Parent.Width - 32 - fxGap) * 0.16
                        X: =lblColEstadoCli.X + lblColEstadoCli.Width
                        Y: =10
                  - lblColModifCli:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =16
                        Size: =7.5
                        Text: ="MODIFICADO"
                        Width: =(Parent.Width - 32 - fxGap) * 0.13
                        X: =lblColSolicitudCli.X + lblColSolicitudCli.Width
                        Y: =10
                  - shpColLineaCli:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ThemeLine
                        Height: =1
                        Width: =Parent.Width
                        Y: =36
                  - galClientesCli:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Height: =Parent.Height - 37 - cntPagCli.Height
                        Items: |-
                          =FirstN(
                              LastN(
                                  Sort(colClientesCli, Name, If(ctxOrdenAscCli, SortOrder.Ascending, SortOrder.Descending)),
                                  CountRows(colClientesCli) - (ctxPagCli - 1) * ctxPagTamCli
                              ),
                              ctxPagTamCli
                          )
                        OnSelect: |-
                          =Set(gvarClienteSel, ThisItem);
                          Navigate(scrCliente, ScreenTransition.None)
                        TemplatePadding: =0
                        TemplateSize: =fxRowH
                        Width: =Parent.Width
                        Y: =37
                      Children:
                        - btnFilaCli:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              Height: =fxRowH
                              HoverFill: =ThemeSurface2
                              OnSelect: =Select(Parent)
                              PressedFill: =ThemeAccentSoft
                              Text: =""
                              Width: =Parent.TemplateWidth
                        - lblNombreFilaCli:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =fxRowH
                              OnSelect: =Select(Parent)
                              Size: =9
                              Text: =ThisItem.Name
                              Width: =btnColClienteCli.Width
                              X: =btnColClienteCli.X
                        - lblCifBcoFilaCli:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Font: =Font.'Open Sans'
                              Height: =fxRowH
                              OnSelect: =Select(Parent)
                              Size: =9
                              Text: =ThisItem.CIFBCO
                              Width: =lblColCifBcoCli.Width
                              X: =lblColCifBcoCli.X
                        - lblCifComFilaCli:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Font: =Font.'Open Sans'
                              Height: =fxRowH
                              OnSelect: =Select(Parent)
                              Size: =9
                              Text: =ThisItem.CIFCOM
                              Width: =lblColCifComCli.Width
                              X: =lblColCifComCli.X
                        - pilEstadoFilaCli:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: |-
                                =Switch(
                                    ThisItem.RecordStatus,
                                    'CH-Ch-RecordStatus'.Active,               ThemeOk,
                                    'CH-Ch-RecordStatus'.Inactive,             ThemeInk3,
                                    'CH-Ch-RecordStatus'.PendingApproval,      ThemeWarn,
