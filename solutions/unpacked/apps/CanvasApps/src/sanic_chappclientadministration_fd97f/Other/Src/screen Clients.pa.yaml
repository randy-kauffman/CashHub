Screens:
  screen Clients:
    Properties:
      OnVisible: =UpdateContext({varShowScreenSpinner:false});
    Children:
      - formRFC_Cliente:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            DataSource: ='CH-Tbl-ClientDataChangeRequests'
            OnFailure: |+
              =UpdateContext({varShowScreenSpinner: false, varShowScreenSpinnerLabel: "",varShowSidePanel: false});
            OnReset: |+
              =UpdateContext({varShowScreenSpinner: false, varShowScreenSpinnerLabel: "",varShowSidePanel: false});
            OnSuccess: |+
              =UpdateContext({varRFC: formRFC_Cliente.LastSubmit});
              Notify("RFC creado",NotificationType.Success);
              If(
                  varRFC.Type = 'Type (CH-Tbl-ClientDataChangeRequests)'.Create,
              //Name
              Patch('CH-Tbl-ClientDataChangeRequestLines'
              ,Defaults('CH-Tbl-ClientDataChangeRequestLines')
              ,{
                  NewValue: Trim(DataCardValue1.Text)
                  ,ChangeRequestID: varRFC
                  ,'Field Definition': LookUp('CH-Tbl-ClientTableLogicalFieldNames', Name = "Nombre" && Table = "sanic_chtblclient" )
                  ,ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
              }
              );
              //CIFBCO
              Patch('CH-Tbl-ClientDataChangeRequestLines'
              ,Defaults('CH-Tbl-ClientDataChangeRequestLines')
              ,{
                  NewValue: Trim(DataCardValue3.Text)
                  ,ChangeRequestID: varRFC
                  ,'Field Definition': LookUp('CH-Tbl-ClientTableLogicalFieldNames', Name = "CIFBCO" && Table = "sanic_chtblclient" )
                  ,ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
              }
              );
              //CIFCOM
              Patch('CH-Tbl-ClientDataChangeRequestLines'
              ,Defaults('CH-Tbl-ClientDataChangeRequestLines')
              ,{
                  NewValue: Trim(DataCardValue4.Text)
                  ,ChangeRequestID: varRFC
                  ,'Field Definition': LookUp('CH-Tbl-ClientTableLogicalFieldNames', Name = "CIFCOM" && Table = "sanic_chtblclient" )
                  ,ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
              }
              );
              );
              UpdateContext(
                  {
                      varShowScreenSpinner: false,
                      varShowScreenSpinnerLabel: "",
                      varShowSidePanel: false
                  }
              );
              UpdateContext(
                  {
                      varShowSidePanel: Blank(),
                      varRelatedClient: Blank(),
                      varTargetRecordID: Blank(),
                      varChangeStatus: Blank(),
                      varReason: Blank(),
                      varTargetTable: Blank(),
                      varTablePluralName: Blank(),
                      varRFCType: Blank(),
                      varTableDisplayName: Blank(),
                      varShowScreenSpinner: false,
                      varDialogEditShow: false,
                      varDialogActivateShow: false
                  }
              );
              UpdateContext({varShowScreenSpinner: false, varShowScreenSpinnerLabel: "",varShowSidePanel: false});
              ResetForm(formClient);
              Reset(txtInp_1);
              If(
                  varRFC.Type = 'Type (CH-Tbl-ClientDataChangeRequests)'.Update,
                  Set(
                      gvarSelectedChangeRequest,
                      varRFC
                  );
                  Set(gvarSelectedClient, varRFC.RelatedClient);
                  Navigate(
                      'screen ChangeRequestDetails',
                      ScreenTransition.Fade,{ FromScreen: App.ActiveScreen }
                  )
              );

