                        - btnPanelConfirmarFic:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderThickness: =0
                              Color: =ThemeSurface
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              DisplayMode: |-
                                =If(
                                    !varPanelCargandoFic
                                    && CountRows(colCambiosPanelFic) > 0
                                    && !lblCampoAErrorFic.Visible
                                    && !IsBlank(Trim(inpMotivoPanelFic.Text))
                                    && IsBlank(
                                        LookUp(
                                            colRfcEnCursoFic,
                                            TargetTable = Switch(varPanelModoFic, "cliente","sanic_chtblclient", "sucursal","sanic_chtblclientbranch", "correo","sanic_chtblclientemail", "sanic_chtblclientaccount")
                                            && TargetRecordID = Text(varPanelTargetIdFic)
                                        )
                                    ),
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Fill: =ThemeAccent
                              Font: =Font.'Open Sans'
                              Height: =32
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =Self.Color
                              HoverFill: =ThemeAccentDark
                              OnSelect: "=UpdateContext({varPanelCargandoFic: true});\nSet(varRfcErrorFic, \"\");\nIfError(\n    \n        // 1. Cabecera en Draft.\n        Clear(colNuevoRfcFic);\n        Collect(\n            colNuevoRfcFic,\n            Patch(\n                'CH-Tbl-ClientDataChangeRequests',\n                Defaults('CH-Tbl-ClientDataChangeRequests'),\n                {\n                    'Change Status': 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft,\n                    Type: If(varPanelAccionFic = \"Alta\", 'Type (CH-Tbl-ClientDataChangeRequests)'.Create, 'Type (CH-Tbl-ClientDataChangeRequests)'.Update),\n                    TargetTable: Switch(varPanelModoFic, \"cliente\",\"sanic_chtblclient\", \"sucursal\",\"sanic_chtblclientbranch\", \"correo\",\"sanic_chtblclientemail\", \"sanic_chtblclientaccount\"),\n                    TargetTableDisplayName: Switch(varPanelModoFic, \"cliente\",\"Clientes\", \"sucursal\",\"Sucursales\", \"correo\",\"Correos\", \"Cuentas\"),\n                    TargetTablePluralName: Switch(varPanelModoFic, \"cliente\",\"sanic_chtblclients\", \"sucursal\",\"sanic_chtblclientbranchs\", \"correo\",\"sanic_chtblclientemails\", \"sanic_chtblclientaccounts\"),\n                    TargetRecordID: If(varPanelAccionFic = \"Alta\", Blank(), Text(varPanelTargetIdFic)),\n                    RelatedClient: gvarClienteSel,\n                    Reason: Trim(inpMotivoPanelFic.Text)\n                }\n            )\n        );\n        // 2. Una linea por cada fila de colCambiosPanelFic, con la cabecera TODAVIA en Draft.\n        ForAll(\n            colCambiosPanelFic As Cambio,\n            Patch(\n                'CH-Tbl-ClientDataChangeRequestLines',\n                Defaults('CH-Tbl-ClientDataChangeRequestLines'),\n                {\n                    ChangeRequestID: Last(colNuevoRfcFic),\n                    'Field Definition': LookUp(\n                        'CH-Tbl-ClientTableLogicalFieldNames',\n                        Table = Switch(varPanelModoFic, \"cliente\",\"sanic_chtblclient\", \"sucursal\",\"sanic_chtblclientbranch\", \"correo\",\"sanic_chtblclientemail\", \"sanic_chtblclientaccount\")\n                        && Name = Cambio.Campo\n                    ),\n                    OldValue: Cambio.ValorViejo,\n                    NewValue: Cambio.ValorNuevo\n                }\n            )\n        );\n        // 3. Cabecera a Submitted (unica transicion humana que ChangeRequestApprovalGuard permite tras Draft).\n        Patch(\n            'CH-Tbl-ClientDataChangeRequests',\n            Last(colNuevoRfcFic),\n            {'Change Status': 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted}\n        );\n        // 4. Refresco y cierre.\n        Refresh('CH-Tbl-ClientDataChangeRequests');\n        Refresh('CH-Tbl-ClientDataChangeRequestLines');\n        ClearCollect(\n            colRfcEnCursoFic,\n            Filter(\n                'CH-Tbl-ClientDataChangeRequests',\n                RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'\n                && (\n                    'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft\n                    || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted\n                    || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved\n                )\n            )\n        );\n        UpdateContext({varPanelAbiertoFic: false, varPanelCargandoFic: false});\n        Notify(\"Solicitud creada y enviada a aprobación.\", NotificationType.Success)\n    ,\n    UpdateContext({varPanelCargandoFic: false});\n    Set(varRfcErrorFic, FirstError.Message);\n    Notify(\"No se pudo crear la solicitud: \" & FirstError.Message, NotificationType.Error)\n)"
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: =If(varPanelCargandoFic, "Aplicando…", "Crear y enviar solicitud")
                              Width: =200
                              X: =Parent.Width - 20 - Self.Width
                              Y: =16
      - cmpConfirmDialogFic:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Cargando: =varDlgCargandoFic
            EtiquetaCampo: ="Motivo de la solicitud"
            Mostrar: =!IsBlank(varDlgAccionFic)
            MostrarCampo: =true
            OkHabilitado: =!IsBlank(Trim(cmpConfirmDialogFic.CampoTexto))
            OnCancelar: |-
              =UpdateContext({varDlgAccionFic: "", varDlgCargandoFic: false})
            OnOk: "=UpdateContext({varDlgCargandoFic: true});\nIfError(\n    \n        Patch(\n            'CH-Tbl-ClientDataChangeRequests',\n            Defaults('CH-Tbl-ClientDataChangeRequests'),\n            {\n                'Change Status': 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted,\n                Type: If(varDlgAccionFic = \"Activar\", 'Type (CH-Tbl-ClientDataChangeRequests)'.Activate, 'Type (CH-Tbl-ClientDataChangeRequests)'.Deactivate),\n                TargetTable: varDlgTargetTableFic,\n                TargetTableDisplayName: varDlgTargetTableLabelFic,\n                TargetTablePluralName: varDlgTargetTablePluralFic,\n                TargetRecordID: Text(varDlgTargetIdFic),\n                RelatedClient: gvarClienteSel,\n                Reason: Trim(cmpConfirmDialogFic.CampoTexto)\n            }\n        );\n        Refresh('CH-Tbl-ClientDataChangeRequests');\n        ClearCollect(\n            colRfcEnCursoFic,\n            Filter(\n                'CH-Tbl-ClientDataChangeRequests',\n                RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'\n                && (\n                    'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft\n                    || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted\n                    || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved\n                )\n            )\n        );\n        UpdateContext({varDlgAccionFic: \"\", varDlgCargandoFic: false});\n        Notify(\"Solicitud creada y enviada a aprobación.\", NotificationType.Success)\n    ,\n    UpdateContext({varDlgCargandoFic: false});\n    Notify(\"No se pudo crear la solicitud: \" & FirstError.Message, NotificationType.Error)\n)"
            PlaceholderCampo: |-
              =Switch(
                  varDlgTargetTableFic,
                  "sanic_chtblclient", "Ej: cierre de operaciones del cliente…",
                  "sanic_chtblclientbranch", "Ej: cierre de la plaza por mudanza del cliente…",
                  "sanic_chtblclientemail", "Ej: la casilla dejó de usarse para este cliente…",
                  "sanic_chtblclientaccount", "Ej: la cuenta fue cancelada por el banco…",
                  "Ej: motivo de la solicitud…"
              )
            Texto: |-
              =With(
                  {
                      _esFem: varDlgTargetTableFic in ["sanic_chtblclientbranch", "sanic_chtblclientaccount"],
                      _sujeto: Switch(
                          varDlgTargetTableFic,
                          "sanic_chtblclient", "El cliente",
                          "sanic_chtblclientbranch", "La sucursal",
                          "sanic_chtblclientemail", "El correo",
                          "sanic_chtblclientaccount", "La cuenta",
                          "El registro"
                      )
                  },
                  "Se creará una solicitud tipo **" & If(varDlgAccionFic = "Activar", "Activación", "Desactivación") &
                      "** para " & gvarClienteSel.Name & " · " & varDlgTargetNombreFic & ". " & _sujeto & " sigue **" &
                      If(varDlgAccionFic = "Desactivar", "Activ", "Inactiv") & If(_esFem, "a", "o") &
                      "** hasta que un Approver de " & If(varDlgTargetTableFic = "sanic_chtblclientbranch", "Bóveda", "Banca Empresas") & " apruebe."
              )
            TextoCancelar: ="Cancelar"
            TextoOk: ="Crear y enviar solicitud"
            Titulo: |-
              =With(
                  {
                      _art: Switch(
                          varDlgTargetTableFic,
                          "sanic_chtblclient", "el cliente",
                          "sanic_chtblclientbranch", "la sucursal",
                          "sanic_chtblclientemail", "el correo",
                          "sanic_chtblclientaccount", "la cuenta",
                          "el registro"
                      )
                  },
                  If(
                      varDlgAccionFic = "Activar",
                      "¿Solicitar la activación de " & _art & " " & varDlgTargetNombreFic & "?",
                      "¿Solicitar la desactivación de " & _art & " " & varDlgTargetNombreFic & "?"
                  )
              )
            Tono: =If(varDlgAccionFic = "Activar", "ok", "danger")
            ValorCampo: =""
            Visible: =!IsBlank(varDlgAccionFic)
      - btnNavigatescrClientesFic:
          Control: Classic/Button@2.2.0
          Properties:
            OnSelect: =Navigate(scrClientes, ScreenTransition.None)
            Visible: =false
            X: =40
            Y: =40
