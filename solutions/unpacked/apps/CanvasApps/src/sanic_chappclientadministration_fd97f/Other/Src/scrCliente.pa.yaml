Screens:
  scrCliente:
    Properties:
      Fill: =ThemeBg
      OnVisible: "=If(\n    IsBlank(gvarClienteSel),\n    Select(btnNavigatescrClientesFic),\n    \n        UpdateContext(\n            {\n                ctxTabFic: \"Sucursales\",\n                varPanelAbiertoFic: false,\n                varPanelModoFic: \"\",\n                varPanelAccionFic: \"\",\n                varDlgAccionFic: \"\"\n            }\n        );\n        Reset(inpBuscarTabFic);\n        ClearCollect(\n            colRfcEnCursoFic,\n            Filter(\n                'CH-Tbl-ClientDataChangeRequests',\n                RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'\n                && (\n                    'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft\n                    || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted\n                    || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved\n                )\n            )\n        );\n        ClearCollect(colBranchesClienteFic, Filter('CH-Tbl-ClientBranches', Client.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));\n        ClearCollect(colEmailsClienteFic, Filter('CH-Tbl-ClientEmails', Client.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));\n        ClearCollect(colAccountsClienteFic, Filter('CH-Tbl-ClientAccounts', Client.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));\n        ClearCollect(colSolicitudesClienteFic, Filter('CH-Tbl-ClientDataChangeRequests', RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));\n        ClearCollect(colAuditClienteFic, Filter('CH-Tbl-ClientDataChangesAuditTrails', RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));\n        Clear(colCuentasRevFic);\n        Clear(colCambiosPanelFic);\n        Reset(galSucursalesFic);\n        Reset(galCorreosFic);\n        Reset(galCuentasFic);\n        Reset(galSolicitudesFic);\n        Reset(galBitacoraFic)\n    \n)"
    Children:
      - cmpAppHeaderFic:
          Control: CanvasComponent
          ComponentName: cmpAppHeader
          Properties:
            Activo: ="Clientes"
            Height: =fxHeaderH
            OnClientes: =false
            OnSolicitudes: =Navigate(scrSolicitudes, ScreenTransition.None)
            RolTexto: =gvarRolTexto
            Subtitulo: ="Ficha de cliente"
            Titulo: ="Administración de Clientes"
            Width: =Parent.Width
      - cntBodyFic:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Parent.Width
            Y: =cmpAppHeaderFic.Y + cmpAppHeaderFic.Height
          Children:
            - cntSideFic:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =Color.Transparent
                  Height: =Parent.Height - fxGutter*2
                  Width: =fxSideW
                  X: =fxGutter
                  Y: =fxGutter
                Children:
                  - cntTarjetaClienteFic:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =lblKvCuentasValFic.Y + lblKvCuentasValFic.Height + 14
                        RadiusBottomLeft: =fxCardR
                        RadiusBottomRight: =fxCardR
                        RadiusTopLeft: =fxCardR
                        RadiusTopRight: =fxCardR
                        Width: =Parent.Width
                      Children:
                        - cntTarjetaClienteHeadFic:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =1
                              Fill: =ThemeSurface2
                              Height: =38
                              Width: =Parent.Width
                            Children:
                              - btnVolverFic:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeLine
                                    BorderThickness: =1
                                    Color: =ThemeInk2
                                    DisabledBorderColor: =Color.Transparent
                                    DisabledColor: =ThemeInk3
                                    DisabledFill: =ThemeLineSoft
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =26
                                    HoverBorderColor: =ThemeLine
                                    HoverColor: =ThemeInk2
                                    HoverFill: =ThemeSurface2
                                    OnSelect: =Navigate(scrClientes, ScreenTransition.None)
                                    PressedBorderColor: =ThemeLine
                                    PressedColor: =ThemeInk2
                                    PressedFill: =ThemeSurface2
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =8.25
                                    Text: ="‹ Volver"
                                    Width: =62
                                    X: =12
                                    Y: =(Parent.Height-26)/2
                              - pilEstadoClienteFic:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeLineSoft
                                    BorderThickness: =If(gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Inactive, 1, 0)
                                    Color: =Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,ThemeOk, 'CH-Ch-RecordStatus'.Inactive,ThemeInk3, 'CH-Ch-RecordStatus'.PendingApproval,ThemeWarn, 'CH-Ch-RecordStatus'.PendingDeactivation,ThemeWarn, ThemeInk3)
                                    DisabledBorderColor: =Color.Transparent
                                    DisabledColor: =ThemeInk3
                                    DisabledFill: =ThemeLineSoft
                                    DisplayMode: =DisplayMode.View
                                    Fill: =Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,ThemeOkSoft, 'CH-Ch-RecordStatus'.Inactive,ThemeLineSoft, 'CH-Ch-RecordStatus'.PendingApproval,ThemeWarnSoft, 'CH-Ch-RecordStatus'.PendingDeactivation,ThemeWarnSoft, ThemeLineSoft)
                                    Font: =Font.'Open Sans'
                                    Height: =20
                                    HoverBorderColor: =Self.BorderColor
                                    HoverColor: =Self.Color
                                    HoverFill: =Self.Fill
                                    PressedBorderColor: =Self.BorderColor
                                    PressedFill: =Self.Fill
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =7.88
                                    Text: =Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,"Activo", 'CH-Ch-RecordStatus'.Inactive,"Inactivo", 'CH-Ch-RecordStatus'.PendingApproval,"Pend. aprobación", 'CH-Ch-RecordStatus'.PendingDeactivation,"Pend. desactivación", "—")
                                    Width: =Len(Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,"Activo",'CH-Ch-RecordStatus'.Inactive,"Inactivo",'CH-Ch-RecordStatus'.PendingApproval,"Pend. aprobación",'CH-Ch-RecordStatus'.PendingDeactivation,"Pend. desactivación","—")) * 5.4 + 18
                                    X: =Parent.Width - 12 - Self.Width
                                    Y: =(Parent.Height-20)/2
                        - lblNombreClienteFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =20
                              Size: =10.88
                              Text: =gvarClienteSel.Name
                              Width: =Parent.Width - 28
                              Wrap: =false
                              X: =14
                              Y: =cntTarjetaClienteHeadFic.Y + cntTarjetaClienteHeadFic.Height + 12
                        - lblClienteDesdeFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              Height: =16
                              Size: =8.63
                              Text: ="Cliente desde " & Lower(Text(gvarClienteSel.'Created On', "mmm yyyy"))
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =lblNombreClienteFic.Y + lblNombreClienteFic.Height + 2
                        - lblKvCifBcoLabFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =16
                              Size: =9
                              Text: ="CIF BCO"
                              Width: =90
                              X: =14
                              Y: =lblClienteDesdeFic.Y + lblClienteDesdeFic.Height + 10
                        - lblKvCifBcoValFic:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =ThemeLine
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =9
                              Text: =gvarClienteSel.CIFBCO
                              Width: =Parent.Width - 28 - Self.X
                              X: =lblKvCifBcoLabFic.X + lblKvCifBcoLabFic.Width
                              Y: =lblKvCifBcoLabFic.Y
                        - lblKvCifComLabFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =16
                              Size: =9
                              Text: ="CIF COM"
                              Width: =90
                              X: =14
                              Y: =lblKvCifBcoLabFic.Y + lblKvCifBcoLabFic.Height + 5
                        - lblKvCifComValFic:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =ThemeLine
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =9
                              Text: =gvarClienteSel.CIFCOM
                              Width: =Parent.Width - 28 - Self.X
                              X: =lblKvCifComLabFic.X + lblKvCifComLabFic.Width
                              Y: =lblKvCifComLabFic.Y
                        - lblKvSucursalesLabFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =16
                              Size: =9
                              Text: ="Sucursales"
                              Width: =90
                              X: =14
                              Y: =lblKvCifComLabFic.Y + lblKvCifComLabFic.Height + 5
                        - lblKvSucursalesValFic:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =ThemeLine
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =9
                              Text: =CountRows(Filter(colBranchesClienteFic, RecordStatus = 'CH-Ch-RecordStatus'.Active)) & " activas"
                              Width: =Parent.Width - 28 - Self.X
                              X: =lblKvSucursalesLabFic.X + lblKvSucursalesLabFic.Width
                              Y: =lblKvSucursalesLabFic.Y
                        - lblKvCorreosLabFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =16
                              Size: =9
                              Text: ="Correos"
                              Width: =90
                              X: =14
                              Y: =lblKvSucursalesLabFic.Y + lblKvSucursalesLabFic.Height + 5
                        - lblKvCorreosValFic:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =ThemeLine
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =9
                              Text: =CountRows(Filter(colEmailsClienteFic, RecordStatus = 'CH-Ch-RecordStatus'.Active)) & " autorizados"
                              Width: =Parent.Width - 28 - Self.X
                              X: =lblKvCorreosLabFic.X + lblKvCorreosLabFic.Width
                              Y: =lblKvCorreosLabFic.Y
                        - lblKvCuentasLabFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =16
                              Size: =9
                              Text: ="Cuentas"
                              Width: =90
                              X: =14
                              Y: =lblKvCorreosLabFic.Y + lblKvCorreosLabFic.Height + 5
                        - lblKvCuentasValFic:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =ThemeLine
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =16
                              Size: =9
                              Text: =Text(CountRows(colAccountsClienteFic))
                              Width: =Parent.Width - 28 - Self.X
                              X: =lblKvCuentasLabFic.X + lblKvCuentasLabFic.Width
                              Y: =lblKvCuentasLabFic.Y
                  - cntAccionesClienteFic:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =Parent.Height - Self.Y
                        RadiusBottomLeft: =fxCardR
                        RadiusBottomRight: =fxCardR
                        RadiusTopLeft: =fxCardR
                        RadiusTopRight: =fxCardR
                        Width: =Parent.Width
                        Y: =cntTarjetaClienteFic.Y + cntTarjetaClienteFic.Height + fxGap
                      Children:
                        - lblAccionesHeadFic:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =ThemeLine
                              Color: =ThemeInk2
                              Fill: =ThemeSurface2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="ACCIONES SOBRE EL CLIENTE"
                              Width: =Parent.Width-14
                              X: =14
                        - btnEditarClienteFic:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeAccent
                              BorderThickness: =1
                              Color: =ThemeAccent
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              DisplayMode: |-
                                =If(
                                    !IsBlank(LookUp(colMisPermisos, Name = "sanic_chtblclient" && Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Contributor))
                                    && gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Active
                                    && IsBlank(LookUp(colRfcEnCursoFic, TargetTable = "sanic_chtblclient" && TargetRecordID = Text(gvarClienteSel.'CH-Tbl-Client'))),
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Fill: =ThemeSurface
                              Font: =Font.'Open Sans'
                              Height: =26
                              HoverBorderColor: =ThemeAccent
                              HoverColor: =ThemeAccent
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext(
                                    {
                                        varPanelModoFic: "cliente",
                                        varPanelAccionFic: "Editar",
                                        varPanelTargetIdFic: gvarClienteSel.'CH-Tbl-Client',
                                        varPanelAbiertoFic: true
                                    }
                                );
                                Reset(inpPanelCampoAFic);
                                Reset(inpPanelCampoBFic);
                                Reset(inpPanelCampoCFic);
                                Reset(inpMotivoPanelFic);
                                Clear(colCambiosPanelFic)
                              PressedBorderColor: =ThemeAccent
                              PressedColor: =ThemeAccent
                              PressedFill: =ThemeSurface2
                              RadiusBottomLeft: =7
                              RadiusBottomRight: =7
                              RadiusTopLeft: =7
                              RadiusTopRight: =7
                              Size: =8.25
                              Text: ="✎ Solicitar edición de datos"
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =lblAccionesHeadFic.Y + lblAccionesHeadFic.Height + 9
                        - btnDesactivarClienteFic:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeDangerLine
                              BorderThickness: =1
                              Color: =ThemeDanger
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              DisplayMode: |-
                                =If(
                                    !IsBlank(LookUp(colMisPermisos, Name = "sanic_chtblclient" && Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Contributor))
                                    && IsBlank(LookUp(colRfcEnCursoFic, TargetTable = "sanic_chtblclient" && TargetRecordID = Text(gvarClienteSel.'CH-Tbl-Client'))),
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Fill: =ThemeSurface
                              Font: =Font.'Open Sans'
                              Height: =26
                              HoverBorderColor: =ThemeDangerLine
                              HoverColor: =ThemeDanger
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext(
                                    {
                                        varDlgAccionFic: If(gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Inactive, "Activar", "Desactivar"),
                                        varDlgTargetTableFic: "sanic_chtblclient",
                                        varDlgTargetTableLabelFic: "Clientes",
                                        varDlgTargetTablePluralFic: "sanic_chtblclients",
                                        varDlgTargetIdFic: gvarClienteSel.'CH-Tbl-Client',
                                        varDlgTargetNombreFic: gvarClienteSel.Name
                                    }
                                )
                              PressedBorderColor: =ThemeDangerLine
                              PressedColor: =ThemeDanger
                              PressedFill: =ThemeSurface2
                              RadiusBottomLeft: =7
                              RadiusBottomRight: =7
                              RadiusTopLeft: =7
                              RadiusTopRight: =7
                              Size: =8.25
                              Text: =If(gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Inactive, "Solicitar activación", "Solicitar desactivación")
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =btnEditarClienteFic.Y + btnEditarClienteFic.Height + 8
                        - cntBannerRfcClienteFic:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =ThemeWarnSoft
                              Height: =lblBannerRfcClienteFic.Height + 14
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Visible: =!IsBlank(LookUp(colRfcEnCursoFic, TargetTable = "sanic_chtblclient" && TargetRecordID = Text(gvarClienteSel.'CH-Tbl-Client')))
                              Width: =Parent.Width - 28
                              X: =14
                              Y: =btnDesactivarClienteFic.Y + btnDesactivarClienteFic.Height + 10
                            Children:
                              - lblBannerRfcClienteFic:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ThemeWarn
                                    Font: =Font.'Open Sans'
                                    Size: =7.5
                                    Text: ="Hay 1 solicitud en curso sobre este cliente — no se puede pedir otra edición del mismo campo hasta que se resuelva."
                                    Width: =Parent.Width - 20
                                    X: =10
                                    Y: =7
            - cntMainFic:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =Parent.Height - fxGutter*2
                  RadiusBottomLeft: =fxCardR
                  RadiusBottomRight: =fxCardR
                  RadiusTopLeft: =fxCardR
                  RadiusTopRight: =fxCardR
                  Width: =Parent.Width - Self.X - fxGutter
                  X: =cntSideFic.X + cntSideFic.Width + fxGap
                  Y: =fxGutter
                Children:
                  - cntTabsFic:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =Color.Transparent
                        Height: =40
                        Width: =Parent.Width
                      Children:
                        - btnTabSucursalesFic:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderThickness: =0
                              Color: =If(ctxTabFic = "Sucursales", ThemeAccent, ThemeInk2)
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              FontWeight: =If(ctxTabFic = "Sucursales", FontWeight.Semibold, FontWeight.Normal)
                              Height: =Parent.Height
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =Self.Color
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext({ctxTabFic: "Sucursales"}); Reset(inpBuscarTabFic)
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Sucursales (" & CountRows(colBranchesClienteFic) & ")"
                              Width: =Len("Sucursales") * 6.4 + 56
                              X: =14
                        - btnTabSolicitudesFic:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderThickness: =0
                              Color: =If(ctxTabFic = "Solicitudes", ThemeAccent, ThemeInk2)
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              FontWeight: =If(ctxTabFic = "Solicitudes", FontWeight.Semibold, FontWeight.Normal)
                              Height: =Parent.Height
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =Self.Color
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext({ctxTabFic: "Solicitudes"}); Reset(inpBuscarTabFic)
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Solicitudes (" & CountRows(colSolicitudesClienteFic) & ")"
                              Width: =Len("Solicitudes") * 6.4 + 56
                              X: =btnTabCuentasFic.X + btnTabCuentasFic.Width
                        - btnTabCuentasFic:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderThickness: =0
                              Color: =If(ctxTabFic = "Cuentas", ThemeAccent, ThemeInk2)
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              FontWeight: =If(ctxTabFic = "Cuentas", FontWeight.Semibold, FontWeight.Normal)
                              Height: =Parent.Height
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =Self.Color
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext({ctxTabFic: "Cuentas"}); Reset(inpBuscarTabFic)
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: ="Cuentas (" & CountRows(colAccountsClienteFic) & ")"
                              Width: =Len("Cuentas") * 6.4 + 56
                              X: =btnTabCorreosFic.X + btnTabCorreosFic.Width
                        - btnTabCorreosFic:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ColorFade(Self.Fill, -15%)
                              BorderThickness: =0
                              Color: =If(ctxTabFic = "Correos", ThemeAccent, ThemeInk2)
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              FontWeight: =If(ctxTabFic = "Correos", FontWeight.Semibold, FontWeight.Normal)
                              Height: =Parent.Height
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =Self.Color
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext({ctxTabFic: "Correos"}); Reset(inpBuscarTabFic)
                              PressedBorderColor: =Self.Fill
