      - dialogEnviar:
          Control: CanvasComponent
          ComponentName: Dialog
          ComponentLibraryUniqueName: cat_powercatcomponentlibrary_0be3a
          Properties:
            BorderRadius: =0
            Buttons: |-
              =Table({Label: "Cancel", ButtonType:'Button.ButtonType'.Standard, HasBorder: false }, {Label: "Ok", ButtonType:'Button.ButtonType'.Primary, HasBorder: false })
            Description: ="At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis ?"
            DialogHeight: =220
            DialogWidth: =640
            Fill: =dialogEnviar.OverlayColor
            Height: =768
            OnButtonSelect: "=Switch(\n    Self.SelectedButton.Label,\n    \"Cancel\",\n    UpdateContext(\n        {\n            varShowConfirmationDialog: false,\n            varConfirmationDialogTitle: \"\",\n            varConfirmationDialogSubtitle: \"\"\n        }\n    );\n    ,\n    \"Ok\",\n    UpdateContext(\n        {\n            varScreenSpinnerLabel: \"Guardando...\",\n            varScreenSpinnerVisibility: true\n        }\n    );\n    Clear(colSubmittionErrors);\n    UpdateContext(\n        {\n            varRegistriesInConflict: \"\",\n            varContinue: true\n        }\n    );\n    Clear(colConflictRegistrie);\n    ClearCollect(\n        colRegistriesToSubmit,\n        Filter(\n            'CH-Tbl-ClientDataChangeRequestLines',\n            ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest'\n        )\n    );\n    ForAll(\n        Filter(\n            'CH-Tbl-ClientDataChangeRequestLines',\n            ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest'\n        ) As CRL,\n        With(\n            {\n                varConflictRow: LookUp(\n                    'CH-Tbl-ClientDataChangeRequestLines',\n                    'Field Definition'.LogicalName = CRL.'Field Definition'.LogicalName && ChangeRequestID.TargetRecordID = gvarSelectedChangeRequest.TargetRecordID && ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' <> gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest' && (ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted || ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Approved)\n                )\n            },\n            Collect(\n                colConflictRegistrie,\n                varConflictRow\n            )\n        );\n    );\n    If(\n        !IsEmpty(colConflictRegistrie),\n        UpdateContext(\n            {\n                varRegistriesInConflict: \"Existen cambios en status submitted/approved en conflicto con el RFC actual. Los siguientes campos se encuentran en conflicto: \" & Concat(\n                    colConflictRegistrie,\n                    Concatenate(\n                        'Field Definition'.Name,\n                        \" (\",\n                        ChangeRequestID.Name,\n                        \"-\",\n                        Name,\n                        \")\"\n                    ),\n                    \", \"\n                )\n            }\n        );\n        Notify(\n            varRegistriesInConflict,\n            NotificationType.Error\n        );\n        UpdateContext({varContinue: false});\n    );\n    If(\n        varContinue,\n        ForAll(\n            colRegistriesToSubmit As Row,\n            Collect(\n                colSubmittionErrors,\n                Row\n            );\n            IfError(\n                Patch(\n                    'CH-Tbl-ClientDataChangeRequestLines',\n                    Row,\n                    {ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted}\n                );\n                Remove(\n                    colSubmittionErrors,\n                    Row\n                );\n                ,\n                Blank()\n            )\n        );\n    );\n    If(\n        IsEmpty(colSubmittionErrors) && varContinue,\n        Patch(\n            'CH-Tbl-ClientDataChangeRequests',\n            gvarSelectedChangeRequest,\n            {'Change Status': 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted}\n        );\n        Notify(\n            \"RFC guardado y enviado\",\n            NotificationType.Success\n        );\n        UpdateContext(\n            {\n                varShowConfirmationDialog: false,\n                varConfirmationDialogTitle: \"\",\n                varConfirmationDialogSubtitle: \"\"\n            }\n        );\n        Set(\n            gvarSelectedChangeRequest,\n            Blank()\n        );\n        Refresh('CH-Tbl-ClientDataChangeRequestLines');\n        Refresh('CH-Tbl-ClientDataChangeRequests');\n         If(\n                IsBlank(FromScreen),\n                Navigate('screen Clients', ScreenTransition.Fade),  // no hay historial → pantalla por defecto\n                Back()                                        // hay historial → volver normalmente\n            );,\n        Notify(\n            \"Hubo problemas al guardar los registros, intentelo nuevamente\",\n            NotificationType.Error\n        )\n    );\n    UpdateContext(\n        {\n            varShowConfirmationDialog: false,\n            varConfirmationDialogTitle: \"\",\n            varConfirmationDialogSubtitle: \"\"\n        }\n    );\n    \n);\n"
            OnCloseSelect: |-
              =UpdateContext({varShowConfirmationDialog: false, varConfirmationDialogTitle: "", varConfirmationDialogSubtitle: ""});
            OverlayColor: =RGBA(0, 0, 0, 0.4)
            SubTitle: =varConfirmationDialogSubtitle
            Theme: |-
              ={
              	palette: {
              		themePrimary: "#0078d4",
              		themeLighterAlt: "#eff6fc",
              		themeLighter: "#deecf9",
