                        Icon: =Icon.BackArrow
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |
                          =Set(
                              gvarSelectedChangeRequest,
                              Blank()
                          );
                          If(
                              IsBlank(FromScreen),
                              Navigate(
                                  'screen Clients',
                                  ScreenTransition.Fade
