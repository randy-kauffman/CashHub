tible a booleano\",\n                NotificationType.Error\n            )\n        )\n    );\n    UpdateContext(\n        {\n            varIsUnique: LookUp(\n                'CH-Tbl-ClientDataChangeRequestLines',\n                ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest' && 'Field Definition'.LogicalName = DataCardValue25.Selected.LogicalName\n            )\n        }\n    );\n    If(\n        !IsBlank(varIsUnique),\n        Notify(\n            \"Ya existe un cambio de este campo en este RFC\",\n            NotificationType.Error\n        ),\n        UpdateContext(\n            {\n                varIsUnique: LookUp(\n                    'CH-Tbl-ClientDataChangeRequestLines',\n                    'Field Definition'.LogicalName = DataCardValue25.Selected.LogicalName && ChangeRequestID.TargetRecordID = gvarSelectedChangeRequest.TargetRecordID && ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' <> gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest' && (ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted || ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Approved)\n                )\n            }\n        );\n        If(\n            !IsBlank(varIsUnique),\n            Notify(\n                \"Existe un cambio pendiente de este campo en el \" & varIsUnique.ChangeRequestID.Name,\n                NotificationType.Error\n            );\n        );\n    );\n    If(\n        varIsCastable = true && IsBlank(varIsUnique) = true,\n        SubmitForm(Form4)\n    ),\n    \"Cancel\",\n    UpdateContext(\n        {\n            varSidePanel2Title: \"\",\n            varSidePanel2Subtitle: \"\",\n            varSidePanel2Visible: false,\n            varValor: \"\"\n        }\n    )\n)"
