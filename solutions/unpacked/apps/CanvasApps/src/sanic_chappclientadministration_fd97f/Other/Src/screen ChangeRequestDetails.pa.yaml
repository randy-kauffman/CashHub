                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =1
                        Text: =gvarSelectedClient.Name & " - " & "Solicitud de cambio"
                  - ButtonCanvas2:
                      Control: Button@0.0.45
                      Properties:
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =UpdateContext({varShowResponseDialog: true, varResponse: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Approved, varRFCResponse: 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved});

                          UpdateContext({varShowResponseDialog: true, varResponseDialogTitle: "Confirmar aprobacion de RFC", varResponseSubtitle: "Añada un comentario justificando su decision"});
                        Text: ="Aprobar"
                        Visible: =gvarSelectedChangeRequest.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted && !IsBlank(LookUp(colClientDataPermissions, Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Approver && Name = gvarSelectedChangeRequest.TargetTable)) && gvarSelectedChangeRequest.'Created By'.User <> gvarUser.User
                  - ButtonCanvas2_1:
                      Control: Button@0.0.45
                      Properties:
                        BasePaletteColor: =RGBA(249, 83, 109, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =UpdateContext({varShowResponseDialog: true, varResponse: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Denied, varRFCResponse: 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Rejected});

                          UpdateContext({varShowResponseDialog: true, varResponseDialogTitle: "Confirmar rechazo de RFC", varResponseSubtitle: "Añada un comentario justificando su decision"});
                        Text: ="Rechazar"
                        Visible: =gvarSelectedChangeRequest.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted && !IsBlank(LookUp(colClientDataPermissions, Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Approver && Name = gvarSelectedChangeRequest.TargetTable)) && gvarSelectedChangeRequest.'Created By'.User <> gvarUser.User
                  - ButtonCanvas2_2:
                      Control: Button@0.0.45
                      Properties:
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: "=UpdateContext(\n    {\n        varShowConfirmationDialog: false,\n        varConfirmationDialogTitle: \"\",\n        varConfirmationDialogSubtitle: \"\"\n    }\n);\nUpdateContext({varRegistriesInConflict: \"\"});\nClear(colConflictRegistrie);\nForAll(\n    Filter(\n        'CH-Tbl-ClientDataChangeRequestLines',\n        ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest'\n    ) As CRL,\n    With(\n        {\n            varConflictRow: LookUp(\n                'CH-Tbl-ClientDataChangeRequestLines',\n                'Field Definition'.LogicalName = CRL.'Field Definition'.LogicalName && ChangeRequestID.TargetRecordID = gvarSelectedChangeRequest.TargetRecordID && ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' <> gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest' && (ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted || ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Approved)\n            )\n        },\n        Collect(\n            colConflictRegistrie,\n            varConflictRow\n        )\n    );\n    \n);\nIf(\n    !IsEmpty(colConflictRegistrie),\n    UpdateContext(\n        {\n            varRegistriesInConflict: \"Existen cambios en status submitted/approved en conflicto con el RFC actual. Los siguientes campos se encuentran en conflicto: \" & Concat(\n                colConflictRegistrie,\n                Concatenate(\n                    'Field Definition'.Name,\n                    \" (\",\n                    ChangeRequestID.Name,\n                    \"|\",\n                    Name,\n                    \")\"\n                ),\n                \", \"\n            )\n        }\n    );\n    Notify(\n        varRegistriesInConflict,\n        NotificationType.Error\n    );\n    ,\n    UpdateContext(\n        {\n            varShowConfirmationDialog: true,\n            varConfirmationDialogTitle: \"Confirmar envio de RFC\",\n            varConfirmationDialogSubtitle: \"Una vez enviado ya no podra editar este RFC, ¿Desea continuar?\",\n            varRFCStatus: 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted\n        }\n    )\n)"
                        Text: ="Enviar"
                        Visible: =gvarSelectedChangeRequest.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft && gvarSelectedChangeRequest.'Created By'.User = gvarUser.User
                  - ButtonCanvas2_3:
                      Control: Button@0.0.45
                      Properties:
                        BasePaletteColor: =RGBA(189, 178, 176, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          = UpdateContext(
                                  {
                                      varShowCancelarDialog: true,
                                      varCancelarDialogTitle: "Confirmar cancelacion de RFC",
                                      varCancelarDialogSubtitle: "Una vez cancelado ya no podra editar este RFC, ¿Desea continuar?",
                                      varRFCStatus: 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Canceled
                                  }
                              )
                        Text: ="Cancelar"
                        Visible: =gvarSelectedChangeRequest.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft && gvarSelectedChangeRequest.'Created By'.User = gvarUser.User
