      - dialogCancelar:
          Control: CanvasComponent
          ComponentName: Dialog
          ComponentLibraryUniqueName: cat_powercatcomponentlibrary_0be3a
          Properties:
            BorderRadius: =0
            Buttons: |-
              =Table({Label: "Cancel", ButtonType:'Button.ButtonType'.Standard, HasBorder: false }, {Label: "Ok", ButtonType:'Button.ButtonType'.Primary, HasBorder: false })
            Description: ="At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis ?"
            DialogHeight: =320
            DialogWidth: =640
            Fill: =dialogCancelar.OverlayColor
            Height: =768
            OnButtonSelect: |
              =Switch(
                  Self.SelectedButton.Label,
                  "Cancel",
                  UpdateContext(
                      {
                          varShowCancelarDialog: false,
                          varCancelarDialogTitle: "",
                          varCancelarDialogSubtitle: ""
                      }
                  );
                  ,
                  "Ok",
                  If(
                      Len(Trim(TextInputCanvas2.Value)) <= 0,
                      Notify(
                          "Debe añadir un comentario",
                          NotificationType.Error
                      ),
                      UpdateContext(
                          {
                              varScreenSpinnerLabel: "Guardando...",
                              varScreenSpinnerVisibility: true,
                              varNow: Now()
                          }
                      );
                      Clear(colSubmittionErrors);
                      ClearCollect(
                          colRegistriesToSubmit,
                          Filter(
                              'CH-Tbl-ClientDataChangeRequestLines',
                              ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest'
                          )
                      );
                      ForAll(
                          colRegistriesToSubmit As Row,
                          Collect(
                              colSubmittionErrors,
                              Row
                          );
                          IfError(
                              Patch(
                                  'CH-Tbl-ClientDataChangeRequestLines',
                                  Row,
                                  {ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Canceled, SolvedOn: varNow, SolvedBy: gvarUser}
                              );
                              Remove(
                                  colSubmittionErrors,
                                  Row
                              );
                              ,
                              Blank()
                          )
                      );
                      Clear(colRegistriesToSubmit);
                      If(
                          IsEmpty(colSubmittionErrors),
                      Patch(
                          'CH-Tbl-ClientDataChangeRequests',
                          gvarSelectedChangeRequest,
                          {'Change Status': 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Canceled, SolvedOn: varNow, SolvedBy: gvarUser,ReasonForDecision: Trim(TextInputCanvas2.Value)}
                      );
                      Notify(
                          "RFC guardado y enviado",
                          NotificationType.Success
                      );
                      UpdateContext(
                          {
                              varShowCancelarDialog: false,
                              varCancelarDialogTitle: "",
                              varCancelarDialogSubtitle: "",
                              varScreenSpinnerVisibility: false
                          }
                      );
                      Set(
                          gvarSelectedChangeRequest,
                          Blank()
                      );
                      Refresh('CH-Tbl-ClientDataChangeRequestLines');
                      Refresh('CH-Tbl-ClientDataChangeRequests');
                      Reset(TextInputCanvas2);
                      If(
                          IsBlank(FromScreen),
                          Navigate(
                              'screen Clients',
                              ScreenTransition.Fade
                          ),// no hay historial → pantalla por defecto
                          Back()// hay historial → volver normalmente
                      ),
                      Notify(
                          "Hubo problemas al cancelar algunas lineas, intentelo nuevamente",
                          NotificationType.Error
                      );
                      UpdateContext({varScreenSpinnerVisibility: false})
                      );
                  )
              );
            OnCloseSelect: |-
              =UpdateContext({varShowCancelarDialog: false, varCancelarDialogTitle: "", varCancelarDialogSubtitle: ""});
            OverlayColor: =RGBA(0, 0, 0, 0.4)
            SubTitle: =varCancelarDialogSubtitle
            Theme: |-
              ={
              	palette: {
              		themePrimary: "#0078d4",
              		themeLighterAlt: "#eff6fc",
              		themeLighter: "#deecf9",
              		themeLight: "#c7e0f4",
              		themeTertiary: "#71afe5",
              		themeSecondary: "#2b88d8",
              		themeDarkAlt: "#106ebe",
              		themeDark: "#005a9e",
              		themeDarker: "#004578",
              		neutralLighterAlt: "#faf9f8",
              		neutralLighter: "#f3f2f1",
              		neutralLight: "#edebe9",
              		neutralQuaternaryAlt: "#e1dfdd",
              		neutralQuaternary: "#d0d0d0",
              		neutralTertiaryAlt: "#c8c6c4",
              		neutralTertiary: "#a19f9d",
              		neutralSecondary: "#605e5c",
              		neutralPrimaryAlt: "#3b3a39",
              		neutralPrimary: "#323130",
              		neutralDark: "#201f1e",
              		black: "#000000",
              		white: "#ffffff"
              	}
              }
            Title: =varCancelarDialogTitle
            Visible: =varShowCancelarDialog
            Width: =1366
