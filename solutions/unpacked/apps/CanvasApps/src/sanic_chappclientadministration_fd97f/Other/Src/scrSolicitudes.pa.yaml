Screens:
  scrSolicitudes:
    Properties:
      Fill: =ThemeBg
      OnVisible: |-
        =// ============ 1) Estado a default (gotcha 8.3: nada arrastra la visita anterior) ============
        //Reset(inpBusqSol);
        //Reset(drpTablaSol);
        UpdateContext({
            ctxFilasPag: 25,
            ctxOrdenDesc: Coalesce(ctxOrdenDesc,true),
            ctxPagina: Coalesce(ctxPagina,1),
            ctxBusqueda: Trim(Coalesce(ctxBusqueda," ")),
            ctxBusqClienteGuid: Coalesce(ctxBusqClienteGuid,GUID("00000000-0000-0000-0000-000000000000")),
            ctxTabla: Trim(Coalesce(ctxTabla," ")),
            // ¿De qué tablas objetivo soy Approver? (colMisPermisos viene de App.OnStart; los
            // literales son el LOGICAL NAME de la entidad - D6 de 01 RESUELTA, ver 02 DC3 / 03
            // hallazgo crítico #3)
            ctxApruebaCliente:  CountRows(Filter(colMisPermisos, Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Approver && Name = "sanic_chtblclient")) > 0,
            ctxApruebaSucursal: CountRows(Filter(colMisPermisos, Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Approver && Name = "sanic_chtblclientbranch")) > 0,
            ctxApruebaCorreo:   CountRows(Filter(colMisPermisos, Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Approver && Name = "sanic_chtblclientemail")) > 0,
            ctxApruebaCuenta:   CountRows(Filter(colMisPermisos, Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Approver && Name = "sanic_chtblclientaccount")) > 0
        });
        // Segmento default: "Para mi decisión" si soy Approver de algo; si no, "Mías".
        // (Va en un UpdateContext SEPARADO: un UpdateContext no puede leer claves que setea él mismo.)
        UpdateContext({
            ctxSegmento: Coalesce(ctxSegmento,If(ctxApruebaCliente || ctxApruebaSucursal || ctxApruebaCorreo || ctxApruebaCuenta, "mi", "mias"))
        });
        // ============ 2) BLOQUE-COMPLETO (cola + contadores + grilla) ============
        // --- 2a. Cola "para mi decisión" - SIEMPRE se materializa (alimenta KPI 1, el contador del
        //     segmento y la grilla del segmento "mi"). Filtro 100% delegable: picklist = opción,
        //     desigualdad de GUID del lookup, OR de igualdades sobre TargetTable con booleanos
        //     constantes de contexto. Sin AddColumns antes del filtro (gotcha 8.12).
        ClearCollect(
            colParaMiSol,
            Sort(
                Filter(
                    'CH-Tbl-ClientDataChangeRequests',
                    'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted
                    && 'Created By'.User <> gvarUser.User
                    && (
                           (ctxApruebaCliente  && TargetTable = "sanic_chtblclient")
                        || (ctxApruebaSucursal && TargetTable = "sanic_chtblclientbranch")
                        || (ctxApruebaCorreo   && TargetTable = "sanic_chtblclientemail")
                        || (ctxApruebaCuenta   && TargetTable = "sanic_chtblclientaccount")
                    )
                ),
                'Created On', SortOrder.Descending
            )
        );
        // --- 2b. Contadores server-side (CountRows delegado a Dataverse; ver "A verificar") ---
        UpdateContext({
            ctxCountMias:        CountRows(Filter('CH-Tbl-ClientDataChangeRequests', 'Created By'.User = gvarUser.User)),
            ctxKpiResueltasHoy:  CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= Today())),
            ctxKpiAplicadasHoy:  CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= Today() && 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Applied)),
            ctxKpiRechazadasHoy: CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= Today() && 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Rejected)),
            ctxKpiFallidas7d:    CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= DateAdd(Today(), -7, TimeUnit.Days) && 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Failed))
        });
        // ============ 3) BLOQUE-GRILLA (la colección que pinta la galería, según segmento+filtros) ============
        // If POR FUERA de cada ClearCollect, con else - gotcha 8.13. En "mi" se filtra EN MEMORIA
        // sobre colParaMiSol (ya materializada y acotada); en "mias"/"todas" el filtro es server-side.
        If(
            ctxSegmento = "mi",
            ClearCollect(
                colSolicitudesSol,
                Filter(
                    colParaMiSol,
                    (ctxTabla = "" || TargetTable = ctxTabla)
                    && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                )
            ),
            ctxSegmento = "mias",
            ClearCollect(
                colSolicitudesSol,
                Sort(
                    Filter(
                        'CH-Tbl-ClientDataChangeRequests',
                        'Created By'.User = gvarUser.User
                        && (ctxTabla = "" || TargetTable = ctxTabla)
                        && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                    ),
                    'Created On', SortOrder.Descending
                )
            ),
            ClearCollect(
                colSolicitudesSol,
                Sort(
                    Filter(
                        'CH-Tbl-ClientDataChangeRequests',
                        (ctxTabla = "" || TargetTable = ctxTabla)
                        && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                    ),
                    'Created On', SortOrder.Descending
                )
            )
        );
        UpdateContext({ctxPagina: Coalesce(ctxPagina,1)})
    Children:
      - cmpAppHeaderSol:
          Control: CanvasComponent
          ComponentName: cmpAppHeader
          Properties:
            Activo: ="Solicitudes"
            Height: =fxHeaderH
            OnClientes: =Navigate(scrClientes, ScreenTransition.None)
            OnSolicitudes: =false
            RolTexto: =gvarRolTexto
            Subtitulo: ="Solicitudes de cambio"
            Titulo: ="Administración de Clientes"
            Width: =Parent.Width
      - cntToolbarSol:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =56
            Width: =Parent.Width
            Y: =fxHeaderH
          Children:
            - cntSegSol:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface2
                  Height: =32
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  Width: =btnSegTodasSol.X + btnSegTodasSol.Width + 3
                  X: =fxGutter
                  Y: =12
                Children:
                  - btnSegMiSol:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ctxSegmento = "mi", ThemeAccent, ThemeInk2)
                        Fill: =If(ctxSegmento = "mi", ThemeSurface, Color.Transparent)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ctxSegmento = "mi", FontWeight.Semibold, FontWeight.Normal)
                        Height: =26
                        HoverFill: =If(ctxSegmento = "mi", ThemeSurface, ThemeSurface2)
                        OnSelect: |-
                          =UpdateContext({ctxSegmento: "mi"});
                          If(
                              ctxSegmento = "mi",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Filter(
                                      colParaMiSol,
                                      (ctxTabla = "" || TargetTable = ctxTabla)
                                      && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                  )
                              ),
                              ctxSegmento = "mias",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          'Created By'.User = gvarUser.User
                                          && (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              ),
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              )
                          );
                          UpdateContext({ctxPagina: 1})
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Para mi decisión (" & CountRows(colParaMiSol) & ")"
                        Width: =Len(Self.Text) * 5.6 + 26
                        X: =3
                        Y: =3
                  - btnSegMiasSol:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ctxSegmento = "mias", ThemeAccent, ThemeInk2)
                        Fill: =If(ctxSegmento = "mias", ThemeSurface, Color.Transparent)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ctxSegmento = "mias", FontWeight.Semibold, FontWeight.Normal)
                        Height: =26
                        HoverFill: =If(ctxSegmento = "mias", ThemeSurface, ThemeSurface2)
                        OnSelect: |-
                          =UpdateContext({ctxSegmento: "mias"});
                          If(
                              ctxSegmento = "mi",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Filter(
                                      colParaMiSol,
                                      (ctxTabla = "" || TargetTable = ctxTabla)
                                      && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                  )
                              ),
                              ctxSegmento = "mias",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          'Created By'.User = gvarUser.User
                                          && (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              ),
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              )
                          );
                          UpdateContext({ctxPagina: 1})
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Mías (" & ctxCountMias & ")"
                        Width: =Len(Self.Text) * 5.6 + 26
                        X: =btnSegMiSol.X + btnSegMiSol.Width + 3
                        Y: =3
                  - btnSegTodasSol:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ctxSegmento = "todas", ThemeAccent, ThemeInk2)
                        Fill: =If(ctxSegmento = "todas", ThemeSurface, Color.Transparent)
                        Font: =Font.'Open Sans'
                        FontWeight: =If(ctxSegmento = "todas", FontWeight.Semibold, FontWeight.Normal)
                        Height: =26
                        HoverFill: =If(ctxSegmento = "todas", ThemeSurface, ThemeSurface2)
                        OnSelect: |-
                          =UpdateContext({ctxSegmento: "todas"});
                          If(
                              ctxSegmento = "mi",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Filter(
                                      colParaMiSol,
                                      (ctxTabla = "" || TargetTable = ctxTabla)
                                      && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                  )
                              ),
                              ctxSegmento = "mias",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          'Created By'.User = gvarUser.User
                                          && (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              ),
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              )
                          );
                          UpdateContext({ctxPagina: 1})
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Todas"
                        Width: =Len(Self.Text) * 5.6 + 26
                        X: =btnSegMiasSol.X + btnSegMiasSol.Width + 3
                        Y: =3
            - cntBusqSol:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Height: =32
                  Width: =Min(300, Parent.Width * 0.25)
                  X: =cntSegSol.X + cntSegSol.Width + fxGap
                  Y: =12
                Children:
                  - icoLupaBusqSol:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =ThemeInk3
                        Height: =16
                        Icon: =Icon.Search
                        Width: =16
                        X: =10
                        Y: =(Parent.Height - Self.Height) / 2
                  - inpBusqSol:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ThemeLine
                        Default: =""
                        Fill: =ThemeSurface
                        Height: =Parent.Height
                        HintText: ="N° de solicitud o cliente…"
                        OnChange: |-
                          =// inpBusqSol.OnChange - resuelve el "o cliente" de la búsqueda: el N° va delegable por
                          // StartsWith(Name, …); el cliente se resuelve UNA vez acá (LookUp delegable sobre el maestro)
                          // y entra al filtro como igualdad de GUID. Si nada matchea, GUID centinela que no matchea nunca
                          // (jamás Blank: compararía lookup vacío = Blank y matchearía RFCs sin cliente).
                          UpdateContext({
                              ctxBusqueda: Trim(Self.Text),
                              ctxBusqClienteGuid:
                                  If(
                                      IsBlank(Trim(Self.Text)),
                                      GUID("00000000-0000-0000-0000-000000000000"),
                                      Coalesce(
                                          LookUp('CH-Tbl-Clients', StartsWith(Name, Trim(Self.Text))).'CH-Tbl-Client',
                                          GUID("00000000-0000-0000-0000-000000000000")
                                      )
                                  )
                          });
                          If(
                              ctxSegmento = "mi",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Filter(
                                      colParaMiSol,
                                      (ctxTabla = "" || TargetTable = ctxTabla)
                                      && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                  )
                              ),
                              ctxSegmento = "mias",
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          'Created By'.User = gvarUser.User
                                          && (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              ),
                              ClearCollect(
                                  colSolicitudesSol,
                                  Sort(
                                      Filter(
                                          'CH-Tbl-ClientDataChangeRequests',
                                          (ctxTabla = "" || TargetTable = ctxTabla)
                                          && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                      ),
                                      'Created On', SortOrder.Descending
                                  )
                              )
                          );
                          UpdateContext({ctxPagina: 1})
                        Width: =Parent.Width - 32
                        X: =32
            - drpTablaSol:
                Control: Classic/DropDown@2.3.1
                Properties:
                  BorderColor: =ThemeLine
                  Fill: =ThemeSurface
                  Font: =Font.'Open Sans'
                  Height: =32
                  Items: |-
                    =// drpTablaSol.Items - los valores de la columna Tabla son el LOGICAL NAME de sanic_targettable
                    // (divergencia D6 de 01, RESUELTA - ver 02 DC3 / 03 hallazgo crítico #3)
                    Table(
                        {Etiqueta: "Todas las tablas", Tabla: ""},
                        {Etiqueta: "Clientes",   Tabla: "sanic_chtblclient"},
                        {Etiqueta: "Sucursales", Tabla: "sanic_chtblclientbranch"},
                        {Etiqueta: "Correos",    Tabla: "sanic_chtblclientemail"},
                        {Etiqueta: "Cuentas",    Tabla: "sanic_chtblclientaccount"}
                    )
                  Items.Value: =Etiqueta
                  OnChange: |-
                    =UpdateContext({ctxTabla: Self.Selected.Tabla});
                    If(
                        ctxSegmento = "mi",
                        ClearCollect(
                            colSolicitudesSol,
                            Filter(
                                colParaMiSol,
                                (ctxTabla = "" || TargetTable = ctxTabla)
                                && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                            )
                        ),
                        ctxSegmento = "mias",
                        ClearCollect(
                            colSolicitudesSol,
                            Sort(
                                Filter(
                                    'CH-Tbl-ClientDataChangeRequests',
                                    'Created By'.User = gvarUser.User
                                    && (ctxTabla = "" || TargetTable = ctxTabla)
                                    && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                ),
                                'Created On', SortOrder.Descending
                            )
                        ),
                        ClearCollect(
                            colSolicitudesSol,
                            Sort(
                                Filter(
                                    'CH-Tbl-ClientDataChangeRequests',
                                    (ctxTabla = "" || TargetTable = ctxTabla)
                                    && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                ),
                                'Created On', SortOrder.Descending
                            )
                        )
                    );
                    UpdateContext({ctxPagina: 1})
                  Size: =9
                  Width: =170
                  X: =cntBusqSol.X + cntBusqSol.Width + fxGap
                  Y: =12
            - btnRefrescarSol:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Color: =ThemeInk2
                  DisabledBorderColor: =Color.Transparent
                  DisabledColor: =ThemeInk3
                  DisabledFill: =ThemeLineSoft
                  Fill: =ThemeSurface
                  Font: =Font.'Open Sans'
                  Height: =26
                  HoverFill: =ThemeSurface2
                  OnSelect: |-
                    =Refresh('CH-Tbl-ClientDataChangeRequests');
                    ClearCollect(
                        colParaMiSol,
                        Sort(
                            Filter(
                                'CH-Tbl-ClientDataChangeRequests',
                                'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted
                                && 'Created By'.User <> gvarUser.User
                                && (
                                       (ctxApruebaCliente  && TargetTable = "sanic_chtblclient")
                                    || (ctxApruebaSucursal && TargetTable = "sanic_chtblclientbranch")
                                    || (ctxApruebaCorreo   && TargetTable = "sanic_chtblclientemail")
                                    || (ctxApruebaCuenta   && TargetTable = "sanic_chtblclientaccount")
                                )
                            ),
                            'Created On', SortOrder.Descending
                        )
                    );
                    UpdateContext({
                        ctxCountMias:        CountRows(Filter('CH-Tbl-ClientDataChangeRequests', 'Created By'.User = gvarUser.User)),
                        ctxKpiResueltasHoy:  CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= Today())),
                        ctxKpiAplicadasHoy:  CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= Today() && 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Applied)),
                        ctxKpiRechazadasHoy: CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= Today() && 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Rejected)),
                        ctxKpiFallidas7d:    CountRows(Filter('CH-Tbl-ClientDataChangeRequests', SolvedOn >= DateAdd(Today(), -7, TimeUnit.Days) && 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Failed))
                    });
                    If(
                        ctxSegmento = "mi",
                        ClearCollect(
                            colSolicitudesSol,
                            Filter(
                                colParaMiSol,
                                (ctxTabla = "" || TargetTable = ctxTabla)
                                && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                            )
                        ),
                        ctxSegmento = "mias",
                        ClearCollect(
                            colSolicitudesSol,
                            Sort(
                                Filter(
                                    'CH-Tbl-ClientDataChangeRequests',
                                    'Created By'.User = gvarUser.User
                                    && (ctxTabla = "" || TargetTable = ctxTabla)
                                    && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                ),
                                'Created On', SortOrder.Descending
                            )
                        ),
                        ClearCollect(
                            colSolicitudesSol,
                            Sort(
                                Filter(
                                    'CH-Tbl-ClientDataChangeRequests',
                                    (ctxTabla = "" || TargetTable = ctxTabla)
                                    && (ctxBusqueda = "" || StartsWith(Name, ctxBusqueda) || RelatedClient.'CH-Tbl-Client' = ctxBusqClienteGuid)
                                ),
                                'Created On', SortOrder.Descending
                            )
                        )
                    );
                    UpdateContext({ctxPagina: 1})
                  RadiusBottomLeft: =7
                  RadiusBottomRight: =7
                  RadiusTopLeft: =7
                  RadiusTopRight: =7
                  Size: =8.25
                  Text: ="↻ Actualizar"
                  Width: =110
                  X: =Parent.Width - fxGutter - Self.Width
                  Y: =(Parent.Height - 26) / 2
      - cntBodySol:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Parent.Width
            Y: =cntToolbarSol.Y + cntToolbarSol.Height
          Children:
            - cntKpiParaMiSol:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =fxKpiH
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =(Parent.Width - fxGutter*2 - fxGap*2) / 3
                  X: =fxGutter
                Children:
                  - lblKpiParaMiLabSol:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk3
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =14
                        Size: =7.88
                        Text: ="ESPERAN MI DECISIÓN"
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =8
                  - lblKpiParaMiValSol:
                      Control: Label@2.5.1
                      Properties:
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        Size: =16.5
                        Text: =CountRows(colParaMiSol)
                        Width: =Parent.Width - 30
                        X: =15
                        Y: =22
                  - lblKpiParaMiSubSol:
                      Control: Label@2.5.1
                      Properties:
                        Color: =ThemeInk2
                        Font: =Font.'Open Sans'
                        Height: =14
                        Size: =8.25
                        Text: |-
                          =// lblKpiParaMiSubSol.Text - antigüedad de la más vieja de MI cola (sobre la colección local;
                          // la fecha base es Created On: no existe sello de "enviada", ver Divergencias)
                          If(
                              CountRows(colParaMiSol) = 0,
                              "sin pendientes",
                              With(
                                  {vieja: First(Sort(colParaMiSol, 'Created On', SortOrder.Ascending)).'Created On'},
                                  If(
                                      DateDiff(vieja, Now(), TimeUnit.Hours) < 24,
