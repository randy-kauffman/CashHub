Screens:
  scrSolicitud:
    Properties:
      Fill: =ThemeBg
      LoadingSpinnerColor: =ThemeAccent
      OnVisible: |-
        =// --- 0) Estado local a default (gotcha 8.3: nunca arrastrar estado de la visita anterior) ---
        UpdateContext({
            ctxErrorDet: Blank(),
            ctxCargandoDet: false,
            ctxMostrarDlgDet: false,
            ctxModoDlgDet: "confirmar",
            ctxAccionDet: "",
            ctxPanelAgregarDet: false,
            ctxErrorPanelDet: Blank(),
            // Fallback de 01 §7.6 mientras sanic_CHResolveChangeRequest no esté desplegada como
            // datasource Environment. Cambiar a "true" el día que exista — ver Notas.
            ctxResolveApiListoDet: true
        });
        Reset(drpCampoDet);
        Reset(inpValorNuevoDet);
        // --- 1) Líneas del RFC ---
        ClearCollect(
            colLineasDet,
            Filter(
                'CH-Tbl-ClientDataChangeRequestLines',
                ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSolicitudSel.'CH-Tbl-ClientDataChangeRequest'
            )
        );
        ClearCollect(
            colCatalogoDet,
            Filter('CH-Tbl-ClientTableLogicalFieldNames', Table = gvarSolicitudSel.TargetTable && IsAllowed)
        );
        // --- 2) Valor ACTUAL del registro objetivo, en vivo — UN SOLO LookUp con ShowColumns.
        //     Gotcha 8.9 aplicado tambien a COLUMNAS: Power Fx no indirecciona un nombre de columna
        //     por variable, asi que el Switch de tabla trae explicitamente solo lo necesario por
        //     tabla (ClearCollect+If con else explicito, gotcha 8.13; en Create no hay registro aun).
        If(
            gvarSolicitudSel.Type <> 'Type (CH-Tbl-ClientDataChangeRequests)'.Create
                && !IsBlank(gvarSolicitudSel.TargetRecordID),
            Switch(
                gvarSolicitudSel.TargetTable,
                "sanic_chtblclient",
                With({_r: LookUp('CH-Tbl-Clients', 'CH-Tbl-Client' = GUID(gvarSolicitudSel.TargetRecordID))},
                    ClearCollect(colTargetRecordDet,
                        {LogicalName: "sanic_name", Valor: _r.Name},
                        {LogicalName: "sanic_cifbco", Valor: Text(_r.CIFBCO)},
                        {LogicalName: "sanic_cifcom", Valor: Text(_r.CIFCOM)},
                        {LogicalName: "sanic_taxid", Valor: Text(_r.TaxId)}
                    )
                ),
                "sanic_chtblclientbranch",
                With({_r: LookUp('CH-Tbl-ClientBranches', 'CH-Tbl-ClientBranch' = GUID(gvarSolicitudSel.TargetRecordID))},
                    ClearCollect(colTargetRecordDet,
                        {LogicalName: "sanic_name", Valor: _r.Name}
                    )
                ),
                "sanic_chtblclientemail",
                With({_r: LookUp('CH-Tbl-ClientEmails', 'CH-Tbl-ClientEmail' = GUID(gvarSolicitudSel.TargetRecordID))},
                    ClearCollect(colTargetRecordDet,
                        {LogicalName: "emailaddress", Valor: _r.'Email Address'},
                        {LogicalName: "sanic_alwaysnotify", Valor: If(_r.AlwaysNotify, "Sí", "No")}
                    )
                ),
                "sanic_chtblclientaccount",
                With({_r: LookUp('CH-Tbl-ClientAccounts', 'CH-Tbl-ClientAccount' = GUID(gvarSolicitudSel.TargetRecordID))},
                    ClearCollect(colTargetRecordDet,
                        {LogicalName: "sanic_name", Valor: _r.'Numero de cuenta'},
                        {LogicalName: "sanic_currency", Valor: Text(_r.Moneda)}
                    )
                ),
                Clear(colTargetRecordDet)
            ),
            Clear(colTargetRecordDet)
        );
        // --- 3) Auditoria real (solo existe si el RFC ya paso por la Custom API) ---
        ClearCollect(
            colAuditoriaDet,
            Sort(
                Filter(
                    'CH-Tbl-ClientDataChangesAuditTrails',
                    RelatedRFC.'CH-Tbl-ClientDataChangeRequest' = gvarSolicitudSel.'CH-Tbl-ClientDataChangeRequest'
                ),
                'Created On', SortOrder.Descending
            )
        );
        // --- 4) Historial unificado (real + sintetico) — ver Notas sobre por que no hay "Enviada" ---
        ClearCollect(
            colTimelineDet,
            {
                Titulo: "Creada (Borrador)",
                SubTitulo: Text(gvarSolicitudSel.'Created On', FmtFecha) & " · " & gvarSolicitudSel.'Created By'.'Full Name',
                Texto: "",
                Tono: "neutro",
                Orden: gvarSolicitudSel.'Created On'
            }
        );
        ForAll(
            colAuditoriaDet As A,
            Collect(
                colTimelineDet,
                {
                    Titulo: If(A.Result, "Aplicada", "Falló la aplicación"),
                    SubTitulo: Text(A.'Created On', FmtFecha) & " · " & A.'Created By'.'Full Name',
                    Texto: A.Message,
                    Tono: If(A.Result, "ok", "danger"),
                    Orden: A.'Created On'
                }
            )
        );
        If(
            gvarSolicitudSel.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Canceled,
            Collect(
                colTimelineDet,
                {
                    Titulo: "Cancelada",
                    SubTitulo: Text(gvarSolicitudSel.SolvedOn, FmtFecha) & " · " & gvarSolicitudSel.SolvedBy.'Full Name',
                    Texto: Coalesce(gvarSolicitudSel.ReasonForDecision, ""),
                    Tono: "neutro",
                    Orden: gvarSolicitudSel.SolvedOn
                }
            )
        );
        // --- 5) Conflictos por REGISTRO (mismo campo + mismo TargetRecordID + otro RFC en curso) ---
        //     Solo tiene sentido para el creador en Draft (SO5) — se acota para no pagar este Filter
        //     caro (no delegable — ver Notas de performance) en los demas estados.
        Clear(colConflictosDet);
        If(
            gvarSolicitudSel.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft
                && gvarSolicitudSel.'Created By'.User = gvarUser.User,
            ForAll(
                colLineasDet As L,
                Collect(
                    colConflictosDet,
                    Filter(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        ChangeRequestID.TargetRecordID = gvarSolicitudSel.TargetRecordID
                            && ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' <> gvarSolicitudSel.'CH-Tbl-ClientDataChangeRequest'
                            && (ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Draft
                                || ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted)
                            && 'Field Definition'.'CH-Tbl-ClientTableLogicalFieldName' = L.'Field Definition'.'CH-Tbl-ClientTableLogicalFieldName'
                    )
                )
            )
        );
    Children:
      - cmpAppHeaderDet:
          Control: CanvasComponent
          ComponentName: cmpAppHeader
          Properties:
            Activo: ="Solicitudes"
            Height: =fxHeaderH
            OnClientes: =Navigate(scrClientes, ScreenTransition.None)
            OnSolicitudes: =Navigate(scrSolicitudes, ScreenTransition.None)
            RolTexto: =gvarRolTexto
            Subtitulo: ="Detalle de solicitud"
            Titulo: ="Administración de Clientes"
            Width: =Parent.Width
      - cntCuerpoDet:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height - fxHeaderH
            Width: =Parent.Width
            Y: =fxHeaderH
          Children:
            - cntCardPrincipalDet:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =Parent.Height - fxGutter*2
                  RadiusBottomLeft: =fxCardR
                  RadiusBottomRight: =fxCardR
                  RadiusTopLeft: =fxCardR
                  RadiusTopRight: =fxCardR
                  Width: =(Parent.Width - fxGutter*2 - fxGap) * 0.62
                  X: =fxGutter
                  Y: =fxGutter
                Children:
                  - cntBarraDet:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =ThemeSurface2
                        Height: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =fxCardR - 1
                        RadiusTopRight: =fxCardR - 1
                        Width: =Parent.Width
                      Children:
                        - btnVolverDet:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =1
                              Color: =ThemeInk2
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              Fill: =ThemeSurface
                              Font: =Font.'Open Sans'
                              Height: =26
                              HoverFill: =ThemeSurface2
                              OnSelect: =Back(ScreenTransition.None)
                              RadiusBottomLeft: =7
                              RadiusBottomRight: =7
                              RadiusTopLeft: =7
                              RadiusTopRight: =7
                              Size: =8.25
                              Text: ="‹ Volver"
                              Width: =74
                              X: =12
                              Y: =(Parent.Height - 26)/2
                        - lblTituloBarraDet:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              Size: =9.75
                              Text: |-
                                =gvarSolicitudSel.Name & " · " &
                                    Switch(
                                        gvarSolicitudSel.Type,
                                        'Type (CH-Tbl-ClientDataChangeRequests)'.Update,     "Edición de " & Lower(Coalesce(gvarSolicitudSel.TargetTableDisplayName, gvarSolicitudSel.TargetTable)),
                                        'Type (CH-Tbl-ClientDataChangeRequests)'.Deactivate, "Desactivación de " & Lower(Coalesce(gvarSolicitudSel.TargetTableDisplayName, gvarSolicitudSel.TargetTable)),
                                        'Type (CH-Tbl-ClientDataChangeRequests)'.Create,     "Alta de " & Lower(Coalesce(gvarSolicitudSel.TargetTableDisplayName, gvarSolicitudSel.TargetTable)),
                                        'Type (CH-Tbl-ClientDataChangeRequests)'.Activate,   "Activación de " & Lower(Coalesce(gvarSolicitudSel.TargetTableDisplayName, gvarSolicitudSel.TargetTable)),
                                        "Solicitud de cambio"
                                    )
                              Width: =Parent.Width - Self.X - pilEstadoBarraDet.Width - 26
                              X: =btnVolverDet.X + btnVolverDet.Width + 10
                        - pilEstadoBarraDet:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeLineSoft
                              BorderThickness: =0
                              Color: |-
                                =Switch(
                                    gvarSolicitudSel.'Change Status',
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft,     ThemeInk3,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted, ThemeWarn,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved,  ThemeInfo,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Rejected,  ThemeDanger,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Applied,   ThemeOk,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Failed,    ThemeDanger,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Canceled,  ThemeInk3,
                                    ThemeInk3
                                )
                              DisplayMode: =DisplayMode.View
                              Fill: |-
                                =Switch(
                                    gvarSolicitudSel.'Change Status',
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft,     ThemeLineSoft,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted, ThemeWarnSoft,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved,  ThemeInfoSoft,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Rejected,  ThemeDangerSoft,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Applied,   ThemeOkSoft,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Failed,    ThemeDangerSoft,
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Canceled,  ThemeLineSoft,
                                    ThemeLineSoft
                                )
                              Font: =Font.'Open Sans'
                              Height: =20
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =Self.Color
                              HoverFill: =ColorFade(Self.Fill, 20%)
                              PressedBorderColor: =Self.Fill
                              PressedColor: =Self.Fill
                              PressedFill: =Self.Color
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =7.88
                              Text: |-
                                =Switch(
                                    gvarSolicitudSel.'Change Status',
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft,     "Borrador",
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted, "Enviada",
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved,  "Aprobada",
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Rejected,  "Rechazada",
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Applied,   "Aplicada",
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Failed,    "Fallida",
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Canceled,  "Cancelada",
                                    "—"
                                )
                              Width: =Len(Self.Text) * 5.4 + 18
                              X: =Parent.Width - 16 - Self.Width
                              Y: =(Parent.Height - 20)/2
                  - shpLineaBarraDet:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ThemeLineSoft
                        Height: =1
                        Width: =Parent.Width
                        Y: =cntBarraDet.Y + cntBarraDet.Height
                  - cntKvDet:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =Color.Transparent
                        Height: =lblVMotivoDet.Y + lblVMotivoDet.Height + 12
                        Width: =Parent.Width
                        Y: =shpLineaBarraDet.Y + 1
                      Children:
                        - lblKClienteDet:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =18
                              Size: =9
                              Text: ="Cliente"
                              Width: =78
                              X: =16
                              Y: =14
                        - lblVClienteDet:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              Size: =9
                              Text: =Coalesce(gvarClienteSel.Name, "—")
                              Width: =Parent.Width/2 - 106
                              X: =98
                              Y: =14
                        - lblKRegistroDet:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =18
                              Size: =9
                              Text: ="Tabla"
                              Width: =78
                              X: =Parent.Width/2 + 8
                              Y: =14
                        - lblVRegistroDet:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              Size: =9
                              Text: =gvarSolicitudSel.TargetTableDisplayName
                              Width: =Parent.Width/2 - 106
                              X: =Parent.Width/2 + 90
                              Y: =14
                        - lblKCreadaPorDet:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =18
                              Size: =9
                              Text: ="Creada por"
                              Width: =78
                              X: =16
                              Y: =40
                        - lblVCreadaPorDet:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              Size: =9
                              Text: =gvarSolicitudSel.'Created By'.'Full Name'
                              Width: =Parent.Width/2 - 106
                              X: =98
                              Y: =40
                        - lblKFechaDet:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =18
                              Size: =9
                              Text: |-
                                =Switch(
                                    gvarSolicitudSel.'Change Status',
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft, "Creada",
                                    'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted, "Enviada",
                                    "Resuelta"
                                )
                              Width: =78
                              X: =Parent.Width/2 + 8
                              Y: =40
                        - lblVFechaDet:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              Size: =9
                              Text: |-
                                =Text(
                                    If(
                                        gvarSolicitudSel.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft,
                                        gvarSolicitudSel.'Created On',
                                        Coalesce(gvarSolicitudSel.SolvedOn, gvarSolicitudSel.'Created On')
                                    ),
                                    FmtFecha
                                )
                              Width: =Parent.Width/2 - 106
                              X: =Parent.Width/2 + 90
                              Y: =40
                        - lblKMotivoDet:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk3
                              Font: =Font.'Open Sans'
                              Height: =18
                              Size: =9
                              Text: ="Motivo"
                              Width: =78
                              X: =16
                              Y: =66
                        - lblVMotivoDet:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Size: =9
                              Text: =Coalesce(gvarSolicitudSel.Reason, "—")
                              Width: =Parent.Width - 114
                              X: =98
                              Y: =66
                  - shpLineaKvDet:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ThemeLine
                        Height: =1
                        Width: =Parent.Width
                        Y: =cntKvDet.Y + cntKvDet.Height
                  - cntBackendPendienteDet:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =ThemeWarnSoft
                        Height: =lblBackendPendienteDet.Height + 18
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Visible: |-
                          =!ctxResolveApiListoDet
                              && gvarSolicitudSel.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted
                              && !IsBlank(LookUp(colMisPermisos, Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Approver && Name = gvarSolicitudSel.TargetTable))
                              && gvarSolicitudSel.'Created By'.User <> gvarUser.User
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =shpLineaKvDet.Y + 1 + 10
                      Children:
                        - lblBackendPendienteDet:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =ThemeWarn
                              Font: =Font.'Open Sans'
                              Size: =8.63
                              Text: |-
                                ="Backend pendiente: la Custom API sanic_CHResolveChangeRequest todavía no está desplegada."
                              Width: =Parent.Width - 26
                              X: =13
                              Y: =9
                  - cntErrorDet:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =ThemeDangerSoft
                        Height: =lblErrorDet.Height + 46
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Visible: =!IsBlank(ctxErrorDet)
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =cntBackendPendienteDet.Y + If(cntBackendPendienteDet.Visible, cntBackendPendienteDet.Height + 10, 0)
                      Children:
                        - lblErrorDet:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =ThemeDanger
                              Font: =Font.'Open Sans'
                              Size: =8.63
                              Text: |-
                                ="No se pudo completar la acción: " & ctxErrorDet
                              Width: =Parent.Width - 26
                              X: =13
                              Y: =9
                        - btnActualizarErrorDet:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeAccent
                              BorderThickness: =1
                              Color: =ThemeAccent
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              Fill: =ThemeSurface
                              Font: =Font.'Open Sans'
                              Height: =26
                              HoverFill: =ThemeAccentSoft
                              OnSelect: |-
                                =Set(
                                    gvarSolicitudSel,
                                    LookUp('CH-Tbl-ClientDataChangeRequests', 'CH-Tbl-ClientDataChangeRequest' = gvarSolicitudSel.'CH-Tbl-ClientDataChangeRequest')
                                );
                                Set(gvarClienteSel, gvarSolicitudSel.RelatedClient);
                                UpdateContext({ctxErrorDet: Blank()});
                                ClearCollect(
                                    colLineasDet,
                                    Filter(
                                        'CH-Tbl-ClientDataChangeRequestLines',
                                        ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSolicitudSel.'CH-Tbl-ClientDataChangeRequest'
                                    )
                                );
                                ClearCollect(
                                    colAuditoriaDet,
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ClientDataChangesAuditTrails',
                                            RelatedRFC.'CH-Tbl-ClientDataChangeRequest' = gvarSolicitudSel.'CH-Tbl-ClientDataChangeRequest'
                                        ),
                                        'Created On', SortOrder.Descending
                                    )
                                );
                                ClearCollect(
                                    colTimelineDet,
                                    {
                                        Titulo: "Creada (Borrador)",
                                        SubTitulo: Text(gvarSolicitudSel.'Created On', FmtFecha) & " · " & gvarSolicitudSel.'Created By'.'Full Name',
                                        Texto: "",
                                        Tono: "neutro",
                                        Orden: gvarSolicitudSel.'Created On'
                                    }
                                );
                                ForAll(
                                    colAuditoriaDet As A,
                                    Collect(
                                        colTimelineDet,
                                        {
                                            Titulo: If(A.Result, "Aplicada", "Falló la aplicación"),
                                            SubTitulo: Text(A.'Created On', FmtFecha) & " · " & A.'Created By'.'Full Name',
                                            Texto: A.Message,
                                            Tono: If(A.Result, "ok", "danger"),
                                            Orden: A.'Created On'
                                        }
                                    )
                                )
                              Size: =8.25
                              Text: ="↻ Actualizar detalle"
                              Width: =140
                              X: =13
                              Y: =lblErrorDet.Y + lblErrorDet.Height + 8
                  - cntToolbarLineasDet:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        Fill: =Color.Transparent
                        Height: =34
                        Visible: |-
                          =gvarSolicitudSel.'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft
                           && gvarSolicitudSel.'Created By'.User = gvarUser.User
                        Width: =Parent.Width
                        Y: =cntErrorDet.Y + If(cntErrorDet.Visible, cntErrorDet.Height + 10, 0)
                      Children:
                        - btnAgregarCambioDet:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeAccent
                              BorderThickness: =1
                              Color: =ThemeAccent
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              Fill: =ThemeSurface
                              Font: =Font.'Open Sans'
                              Height: =26
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext({ctxPanelAgregarDet: true, ctxErrorPanelDet: Blank()}); Reset(drpCampoDet); Reset(inpValorNuevoDet)
                              RadiusBottomLeft: =7
                              RadiusBottomRight: =7
                              RadiusTopLeft: =7
                              RadiusTopRight: =7
                              Size: =8.25
                              Text: ="+ Agregar cambio"
                              Width: =120
                              X: =12
                              Y: =4
                        - btnQuitarCambioDet:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =ThemeDangerLine
                              BorderThickness: =1
                              Color: =ThemeDanger
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =ThemeInk3
                              DisabledFill: =ThemeLineSoft
                              DisplayMode: =If(IsBlank(galLineasDet.Selected), DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =ThemeSurface
                              Font: =Font.'Open Sans'
                              Height: =26
                              HoverFill: =ThemeSurface2
                              OnSelect: |-
                                =UpdateContext({ctxAccionDet: "quitarlinea", ctxModoDlgDet: "confirmar", ctxMostrarDlgDet: true})
