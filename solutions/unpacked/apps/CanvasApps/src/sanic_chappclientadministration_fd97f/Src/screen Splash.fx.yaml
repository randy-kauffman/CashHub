"'screen Splash' As screen":
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: =

    Timer1 As timer:
        AutoStart: =true
        BorderColor: =App.Theme.Colors.Primary
        Color: =App.Theme.Colors.PrimaryForeground
        DisabledBorderColor: =RGBA(244, 244, 244, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Fill: =App.Theme.Colors.Primary
        Font: =App.Theme.Font
        HoverBorderColor: =App.Theme.Colors.Darker10
        HoverColor: =App.Theme.Colors.PrimaryForeground
        HoverFill: =App.Theme.Colors.Darker10
        OnTimerStart: |-
            =If(
                !IsBlank(Param("RFC")),
                Set(
                    gvarSelectedChangeRequest,
                    LookUp(
                        'CH-Tbl-ClientDataChangeRequests',
                        'CH-Tbl-ClientDataChangeRequest' = GUID(Param("RFC"))
                    )
                );
                Set(
                    gvarSelectedClient,
                    gvarSelectedChangeRequest.RelatedClient
                )
            );
            If(
                !IsBlank(gvarSelectedChangeRequest),
                Navigate(
                    'screen ChangeRequestDetails',
                    ScreenTransition.Fade
                ),
                Navigate(
                    'screen Clients',
                    ScreenTransition.Fade
                )
            )
        PressedBorderColor: =App.Theme.Colors.Darker40
        PressedColor: =Self.Color
        PressedFill: =App.Theme.Colors.Darker40
        Visible: =false
        X: =40
        Y: =40
        ZIndex: =1

