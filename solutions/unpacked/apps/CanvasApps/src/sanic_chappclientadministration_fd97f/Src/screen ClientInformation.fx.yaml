"'screen ClientInformation' As screen.'autoLayout_Sidebar_ver1.0'":
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =ClearCollect(
            colPendingRFCs,
            AddColumns(
                Filter(
                    'CH-Tbl-ClientDataChangeRequests',
                    'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved
                ),
                "pendingtargetid", TargetRecordID
            )
        );

    formRFC_Cliente_1 As form:
        AcceptsFocus: =false
        BorderColor: =App.Theme.Colors.Darker40
        DataSource: ='CH-Tbl-ClientDataChangeRequests'
        Fill: =RGBA(255, 255, 255, 1)
        Height: =341
        OnFailure: |-
            =UpdateContext({varShowScreenSpinner: false, varShowScreenSpinnerLabel: "",varShowSidePanel: false});
            UpdateContext(
                    {
                        varShowSidePanel: Blank(),
                        varRelatedClient: Blank(),
                        varTargetRecordID: Blank(),
                        varChangeStatus: Blank(),
                        varReason: Blank(),
                        varTargetTable: Blank(),
                        varTablePluralName: Blank(),
                        varRFCType: Blank(),
                        varTableDisplayName: Blank(),
                         varShowScreenSpinner: false
                    }
                );
        OnReset: |-
            =UpdateContext({varShowScreenSpinner: false, varShowScreenSpinnerLabel: "",varShowSidePanel: false});
            UpdateContext(
                    {
                        varShowSidePanel: Blank(),
                        varRelatedClient: Blank(),
                        varTargetRecordID: Blank(),
                        varChangeStatus: Blank(),
                        varReason: Blank(),
                        varTargetTable: Blank(),
                        varTablePluralName: Blank(),
                        varRFCType: Blank(),
                        varTableDisplayName: Blank(),
                         varShowScreenSpinner: false
                    }
                );
        OnSuccess: |
            =UpdateContext({varRFC: formRFC_Cliente_1.LastSubmit});
            Notify(
                "RFC creado con exito",
                NotificationType.Success
            );
            If(
                varRFC.Type = 'Type (CH-Tbl-ClientDataChangeRequests)'.Create,
                Switch(
                    varTableDisplayName,
                    "Sucursales",
            //Name
                    Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: Trim(DataCardValue2.Text),
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Sucursal" && Table = "sanic_chtblclientbranch"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                    //Cliente
            Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: gvarSelectedClient.'CH-Tbl-Client',
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Cliente" && Table = "sanic_chtblclientbranch"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                    ,
                    "Emails",
                //Email
                    Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: Trim(DataCardValue5.Text),
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Correo electronico" && Table = "sanic_chtblclientemail"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                    //Cliente
            Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: gvarSelectedClient.'CH-Tbl-Client',
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Cliente" && Table = "sanic_chtblclientemail"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                    //AlwaysNotify
            Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: Text(DataCardValue8.Selected.Value),
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Notificar siempre" && Table = "sanic_chtblclientemail"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                    ,
                    "Cuentas",
            //Numero de cuenta
                    Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: Trim(DataCardValue2Cta.Text),
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Numero de cuenta" && Table = "sanic_chtblclientaccount"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                    //Moneda
            Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: Text(DataCardValue8Cta.Selected.Value),
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Moneda" && Table = "sanic_chtblclientaccount"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                    //Cliente
            Patch(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                        {
                            NewValue: gvarSelectedClient.'CH-Tbl-Client',
                            ChangeRequestID: varRFC,
                            'Field Definition': LookUp(
                                'CH-Tbl-ClientTableLogicalFieldNames',
                                Name = "Cliente" && Table = "sanic_chtblclientaccount"
                            ),
                            ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted
                        }
                    );
                );
                
            );
            UpdateContext(
                {
                    varShowScreenSpinner: false,
                    varShowScreenSpinnerLabel: "",
                    varShowSidePanel: false
                }
            );
            UpdateContext(
                {
                    varShowSidePanel: Blank(),
                    varRelatedClient: Blank(),
                    varTargetRecordID: Blank(),
                    varChangeStatus: Blank(),
                    varReason: Blank(),
                    varTargetTable: Blank(),
                    varTablePluralName: Blank(),
                    varRFCType: Blank(),
                    varTableDisplayName: Blank(),
                    varShowScreenSpinner: false,
                    varDialogEditShow: false,
                    varDialogActivateShow: false
                }
            );
            ResetForm(formSucursales);
            ResetForm(formCorreos);
            ResetForm(formCuentas);
            Reset(txtInp);
            If(
                varRFC.Type = 'Type (CH-Tbl-ClientDataChangeRequests)'.Update,
                Set(
                    gvarSelectedChangeRequest,
                    varRFC
                );
                Navigate(
                    'screen ChangeRequestDetails',
                    ScreenTransition.Fade,{ FromScreen: App.ActiveScreen }
                )
            );
        Visible: =false
