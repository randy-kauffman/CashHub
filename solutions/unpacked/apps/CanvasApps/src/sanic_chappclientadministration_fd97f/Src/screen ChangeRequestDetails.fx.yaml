                                'Field Definition'.LogicalName = DataCardValue25.Selected.LogicalName && ChangeRequestID.TargetRecordID = gvarSelectedChangeRequest.TargetRecordID && ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' <> gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest' && (ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted || ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Approved)
                            )
                        }
                    );
