    dialogEnviar As Dialog:
        Buttons: |-
            =Table({Label: "Cancel", ButtonType:'Button.ButtonType'.Standard, HasBorder: false }, {Label: "Ok", ButtonType:'Button.ButtonType'.Primary, HasBorder: false })
        DialogHeight: =220
        Fill: =dialogEnviar.OverlayColor
        Height: =768
        OnButtonSelect: |
            =Switch(
                Self.SelectedButton.Label,
                "Cancel",
                UpdateContext(
                    {
                        varShowConfirmationDialog: false,
                        varConfirmationDialogTitle: "",
                        varConfirmationDialogSubtitle: ""
                    }
                );
                ,
                "Ok",
                UpdateContext(
                    {
                        varScreenSpinnerLabel: "Guardando...",
                        varScreenSpinnerVisibility: true
                    }
                );
                Clear(colSubmittionErrors);
                UpdateContext(
                    {
                        varRegistriesInConflict: "",
                        varContinue: true
                    }
                );
                Clear(colConflictRegistrie);
                ClearCollect(
                    colRegistriesToSubmit,
                    Filter(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest'
                    )
                );
                ForAll(
                    Filter(
                        'CH-Tbl-ClientDataChangeRequestLines',
                        ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' = gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest'
                    ) As CRL,
                    With(
                        {
                            varConflictRow: LookUp(
                                'CH-Tbl-ClientDataChangeRequestLines',
                                'Field Definition'.LogicalName = CRL.'Field Definition'.LogicalName && ChangeRequestID.TargetRecordID = gvarSelectedChangeRequest.TargetRecordID && ChangeRequestID.'CH-Tbl-ClientDataChangeRequest' <> gvarSelectedChangeRequest.'CH-Tbl-ClientDataChangeRequest' && (ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted || ChangeStatus = 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Approved)
                            )
                        },
                        Collect(
                            colConflictRegistrie,
                            varConflictRow
                        )
                    );
                );
                If(
                    !IsEmpty(colConflictRegistrie),
                    UpdateContext(
                        {
                            varRegistriesInConflict: "Existen cambios en status submitted/approved en conflicto con el RFC actual. Los siguientes campos se encuentran en conflicto: " & Concat(
                                colConflictRegistrie,
                                Concatenate(
                                    'Field Definition'.Name,
                                    " (",
                                    ChangeRequestID.Name,
                                    "-",
                                    Name,
                                    ")"
                                ),
                                ", "
                            )
                        }
                    );
                    Notify(
                        varRegistriesInConflict,
                        NotificationType.Error
                    );
                    UpdateContext({varContinue: false});
                );
                If(
                    varContinue,
                    ForAll(
                        colRegistriesToSubmit As Row,
                        Collect(
                            colSubmittionErrors,
                            Row
                        );
                        IfError(
                            Patch(
                                'CH-Tbl-ClientDataChangeRequestLines',
                                Row,
                                {ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequestLines)'.Submitted}
                            );
                            Remove(
                                colSubmittionErrors,
                                Row
                            );
                            ,
                            Blank()
                        )
                    );
                );
                If(
                    IsEmpty(colSubmittionErrors) && varContinue,
                    Patch(
                        'CH-Tbl-ClientDataChangeRequests',
                        gvarSelectedChangeRequest,
                        {'Change Status': 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted}
                    );
                    Notify(
                        "RFC guardado y enviado",
                        NotificationType.Success
                    );
                    UpdateContext(
                        {
                            varShowConfirmationDialog: false,
                            varConfirmationDialogTitle: "",
                            varConfirmationDialogSubtitle: ""
                        }
                    );
                    Set(
