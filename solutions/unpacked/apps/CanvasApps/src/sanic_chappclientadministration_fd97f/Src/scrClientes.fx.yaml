        cntKpiHoyCli As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface
            Height: =fxKpiH
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =11
            RadiusBottomRight: =11
            RadiusTopLeft: =11
