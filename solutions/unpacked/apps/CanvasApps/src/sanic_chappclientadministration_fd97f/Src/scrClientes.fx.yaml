                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                Size: =7.5
                Text: ="CLIENTE " & If(ctxOrdenAscCli, "▼", "▲")
                Width: =(Parent.Width - 32 - fxGap) * 0.25
