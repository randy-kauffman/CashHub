scrClientes As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =// 1) Estado local a default (gotcha 8.3 — no arrastrar estado de la visita anterior)
        UpdateContext({
            ctxSegEstadoCli: Coalesce(ctxSegEstadoCli,"Activos"),
            ctxPagCli: Coalesce(ctxPagCli,1),
            ctxPagTamCli: 50,
            ctxOrdenAscCli: Coalesce(ctxOrdenAscCli,true),
            ctxPanelAltaCli: Coalesce(ctxPanelAltaCli,false),
            ctxGuardandoCli: Coalesce(ctxGuardandoCli,false)
        });
        //Reset(inpBusqCli);
        // 2) RFCs sin resolver (badge "RFC en curso" + KPIs) — acotada por ESTADO server-side.
        //    Filtro delegable: ORs sobre el mismo picklist. Se re-ejecuta al volver de crear
        //    una solicitud (el boton del panel la refresca, y este OnVisible tambien).
        ClearCollect(
            colRfcEnCursoCli,
            Filter(
                'CH-Tbl-ClientDataChangeRequests',
                'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft
                || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted
                || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved
            )
        );
        // 3) Listado inicial: segmento "Activos", sin texto de busqueda (Search con "" devuelve todo). Solo en primera carga.
        If(!gvarCargaInicialClientes,
            ClearCollect(
                colClientesCli,
                Search(
                    Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active),
                    Trim(inpBusqCli.Text),
                    Name, CIFBCO, CIFCOM, TaxId
                )
            );
            Set(gvarCargaInicialClientes,true)
        )

    cmpAppHeaderCli As cmpAppHeader:
        Height: =fxHeaderH
        OnClientes: =false
        OnSolicitudes: =Navigate(scrSolicitudes, ScreenTransition.None)
        RolTexto: =gvarRolTexto
        Width: =Parent.Width
        ZIndex: =2

    cntToolbarCli As groupContainer.manualLayoutContainer:
        Fill: =Color.Transparent
        Height: =54
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        Y: =fxHeaderH
        ZIndex: =3

        cntSegEstadoCli As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface2
            Height: =34
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
            RadiusTopLeft: =9
            RadiusTopRight: =9
            Width: =btnSegTodosCli.X + btnSegTodosCli.Width + 3
            X: =fxGutter
            Y: =(Parent.Height - 34)/2
            ZIndex: =9

            btnSegTodosCli As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderThickness: =0
                Color: =If(ctxSegEstadoCli = "Todos", ThemeAccent, ThemeInk2)
                DisabledBorderColor: =Color.Transparent
                DisabledColor: =ThemeInk3
                DisabledFill: =ThemeLineSoft
                Fill: =If(ctxSegEstadoCli = "Todos", ThemeSurface, Color.Transparent)
                FontWeight: =If(ctxSegEstadoCli = "Todos", FontWeight.Semibold, FontWeight.Normal)
                Height: =28
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =If(ctxSegEstadoCli = "Todos", ThemeSurface, ThemeSurface2)
                OnSelect: |-
                    =UpdateContext({ctxSegEstadoCli: "Todos", ctxPagCli: 1});
                    ClearCollect(
                        colClientesCli,
                        Search('CH-Tbl-Clients', Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM, TaxId)
                    )
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                RadiusBottomLeft: =7
                RadiusBottomRight: =7
                RadiusTopLeft: =7
                RadiusTopRight: =7
                Size: =9
                Text: ="Todos"
                Width: =Len(Self.Text) * 6 + 22
                X: =btnSegPendientesCli.X + btnSegPendientesCli.Width + 3
                Y: =3
                ZIndex: =10

            btnSegPendientesCli As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderThickness: =0
                Color: =If(ctxSegEstadoCli = "Pendientes", ThemeAccent, ThemeInk2)
                DisabledBorderColor: =Color.Transparent
                DisabledColor: =ThemeInk3
                DisabledFill: =ThemeLineSoft
                Fill: =If(ctxSegEstadoCli = "Pendientes", ThemeSurface, Color.Transparent)
                FontWeight: =If(ctxSegEstadoCli = "Pendientes", FontWeight.Semibold, FontWeight.Normal)
                Height: =28
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =If(ctxSegEstadoCli = "Pendientes", ThemeSurface, ThemeSurface2)
                OnSelect: |-
                    =UpdateContext({ctxSegEstadoCli: "Pendientes", ctxPagCli: 1});
                    ClearCollect(
                        colClientesCli,
                        Search(
                            Filter(
                                'CH-Tbl-Clients',
                                RecordStatus = 'CH-Ch-RecordStatus'.PendingApproval
                                || RecordStatus = 'CH-Ch-RecordStatus'.PendingDeactivation
                            ),
                            Trim(inpBusqCli.Text),
                            Name, CIFBCO, CIFCOM, TaxId
                        )
                    )
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                RadiusBottomLeft: =7
                RadiusBottomRight: =7
                RadiusTopLeft: =7
                RadiusTopRight: =7
                Size: =9
                Text: |-
                    ="Pendientes (" & CountRows(
                        Filter(
                            'CH-Tbl-Clients',
                            RecordStatus = 'CH-Ch-RecordStatus'.PendingApproval
                            || RecordStatus = 'CH-Ch-RecordStatus'.PendingDeactivation
                        )
                    ) & ")"
                Width: =Len(Self.Text) * 6 + 22
                X: =btnSegInactivosCli.X + btnSegInactivosCli.Width + 3
                Y: =3
                ZIndex: =11

            btnSegInactivosCli As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderThickness: =0
                Color: =If(ctxSegEstadoCli = "Inactivos", ThemeAccent, ThemeInk2)
                DisabledBorderColor: =Color.Transparent
                DisabledColor: =ThemeInk3
                DisabledFill: =ThemeLineSoft
                Fill: =If(ctxSegEstadoCli = "Inactivos", ThemeSurface, Color.Transparent)
                FontWeight: =If(ctxSegEstadoCli = "Inactivos", FontWeight.Semibold, FontWeight.Normal)
                Height: =28
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =If(ctxSegEstadoCli = "Inactivos", ThemeSurface, ThemeSurface2)
                OnSelect: |-
                    =UpdateContext({ctxSegEstadoCli: "Inactivos", ctxPagCli: 1});
                    ClearCollect(
                        colClientesCli,
                        Search(
                            Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Inactive),
                            Trim(inpBusqCli.Text),
                            Name, CIFBCO, CIFCOM, TaxId
                        )
                    )
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                RadiusBottomLeft: =7
                RadiusBottomRight: =7
                RadiusTopLeft: =7
                RadiusTopRight: =7
                Size: =9
                Text: ="Inactivos (" & CountRows(Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Inactive)) & ")"
                Width: =Len(Self.Text) * 6 + 22
                X: =btnSegActivosCli.X + btnSegActivosCli.Width + 3
                Y: =3
                ZIndex: =12

            btnSegActivosCli As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderThickness: =0
                Color: =If(ctxSegEstadoCli = "Activos", ThemeAccent, ThemeInk2)
                DisabledBorderColor: =Color.Transparent
                DisabledColor: =ThemeInk3
                DisabledFill: =ThemeLineSoft
                Fill: =If(ctxSegEstadoCli = "Activos", ThemeSurface, Color.Transparent)
                FontWeight: =If(ctxSegEstadoCli = "Activos", FontWeight.Semibold, FontWeight.Normal)
                Height: =28
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =App.Theme.Colors.PrimaryForeground
                HoverFill: =If(ctxSegEstadoCli = "Activos", ThemeSurface, ThemeSurface2)
                OnSelect: |-
                    =UpdateContext({ctxSegEstadoCli: "Activos", ctxPagCli: 1});
                    ClearCollect(
                        colClientesCli,
                        Search(
                            Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active),
                            Trim(inpBusqCli.Text),
                            Name, CIFBCO, CIFCOM, TaxId
                        )
                    )
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =Self.Color
                PressedFill: =App.Theme.Colors.Darker40
                RadiusBottomLeft: =7
                RadiusBottomRight: =7
                RadiusTopLeft: =7
                RadiusTopRight: =7
                Size: =9
                Text: ="Activos (" & CountRows(Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active)) & ")"
                Width: =Len(Self.Text) * 6 + 22
                X: =3
                Y: =3
                ZIndex: =13

        cntBusqCli As groupContainer.manualLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =Color.Transparent
            Height: =32
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Min(340, Parent.Width * 0.25)
            X: =cntSegEstadoCli.X + cntSegEstadoCli.Width + fxGap
            Y: =(Parent.Height - 32)/2
            ZIndex: =14

            icoLupaBusqCli As icon:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(244, 244, 244, 1)
                Height: =16
                Icon: =Icon.Search
                Width: =16
                X: =10
                Y: =(Parent.Height - 16)/2
                ZIndex: =15

            inpBusqCli As text:
                BorderColor: =ThemeLine
                BorderThickness: =2
                Color: =RGBA(0, 0, 0, 1)
                Default: =
                DelayOutput: =true
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =ThemeSurface
                FocusedBorderThickness: =4
                Height: =Parent.Height
                HintText: ="Nombre, CIF BCO, CIF COM o TaxId…"
                HoverBorderColor: =ThemeLine
                HoverColor: =RGBA(0, 0, 0, 1)
                HoverFill: =App.Theme.Colors.Lighter70
                OnChange: |-
                    =UpdateContext({ctxPagCli: 1});
                    Switch(
                        ctxSegEstadoCli,
                        "Activos",
                        ClearCollect(
                            colClientesCli,
                            Search(
                                Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active),
                                Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM, TaxId
                            )
                        ),
                        "Inactivos",
                        ClearCollect(
                            colClientesCli,
                            Search(
                                Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Inactive),
                                Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM, TaxId
                            )
                        ),
                        "Pendientes",
                        ClearCollect(
                            colClientesCli,
                            Search(
                                Filter(
                                    'CH-Tbl-Clients',
                                    RecordStatus = 'CH-Ch-RecordStatus'.PendingApproval
                                    || RecordStatus = 'CH-Ch-RecordStatus'.PendingDeactivation
                                ),
                                Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM, TaxId
                            )
                        ),
                        ClearCollect(
                            colClientesCli,
                            Search('CH-Tbl-Clients', Trim(inpBusqCli.Text), Name, CIFBCO, CIFCOM, TaxId)
                        )
                    )
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =9
                Width: =Parent.Width - 32
                X: =32
                ZIndex: =16

        btnNuevoClienteCli As button:
            BorderColor: =App.Theme.Colors.Primary
            BorderThickness: =0
            Color: =ThemeSurface
            DisabledBorderColor: =Color.Transparent
            DisabledColor: =ThemeInk3
            DisabledFill: =ThemeLineSoft
            Fill: =ThemeAccent
            FontWeight: =FontWeight.Semibold
            Height: =32
            HoverBorderColor: =App.Theme.Colors.Darker10
            HoverColor: =App.Theme.Colors.PrimaryForeground
            HoverFill: =ThemeAccentDark
            OnSelect: |-
                =Reset(inpNombrePanCli);
                Reset(inpCifBcoPanCli);
                Reset(inpCifComPanCli);
                Reset(inpTaxIdPanCli);
                Reset(inpMotivoPanCli);
                UpdateContext({ctxPanelAltaCli: true})
            PressedBorderColor: =App.Theme.Colors.Darker40
            PressedColor: =Self.Color
            PressedFill: =App.Theme.Colors.Darker40
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =9
            Text: ="+ Nuevo cliente"
            Visible: =!IsBlank(LookUp(colMisPermisos, Name = "sanic_chtblclient" && Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Contributor))
            Width: =150
            X: =Parent.Width - fxGutter - Self.Width
            Y: =(Parent.Height - 32)/2
            ZIndex: =17

    cntBodyCli As groupContainer.manualLayoutContainer:
        Fill: =Color.Transparent
        Height: =Parent.Height - Self.Y
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        Y: =cntToolbarCli.Y + cntToolbarCli.Height
        ZIndex: =4

        cntKpiActivosCli As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface
            Height: =fxKpiH
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =11
            RadiusBottomRight: =11
            RadiusTopLeft: =11
            RadiusTopRight: =11
            Width: =(Parent.Width - fxGutter*2 - fxGap*3) / 4
            X: =fxGutter
            ZIndex: =18

            lblKpiActivosValCli As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =RGBA(0, 0, 0, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                FontWeight: =FontWeight.Bold
                Height: =26
                Size: =16.5
                Text: =Text(CountRows(Filter('CH-Tbl-Clients', RecordStatus = 'CH-Ch-RecordStatus'.Active)))
                Width: =Parent.Width - 30
                X: =15
                Y: =22
                ZIndex: =19

            lblKpiActivosLabCli As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                FontWeight: =FontWeight.Bold
                Height: =14
                Size: =7.88
                Text: ="CLIENTES ACTIVOS"
                Width: =Parent.Width - 30
                X: =15
                Y: =8
                ZIndex: =20

        cntKpiRfcCli As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface
            Height: =fxKpiH
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =11
            RadiusBottomRight: =11
            RadiusTopLeft: =11
            RadiusTopRight: =11
            Width: =(Parent.Width - fxGutter*2 - fxGap*3) / 4
            X: =cntKpiActivosCli.X + cntKpiActivosCli.Width + fxGap
            ZIndex: =21

            lblKpiRfcSubCli As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk2
                DisabledColor: =RGBA(166, 166, 166, 1)
                Height: =14
                Size: =8.25
                Text: ="solicitudes sin resolver"
                Width: =Parent.Width - 30
                X: =15
                Y: =48
                ZIndex: =1

            lblKpiRfcValCli As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =RGBA(0, 0, 0, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                FontWeight: =FontWeight.Bold
                Height: =26
                Size: =16.5
                Text: =Text(CountRows(Distinct(Filter(colRfcEnCursoCli, !IsBlank(RelatedClient)), Text(RelatedClient.'CH-Tbl-Client'))))
                Width: =Parent.Width - 30
                X: =15
