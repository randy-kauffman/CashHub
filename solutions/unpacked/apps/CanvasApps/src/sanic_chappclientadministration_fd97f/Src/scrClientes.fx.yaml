                ZIndex: =2

            lblKpiRfcLabCli As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                FontWeight: =FontWeight.Bold
                Height: =14
                Size: =7.88
                Text: ="CON RFC EN CURSO"
                Width: =Parent.Width - 30
                X: =15
                Y: =8
                ZIndex: =22

        cntKpiAltasCli As groupContainer.manualLayoutContainer:
