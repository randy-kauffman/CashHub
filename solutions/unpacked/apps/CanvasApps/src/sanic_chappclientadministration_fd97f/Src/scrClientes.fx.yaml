                Size: =16.5
                Text: =Text(CountRows(Filter('CH-Tbl-ClientDataChangeRequests', 'Created On' >= Today())))
                Width: =Parent.Width - 30
                X: =15
                Y: =22
                ZIndex: =2

            lblKpiHoyLabCli As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                FontWeight: =FontWeight.Bold
                Height: =14
                Size: =7.88
                Text: ="SOLICITUDES HOY"
