                Width: =(Parent.Width - 32 - fxGap) * 0.12
                X: =btnColClienteCli.X + btnColClienteCli.Width
                Y: =10
                ZIndex: =3

            lblColCifComCli As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk2
                DisabledColor: =RGBA(166, 166, 166, 1)
                FontWeight: =FontWeight.Bold
                Height: =16
                Size: =7.5
                Text: ="CIF COM"
                Width: =(Parent.Width - 32 - fxGap) * 0.12
                X: =lblColCifBcoCli.X + lblColCifBcoCli.Width
                Y: =10
                ZIndex: =4

            lblColEstadoCli As label:
