scrCliente As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =If(
            IsBlank(gvarClienteSel),
            Select(btnNavigatescrClientesFic),
            
                UpdateContext(
                    {
                        ctxTabFic: "Sucursales",
                        varPanelAbiertoFic: false,
                        varPanelModoFic: "",
                        varPanelAccionFic: "",
                        varDlgAccionFic: ""
                    }
                );
                Reset(inpBuscarTabFic);
                ClearCollect(
                    colRfcEnCursoFic,
                    Filter(
                        'CH-Tbl-ClientDataChangeRequests',
                        RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'
                        && (
                            'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Draft
                            || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Submitted
                            || 'Change Status' = 'Change Status (CH-Tbl-ClientDataChangeRequests)'.Approved
                        )
                    )
                );
                ClearCollect(colBranchesClienteFic, Filter('CH-Tbl-ClientBranches', Client.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));
                ClearCollect(colEmailsClienteFic, Filter('CH-Tbl-ClientEmails', Client.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));
                ClearCollect(colAccountsClienteFic, Filter('CH-Tbl-ClientAccounts', Client.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));
                ClearCollect(colSolicitudesClienteFic, Filter('CH-Tbl-ClientDataChangeRequests', RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));
                ClearCollect(colAuditClienteFic, Filter('CH-Tbl-ClientDataChangesAuditTrails', RelatedClient.'CH-Tbl-Client' = gvarClienteSel.'CH-Tbl-Client'));
                Clear(colCuentasRevFic);
                Clear(colCambiosPanelFic);
                Reset(galSucursalesFic);
                Reset(galCorreosFic);
                Reset(galCuentasFic);
                Reset(galSolicitudesFic);
                Reset(galBitacoraFic)
            
        )

    cmpAppHeaderFic As cmpAppHeader:
        Height: =fxHeaderH
        OnClientes: =false
        OnSolicitudes: =Navigate(scrSolicitudes, ScreenTransition.None)
        RolTexto: =gvarRolTexto
        Subtitulo: ="Ficha de cliente"
        Width: =Parent.Width
        ZIndex: =2

    cntBodyFic As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =Color.Transparent
        Height: =Parent.Height - Self.Y
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        Y: =cmpAppHeaderFic.Y + cmpAppHeaderFic.Height
        ZIndex: =3

        cntSideFic As groupContainer.manualLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =Color.Transparent
            Height: =Parent.Height - fxGutter*2
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =fxSideW
            X: =fxGutter
            Y: =fxGutter
            ZIndex: =40

            cntTarjetaClienteFic As groupContainer.manualLayoutContainer:
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =ThemeSurface
                Height: =lblKvCuentasValFic.Y + lblKvCuentasValFic.Height + 14
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =fxCardR
                RadiusBottomRight: =fxCardR
                RadiusTopLeft: =fxCardR
                RadiusTopRight: =fxCardR
                Width: =Parent.Width
                ZIndex: =41

                cntTarjetaClienteHeadFic As groupContainer.manualLayoutContainer:
                    BorderColor: =ThemeLine
                    BorderThickness: =1
                    DropShadow: =DropShadow.Light
                    Fill: =ThemeSurface2
                    Height: =38
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    RadiusBottomLeft: =4
                    RadiusBottomRight: =4
                    RadiusTopLeft: =4
                    RadiusTopRight: =4
                    Width: =Parent.Width
                    ZIndex: =42

                    btnVolverFic As button:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Color: =ThemeInk2
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        Fill: =ThemeSurface
                        FontWeight: =FontWeight.Semibold
                        Height: =26
                        HoverBorderColor: =ThemeLine
                        HoverColor: =ThemeInk2
                        HoverFill: =ThemeSurface2
                        OnSelect: =Navigate(scrClientes, ScreenTransition.None)
                        PressedBorderColor: =ThemeLine
                        PressedColor: =ThemeInk2
                        PressedFill: =ThemeSurface2
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =8.25
                        Text: ="‹ Volver"
                        Width: =62
                        X: =12
                        Y: =(Parent.Height-26)/2
                        ZIndex: =43

                    pilEstadoClienteFic As button:
                        BorderColor: =ThemeLineSoft
                        BorderThickness: =If(gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Inactive, 1, 0)
                        Color: =Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,ThemeOk, 'CH-Ch-RecordStatus'.Inactive,ThemeInk3, 'CH-Ch-RecordStatus'.PendingApproval,ThemeWarn, 'CH-Ch-RecordStatus'.PendingDeactivation,ThemeWarn, ThemeInk3)
                        DisabledBorderColor: =Color.Transparent
                        DisabledColor: =ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        DisplayMode: =DisplayMode.View
                        Fill: =Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,ThemeOkSoft, 'CH-Ch-RecordStatus'.Inactive,ThemeLineSoft, 'CH-Ch-RecordStatus'.PendingApproval,ThemeWarnSoft, 'CH-Ch-RecordStatus'.PendingDeactivation,ThemeWarnSoft, ThemeLineSoft)
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        HoverBorderColor: =Self.BorderColor
                        HoverFill: =Self.Fill
                        PressedBorderColor: =Self.BorderColor
                        PressedColor: =Self.Color
                        PressedFill: =Self.Fill
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Size: =7.88
                        Text: =Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,"Activo", 'CH-Ch-RecordStatus'.Inactive,"Inactivo", 'CH-Ch-RecordStatus'.PendingApproval,"Pend. aprobación", 'CH-Ch-RecordStatus'.PendingDeactivation,"Pend. desactivación", "—")
                        Width: =Len(Switch(gvarClienteSel.RecordStatus, 'CH-Ch-RecordStatus'.Active,"Activo",'CH-Ch-RecordStatus'.Inactive,"Inactivo",'CH-Ch-RecordStatus'.PendingApproval,"Pend. aprobación",'CH-Ch-RecordStatus'.PendingDeactivation,"Pend. desactivación","—")) * 5.4 + 18
                        X: =Parent.Width - 12 - Self.Width
                        Y: =(Parent.Height-20)/2
                        ZIndex: =44

                lblNombreClienteFic As label:
                    AutoHeight: =true
                    BorderColor: =ThemeLine
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =20
                    Size: =10.88
                    Text: =gvarClienteSel.Name
                    Width: =Parent.Width - 28
                    X: =14
                    Y: =cntTarjetaClienteHeadFic.Y + cntTarjetaClienteHeadFic.Height + 12
                    ZIndex: =45

                lblClienteDesdeFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =16
                    Size: =8.63
                    Text: ="Cliente desde " & Lower(Text(gvarClienteSel.'Created On', "mmm yyyy"))
                    Width: =Parent.Width - 28
                    X: =14
                    Y: =lblNombreClienteFic.Y + lblNombreClienteFic.Height + 2
                    ZIndex: =46

                lblKvCifBcoLabFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =16
                    Size: =9
                    Text: ="CIF BCO"
                    Width: =90
                    X: =14
                    Y: =lblClienteDesdeFic.Y + lblClienteDesdeFic.Height + 10
                    ZIndex: =47

                lblKvCifBcoValFic As label:
                    Align: =Align.Right
                    BorderColor: =ThemeLine
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =16
                    Size: =9
                    Text: =gvarClienteSel.CIFBCO
                    Width: =Parent.Width - 28 - Self.X
                    X: =lblKvCifBcoLabFic.X + lblKvCifBcoLabFic.Width
                    Y: =lblKvCifBcoLabFic.Y
                    ZIndex: =48

                lblKvCifComLabFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =16
                    Size: =9
                    Text: ="CIF COM"
                    Width: =90
                    X: =14
                    Y: =lblKvCifBcoLabFic.Y + lblKvCifBcoLabFic.Height + 5
                    ZIndex: =49

                lblKvCifComValFic As label:
                    Align: =Align.Right
                    BorderColor: =ThemeLine
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =16
                    Size: =9
                    Text: =gvarClienteSel.CIFCOM
                    Width: =Parent.Width - 28 - Self.X
                    X: =lblKvCifComLabFic.X + lblKvCifComLabFic.Width
                    Y: =lblKvCifComLabFic.Y
                    ZIndex: =50

                lblKvSucursalesLabFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =16
                    Size: =9
                    Text: ="Sucursales"
                    Width: =90
                    X: =14
                    Y: =lblKvTaxIdLabFic.Y + lblKvTaxIdLabFic.Height + 5
                    ZIndex: =51

                lblKvSucursalesValFic As label:
                    Align: =Align.Right
                    BorderColor: =ThemeLine
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =16
                    Size: =9
                    Text: =CountRows(Filter(colBranchesClienteFic, RecordStatus = 'CH-Ch-RecordStatus'.Active)) & " activas"
                    Width: =Parent.Width - 28 - Self.X
                    X: =lblKvSucursalesLabFic.X + lblKvSucursalesLabFic.Width
                    Y: =lblKvSucursalesLabFic.Y
                    ZIndex: =52

                lblKvCorreosLabFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =16
                    Size: =9
                    Text: ="Correos"
                    Width: =90
                    X: =14
                    Y: =lblKvSucursalesLabFic.Y + lblKvSucursalesLabFic.Height + 5
                    ZIndex: =53

                lblKvCorreosValFic As label:
                    Align: =Align.Right
                    BorderColor: =ThemeLine
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =16
                    Size: =9
                    Text: =CountRows(Filter(colEmailsClienteFic, RecordStatus = 'CH-Ch-RecordStatus'.Active)) & " autorizados"
                    Width: =Parent.Width - 28 - Self.X
                    X: =lblKvCorreosLabFic.X + lblKvCorreosLabFic.Width
                    Y: =lblKvCorreosLabFic.Y
                    ZIndex: =54

                lblKvCuentasLabFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =16
                    Size: =9
                    Text: ="Cuentas"
                    Width: =90
                    X: =14
                    Y: =lblKvCorreosLabFic.Y + lblKvCorreosLabFic.Height + 5
                    ZIndex: =55

                lblKvCuentasValFic As label:
                    Align: =Align.Right
                    BorderColor: =ThemeLine
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =16
                    Size: =9
                    Text: =Text(CountRows(colAccountsClienteFic))
                    Width: =Parent.Width - 28 - Self.X
                    X: =lblKvCuentasLabFic.X + lblKvCuentasLabFic.Width
                    Y: =lblKvCuentasLabFic.Y
                    ZIndex: =56

                lblKvTaxIdLabFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =16
                    Size: =9
                    Text: ="Tax ID"
                    Width: =90
                    X: =14
                    Y: =lblKvCifComLabFic.Y + lblKvCifComLabFic.Height + 5
                    ZIndex: =57

                lblKvTaxIdValFic As label:
                    Align: =Align.Right
                    BorderColor: =ThemeLine
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =16
                    Size: =9
                    Text: =If(IsBlank(gvarClienteSel.TaxId), "—", gvarClienteSel.TaxId)
                    Width: =Parent.Width - 28 - Self.X
                    X: =lblKvTaxIdLabFic.X + lblKvTaxIdLabFic.Width
                    Y: =lblKvTaxIdLabFic.Y
                    ZIndex: =58

            cntAccionesClienteFic As groupContainer.manualLayoutContainer:
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =ThemeSurface
                Height: =Parent.Height - Self.Y
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =fxCardR
                RadiusBottomRight: =fxCardR
                RadiusTopLeft: =fxCardR
                RadiusTopRight: =fxCardR
                Width: =Parent.Width
                Y: =cntTarjetaClienteFic.Y + cntTarjetaClienteFic.Height + fxGap
                ZIndex: =57

                lblAccionesHeadFic As label:
                    BorderColor: =ThemeLine
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Fill: =ThemeSurface2
                    FontWeight: =FontWeight.Bold
                    Height: =30
                    Size: =7.5
                    Text: ="ACCIONES SOBRE EL CLIENTE"
                    Width: =Parent.Width-14
                    X: =14
                    ZIndex: =58

                btnEditarClienteFic As button:
                    BorderColor: =ThemeAccent
                    BorderThickness: =1
                    Color: =ThemeAccent
                    DisabledBorderColor: =Color.Transparent
                    DisabledColor: =ThemeInk3
                    DisabledFill: =ThemeLineSoft
                    DisplayMode: |-
                        =If(
                            !IsBlank(LookUp(colMisPermisos, Name = "sanic_chtblclient" && Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Contributor))
                            && gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Active
                            && IsBlank(LookUp(colRfcEnCursoFic, TargetTable = "sanic_chtblclient" && TargetRecordID = Text(gvarClienteSel.'CH-Tbl-Client'))),
                            DisplayMode.Edit,
                            DisplayMode.Disabled
                        )
                    Fill: =ThemeSurface
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    HoverBorderColor: =ThemeAccent
                    HoverColor: =ThemeAccent
                    HoverFill: =ThemeSurface2
                    OnSelect: |-
                        =UpdateContext(
                            {
                                varPanelModoFic: "cliente",
                                varPanelAccionFic: "Editar",
                                varPanelTargetIdFic: gvarClienteSel.'CH-Tbl-Client',
                                varPanelAbiertoFic: true
                            }
                        );
                        Reset(inpPanelCampoAFic);
                        Reset(inpPanelCampoBFic);
                        Reset(inpPanelCampoCFic);
                        Reset(inpPanelCampoDFic);
                        Reset(inpMotivoPanelFic);
                        Clear(colCambiosPanelFic)
                    PressedBorderColor: =ThemeAccent
                    PressedColor: =ThemeAccent
                    PressedFill: =ThemeSurface2
                    RadiusBottomLeft: =7
                    RadiusBottomRight: =7
                    RadiusTopLeft: =7
                    RadiusTopRight: =7
                    Size: =8.25
                    Text: ="✎ Solicitar edición de datos"
                    Width: =Parent.Width - 28
                    X: =14
                    Y: =lblAccionesHeadFic.Y + lblAccionesHeadFic.Height + 9
                    ZIndex: =59

                btnDesactivarClienteFic As button:
                    BorderColor: =ThemeDangerLine
                    BorderThickness: =1
                    Color: =ThemeDanger
                    DisabledBorderColor: =Color.Transparent
                    DisabledColor: =ThemeInk3
                    DisabledFill: =ThemeLineSoft
                    DisplayMode: |-
                        =If(
                            !IsBlank(LookUp(colMisPermisos, Name = "sanic_chtblclient" && Type = 'Type (CH-Tbl-ClientDataChangePermissions)'.Contributor))
                            && IsBlank(LookUp(colRfcEnCursoFic, TargetTable = "sanic_chtblclient" && TargetRecordID = Text(gvarClienteSel.'CH-Tbl-Client'))),
                            DisplayMode.Edit,
                            DisplayMode.Disabled
                        )
                    Fill: =ThemeSurface
                    FontWeight: =FontWeight.Semibold
                    Height: =26
                    HoverBorderColor: =ThemeDangerLine
                    HoverColor: =ThemeDanger
                    HoverFill: =ThemeSurface2
                    OnSelect: |-
                        =UpdateContext(
                            {
                                varDlgAccionFic: If(gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Inactive, "Activar", "Desactivar"),
                                varDlgTargetTableFic: "sanic_chtblclient",
                                varDlgTargetTableLabelFic: "Clientes",
                                varDlgTargetTablePluralFic: "sanic_chtblclients",
                                varDlgTargetIdFic: gvarClienteSel.'CH-Tbl-Client',
                                varDlgTargetNombreFic: gvarClienteSel.Name
                            }
                        )
                    PressedBorderColor: =ThemeDangerLine
                    PressedColor: =ThemeDanger
                    PressedFill: =ThemeSurface2
                    RadiusBottomLeft: =7
                    RadiusBottomRight: =7
                    RadiusTopLeft: =7
                    RadiusTopRight: =7
                    Size: =8.25
                    Text: =If(gvarClienteSel.RecordStatus = 'CH-Ch-RecordStatus'.Inactive, "Solicitar activación", "Solicitar desactivación")
                    Width: =Parent.Width - 28
                    X: =14
                    Y: =btnEditarClienteFic.Y + btnEditarClienteFic.Height + 8
                    ZIndex: =60

                cntBannerRfcClienteFic As groupContainer.manualLayoutContainer:
                    DropShadow: =DropShadow.Light
                    Fill: =ThemeWarnSoft
                    Height: =lblBannerRfcClienteFic.Height + 14
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    RadiusBottomLeft: =9
                    RadiusBottomRight: =9
                    RadiusTopLeft: =9
                    RadiusTopRight: =9
                    Visible: =!IsBlank(LookUp(colRfcEnCursoFic, TargetTable = "sanic_chtblclient" && TargetRecordID = Text(gvarClienteSel.'CH-Tbl-Client')))
                    Width: =Parent.Width - 28
                    X: =14
                    Y: =btnDesactivarClienteFic.Y + btnDesactivarClienteFic.Height + 10
                    ZIndex: =61

                    lblBannerRfcClienteFic As label:
                        AutoHeight: =true
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =ThemeWarn
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        Size: =7.5
                        Text: ="Hay 1 solicitud en curso sobre este cliente — no se puede pedir otra edición del mismo campo hasta que se resuelva."
                        Width: =Parent.Width - 20
                        X: =10
                        Y: =7
                        ZIndex: =62

        cntMainFic As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface
            Height: =Parent.Height - fxGutter*2
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =fxCardR
            RadiusBottomRight: =fxCardR
            RadiusTopLeft: =fxCardR
            RadiusTopRight: =fxCardR
            Width: =Parent.Width - Self.X - fxGutter
            X: =cntSideFic.X + cntSideFic.Width + fxGap
            Y: =fxGutter
            ZIndex: =63

            cntTabsFic As groupContainer.manualLayoutContainer:
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =Color.Transparent
                Height: =40
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =4
                RadiusBottomRight: =4
                RadiusTopLeft: =4
                RadiusTopRight: =4
                Width: =Parent.Width
                ZIndex: =64

                btnTabSucursalesFic As button:
                    BorderThickness: =0
                    Color: =If(ctxTabFic = "Sucursales", ThemeAccent, ThemeInk2)
                    DisabledBorderColor: =Color.Transparent
                    DisabledColor: =ThemeInk3
                    DisabledFill: =ThemeLineSoft
                    Fill: =Color.Transparent
                    FontWeight: =If(ctxTabFic = "Sucursales", FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.Height
                    HoverFill: =ThemeSurface2
                    OnSelect: |-
                        =UpdateContext({ctxTabFic: "Sucursales"}); Reset(inpBuscarTabFic)
                    RadiusBottomLeft: =8
                    RadiusBottomRight: =8
                    RadiusTopLeft: =8
                    RadiusTopRight: =8
                    Size: =9
                    Text: ="Sucursales (" & CountRows(colBranchesClienteFic) & ")"
                    Width: =Len("Sucursales") * 6.4 + 56
                    X: =14
                    ZIndex: =65

                btnTabSolicitudesFic As button:
                    BorderThickness: =0
                    Color: =If(ctxTabFic = "Solicitudes", ThemeAccent, ThemeInk2)
                    DisabledBorderColor: =Color.Transparent
                    DisabledColor: =ThemeInk3
                    DisabledFill: =ThemeLineSoft
                    Fill: =Color.Transparent
                    FontWeight: =If(ctxTabFic = "Solicitudes", FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.Height
                    HoverFill: =ThemeSurface2
                    OnSelect: |-
                        =UpdateContext({ctxTabFic: "Solicitudes"}); Reset(inpBuscarTabFic)
                    RadiusBottomLeft: =8
                    RadiusBottomRight: =8
                    RadiusTopLeft: =8
                    RadiusTopRight: =8
                    Size: =9
                    Text: ="Solicitudes (" & CountRows(colSolicitudesClienteFic) & ")"
                    Width: =Len("Solicitudes") * 6.4 + 56
                    X: =btnTabCuentasFic.X + btnTabCuentasFic.Width
                    ZIndex: =66

                btnTabCuentasFic As button:
                    BorderThickness: =0
                    Color: =If(ctxTabFic = "Cuentas", ThemeAccent, ThemeInk2)
                    DisabledBorderColor: =Color.Transparent
                    DisabledColor: =ThemeInk3
                    DisabledFill: =ThemeLineSoft
                    Fill: =Color.Transparent
                    FontWeight: =If(ctxTabFic = "Cuentas", FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.Height
                    HoverFill: =ThemeSurface2
                    OnSelect: |-
                        =UpdateContext({ctxTabFic: "Cuentas"}); Reset(inpBuscarTabFic)
                    RadiusBottomLeft: =8
                    RadiusBottomRight: =8
                    RadiusTopLeft: =8
                    RadiusTopRight: =8
                    Size: =9
                    Text: ="Cuentas (" & CountRows(colAccountsClienteFic) & ")"
                    Width: =Len("Cuentas") * 6.4 + 56
                    X: =btnTabCorreosFic.X + btnTabCorreosFic.Width
                    ZIndex: =67

                btnTabCorreosFic As button:
                    BorderThickness: =0
                    Color: =If(ctxTabFic = "Correos", ThemeAccent, ThemeInk2)
                    DisabledBorderColor: =Color.Transparent
                    DisabledColor: =ThemeInk3
                    DisabledFill: =ThemeLineSoft
                    Fill: =Color.Transparent
                    FontWeight: =If(ctxTabFic = "Correos", FontWeight.Semibold, FontWeight.Normal)
                    Height: =Parent.Height
                    HoverFill: =ThemeSurface2
                    OnSelect: |-
                        =UpdateContext({ctxTabFic: "Correos"}); Reset(inpBuscarTabFic)
                    RadiusBottomLeft: =8
                    RadiusBottomRight: =8
                    RadiusTopLeft: =8
                    RadiusTopRight: =8
                    Size: =9
                    Text: ="Correos (" & CountRows(colEmailsClienteFic) & ")"
                    Width: =Len("Correos") * 6.4 + 56
                    X: =btnTabSucursalesFic.X + btnTabSucursalesFic.Width
