scrSplash As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: =Set(gvarCargaInicialClientes,false);Set(gvarCargaInicialSolicitudes,false)

    lblCargandoSpl As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =ThemeInk3
        DisabledColor: =RGBA(166, 166, 166, 1)
        Height: =20
        Size: =9.5
        Text: ="Cargando…"
        Width: =160
        X: =App.Width/2 - 80
        Y: =App.Height/2 - 8
        ZIndex: =1

    lblMarcaSpl As label:
        Align: =Align.Center
        BorderColor: =App.Theme.Colors.Darker40
        Color: =ThemeSurface
        DisabledColor: =RGBA(166, 166, 166, 1)
        Fill: =ThemeAccent
        FontWeight: =FontWeight.Bold
        Size: =18
        Text: ="C$"
        Width: =40
        X: =App.Width/2 - 20
        Y: =App.Height/2 - 60
        ZIndex: =2

    tmrSplash As timer:
        AutoStart: =true
        BorderColor: =App.Theme.Colors.Primary
        Color: =App.Theme.Colors.PrimaryForeground
        DisabledBorderColor: =RGBA(244, 244, 244, 1)
        DisabledColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Duration: =350
        Fill: =App.Theme.Colors.Primary
        Font: =App.Theme.Font
        Height: =4
        HoverBorderColor: =App.Theme.Colors.Darker10
        HoverColor: =App.Theme.Colors.PrimaryForeground
        HoverFill: =App.Theme.Colors.Darker10
        OnTimerEnd: |-
            =If(
                !IsBlank(gvarSolicitudSel),
                Navigate(scrSolicitud, ScreenTransition.Fade),
                Navigate(scrClientes, ScreenTransition.Fade)
            )
        PressedBorderColor: =App.Theme.Colors.Darker40
        PressedColor: =Self.Color
        PressedFill: =App.Theme.Colors.Darker40
        Visible: =false
        Width: =40
        X: =App.Width/2 - 20
        Y: =App.Height/2 + 20
        ZIndex: =3

