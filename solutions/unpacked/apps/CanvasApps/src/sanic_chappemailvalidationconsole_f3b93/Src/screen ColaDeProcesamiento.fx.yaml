"'screen ColaDeProcesamiento' As screen.'autoLayout_Sidebar_ver1.0'":
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =UpdateContext({varVista: "TODO"});
        // Catalogo de reglas: 28 filas fijas. Se carga una vez para poder cruzarlo
        // contra los resultados en memoria sin advertencias de delegacion.
        ClearCollect(colReglasActivas, Filter('CH-Tbl-ValidationRules', IsActive = true));
        Select(galBandeja);
        // Salud del pipeline: latido del barrido + cola real
        UpdateContext(
            {
                varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                varEsperandoBanca: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual')),
                varSospechosos: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso)),
                varPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                varErroresSistema: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                varRespuestasPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente And ReplyAttempts >= 3))
            }
        );
        UpdateContext(
            {
                varMinutosSinLatido: If(IsBlank(varLatido), -1,
                    DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
            }
        );

    ScreenContainer2 As groupContainer.verticalAutoLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =RGBA(245, 245, 245, 1)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =16
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =16
        PaddingLeft: =16
        PaddingRight: =16
        PaddingTop: =16
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width - Self.X
        ZIndex: =1

        "'container Salud' As groupContainer.manualLayoutContainer":
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            Height: =60
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =60
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            ZIndex: =1

            htmlSalud As htmlViewer:
                Font: =App.Theme.Font
                Height: =Parent.Height - 10
                HtmlText: |-
                    ="<table width='100%' cellpadding='0' cellspacing='0'><tr>" &
                                         "<td valign='middle' width='14'><span style='display:inline-block;width:9px;height:9px;border-radius:5px;background:" &
                                         If(varMinutosSinLatido < 0, "rgb(164,38,44)", varMinutosSinLatido <= 20, "rgb(20,107,58)", varMinutosSinLatido <= 45, "rgb(154,97,0)", "rgb(164,38,44)") & "'></span></td>" &
                                         "<td valign='middle'><div style='font-size:14px;font-weight:600;color:rgb(28,21,23)'>" &
                                         If(varMinutosSinLatido < 0, "Sin latido del barrido", varMinutosSinLatido <= 20, "Ingesta operando", varMinutosSinLatido <= 45, "El barrido se atraso", "Ingesta detenida") &
                                         "</div><div style='font-size:11.5px;color:rgb(120,106,109)'>" &
                                         If(IsBlank(varLatido), "Configure CH-Flow-MailboxSweep para vigilar la ingesta",
                                            "Ultimo control hace " & varMinutosSinLatido & " min &middot; " & Coalesce(varLatido.Details, "")) &
                                         "</div></td>" &
                                         "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varEsperandoBanca > 0, "rgb(154,97,0)", "rgb(120,106,109)") & "'>" & varEsperandoBanca & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Esperando a Banca" & "</div></td>" &
                                         "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varPendientes > 0, "rgb(154,97,0)", "rgb(120,106,109)") & "'>" & varPendientes & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Sin validar" & "</div></td>" &
                                         "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varErroresSistema > 0, "rgb(110,22,34)", "rgb(120,106,109)") & "'>" & varErroresSistema & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Errores" & "</div></td>" &
                                         "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varRespuestasPendientes > 0, "rgb(154,97,0)", "rgb(120,106,109)") & "'>" & varRespuestasPendientes & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Sin responder" & "</div></td>" &
                                         "</tr></table>"
                Width: =Parent.Width - 80
                X: =16
                Y: =6
                ZIndex: =1

            btnRefrescarSalud As icon:
                Color: =RGBA(97, 97, 97, 1)
                Height: =24
                Icon: =Icon.Reload
                OnSelect: |-
                    =Refresh('CH-Tbl-SystemHeartbeat');
                    Refresh('CH-Tbl-Received Emails');
                    UpdateContext(
                        {
                            varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                            varEsperandoBanca: CountRows(
                                Filter('CH-Tbl-Received Emails',
                                    EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual')),
                            varSospechosos: CountRows(
                                Filter('CH-Tbl-Received Emails',
                                    SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso)),
                            varPendientes: CountRows(
                                Filter('CH-Tbl-Received Emails',
                                    ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                            varErroresSistema: CountRows(
                                Filter('CH-Tbl-Received Emails',
                                    EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                            varRespuestasPendientes: CountRows(
                                Filter('CH-Tbl-Received Emails',
                                    EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente And ReplyAttempts >= 3))
                        }
                    );
                    UpdateContext(
                        {
                            varMinutosSinLatido: If(IsBlank(varLatido), -1,
                                DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
                        }
                    );
                    Notify("Estado actualizado.", NotificationType.Success);
                Tooltip: ="Actualizar el estado"
                Width: =24
                X: =Parent.Width - 44
                Y: =18
                ZIndex: =9

        SearchContainer1_1 As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(245, 245, 245, 1)
            FillPortions: =0
            Height: =44
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingRight: =5
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            ZIndex: =1

            "SearchInput1_1 As 'Text input'":
                AccessibleLabel: =""
                Align: =""
                Appearance: ="FilledDarker"
                BasePaletteColor: =
                BorderColor: =RGBA(214, 221, 224, 1)
                BorderStyle: =BorderStyle.Solid
                BorderThickness: =1
                ContentLanguage: =""
                DisplayMode: =DisplayMode.Edit
                Fill: =RGBA(255, 255, 255, 1)
                FillPortions: =1
                Font: =""
                FontColor: =
                FontItalic: =false
                FontSize: =0
                FontStrikethrough: =false
                FontUnderline: =false
                FontWeight: =""
                Height: =44
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =32
                LayoutMinWidth: =320
                MaxLength: =-1
                Mode: ="SingleLine"
                OnChange: =Reset(Self)
                Placeholder: ="Buscar por asunto o remitente"
                Required: =false
                TabIndex: =0
                Tooltip: =""
                TriggerOutput: ="FocusOut"
                Type: ="Text"
                ValidationState: ="None"
                Value: =""
                Visible: =true
                Width: =320
                X: =0
                Y: =0
                ZIndex: =1

            btnVistaTodo As Button:
                Appearance: =If(varVista = "TODO", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                BasePaletteColor: =
                BorderColor: =
                DisplayMode: =DisplayMode.Edit
                FontColor: =
                Height: =32
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =110
                OnSelect: |-
                    =UpdateContext({varVista: "TODO"})
                Text: ="Todo lo accionable"
                Tooltip: ="Todo lo que necesita una decision o una revision humana. En un dia sano esta lista deberia estar vacia."
                Width: =150
                X: =0
                Y: =0
                ZIndex: =1

            btnVistaBanca As Button:
                Appearance: =If(varVista = "BANCA", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                BasePaletteColor: =
                BorderColor: =
                DisplayMode: =DisplayMode.Edit
                FontColor: =
                Height: =32
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =110
                OnSelect: |-
                    =UpdateContext({varVista: "BANCA"})
                Text: ="Esperando a Banca (" & varEsperandoBanca & ")"
                Tooltip: ="Pre-registro de un cliente real desde un correo no registrado. Hay que registrar el correo y reprocesar."
                Width: =180
                X: =0
                Y: =0
                ZIndex: =1

            btnVistaSospechoso As Button:
                Appearance: =If(varVista = "SOSPECHOSO", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                BasePaletteColor: =
                BorderColor: =
                DisplayMode: =DisplayMode.Edit
                FontColor: =
                Height: =32
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =110
                OnSelect: |-
                    =UpdateContext({varVista: "SOSPECHOSO"})
                Text: ="Sospechosos (" & varSospechosos & ")"
                Tooltip: ="Alguien uso nuestra plantilla oficial con un CIF que no existe. Revisar antes de descartar."
                Width: =150
                X: =0
                Y: =0
                ZIndex: =1

            btnVistaError As Button:
                Appearance: =If(varVista = "ERROR", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                BasePaletteColor: =
                BorderColor: =
                DisplayMode: =DisplayMode.Edit
                FontColor: =
                Height: =32
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =110
                OnSelect: |-
                    =UpdateContext({varVista: "ERROR"})
                Text: ="Errores (" & varErroresSistema & ")"
                Tooltip: ="Fallas de sistema durante la validacion."
                Width: =150
                X: =0
                Y: =0
                ZIndex: =1

            btnVistaSinResp As Button:
                Appearance: =If(varVista = "SINRESP", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                BasePaletteColor: =
                BorderColor: =
                DisplayMode: =DisplayMode.Edit
                FontColor: =
                Height: =32
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =110
                OnSelect: |-
                    =UpdateContext({varVista: "SINRESP"})
                Text: ="Sin responder (" & varRespuestasPendientes & ")"
                Tooltip: ="La respuesta quedo compuesta pero no salio."
                Width: =150
                X: =0
                Y: =0
                ZIndex: =1

        BottomContainer1 As groupContainer.horizontalAutoLayoutContainer:
            Fill: =RGBA(245, 245, 245, 1)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =100
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            ZIndex: =2

            galBandeja As gallery.galleryVertical:
                BorderColor: =App.Theme.Colors.Darker40
                DelayItemLoading: =true
                FillPortions: =3
                Items: |-
                    =Search(
                        Switch(
                            varVista,
                            "BANCA",
                            Filter('CH-Tbl-Received Emails', EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual'),
                            "SOSPECHOSO",
                            Filter('CH-Tbl-Received Emails', SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso),
                            "ERROR",
                            Filter('CH-Tbl-Received Emails', EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error),
                            "SINRESP",
                            Filter('CH-Tbl-Received Emails', EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente And ReplyAttempts >= 3),
                            Filter('CH-Tbl-Received Emails',
                                EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual'
                                || EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error
                                || ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente
                                || EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente And ReplyAttempts >= 3)
                        ),
                        SearchInput1_1.Value,
                        Subject,
                        SourceEmailAddress
                    )
                Layout: =Layout.Vertical
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =16
                LayoutMinWidth: =260
                LoadingSpinner: =LoadingSpinner.Data
                OnSelect: |
                    =UpdateContext(
                        {
                            varRunId: First(
                                Sort(
                                    Filter(
                                        'CH-Tbl-ValidationRuns',
                                        SourceRecordID = Text(ThisItem.'CH-Tbl-Received Emails')
                                    ),
                                    'Created On',
                                    SortOrder.Descending
                                )
                            ).'CH-Tbl-ValidationRuns'
                        }
                    );
                    
                    Notify( Text(ThisItem.'CH-Tbl-Received Emails'));
                TemplatePadding: =0
                TemplateSize: =84
                ZIndex: =1

                recBlandoFondo As rectangle:
                    Fill: =If(ThisItem.IsSelected,Color.White,Color.Transparent)
                    Height: =Parent.TemplateHeight
                    OnSelect: |
                        =UpdateContext(
                            {
                                varRunId: First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ValidationRuns',
                                            SourceRecordID = Text(ThisItem.'CH-Tbl-Received Emails')
                                        ),
                                        'Created On',
                                        SortOrder.Descending
                                    )
                                ).'CH-Tbl-ValidationRuns'
                            }
                        );
                    Width: =Parent.TemplateWidth
                    ZIndex: =1

                recFranja As rectangle:
                    Fill: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error || ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, RGBA(110, 22, 34, 1), RGBA(154, 97, 0, 1))
                    Height: =Parent.TemplateHeight
                    OnSelect: |
                        =UpdateContext(
                            {
                                varRunId: First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ValidationRuns',
                                            SourceRecordID = Text(ThisItem.'CH-Tbl-Received Emails')
                                        ),
                                        'Created On',
                                        SortOrder.Descending
                                    )
                                ).'CH-Tbl-ValidationRuns'
                            }
                        );
                    Width: =3
                    ZIndex: =2

                lblGalAsunto As label:
                    Color: =RGBA(28, 21, 23, 1)
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    OnSelect: |
                        =UpdateContext(
                            {
                                varRunId: First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ValidationRuns',
                                            SourceRecordID = Text(ThisItem.'CH-Tbl-Received Emails')
                                        ),
                                        'Created On',
                                        SortOrder.Descending
                                    )
                                ).'CH-Tbl-ValidationRuns'
                            }
                        );
                    PaddingLeft: =0
                    Size: =11
                    Text: =Coalesce(ThisItem.Subject, "(sin asunto)")
                    Width: =Parent.TemplateWidth - 112
                    X: =16
                    Y: =11
                    ZIndex: =3

                lblGalCuando As label:
                    Align: =Align.Right
                    Color: =RGBA(120, 106, 109, 1)
                    Height: =18
                    OnSelect: |
                        =UpdateContext(
                            {
                                varRunId: First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ValidationRuns',
                                            SourceRecordID = Text(ThisItem.'CH-Tbl-Received Emails')
                                        ),
                                        'Created On',
                                        SortOrder.Descending
                                    )
                                ).'CH-Tbl-ValidationRuns'
                            }
                        );
                    Size: =9
                    Text: |-
                        =With({h: DateDiff(ThisItem.ReceptionDateTime, Now(), TimeUnit.Hours)}, If(h < 1, "hace " & DateDiff(ThisItem.ReceptionDateTime, Now(), TimeUnit.Minutes) & " min", h < 24, "hace " & h & " h", "hace " & RoundDown(h / 24, 0) & " d"))
                    Width: =92
                    X: =Parent.TemplateWidth - 104
                    Y: =12
                    ZIndex: =4

                lblGalRemitente As label:
                    Color: =RGBA(120, 106, 109, 1)
                    Height: =18
                    OnSelect: |
                        =UpdateContext(
                            {
                                varRunId: First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ValidationRuns',
                                            SourceRecordID = Text(ThisItem.'CH-Tbl-Received Emails')
                                        ),
                                        'Created On',
                                        SortOrder.Descending
                                    )
                                ).'CH-Tbl-ValidationRuns'
                            }
                        );
                    PaddingLeft: =0
                    Size: =10
                    Text: =Coalesce(ThisItem.SourceEmailAddress, "(sin remitente)")
                    Width: =Parent.TemplateWidth - 30
                    X: =16
                    Y: =31
                    ZIndex: =5

                lblGalChip As label:
                    Align: =Align.Center
                    Color: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error || ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, RGBA(110, 22, 34, 1), RGBA(154, 97, 0, 1))
                    Fill: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error || ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, RGBA(246, 233, 235, 1), RGBA(253, 243, 227, 1))
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    OnSelect: |
                        =UpdateContext(
                            {
                                varRunId: First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-ValidationRuns',
                                            SourceRecordID = Text(ThisItem.'CH-Tbl-Received Emails')
                                        ),
                                        'Created On',
                                        SortOrder.Descending
                                    )
                                ).'CH-Tbl-ValidationRuns'
                            }
                        );
                    PaddingLeft: =8
                    PaddingRight: =8
                    Size: =8
                    Text: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error, "Fallo el sistema", ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, "Sospechoso", ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual', "Cliente sin registrar", ThisItem.EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente And ThisItem.ReplyAttempts >= 3, "Respuesta sin enviar", "Sin validar")
                    Width: =152
                    X: =16
                    Y: =54
                    ZIndex: =6

            htmlVacio As htmlViewer:
                AlignInContainer: =AlignInContainer.Stretch
                FillPortions: =8
                Font: =App.Theme.Font
                Height: =300
                HtmlText: |-
                    ="<div style='text-align:center;padding-top:90px'>" &
                     "<div style='display:inline-block;width:52px;height:52px;line-height:52px;border-radius:26px;background:rgb(232,242,236);color:rgb(20,107,58);font-size:24px;font-weight:700'>&check;</div>" &
                     "<div style='font-size:19px;font-weight:650;color:rgb(28,21,23);margin-top:14px'>Todo al dia</div>" &
                     "<div style='font-size:13.5px;color:rgb(120,106,109);margin-top:6px'>" &
                     If(varVista = "TODO",
                        "No hay nada esperando una decision. Si aparece algo, va a estar aca.",
                        "Sin casos en esta vista.") &
                     "</div></div>"
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                Visible: =galBandeja.AllItemsCount = 0
                ZIndex: =3

            "'container Detalle' As groupContainer.verticalAutoLayoutContainer":
                DropShadow: =DropShadow.Light
                Fill: =RGBA(255, 255, 255, 1)
                FillPortions: =5
                LayoutGap: =16
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =16
                LayoutMinWidth: =420
                LayoutMode: =LayoutMode.Auto
                LayoutOverflowY: =LayoutOverflow.Scroll
                LayoutWrap: =true
                PaddingBottom: =24
                PaddingLeft: =24
                PaddingRight: =24
                PaddingTop: =18
                RadiusBottomLeft: =4
                RadiusBottomRight: =4
                RadiusTopLeft: =4
                RadiusTopRight: =4
                Visible: =And(!IsBlank(galBandeja.Selected), galBandeja.AllItemsCount > 0)
                ZIndex: =3

                htmlCabecera As htmlViewer:
                    AutoHeight: =true
                    Font: =App.Theme.Font
                    Height: =58
                    HtmlText: |-
                        ="<table width='100%' cellpadding='0' cellspacing='0' style='color:rgb(28,21,23);border-bottom:1px solid rgb(230,223,224);padding-bottom:10px'><tr>" &
                           "<td width='1%' nowrap style='font-size:19px;font-weight:650;color:rgb(28,21,23)'>" & Substitute(Substitute(Coalesce(galBandeja.Selected.Name,""),"&","&amp;"),"<","&lt;") & "</td>" &
                           "<td width='1%' nowrap style='font-size:13.5px;color:rgb(70,59,62);padding-left:14px'>" & Substitute(Substitute(Coalesce(galBandeja.Selected.SourceEmailAddress,""),"&","&amp;"),"<","&lt;") & "</td>" &
                           "<td width='1%' nowrap style='padding-left:14px'><span style='font-size:11px;font-weight:650;padding:3px 9px;border-radius:11px;background:" &
                           If(galBandeja.Selected.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error,
                              "rgb(246,233,235);color:rgb(110,22,34)", "rgb(253,243,227);color:rgb(154,97,0)") & "'>" &
                           Coalesce(Text(galBandeja.Selected.SenderClassification), "Sin clasificar") & "</span></td>" &
                           "<td align='right' style='font-size:11.5px;color:rgb(120,106,109)'>Recibido " &
                           Text(galBandeja.Selected.ReceptionDateTime, "dd/mm/yyyy hh:mm") & "</td></tr></table>"
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =0
                    Width: =Parent.Width - 48
                    ZIndex: =1

                htmlQuePaso As htmlViewer:
                    AutoHeight: =true
                    Font: =App.Theme.Font
                    Height: =128
                    HtmlText: |-
                        ="<p style='font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 10px 0'>Que paso</p>" &
                         "<div style='font-size:13.5px;line-height:1.5;background:rgb(250,248,248);border:1px solid rgb(230,223,224);padding:14px 16px;color:rgb(70,59,62);margin:0;border-left:3px solid " &
