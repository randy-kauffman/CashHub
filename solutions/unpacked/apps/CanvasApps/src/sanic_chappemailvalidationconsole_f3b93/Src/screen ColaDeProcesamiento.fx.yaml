                    btnAvisarBanca As Button:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =
                        BorderColor: =
                        DisplayMode: =If(Or(!IsBlank(galBandeja.Selected.'Cliente atribuido'), galBandeja.Selected.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso), DisplayMode.Edit, DisplayMode.Disabled)
                        FontColor: =
                        Height: =36
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        OnSelect: |-
                            =With(
                                {
                                    destino: LookUp('Environment Variable Values', 'Schema Name' = "sanic_CHEVBancaMailbox", Value),
                                    urlAdmin: LookUp('Environment Variable Values', 'Schema Name' = "sanic_CHEVAppUrl_ClientAdmin", Value),
                                    cli: galBandeja.Selected.'Cliente atribuido',
                                    dir: galBandeja.Selected.SourceEmailAddress,
                                    ges: galBandeja.Selected.Name
                                },
                                If(
                                    IsBlank(destino),
                                    Notify("Falta configurar CH-EV-BancaMailbox: no se sabe a que buzon avisarle a Banca de Empresas.", NotificationType.Error),
                                    Office365Outlook.SendEmailV2(
                                        destino,
                                        If(galBandeja.Selected.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso,
                            "CashHub " & ges & ": llego un pre-registro con un CIF que no existe en CashHub",
                            "CashHub " & ges & ": hay que registrar un remitente de " & cli.Name),
                                        "<div style='font-family:Segoe UI,sans-serif;font-size:14px;color:rgb(28,21,23)'>" &
                                        If(galBandeja.Selected.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso,
                            "<p>Llego un pre-registro con la <b>plantilla oficial</b>, pero el CIF declarado <b>no existe en CashHub</b>. Lo mas probable es que sea un cliente real al que todavia le falta la carga operativa.</p>" &
                            "<p>Necesitamos que confirmen: si es cliente del banco y falta cargarlo, o si ese CIF no corresponde a nadie. En ese segundo caso lo escalamos a Seguridad, porque alguien tendria nuestra plantilla oficial.</p>",
                            "<p>Un pre-registro llego desde una direccion que no esta registrada, pero el archivo <b>es la plantilla oficial</b> y el CIF declarado corresponde a un cliente real.</p>" &
                            "<p>Mientras no se registre esa direccion, <b>al cliente no se le puede responder</b>: escribirle a un correo sin verificar confirmaria que ese CIF opera con el banco.</p>") &
                                                                                "<table cellpadding='6' cellspacing='0' style='font-size:13px;border-collapse:collapse'>" &
                                        "<tr><td style='color:rgb(120,106,109)'>Numero de gestion</td><td><b>" & ges & "</b></td></tr>" &
                                        If(galBandeja.Selected.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, "", "<tr><td style='color:rgb(120,106,109)'>Cliente</td><td><b>" & cli.Name & "</b></td></tr>") &
                                        "<tr><td style='color:rgb(120,106,109)'>Direccion a registrar</td><td><b>" & dir & "</b></td></tr>" &
                                        "<tr><td style='color:rgb(120,106,109)'>Recibido</td><td>" & Text(galBandeja.Selected.ReceptionDateTime, "dd/mm/yyyy hh:mm") & "</td></tr>" &
                                        "</table>" &
                                        If(galBandeja.Selected.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso,
                            "<p><b>Que hay que hacer:</b> verificar si ese CIF corresponde a un cliente del banco. Si falta cargarlo, cargarlo en Client Administration y avisarnos para reprocesar. Si no corresponde a nadie, decirnoslo para escalarlo.</p>",
                            "<p><b>Que hay que hacer:</b> confirmar con el cliente que esa persona esta autorizada y, si corresponde, dar de alta la direccion en Client Administration. Operaciones reprocesa el correo y el cliente recibe su respuesta.</p>") &
                                        If(IsBlank(urlAdmin), "", "<p><a href='" & urlAdmin & "'>Abrir Client Administration</a></p>") &
                                        "<p style='font-size:12px;color:rgb(120,106,109)'>Aviso enviado por " & User().FullName & " desde la consola de ingesta de correos.</p></div>",
                                        {IsHtml: true, Importance: "Normal"}
                                    );
                                    Refresh('CH-Tbl-Received Emails');
                                    Patch('CH-Tbl-Received Emails', galBandeja.Selected, {BancaNotifiedOn: Now()});
                                Refresh('CH-Tbl-Received Emails');
                                Notify("Recordatorio enviado a Banca de Empresas con el detalle del caso.", NotificationType.Success)
                                )
                            );
                        Text: |-
                            =If(IsBlank(galBandeja.Selected.BancaNotifiedOn),
