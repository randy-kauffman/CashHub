Screens:
  screen TestUDF:
    Children:
      - btnSeed:
          Control: Button@0.0.45
          Properties:
            OnSelect: |+
              =// Reset the test collection
              ClearCollect(colTests, []);

              // ---------- Helpers (inline text constants) ----------
              Set(_J_A_b_c, "[""A"",""b"",""c""]");
              Set(_J_c_B_a, "[""c"",""B"",""a""]");
              Set(_J_a_b_b, "[""a"",""b"",""b""]");
              Set(_J_b_a,   "[""b"",""a""]");
              Set(_J_empty, "[]");
              Set(_J_1_2_3, "[1,2,3]");
              Set(_J_3_2_1, "[3,2,1]");
              Set(_J_true_false_true, "[""true"",""false"",""true""]");
              Set(_J_FALSE_TRUE_TRUE, "[""false"",""true"",""TRUE""]");
              Set(_J_cafe_upper, "[""CAFÉ""]");
              Set(_J_cafe_lower, "[""café""]");
              Set(_J_cafe_no_accent, "[""cafe""]");
              Set(_J_spaces_a, "[""a "","" b"",""c""]");
              Set(_J_spaces_b, "[""a"",""b"",""c""]");

              // =====================================================
              // EQUALITY — SCALARS
              // =====================================================
              Collect(colTests, {
                  Name: "EQ_scalar_numeric_equal_num_text",
                  Operation: "equal", InputValue: "10", BaseValue: "10", Expected: true,
                  Notes: "Numeric equality compares as numbers when both numeric"
              });
              Collect(colTests, {
                  Name: "EQ_scalar_numeric_not_equal",
                  Operation: "equal", InputValue: "10", BaseValue: "11", Expected: false,
                  Notes: "Different numeric values"
              });
              Collect(colTests, {
                  Name: "EQ_scalar_text_case_sensitive_false",
                  Operation: "equal", InputValue: "abc", BaseValue: "ABC", Expected: false,
                  Notes: "Non-array string equality is case-sensitive by design"
              });
              Collect(colTests, {
                  Name: "EQ_scalar_both_blank_true",
                  Operation: "equal", InputValue: Blank(), BaseValue: Blank(), Expected: true,
                  Notes: "Both blank returns true"
              });
              Collect(colTests, {
                  Name: "EQ_scalar_one_blank_false",
                  Operation: "equal", InputValue: Blank(), BaseValue: "x", Expected: false,
                  Notes: "Only one blank"
              });
              Collect(colTests, {
                  Name: "EQ_scalar_whitespace_not_trimmed",
                  Operation: "equal", InputValue: "abc ", BaseValue: "abc", Expected: false,
                  Notes: "Whitespace differences are considered"
              });

              // =====================================================
              // EQUALITY — ARRAYS (JSON strings) — order-insensitive, case-insensitive, multiset
              // =====================================================
              Collect(colTests, {
                  Name: "EQ_array_order_insensitive_true",
                  Operation: "equal", InputValue: _J_A_b_c, BaseValue: _J_c_B_a, Expected: true,
                  Notes: "Same items, different order, case-insensitive"
              });
              Collect(colTests, {
                  Name: "EQ_array_counts_mismatch_false",
                  Operation: "equal", InputValue: _J_a_b_b, BaseValue: _J_b_a, Expected: false,
                  Notes: "Multiset counts must match"
              });
              Collect(colTests, {
                  Name: "EQ_array_numbers_true",
                  Operation: "equal", InputValue: _J_1_2_3, BaseValue: _J_3_2_1, Expected: true,
                  Notes: "Numeric items compared as text keys but equivalent"
              });
              Collect(colTests, {
                  Name: "EQ_array_booleans_true",
                  Operation: "equal", InputValue: Text(_J_true_false_true), BaseValue: Text(_J_FALSE_TRUE_TRUE), Expected: true,
                  Notes: "true/false case-insensitive equivalents"
              });
              Collect(colTests, {
                  Name: "EQ_array_diacritics_equal_true",
                  Operation: "equal", InputValue: _J_cafe_upper, BaseValue: _J_cafe_lower, Expected: true,
                  Notes: "Case-insensitive; accent preserved"
              });
              Collect(colTests, {
                  Name: "EQ_array_diacritics_not_equal_false",
                  Operation: "equal", InputValue: _J_cafe_no_accent, BaseValue: _J_cafe_lower, Expected: false,
                  Notes: "Accent sensitivity (no normalization of diacritics)"
              });
              Collect(colTests, {
                  Name: "EQ_array_empty_equal_true",
                  Operation: "equal", InputValue: _J_empty, BaseValue: _J_empty, Expected: true,
                  Notes: "Empty arrays equal"
              });
              Collect(colTests, {
                  Name: "EQ_array_whitespace_in_items_false",
                  Operation: "equal", InputValue: _J_spaces_a, BaseValue: _J_spaces_b, Expected: false,
                  Notes: "Items are not trimmed; whitespace matters"
              });
              Collect(colTests, {
                  Name: "EQ_array_mixed_number_string_numeric_equivalence_true",
                  Operation: "equal", InputValue: "[1,""2"",3]", BaseValue: "[3,2,""1""]", Expected: true,
                  Notes: "Text '2' vs number 2 normalize to same key"
              });
              Collect(colTests, {
                  Name: "EQ_array_with_nulls_mismatch_false",
                  Operation: "equal", InputValue: "[null,""a""]", BaseValue: "[""a""]", Expected: false,
                  Notes: "Counts differ; null is an element"
              });
              Collect(colTests, {
                  Name: "EQ_array_with_nulls_match_true",
                  Operation: "equal", InputValue: "[null,""a""]", BaseValue: "[""A"",null]", Expected: true,
                  Notes: "Same elements ignoring order; case-insensitive for 'a'"
              });

              // =====================================================
              // EQUALITY — FALLBACK WHEN NOT JSON ARRAY
              // =====================================================
              Collect(colTests, {
                  Name: "EQ_nonArray_invalid_json_fallback_string_compare_true",
                  Operation: "equal", InputValue: "[oops", BaseValue: "[oops", Expected: true,
                  Notes: "Invalid JSON -> falls back to scalar string equality"
              });
              Collect(colTests, {
                  Name: "EQ_nonArray_one_side_array_other_scalar_fallback_false",
                  Operation: "equal", InputValue: _J_a_b_b, BaseValue: "not an array", Expected: false,
                  Notes: "One JSON array vs scalar string; falls back to scalar compare"
              });

              // =====================================================
              // LESS THAN / LESS THAN OR EQUAL (numeric only)
              // =====================================================
              Collect(colTests, {
                  Name: "LT_numeric_true",
                  Operation: "less than", InputValue: "2", BaseValue: "10", Expected: true,
                  Notes: "Both numeric (text + number)"
              });
              Collect(colTests, {
                  Name: "LTE_equal_true",
                  Operation: "less than or equal", InputValue: "10", BaseValue: "10", Expected: true,
                  Notes: "Equality path in LTE"
              });
              Collect(colTests, {
                  Name: "LT_non_numeric_false",
                  Operation: "less than", InputValue: "abc", BaseValue: "10", Expected: false,
                  Notes: "Guarded by IsNumeric"
              });
              Collect(colTests, {
                  Name: "LT_negative_numbers_true",
                  Operation: "less than", InputValue: "-5", BaseValue: "-1", Expected: true,
                  Notes: "Negative numbers"
              });
              Collect(colTests, {
                  Name: "LT_decimals_true",
                  Operation: "less than", InputValue: "1.5", BaseValue: "2.0", Expected: true,
                  Notes: "Decimals; dot separator required"
              });

              // =====================================================
              // GREATER THAN / GREATER THAN OR EQUAL (numeric only + typo support)
              // =====================================================
              Collect(colTests, {
                  Name: "GT_numeric_true",
                  Operation: "greater than", InputValue: "11", BaseValue: "10", Expected: true,
                  Notes: "Basic GT"
              });
              Collect(colTests, {
                  Name: "GTE_equal_true",
                  Operation: "greater than or equal", InputValue: "10", BaseValue: "10", Expected: true,
                  Notes: "Equality path in GTE"
              });
              Collect(colTests, {
                  Name: "GT_non_numeric_false",
                  Operation: "greater than", InputValue: "abc", BaseValue: "5", Expected: false,
                  Notes: "Non-numeric guarded as false"
              });
              Collect(colTests, {
                  Name: "GT_typo_greather_true",
                  Operation: "greather than", InputValue: "5", BaseValue: "2", Expected: true,
                  Notes: "Common misspelling supported"
              });
              Collect(colTests, {
                  Name: "GTE_typo_greather_equal_true",
                  Operation: "greather than or equal", InputValue: "2", BaseValue: "2", Expected: true,
                  Notes: "Common misspelling supported"
              });

              // =====================================================
              // CONTAINS (string) — uses Find -> case-sensitive by default
              // =====================================================
              Collect(colTests, {
                  Name: "CONTAINS_basic_true",
                  Operation: "contains", InputValue: "The quick brown fox", BaseValue: "brown", Expected: true,
                  Notes: "Substring present"
              });
              Collect(colTests, {
                  Name: "CONTAINS_case_sensitive_false",
                  Operation: "contains", InputValue: "ABC", BaseValue: "bc", Expected: false,
                  Notes: "Case-sensitive by design; optional variant exists if needed"
              });
              Collect(colTests, {
                  Name: "CONTAINS_numbers_true",
                  Operation: "contains", InputValue: "12345", BaseValue: "234", Expected: true,
                  Notes: "Numbers converted to text"
              });
              Collect(colTests, {
                  Name: "CONTAINS_empty_base_true",
                  Operation: "contains", InputValue: "abc", BaseValue: "", Expected: true,
                  Notes: "Find of empty string returns index (not blank) -> true"
              });

              // =====================================================
              // BEGINS WITH (string) — case-sensitive
              // =====================================================
              Collect(colTests, {
                  Name: "BEGINS_basic_true",
                  Operation: "begins with", InputValue: "PowerFx", BaseValue: "Power", Expected: true,
                  Notes: "Prefix match"
              });
              Collect(colTests, {
                  Name: "BEGINS_alias_starts_with_true",
                  Operation: "startswith", InputValue: "PowerFx", BaseValue: "Pow", Expected: true,
                  Notes: "Alias supported"
              });
              Collect(colTests, {
                  Name: "BEGINS_case_insensitive_true",
                  Operation: "begins with", InputValue: "PowerFx", BaseValue: "power", Expected: true,
                  Notes: "Case-sensitive by design"
              });

              // =====================================================
              // ENDS WITH (string) — case-sensitive
              // =====================================================
              Collect(colTests, {
                  Name: "ENDS_basic_true",
                  Operation: "ends with", InputValue: "PowerFx", BaseValue: "Fx", Expected: true,
                  Notes: "Suffix match"
              });
              Collect(colTests, {
                  Name: "ENDS_alias_true",
                  Operation: "endswith", InputValue: "PowerFx", BaseValue: "x", Expected: true,
                  Notes: "Alias supported"
              });
              Collect(colTests, {
                  Name: "ENDS_case_insensitive_false",
                  Operation: "ends with", InputValue: "PowerFx", BaseValue: "fx", Expected: true,
                  Notes: "Case-sensitive"
              });

              // =====================================================
              // EMPTY — JSON arrays, tables, and scalars
              // =====================================================
              Collect(colTests, {
                  Name: "EMPTY_json_array_true",
                  Operation: "empty", InputValue: _J_empty, BaseValue: Blank(), Expected: true,
                  Notes: "JSON array [] is empty"
              });
              Collect(colTests, {
                  Name: "EMPTY_json_array_false",
                  Operation: "empty", InputValue: _J_1_2_3, BaseValue: Blank(), Expected: false,
                  Notes: "Non-empty JSON array"
              });
              Collect(colTests, {
                  Name: "EMPTY_scalar_blank_false",
                  Operation: "empty", InputValue: "", BaseValue: Blank(), Expected: false,
                  Notes: "Fallback to IsBlank for non-array"
              });
              Collect(colTests, {
                  Name: "EMPTY_scalar_zero_false",
                  Operation: "empty", InputValue: "0", BaseValue: Blank(), Expected: false,
                  Notes: "Zero is not blank"
              });
              Collect(colTests, {
                  Name: "EMPTY_typo_empoty_true",
                  Operation: "empoty", InputValue: "", BaseValue: Blank(), Expected: false,
                  Notes: "Supports typo alias"
              });

              // =====================================================
              // DEFAULT / UNSUPPORTED OPERATION
              // =====================================================
              Collect(colTests, {
                  Name: "UNSUPPORTED_op_returns_false",
                  Operation: "not-an-op", InputValue: "x", BaseValue: "x", Expected: false,
                  Notes: "Switch default returns false"
              });

              // =====================================================
              // STRESS / SCALE — larger arrays (order-insensitive equality)
              // (Optional) Generate arrays of 1..N and N..1 as JSON
              // =====================================================
              Set(_N, 50);
              Set(_J_seq, "[" & Concat(Sequence(_N), Text(Value), ",") & "]");
              Set(_J_seq_rev, "[" & Concat(Sequence(_N, _N, -1), Text(Value), ",") & "]");
              Collect(colTests, {
                  Name: "EQ_array_stress_50_numbers_true",
                  Operation: "equal", InputValue: _J_seq, BaseValue: _J_seq_rev, Expected: true,
                  Notes: "Order-insensitive equality at moderate scale"
              });
            Text: ="Test case"
      - galTest:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =728
            Items: =Filter(colTests, IsBlank(DropdownCanvas2.Selected) || (DropdownCanvas2.Selected.Value = "Match" && Expected = EvaluateEV(Operation,InputValue,BaseValue)) || (DropdownCanvas2.Selected.Value = "Unmatch" && Expected <> EvaluateEV(Operation,InputValue,BaseValue)))
            TemplateSize: =80
            X: =40
            Y: =40
          Children:
            - Actual:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =EvaluateEV(ThisItem.Operation,ThisItem.InputValue,ThisItem.BaseValue)
                  X: =150
                  Y: =40
            - Expected:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Expected
                  Y: =40
            - Name:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =
                  Text: =ThisItem.Name
                  Width: =640
      - Label2:
          Control: Label@2.5.1
          Properties:
            Text: |+
              =
              With(
                  {
                      _total: CountRows( galTest.AllItems),
                      _passed: Sum( galTest.AllItems, If( Actual.Text = Expected.Text, 1, 0 ) )
                  },
                  "Passed: " & _passed & " / " & _total & "  (" & Text( _passed / Max(1, _total) * 100, "0%") & ")"
              )
            Width: =440
            X: =112
      - DropdownCanvas2:
          Control: DropDown@0.0.45
          Properties:
            Items: =["Match", "Unmatch"]
            X: =302
