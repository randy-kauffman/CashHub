                        PaddingRight: =10
                        PaddingTop: =10
                        Visible: =If(And('screen CorreosElectronicos'.Size = ScreenSize.Small, Or(newMode, isItemSelected)), false, true)
                      Children:
                        - SearchContainer1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(245, 245, 245, 1)
                              FillPortions: =0
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingRight: =5
                            Children:
                              - SearchInput1:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    FillPortions: =1
                                    Height: =44
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnChange: |-
                                      =UpdateContext(
                                          {
                                              varFiltrosQueryCorreo: Concatenate(
                                                  "$filter=",
                                                  If(
                                                      !IsBlank('dp FechaDesde'.SelectedDate),
                                                      "receivedDateTime ge " & Text(
                                                          'dp FechaDesde'.SelectedDate,
                                                          "yyyy-mm-dd"
                                                      ) & "T00:00:00Z"
                                                      //,"receivedDateTime ge 2000-01-01T00:00:00Z"
                                                  ),
                                                   If(Or(
                                                          And(
                                                              !IsBlank(Trim(SearchInput1.Value)),
                                                              !IsBlank('dp FechaDesde'.SelectedDate)
                                                          ),And(
                                                              !IsBlank('dp FechaHasta'.SelectedDate),
                                                              !IsBlank('dp FechaDesde'.SelectedDate)
                                                          )
                                                      )," AND "),
                                                  If(
                                                      !IsBlank('dp FechaHasta'.SelectedDate),
                                                      "receivedDateTime le " & Text(
                                                          'dp FechaHasta'.SelectedDate,
                                                          "yyyy-mm-dd"
                                                      ) & "T00:00:00Z"
                                                  ),
                                                  If(
                                                      Or(
                                                          And(
                                                              !IsBlank(Trim(SearchInput1.Value)),
                                                              !IsBlank('dp FechaHasta'.SelectedDate)
                                                          )
                                                      ),
                                                      " AND "
                                                  ), 
                                                  If(
                                                      !IsBlank(Trim(SearchInput1.Value)),
                                                      //"from/emailAddress/address eq '" & Trim(TextInputCanvas1.Value)&"'"
                                                      "contains(from/emailAddress/address,'" & Trim(SearchInput1.Value)&"')"
                                                  )
                                              )
                                          }
                                      );

                                      Select(btn_ConstruirURI);
                                    Placeholder: ="Remitente"
                        - AddNewContainer1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =If('screen CorreosElectronicos'.Size = ScreenSize.Small,true,false)
                            Children:
                              - AddNewButton1:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    FillPortions: =1
                                    FontSize: =14
                                    Height: =44
                                    Icon: ="Add"
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinWidth: =60
                                    OnSelect: |-
                                      =UpdateContext({ newMode: true })
                                    Text: ="New"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =80
                        - Table1:
                            Control: Table@1.0.278
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              EnableRangeSelection: ='PowerAppsOneGrid.EnableRangeSelection'.Disable
                              EnableSorting: ='PowerAppsOneGrid.EnableSorting'.Enable
                              FillPortions: =1
                              Items: =SortByColumns(colParsedEmails,"FechaRecibido",SortOrder.Descending)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =UpdateContext({ isItemSelected: true, newMode: false, CurrentItem:Table1.Selected });
                                NewForm(Form1);
                                UpdateContext(
                                    {
                                        varEmailAttachments: Filter(
                                            ForAll(
                                                Table(
                                                    Office365Outlook.HttpRequest(
                                                        "https://graph.microsoft.com/v1.0/users/" & varBuzonCorreo & "/messages/" & Table1.Selected.MessageID & "/attachments",
                                                        "GET",
                                                        ""
                                                    ).value
                                                ) As attachments,
                                                {
                                                    IDAdjunto: Text(attachments.Value.id),
                                                    odataType:   Text(attachments.Value.'@odata.type'),
                                                    ContentType: Text(attachments.Value.contentType),
                                                    Nombre: Text(attachments.Value.name),
                                                    EnCuerpo: Boolean(attachments.Value.isInline),
                                                    contentBytes: attachments.Value.contentBytes,
                                                    Size: Text(
                                                        Int(attachments.Value.size) / 1024,
                                                        "#,###.00"
                                                    ) & " KB",
                                                    Extension: Lower(
                                                        Last(
                                                            Split(
                                                                Text(attachments.Value.name),
                                                                "."
                                                            )
                                                        ).Value
                                                    ),
                                                    ColorTag: If(
                                                        Lower(
                                                            Last(
                                                                Split(
                                                                    Text(attachments.Value.name),
                                                                    "."
                                                                )
                                                            ).Value
                                                        ) = "xlsx",
                                                        "rgb(33,115,70)",
                                                        "rgb(255,0,0)"
                                                    ),
                                                    Icon: If(
                                                        Lower(
                                                            Last(
                                                                Split(
                                                                    Text(attachments.Value.name),
                                                                    "."
                                                                )
                                                            ).Value
                                                        ) = "xlsx",
                                                        "icon:ExcelLogo",
                                                        "icon:StatusCircleQuestionMark"
                                                    )
                                                }
                                            ),
                                            EnCuerpo = false
                                        )
                                    }
                                );
                              ReflowBehavior: ='PowerAppsOneGrid.ReflowBehavior'.ListOnly
