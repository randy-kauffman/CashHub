                  - SidebarContainer1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(And('screen CorreosElectronicos'.Size = ScreenSize.Small, Or(newMode, isItemSelected)), 0, 3)
                        LayoutDirection: =LayoutDirection.Vertical
