      - container BotonesDeFunciones:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =false
            X: =632
            Y: =12
          Children:
            - btn_ConstruirURI:
                Control: Button@0.0.45
                Properties:
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: |
                    =Set(
                        varGraphAPIURI,
                        "https://graph.microsoft.com/v1.0/users/" & varBuzonCorreo & "/" & varFolderLectura & "/messages?" & varFiltrosQueryCorreo & If(
                            !IsBlank(varFiltrosQueryCorreo),
                            "&"
                        ) & "%24top=500&$select=subject,id,body,internetMessageId,receivedDateTime,isRead,from,hasAttachments"
                    );
                    //Version antigua, se cambia a version sin top ni skip
                    //Set(varGraphAPIURI, "https://graph.microsoft.com/v1.0/users/"&varBuzonCorreo&"/"&varFolderLectura&"/messages?"&varFiltrosQueryCorreo&If(!IsBlank(varFiltrosQueryCorreo),"&")&"%24orderby=receivedDateTime+desc&%24top=9&%24skip="&varNumeroPagina*9&"&$select=subject,id,internetMessageId,receivedDateTime,isRead,from,hasAttachments");
                  Text: ="Construir URI"
                  Width: =120
            - btn_CargarEmail:
                Control: Button@0.0.45
                Properties:
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: |
                    =UpdateContext(
                        {
                            varEmails: Office365Outlook.HttpRequest(
                                varGraphAPIURI & "&$count=true",
                                "GET",
                                "",
                                {CustomHeader1: "Prefer: IdType=" & Char(34) & "ImmutableId" & Char(34)}
                            )
                        }
                    );
                    Set(
                        varNextODataLink,
                        Text(varEmails.'@odata.nextLink')
                    );
                    UpdateContext({varEmailCount: Text(varEmails.'@odata.count')});
                    ClearCollect(
                        colParsedEmails,
                        ForAll(
                            Table(varEmails.value) As email,
                            {
                                Asunto: Text(email.Value.subject),
                                FechaRecibido: DateTimeValue(email.Value.receivedDateTime),
                                Leido: Boolean(email.Value.isRead),
                                Remitente: Text(email.Value.from.emailAddress.address),
                                MessageID: Text(email.Value.id),
                                TieneAdjuntos: Boolean(email.Value.hasAttachments),
                                InternetMessageID: Text(email.Value.internetMessageId),
                                Cuerpo: Text(email.Value.body.content)
                            }
                        )
                    );
                    UpdateContext({varSpinnerCompletoVisible: false});
                  Text: ="Cargar  emails"
                  Width: =120
