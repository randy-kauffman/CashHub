Screens:
  screen CorreosElectronicos:
    Properties:
      OnVisible: |-
        =Set(varBuzonCorreo, Coalesce(LookUp('Environment Variable Values', 'Schema Name' = "sanic_CHEVSharedMailboxAddress", Value), LookUp('Environment Variable Definitions', 'Schema Name' = "sanic_CHEVSharedMailboxAddress", 'Default Value')));

        Set(varIDFolderArchivado, Coalesce(LookUp('Environment Variable Values', 'Schema Name' = "sanic_CHEVSharedMailboxArchiveFolderID", Value),LookUp('Environment Variable Definitions', 'Schema Name'= "sanic_CHEVSharedMailboxArchiveFolderID", 'Default Value')));

        Set(UsuarioOffice, Office365Users.MyProfileV2());
        Set(varHoy, Today());
        ClearCollect(colExpandMenu,
        Table(
        {Icon: "OutlookLogo", Label: "Emails", Screen:'screen CorreosElectronicos', Tooltip:"Mailbox emails"}, 
        {Icon: "BulletedList", Label: "Cola de procesamiento", Screen:'screen ColaDeProcesamiento', Tooltip:"Cola de procesamiento"}
        ));
        ClearCollect(colValidationRules, Filter('CH-Tbl-ValidationRules',IsActive=true));

        UpdateContext({varNumeroPagina:0, varSpinnerCompletoVisible:false});
        UpdateContext({emailpopup: false});
        UpdateContext({varFolderLectura: "mailFolders('Inbox')", varLeerInbox: true});
        UpdateContext({varFiltrosQueryCorreo: ""})
    Children:
      - Form1:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            DataSource: ='CH-Tbl-Received Emails'
            OnFailure: |
              =UpdateContext(
                  {
                      varSpinnerDetalleCorreoLabel: "Archivando correo...",
                      varSpinnerDetalleCorreoVisible: false
                  }
              );


              UpdateContext({varColDetallesAcreditaciones: []});
              //UpdateContext({varEmailAttachments: Blank()});
              //UpdateContext({varRegistroEnDataverse: Blank()});
              //Select(Icon3);
            OnReset: |
              =/**/
            OnSuccess: |
              =ForAll(
                  Filter(
                      varEmailAttachments,
                      odataType = "#microsoft.graph.fileAttachment" && !IsBlank(contentBytes)
                  ) As F,
                  With(
                      {_dataUri: "data:" & F.ContentType & ";base64," & F.contentBytes},
                      With(
                          {_blob: Download(_dataUri)},
                          Patch(
                              'CH-Tbl-EmailsAttachments',
                              Defaults('CH-Tbl-EmailsAttachments'),
                              {
                                  Email: Form1.LastSubmit,
                                  EmailAttachmentID: F.IDAdjunto,
                                  TamanoEnbytes: Int(
                                      Trim(
                                          Substitute(
                                              F.Size,
                                              "KB",
                                              ""
                                          )
                                      ) * 1024
                                  ),
                                  FileExtention: F.Extension,
                                  FileContent: {
                                      FileName: F.Nombre,
                                      Value: _dataUri
                                  },
                                  Filename: F.Nombre
                              }
                          )
                      )
                  )
              );
              Office365Outlook.MoveV2(
                  Table1.Selected.MessageID,
                  "Id::" & varIDFolderArchivado,
                  {mailboxAddress: varBuzonCorreo}
              );
              UpdateContext(
                  {
                      varLabelSpinnerCompleto: "Archivando correo...",
                      varSpinnerCompletoVisible: false
                  }
              );
              Refresh('CH-Tbl-Received Emails');
              Refresh('CH-Tbl-EmailsAttachments');
              Select(Icon3);
              UpdateContext(
                  {
                      varLabelSpinnerCompleto: "Archivando correo...",
                      varSpinnerCompletoVisible: false
                  }
              );
            Visible: =false
            X: =40
            Y: =40
