            Y: =(Parent.Height - 330) / 2
          Children:
            - lblOverrideTitulo:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(32, 31, 30, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =15
                  Text: =If(varOverrideAcepta, "Aceptar manualmente", "Denegar manualmente")
                  Width: =520
                  X: =20
                  Y: =16
            - lblOverrideAviso:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(97, 97, 97, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =76
                  Size: =11
                  Text: |-
                    ="Esta decision reemplaza el resultado del motor para " & galBandeja.Selected.Name &
                     ". Queda registrada con su usuario, la fecha y el motivo, y el correo pasa a metodo Manual."
                  Width: =520
                  X: =20
                  Y: =48
            - txtOverrideMotivo:
                Control: TextInput@0.0.54
                Properties:
                  Height: =104
                  Mode: ="MultiLine"
                  OnChange: |-
                    =UpdateContext({varOverrideMotivo: Self.Value})
                  Placeholder: ="Por que toma esta decision? Minimo 10 caracteres."
                  Width: =520
                  X: =20
                  Y: =128
            - lblOverrideValidacion:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(168, 0, 0, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =20
                  Size: =10
                  Text: =If(Len(Trim(Coalesce(varOverrideMotivo, ""))) < 10, "Escriba al menos 10 caracteres explicando la decision.", "")
                  Width: =520
                  X: =20
                  Y: =236
            - btnOverrideCancelar:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Secondary
                  Height: =36
                  OnSelect: |-
                    =UpdateContext({varOverrideAbierto: false})
                  Text: ="Cancelar"
                  Width: =140
                  X: =240
                  Y: =266
            - btnOverrideConfirmar:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  DisplayMode: =If(Len(Trim(Coalesce(varOverrideMotivo, ""))) < 10, DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =36
                  OnSelect: |-
                    =Patch(
                        'CH-Tbl-Received Emails',
                        galBandeja.Selected,
                        {
                            EmailReviewStatus: If(varOverrideAcepta,
                                'EmailReviewStatus (CH-Tbl-Received Emails)'.Aceptado,
                                'EmailReviewStatus (CH-Tbl-Received Emails)'.Denegado),
                            ValidationStatus: If(varOverrideAcepta,
                                'ValidationStatus (CH-Tbl-Received Emails)'.Valido,
                                'ValidationStatus (CH-Tbl-Received Emails)'.Invalido),
                            EmailReviewMethod: 'EmailReviewMethod (CH-Tbl-Received Emails)'.Manual,
                            OverrideBy: User().Email,
                            OverrideOn: Now(),
                            OverrideReason: Trim(varOverrideMotivo)
                        }
                    );
                    Refresh('CH-Tbl-Received Emails');
                    UpdateContext({varOverrideAbierto: false});
                    Notify("Decision registrada a nombre de " & User().Email & ".", NotificationType.Success);
                  Text: ="Confirmar"
                  Width: =160
                  X: =390
                  Y: =266
