                                                    "<p class='t' style='margin-top:16px'>No se intentaron porque su dependencia no paso</p><div class='om'>" &
                                                    Concat(Sort(om, ValidationOrder),
                                                           "<span>" & 'Validation Name' & " &nbsp; " &
                                                           Substitute(Coalesce(Name, ""), "<", "&lt;") & "</span>") & "</div>"
                                                )
                                            )
                                        )
                                    )
                                )
