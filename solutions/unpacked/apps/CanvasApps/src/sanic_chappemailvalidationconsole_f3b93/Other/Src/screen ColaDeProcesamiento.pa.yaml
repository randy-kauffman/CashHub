Screens:
  screen ColaDeProcesamiento:
    Properties:
      OnVisible: |-
        =UpdateContext({varSpinnerCompletoVisible: false});
        // Salud del pipeline: latido del barrido + cola real
        UpdateContext(
            {
                varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                varPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                varErroresSistema: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                varRespuestasPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente))
            }
        );
        UpdateContext(
            {
                varMinutosSinLatido: If(IsBlank(varLatido), -1,
                    DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
            }
        );
    Children:
      - ScreenContainer2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width - Self.X
            X: =46
          Children:
            - container Salud:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutMinHeight: =60
                  LayoutMinWidth: =32
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                Children:
                  - icoSemaforo:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varMinutosSinLatido < 0, RGBA(168, 0, 0, 1), varMinutosSinLatido <= 20, RGBA(16, 124, 16, 1), varMinutosSinLatido <= 45, RGBA(196, 137, 0, 1), RGBA(168, 0, 0, 1))
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisabledColor: =RGBA(119, 119, 119, 1)
                        Height: =20
                        Icon: ="Circle"
                        Tooltip: ="Estado del barrido de ingesta"
                        Width: =20
                        X: =16
                        Y: =20
                  - lblSemaforo:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varMinutosSinLatido < 0, RGBA(168, 0, 0, 1), varMinutosSinLatido <= 20, RGBA(16, 124, 16, 1), varMinutosSinLatido <= 45, RGBA(196, 137, 0, 1), RGBA(168, 0, 0, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Text: |-
                          =If(varMinutosSinLatido < 0, "SIN SEÑAL — el barrido nunca corrió", varMinutosSinLatido <= 20, "Ingesta operando — último control hace " & varMinutosSinLatido & " min", varMinutosSinLatido <= 45, "Atención: sin control hace " & varMinutosSinLatido & " min", "ALERTA: sin control hace " & varMinutosSinLatido & " min — revisar los flujos")
                        Width: =480
                        X: =44
                        Y: =8
                  - lblContPendientes:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varPendientes > 0, RGBA(196, 137, 0, 1), RGBA(97, 97, 97, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Text: |-
                          ="Pendientes: " & varPendientes
                        Tooltip: ="Correos esperando validación"
                        Width: =190
                        X: =Parent.Width - 600
                        Y: =8
                  - lblContErrores:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varErroresSistema > 0, RGBA(168, 0, 0, 1), RGBA(97, 97, 97, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Text: |-
                          ="Errores: " & varErroresSistema
                        Tooltip: ="Correos con error de sistema"
                        Width: =190
                        X: =Parent.Width - 410
                        Y: =8
                  - lblContRespuestas:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varRespuestasPendientes > 0, RGBA(196, 137, 0, 1), RGBA(97, 97, 97, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Text: |-
                          ="Sin responder: " & varRespuestasPendientes
                        Tooltip: ="Respuestas al cliente sin enviar"
                        Width: =190
                        X: =Parent.Width - 220
                        Y: =8
                  - lblSemaforoDetalle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(97, 97, 97, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        Height: =20
                        Size: =10
                        Text: =If(IsBlank(varLatido), "Configure el flujo CH-Flow-MailboxSweep para vigilar la ingesta", Coalesce(varLatido.Details, ""))
                        Width: =480
                        X: =44
                        Y: =32
                  - btnRefrescarSalud:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(97, 97, 97, 1)
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisabledColor: =RGBA(119, 119, 119, 1)
                        Height: =24
                        Icon: =Icon.Reload
                        OnSelect: |-
                          =Refresh('CH-Tbl-SystemHeartbeat');
                          Refresh('CH-Tbl-Received Emails');
                          UpdateContext(
                              {
                                  varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                                  varPendientes: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                                  varErroresSistema: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                                  varRespuestasPendientes: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente))
                              }
                          );
                          UpdateContext(
                              {
                                  varMinutosSinLatido: If(IsBlank(varLatido), -1,
                                      DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
                              }
                          );
                          Notify("Estado actualizado.", NotificationType.Success);
                        Tooltip: ="Actualizar el estado"
                        Width: =24
                        X: =Parent.Width - 44
                        Y: =18
            - BottomContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutWrap: =true
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                Children:
                  - SidebarContainer2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =3
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - SearchContainer1_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(245, 245, 245, 1)
                              FillPortions: =0
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingRight: =5
                            Children:
                              - SearchInput1_1:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    FillPortions: =1
                                    Height: =44
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnChange: |
                                      =UpdateContext(
                                          {
                                              varFiltrosQueryCorreo: Concatenate(
                                                  "$filter=",
                                                  If(
                                                      !IsBlank('dp FechaDesde'.SelectedDate),
                                                      "receivedDateTime ge " & Text(
                                                          'dp FechaDesde'.SelectedDate,
                                                          "yyyy-mm-dd"
                                                      ) & "T00:00:00Z"
                                                      //,"receivedDateTime ge 2000-01-01T00:00:00Z"
                                                  ),
                                                   If(Or(
                                                          And(
                                                              !IsBlank(Trim(SearchInput1_1.Value)),
                                                              !IsBlank('dp FechaDesde'.SelectedDate)
                                                          ),And(
                                                              !IsBlank('dp FechaHasta'.SelectedDate),
                                                              !IsBlank('dp FechaDesde'.SelectedDate)
                                                          )
                                                      )," AND "),
                                                  If(
                                                      !IsBlank('dp FechaHasta'.SelectedDate),
                                                      "receivedDateTime le " & Text(
                                                          'dp FechaHasta'.SelectedDate,
                                                          "yyyy-mm-dd"
                                                      ) & "T00:00:00Z"
                                                  ),
                                                  If(
                                                      Or(
                                                          And(
                                                              !IsBlank(Trim(SearchInput1_1.Value)),
                                                              !IsBlank('dp FechaHasta'.SelectedDate)
                                                          )
                                                      ),
                                                      " AND "
                                                  ), 
                                                  If(
                                                      !IsBlank(Trim(SearchInput1_1.Value)),
                                                      //"from/emailAddress/address eq '" & Trim(TextInputCanvas1.Value)&"'"
                                                      "contains(from/emailAddress/address,'" & Trim(SearchInput1_1.Value)&"')"
                                                  )
                                              )
                                          }
                                      );
                                    Placeholder: ="Remitente"
                        - Table1_1:
                            Control: Table@1.0.278
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              EnableRangeSelection: ='PowerAppsOneGrid.EnableRangeSelection'.Disable
                              EnableSorting: ='PowerAppsOneGrid.EnableSorting'.Enable
                              FillPortions: =1
                              Items: |-
                                =Search(
                                    Filter(
                                        'CH-Tbl-Received Emails',
                                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Pendiente || EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente
                                    ),
                                    SearchInput1_1.Value,
                                    Subject,
                                    SourceEmailAddress
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinWidth: =1
                              OnSelect: =
                              ReflowBehavior: ='PowerAppsOneGrid.ReflowBehavior'.ListOnly
                            Children:
                              - Subject1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Subject"
                                    FieldName: ="sanic_subject"
                                    FieldType: ="s"
                                    Order: =1
                              - Email Address1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Email Address"
                                    FieldName: ="emailaddress"
                                    FieldType: ="s"
                                    Order: =2
                              - ReceptionDateTime1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="ReceptionDateTime"
                                    FieldName: ="sanic_receptiondatetime"
                                    FieldType: ="d"
                                    Order: =3
                              - Attachment1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Attachment"
                                    FieldName: ="sanic_attachment"
                                    FieldType: ="F"
                                    Order: =4
                              - Status1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Status"
                                    FieldName: ="statecode"
                                    FieldType: ="l"
                                    Order: =5
                              - ErrorCode1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="ErrorCode"
                                    FieldName: ="sanic_errorcode"
                                    FieldType: ="s"
                                    Order: =6
                              - ErrorText1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="ErrorText"
                                    FieldName: ="sanic_errortext"
                                    FieldType: ="s"
                                    Order: =7
                              - ReplyDateTime1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="ReplyDateTime"
                                    FieldName: ="sanic_replydatetime"
                                    FieldType: ="d"
                                    Order: =8
                              - RepliedBy1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="RepliedBy"
                                    FieldName: ="sanic_repliedby"
                                    FieldType: ="s"
                                    Order: =9
                              - SourceEmailAddress1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="SourceEmailAddress"
                                    FieldName: ="sanic_sourceemailaddress"
                                    FieldType: ="s"
                                    Order: =10
      - ExpandMenu_2:
          Control: CanvasComponent
          ComponentName: ExpandMenu
          ComponentLibraryUniqueName: cat_powercatcomponentlibrary_0be3a
          Properties:
            DefaultExpandValue: =false
            Fill: =ColorValue(ExpandMenu_2.Theme.palette.white)
            Height: =Parent.Height
            IsNavigationEnabled: =true
            Items: =colExpandMenu
            OnButtonSelect: =
            OnExpandSelect: =
            Theme: |-
              ={
              	palette: {
              		themePrimary: "#0078d4",
              		themeLighterAlt: "#eff6fc",
              		themeLighter: "#deecf9",
              		themeLight: "#c7e0f4",
              		themeTertiary: "#71afe5",
              		themeSecondary: "#2b88d8",
              		themeDarkAlt: "#106ebe",
              		themeDark: "#005a9e",
              		themeDarker: "#004578",
              		neutralLighterAlt: "#faf9f8",
              		neutralLighter: "#f3f2f1",
              		neutralLight: "#edebe9",
              		neutralQuaternaryAlt: "#e1dfdd",
              		neutralQuaternary: "#d0d0d0",
              		neutralTertiaryAlt: "#c8c6c4",
              		neutralTertiary: "#a19f9d",
              		neutralSecondary: "#605e5c",
              		neutralPrimaryAlt: "#3b3a39",
              		neutralPrimary: "#323130",
              		neutralDark: "#201f1e",
              		black: "#000000",
              		white: "#ffffff"
              	}
              }
            Width: =If(!Self.IsExpanded, 46, 221)
