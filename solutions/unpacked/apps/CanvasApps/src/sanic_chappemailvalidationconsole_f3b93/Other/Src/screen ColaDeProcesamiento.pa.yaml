      - container Forms:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =278
            Visible: =false
            Width: =601
            X: =580
            Y: =224
          Children:
            - form Declaration:
                Control: Form@2.4.4
                Layout: Vertical
                Properties:
                  DataSource: ='CH-Tbl-Declarations'
                  Height: =200
                  OnFailure: |-
                    =ForAll(colSubmitedCheck As Check, Remove('CH-Tbl-DeclaredChecks', Check));
                    ForAll(colSubmitedDeposits As Deposit, Remove('CH-Tbl-DeclaredDeposits', Deposit));
                    ForAll(colSubmitedBags As Bag, Remove('CH-Tbl-DeclaredBags', Bag));
                    Remove('CH-Tbl-Declarations', varNewDeclaration);
                    UpdateContext({varSpinnerCompletoVisible: false, varLabelSpinnerCompleto: "Guardando..."});
                  OnSuccess: |+
                    =//Create collections
                    UpdateContext({varSpinnerCompletoVisible: true, varLabelSpinnerCompleto: "Guardando..."});

                    Clear(colDeclaredCheckToDeposits);
                    ForAll(
                        LookUp(
                            colTablasEnArchivo,
                            Nombre = "Depositos"
                        ).Datos As Deposit,
                        Collect(
                            colDeclaredCheckToDeposits,
                            AddColumns(
                                Deposit,
                                Cheques,
                                Filter(
                                    LookUp(
                                        colTablasEnArchivo,
                                        Nombre = "Cheques"
                                    ).Datos,
                                    NoDeposito = Deposit.NoDeposito
                                )
                            )
                        )
                    );
                    ClearCollect(
                        colEmailDeclaredBags,
                        RenameColumns(
                            Distinct(
                                LookUp(
                                    colTablasEnArchivo,
                                    Nombre = "Depositos"
                                ).Datos,
                                NoBolsa
                            ),
                            Value,
                            Bolsa
                        )
                    );
                    Clear(colEmailDeclaration);
                    ForAll(
                        colEmailDeclaredBags As Bags,
                        Collect(
                            colEmailDeclaration,
                            {
                                Bag: Bags.Bolsa,
                                Deposits: Filter(
                                    colDeclaredCheckToDeposits,
                                    NoBolsa = Bags.Bolsa
                                )
                            }
                        )
                    );
                    UpdateContext({varProgressBarMax: CountRows(colEmailDeclaration) + CountRows(colDeclaredCheckToDeposits) + CountRows(LookUp(
                                        colTablasEnArchivo,
                                        Nombre = "Cheques"
                                    ).Datos)});
                    UpdateContext({varProgressBarActual: 0});
                    Set(
                        varNewDeclaration,
                        'form Declaration'.LastSubmit
                    );

                    Clear(colSubmitedBags);
                    Clear(colSubmitedCheck);
                    Clear(colSubmitedDeposits);


                    //Submit the first baf
                    UpdateContext({varBag: First(colEmailDeclaration)});
                    NewForm('form DeclaredBags');
                    SubmitForm('form DeclaredBags');

                  Width: =500
