                  Y: =48
            - txtCierreMotivo:
                Control: TextInput@0.0.54
                Properties:
                  Height: =100
                  Mode: ="MultiLine"
                  OnChange: |-
                    =UpdateContext({varCierreMotivo: Self.Value})
                  Placeholder: ="A quien se le escribio, por que medio y que se le dijo. Minimo 10 caracteres."
                  Width: =520
                  X: =20
                  Y: =126
            - lblCierreValidacion:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(110, 22, 34, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =20
                  Size: =10
                  Text: =If(Len(Trim(Coalesce(varCierreMotivo, ""))) < 10, "Escriba al menos 10 caracteres explicando como se resolvio.", "")
                  Width: =520
                  X: =20
                  Y: =230
            - btnCierreCancelar:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Secondary
                  Height: =36
                  OnSelect: |-
                    =UpdateContext({varCierreAbierto: false})
                  Text: ="Cancelar"
                  Width: =140
                  X: =240
                  Y: =258
            - btnCierreConfirmar:
                Control: Button@0.0.45
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  DisplayMode: =If(Len(Trim(Coalesce(varCierreMotivo, ""))) < 10, DisplayMode.Disabled, DisplayMode.Edit)
                  Height: =36
                  OnSelect: |-
                    =Patch(
                        'CH-Tbl-Received Emails',
                        galBandeja.Selected,
                        {
                            EmailReplyStatus: 'EmailReplyStatus (CH-Tbl-Received Emails)'.Omitido,
                            RepliedBy: User().Email,
                            ReplyDateTime: Now(),
                            ReplyCloseNote: Trim(varCierreMotivo)
                        }
                    );
                    Refresh('CH-Tbl-Received Emails');
                    UpdateContext({varCierreAbierto: false});
                    Notify("Cerrado a nombre de " & User().Email & ".", NotificationType.Success);
                  Text: ="Confirmar"
                  Width: =160
                  X: =390
                  Y: =258
