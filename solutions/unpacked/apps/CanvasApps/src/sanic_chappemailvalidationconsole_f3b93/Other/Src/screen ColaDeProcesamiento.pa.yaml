                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(28, 21, 23, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =15
