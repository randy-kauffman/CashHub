Screens:
  screen ColaDeProcesamiento:
    Properties:
      OnVisible: |-
        =UpdateContext({varSpinnerCompletoVisible: false, varVista: "TODO"});
        // Que area es el usuario. El limite real es el rol de Dataverse sobre las
        // tablas de RFC; esto solo evita ofrecer un boton que no le corresponde.
        ClearCollect(colPermisosAlta,
            Filter('CH-Tbl-ClientDataChangePermissions' As C,
                C.Name = "sanic_chtblclientemail"));
        UpdateContext({varPuedeAltaCorreo:
            CountRows(
                Filter(colPermisosAlta,
                    !IsBlank(
                        LookUp(Office365Groups.ListGroupMembers(AADGroupID).value,
                               userPrincipalName = User().Email)))) > 0});
        // Salud del pipeline: latido del barrido + cola real
        UpdateContext(
            {
                varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                varEsperandoBanca: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual')),
                varSospechosos: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso)),
                varPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                varErroresSistema: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                varRespuestasPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente))
            }
        );
        UpdateContext(
            {
                varMinutosSinLatido: If(IsBlank(varLatido), -1,
                    DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
            }
        );
    Children:
      - ScreenContainer2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width - Self.X
            X: =46
          Children:
            - container Salud:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutMinHeight: =60
                  LayoutMinWidth: =32
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                Children:
                  - icoSemaforo:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varMinutosSinLatido < 0, RGBA(168, 0, 0, 1), varMinutosSinLatido <= 20, RGBA(16, 124, 16, 1), varMinutosSinLatido <= 45, RGBA(196, 137, 0, 1), RGBA(168, 0, 0, 1))
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisabledColor: =RGBA(119, 119, 119, 1)
                        Height: =20
                        Icon: ="Circle"
                        Tooltip: ="Estado del barrido de ingesta"
                        Width: =20
                        X: =16
                        Y: =20
                  - lblSemaforo:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varMinutosSinLatido < 0, RGBA(168, 0, 0, 1), varMinutosSinLatido <= 20, RGBA(16, 124, 16, 1), varMinutosSinLatido <= 45, RGBA(196, 137, 0, 1), RGBA(168, 0, 0, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Text: |-
                          =If(varMinutosSinLatido < 0, "SIN SEÑAL — el barrido nunca corrió", varMinutosSinLatido <= 20, "Ingesta operando — último control hace " & varMinutosSinLatido & " min", varMinutosSinLatido <= 45, "Atención: sin control hace " & varMinutosSinLatido & " min", "ALERTA: sin control hace " & varMinutosSinLatido & " min — revisar los flujos")
                        Width: =480
                        X: =44
                        Y: =8
                  - lblContBanca:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varEsperandoBanca > 0, RGBA(196, 137, 0, 1), RGBA(97, 97, 97, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Text: |-
                          ="Esperando a Banca: " & varEsperandoBanca
                        Tooltip: ="Pre-registros de un cliente real cuyo remitente no esta registrado. Banca de Empresas debe registrar el correo y reprocesar."
                        Width: =230
                        X: =Parent.Width - 830
                        Y: =8
                  - lblContPendientes:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varPendientes > 0, RGBA(196, 137, 0, 1), RGBA(97, 97, 97, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Text: |-
                          ="Sin validar: " & varPendientes
                        Tooltip: ="Correos esperando validación"
                        Width: =190
                        X: =Parent.Width - 600
                        Y: =8
                  - lblContErrores:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varErroresSistema > 0, RGBA(168, 0, 0, 1), RGBA(97, 97, 97, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Text: |-
                          ="Errores: " & varErroresSistema
                        Tooltip: ="Correos con error de sistema"
                        Width: =190
                        X: =Parent.Width - 410
                        Y: =8
                  - lblContRespuestas:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =If(varRespuestasPendientes > 0, RGBA(196, 137, 0, 1), RGBA(97, 97, 97, 1))
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Text: |-
                          ="Sin responder: " & varRespuestasPendientes
                        Tooltip: ="Respuestas al cliente sin enviar"
                        Width: =190
                        X: =Parent.Width - 220
                        Y: =8
                  - lblSemaforoDetalle:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(97, 97, 97, 1)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Font: =Font.'Open Sans'
                        Height: =20
                        Size: =10
                        Text: =If(IsBlank(varLatido), "Configure el flujo CH-Flow-MailboxSweep para vigilar la ingesta", Coalesce(varLatido.Details, ""))
                        Width: =480
                        X: =44
                        Y: =32
                  - btnRefrescarSalud:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(97, 97, 97, 1)
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisabledColor: =RGBA(119, 119, 119, 1)
                        Height: =24
                        Icon: =Icon.Reload
                        OnSelect: |-
                          =Refresh('CH-Tbl-SystemHeartbeat');
                          Refresh('CH-Tbl-Received Emails');
                          UpdateContext(
                              {
                                  varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                                  varEsperandoBanca: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual')),
                                  varSospechosos: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso)),
                                  varPendientes: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                                  varErroresSistema: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                                  varRespuestasPendientes: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente))
                              }
                          );
                          UpdateContext(
                              {
                                  varMinutosSinLatido: If(IsBlank(varLatido), -1,
                                      DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
                              }
                          );
                          Notify("Estado actualizado.", NotificationType.Success);
                        Tooltip: ="Actualizar el estado"
                        Width: =24
                        X: =Parent.Width - 44
                        Y: =18
            - BottomContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                Children:
                  - container Detalle:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =5
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        LayoutWrap: =true
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =18
                        Visible: =!IsBlank(Table1_1.Selected)
                      Children:
                        - htmlCabecera:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              Height: =62
                              HtmlText: |-
                                ="<style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;font-size:13.5px;color:rgb(28,21,23)}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 8px}.card{background:rgb(250,248,248);border:1px solid rgb(230,223,224);border-radius:0 6px 6px 0;padding:12px 15px;color:rgb(70,59,62)}.w{border-left:3px solid rgb(154,97,0)}.e{border-left:3px solid rgb(110,22,34)}.s{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}.n{flex:none;width:21px;height:21px;border-radius:50%;background:rgb(251,237,239);color:rgb(158,13,36);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}.nota{font-size:12.5px;color:rgb(120,106,109);margin-top:4px}.tal{font-size:11.5px;color:rgb(120,106,109);margin-bottom:11px}.tf{color:rgb(110,22,34)}.ts{color:rgb(138,128,130)}.to{color:rgb(20,107,58)}.fi{background:rgb(246,233,235);border:1px solid rgb(226,205,208);border-radius:7px;padding:11px 14px;margin-bottom:9px;display:flex;gap:12px}.fc{font-weight:700;color:rgb(110,22,34);font-size:12px;flex:none}.fm{font-size:13.5px}.fl{font-size:11.5px;color:rgb(120,106,109);margin-top:4px}.om{display:flex;flex-wrap:wrap;gap:4px 18px;opacity:.72}.om span{font-size:12.5px;color:rgb(138,128,130);font-style:italic}.hd{display:flex;flex-wrap:wrap;gap:7px 13px;align-items:baseline;border-bottom:1px solid rgb(230,223,224);padding-bottom:13px}.id{font-size:19px;font-weight:650}.fr{font-size:13.5px;color:rgb(70,59,62)}.chip{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px}.cw{background:rgb(253,243,227);color:rgb(154,97,0)}.ce{background:rgb(246,233,235);color:rgb(110,22,34)}.st{margin-left:auto;font-size:11.5px;color:rgb(120,106,109)}</style>" &
                                 "<div class='hd'><span class='id'>" & Substitute(Substitute(Coalesce(Table1_1.Selected.Name,""),"&","&amp;"),"<","&lt;") &
                                 "</span><span class='fr'>" & Substitute(Substitute(Coalesce(Table1_1.Selected.SourceEmailAddress,""),"&","&amp;"),"<","&lt;") &
                                 "</span><span class='chip " &
                                 If(Table1_1.Selected.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error, "ce", "cw") &
                                 "'>" & Coalesce(Text(Table1_1.Selected.SenderClassification), "Sin clasificar") &
                                 "</span><span class='st'>Recibido " &
                                 Text(Table1_1.Selected.ReceptionDateTime, "dd/mm/yyyy hh:mm") & "</span></div>"
                              LayoutMinHeight: =10
                              LayoutMinWidth: =Parent.Width - 48
                              Size: =11
                              Width: =Parent.Width
                        - htmlQuePaso:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              Height: =132
                              HtmlText: |-
                                ="<style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;font-size:13.5px;color:rgb(28,21,23)}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 8px}.card{background:rgb(250,248,248);border:1px solid rgb(230,223,224);border-radius:0 6px 6px 0;padding:12px 15px;color:rgb(70,59,62)}.w{border-left:3px solid rgb(154,97,0)}.e{border-left:3px solid rgb(110,22,34)}.s{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}.n{flex:none;width:21px;height:21px;border-radius:50%;background:rgb(251,237,239);color:rgb(158,13,36);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}.nota{font-size:12.5px;color:rgb(120,106,109);margin-top:4px}.tal{font-size:11.5px;color:rgb(120,106,109);margin-bottom:11px}.tf{color:rgb(110,22,34)}.ts{color:rgb(138,128,130)}.to{color:rgb(20,107,58)}.fi{background:rgb(246,233,235);border:1px solid rgb(226,205,208);border-radius:7px;padding:11px 14px;margin-bottom:9px;display:flex;gap:12px}.fc{font-weight:700;color:rgb(110,22,34);font-size:12px;flex:none}.fm{font-size:13.5px}.fl{font-size:11.5px;color:rgb(120,106,109);margin-top:4px}.om{display:flex;flex-wrap:wrap;gap:4px 18px;opacity:.72}.om span{font-size:12.5px;color:rgb(138,128,130);font-style:italic}.hd{display:flex;flex-wrap:wrap;gap:7px 13px;align-items:baseline;border-bottom:1px solid rgb(230,223,224);padding-bottom:13px}.id{font-size:19px;font-weight:650}.fr{font-size:13.5px;color:rgb(70,59,62)}.chip{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px}.cw{background:rgb(253,243,227);color:rgb(154,97,0)}.ce{background:rgb(246,233,235);color:rgb(110,22,34)}.st{margin-left:auto;font-size:11.5px;color:rgb(120,106,109)}</style>" &
                                 "<p class='t'>Que paso</p><div class='card " &
                                 If(Table1_1.Selected.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error, "e", "w") & "'>" &
                                 Substitute(Substitute(Coalesce(Coalesce(Table1_1.Selected.TriageNotes, Table1_1.Selected.ErrorText, "Este correo no dejo explicacion: el motor no llego a evaluarlo."),""),"&","&amp;"),"<","&lt;") &
                                 "</div>"
                              LayoutMinWidth: =Parent.Width - 48
                              Size: =11
                              Width: =Parent.Width
                        - htmlQueHacer:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              Height: =205
                              HtmlText: |-
                                =With(
                                    {g: LookUp('CH-Tbl-Playbook', Name = Switch(Table1_1.Selected.SenderClassification, 'SenderClassification (CH-Tbl-Received Emails)'.'Cliente sin registrar', "cliente-sin-registrar", 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, "sospechoso", If(Table1_1.Selected.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error, "error-sistema",  If(Table1_1.Selected.EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente, "respuesta-sin-enviar", "sin-validar"))))},
                                    "<style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;font-size:13.5px;color:rgb(28,21,23)}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 8px}.card{background:rgb(250,248,248);border:1px solid rgb(230,223,224);border-radius:0 6px 6px 0;padding:12px 15px;color:rgb(70,59,62)}.w{border-left:3px solid rgb(154,97,0)}.e{border-left:3px solid rgb(110,22,34)}.s{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}.n{flex:none;width:21px;height:21px;border-radius:50%;background:rgb(251,237,239);color:rgb(158,13,36);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}.nota{font-size:12.5px;color:rgb(120,106,109);margin-top:4px}.tal{font-size:11.5px;color:rgb(120,106,109);margin-bottom:11px}.tf{color:rgb(110,22,34)}.ts{color:rgb(138,128,130)}.to{color:rgb(20,107,58)}.fi{background:rgb(246,233,235);border:1px solid rgb(226,205,208);border-radius:7px;padding:11px 14px;margin-bottom:9px;display:flex;gap:12px}.fc{font-weight:700;color:rgb(110,22,34);font-size:12px;flex:none}.fm{font-size:13.5px}.fl{font-size:11.5px;color:rgb(120,106,109);margin-top:4px}.om{display:flex;flex-wrap:wrap;gap:4px 18px;opacity:.72}.om span{font-size:12.5px;color:rgb(138,128,130);font-style:italic}.hd{display:flex;flex-wrap:wrap;gap:7px 13px;align-items:baseline;border-bottom:1px solid rgb(230,223,224);padding-bottom:13px}.id{font-size:19px;font-weight:650}.fr{font-size:13.5px;color:rgb(70,59,62)}.chip{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px}.cw{background:rgb(253,243,227);color:rgb(154,97,0)}.ce{background:rgb(246,233,235);color:rgb(110,22,34)}.st{margin-left:auto;font-size:11.5px;color:rgb(120,106,109)}</style>" &
                                    "<p class='t'>Que hacer" &
                                    If(IsBlank(g.Titulo), "", " &nbsp;&mdash;&nbsp; " & Substitute(Substitute(Coalesce(g.Titulo,""),"&","&amp;"),"<","&lt;")) & "</p>" &
                                    Concat(
                                        ForAll(
                                            Sequence(CountRows(Split(Coalesce(g.Pasos, "No hay instructivo cargado para este caso. Cargarlo en CH-Tbl-Playbook."), Char(10)))) As I,
                                            {i: I.Value, txt: Last(FirstN(Split(Coalesce(g.Pasos, "No hay instructivo cargado para este caso. Cargarlo en CH-Tbl-Playbook."), Char(10)), I.Value)).Value}
                                        ),
                                        "<div class='s'><span class='n'>" & i & "</span><span>" &
                                        Substitute(Substitute(txt, "&", "&amp;"), "<", "&lt;") & "</span></div>"
                                    ) &
                                    If(IsBlank(g.Nota), "", "<div class='nota'>" & Substitute(Substitute(Coalesce(g.Nota,""),"&","&amp;"),"<","&lt;") & "</div>")
                                )
                              LayoutMinWidth: =Parent.Width - 48
                              Size: =11
                              Width: =Parent.Width
                        - container BotonesDetalle:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Height: =46
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =46
                              LayoutMinWidth: =Parent.Width - 48
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width - 48
                            Children:
                              - btnAltaCorreo:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    DisplayMode: =If(IsBlank(Table1_1.Selected.'Cliente atribuido'), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =With(
                                          {
                                              cli: Table1_1.Selected.'Cliente atribuido',
                                              dir: Table1_1.Selected.SourceEmailAddress,
                                              ges: Table1_1.Selected.Name
                                          },
                                          With(
                                              {
                                                  rfc: Patch(
                                                      'CH-Tbl-ClientDataChangeRequests',
                                                      Defaults('CH-Tbl-ClientDataChangeRequests'),
                                                      {
                                                          Type: 'Type (CH-Tbl-ClientDataChangeRequests)'.Create,
                                                          ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequests)'.Submited,
                                                          TargetTable: "sanic_chtblclientemail",
                                                          RelatedClient: cli,
                                                          Reason: "Alta de remitente detectada por CashHub en " & ges &
                                                                  ". La direccion " & dir &
                                                                  " envio un pre-registro con la plantilla oficial y el CIF de este cliente."
                                                      }
                                                  )
                                              },
                                              Patch(
                                                  'CH-Tbl-ClientDataChangeRequestLines',
                                                  Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                                                  {
                                                      ChangeRequestID: rfc,
                                                      'Field Definition': LookUp('CH-Tbl-ClientTableLogicalFieldNames',
                                                          Table = "sanic_chtblclientemail" And LogicalName = "sanic_name"),
                                                      NewValue: dir
                                                  }
                                              );
                                              Patch(
                                                  'CH-Tbl-ClientDataChangeRequestLines',
                                                  Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                                                  {
                                                      ChangeRequestID: rfc,
                                                      'Field Definition': LookUp('CH-Tbl-ClientTableLogicalFieldNames',
                                                          Table = "sanic_chtblclientemail" And LogicalName = "sanic_Client"),
                                                      NewValue: dir
                                                  }
                                              );
                                              Notify(
                                                  "Solicitud " & rfc.Name & " creada y enviada a aprobacion. Usted no puede aprobarla: la revisa otra persona de Banca de Empresas.",
                                                  NotificationType.Success
                                              )
                                          )
                                      );
                                    Text: ="Registrar correo (crea la solicitud)"
                                    Visible: |-
                                      =And(
                                          Coalesce(varPuedeAltaCorreo, false),
                                          Table1_1.Selected.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.'Cliente sin registrar'
                                      )
