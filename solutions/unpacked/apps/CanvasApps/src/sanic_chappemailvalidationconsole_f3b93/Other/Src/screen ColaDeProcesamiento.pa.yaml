                              - RepliedBy1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="RepliedBy"
                                    FieldName: ="sanic_repliedby"
                                    FieldType: ="s"
                                    Order: =9
                              - SourceEmailAddress1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="SourceEmailAddress"
                                    FieldName: ="sanic_sourceemailaddress"
                                    FieldType: ="s"
                                    Order: =10
                  - MainContainer2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =7
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =!IsBlank(gvarSelectedEmail)
                      Children:
                        - Container3:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =100
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingBottom: =10
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =10
                              Visible: =!IsBlank(gvarSelectedEmail)
                            Children:
                              - DropdownCanvas1:
                                  Control: DropDown@0.0.45
                                  Properties:
                                    DefaultSelectedItems: =gvarSelectedVRUN
                                    Items: "=Filter('CH-Tbl-ValidationRuns',SourceRecordID=Text(gvarSelectedEmail.'CH-Tbl-Received Emails')) "
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnChange: |-
                                      =Refresh('CH-Tbl-ValidationResults');
                                      If(
                                          IsBlank(Self.Selected),
                                          Set(
                                              gvarSelectedVRUN,
                                              Last(
                                                  Filter(
                                                      'CH-Tbl-ValidationRuns',
                                                      SourceRecordID = Text(gvarSelectedEmail.'CH-Tbl-Received Emails')
                                                  )
                                              )
                                          );
                                          ,
                                          Set(
                                              gvarSelectedVRUN,
                                              Self.Selected
                                          )
                                      );
                                      ClearCollect(
                                          colValidatedResults,
                                          Filter(
                                              'CH-Tbl-ValidationResults',
                                              ValidationRun.'CH-Tbl-ValidationRuns' = gvarSelectedVRUN.'CH-Tbl-ValidationRuns'
                                          )
                                      )
                                    Width: =140
                                  Children:
