            - form DeclaredChecks:
                Control: Form@2.4.4
                Layout: Vertical
                Properties:
                  DataSource: ='CH-Tbl-DeclaredChecks'
                  Height: =261
                  OnFailure: |-
                    =ForAll(colSubmitedCheck As Check, Remove('CH-Tbl-DeclaredChecks', Check));
                    ForAll(colSubmitedDeposits As Deposit, Remove('CH-Tbl-DeclaredDeposits', Deposit));
                    ForAll(colSubmitedBags As Bag, Remove('CH-Tbl-DeclaredBags', Bag));
                    Remove('CH-Tbl-Declarations', varNewDeclaration);
                    UpdateContext({varSpinnerCompletoVisible: false, varLabelSpinnerCompleto: "Guardando..."});
                  OnSuccess: |-
                    =UpdateContext({varLastSubmitedCheck: 'form DeclaredChecks'.LastSubmit});
                    UpdateContext({varProgressBarActual: varProgressBarActual+1});
                    Collect(
                        colSubmitedCheck,
                        varLastSubmitedCheck
                    );
                    RemoveIf(
                        colBagRelatedChecks As d,
                        varLastSubmitedCheck.CheckNumber = d.NoCheque
                    );

                    If(
                        !IsEmpty(colBagRelatedChecks),
                    //If there is any related check, submit it
                        UpdateContext({varCheck: First(colBagRelatedChecks)});
                        NewForm('form DeclaredChecks');
                        SubmitForm('form DeclaredChecks');
                        ,//If there is no check, check if it is any other related deposit to the actual bag.
                        If(
                            !IsEmpty(colBagRelatedDeposits),
                    //If related deposit collection is not empoty, submit the next related deposit. 
                            UpdateContext({varDeposit: First(colBagRelatedDeposits)});
                            NewForm('form DeclaredDeposits');
                            SubmitForm('form DeclaredDeposits');
                            ,//If there is no more related deposits, check for the next bag.
                            If(
                                !IsEmpty(colEmailDeclaredBags),
                    //Continue with the next bag
                                UpdateContext({varBag: First(colEmailDeclaredBags)});
                                NewForm('form DeclaredBags');
                                SubmitForm('form DeclaredBags');
                                ,//If no more bags, finish the procedure. 
                                Select(btnFinishSubmittion);
                            )
                        )
                    )
                  Visible: =false
                  Width: =601
                  Y: =8
