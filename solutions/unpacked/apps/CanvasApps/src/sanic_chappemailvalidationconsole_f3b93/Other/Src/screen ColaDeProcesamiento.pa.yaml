Screens:
  screen ColaDeProcesamiento:
    Properties:
      OnVisible: |-
        =UpdateContext({varSpinnerCompletoVisible: false, varVista: "TODO"});
        UpdateContext(
            {
                stBase: "color:rgb(28,21,23)",
                stRot: "font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 10px 0",
                stCard: "font-size:13.5px;line-height:1.5;background:rgb(250,248,248);border:1px solid rgb(230,223,224);padding:14px 16px;color:rgb(70,59,62);margin:0",
                stPaso: "font-size:13.5px;line-height:1.5;color:rgb(28,21,23);vertical-align:top;padding:0 0 10px 0",
                stNum: "display:inline-block;width:21px;height:21px;line-height:21px;text-align:center;border-radius:11px;background:rgb(251,237,239);color:rgb(158,13,36);font-size:11px;font-weight:700",
                stNota: "font-size:12.5px;line-height:1.5;color:rgb(120,106,109);margin:10px 0 0 0",
                stTally: "font-size:11.5px;color:rgb(120,106,109);margin:0 0 11px 0",
                stFila: "background:rgb(246,233,235);border:1px solid rgb(226,205,208);border-radius:7px;padding:12px 15px;margin:0 0 9px 0;font-size:13.5px",
                stCod: "font-weight:700;color:rgb(110,22,34);font-size:12px",
                stMsg: "font-size:13.5px;color:rgb(28,21,23)",
                stCelda: "font-size:11.5px;color:rgb(120,106,109)",
                stOmi: "font-size:12.5px;color:rgb(138,128,130);font-style:italic;margin:0 0 3px 0",
                stId: "font-size:19px;font-weight:650;color:rgb(28,21,23)",
                stDe: "font-size:13px;color:rgb(70,59,62)",
                stChip: "font-size:11px;font-weight:650;padding:3px 9px;border-radius:11px"
            }
        );
        // Que area es el usuario. El limite real es el rol de Dataverse sobre las
        // tablas de RFC; esto solo evita ofrecer un boton que no le corresponde.
        ClearCollect(colPermisosAlta,
            Filter('CH-Tbl-ClientDataChangePermissions' As C,
                C.Name = "sanic_chtblclientemail"));
        UpdateContext({varPuedeAltaCorreo:
            CountRows(
                Filter(colPermisosAlta,
                    !IsBlank(
                        LookUp(Office365Groups.ListGroupMembers(AADGroupID).value,
                               userPrincipalName = User().Email)))) > 0});
        // Salud del pipeline: latido del barrido + cola real
        UpdateContext(
            {
                varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                varEsperandoBanca: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual')),
                varSospechosos: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso)),
                varPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                varErroresSistema: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                varRespuestasPendientes: CountRows(
                    Filter('CH-Tbl-Received Emails',
                        EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente))
            }
        );
        UpdateContext(
            {
                varMinutosSinLatido: If(IsBlank(varLatido), -1,
                    DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
            }
        );
    Children:
      - ScreenContainer2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width - Self.X
            X: =46
          Children:
            - container Salud:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutMinHeight: =60
                  LayoutMinWidth: =32
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                Children:
                  - htmlSalud:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        Height: =Parent.Height - 10
                        HtmlText: |-
                          ="<table width='100%' cellpadding='0' cellspacing='0'><tr>" &
                                               "<td valign='middle' width='14'><span style='display:inline-block;width:9px;height:9px;border-radius:5px;background:" &
                                               If(varMinutosSinLatido < 0, "rgb(164,38,44)", varMinutosSinLatido <= 20, "rgb(20,107,58)", varMinutosSinLatido <= 45, "rgb(154,97,0)", "rgb(164,38,44)") & "'></span></td>" &
                                               "<td valign='middle'><div style='font-size:14px;font-weight:600;color:rgb(28,21,23)'>" &
                                               If(varMinutosSinLatido < 0, "Sin latido del barrido", varMinutosSinLatido <= 20, "Ingesta operando", varMinutosSinLatido <= 45, "El barrido se atraso", "Ingesta detenida") &
                                               "</div><div style='font-size:11.5px;color:rgb(120,106,109)'>" &
                                               If(IsBlank(varLatido), "Configure CH-Flow-MailboxSweep para vigilar la ingesta",
                                                  "Ultimo control hace " & varMinutosSinLatido & " min &middot; " & Coalesce(varLatido.Details, "")) &
                                               "</div></td>" &
                                               "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varEsperandoBanca > 0, "rgb(154,97,0)", "rgb(120,106,109)") & "'>" & varEsperandoBanca & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Esperando a Banca" & "</div></td>" &
                                               "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varPendientes > 0, "rgb(154,97,0)", "rgb(120,106,109)") & "'>" & varPendientes & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Sin validar" & "</div></td>" &
                                               "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varErroresSistema > 0, "rgb(110,22,34)", "rgb(120,106,109)") & "'>" & varErroresSistema & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Errores" & "</div></td>" &
                                               "<td align='right' style='padding-left:34px'>" & "<div style='font-size:19px;font-weight:650;color:" & If(varRespuestasPendientes > 0, "rgb(154,97,0)", "rgb(120,106,109)") & "'>" & varRespuestasPendientes & "</div>" & "<div style='font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109)'>" & "Sin responder" & "</div></td>" &
                                               "</tr></table>"
                        Size: =11
                        Width: =Parent.Width - 80
                        X: =16
                        Y: =6
                  - btnRefrescarSalud:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(97, 97, 97, 1)
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisabledColor: =RGBA(119, 119, 119, 1)
                        Height: =24
                        Icon: =Icon.Reload
                        OnSelect: |-
                          =Refresh('CH-Tbl-SystemHeartbeat');
                          Refresh('CH-Tbl-Received Emails');
                          UpdateContext(
                              {
                                  varLatido: LookUp('CH-Tbl-SystemHeartbeat', Name = "ingesta-correos"),
                                  varEsperandoBanca: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual')),
                                  varSospechosos: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso)),
                                  varPendientes: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente)),
                                  varErroresSistema: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error)),
                                  varRespuestasPendientes: CountRows(
                                      Filter('CH-Tbl-Received Emails',
                                          EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente))
                              }
                          );
                          UpdateContext(
                              {
                                  varMinutosSinLatido: If(IsBlank(varLatido), -1,
                                      DateDiff(varLatido.LastRunOn, Now(), TimeUnit.Minutes))
                              }
                          );
                          Notify("Estado actualizado.", NotificationType.Success);
                        Tooltip: ="Actualizar el estado"
                        Width: =24
                        X: =Parent.Width - 44
                        Y: =18
            - SearchContainer1_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingRight: =5
                Children:
                  - SearchInput1_1:
                      Control: TextInput@0.0.54
                      Properties:
                        FillPortions: =1
                        Height: =44
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnChange: =Reset(Self)
                        Placeholder: ="Buscar por asunto o remitente"
                  - btnVistaTodo:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: =If(varVista = "TODO", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =110
                        OnSelect: |-
                          =UpdateContext({varVista: "TODO"})
                        Text: ="Todo lo accionable"
                        Width: =150
                  - btnVistaBanca:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: =If(varVista = "BANCA", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =110
                        OnSelect: |-
                          =UpdateContext({varVista: "BANCA"})
                        Text: ="Esperando a Banca (" & varEsperandoBanca & ")"
                        Width: =180
                  - btnVistaSospechoso:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: =If(varVista = "SOSPECHOSO", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =110
                        OnSelect: |-
                          =UpdateContext({varVista: "SOSPECHOSO"})
                        Text: ="Sospechosos (" & varSospechosos & ")"
                        Width: =150
                  - btnVistaError:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: =If(varVista = "ERROR", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =110
                        OnSelect: |-
                          =UpdateContext({varVista: "ERROR"})
                        Text: ="Errores (" & varErroresSistema & ")"
                        Width: =150
                  - btnVistaSinResp:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: =If(varVista = "SINRESP", 'ButtonCanvas.Appearance'.Primary, 'ButtonCanvas.Appearance'.Subtle)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =110
                        OnSelect: |-
                          =UpdateContext({varVista: "SINRESP"})
                        Text: ="Sin responder (" & varRespuestasPendientes & ")"
                        Width: =150
            - BottomContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                Children:
                  - galBandeja:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        FillPortions: =3
                        Items: |-
                          =Search(
                              Switch(
                                  varVista,
                                  "BANCA",
                                  Filter('CH-Tbl-Received Emails', EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual'),
                                  "SOSPECHOSO",
                                  Filter('CH-Tbl-Received Emails', SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso),
                                  "ERROR",
                                  Filter('CH-Tbl-Received Emails', EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error),
                                  "SINRESP",
                                  Filter('CH-Tbl-Received Emails', EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente),
                                  Filter('CH-Tbl-Received Emails',
                                      EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual'
                                      || EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error
                                      || ValidationStatus = 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente
                                      || EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente)
                              ),
                              SearchInput1_1.Value,
                              Subject,
                              SourceEmailAddress
                          )
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =16
                        LayoutMinWidth: =260
                        TemplatePadding: =0
                        TemplateSize: =84
                      Children:
                        - recFranja:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 255, 1)
                              Fill: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error || ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, RGBA(110, 22, 34, 1), RGBA(154, 97, 0, 1))
                              Height: =Parent.TemplateHeight
                              Width: =3
                        - lblGalAsunto:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(28, 21, 23, 1)
                              DisabledColor: =RGBA(186, 186, 186, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: =Coalesce(ThisItem.Subject, "(sin asunto)")
                              Width: =Parent.TemplateWidth - 112
                              X: =16
                              Y: =11
                        - lblGalCuando:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(120, 106, 109, 1)
                              DisabledColor: =RGBA(186, 186, 186, 1)
                              Font: =Font.'Open Sans'
                              Height: =18
                              Size: =9
                              Text: |-
                                =With({h: DateDiff(ThisItem.ReceptionDateTime, Now(), TimeUnit.Hours)}, If(h < 1, "hace " & DateDiff(ThisItem.ReceptionDateTime, Now(), TimeUnit.Minutes) & " min", h < 24, "hace " & h & " h", "hace " & RoundDown(h / 24, 0) & " d"))
                              Width: =92
                              X: =Parent.TemplateWidth - 104
                              Y: =12
                        - lblGalRemitente:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(120, 106, 109, 1)
                              DisabledColor: =RGBA(186, 186, 186, 1)
                              Font: =Font.'Open Sans'
                              Height: =18
                              PaddingLeft: =0
                              Size: =10
                              Text: =Coalesce(ThisItem.SourceEmailAddress, "(sin remitente)")
                              Width: =Parent.TemplateWidth - 30
                              X: =16
                              Y: =31
                        - lblGalChip:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error || ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, RGBA(110, 22, 34, 1), RGBA(154, 97, 0, 1))
                              DisabledColor: =RGBA(186, 186, 186, 1)
                              Fill: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error || ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, RGBA(246, 233, 235, 1), RGBA(253, 243, 227, 1))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =8
                              PaddingRight: =8
                              Size: =8
                              Text: =If(ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error, "Fallo el sistema", ThisItem.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, "Sospechoso", ThisItem.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.'Revision manual', "Cliente sin registrar", ThisItem.EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente, "Respuesta sin enviar", "Sin validar")
                              Width: =152
                              X: =16
                              Y: =54
                  - container Detalle:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =5
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =16
                        LayoutMinWidth: =420
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        LayoutWrap: =true
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =18
                        Visible: =!IsBlank(galBandeja.Selected)
                      Children:
                        - htmlReglas:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Height: =290
                              HtmlText: |-
                                ="<p style='font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 10px 0'>Reglas que no pasaron</p>" &
                                 "<div style='font-size:13.5px;line-height:1.5;background:rgb(250,248,248);border:1px solid rgb(230,223,224);border-left:3px solid rgb(154,97,0);padding:14px 16px;color:rgb(70,59,62)'>" &
                                 "Bloque en pausa mientras se refresca el origen de datos de las corridas. La formula original esta guardada y se restaura en cuanto termines." &
                                 "</div>"
                              Size: =11
                        - htmlCabecera:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Height: =58
                              HtmlText: |-
                                ="<table width='100%' cellpadding='0' cellspacing='0' style='color:rgb(28,21,23);border-bottom:1px solid rgb(230,223,224);padding-bottom:10px'><tr>" &
                                   "<td width='1%' nowrap style='font-size:19px;font-weight:650;color:rgb(28,21,23)'>" & Substitute(Substitute(Coalesce(galBandeja.Selected.Name,""),"&","&amp;"),"<","&lt;") & "</td>" &
                                   "<td width='1%' nowrap style='font-size:13.5px;color:rgb(70,59,62);padding-left:14px'>" & Substitute(Substitute(Coalesce(galBandeja.Selected.SourceEmailAddress,""),"&","&amp;"),"<","&lt;") & "</td>" &
                                   "<td width='1%' nowrap style='padding-left:14px'><span style='font-size:11px;font-weight:650;padding:3px 9px;border-radius:11px;background:" &
                                   If(galBandeja.Selected.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error,
                                      "rgb(246,233,235);color:rgb(110,22,34)", "rgb(253,243,227);color:rgb(154,97,0)") & "'>" &
                                   Coalesce(Text(galBandeja.Selected.SenderClassification), "Sin clasificar") & "</span></td>" &
                                   "<td align='right' style='font-size:11.5px;color:rgb(120,106,109)'>Recibido " &
                                   Text(galBandeja.Selected.ReceptionDateTime, "dd/mm/yyyy hh:mm") & "</td></tr></table>"
                              LayoutMinHeight: =0
                              Size: =11
                              Width: =Parent.Width - 48
                        - htmlQuePaso:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Height: =128
                              HtmlText: |-
                                ="<p style='font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 10px 0'>Que paso</p>" &
                                 "<div style='font-size:13.5px;line-height:1.5;background:rgb(250,248,248);border:1px solid rgb(230,223,224);padding:14px 16px;color:rgb(70,59,62);margin:0;border-left:3px solid " &
                                 If(galBandeja.Selected.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error,
                                    "rgb(110,22,34)", "rgb(154,97,0)") & "'>" &
                                 Substitute(Substitute(Coalesce(Coalesce(galBandeja.Selected.TriageNotes, galBandeja.Selected.ErrorText, "Este correo no dejo explicacion: el motor no llego a evaluarlo."),""),"&","&amp;"),"<","&lt;") &
                                 "</div>"
                              LayoutMinHeight: =0
                              Size: =11
                              Width: =Parent.Width - 48
                        - htmlQueHacer:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Height: =0
                              HtmlText: |-
                                =With(
                                    {g: LookUp('CH-Tbl-Playbook', Name = Switch(galBandeja.Selected.SenderClassification, 'SenderClassification (CH-Tbl-Received Emails)'.'Cliente sin registrar', "cliente-sin-registrar", 'SenderClassification (CH-Tbl-Received Emails)'.Sospechoso, "sospechoso", If(galBandeja.Selected.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Error, "error-sistema",  If(galBandeja.Selected.EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente, "respuesta-sin-enviar", "sin-validar"))))},
                                    "<p style='font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 10px 0'>Que hacer" &
                                    If(IsBlank(g.Titulo), "", " &nbsp;&mdash;&nbsp; " & Substitute(Substitute(Coalesce(g.Titulo,""),"&","&amp;"),"<","&lt;")) & "</p>" &
                                    Concat(
                                        ForAll(
                                            Sequence(CountRows(Split(Coalesce(g.Pasos, "No hay instructivo cargado para este caso. Cargarlo en CH-Tbl-Playbook."), Char(10)))) As I,
                                            {i: I.Value, txt: Last(FirstN(Split(Coalesce(g.Pasos, "No hay instructivo cargado para este caso. Cargarlo en CH-Tbl-Playbook."), Char(10)), I.Value)).Value}
                                        ),
                                        "<table cellpadding='0' cellspacing='0'><tr><td width='31' valign='top' style='padding:0 0 9px 0'>" &
                                        "<span style='display:inline-block;width:21px;height:21px;line-height:21px;text-align:center;border-radius:11px;background:rgb(251,237,239);color:rgb(158,13,36);font-size:11px;font-weight:700'>" & i & "</span></td>" &
                                        "<td style='font-size:13.5px;line-height:1.5;color:rgb(28,21,23);vertical-align:top;padding:0 0 10px 0'>" &
                                        If(
                                            CountRows(Split(txt, "|")) > 1,
                                            "<b>" & Substitute(Substitute(First(Split(txt, "|")).Value, "&", "&amp;"), "<", "&lt;") & "</b> " &
                                            Substitute(Substitute(Last(Split(txt, "|")).Value, "&", "&amp;"), "<", "&lt;"),
                                            Substitute(Substitute(txt, "&", "&amp;"), "<", "&lt;")
                                        ) & "</td></tr></table>"
                                    ) &
                                    If(IsBlank(g.Nota), "", "<p style='font-size:12.5px;line-height:1.5;color:rgb(120,106,109);margin:10px 0 0 0'>" & Substitute(Substitute(Coalesce(g.Nota,""),"&","&amp;"),"<","&lt;") & "</p>")
                                )
                              LayoutMinHeight: =0
                              Size: =11
                              Width: =Parent.Width - 48
                        - container BotonesDetalle:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =Parent.Width - 48
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width - 48
                            Children:
                              - btnAltaCorreo:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Primary
                                    DisplayMode: =If(IsBlank(galBandeja.Selected.'Cliente atribuido'), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =With(
                                          {
                                              cli: galBandeja.Selected.'Cliente atribuido',
                                              dir: galBandeja.Selected.SourceEmailAddress,
                                              ges: galBandeja.Selected.Name
                                          },
                                          With(
                                              {
                                                  rfc: Patch(
                                                      'CH-Tbl-ClientDataChangeRequests',
                                                      Defaults('CH-Tbl-ClientDataChangeRequests'),
                                                      {
                                                          Type: 'Type (CH-Tbl-ClientDataChangeRequests)'.Create,
                                                          ChangeStatus: 'ChangeStatus (CH-Tbl-ClientDataChangeRequests)'.Submited,
                                                          TargetTable: "sanic_chtblclientemail",
                                                          RelatedClient: cli,
                                                          Reason: "Alta de remitente detectada por CashHub en " & ges &
                                                                  ". La direccion " & dir &
                                                                  " envio un pre-registro con la plantilla oficial y el CIF de este cliente."
                                                      }
                                                  )
                                              },
                                              Patch(
                                                  'CH-Tbl-ClientDataChangeRequestLines',
                                                  Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                                                  {
                                                      ChangeRequestID: rfc,
                                                      'Field Definition': LookUp('CH-Tbl-ClientTableLogicalFieldNames',
                                                          Table = "sanic_chtblclientemail" And LogicalName = "sanic_name"),
                                                      NewValue: dir
                                                  }
                                              );
                                              Patch(
                                                  'CH-Tbl-ClientDataChangeRequestLines',
                                                  Defaults('CH-Tbl-ClientDataChangeRequestLines'),
                                                  {
                                                      ChangeRequestID: rfc,
                                                      'Field Definition': LookUp('CH-Tbl-ClientTableLogicalFieldNames',
                                                          Table = "sanic_chtblclientemail" And LogicalName = "sanic_Client"),
                                                      NewValue: dir
                                                  }
                                              );
                                              Notify(
                                                  "Solicitud " & rfc.Name & " creada y enviada a aprobacion. Usted no puede aprobarla: la revisa otra persona de Banca de Empresas.",
                                                  NotificationType.Success
                                              )
                                          )
                                      );
                                    Text: ="Registrar correo (crea la solicitud)"
                                    Visible: |-
                                      =And(
                                          Coalesce(varPuedeAltaCorreo, false),
                                          galBandeja.Selected.SenderClassification = 'SenderClassification (CH-Tbl-Received Emails)'.'Cliente sin registrar'
                                      )
                                    Width: =270
                              - btnReprocesar:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    OnSelect: |-
                                      =Patch(
                                          'CH-Tbl-Received Emails',
                                          galBandeja.Selected,
                                          {
                                              ValidationStatus: 'ValidationStatus (CH-Tbl-Received Emails)'.Pendiente,
                                              EmailReviewStatus: 'EmailReviewStatus (CH-Tbl-Received Emails)'.Pendiente
                                          }
                                      );
                                      Refresh('CH-Tbl-Received Emails');
                                      Notify("Marcado para reproceso. El barrido lo revalida en su proxima corrida, dentro de 10 minutos como maximo.", NotificationType.Success);
                                    Text: ="Marcar para reproceso"
                                    Width: =190
                              - btnReenviar:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    OnSelect: |-
                                      =Patch(
                                          'CH-Tbl-Received Emails',
                                          galBandeja.Selected,
                                          {EmailReplyStatus: 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente}
                                      );
                                      Refresh('CH-Tbl-Received Emails');
                                      Notify("Respuesta encolada. Si el correo se archivo hace tiempo el envio puede fallar: al mover un mensaje, Exchange le cambia el id.", NotificationType.Warning);
                                    Text: ="Reenviar respuesta"
                                    Visible: =!IsBlank(galBandeja.Selected.ReplyBodyHtml)
                                    Width: =175
                              - btnResueltoFuera:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =UpdateContext({varCierreAbierto: true, varCierreMotivo: ""})
                                    Text: ="Resuelto por fuera"
                                    Visible: =!IsBlank(galBandeja.Selected.ReplyBodyHtml)
                                    Width: =175
                              - btnDenegar:
                                  Control: Button@0.0.45
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =UpdateContext({varOverrideAbierto: true, varOverrideAcepta: false, varOverrideMotivo: ""})
                                    Text: ="Denegar manualmente"
                                    Width: =190
                        - btnDetTecnico:
                            Control: Button@0.0.45
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =UpdateContext({varTecnicoAbierto: !Coalesce(varTecnicoAbierto, false)})
                              Text: =If(Coalesce(varTecnicoAbierto, false), "Ocultar detalle tecnico", "Detalle tecnico")
                              Width: =190
                        - htmlTecnico:
                            Control: HtmlViewer@2.1.0
                            Properties:
                              AutoHeight: =true
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              Height: =150
                              HtmlText: |-
                                ="<table cellpadding='0' cellspacing='0' style='font-size:12.5px'>" &
                                 Concat(
                                     Table(
                                         {k: "Clasificacion del remitente", v: Coalesce(Text(galBandeja.Selected.SenderClassification), "sin clasificar — el motor no llego a esa etapa")},
                                         {k: "Cliente atribuido", v: Coalesce(galBandeja.Selected.'Cliente atribuido'.Name, "ninguno")},
                                         {k: "Mensaje del motor", v: Coalesce(galBandeja.Selected.ErrorText, "sin mensaje")},
                                         {k: "Respuesta al cliente", v: Coalesce(Text(galBandeja.Selected.EmailReplyStatus), "-")},
                                         {k: "Numero de gestion", v: Coalesce(galBandeja.Selected.Name, "-")}
                                     ),
                                     "<tr><td valign='top' style='color:rgb(120,106,109);padding:0 20px 7px 0;white-space:nowrap'>" & k &
                                     "</td><td valign='top' style='color:rgb(28,21,23);padding:0 0 7px 0'>" &
                                     Substitute(Substitute(v, "&", "&amp;"), "<", "&lt;") & "</td></tr>"
                                 ) & "</table>"
                              Size: =11
                              Visible: =Coalesce(varTecnicoAbierto, false)
                              Width: =Parent.Width - 48
      - ExpandMenu_2:
          Control: CanvasComponent
          ComponentName: ExpandMenu
          ComponentLibraryUniqueName: cat_powercatcomponentlibrary_0be3a
