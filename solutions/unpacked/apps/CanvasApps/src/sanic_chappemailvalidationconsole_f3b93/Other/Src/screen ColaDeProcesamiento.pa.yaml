      - Toggle2:
          Control: Classic/Toggle@2.1.0
          Properties:
            Default: =varValidationToggle
            OnChange: |-
              =
              If(!IsEmpty(colValidationQueue),

              If(IsBlank(varValidationRule), UpdateContext({varValidationRule: First(colValidationQueue)}); Select(btnValidationRules))


              ,If(
                  varRunAllValidations,
                  ClearCollect(
                      colValidationsToRun,
                          Filter(
                              colValidationRules As Rule,
                              IsBlank(
                                  LookUp(
                                      Filter(
                                          colValidatedResults,
                                          ValidationRun.'CH-Tbl-ValidationRuns' = gvarSelectedVRUN.'CH-Tbl-ValidationRuns'
                                      ) As Result,
                                      Result.ValidationRule.Name = Rule.Name
                                  )
                              )
                          )
                      );

                      ClearCollect(colValidationsToRun,
                      Filter(colValidationsToRun As Rule,

                      IsBlank(Rule.ValidationDependency) || 
                      !IsBlank(
                          LookUp(
                              Filter(
                                          colValidatedResults,
                                          ValidationRun.'CH-Tbl-ValidationRuns' = gvarSelectedVRUN.'CH-Tbl-ValidationRuns'
                                      ) As Result,
                              Result.ValidationRule.Name = Rule.ValidationDependency.Name
                              &&
                              Result.ValidationResult = 'ValidationResult (CH-Tbl-ValidationResults)'.Pass
                          )
                      )))
                  ;

                  //Llenar la cola de validaion
                  If(
                      IsEmpty(colValidationsToRun),
                      UpdateContext({varRunAllValidations: false, varSpinnerCompletoVisible: false}),
                      ClearCollect(colValidationQueue, colValidationsToRun);
                  );

                  UpdateContext({varValidationToggle: !varValidationToggle});
              ))
            OnCheck: =
            OnSelect: =
            OnUncheck: =
            Visible: =false
            X: =40
            Y: =40
      - btnValidationRules:
          Control: Button@0.0.45
          Properties:
            OnSelect: "=UpdateContext(\r\n    {\r\n        varStartTime: Now(),\r\n        varSpinnerCompletoVisible: true,\r\n        varLabelSpinnerCompleto: \"Validando...\"\r\n    }\r\n);\r\n\r\n\r\nSwitch(\r\n    varValidationRule.Name,\r\n    \"VR-01\",\r\n    UpdateContext(\r\n        {\r\n            varEmailAttachments: Filter(\r\n                'CH-Tbl-EmailsAttachments',\r\n                Email.'CH-Tbl-Received Emails' = gvarSelectedEmail.'CH-Tbl-Received Emails'\r\n            )\r\n        }\r\n    );\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                CountRows(varEmailAttachments),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    UpdateContext(\r\n        {\r\n            varDuration: DateDiff(\r\n                varStartTime,\r\n                Now(),\r\n                TimeUnit.Milliseconds\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-02\",\r\n    UpdateContext({EVResult: !IsBlank(LookUp('CH-Tbl-ClientEmails', 'Email Address' =gvarSelectedEmail.'Email Address' && RecordStatus = 'CH-Ch-RecordStatus'.Active && ClientStatus = 'CH-Ch-RecordStatus'.Active))});\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-03\",\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                gvarSelectedEmail.Subject,\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-04\",\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                LookUp(\r\n                    'CH-Tbl-EmailsAttachments',\r\n                    Email.'CH-Tbl-Received Emails' = gvarSelectedEmail.'CH-Tbl-Received Emails'\r\n                ).FileExtention,\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-05\",\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                LookUp(\r\n                    'CH-Tbl-EmailsAttachments',\r\n                    Email.'CH-Tbl-Received Emails' = gvarSelectedEmail.'CH-Tbl-Received Emails'\r\n                ).TamanoEnbytes / (1024 ^ 2),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-06\",\r\n    Set(\r\n        JSONData,\r\n        'CH-Flow-ExtractedTablesFromExcel'.Run(\r\n            LookUp(\r\n                'CH-Tbl-EmailsAttachments',\r\n                Email.'CH-Tbl-Received Emails' = gvarSelectedEmail.'CH-Tbl-Received Emails'\r\n            ).'CH-Tbl-EmailsAttachments'\r\n        ).datos\r\n    );\r\n    //Clear(colTopKeys);\r\nClear(colDepositosCols);\r\n    Clear(colChequesCols);\r\n    Clear(colDepositosData);\r\n    Clear(colChequesData);\r\n    Clear(colTablasEnArchivo);\r\n    // Replace JSONData.datos with your string variable/column\r\nSet(\r\n        _rootDyn,\r\n        ParseJSON(JSONData)\r\n    );\r\n    Set(\r\n        _root,\r\n        Table(_rootDyn)\r\n    );\r\n    Set(\r\n        _okParse,\r\n        IfError(\r\n            Set(\r\n                _rootDyn,\r\n                ParseJSON(JSONData)\r\n            );\r\n            Set(\r\n                _root,\r\n                Table(_rootDyn)\r\n            );\r\n            // succeeds only if root is a JSON array\r\ntrue,\r\n            false\r\n        )\r\n    );\r\n    ClearCollect(\r\n        colTopKeys,\r\n        ForAll(\r\n            _root As R,\r\n            First(ColumnNames(R.Value)).Value\r\n        )\r\n    );\r\n    If(\r\n        !_okParse,\r\n        Notify(\r\n            \"Root is not valid JSON array.\",\r\n            NotificationType.Error\r\n        )\r\n    );\r\n    // Cheques array\r\nSet(\r\n        _cheArray,\r\n        Column(\r\n            LookUp(\r\n                _root,\r\n                !IsBlank(Value.Cheques)\r\n            ).Value,\r\n            \"Cheques\"\r\n        )\r\n    );\r\n    // Depositos array\r\nSet(\r\n        _depArray,\r\n        Column(\r\n            LookUp(\r\n                _root,\r\n                !IsBlank(Value.Depositos)\r\n            ).Value,\r\n            \"Depositos\"\r\n        )\r\n    );\r\n    JSON(_depArray);\r\n    // Quick counts (labels)\r\nSet(\r\n        _depCount,\r\n        CountRows(Table(_depArray))\r\n    );\r\n    Set(\r\n        _cheCount,\r\n        CountRows(Table(_cheArray))\r\n    );\r\n    // Depositos column names\r\nIf(\r\n        _depCount > 0,\r\n        ClearCollect(\r\n            colDepositosCols,\r\n            ColumnNames(First(Table(_depArray)).Value)\r\n        ),\r\n        ClearCollect(\r\n            colDepositosCols,\r\n            Table({Value: \"<no rows>\"})\r\n        )\r\n    );\r\n    // Cheques column names\r\nIf(\r\n        _cheCount > 0,\r\n        ClearCollect(\r\n            colChequesCols,\r\n            ColumnNames(First(Table(_cheArray)).Value)\r\n        ),\r\n        ClearCollect(\r\n            colChequesCols,\r\n            Table({Value: \"<no rows>\"})\r\n        )\r\n    );\r\n    // Depositos rows as readable JSON (first 3)\r\nClearCollect(\r\n        colDepositosRaw,\r\n        ForAll(\r\n            FirstN(\r\n                Table(_depArray),\r\n                3\r\n            ) As Row,\r\n            {\r\n                __json: JSON(\r\n                    Row.Value,\r\n                    JSONFormat.IndentFour\r\n                )\r\n            }\r\n        )\r\n    );\r\n    // Cheques rows as readable JSON (first 3)\r\nClearCollect(\r\n        colChequesRaw,\r\n        ForAll(\r\n            FirstN(\r\n                Table(_cheArray),\r\n                3\r\n            ) As Row,\r\n            {\r\n                __json: JSON(\r\n                    Row.Value,\r\n                    JSONFormat.IndentFour\r\n                )\r\n            }\r\n        )\r\n    );\r\n    // 6A) Depositos (typed).  Use the exact keys you saw in colDepositosCols / colDepositosRaw.\r\nIf(\r\n        _depCount > 0,\r\n        ClearCollect(\r\n            colDepositosData,\r\n            ForAll(\r\n                Table(_depArray) As R,\r\n                With(\r\n                    {F: R.Value},\r\n                    {\r\n                        ItemInternalId: Text(\r\n                            Column(\r\n                                F,\r\n                                \"ItemInternalId\"\r\n                            )\r\n                        ),\r\n                        NoDeposito: Text(\r\n                            Column(\r\n                                F,\r\n                                \"No. deposito\"\r\n                            )\r\n                        ),\r\n                        // use precise case & punctuation\r\nNoBolsa: Text(\r\n                            Column(\r\n                                F,\r\n                                \"No. bolsa\"\r\n                            )\r\n                        ),\r\n                        NoCuenta: Text(\r\n                            Column(\r\n                                F,\r\n                                \"No. Cuenta\"\r\n                            )\r\n                        ),\r\n                        Moneda: Text(\r\n                            Column(\r\n                                F,\r\n                                \"Moneda\"\r\n                            )\r\n                        ),\r\n                        ChequesBAC: Text(\r\n                            Column(\r\n                                F,\r\n                                \"Cheques Locales BAC\"\r\n                            )\r\n                        ),\r\n                        ChequesOtros: Text(\r\n                            Column(\r\n                                F,\r\n                                \"Cheques Locales Otros\"\r\n                            )\r\n                        ),\r\n                        Efectivo: Value(\r\n                            Coalesce(\r\n                                Text(\r\n                                    Column(\r\n                                        F,\r\n                                        \"Efectivo\"\r\n                                    )\r\n                                ),\r\n                                \"0\"\r\n                            )\r\n                        ),\r\n                        Total: Value(\r\n                            Coalesce(\r\n                                Text(\r\n                                    Column(\r\n                                        F,\r\n                                        \"Total\"\r\n                                    )\r\n                                ),\r\n                                \"0\"\r\n                            )\r\n                        ),\r\n                        Referencia: Text(\r\n                            Column(\r\n                                F,\r\n                                \"Referencia\"\r\n                            )\r\n                        )\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    );\r\n    // 6B) Cheques (typed).\r\nIf(\r\n        _cheCount > 0,\r\n        ClearCollect(\r\n            colChequesData,\r\n            ForAll(\r\n                Table(_cheArray) As R,\r\n                With(\r\n                    {F: R.Value},\r\n                    {\r\n                        ItemInternalId: Text(\r\n                            Column(\r\n                                F,\r\n                                \"ItemInternalId\"\r\n                            )\r\n                        ),\r\n                        NoDeposito: Text(\r\n                            Column(\r\n                                F,\r\n                                \"No. Deposito\"\r\n                            )\r\n                        ),\r\n                        NoCheque: Text(\r\n                            Column(\r\n                                F,\r\n                                \"No. Cheque\"\r\n                            )\r\n                        ),\r\n                        Tipo: Text(\r\n                            Column(\r\n                                F,\r\n                                \"Tipo\"\r\n                            )\r\n                        ),\r\n                        Moneda: Text(\r\n                            Column(\r\n                                F,\r\n                                \"Moneda\"\r\n                            )\r\n                        ),\r\n                        Monto: Value(\r\n                            Coalesce(\r\n                                Text(\r\n                                    Column(\r\n                                        F,\r\n                                        \"Monto\"\r\n                                    )\r\n                                ),\r\n                                \"0\"\r\n                            )\r\n                        )\r\n                    }\r\n                )\r\n            )\r\n        )\r\n    );\r\n    ClearCollect(\r\n        colTablasEnArchivo,\r\n        {\r\n            Nombre: \"Depositos\",\r\n            Columnas: colDepositosCols,\r\n            Datos: colDepositosData\r\n        },\r\n        {\r\n            Nombre: \"Cheques\",\r\n            Columnas: colChequesCols,\r\n            Datos: colChequesData\r\n        }\r\n    );\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                Text(CountRows(colTopKeys)),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-07\",\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                Concatenate(\r\n                    \"[\"\"\",\r\n                    Concat(\r\n                        colTopKeys,\r\n                        Value,\r\n                        \"\"\",\"\"\"\r\n                    ),\r\n                    \"\"\"]\"\r\n                ),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-08\",\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                CountRows(\r\n                    LookUp(\r\n                        colTablasEnArchivo,\r\n                        Nombre = \"Depositos\"\r\n                    ).Datos\r\n                ),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-09\",\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                CountRows(\r\n                    Filter(\r\n                        LookUp(\r\n                            colTablasEnArchivo,\r\n                            Nombre = \"Depositos\"\r\n                        ).Datos,\r\n                        IsBlank(NoBolsa)\r\n                    )\r\n                ),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-10\",\r\n    UpdateContext(\r\n        {\r\n            cantCamposInvalidos: CountRows(\r\n                Filter(\r\n                    LookUp(\r\n                        colTablasEnArchivo,\r\n                        Nombre = \"Depositos\"\r\n                    ).Datos,\r\n                    IsBlank(NoCuenta)\r\n                )\r\n            )\r\n        }\r\n    );\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                Text(cantCamposInvalidos),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-11\",\r\n    UpdateContext(\r\n        {\r\n            cantCamposInvalidos: CountRows(\r\n                Filter(\r\n                    LookUp(\r\n                        colTablasEnArchivo,\r\n                        Nombre = \"Depositos\"\r\n                    ).Datos,\r\n                    IsBlank(NoCuenta)\r\n                )\r\n            )\r\n        }\r\n    );\r\n    UpdateContext(\r\n        {\r\n            EVResult: EvaluateEV(\r\n                varValidationRule.'Validation Operation',\r\n                Text(cantCamposInvalidos),\r\n                varValidationRule.ValidationValue\r\n            )\r\n        }\r\n    );\r\n    /////////////////////////////////////////////////////////////////////////////////\r\n,\r\n    \"VR-12\",\r\n    UpdateContext(\r\n        {\r\n            cantCamposInvalidos: With(\r\n                {\r\n                    // Differences for monedas that appear in Cheques\r\n                    difCheques: Filter(\r\n                        AddColumns(\r\n                            RenameColumns(\r\n                                Distinct(\r\n                                    LookUp(\r\n                                        colTablasEnArchivo,\r\n                                        Nombre = \"Cheques\"\r\n                                    ).Datos,\r\n                                    Moneda\r\n                                ),\r\n                                Value,\r\n                                Moneda\r\n                            ) As C,\r\n                            TotalCheques,\r\n                            Sum(\r\n                                Filter(\r\n                                    LookUp(\r\n                                        colTablasEnArchivo,\r\n                                        Nombre = \"Cheques\"\r\n                                    ).Datos,\r\n                                    Moneda = C.Moneda\r\n                                ),\r\n                                Monto\r\n                            ),\r\n                            TotalDepositos,\r\n                            Sum(\r\n                                Filter(\r\n                                    LookUp(\r\n                                        colTablasEnArchivo,\r\n                                        Nombre = \"Depositos\"\r\n                                    ).Datos,\r\n                                    Moneda = C.Moneda\r\n                                ),\r\n                                ChequesBAC + ChequesOtros\r\n                            )\r\n                        ),\r\n                        Round(\r\n                            TotalCheques,\r\n                            2\r\n                        ) <> Round(\r\n                            TotalDepositos,\r\n                            2\r\n                        )\r\n                    ),\r\n                    // Differences for monedas that appear in Depositos (and maybe not in Cheques)\r\n                    difDepositos: Filter(\r\n                        AddColumns(\r\n                            RenameColumns(\r\n                                Distinct(\r\n                                    LookUp(\r\n                                        colTablasEnArchivo,\r\n                                        Nombre = \"Depositos\"\r\n                                    ).Datos,\r\n                                    Moneda\r\n                                ),\r\n                                Value,\r\n                                Moneda\r\n                            ) As D,\r\n                            TotalCheques,\r\n                            Sum(\r\n                                Filter(\r\n                                    LookUp(\r\n                                        colTablasEnArchivo,\r\n                                        Nombre = \"Cheques\"\r\n                                    ).Datos,\r\n                                    Moneda = D.Moneda\r\n                                ),\r\n                                Monto\r\n                            ),\r\n                            TotalDepositos,\r\n                            Sum(\r\n                                Filter(\r\n                                    LookUp(\r\n                                        colTablasEnArchivo,\r\n                                        Nombre = \"Depositos\"\r\n                                    ).Datos,\r\n                                    Moneda = D.Moneda\r\n                                ),\r\n                                ChequesBAC + ChequesOtros\r\n                            )\r\n                        ),\r\n                        Round(\r\n                            TotalCheques,\r\n                            2\r\n                        ) <> Round(\r\n                            TotalDepositos,\r\n               