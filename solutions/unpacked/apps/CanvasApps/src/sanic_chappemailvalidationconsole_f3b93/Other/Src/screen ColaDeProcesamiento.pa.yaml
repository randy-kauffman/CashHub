                                            ejec: Filter('CH-Tbl-ValidationResults', ValidationRun.'CH-Tbl-ValidationRuns' = r.'CH-Tbl-ValidationRuns')
                                        },
                                        "<style>*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;font-size:13.5px;color:rgb(28,21,23)}.t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgb(120,106,109);font-weight:700;margin:0 0 8px}.card{background:rgb(250,248,248);border:1px solid rgb(230,223,224);border-radius:0 6px 6px 0;padding:12px 15px;color:rgb(70,59,62)}.w{border-left:3px solid rgb(154,97,0)}.e{border-left:3px solid rgb(110,22,34)}.s{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}.n{flex:none;width:21px;height:21px;border-radius:50%;background:rgb(251,237,239);color:rgb(158,13,36);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}.nota{font-size:12.5px;color:rgb(120,106,109);margin-top:4px}.tal{font-size:11.5px;color:rgb(120,106,109);margin-bottom:11px}.tf{color:rgb(110,22,34)}.ts{color:rgb(138,128,130)}.to{color:rgb(20,107,58)}.fi{background:rgb(246,233,235);border:1px solid rgb(226,205,208);border-radius:7px;padding:11px 14px;margin-bottom:9px;display:flex;gap:12px}.fc{font-weight:700;color:rgb(110,22,34);font-size:12px;flex:none}.fm{font-size:13.5px}.fl{font-size:11.5px;color:rgb(120,106,109);margin-top:4px}.om{display:flex;flex-wrap:wrap;gap:4px 18px;opacity:.72}.om span{font-size:12.5px;color:rgb(138,128,130);font-style:italic}.hd{display:flex;flex-wrap:wrap;gap:7px 13px;align-items:baseline;border-bottom:1px solid rgb(230,223,224);padding-bottom:13px}.id{font-size:19px;font-weight:650}.fr{font-size:13.5px;color:rgb(70,59,62)}.chip{font-size:11px;font-weight:650;padding:3px 9px;border-radius:99px}.cw{background:rgb(253,243,227);color:rgb(154,97,0)}.ce{background:rgb(246,233,235);color:rgb(110,22,34)}.st{margin-left:auto;font-size:11.5px;color:rgb(120,106,109)}</style>" & "<p class='t'>Reglas que no pasaron</p>" &
                                        If(
                                            IsBlank(r),
                                            "<div class='card'>Este correo todavia no tiene ninguna corrida de validacion.</div>",
                                            "<div class='tal'><b class='tf'>" & CountRows(fal) &
                                            "</b> fallaron &nbsp;&nbsp;|&nbsp;&nbsp; <b class='ts'>" &
                                            (CountRows(Filter('CH-Tbl-ValidationRules', IsActive = true)) - CountRows(ejec)) &
                                            "</b> no se intentaron &nbsp;&nbsp;|&nbsp;&nbsp; <b class='to'>" &
                                            CountRows(Filter(ejec, ValidationResult = 'ValidationResult (CH-Tbl-ValidationResults)'.Pass)) &
