                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Status"
                                    FieldName: ="statecode"
                                    FieldType: ="l"
                                    Order: =5
                              - ErrorCode1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="ErrorCode"
                                    FieldName: ="sanic_errorcode"
                                    FieldType: ="s"
                                    Order: =6
                              - ErrorText1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="ErrorText"
                                    FieldName: ="sanic_errortext"
                                    FieldType: ="s"
                                    Order: =7
                              - ReplyDateTime1:
                                  Control: TableDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="ReplyDateTime"
                                    FieldName: ="sanic_replydatetime"
