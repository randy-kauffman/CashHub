                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingRight: =5
                            Children:
                              - SearchInput1_1:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    FillPortions: =1
                                    Height: =44
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnChange: |
                                      =UpdateContext(
                                          {
                                              varFiltrosQueryCorreo: Concatenate(
                                                  "$filter=",
                                                  If(
                                                      !IsBlank('dp FechaDesde'.SelectedDate),
                                                      "receivedDateTime ge " & Text(
                                                          'dp FechaDesde'.SelectedDate,
                                                          "yyyy-mm-dd"
                                                      ) & "T00:00:00Z"
                                                      //,"receivedDateTime ge 2000-01-01T00:00:00Z"
                                                  ),
                                                   If(Or(
                                                          And(
                                                              !IsBlank(Trim(SearchInput1_1.Value)),
                                                              !IsBlank('dp FechaDesde'.SelectedDate)
                                                          ),And(
                                                              !IsBlank('dp FechaHasta'.SelectedDate),
                                                              !IsBlank('dp FechaDesde'.SelectedDate)
                                                          )
                                                      )," AND "),
                                                  If(
                                                      !IsBlank('dp FechaHasta'.SelectedDate),
                                                      "receivedDateTime le " & Text(
                                                          'dp FechaHasta'.SelectedDate,
                                                          "yyyy-mm-dd"
                                                      ) & "T00:00:00Z"
                                                  ),
                                                  If(
                                                      Or(
                                                          And(
                                                              !IsBlank(Trim(SearchInput1_1.Value)),
                                                              !IsBlank('dp FechaHasta'.SelectedDate)
                                                          )
                                                      ),
                                                      " AND "
                                                  ), 
                                                  If(
                                                      !IsBlank(Trim(SearchInput1_1.Value)),
                                                      //"from/emailAddress/address eq '" & Trim(TextInputCanvas1.Value)&"'"
                                                      "contains(from/emailAddress/address,'" & Trim(SearchInput1_1.Value)&"')"
                                                  )
                                              )
                                          }
                                      );
                                    Placeholder: ="Remitente"
                        - Table1_1:
                            Control: Table@1.0.278
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              EnableRangeSelection: ='PowerAppsOneGrid.EnableRangeSelection'.Disable
                              EnableSorting: ='PowerAppsOneGrid.EnableSorting'.Enable
                              FillPortions: =1
                              Items: |-
                                =Search(
                                    Filter(
                                        'CH-Tbl-Received Emails',
                                        EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Pendiente || EmailReplyStatus = 'EmailReplyStatus (CH-Tbl-Received Emails)'.Pendiente
                                    ),
                                    SearchInput1_1.Value,
                                    Subject,
                                    SourceEmailAddress
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinWidth: =1
                              OnSelect: "=UpdateContext(\n    {\n        isItemSelected: true,\n        newMode: false,\n        CurrentItem: Table1_1.Selected\n        ,varSpinnerCompletoVisible: true\n        ,varLabelSpinnerCompleto: \"Cargando...\"\n    }\n);\nRefresh('CH-Tbl-ValidationResults');\nClearCollect(\n    colValidatedResults,\n    Filter(\n        'CH-Tbl-ValidationResults',\n        ValidationRun.'CH-Tbl-ValidationRuns' = gvarSelectedVRUN.'CH-Tbl-ValidationRuns'\n    )\n);\nReset(DropdownCanvas1);\nUpdateContext(\n    {\n        varAttachment: LookUp(\n            'CH-Tbl-EmailsAttachments',\n            Email.'CH-Tbl-Received Emails' = Table1_1.Selected.'CH-Tbl-Received Emails'\n        ).'CH-Tbl-EmailsAttachments'\n    }\n);\nIf(\n    !IsBlank(varAttachment),\n    Set(\n        JSONData,\n        'CH-Flow-GetJSONdatafromattachment'.Run(varAttachment).jsonstring\n    );\n    \n);\n//Clear(colTopKeys);\nClear(colDepositosCols);\nClear(colChequesCols);\nClear(colDepositosData);\nClear(colChequesData);\nClear(colTablasEnArchivo);\n// Replace JSONData.datos with your string variable/column\nIf(\n    !IsBlank(JSONData),\n    Set(\n        _rootDyn,\n        ParseJSON(JSONData)\n    );\n    Set(\n        _root,\n        Table(_rootDyn)\n    );\n    ClearCollect(\n        colTopKeys,\n        ForAll(\n            _root As R,\n            First(ColumnNames(R.Value)).Value\n        )\n    );\n    Set(\n        _okParse,\n        IfError(\n            Set(\n                _rootDyn,\n                ParseJSON(JSONData)\n            );\n            Set(\n                _root,\n                Table(_rootDyn)\n            );\n            // succeeds only if root is a JSON array\ntrue,\n            false\n        )\n    );\n    If(\n        !_okParse,\n        Notify(\n            \"Root is not valid JSON array.\",\n            NotificationType.Error\n        )\n    );\n    // Cheques array\nSet(\n        _cheArray,\n        Column(\n            LookUp(\n                _root,\n                !IsBlank(Value.Cheques)\n            ).Value,\n            \"Cheques\"\n        )\n    );\n    // Depositos array\nSet(\n        _depArray,\n        Column(\n            LookUp(\n                _root,\n                !IsBlank(Value.Depositos)\n            ).Value,\n            \"Depositos\"\n        )\n    );\n    JSON(_depArray);\n    // Quick counts (labels)\nSet(\n        _depCount,\n        CountRows(Table(_depArray))\n    );\n    Set(\n        _cheCount,\n        CountRows(Table(_cheArray))\n    );\n    // Depositos column names\nIf(\n        _depCount > 0,\n        ClearCollect(\n            colDepositosCols,\n            ColumnNames(First(Table(_depArray)).Value)\n        ),\n        ClearCollect(\n            colDepositosCols,\n            Table({Value: \"<no rows>\"})\n        )\n    );\n    // Cheques column names\nIf(\n        _cheCount > 0,\n        ClearCollect(\n            colChequesCols,\n            ColumnNames(First(Table(_cheArray)).Value)\n        ),\n        ClearCollect(\n            colChequesCols,\n            Table({Value: \"<no rows>\"})\n        )\n    );\n    // Depositos rows as readable JSON (first 3)\nClearCollect(\n        colDepositosRaw,\n        ForAll(\n            FirstN(\n                Table(_depArray),\n                3\n            ) As Row,\n            {\n                __json: JSON(\n                    Row.Value,\n                    JSONFormat.IndentFour\n                )\n            }\n        )\n    );\n    // Cheques rows as readable JSON (first 3)\nClearCollect(\n        colChequesRaw,\n        ForAll(\n            FirstN(\n                Table(_cheArray),\n                3\n            ) As Row,\n            {\n                __json: JSON(\n                    Row.Value,\n                    JSONFormat.IndentFour\n                )\n            }\n        )\n    );\n    // 6A) Depositos (typed).  Use the exact keys you saw in colDepositosCols / colDepositosRaw.\nIf(\n        _depCount > 0,\n        ClearCollect(\n            colDepositosData,\n            ForAll(\n                Table(_depArray) As R,\n                With(\n                    {F: R.Value},\n                    {\n                        ItemInternalId: Text(\n                            Column(\n                                F,\n                                \"ItemInternalId\"\n                            )\n                        ),\n                        NoDeposito: Text(\n                            Column(\n                                F,\n                                \"No. deposito\"\n                            )\n                        ),\n                        // use precise case & punctuation\n                        NoBolsa: Text(\n                            Column(\n                                F,\n                                \"No. bolsa\"\n                            )\n                        ),\n                        NoCuenta: Text(\n                            Column(\n                                F,\n                                \"No. Cuenta\"\n                            )\n                        ),\n                        Moneda: Text(\n                            Column(\n                                F,\n                                \"Moneda\"\n                            )\n                        ),\n                        ChequesBAC: Text(\n                            Column(\n                                F,\n                                \"Cheques Locales BAC\"\n                            )\n                        ),\n                        ChequesOtros: Text(\n                            Column(\n                                F,\n                                \"Cheques Locales Otros\"\n                            )\n                        ),\n                        Efectivo: Value(\n                            Coalesce(\n                                Text(\n                                    Column(\n                                        F,\n                                        \"Efectivo\"\n                                    )\n                                ),\n                                \"0\"\n                            )\n                        ),\n                        Total: Value(\n                            Coalesce(\n                                Text(\n                                    Column(\n                                        F,\n                                        \"Total\"\n                                    )\n                                ),\n                                \"0\"\n                            )\n                        ),\n                        Referencia: Text(\n                            Column(\n                                F,\n                                \"Referencia\"\n                            )\n                        )\n                    }\n                )\n            )\n        )\n    );\n    // 6B) Cheques (typed).\nIf(\n        _cheCount > 0,\n        ClearCollect(\n            colChequesData,\n            ForAll(\n                Table(_cheArray) As R,\n                With(\n                    {F: R.Value},\n                    {\n                        ItemInternalId: Text(\n                            Column(\n                                F,\n                                \"ItemInternalId\"\n                            )\n                        ),\n                        NoDeposito: Text(\n                            Column(\n                                F,\n                                \"No. Deposito\"\n                            )\n                        ),\n                        NoCheque: Text(\n                            Column(\n                                F,\n                                \"No. Cheque\"\n                            )\n                        ),\n                        Tipo: Text(\n                            Column(\n                                F,\n                                \"Tipo\"\n                            )\n                        ),\n                        Moneda: Text(\n                            Column(\n                                F,\n                                \"Moneda\"\n                            )\n                        ),\n                        Monto: Value(\n                            Coalesce(\n                                Text(\n                                    Column(\n                                        F,\n                                        \"Monto\"\n                                    )\n                                ),\n                                \"0\"\n                            )\n                        )\n                    }\n                )\n            )\n        )\n    );\n    ClearCollect(\n        colTablasEnArchivo,\n        {\n            Nombre: \"Depositos\",\n            Columnas: colDepositosCols,\n            Datos: colDepositosData\n        },\n        {\n            Nombre: \"Cheques\",\n            Columnas: colChequesCols,\n            Datos: colChequesData\n        }\n    );\n    \n);\nClearCollect(\n    colValidatedResults,\n    Filter(\n        'CH-Tbl-ValidationResults',\n        ValidationRun.'CH-Tbl-ValidationRuns' = Last(\n            Filter(\n                'CH-Tbl-ValidationRuns',\n                SourceRecordID = Text(Table1_1.Selected.'CH-Tbl-Received Emails')\n            )\n        ).'CH-Tbl-ValidationRuns'\n    )\n);\nSet(gvarSelectedEmail, Table1_1.Selected);\nSet(gvarSelectedVRUN, Last(Filter('CH-Tbl-ValidationRuns',SourceRecordID=Text(gvarSelectedEmail.'CH-Tbl-Received Emails'))));\n\nNewForm('form Declaration');\nNewForm('form DeclaredBags');\nNewForm('form DeclaredDeposits');\nNewForm('form DeclaredChecks');\n\nUpdateContext({varSpinnerCompletoVisible: false});"
                              ReflowBehavior: ='PowerAppsOneGrid.ReflowBehavior'.ListOnly
                            Children:
                              - Subject1:
