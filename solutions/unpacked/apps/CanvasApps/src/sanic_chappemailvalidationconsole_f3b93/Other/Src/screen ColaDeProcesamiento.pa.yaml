                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Created On"
                                          FieldName: ="createdon"
                                          FieldType: ="d"
                                          Order: =2
                              - ButtonCanvas3:
                                  Control: Button@0.0.45
                                  Properties:
                                    DisplayMode: |-
                                      =If(
                                          gvarSelectedEmail.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Pendiente,
                                          DisplayMode.Edit,
                                          DisplayMode.View
                                      )
                                    FillPortions: =1
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |
                                      =NewForm(Form2);
                                      SubmitForm(Form2);
                                    Text: ="Crear lote de validacion"
                                    Width: =160
                              - ButtonCanvas3_1:
                                  Control: Button@0.0.45
                                  Properties:
                                    DisplayMode: |-
                                      =If(
                                          gvarSelectedEmail.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Pendiente,
                                          DisplayMode.Edit,
                                          DisplayMode.View
                                      )
                                    FillPortions: =1
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =UpdateContext({varRunAllValidations: true, varValidationToggle:!varValidationToggle});
                                    Text: ="Correr todas las validaciones"
                                    Visible: =!IsBlank(gvarSelectedVRUN)
                                    Width: =160
                              - TextCanvas3:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Size: =18
                                    Text: =gvarSelectedVRUN.RunResult
                                    VerticalAlign: =VerticalAlign.Middle
                                    Weight: ='TextCanvas.Weight'.Bold
                              - ButtonCanvas4:
                                  Control: Button@0.0.45
                                  Properties:
                                    BorderRadius: =10
                                    DisplayMode: |-
                                      =If(
                                          gvarSelectedEmail.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Pendiente,
                                          If(
                                              gvarSelectedVRUN.RunResult = 'RunResult (CH-Tbl-ValidationRuns)'.Pass,
                                              DisplayMode.Edit,
                                              DisplayMode.View
                                          ),
                                          DisplayMode.View
                                      )
                                    FillPortions: =1
                                    Height: =40
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: "=If(\n    gvarSelectedVRUN.RunResult = 'RunResult (CH-Tbl-ValidationRuns)'.Fail,\n    UpdateContext(\n        {\n            varOutgoingEmail: Concatenate(\n                \"<html>\",\n                \"<body>\",\n                \"<p>El pre-registro de los archivos fue rechazado por estos motivos: </p>\",\n                \"<ul><li>\",\n                Concat(\n                    Filter(\n                        colValidatedResults,\n                        ValidationResult = 'ValidationResult (CH-Tbl-ValidationResults)'.Fail\n                    ),\n                    ValidationRule.ValidationFailMessage,\n                    \"</li><li>\"\n                ),\n                \"</li></ul>\",\n                \"<p>Numero de seguimiento: \",\n                gvarSelectedEmail.Name,\n                \"</p>\",\n                \"</body>\",\n                \"</html>\"\n            )\n        }\n    ),\n    UpdateContext(\n        {\n            varOutgoingEmail: Concatenate(\n                \"<html>\",\n                \"<body>\",\n                \"<p>El pre-registro de los archivos fue aceptado. </p>\",\n                \"<p>Numero de seguimiento: \",\n                gvarSelectedEmail.Name,\n                \"</p>\",\n                \"</body>\",\n                \"</html>\"\n            )\n        }\n    );\nNewForm('form Declaration');\nSubmitForm('form Declaration');\n\n\n)    "
                                    Text: ="Guardar resultados"
                                    Visible: =true //!IsBlank(DropdownCanvas1.Selected.RunResult)
                                    Width: =200
                              - ButtonCanvas4_1:
                                  Control: Button@0.0.45
                                  Properties:
                                    BorderRadius: =10
                                    DisplayMode: |-
                                      =If(
                                          gvarSelectedEmail.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Aceptado || gvarSelectedEmail.EmailReviewStatus = 'EmailReviewStatus (CH-Tbl-Received Emails)'.Denegado,
                                          DisplayMode.Edit,
                                          DisplayMode.Disabled
                                      )
                                    FillPortions: =1
                                    Height: =40
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: "=UpdateContext({varSpinnerCompletoVisible: true, varLabelSpinnerCompleto: \"Respondiendo correo...\"});\n\nUpdateContext({varOutgoingEmail:\"<!DOCTYPE html>\n                <html>\n                <head>\n                <meta charset='UTF-8'>\n                <title>Notificación</title>\n                <style>\n                body {\n                        font-family: Arial, sans-serif;\n                        margin: 0;\n                        padding: 0;\n                        background-color: #f8f8f8;\n                    }\n                    .container {\n                        max-width: 600px;\n                        margin: 20px auto;\n                        background-color: #ffffff;\n                        border: 1px solid #ddd;\n                        border-radius: 8px;\n                        overflow: hidden;\n                    }\n                    .header {\n                        background-color: #c62828; /* Primary Red */\n                        color: #ffffff;\n                        text-align: center;\n                        padding: 20px;\n                        font-size: 22px;\n                        font-weight: bold;\n                    }\n                    .content {\n                        padding: 20px;\n                        color: #333333;\n                        font-size: 16px;\n                        line-height: 1.5;\n                    }\n                    .content ul {\n                        margin: 10px 0;\n                        padding-left: 20px;\n                    }\n                    .tracking {\n                        margin-top: 15px;\n                        font-size: 12px;\n                    }\n                    .footer {\n                        background-color: #f1f1f1;\n                        text-align: center;\n                        padding: 10px;\n                        font-size: 12px;\n                        color: #777777;\n                    }\n                </style>\n                </head>\n                \"});\n\nIf(\n    gvarSelectedVRUN.RunResult = 'RunResult (CH-Tbl-ValidationRuns)'.Fail,\n    UpdateContext(\n        {\n            varOutgoingEmail: Concatenate(varOutgoingEmail,\n                \"<body>\",\n                \"<div class='container'>\n                        <div class='header'>\n                            Notificación de Pre-registro\n                        </div>\n                        <div class='content'>\n                        <p>El pre-registro de los archivos fue rechazado por estos motivos:</p>\n                        <ul><li>\",\n                \n                \n                Concat(\n                    ForAll(Filter(\n                        colValidatedResults,\n                        ValidationResult = 'ValidationResult (CH-Tbl-ValidationResults)'.Fail\n                    ) As VR, LookUp(colValidationRules As CVR, CVR.Name = VR.ValidationRule.Name)) ,\n                    ValidationFailMessage,\n                    \"</li><li>\"\n                ),\n                \"</li></ul>\",\n                \"<p class='tracking'>Número de seguimiento: <strong>\"&gvarSelectedEmail.Name&\"</strong></p>\n                        </div>\n                        <div class='footer'>\n                            Este es un mensaje automático. Por favor, no responda a este correo.\n                        </div>\n                    </div>\n                </body>\n                </html>\n                \"\n            )\n        }\n    );\n    ,\n    UpdateContext(\n        {\n            varOutgoingEmail: Concatenate(\n                varOutgoingEmail,\n                \"<body>\",\n                \"<div class='container'>\n                        <div class='header'>\n                            Notificación de Pre-registro\n                        </div>\n                        <div class='content'>\",\n                \"<p>El pre-registro de los archivos fue aceptado. </p>\",\n                \"<p class='tracking'>Número de seguimiento: <strong>\"&gvarSelectedEmail.Name&\"</strong></p>\n                        </div>\n                        <div class='footer'>\n                            Este es un mensaje automático. Por favor, no responda a este correo.\n                        </div>\n                    </div>\n                </body>\n                </html>\n                \"\n            )\n        }\n    );\n    \n);\n\n\nIf(\n    'PowerAppV2->Replytoemail(V3),RespondtoaPowerApporflow'.Run(\n        varOutgoingEmail,\n        gvarSelectedEmail.ReceivedEmailOutlookUniqueID,\n        varBuzonCorreo\n    ).status = \"Ok\",\n    UpdateContext(\n        {\n            varReply: Office365Outlook.HttpRequest(\n                \"https://graph.microsoft.com/v1.0/users/\" & varBuzonCorreo & \"/mailFolders('SentItems')/messages?$filter=singleValueExtendedProperties/Any(ep: ep/id eq 'String 0x1042' and ep/value eq '\" & gvarSelectedEmail.ReplyEmailInternetMessageId & \"')\" & \"&$select=subject,id,internetMessageId,receivedDateTime,isRead,from,hasAttachments\",\n                \"GET\",\n                \"\"\n            )\n        }\n    );\n    UpdateContext(\n        {\n            varColReplies: ForAll(\n                Table(varReply.value) As email,\n                {\n                    Asunto: Text(email.Value.subject),\n                    FechaRecibido: DateTimeValue(email.Value.receivedDateTime),\n                    Leido: Boolean(email.Value.isRead),\n                    Remitente: Text(email.Value.from.emailAddress.address),\n                    MessageID: Text(email.Value.id),\n                    TieneAdjuntos: Boolean(email.Value.hasAttachments),\n                    InternetMessageID: Text(email.Value.internetMessageId)\n                }\n            )\n        }\n    );\n    UpdateContext(\n        {\n            varLastReply: First(\n                SortByColumns(\n                    varColReplies,\n                    \"FechaRecibido\",\n                    SortOrder.Descending\n                )\n            )\n        }\n    );\n    \n    Patch(\n        'CH-Tbl-Received Emails',\n        gvarSelectedEmail,\n        {\n            EmailReplyStatus: 'EmailReplyStatus (CH-Tbl-Received Emails)'.Respondido,\n            ReplyDateTime: varLastReply.FechaRecibido,\n            ReplyEmailOutlookUniqueID: varLastReply.MessageID,\n            ReplyEmailInternetMessageId: varLastReply.InternetMessageID\n        }\n    );\n    Refresh('CH-Tbl-Received Emails');\n    Set(gvarSelectedEmail,Blank());\n    Set(gvarSelectedVRUN,Blank());\n);\n\n\nUpdateContext({varSpinnerCompletoVisible: false, varLabelSpinnerCompleto: \"Respondiendo correo...\"});\n"
