                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(120, 106, 109, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =72
                  Size: =11
                  Text: |-
                    ="La respuesta a " & galBandeja.Selected.Name & " deja de estar pendiente porque alguien ya le escribio al cliente por fuera del sistema. A partir de aca, lo que se le dijo NO queda registrado en CashHub: por eso el motivo es obligatorio."
                  Width: =520
