            - form DeclaredBags:
                Control: Form@2.4.4
                Layout: Vertical
                Properties:
                  DataSource: ='CH-Tbl-DeclaredBags'
                  Height: =200
                  OnFailure: |-
                    =ForAll(colSubmitedCheck As Check, Remove('CH-Tbl-DeclaredChecks', Check));
                    ForAll(colSubmitedDeposits As Deposit, Remove('CH-Tbl-DeclaredDeposits', Deposit));
                    ForAll(colSubmitedBags As Bag, Remove('CH-Tbl-DeclaredBags', Bag));
                    Remove('CH-Tbl-Declarations', varNewDeclaration);
                    UpdateContext({varSpinnerCompletoVisible: false, varLabelSpinnerCompleto: "Guardando..."});
                  OnSuccess: |+
                    =UpdateContext({varLastSubmitedBag: 'form DeclaredBags'.LastSubmit});
                    UpdateContext({varProgressBarActual: varProgressBarActual+1});

                    Collect(colSubmitedBags, varLastSubmitedBag);

                    RemoveIf(colEmailDeclaredBags,Bolsa = varLastSubmitedBag.BagNumber);

                    ClearCollect(colBagRelatedDeposits, LookUp(colEmailDeclaration,Bag = varLastSubmitedBag.BagNumber).Deposits);

                    UpdateContext({varDeposit: First(colBagRelatedDeposits)});

                    NewForm('form DeclaredDeposits');
