        btnChipTulasCap As button:
            BorderColor: =ThemeWarnLine
            BorderThickness: |-
                =// Sobre una fila ámbar el chip ámbar se fundiría con el fondo: el borde lo
                // recorta para que el operador vea QUÉ planillas comparten el problema.
                If(
                    CountRows(Filter(colTulas, PlanillaLocalId = ThisItem.LocalId)) = 0 ||
                    !IsEmpty(Filter(colProblemas, LocalId = ThisItem.LocalId)) ||
                    !IsEmpty(Filter(colFallidas,  LocalId = ThisItem.LocalId)),
                    1,
                    0
                )
            Color: |-
                =If(
                    CountRows(Filter(colTulas, PlanillaLocalId = ThisItem.LocalId)) = 0 ||
                    !IsEmpty(Filter(colProblemas, LocalId = ThisItem.LocalId)) ||
                    !IsEmpty(Filter(colFallidas,  LocalId = ThisItem.LocalId)),
                    ThemeWarn,
                    ThemeInfo
                )
            Fill: |-
                =If(
                    CountRows(Filter(colTulas, PlanillaLocalId = ThisItem.LocalId)) = 0 ||
                    !IsEmpty(Filter(colProblemas, LocalId = ThisItem.LocalId)) ||
                    !IsEmpty(Filter(colFallidas,  LocalId = ThisItem.LocalId)),
                    ThemeWarnSoft,
                    ThemeInfoSoft
                )
            FontWeight: =FontWeight.Semibold
            Height: =24
            HoverFill: |-
                =If(
                    CountRows(Filter(colTulas, PlanillaLocalId = ThisItem.LocalId)) = 0 ||
                    !IsEmpty(Filter(colProblemas, LocalId = ThisItem.LocalId)) ||
                    !IsEmpty(Filter(colFallidas,  LocalId = ThisItem.LocalId)),
                    ThemeWarnSoft,
                    ThemeInfoSoft2
                )
            OnSelect: |-
                =// VOLCADO: los inputs de la grilla NO escriben en colPlanillas al tipear (el
                // re-render mataba el foco). Este bloque lee los controles vía AllItems y
                // sincroniza la colección UNA vez, al inicio de cada acción que la consume.
                ForAll(
                    galPlanillasCap.AllItems As Fila,
                    Patch(
                        colPlanillas,
                        LookUp(colPlanillas, LocalId = Fila.LocalId),
                        {
                            Empresa:     Fila.cmbEmpresaCap.Selected,
                            Planilla:    Trim(Fila.inpPlanillaCap.Text),
                            ChequeNIO:   Coalesce(Value(Fila.inpChequeNIOCap.Text), 0),
                            ChequeUSD:   Coalesce(Value(Fila.inpChequeUSDCap.Text), 0),
                            EfectivoNIO: Coalesce(Value(Fila.inpEfectivoNIOCap.Text), 0),
                            EfectivoUSD: Coalesce(Value(Fila.inpEfectivoUSDCap.Text), 0)
                        }
                    )
                );
                // btnChipTulasCap.OnSelect — abre el panel de tulas de ESTA fila (§7.2)
                // El subtítulo del panel dice la EMPRESA (Client.Name), no la sucursal: es lo que
                // muestra el mockup. El dot-walk se paga UNA vez por clic, no por render.
                // Título y subtítulo se leen de los controles HERMANOS del template, no de
                // ThisItem: el volcado de arriba todavía no se refleja en ThisItem dentro de
                // la misma fórmula.
                UpdateContext({
                    ctxPlanillaTulasCap:    ThisItem.LocalId,
                    ctxPlanillaTulasTxtCap: Trim(inpPlanillaCap.Text),
                    ctxPlanillaTulasEmpCap: Coalesce(cmbEmpresaCap.Selected.Client.Name, "Empresa sin seleccionar")
                });
                ClearCollect(colTulasEdit, Filter(colTulas, PlanillaLocalId = ThisItem.LocalId));
                Reset(galTulasEditCap);
                UpdateContext({ ctxDlgTulasCap: true });UpdateContext({ctxScanDupCap: ""}); SetFocus(inpTulaScanCap)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedFill: |-
                =If(
                    CountRows(Filter(colTulas, PlanillaLocalId = ThisItem.LocalId)) = 0 ||
                    !IsEmpty(Filter(colProblemas, LocalId = ThisItem.LocalId)) ||
                    !IsEmpty(Filter(colFallidas,  LocalId = ThisItem.LocalId)),
                    ThemeWarnSoft,
                    ThemeInfoSoft
                )
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Size: =8.25
            Text: =Text(CountRows(Filter(colTulas, PlanillaLocalId = ThisItem.LocalId)))
            Width: =44
            X: =950
            Y: =8
            ZIndex: =9

