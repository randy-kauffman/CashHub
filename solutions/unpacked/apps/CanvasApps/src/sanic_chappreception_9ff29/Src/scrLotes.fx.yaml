scrLotes As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =ThemeAccent
    OnVisible: |-
        =UpdateContext(
            {
                ctxDlgBovedaLot:         false,
                ctxDlgAgregarLot:        false,
                ctxDlgEliminarLot:       false,
                ctxDlgRemapearLot:       false,
                ctxDlgEditarTulaLot:     false,
                ctxDlgEditarPlanillaLot: false,
                ctxTulaSelLot:           Defaults('CH-Tbl-Bags'),
                ctxDesdeLot:             Today(),
                ctxHastaLot:             Today()
            }
        );
        Reset(tabVistaLot);
        Reset(inpBuscarLot);
        Reset(drpEstadoLot);
        Reset(dtpDesdeLot);
        Reset(dtpHastaLot);
        Reset(galLotesLot);
        Reset(galPlanillasLot);
        Clear(colTulasBovedaLot)

    galLotesLot As gallery.galleryVertical:
        '#CopilotOverlayLabel': ="Filtered"
        Height: =606
        Items: |-
            =If(
                drpEstadoLot.Selected.Value = "Todos",
                SortByColumns(
                    Filter('CH-Tbl-ReceptionBatches',
                        (StartsWith(Name, inpBuscarLot.Text) || StartsWith(Transportadora, inpBuscarLot.Text) || inpBuscarLot.Text = Blank())
                        && 'Created On' >= Coalesce(ctxDesdeLot,Today())
                        && 'Created On' < DateAdd(DateAdd(Coalesce(ctxHastaLot,Today()),1,TimeUnit.Days),-1,TimeUnit.Milliseconds)
                    ),
                    "createdon", SortOrder.Descending
                ),
                SortByColumns(
                    Filter('CH-Tbl-ReceptionBatches',
                        ReceptionStatus = Switch(
                            drpEstadoLot.Selected.Value,
                            "En progreso", 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.'En progreso',
                            "Recibido",    'ReceptionStatus (CH-Tbl-ReceptionBatches)'.Recibido,
                            'ReceptionStatus (CH-Tbl-ReceptionBatches)'.'En boveda'
                        )
                        && (StartsWith(Name, inpBuscarLot.Text) || StartsWith(Transportadora, inpBuscarLot.Text) || inpBuscarLot.Text = Blank())
                        && 'Created On' >= Coalesce(ctxDesdeLot,Today())
                        && 'Created On' < DateAdd(DateAdd(Coalesce(ctxHastaLot,Today()),1,TimeUnit.Days),-1,TimeUnit.Milliseconds)
                    ),
                    "createdon", SortOrder.Descending
                )
            )
        Layout: =Layout.Vertical
        OnSelect: |-
            =UpdateContext({ctxTulaSelLot: Defaults('CH-Tbl-Bags')})
        TemplatePadding: =0
        TemplateSize: =46
        Visible: =tabVistaLot.Selected.Value = "Lotes"
