                Filter(
                    'CH-Tbl-Bags',
                    ReceptionBatchId.'CH-Tbl-ReceptionBatch' = galLotesLot.Selected.'CH-Tbl-ReceptionBatch'
                    && BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa'
