                  DisabledColor: =ThemeInk3
                  DisabledFill: =ThemeLineSoft
                  Fill: =Color.Transparent
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Normal
                  Height: =46
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =Self.Color
                  HoverFill: =ThemeSurface2
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =ThemeAccentSoft
                  Size: =9
                  Text: =""
                  Width: =galLotesLot.Width
            - shpSelLotesLot:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =ThemeInk
                  DisabledBorderColor: =Color.Transparent
                  DisabledColor: =ThemeInk3
                  DisabledFill: =ThemeLineSoft
                  Fill: =If(ThisItem.IsSelected, ThemeAccentSoft, Color.Transparent)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Normal
                  Height: =46
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =Self.Color
                  HoverFill: =If(ThisItem.IsSelected, ThemeAccentSoft, Color.Transparent)
                  OnSelect: =Select(Parent)
