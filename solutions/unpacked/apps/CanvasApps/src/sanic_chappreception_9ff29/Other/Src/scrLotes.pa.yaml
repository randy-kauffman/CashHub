            DisabledBorderColor: =Color.Transparent
            DisabledColor: =ThemeInk3
            DisabledFill: =ThemeLineSoft
            DisplayMode: |-
              =If(
                  galLotesLot.Selected.ReceptionStatus = 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.'En progreso',
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
