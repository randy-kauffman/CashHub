                              If(!IsBlank(num),
                                  If(
                                      CountRows(Filter(colTulasEdit As X, Trim(X.Numero) = num)) > 0,
                                      UpdateContext({ctxScanDupCap: num & " ya está en esta planilla"}),
                                      !IsBlank(LookUp(colTulas, Trim(Numero) = num && PlanillaLocalId <> ctxPlanillaTulasCap).LocalId),
