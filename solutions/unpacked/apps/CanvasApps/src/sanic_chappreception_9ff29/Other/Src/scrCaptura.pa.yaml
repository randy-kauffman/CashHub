      - btnGuardarCap:
          Control: Classic/Button@2.2.0
          Group: BotonesCap
          Properties:
            BorderColor: =ThemeAccent
            BorderThickness: =1
            Color: =ThemeAccent
            DisabledBorderColor: =Color.Transparent
            DisabledColor: =ThemeInk3
            DisabledFill: =ThemeLineSoft
            DisplayMode: |-
              =If(
                  !IsBlank(gvarLoteActivo),
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =ThemeSurface
            Font: =Font.'Open Sans'
            Height: =32
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =ThemeAccentSoft
            OnSelect: |-
              =// VOLCADO: los inputs de la grilla NO escriben en colPlanillas al tipear (el
              // re-render mataba el foco). Este bloque lee los controles vía AllItems y
              // sincroniza la colección UNA vez, al inicio de cada acción que la consume.
              ForAll(
                  galPlanillasCap.AllItems As Fila,
                  Patch(
                      colPlanillas,
                      LookUp(colPlanillas, LocalId = Fila.LocalId),
                      {
                          Empresa:     Fila.cmbEmpresaCap.Selected,
                          Planilla:    Trim(Fila.inpPlanillaCap.Text),
                          ChequeNIO:   Coalesce(Value(Fila.inpChequeNIOCap.Text), 0),
                          ChequeUSD:   Coalesce(Value(Fila.inpChequeUSDCap.Text), 0),
                          EfectivoNIO: Coalesce(Value(Fila.inpEfectivoNIOCap.Text), 0),
                          EfectivoUSD: Coalesce(Value(Fila.inpEfectivoUSDCap.Text), 0)
                      }
                  )
              );
              // ===== 0. Guardas =====
              If(
                  CountRows(colPlanillas) = 0,
                  Notify("No hay planillas que guardar.", NotificationType.Error),

                  // ===== 1. Validación (única fuente: fxProblemas) =====
                  ClearCollect(colProblemas, fxProblemas);
                  If(
                      !IsEmpty(colProblemas),
                      Notify("Corregí los problemas de validación antes de guardar.", NotificationType.Error),

                      // ===== 2. DELTA: qué hay que mandarle REALMENTE a Dataverse =====
                      //    Una planilla entra si es NUEVA (sin GUID) o si algún campo difiere del
                      //    snapshot colPlanillasDV. Sin esto, cada Guardar re-patchea el lote entero.
                      ClearCollect(colCambiosPlanCap,
                          Filter(colPlanillas As P,
                              IsBlank(P.GUID) ||
                              With({dv: LookUp(colPlanillasDV, 'CH-Tbl-Receptions' = P.GUID)},
                                  Trim(P.Planilla) <> dv.ReceiptID ||
                                  Coalesce(P.ChequeNIO, 0)   <> Coalesce(dv.NIOCheck, 0) ||
                                  Coalesce(P.ChequeUSD, 0)   <> Coalesce(dv.USDCheck, 0) ||
                                  Coalesce(P.EfectivoNIO, 0) <> Coalesce(dv.NIOCash, 0) ||
                                  Coalesce(P.EfectivoUSD, 0) <> Coalesce(dv.USDCash, 0) ||
                                  P.Empresa.'CH-Tbl-ClientBranch' <> dv.BranchName.'CH-Tbl-ClientBranch'
                              )
                          )
                      );
                      ClearCollect(colTulasNuevasCap, Filter(colTulas, IsBlank(GUID)));

                      // ===== 3. Arranque =====
                      //    NI UN Patch a Dataverse en este OnSelect: canvas NO repinta a mitad de
                      //    fórmula, así que el diálogo se abre ACÁ y el guardado corre un frame
                      //    después, en tmrGuardarCap.OnTimerEnd (Start = ctxGuardandoCap).
                      If(
                          IsEmpty(colCambiosPlanCap) && IsEmpty(colTulasNuevasCap) && IsEmpty(colTulasBorradasCap),

                          // ---------- SIN CAMBIOS: no se abre nada y no se patchea nada ----------
                          Set(gvarCambiosSinGuardar, false);
                          If(
                              // El CIERRE tiene que CONTINUAR igual: el lote pasa a Recibido aunque
                              // no hubiera deltas. Se dispara el timer con las tres colecciones
                              // vacías — cada fase del OnTimerEnd está guardada por su propio
                              // IsEmpty, así que no toca Dataverse y cae directo en la continuación
                              // del cierre. Sin diálogo: un modal de 50 ms es un parpadeo.
                              ctxGuardarDesdeCierreCap,
                              Clear(colFallidas); Clear(colEstadoGuardadoCap);
                              UpdateContext({ ctxGuardandoCap: true }),

                              // "Guardar y salir" sin nada que guardar: se navega en el acto.
                              If(
                                  ctxSalirTrasGuardarCap,
                                  UpdateContext({ ctxDlgResultadoCap: false, ctxSalirTrasGuardarCap: false });
                                  Navigate(scrLotes),
                                  Notify("No hay cambios que guardar.", NotificationType.Information)
                              )
                          ),

                          // ---------- CON CAMBIOS: se abre el diálogo y arranca el timer ----------
                          Clear(colFallidas);
                          Clear(colEstadoGuardadoCap);
                          UpdateContext({ ctxDlgResultadoCap: true, ctxGuardandoCap: true })
                      )
                  )
              );

              // Las señales de origen se consumen SOLO si el guardado NO quedó en vuelo: si el
              // timer va a correr, las necesita vivas para su continuación (cierre / salir) y las
              // apaga él al final. Dentro de una misma fórmula las variables de contexto se leen
              // ya actualizadas, así que este If ve el ctxGuardandoCap recién seteado.
              If(
                  !ctxGuardandoCap,
                  UpdateContext({ ctxGuardarDesdeCierreCap: false, ctxSalirTrasGuardarCap: false })
              )
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
