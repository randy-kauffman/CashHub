Screens:
  scrCaptura:
    Properties:
      Fill: =ThemeBg
      OnVisible: |-
        =// ============================================================================
        // BLOQUE 1 — CATÁLOGO. La ÚNICA consulta fija de esta pantalla.
        //   Transportadoras es una tabla estructuralmente acotada: colección legítima.
        //   Sucursales NO tiene colección: el combo de empresa busca server-side
        //   (delegable a cualquier escala) — decisión L-23, mata el truncamiento a 2000.
        // ============================================================================
        If(
            IsEmpty(colTransportadoras),
            ClearCollect(
                colTransportadoras,
                Filter('CH-Tbl-TransportCompanies', 'CH-Tbl-TransportCompanies (Views)'.'CH-Tbl-TransportCompany Lookup View')
            )
        );

        // ============================================================================
        // BLOQUE 2 — RED DE SEGURIDAD DEL CONTRATO DE ENTRADA.
        //   Si hay lote activo pero las colecciones llegaron vacías, se re-hidrata
        //   con 2 consultas delegables. El If va POR FUERA del ClearCollect.
        // ============================================================================
        If(
            !IsBlank(gvarLoteActivo) && IsEmpty(colPlanillas) && IsEmpty(colPlanillasDV),
            ClearCollect(colPlanillasDV, Filter('CH-Tbl-Receptions', ReceptionBatch.'CH-Tbl-ReceptionBatch' = gvarLoteActivo.'CH-Tbl-ReceptionBatch'));
            ClearCollect(colTulasDV,     Filter('CH-Tbl-Bags',       ReceptionBatchId.'CH-Tbl-ReceptionBatch' = gvarLoteActivo.'CH-Tbl-ReceptionBatch'))
        );

        // ============================================================================
        // RECETA 01 §7.10 — proyección DV -> colecciones de EDICIÓN.
        //   LocalId de fila persistida = Text(GUID real); fila nueva = Text(GUID()).
        // ============================================================================
        If(
            !IsBlank(gvarLoteActivo) && IsEmpty(colPlanillas) && !IsEmpty(colPlanillasDV),
            ClearCollect(
                colPlanillas,
                ForAll(
                    colPlanillasDV As D,
                    {
                        LocalId:     Text(D.'CH-Tbl-Receptions'),
                        GUID:        D.'CH-Tbl-Receptions',
                        // Registro FRESCO del datasource (LookUp por PK, delegable): garantiza
                        // .Client navegable para el Patch de 7.5 — nunca RemitentClient en blanco.
                        Empresa:     LookUp('CH-Tbl-ClientBranches',
                                            'CH-Tbl-ClientBranch' = D.BranchName.'CH-Tbl-ClientBranch'),
                        Planilla:    D.ReceiptID,
                        ChequeNIO:   D.NIOCheck,
                        ChequeUSD:   D.USDCheck,
                        EfectivoNIO: D.NIOCash,
                        EfectivoUSD: D.USDCash
                    }
                )
            );
            ClearCollect(
                colTulas,
                ForAll(
                    colTulasDV As B,
                    {
                        LocalId:         Text(B.'CH-Tbl-Bags'),
                        PlanillaLocalId: Text(B.ReceptionID.'CH-Tbl-Receptions'),
                        Numero:          B.BagID,
                        GUID:            B.'CH-Tbl-Bags'
                    }
                )
            )
        );

        // ============================================================================
        // BLOQUE 3 — ESQUEMA de las colecciones propias de la pantalla.
        //   FirstN(col, 0) devuelve tabla VACÍA con el esquema de col, sin warning.
        // ============================================================================
        ClearCollect(colTulasBorradasCap, FirstN(colTulas, 0));
        ClearCollect(colTulasNuevoCap,    FirstN(colTulas, 0));
        // DELTA de guardado (§8.2): qué se manda a Dataverse en el próximo Guardar.
        //   colCambiosPlanCap = planillas NUEVAS o MODIFICADAS contra el snapshot colPlanillasDV.
        //   colTulasNuevasCap = tulas todavía sin GUID. Las bajas viven en colTulasBorradasCap.
        ClearCollect(colCambiosPlanCap,   FirstN(colPlanillas, 0));
        ClearCollect(colTulasNuevasCap,   FirstN(colTulas, 0));
        Collect(colErrBorrarCap,       { Mensaje: "" });                          Clear(colErrBorrarCap);
        Collect(colEstadoGuardadoCap,  { Planilla: "", Ok: false, Mensaje: "" }); Clear(colEstadoGuardadoCap);
        Clear(colTulasEdit);

        // ============================================================================
        // BLOQUE 4 — ESTADO DE UI. Todos los diálogos CERRADOS al entrar.
        // ============================================================================
        UpdateContext({
            ctxDlgTulasCap:        false,
            ctxDlgBorrarFilaCap:   false,
            ctxDlgCerrarCap:       false,
            ctxDlgSalirCap:        false,
            ctxDlgResultadoCap:    false,
            ctxGuardarDesdeCierreCap: false,
            // ctxGuardandoCap: guardado EN VUELO. Arranca tmrGuardarCap (Start) y pinta el
            //   diálogo en modo "Guardando…". Es la variable que hace posible el defer de un
            //   frame: canvas repinta ENTRE el OnSelect y el OnTimerEnd, no a mitad de fórmula.
            ctxGuardandoCap:       false,
            // ctxSalirTrasGuardarCap: "Guardar y salir". La navegación NO puede vivir en el
            //   OnSelect del botón (si navegás, el timer de esta pantalla nunca dispara):
            //   se difiere al final del OnTimerEnd.
            ctxSalirTrasGuardarCap: false,
            ctxPlanillaTulasCap:    "",
            ctxPlanillaTulasTxtCap: "",
            ctxPlanillaTulasEmpCap: "",
            ctxFilaBorrarCap:       "",
            ctxFilaBorrarTxtCap:    "",
            ctxFilaBorrarTulasCap:  0,
            ctxScanDupCap:          ""
        });
        // GUID TIPADO en blanco: Blank() pelado deja la variable sin tipo.
        UpdateContext({ ctxFilaBorrarGuidCap: Defaults('CH-Tbl-Receptions').'CH-Tbl-Receptions' });

        Clear(colProblemas);
        Clear(colFallidas);
        Reset(galPlanillasCap);
        Reset(cmbTransportadoraCap)
