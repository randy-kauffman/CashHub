      - tmrGuardarCap:
          Control: Timer@2.1.0
          Properties:
            Duration: =50
            OnTimerEnd: |-
              =// ===========================================================================
              // GUARDADO REAL — corre UN FRAME DESPUÉS del click (Start = ctxGuardandoCap).
              //   btnGuardarCap.OnSelect solo vuelca, valida, calcula el delta y abre el
              //   diálogo; los Patches viven ACÁ. Canvas no repinta a mitad de fórmula: este
              //   salto de frame es lo ÚNICO que hace visible el "Guardando…" (§8.3 / L-10).
              //   Se manda SOLO el delta: colCambiosPlanCap, colTulasNuevasCap y las bajas de
              //   colTulasBorradasCap. Cada fase está guardada por su IsEmpty, así que un
              //   disparo con delta CERO (cierre sin cambios) no toca Dataverse y cae derecho
              //   en la continuación del cierre.
              // ===========================================================================

              // ---------- FASE A: PLANILLAS del delta, un solo Patch con tabla ----------
              If(
                  !IsEmpty(colCambiosPlanCap),
                  IfError(
                      Patch(
                          'CH-Tbl-Receptions',
                          // registros BASE, alineados fila a fila con el 3er argumento.
                          // Defaults() crea; el LookUp es sobre colección LOCAL (cero consultas).
                          ForAll(
                              colCambiosPlanCap As P,
                              If(
                                  IsBlank(P.GUID),
                                  Defaults('CH-Tbl-Receptions'),
                                  LookUp(colPlanillasDV, 'CH-Tbl-Receptions' = P.GUID)
                              )
                          ),
                          // registros de CAMBIO
                          ForAll(
                              colCambiosPlanCap As P,
                              {
                                  ReceiptID:      Trim(P.Planilla),
                                  Name:           Trim(P.Planilla),
                                  ReceptionBatch: gvarLoteActivo,
                                  RemitentClient: P.Empresa.Client,
                                  BranchName:     P.Empresa,
                                  RemitentName:   P.Empresa.Name,
                                  NIOCheck:       P.ChequeNIO,
                                  USDCheck:       P.ChequeUSD,
                                  NIOCash:        P.EfectivoNIO,
                                  USDCash:        P.EfectivoUSD
                              }
                          )
                      ),

                      // ---------- FASE B: algo falló. Fila por fila para saber CUÁL ----------
                      ForAll(
                          colCambiosPlanCap As P,
                          IfError(
                              Patch(
                                  'CH-Tbl-Receptions',
                                  If(
                                      IsBlank(P.GUID),
                                      Defaults('CH-Tbl-Receptions'),
                                      LookUp(colPlanillasDV, 'CH-Tbl-Receptions' = P.GUID)
                                  ),
                                  {
                                      ReceiptID:      Trim(P.Planilla),
                                      Name:           Trim(P.Planilla),
                                      ReceptionBatch: gvarLoteActivo,
                                      RemitentClient: P.Empresa.Client,
                                      BranchName:     P.Empresa,
                                      RemitentName:   P.Empresa.Name,
                                      NIOCheck:       P.ChequeNIO,
                                      USDCheck:       P.ChequeUSD,
                                      NIOCash:        P.EfectivoNIO,
                                      USDCash:        P.EfectivoUSD
                                  }
                              ),
                              Collect(colFallidas, { LocalId: P.LocalId, Planilla: P.Planilla, Mensaje: FirstError.Message }); Blank()
                          )
                      )
                  );

                  // ===== Re-hidratación (Q3) y RE-KEYADO de GUIDs =====
                  //    El N° de planilla es único dentro del lote (reglas 5 y 6 de fxProblemas):
                  //    sirve de clave natural. Sin este paso una fila recién creada se queda sin
                  //    GUID, el delta la ve NUEVA para siempre y el próximo guardado la DUPLICA.
                  //    El snapshot a refrescar acá es colPlanillasDV (el de tulas tiene su propio
                  //    paso más abajo) — y encima es el que alimenta la comparación del delta.
                  ClearCollect(
                      colPlanillasDV,
                      Filter('CH-Tbl-Receptions', ReceptionBatch.'CH-Tbl-ReceptionBatch' = gvarLoteActivo.'CH-Tbl-ReceptionBatch')
                  );
                  ForAll(
                      colPlanillasDV As D,
                      Patch(
                          colPlanillas,
                          LookUp(colPlanillas, Trim(Planilla) = Trim(D.ReceiptID)),
                          { GUID: D.'CH-Tbl-Receptions' }
                      )
                  )
              );

              // ===== PASO DE BAJAS (receta 01 §7.5, regla 5) =====
              //    Tulas quitadas del panel que YA existían en Dataverse (Q8).
              //    Remove con registro explícito, nunca RemoveIf(ds, predicado) (D-3).
              //    Una baja fallida CUENTA como fallida => el lote no se cierra.
              If(
                  !IsEmpty(colTulasBorradasCap),
                  ClearCollect(
                      colTulasDV,
                      Filter('CH-Tbl-Bags', ReceptionBatchId.'CH-Tbl-ReceptionBatch' = gvarLoteActivo.'CH-Tbl-ReceptionBatch')
                  );
                  ForAll(
                      Filter(colTulasBorradasCap, !IsBlank(GUID)) As X,
                      IfError(
                          Remove('CH-Tbl-Bags', LookUp(colTulasDV, 'CH-Tbl-Bags' = X.GUID)),
                          Collect(
                              colFallidas,
                              { LocalId: X.PlanillaLocalId, Planilla: "tula " & X.Numero, Mensaje: FirstError.Message }
                          )
                      )
                  )
              );

              // ===== TULAS NUEVAS: mismo patrón, DESPUÉS de las planillas (7.5 regla 4) =====
              //    Necesitan el GUID de la planilla dueña YA re-keyado arriba. Las tulas que ya
              //    existen no se re-patchean: en esta pantalla una tula se agrega o se borra,
              //    nunca se edita. BagStatus se calcula EXPLÍCITO por camino (01 §5.4).
              If(
                  !IsEmpty(colTulasNuevasCap),
                  IfError(
                      Patch(
                          'CH-Tbl-Bags',
                          ForAll(
                              colTulasNuevasCap As T,
                              If(
                                  IsBlank(T.GUID),
                                  Defaults('CH-Tbl-Bags'),
                                  LookUp(colTulasDV, 'CH-Tbl-Bags' = T.GUID)
                              )
                          ),
                          ForAll(
                              colTulasNuevasCap As T,
                              {
                                  BagID:       Trim(T.Numero),
                                  Name:        Trim(T.Numero),
                                  ReceptionID: LookUp(
                                                  colPlanillasDV,
                                                  'CH-Tbl-Receptions' = LookUp(colPlanillas, LocalId = T.PlanillaLocalId).GUID
                                               ),
                                  BagStatus:   'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa'   // 159460000
                              }
                          )
                      ),
                      ForAll(
                          colTulasNuevasCap As T,
                          IfError(
                              Patch(
                                  'CH-Tbl-Bags',
                                  If(
                                      IsBlank(T.GUID),
                                      Defaults('CH-Tbl-Bags'),
                                      LookUp(colTulasDV, 'CH-Tbl-Bags' = T.GUID)
                                  ),
                                  {
                                      BagID:       Trim(T.Numero),
                                      Name:        Trim(T.Numero),
                                      ReceptionID: LookUp(
                                                      colPlanillasDV,
                                                      'CH-Tbl-Receptions' = LookUp(colPlanillas, LocalId = T.PlanillaLocalId).GUID
                                                   ),
                                      BagStatus:   'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa'
                                  }
                              ),
                              Collect(colFallidas, { LocalId: T.PlanillaLocalId, Planilla: "tula " & T.Numero, Mensaje: FirstError.Message }); Blank()
                          )
                      )
                  )
              );

              // ===== Re-hidratación de tulas (Q4, espejo B-2 / regla D-7) y re-keyado =====
              If(
                  !IsEmpty(colTulasNuevasCap) || !IsEmpty(colTulasBorradasCap),
                  ClearCollect(
                      colTulasDV,
                      Filter('CH-Tbl-Bags', ReceptionBatchId.'CH-Tbl-ReceptionBatch' = gvarLoteActivo.'CH-Tbl-ReceptionBatch')
                  );
                  ForAll(
                      colTulasDV As B,
                      Patch(colTulas, LookUp(colTulas, Trim(Numero) = Trim(B.BagID)), { GUID: B.'CH-Tbl-Bags' })
                  );
                  // PURGA de las bajas que SÍ se ejecutaron. NO es un Clear() a ciegas: una baja
                  // que Dataverse rechazó sigue viva en colTulasDV (el snapshot recién
                  // re-hidratado) y TIENE que quedar en colTulasBorradasCap para el reintento.
                  ClearCollect(colTulasNuevoCap, Filter(colTulasBorradasCap As X, !IsBlank(LookUp(colTulasDV, 'CH-Tbl-Bags' = X.GUID))));
                  ClearCollect(colTulasBorradasCap, colTulasNuevoCap);
                  Clear(colTulasNuevoCap)
              );

              // ===== Estado POR PLANILLA para el diálogo de resultado (§8.3) =====
              //    Lista el lote ENTERO, no solo el delta: una fila que no cambió también está
              //    persistida en Dataverse, así que "Guardada" es la verdad y no un relleno.
              ClearCollect(
                  colEstadoGuardadoCap,
                  ForAll(
                      colPlanillas As P,
                      {
                          Planilla: P.Planilla,
                          Ok:       IsEmpty(Filter(colFallidas, LocalId = P.LocalId)),
                          Mensaje:  Coalesce(LookUp(colFallidas, LocalId = P.LocalId).Mensaje, "Guardada")
                      }
                  )
              );

              // ===== Resultado =====
              //    El toast de éxito es SOLO del Guardar standalone: el cierre y el "Guardar y
              //    salir" tienen su propio final (toast único / navegación) y dos toasts seguidos
              //    son ruido. El diálogo ya está abierto desde el OnSelect.
              If(
                  IsEmpty(colFallidas),
                  Set(gvarCambiosSinGuardar, false);
                  If(
                      !ctxGuardarDesdeCierreCap && !ctxSalirTrasGuardarCap,
                      Notify("Lote guardado: " & CountRows(colPlanillas) & " planillas.", NotificationType.Success)
                  ),
                  Notify(
                      CountRows(colFallidas) & " registro(s) rechazados — revisá el panel y reintentá.",
                      NotificationType.Error
                  )
              );

              // ===== Continuación del CIERRE (§9.2) =====
              //    Vivía DESPUÉS del Select(btnGuardarCap) en btnDlgOkCerrarCap. Con el guardado
              //    diferido, ese Select vuelve antes de que exista un solo Patch: si la transición
              //    se quedaba allá, cerraba un lote que todavía no se había guardado.
              If(
                  ctxGuardarDesdeCierreCap,
                  If(
                      !IsEmpty(colFallidas),
                      Notify(
                          "El lote NO se cerró: hay registros rechazados. Reintentá y volvé a cerrar.",
                          NotificationType.Error
                      ),
                      IfError(
                          Patch(
                              'CH-Tbl-ReceptionBatches',
                              gvarLoteActivo,
                              { ReceptionStatus: 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.Recibido }   // 159460001
                          ),
                          Notify("El cierre fue rechazado: " & FirstError.Message, NotificationType.Error),

                          // --- rama de ÉXITO de IfError ---
                          Set(gvarLoteActivo, Blank());
                          Clear(colPlanillas);   Clear(colTulas);
                          Clear(colPlanillasDV); Clear(colTulasDV);
                          Clear(colProblemas);   Clear(colFallidas);
                          Clear(colTulasEdit);   Clear(colTulasBorradasCap); Clear(colEstadoGuardadoCap);
                          Clear(colCambiosPlanCap); Clear(colTulasNuevasCap);
                          Set(gvarCambiosSinGuardar, false);
                          UpdateContext({ ctxDlgResultadoCap: false });
                          // El overlay A vuelve solo (Visible = IsBlank(gvarLoteActivo)) y su combo
                          // tiene que volver VACÍO: sin este Reset, el próximo lote nace con la
                          // transportadora residual del que se acaba de cerrar (es L-19 otra vez).
                          Reset(cmbTransportadoraCap);
                          Notify("Lote cerrado. Pasó a Recibido y ya aparece en la pantalla Lotes.", NotificationType.Success)
                      )
                  )
              );

              // ===== Apagado del ciclo + continuación de SALIR (§9.3) =====
              //    ctxGuardandoCap: false SIEMPRE — es lo que baja Start y deja el timer listo
              //    para el próximo guardado. Va ANTES del Navigate a propósito: una vez que se
              //    abandona la pantalla no hay nada garantizado corriendo.
              //    Si quedaron fallidas, NO se navega: el diálogo se queda con el detalle y el
              //    botón Reintentar (que vuelve a entrar por acá con la bandera todavía viva).
              UpdateContext({ ctxGuardarDesdeCierreCap: false, ctxGuardandoCap: false });
              If(
                  ctxSalirTrasGuardarCap && IsEmpty(colFallidas),
                  UpdateContext({ ctxDlgResultadoCap: false, ctxSalirTrasGuardarCap: false });
                  Navigate(scrLotes)
              )
            Start: =ctxGuardandoCap
            Visible: =false
            X: =40
            Y: =40
