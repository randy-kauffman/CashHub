ationType.Information);\n        Patch(\n            'CH-Tbl-Bags',\n            FluentDetailsList3.Selected,\n            {BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Pendiente de revision por supervisor - esclusa'}\n        );\n\n        \n        );\n        UpdateContext({varShowRemapTula: false});\n        Refresh('CH-Tbl-Bags');\n        ,\n        Notify(\n            \"Debe seleccionar un numero de planilla\",\n            NotificationType.Error\n        )\n    );\n    \n);\nIf(\n    Self.SelectedButton.Label = \"Cancelar\",\n    UpdateContext({varShowRemapTula: false})\n);\n"
