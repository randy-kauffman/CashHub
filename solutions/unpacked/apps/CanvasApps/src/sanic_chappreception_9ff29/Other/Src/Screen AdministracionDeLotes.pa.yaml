      - container AgregarTula:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =varShowNewTula
            Width: =Parent.Width
          Children:
            - dialog AgregarNuevaTula:
                Control: CanvasComponent
                ComponentName: Dialog
                ComponentLibraryUniqueName: cat_powercatcomponentlibrary_0be3a
                Properties:
                  BorderRadius: =0
                  Buttons: |-
                    =Table({Label: "Cancelar", ButtonType:'Button.ButtonType'.Standard, HasBorder: false }, {Label: "Agregar", ButtonType:'Button.ButtonType'.Primary, HasBorder: false })
                  Description: ="At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis ?"
                  DialogHeight: =200
                  DialogWidth: =640
                  Fill: ='dialog AgregarNuevaTula'.OverlayColor
                  Height: =Parent.Height
                  OnButtonSelect: |
                    =If(
                        Self.SelectedButton.Label = "Agregar",
                        If(
                            IsBlank(Trim(TextInputCanvas1.Value)),
                            Notify(
                                "Debe agregar un numero de tula",
                                NotificationType.Error
                            ),
                            If(
                                !IsBlank(
                                    LookUp(
                                        'CH-Tbl-Bags',
                                        ReceptionID.ReceptionBatch.'CH-Tbl-ReceptionBatch' = FluentDetailsList2.Selected.ReceptionBatch.'CH-Tbl-ReceptionBatch' && BagID = Trim(TextInputCanvas1.Value)
                                    )
                                ),
                                Notify(
                                    "Este numero de tula ya se encuentra registrado en otra planilla en el mismo lote de recepcion",
                                    NotificationType.Error
                                ),
                                If(
                                    FluentDetailsList2.Selected.ReceptionBatch.ReceptionStatus = 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.'En progreso' || FluentDetailsList2.Selected.ReceptionBatch.ReceptionStatus = 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.Recibido,
                                    Patch(
                                        'CH-Tbl-Bags',
                                        Defaults('CH-Tbl-Bags'),
                                        {
                                            BagID: Trim(TextInputCanvas1.Value),
                                            ReceptionID: FluentDetailsList2.Selected,
                                            BagStatus: If(
                                                FluentDetailsList2.Selected.ReceptionBatch.ReceptionStatus = 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.'En boveda',
                                                'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda',
                                                'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa'
                                            ),
                                            Name: Trim(TextInputCanvas1.Value)
                                        }
                                    );
                                    Reset(TextInputCanvas1);
                                    UpdateContext({varShowNewTula: false}),
                                    With(
                                        {
                                            nuevaTula: Patch(
                                                'CH-Tbl-Bags',
                                                Defaults('CH-Tbl-Bags'),
                                                {
                                                    Name: TextInputCanvas1.Value,
                                                    BagID: TextInputCanvas1.Value,
                                                    ReceptionID: FluentDetailsList2.Selected,
                                                    BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Pendiente de revision por supervisor - esclusa'
                                                }
                                            )
                                        },
                                        Patch(
                                        'CH-Tbl-ApprovalRequests',
                                        Defaults('CH-Tbl-ApprovalRequests'),
                                            {
                                                RequestType: "Agregar tula",
                                                RequestDetails: Concatenate(
                                                    "<p>",
                                                    "Lote de recepcion ",
                                                    FluentDetailsList2.Selected.ReceptionBatch.Name,
                                                    "<br>",
                                                    "Agregar tula ",
                                                    Trim(TextInputCanvas1.Value),
                                                    " a la planilla ",
                                                    FluentDetailsList2.Selected.ReceiptID,
                                                    "</p>"
                                                ),
                                                RequestResources: "{" & Concatenate(
                                                    """",
                                                    "ReceiptGUID",
                                                    """",
                                                    ":",
                                                    """",
                                                    FluentDetailsList2.Selected.'CH-Tbl-Receptions',
                                                    """"
                                                ) & Concatenate(
                                                    ",",
                                                    """",
                                                    "BagID",
                                                    """",
                                                    ":",
                                                    """",
                                                    Trim(TextInputCanvas1.Value),
                                                    """"
                                                ) & Concatenate(
                                                    ",",
                                                    """",
                                                    "BagGUID",
                                                    """",
                                                    ":",
                                                    """",
                                                    nuevaTula.'CH-Tbl-Bags',
                                                    """"
                                                ) & Concatenate(
                                                    ",",
                                                    """",
                                                    "ReceptionBatchGUID",
                                                    """",
                                                    ":",
                                                    """",
                                                    FluentDetailsList2.Selected.ReceptionBatch.'CH-Tbl-ReceptionBatch',
                                                    """"
                                                ) & "}"
                                            }
                                        );
                                    );
                                    Notify(
                                        "Se creo una gestion de aprobacion para agregar la tula a la planilla",
                                        NotificationType.Information
                                    );
                                );
                                Reset(TextInputCanvas1);
                                UpdateContext({varShowNewTula: false});
                                Refresh('CH-Tbl-Bags');
                            )
                        )
                    );
                    If(
                        Self.SelectedButton.Label = "Cancelar",
                        UpdateContext({varShowNewTula: false})
                    );
                  OnCloseSelect: |-
                    =UpdateContext({varShowNewTula: false})
                  OverlayColor: =RGBA(0, 0, 0, 0.4)
                  SubTitle: |-
                    ="Planilla seleccionada: "&FluentDetailsList2.Selected.ReceiptID& ", lote en estatus: "&FluentDetailsList2.Selected.ReceptionBatch.ReceptionStatus
                  Theme: |-
                    ={
                    	palette: {
                    		themePrimary: "#0078d4",
                    		themeLighterAlt: "#eff6fc",
                    		themeLighter: "#deecf9",
                    		themeLight: "#c7e0f4",
                    		themeTertiary: "#71afe5",
                    		themeSecondary: "#2b88d8",
                    		themeDarkAlt: "#106ebe",
                    		themeDark: "#005a9e",
                    		themeDarker: "#004578",
                    		neutralLighterAlt: "#faf9f8",
                    		neutralLighter: "#f3f2f1",
                    		neutralLight: "#edebe9",
                    		neutralQuaternaryAlt: "#e1dfdd",
                    		neutralQuaternary: "#d0d0d0",
                    		neutralTertiaryAlt: "#c8c6c4",
                    		neutralTertiary: "#a19f9d",
                    		neutralSecondary: "#605e5c",
                    		neutralPrimaryAlt: "#3b3a39",
                    		neutralPrimary: "#323130",
                    		neutralDark: "#201f1e",
                    		black: "#000000",
                    		white: "#ffffff"
                    	}
                    }
                  Title: ="Agregar nueva tula a planilla"
                  Width: =Parent.Width
            - TextInputCanvas1:
                Control: TextInput@0.0.54
                Properties:
                  Appearance: ='TextInputCanvas.Appearance'.Outline
                  Placeholder: ="Agregar numero de tula"
                  X: =((Parent.Width - Self.Width)/ 2 ) - ('dialog AgregarNuevaTula'.ContentWidth/4) + 20
                  Y: =(Parent.Height - Self.Height) / 2 + 30
