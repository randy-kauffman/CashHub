                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =0
                                    OnSelect: "=Switch(\n    Self.Selected.ItemKey,\n    \"Actualizar\",\n    Refresh('CH-Tbl-Bags');\n    Refresh('CH-Tbl-ReceptionBatches');\n    Refresh('CH-Tbl-Receptions');\n    ,\n    \"MoverABoveda\",\n    UpdateContext({varSpinnerMessage: \"Actualizando estatus...\"});\n    IfError(\n        If(\n            TabList1.Selected.Value = \"Planilla\",\n            ClearCollect(\n                colPlanillasABoveda,\n                Filter(\n                    'CH-Tbl-Receptions',\n                    ReceptionBatch.'CH-Tbl-ReceptionBatch' = FluentDetailsList2.Selected.ReceptionBatch.'CH-Tbl-ReceptionBatch'\n                )\n            );\n            Clear(colTulasABoveda);\n            ForAll(\n                colPlanillasABoveda As Planilla,\n                Collect(\n                    colTulasABoveda,\n                    Filter(\n                        'CH-Tbl-Bags',\n                        ReceptionID.'CH-Tbl-Receptions' = Planilla.'CH-Tbl-Receptions'\n                    )\n                )\n            );\n            ForAll(\n                colTulasABoveda As Tula,\n                If(Tula.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa', \n                Patch(\n                    'CH-Tbl-Bags',\n                    Tula,\n                    {BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda'}\n                ));\n            );\n            Clear(colTulasABoveda);\n            Clear(colPlanillasABoveda);\n            Patch(\n                'CH-Tbl-ReceptionBatches',\n                FluentDetailsList2.Selected.ReceptionBatch,\n                {ReceptionStatus: 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.'En boveda'}\n            );\n        );\n        If(\n            TabList1.Selected.Value = \"Lote\",\n            ClearCollect(\n                colPlanillasABoveda,\n                Filter(\n                    'CH-Tbl-Receptions',\n                    ReceptionBatch.'CH-Tbl-ReceptionBatch' = 'detailList Lote'.Selected.'CH-Tbl-ReceptionBatch'\n                )\n            );\n            Clear(colTulasABoveda);\n            ForAll(\n                colPlanillasABoveda As Planilla,\n                Collect(\n                    colTulasABoveda,\n                    Filter(\n                        'CH-Tbl-Bags',\n                        ReceptionID.'CH-Tbl-Receptions' = Planilla.'CH-Tbl-Receptions'\n                    )\n                )\n            );\n            ForAll(\n                colTulasABoveda As Tula,\n                If(Tula.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa', \n                Patch(\n                    'CH-Tbl-Bags',\n                    Tula,\n                    {BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda'}\n                ));\n            );\n            Clear(colTulasABoveda);\n            Clear(colPlanillasABoveda);\n            Patch(\n                'CH-Tbl-ReceptionBatches',\n                LookUp(\n                    'CH-Tbl-ReceptionBatches',\n                    'CH-Tbl-ReceptionBatch' = 'detailList Lote'.Selected.'CH-Tbl-ReceptionBatch'\n                ),\n                {ReceptionStatus: 'ReceptionStatus (CH-Tbl-ReceptionBatches)'.'En boveda'}\n            );\n        );\n        Refresh('CH-Tbl-Bags');\n        Refresh('CH-Tbl-ReceptionBatches');\n        Refresh('CH-Tbl-Receptions');\n        UpdateContext({varSpinnerMessage: \"\"});\n        ,\n        Notify(\"Error al mover a bóveda: \" & FirstError.Message, NotificationType.Error)\n    );\n    UpdateContext({varSpinnerMessage: \"\"})\n    ,\n    \"Editar\",\n    Blank();\n    Set(\n        varSelectedReceptionBacth,\n        LookUp('CH-Tbl-ReceptionBatches', 'CH-Tbl-ReceptionBatch' =  'detailList Lote'.Selected.'CH-Tbl-ReceptionBatch')\n    );\n    Clear(colPlanillas);\nClear(colTulas);\nForAll(\n    Filter(\n        'CH-Tbl-Receptions',\n        ReceptionBatch.'CH-Tbl-ReceptionBatch' = 'detailList Lote'.Selected.'CH-Tbl-ReceptionBatch'\n    ) As Planilla,\n    Collect(colPlanillas, {\n        ID: Max(\n            colPlanillas,\n            ID\n        ) + 1,\n        Empresa: Planilla.RemitentName,\n        Cliente: Planilla.RemitentClient,\n        Sucursal: Planilla.BranchName,\n        Planilla: Planilla.Name,\n        ChequeNIO: Planilla.NIOCheck,\n        ChequeUSD: Planilla.USDCheck,\n        EfectivoNIO: Planilla.NIOCash,\n        EfectivoUSD: Planilla.USDCash,\n        GUID: GUID(Planilla.'CH-Tbl-Receptions')\n        ,Pagina: Trunc( (Max(\n            colPlanillas,\n            ID\n        ) + 1)/9,0)\n        ,CantTulas: CountRows(Filter('CH-Tbl-Bags', ReceptionID.'CH-Tbl-Receptions' = Planilla.'CH-Tbl-Receptions'))\n    });\n\n    ForAll( Filter(\n                'CH-Tbl-Bags',\n                ReceptionID.'CH-Tbl-Receptions' = Planilla.'CH-Tbl-Receptions'\n            ) As Tula\n            ,\n    Collect(\n        colTulas,\n        \n        {\n            ID: Max(\n            Filter(colTulas, RelatedRowID = Max(colPlanillas,ID)),ID) + 1\n            ,RelatedRowID: Max(colPlanillas,ID)\n            ,Numero: Tula.BagID\n            ,GUID: GUID(Tula.'CH-Tbl-Bags')\n        }\n        )\n        )\n    );\n    Navigate('Screen CreacionLotesRecepcion',ScreenTransition.Fade);\n\n    ,\"EditarPlanilla\"\n    ,UpdateContext({varShowEditPlanilla: true})\n    \n)\n    \n\n\n"
