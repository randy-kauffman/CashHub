          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(79, 90, 94, 0.79)
            Height: =Parent.Height
            Visible: =!IsBlank(varSpinnerMessage)
            Width: =Parent.Width
          Children:
            - Spinner1:
                Control: Spinner@1.4.6
                Properties:
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =Parent.Height
                  Label: =varSpinnerMessage
                  LabelPosition: ='Spinner.LabelPosition'.Below
                  SpinnerSize: ='Spinner.SpinnerSize'.Huge
                  Width: =Parent.Width
            - Progress1:
                Control: Progress@1.1.34
                Properties:
                  Max: =CountRows(colPlanillas)
                  ProgressColor: ='Progress.ProgressColor'.Brand
                  Thickness: ='Progress.Thickness'.Large
                  Value: =CountRows(colPlanillasGuardadas)
                  Visible: =varShowProgress
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2 + 80
      - KeyboardShortcuts1:
          Control: CodeComponent
          ComponentName: cat_PowerCAT.KeyboardShortcuts
          Properties:
            Height: =0
            KeyConfig: ="[""alt + v"",""alt + n"",""alt + d"",""alt + a"",""alt + p"",""alt + l"",""alt + t"",""alt + k""]"
            OnChange: |-
              =If( Self.OnKey = "alt + v",
                  Select('btn Validar')
              );
              If( Self.OnKey = "alt + n",
                  Select('btn Nuevo')
              );
              If( Self.OnKey = "alt + a",
                  Select('ico back')
              );
              If( Self.OnKey = "alt + d",
                  Select('ico foreward')
              );
            Width: =0
            X: =Parent.Width
            Y: =Parent.Height
      - ExpandMenu_1:
          Control: CanvasComponent
          ComponentName: ExpandMenu
          ComponentLibraryUniqueName: cat_powercatcomponentlibrary_0be3a
          Properties:
            DefaultExpandValue: =false
            Fill: =ColorValue(ExpandMenu_1.Theme.palette.white)
            Height: =Parent.Height
            IsNavigationEnabled: =false
            Items: |-
              =Table(
              {Icon: "ProductRelease", Label: "Crear lote", Screen:'Screen CreacionLotesRecepcion', Tooltip:"Crear lote de recepcion"}, 
              {Icon: "ProductVariant", Label: "Administrar lotes", Screen:'Screen AdministracionDeLotes', Tooltip:"Administrar lotes de recepcion creados"}
              )
            OnButtonSelect: =Navigate(Self.SelectedItem.Screen,ScreenTransition.Fade)
            OnExpandSelect: =
            Theme: |-
              ={
              	palette: {
              		themePrimary: "#0078d4",
              		themeLighterAlt: "#eff6fc",
              		themeLighter: "#deecf9",
              		themeLight: "#c7e0f4",
              		themeTertiary: "#71afe5",
              		themeSecondary: "#2b88d8",
              		themeDarkAlt: "#106ebe",
              		themeDark: "#005a9e",
              		themeDarker: "#004578",
              		neutralLighterAlt: "#faf9f8",
              		neutralLighter: "#f3f2f1",
              		neutralLight: "#edebe9",
              		neutralQuaternaryAlt: "#e1dfdd",
              		neutralQuaternary: "#d0d0d0",
              		neutralTertiaryAlt: "#c8c6c4",
              		neutralTertiary: "#a19f9d",
              		neutralSecondary: "#605e5c",
              		neutralPrimaryAlt: "#3b3a39",
              		neutralPrimary: "#323130",
              		neutralDark: "#201f1e",
              		black: "#000000",
              		white: "#ffffff"
              	}
              }
            Width: =If(!Self.IsExpanded, 46, 221)
