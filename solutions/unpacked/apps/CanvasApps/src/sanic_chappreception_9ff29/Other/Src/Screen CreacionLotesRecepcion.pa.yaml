({varSpinnerMessage: \"\"});\n\n    NewForm(Form1);\n);\n"
            OnTimerStart: "=UpdateContext(\n    {\n        varFirstRow: First(\n            SortByColumns(\n                Filter(\n                    colPlanillas,\n                    !(ID in ShowColumns(\n                        colPlanillasGuardadas,\n                        ID\n                    ))\n                ),\n                \"ID\",\n                SortOrder.Ascending\n            )\n        ).ID\n    }\n);\nIf(\n    varCurrentRow <> varFirstRow && !IsBlank(varFirstRow),\n    UpdateContext({varCurrentRow: varFirstRow});\n    ResetForm('form Receptions');\n    If(\n        IsBlank(\n            LookUp(\n                colPlanillas,\n                ID = varCurrentRow\n            ).GUID\n        ),\n        UpdateContext({Planilla: Defaults('CH-Tbl-Receptions')});\n        NewForm('form Receptions'),\n        UpdateContext(\n            {\n                Planilla: LookUp(\n                    'CH-Tbl-Receptions',\n                    'CH-Tbl-Receptions' = LookUp(\n                        colPlanillas,\n                        ID = varCurrentRow\n                    ).GUID\n                )\n            }\n        );\n        EditForm('form Receptions')\n    );\n    SubmitForm('form Receptions');\n    \n)"
