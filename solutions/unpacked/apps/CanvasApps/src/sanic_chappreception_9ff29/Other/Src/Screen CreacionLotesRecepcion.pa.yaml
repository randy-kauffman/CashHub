                        OnSelect: "=UpdateContext({varSpinnerMessage: \"Validando...\"});\n//Actualiza el detalle de las planillas en coleccion\n\n\nForAll(\n    'gal Planillas'.AllItems As Gal,\n    UpdateIf(\n        colPlanillas,\n        Value(Gal.'lbl IDRegistro'.Text) = ID,\n        {\n            Empresa: Gal.'cmb Empresa'.Selected.Name,\n            Cliente: Gal.'cmb Empresa'.Selected.Client,\n            Sucursal: Gal.'cmb Empresa'.Selected,\n            Planilla: Trim(Gal.'txtinp Planilla'.Text),\n            ChequeNIO: Value(Trim(Gal.'numinp ChequeNIO'.Text)),\n            ChequeUSD: Value(Trim(Gal.'numinp ChequeUSD'.Text)),\n            EfectivoNIO: Value(Trim(Gal.'numinp EfectivoNIO'.Text)),\n            EfectivoUSD: Value(Trim(Gal.'numinp EfectivoUSD'.Text))\n        }\n    )\n);\n//Validaciones\n//Obtener las planillas con campos vacios\nClearCollect(\n    colPlanillasCamposVacios,\n    Filter(\n        colPlanillas,\n        Or(\n            IsBlank(Empresa),\n            IsBlank(Planilla)\n        )\n    )\n);\n//Obtener tulas con monto 0 en todos los campos\nClearCollect(\n    colPlanillasMonto0,\n    Filter(\n        colPlanillas,\n        And(\n            ChequeNIO = 0 || IsBlank(ChequeNIO),\n            ChequeUSD = 0 || IsBlank(ChequeUSD),\n            EfectivoNIO = 0 || IsBlank(EfectivoNIO),\n            EfectivoUSD = 0 || IsBlank(EfectivoUSD)\n        )\n    )\n);\n//Obtener planillas sin ninguna tula asignada\nClearCollect(\n    colPlanillasSinTula,\n    Filter(\n        colPlanillas,\n        CantTulas = 0\n    )\n);\n//Obtener planillas duplicadas\nClearCollect(\n    colPlanillasDuplicadas,\n    {ID: 0}\n);\nClear(colPlanillasDuplicadas);\nForAll(\n    GroupBy(\n        colPlanillas,\n        Planilla,\n        PlanillaGrp\n    ),\n    If(\n        CountRows(PlanillaGrp) > 1,\n        Collect(\n            colPlanillasDuplicadas,\n            {ID: First(PlanillaGrp).ID}\n        )\n    )\n);\n//Obtener tulas duplicadas\nClearCollect(\n    colTulasDuplicadas,\n    {Numero: \"\"}\n);\nClear(colTulasDuplicadas);\nForAll(\n    GroupBy(\n        colTulas,\n        Numero,\n        NumeroGrp\n    ) As Row,\n    If(\n        CountRows(Row.NumeroGrp) > 1,\n        Collect(\n            colTulasDuplicadas,\n            {Numero: Row.Numero}\n        )\n    )\n);\nClearCollect(\n    colPlanilalsconTulasDuplicadas,\n    {ID: 0}\n);\nClear(colPlanilalsconTulasDuplicadas);\nClearCollect(\n    colPlanilalsconTulasDuplicadas,\n    RenameColumns(\n        Distinct(\n            ShowColumns(\n                Filter(\n                    colTulas,\n                    Numero in colTulasDuplicadas.Numero\n                ),\n                RelatedRowID\n            ),\n            RelatedRowID\n        ),\n        Value,\n        ID\n    )\n);\n//Enviar mensajes de error si los hay\nIf(\n    And(\n        IsEmpty(colPlanillasCamposVacios),\n        IsEmpty(colPlanillasMonto0),\n        IsEmpty(colPlanillasSinTula),\n        IsEmpty(colPlanillasDuplicadas),\n        IsEmpty(colTulasDuplicadas),\n        IsEmpty(colPlanilalsconTulasDuplicadas)\n    ),\n    Notify(\n        \"Todos los registros son validos\",\n        NotificationType.Success\n    ),\n    If(\n        !IsEmpty(colPlanillasCamposVacios),\n        Notify(\n            \"Se encontro planillas con campos vacios IDs: \" & Concat(\n                colPlanillasCamposVacios,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n\n    If(\n        !IsEmpty(colPlanillasMonto0),\n        Notify(\n            \"Se encontro planillas con monto 0 IDs: \" & Concat(\n                colPlanillasMonto0,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n\n    If(\n        !IsEmpty(colPlanillasSinTula),\n        Notify(\n            \"Se encontro planillas sin Tula asignada IDs: \" & Concat(\n                colPlanillasSinTula,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n\n    If(\n        !IsEmpty(colPlanillasDuplicadas),\n        Notify(\n            \"Se encontro planillas duplicadas IDs: \" & Concat(\n                colPlanillasDuplicadas,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n    \n    If(\n        !IsEmpty(colPlanilalsconTulasDuplicadas),\n        Notify(\n            \"Se encontro planillas que contienen Tulas duplicadas IDs: \" & Concat(\n                colPlanilalsconTulasDuplicadas,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n    \n);\n\nClearCollect(colPlanillasConProblemas,\nShowColumns(colPlanillasCamposVacios, ID);\n,ShowColumns(colPlanillasMonto0, ID);\n,ShowColumns(colPlanillasSinTula, ID);\n,ShowColumns(colPlanillasDuplicadas, ID);\n,ShowColumns(colPlanilalsconTulasDuplicadas, ID);\n);\n\n\nUpdateContext({varSpinnerMessage: \"\"})"
