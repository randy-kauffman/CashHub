lasSinTula,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n    If(\n        !IsEmpty(colPlanillasDuplicadas),\n        Notify(\n            \"Se encontro planillas duplicadas IDs: \" & Concat(\n                colPlanillasDuplicadas,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n    If(\n        !IsEmpty(colPlanilalsconTulasDuplicadas),\n        Notify(\n            \"Se encontro planillas que contienen Tulas duplicadas IDs: \" & Concat(\n                colPlanilalsconTulasDuplicadas,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n    If(\n        IsEmpty(colPlanillas),\n        Notify(\n            \"Debe ingresar al menos un registro\" & Concat(\n                colPlanilalsconTulasDuplicadas,\n                ID,\n                \",\"\n            ),\n            NotificationType.Error\n        )\n    );\n    \n);\nClearCollect(\n    colPlanillasConProblemas,\n    ShowColumns(\n        colPlanillasCamposVacios,\n        ID\n    );\n    ,\n    ShowColumns(\n        colPlanillasMonto0,\n        ID\n    );\n    ,\n    ShowColumns(\n        colPlanillasSinTula,\n        ID\n    );\n    ,\n    ShowColumns(\n        colPlanillasDuplicadas,\n        ID\n    );\n    ,\n    ShowColumns(\n        colPlanilalsconTulasDuplicadas,\n        ID\n    );\n    \n);\n\n//Si no hay ningun error de validacion, proceder a guardar\nIf(\n    IsEmpty(colPlanillasConProblemas) && !IsEmpty(colPlanillas),\n    Clear(colPlanillasGuardadas);\n    UpdateContext({varSpinnerMessage: \"Guardando...\",varShowProgress:true});\n    UpdateContext({varCurrentRow: 0 });\n    UpdateContext({varSubmitTimerStart: true});   \n    UpdateContext({varSoloGuardar: true});\n    ,\n    UpdateContext({varSpinnerMessage: \"\"})\n);\n"
