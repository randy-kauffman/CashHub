ComponentDefinitions:
  cmpTheme:
    DefinitionType: CanvasComponent
    AllowCustomization: true
    CustomProperties:
      Theme:
        PropertyKind: Output
        DisplayName: Theme
        Description: A custom property
        DataType: Record
    Properties:
      Height: =200
      Theme: |-
        ={ 
            Colors: {
                Primary: "#5B4BDF"
                ,Primary700: "#4A3CC0"
                ,Primary100: "EAE8FF"
                ,Danger: "#DC3545"
                ,Warn: "#FFC107"
                ,Success: "#198754"
                ,Text: "#1B1C1D"
                ,TextMuted: "#6B7280"
                ,Bg: "#FFFFFF"
                ,Surface: "#F7F7FB"
                ,Border: "#E5E7EB"
            }
            ,Spacing: {XS:4, S:8, M:12, L:16, XL:24, XXL:32}
            ,Radius: {S:4, M:8, L:12}
            ,Font: {Family:"Segoe UI", H1: 22, H2: 18, Body: 14, Small: 12}
            ,Z: {Overlay: 1000, Toast: 1100, Modal: 1200}
        }
      Width: =320
