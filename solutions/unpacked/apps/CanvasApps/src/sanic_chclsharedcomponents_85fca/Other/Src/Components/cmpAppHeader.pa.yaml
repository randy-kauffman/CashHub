  cmpAppHeader:
    DefinitionType: CanvasComponent
    AllowCustomization: true
    Properties:
      Height: =64
      Width: =App.Width
    Children:
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =
            Height: =Parent.Height
            Width: =Parent.Width
            Y: =40
