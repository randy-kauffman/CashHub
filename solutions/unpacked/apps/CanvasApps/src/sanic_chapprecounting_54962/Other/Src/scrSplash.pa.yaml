Screens:
  scrSplash:
    Properties:
      Fill: =ThemeBg
    Children:
      - lblCargandoSpl:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ThemeInk3
            Font: =Font.'Open Sans'
            Height: =20
            Size: =9.5
            Text: ="Cargando…"
            Width: =160
            X: =App.Width/2 - 80
            Y: =App.Height/2 - 8
      - lblMarcaSpl:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ThemeSurface
            Fill: =ThemeAccent
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =18
            Text: ="C$"
            Width: =40
            X: =App.Width/2 - 20
            Y: =App.Height/2 - 60
      - tmrSplash:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =350
            Height: =4
            OnTimerEnd: =Navigate(scrSesion)
            Visible: =false
            Width: =40
            X: =App.Width/2 - 20
            Y: =App.Height/2 + 20
