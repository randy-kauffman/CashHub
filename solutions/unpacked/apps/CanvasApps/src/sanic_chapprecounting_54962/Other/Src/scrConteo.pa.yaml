            OnSelect: |-
              =// ============ BLOQUE N — DEPOSITO NUEVO — btnDepNuevoCon.OnSelect ============
              // Este motor NO escribe ctxHayDepositoCon: lo setea el LLAMADOR en la instruccion
              // inmediatamente anterior al Select().
              UpdateContext({
