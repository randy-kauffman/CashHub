                              Tipo:          Text(DC.CheckType),
                              Moneda:        Text(DC.CheckCurrency),
                              Monto:         DC.CheckAmount,
                              Seleccionado:  false,
                              EsManual:      false
                          }
                      )
                  )
              );

              Set(gvarDepositoSinGuardar, false);
              Reset(galBilletesCon); Reset(galMonedasCon); Reset(galChequesCon); Reset(inpCuentaCon)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
