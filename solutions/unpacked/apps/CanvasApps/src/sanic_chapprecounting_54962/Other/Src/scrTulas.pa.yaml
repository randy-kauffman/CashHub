      - btnCargarSesionTul:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =ThemeInk
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            Height: =1
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Color.Transparent
            OnSelect: |-
              =// MOTOR: las dos consultas de la sesion, en paralelo.
              // Forma PRINCIPAL de 03 §5.2: el espejo E-1 (RecountingSessionMirror en
              // CH-Tbl-DepositsRecountings) esta DESPLEGADO y backfilled (05-backend-espejos.md),
              // asi que la consulta de depositos delega en 1 salto y las dos ramas son
              // independientes: van en Concurrent.
              Concurrent(
                  ClearCollect(
                      colTulasSesionTul,
                      SortByColumns(
                          Filter(
                              'CH-Tbl-Bags',
                              RecountingSession.'CH-Tbl-RecountingSession' = gvarSesion.'CH-Tbl-RecountingSession'
                          ),
                          "modifiedon",
                          SortOrder.Descending
                      )
                  ),
                  ClearCollect(
                      colDepositosSesionTul,
                      Filter(
                          'CH-Tbl-DepositsRecountings',
                          RecountingSessionMirror.'CH-Tbl-RecountingSession' = gvarSesion.'CH-Tbl-RecountingSession'
                      )
                  )
              )
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.Transparent
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =9
            TabIndex: =-1
            Text: =""
            Width: =1
            Y: =767
      - btnResolverDeclaracionTul:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =ThemeInk
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            Height: =1
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Color.Transparent
            OnSelect: |-
              =If(
                  // ===== (1) SIN DECLARACION: ruta de solicitud al supervisor =====
                  CountRows(colDeclaradasCandidatasTul) = 0,

                      // ¿ya hay una solicitud de HOY, de este cajero, para este numero de tula?
                      UpdateContext(
                          {
                              ctxSolicitudPrevTul:
                                  First(
                                      Sort(
                                          Filter(
                                              'CH-Tbl-ApprovalRequests',
                                              RequestType = "Tula sin declaracion" &&
                                              BagNumber   = ctxScanTul &&
                                              'Created By'.User = gvarUser.User &&
                                              'Created On' >= Today()
                                          ),
                                          'Created On',
                                          SortOrder.Descending
                                      )
                                  )
                          }
                      );
                      If(
                          // ¿es de ESTA tula y de ESTA sesion? Los dos GUID viajan en RequestResources
                          !IsBlank(ctxSolicitudPrevTul.'CH-Tbl-ApprovalRequest') &&
                          !IsBlank(Find(Text(ctxTulaElegidaTul.'CH-Tbl-Bags'), ctxSolicitudPrevTul.RequestResources)) &&
                          !IsBlank(Find(Text(gvarSesion.'CH-Tbl-RecountingSession'), ctxSolicitudPrevTul.RequestResources)),

                          If(
                              // sigue pendiente ⇒ NO se duplica: se re-adopta y se vuelve a esperar
                              IsBlank(ctxSolicitudPrevTul.ApprovalStatus),
                                  Set(gvarSolicitud, ctxSolicitudPrevTul);
                                  UpdateContext({ ctxEsperandoTul: true, ctxRechazadaTul: false }),

                              // ya aprobada ⇒ se consume: abrimos sin declaracion
                              ctxSolicitudPrevTul.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado,
                                  Set(gvarSolicitud, ctxSolicitudPrevTul);
                                  UpdateContext({ ctxDeclElegidaTul: Defaults('CH-Tbl-DeclaredBags') });
                                  Select(btnAbrirNuevaTul),

                              // rechazada ⇒ el cajero puede volver a pedirla: dialogo B3
                              UpdateContext({ ctxDlgSinDecTul: true })
                          ),
                          UpdateContext({ ctxDlgSinDecTul: true })
                      ),

                  // ===== (2) MAS DE UNA DECLARACION: el cajero desambigua (dialogo B2) =====
                  CountRows(colDeclaradasCandidatasTul) > 1,
                      UpdateContext({ ctxDlgDeclTul: true }),

                  // ===== (3) EXACTAMENTE UNA: camino feliz, directo al conteo =====
                  UpdateContext({ ctxDeclElegidaTul: First(colDeclaradasCandidatasTul) });
                  Select(btnAbrirNuevaTul)
              )
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.Transparent
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
