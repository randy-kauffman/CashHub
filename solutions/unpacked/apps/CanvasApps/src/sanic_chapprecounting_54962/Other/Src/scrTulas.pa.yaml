            Y: =767
      - btnReabrirTul:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =ThemeInk
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            Height: =1
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Color.Transparent
            OnSelect: |-
              =// Retomar NO patchea nada: la tula ya es del cajero (o ya esta Recontada).
              IfError(
                  Set(gvarTula, LookUp('CH-Tbl-Bags', 'CH-Tbl-Bags' = ctxTulaElegidaTul.'CH-Tbl-Bags')),
                  Notify("No se pudo releer la tula: " & FirstError.Message, NotificationType.Error);
                  Set(gvarTula, Blank())
              );

              If(
                  IsBlank(gvarTula.'CH-Tbl-Bags'),
                  Notify("La tula ya no está disponible. Toque el botón Actualizar para refrescar la lista.", NotificationType.Error),

                  // la declaracion se relee COMPLETA por PK: 04 necesita sus totales, no la anotacion
                  If(
                      IsBlank(gvarTula.BagDeclarationID.'CH-Tbl-DeclaredBags'),
                      Set(gvarDeclaredBag, Blank()),
                      Set(
                          gvarDeclaredBag,
                          LookUp(
                              'CH-Tbl-DeclaredBags',
                              'CH-Tbl-DeclaredBags' = gvarTula.BagDeclarationID.'CH-Tbl-DeclaredBags'
                          )
                      )
                  );
                  Select(btnEntrarConteoTul)
              )
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Color.Transparent
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =9
            TabIndex: =-1
            Text: =""
