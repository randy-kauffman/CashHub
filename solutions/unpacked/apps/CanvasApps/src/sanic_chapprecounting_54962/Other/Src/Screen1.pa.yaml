                                                            FieldName: ="Value"
                                                            FieldType: ="l"
                                                            Order: =1
                                                - btnProcesar:
                                                    Control: Classic/Icon@2.5.0
                                                    Properties:
                                                      AutoDisableOnSelect: =false
                                                      Icon: =Icon.Reload
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |
                                                        =Notify(
                                                            "Obteniendo recuento de la máquina contadora...",
                                                            NotificationType.Information
                                                        );
                                                        // Aquí se ejecuta el flujo que procesar los reportes automáticos en extensión .xml generados por la contadora
                                                        UpdateContext(
                                                            {
                                                                responseFlowMessage: 'CH-Flow-ProcessXMLFiles'.Run(
                                                                    gvarDatosConteo.ID_Sesion,
                                                                    gvarDatosConteo.Serial_Maquina
                                                                )
                                                            }
                                                        );
                                                        Set(
                                                            varLimpiarAuto,
                                                            false
                                                        );
                                                        // Variable para limpiar los campos cuando se da click en el botón rojo de X.
                                                        Set(
                                                            varSessionDetailId,// Variable para guardar el valor de la sessión que se genera al seleccionar la mesa y tener registrado el serial de la máquina.
                                                            LookUp(
                                                                'CH-Tbl-RecountingSessionDetails',
                                                                'CH-Tbl-RecountingSessionDetail' = gvarDatosConteo.ID_Sesion,
                                                                RecountingSessionDetailId
                                                            )
                                                        );
                                                        Refresh('CH-Tbl-XMLReadings');
                                                        // Se refresca la tabla donde se guardan los datos XML.
                                                        ClearCollect(
                                                            colXmlReadingDetails,
                                                            Filter(
                                                                'CH-Tbl-XMLReadingDetails',
                                                                XMLReading.XMLReadingId in Filter(
                                                                    'CH-Tbl-XMLReadings' As r,
                                                                    r.RecountingSessionDetailId.RecountingSessionDetailId = varSessionDetailId && r.IsActive = true
                                                                ).XMLReadingId
                                                            )
                                                        );
                                                        ClearCollect(
                                                            colDenominationTotals,
                                                            AddColumns(
                                                                GroupBy(
                                                                    colXmlReadingDetails,
                                                                    Denomination,
                                                                    GroupedRows
                                                                ),
                                                                TotalQuantity,
                                                                Sum(
                                                                    GroupedRows,
                                                                    Quantity
                                                                )
                                                            )
                                                        );
                                                        /*
                                                        Notify(
                                                            "Totales -> " & Concat(
                                                                colDenominationTotals,
                                                                Text(ThisRecord.sanic_denomination) & ": " & Text(TotalQuantity),
                                                                " | "
                                                            ),
                                                            NotificationType.Information
                                                        );
                                                        */If(
                                                            responseFlowMessage.status = "Completado",
                                                            Notify(
                                                                "Reconteo de la máquina completado.",
                                                                NotificationType.Success
                                                            ),
                                                            Notify(
                                                                "El reconteo de la máquina no pudo ser leído correctamente. ",
                                                                NotificationType.Error
                                                            )
                                                        );
                                                      Visible: =!IsBlank(varSelectedRecountedDeposit)
                                                      Width: =20
                                                - Icon3:
                                                    Control: Classic/Icon@2.5.0
                                                    Properties:
                                                      Color: =RGBA(255, 0, 0, 1)
                                                      Height: =20
