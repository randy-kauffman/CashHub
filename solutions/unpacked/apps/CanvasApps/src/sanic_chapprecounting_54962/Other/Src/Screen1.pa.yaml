                                                      OnSuccess: "=UpdateContext({varRecountedDeposit: formRecountedDepositUpdate.LastSubmit});\nNotify(\"Deposito actualizado\");\n//Updating Cash details\n//Delete cash with 0 and created on details\nForAll(\n    Filter(\n        colRecountedMoneyDetails,\n        Quantity = 0 && !IsBlank('CH-Tbl-CountedMoneyDetails')\n    ) As Money,\n    Remove(\n        'CH-Tbl-CountedMoneyDetails',\n        Money\n    )\n);\n//Delete all the money if currency change is made\nRemoveIf(\n    'CH-Tbl-CountedMoneyDetails',\n    varSelectedRecountedDeposit.Currency <> DropdownCanvas1.Selected.Value && RelatedDepositRecountingID.'CH-Tbl-DepositsRecounting' = varSelectedRecountedDeposit.'CH-Tbl-DepositsRecounting'\n);\nForAll(\n    Filter(\n        colRecountedMoneyDetails,\n        Quantity > 0\n    ) As Money,\n    Patch(\n        'CH-Tbl-CountedMoneyDetails',\n        Money,\n        {\n            RelatedDepositRecountingID: varRecountedDeposit,\n            Denomination: Money.Denomination,\n            DenominationType: Money.DenominationType,\n            Quantity: Money.Quantity\n        }\n    );\n    \n);\n//Update Cheques\n//Desenlazar cheques enlazados\nForAll(\n    Filter(\n        colChecks,\n        !IsBlank(RelatedDeclaredCheck) && !Selected && !IsBlank(RelatedReCounterDepositID)\n    ) As DescelectedCheck,\n    Patch(\n        'CH-Tbl-DeclaredChecks',\n        DescelectedCheck.RelatedDeclaredCheck,\n        {DeclaredDepositID: Blank()}\n    );\n    Remove(\n        'CH-Tbl-Checks',\n        DescelectedCheck\n    );\n    \n);\n//Quitar cheques no declarados que hayan sido eliminados\nForAll(\n    colDeletedChecks As DeletedCheck,\n    Remove(\n        'CH-Tbl-Checks',\n        DeletedCheck\n    );\n    \n);\n\nForAll(\n    DropColumns(\n        Filter(\n            colChecks,\n            IsBlank(RelatedDeclaredCheck) || Selected\n        ),\n        Selected,\n        OrderID\n    ) As Check,\n    Patch(\n        'CH-Tbl-Checks',\n        Check,\n        {\n            RelatedReCounterDepositID: varRecountedDeposit,\n            RelatedDeclaredCheck: Check.RelatedDeclaredCheck,\n            CheckTypes: Check.CheckTypes,\n            CheckCurrency: Check.CheckCurrency,\n            CheckNumber: Check.CheckNumber,\n            CheckAmount: Check.CheckAmount\n        }\n    );\n    \n);\nResetForm(Self);\nEditForm(Self);\nClear(colChecks);\nClear(colRecountedMoneyDetails);\nUpdateContext({varSelectedRecountedDeposit: Blank()});\nClear(colDeletedChecks);\nSet(gvarSelectedDeclaredDeposit, Blank());\n\nRefresh('CH-Tbl-DepositsRecountings');\nRefresh('CH-Tbl-Checks');\nRefresh('CH-Tbl-DeclaredDeposits');\nClearCollect(colDepositsRecounted, Filter('CH-Tbl-DepositsRecountings',BagID.'CH-Tbl-Bags' = gvarSelectedTula.'CH-Tbl-Bags'));\nUpdateContext({varSelectedDeclaredDeposit: Blank()});\nUpdateContext({varScreenSpinnerMessage: \"\"});\n\n"
