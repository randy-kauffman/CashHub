                                                - btnEnlazar:
                                                    Control: Button@0.0.45
                                                    Properties:
                                                      BorderRadius: =10
                                                      LayoutMaxHeight: =
                                                      LayoutMaxWidth: =
                                                      OnSelect: "=UpdateContext({varLinkConfirm: true});\r\n\r\n\r\nIf(\r\n    varLinkConfirm,\r\n    Notify(\r\n        \"Enlazar deposito\",\r\n        NotificationType.Success\r\n    );\r\n    UpdateContext({varDialogConfirmarEnlazarDeposito: true});\r\n ClearCollect(\r\n        colNewDeposit,\r\n        Defaults('CH-Tbl-DepositsRecountings')\r\n    );\r\n    Clear(colNewDeposit);\r\n    NewForm(formRecountedDepositNew);\r\n    Patch(\r\n        colNewDeposit,\r\n        If(IsBlank(varSelectedRecountedDeposit),  Defaults('CH-Tbl-DepositsRecountings'), varSelectedRecountedDeposit),\r\n        {\r\n            BagID: gvarSelectedTula,\r\n            Currency: DropdownCanvas1.Selected.Value,\r\n            BACLocalCheckAmount: Sum(\r\n                Filter(\r\n                    'gal Checks'.AllItems,\r\n                    IsBlank(RelatedDeclaredCheck) && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'BAC Local'\r\n                ),\r\n                Value(NumberInput1.Text)\r\n            ),\r\n            OtherLocaCheckAmount: Sum(\r\n                Filter(\r\n                    'gal Checks'.AllItems,\r\n                    IsBlank(RelatedDeclaredCheck) && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'Otros Local'\r\n                ),\r\n                Value(NumberInput1.Text)\r\n            ),\r\n            CashAmount: Value(Label6_55.Text)\r\n        }\r\n    );\r\n    \r\n);\r\n"
                                                      Text: ="Enlazar"
