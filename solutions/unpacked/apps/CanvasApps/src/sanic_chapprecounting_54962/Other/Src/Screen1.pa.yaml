                                                    Properties:
                                                      BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                      BorderRadius: =10
                                                      LayoutMaxHeight: =
                                                      LayoutMaxWidth: =
                                                      OnSelect: "=UpdateContext({varAddConfirm: true});\nSet(varLimpiarAuto, true);\nIf(\n    CountRows(\n        Filter(\n            'gal Checks'.AllItems,\n            IsBlank(RelatedDeclaredCheck) && (IsBlank(Trim(TextInputCanvas1_1.Value)) || IsBlank(DropdownCanvas2.Selected.Value) || IsBlank(NumberInput1.Text))\n        )\n    ) > 0,\n    Notify(\n        \"Tiene un cheque con informacion incompleta.\",\n        NotificationType.Error\n    );\n    UpdateContext({varAddConfirm: false});\n    \n);\nIf(\n    (Sum(\n        'gal Billetes'.AllItems,\n        Value(lblTotal_1.Text)\n    ) + Sum(\n        'gal Monedas'.AllItems,\n        Value(lblTotal_2.Text)\n    ) + Sum(\n        Filter(\n            'gal Checks'.AllItems,\n            (!IsBlank(RelatedDeclaredCheck) && CheckboxCanvas1.Checked) || IsBlank(RelatedDeclaredCheck)\n        ),\n        Value(NumberInput1.Text)\n    )) <= 0,\n    Notify(\n        \"No hay ningun detalle que agregar.\",\n        NotificationType.Error\n    );\n    UpdateContext({varAddConfirm: false});\n    \n);\nIf(\n    varAddConfirm,\n    Notify(\n        \"Agregar deposito\",\n        NotificationType.Success\n    );\n    UpdateContext({varDialogConfirmarAgregarDeposito: true});\n    ClearCollect(\n        colNewDeposit,\n        Defaults('CH-Tbl-DepositsRecountings')\n    );\n    Clear(colNewDeposit);\n    NewForm(formRecountedDepositNew);\n    Patch(\n        colNewDeposit,\n        Defaults('CH-Tbl-DepositsRecountings'),\n        {\n            BagID: gvarSelectedTula,\n            Currency: DropdownCanvas1.Selected.Value,\n            BACLocalCheckAmount: Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    IsBlank(RelatedDeclaredCheck) && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'BAC Local'\n                ),\n                Value(NumberInput1.Text)\n            ) + Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    !IsBlank(RelatedDeclaredCheck) && CheckboxCanvas1.Checked && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'BAC Local'\n                ),\n                Value(NumberInput1.Text)\n            ),\n            OtherLocaCheckAmount: Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    IsBlank(RelatedDeclaredCheck) && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'Otros Local'\n                ),\n                Value(NumberInput1.Text)\n            ) + Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    !IsBlank(RelatedDeclaredCheck) && CheckboxCanvas1.Checked && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'Otros Local'\n                ),\n                Value(NumberInput1.Text)\n            ),\n            CashAmount: Value(Label6_55.Text),\n            RelatedDeclaredDeposit: If(IsBlank(varSelectedDeclaredDeposit),Blank(),varSelectedDeclaredDeposit)\n            ,AccountNumber: If(IsBlank(varSelectedDeclaredDeposit),Blank(),varSelectedDeclaredDeposit.AccountNumber)\n            ,TransactionNumber: If(IsBlank(varSelectedDeclaredDeposit),Blank(),varSelectedDeclaredDeposit.TransactionNo)\n        }\n    );\n    \n);\n\n"
                                                      Text: ="Agregar"
                                                      Visible: =CountRows(colRecountedMoneyDetails)>0 && (IsBlank(varSelectedRecountedDeposit) || IsBlank(varSelectedRecountedDeposit.'CH-Tbl-DepositsRecounting')) && gvarSelectedTula.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero'
                                                - btnNuevo:
