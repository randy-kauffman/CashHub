',BagID.'CH-Tbl-Bags' = gvarSelectedTula.'CH-Tbl-Bags'));\n\n//UpdateContext({varSelectedRecountedDeposit: Self.LastSubmit});\nResetForm(Self);\nNewForm(Self);\nUpdateContext({varScreenSpinnerMessage: \"\"});\n\n\n\n"
