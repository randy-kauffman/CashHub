                                                      LayoutMaxHeight: =
                                                      LayoutMaxWidth: =
                                                      OnSelect: "=If(\n    gvarSelectedTula.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero',\n    UpdateContext({varDialogConfirmarCerrarDetalleRecuento: true});\n    \n    Clear(colRecountedMoneyDetails);\n    Clear(colChecks);\n    Set(varLimpiarAuto, true);\n    UpdateContext({varSelectedRecountedDeposit: Blank()});\n    Set(\n        gvarSelectedDeclaredDeposit,\n        Blank()\n    );\n    \n)"
                                                      Visible: =!IsBlank(varSelectedRecountedDeposit)
                                                      Width: =20
