                                          OnSelect: "=//Verificar lo siguiente\nClear(colValidacionesCierreTula);\n\n//Inicializando detalles de solicitud en caso de que haya diferencias\nUpdateContext({varRequestDetails: \n    \"<html lang='es'>\n<head>\n    <meta charset='UTF-8'>\n    <title>Diferencias Globales de la Tula</title>\n    <style>\n        body {\n            font-family: 'Segoe UI', sans-serif;\n            background-color: #f9f9f9;\n            margin: 0;\n            padding: 20px;\n        }\n\n        h1 {\n            text-align: center;\n            color: #333;\n            margin-bottom: 40px;\n        }\n\n        h2 {\n            color: #2c3e50;\n            border-bottom: 2px solid #e0e0e0;\n            padding-bottom: 10px;\n            margin-bottom: 20px;\n        }\n\n        table {\n            width: 100%;\n            border-collapse: collapse;\n            margin-top: 10px;\n        }\n\n        td {\n            border: 1px solid #ddd;\n            padding: 10px;\n            text-align: center;\n        }\n\n        th {\n            background-color: #f0f0f0;\n            color: #555;\n	    border: 1px solid #ddd;\n            padding: 10px;\n            text-align: center;\n        }\n    </style>\n</head>\n<body>\"&\n\"<h1>Tula: \"&gvarSelectedTula.BagID&\"</h1>\"\n});\n\n//Haya diferencia global entre lo declarado por bolsa vs lo recontado\nIf( \n    Value(Label6_14.Text)<>0 || Value(Label6_15.Text)<>0 || Value(Label6_16.Text)<>0 //Diferencia en NIO\n    || Value(Label6_29.Text)<>0 || Value(Label6_30.Text)<>0 || Value(Label6_31.Text)<>0 //Diferencia en USD\n    || Value(Label6_45.Text)<>0 || Value(Label6_46.Text)<>0 || Value(Label6_47.Text)<>0, //Diferencia en EUR\n    Collect(\n        colValidacionesCierreTula,\n        {Validacion: \"Existen diferencias globales entre lo declarado versus lo recontado.\"}\n    );\n    UpdateContext({varRequestDetails: varRequestDetails &\n                \"<div class='section'>\n                        <h2>Recontado / Declarado</h2>\n                        <table>\n                            <tr>\n                                <th></th>\n                                <th>NIO</th>\n                                <th>USD</th>\n                                <th>EUR</th>\n                            </tr>\n                            <tr>\n                                <td>Recontado</td>\n                                <td>\"&Text(Value(Label6_7.Text) + Value(Label6_8.Text),\"#,###.00\")&\"</td>\n                                <td>\"&Text(Value(Label6_22.Text) + Value(Label6_23.Text),\"#,###.00\")&\"</td>\n                                <td>\"&Text(Value(Label6_38.Text) + Value(Label6_39.Text),\"#,###.00\")&\"</td>\n                            </tr>\n                            <tr>\n                                <td>Declarado</td>\n                                <td>\"&Text(Value(Label6_11.Text) + Value(Label6_12.Text),\"#,###.00\")&\"</td>\n                                <td>\"&Text(Value(Label6_26.Text) + Value(Label6_27.Text),\"#,###.00\")&\"</td>\n                                <td>\"&Text(Value(Label6_42.Text) + Value(Label6_43.Text),\"#,###.00\")&\"</td>\n                            </tr>\n                            <tr>\n                                <td>Diferencia</td>\n                                <td>\"&Text(Value(Label6_15.Text) + Value(Label6_16.Text),\"#,###.00\")&\"</td>\n                                <td>\"&Text(Value(Label6_30.Text) + Value(Label6_31.Text),\"#,###.00\")&\"</td>\n                                <td>\"&Text(Value(Label6_46.Text) + Value(Label6_47.Text),\"#,###.00\")&\"</td>\n                            </tr>\n                        </table>\n                    </div>\"\n    });\n    \n);\n\n//Haya diferencia por transaccion\nClear(colRecountedDepostiWithDifference);\nForAll(Filter(colRecountedDeposits, !IsBlank(RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits')) As Recounted,\n\nIf( Recounted.CashAmount <> Recounted.RelatedDeclaredDeposit.CashAmount || (Recounted.OtherLocaCheckAmount + Recounted.BACLocalCheckAmount) <> (Recounted.RelatedDeclaredDeposit.OtherLocalCheckAmount + Recounted.RelatedDeclaredDeposit.BACLocalCheckAmount ) ,\n    Collect(\n        colRecountedDepostiWithDifference,\n        {RecountedDeposit: Recounted.'CH-Tbl-DepositsRecounting'\n        ,Currency: Recounted.Currency\n        ,Recounted:  Recounted.CashAmount +  Recounted.BACLocalCheckAmount +  Recounted.OtherLocaCheckAmount\n        ,Declared:  Recounted.RelatedDeclaredDeposit.CashAmount +  Recounted.RelatedDeclaredDeposit.BACLocalCheckAmount +  Recounted.RelatedDeclaredDeposit.OtherLocalCheckAmount\n        ,htmltablerow: \"<tr>\n                            <td>\"&Recounted.Currency&\"</td>\n                            <td>\"&Text(Recounted.CashAmount +  Recounted.BACLocalCheckAmount +  Recounted.OtherLocaCheckAmount,\"#,####.00\")&\"</td>\n                            <td>\"&Text(Recounted.RelatedDeclaredDeposit.CashAmount +  Recounted.RelatedDeclaredDeposit.BACLocalCheckAmount +  Recounted.RelatedDeclaredDeposit.OtherLocalCheckAmount,\"#,####.00\")&\"</td>\n                            <td>\"&Text((Recounted.CashAmount +  Recounted.BACLocalCheckAmount +  Recounted.OtherLocaCheckAmount)- (Recounted.RelatedDeclaredDeposit.CashAmount +  Recounted.RelatedDeclaredDeposit.BACLocalCheckAmount +  Recounted.RelatedDeclaredDeposit.OtherLocalCheckAmount),\"#,####.00\")&\"</td>\n                        </tr>\"}\n    );\n)\n);\n\nIf(CountRows(colRecountedDepostiWithDifference)>0,\nCollect(\n        colValidacionesCierreTula,\n        {Validacion: \"Existen \"&CountRows(colRecountedDepostiWithDifference)&\" depositos con diferencia versus lo declarado.\"}\n    );\n\n    UpdateContext({varRequestDetails: varRequestDetails &\n        \"<div class='section'>\n        <h2>Diferencias por Transacción</h2>\n        <table>\n            <tr>\n                <th>Moneda</th>\n                <th>Monto Recontado</th>\n                <th>Monto Declarado</th>\n                <th>Diferencia</th>\n            </tr>\n            \"&Concat(colRecountedDepostiWithDifference,htmltablerow,\"\")&\"\n        </table>\n    </div>\"\n    \n    });\n\n);\n\n\n//Todos los recuentos esten enlazados\nClearCollect(\n    colRecountedDeposits,\n    Filter(\n        'CH-Tbl-DepositsRecountings',\n        BagID.'CH-Tbl-Bags' = gvarSelectedTula.'CH-Tbl-Bags'\n    )\n);\nUpdateContext(\n    {\n        varQtyDepositosRecontadosHuerfanos: CountRows(\n            Filter(\n                colRecountedDeposits As RecountedDeposits,\n                IsBlank(RecountedDeposits.RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits')\n            )\n        )\n    }\n);\nIf(\n    varQtyDepositosRecontadosHuerfanos > 0,\n    \n    Collect(\n        colValidacionesCierreTula,\n        {Validacion: \"Existen \" & varQtyDepositosRecontadosHuerfanos & \" depositos recontados sin enlazarce.\"}\n    );\n    UpdateContext({varRequestDetails: varRequestDetails &\n        \"<div class='section'>\n        <h2>Depósitos Recontados sin Enlazar</h2>\n        <table>\n            <tr>\n                <th>Moneda</th>\n                <th>Monto</th>\n            </tr>\n            \"&Concat(UpdateIf(\n        AddColumns(colRecountedDeposits,htmltablerow,\"\")\n        , IsBlank(RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits')\n        ,{htmltablerow: \"<tr><td>\"&Currency&\"</td><td>\"&Text(CashAmount +  BACLocalCheckAmount +  OtherLocaCheckAmount,\"#,###.00\")&\"</td></tr>\"}),htmltablerow,\"\")&\"\n        </table>\n    </div>\"           \n    \n    });\n);\n\n//Que todos los cheques declarados esten enlazados\nClear(colOrphanDeclaredCheck);\nForAll(colDeclaredChecks As DeclaredCheck,\n\nIf(IsBlank(LookUp('CH-Tbl-Checks',RelatedDeclaredCheck.'CH-Tbl-DeclaredChecks' = DeclaredCheck.'CH-Tbl-DeclaredChecks')),\nCollect(colOrphanDeclaredCheck, \n{OrphanCheck: DeclaredCheck.'CH-Tbl-DeclaredChecks'\n, htmltablerow:\"<tr>\n                    <td>\"&DeclaredCheck.CheckNumber&\"</td>\n                    <td>\"&DeclaredCheck.CheckType&\"</td>\n                    <td>\"&DeclaredCheck.CheckCurrency&\"</td>\n                    <td>\"&Text(DeclaredCheck.CheckAmount,\"#,###.00\")&\"</td>\n                </tr>\"\n })\n);\n);\n\nIf(CountRows(colOrphanDeclaredCheck)>0,\nCollect(\n        colValidacionesCierreTula,\n        {Validacion: \"Existen \"&CountRows(colOrphanDeclaredCheck)&\" cheques declarados sin ser enlazados.\"}\n    );\nUpdateContext({varRequestDetails: varRequestDetails &\n        \"<div class='section'>\n        <h2>Cheques Declarados sin Enlazar</h2>\n        <table>\n            <tr>\n                <th>Número</th>\n                <th>Tipo</th>\n                <th>Moneda</th>\n                <th>Monto</th>\n            </tr>\n            \"&Concat(colOrphanDeclaredCheck,htmltablerow,\"\")&\"\n        </table>\n    </div>\"           \n    \n    });\n);\n\n\n//Que haya cheques que se agregaron manualmente.\nClear(colBagChecks);\nForAll(colRecountedDeposits As RecountedDeposit,\nCollect(colBagChecks, Filter('CH-Tbl-Checks', RelatedReCounterDepositID.'CH-Tbl-DepositsRecounting' = RecountedDeposit.'CH-Tbl-DepositsRecounting'))\n);\n\nUpdateContext({varManuallyAddedChecks: CountRows(Filter(colBagChecks, IsBlank(RelatedDeclaredCheck.'CH-Tbl-DeclaredChecks')))});\n\nIf(varManuallyAddedChecks>0,\nCollect(\n        colValidacionesCierreTula,\n        {Validacion: \"Existen \"&varManuallyAddedChecks&\" cheques agregados manualmente.\"}\n    );\n\nUpdateContext({varRequestDetails: varRequestDetails &\n        \"<div class='section'>\n        <h2>Cheques Agregados Manualmente</h2>\n        <table>\n            <tr>\n                <th>Número</th>\n                <th>Tipo</th>\n                <th>Moneda</th>\n                <th>Monto</th>\n            </tr>\n            \"&Concat(UpdateIf(\n        AddColumns(colBagChecks,htmltablerow,\"\")\n        , IsBlank(RelatedDeclaredCheck.'CH-Tbl-DeclaredChecks')\n        ,{htmltablerow: \"<tr><td>\"&CheckNumber&\"</td><td>\"&CheckTypes&\"</td><td>\"&CheckCurrency&\"</td><td>\"&Text(CheckAmount,\"#,###.00\")&\"</td></tr>\"}),htmltablerow,\"\")&\"\n        </table>\n    </div>\"  \n});\n);\n\n\nUpdateContext({varRequestDetails: varRequestDetails &\"</body></html>\"});\n\n\n\n\n\n\n\n\n\n\n\n//Todos las declaraciones esten enlazadas\nClearCollect(\n    colDeclaredDeposits,\n    Filter(\n        'CH-Tbl-DeclaredDeposits',\n        DeclaredBag.'CH-Tbl-DeclaredBags' = gvarSelectedTula.BagDeclarationID.'CH-Tbl-DeclaredBags'\n    )\n);\nUpdateContext(\n    {\n        varQtyDepositosDeclaradosHuerfanos: CountRows(\n            Filter(\n                colDeclaredDeposits As DeclaredDeposits,\n                IsBlank(DeclaredDeposits.RelatedRecountedDeposit.'CH-Tbl-DepositsRecounting')\n            )\n        )\n    }\n);\nIf(\n    varQtyDepositosDeclaradosHuerfanos > 0,\n    Collect(\n        colValidacionesCierreTula,\n        {Validacion: \"Existen \" & varQtyDepositosDeclaradosHuerfanos & \" depositos declarados sin enlazarce.\"}\n    );\n     UpdateContext({varRequestDetails: varRequestDetails &\n        \"<div class='section'>\n        <h2>Depósitos Declarados sin Enlazar</h2>\n        <table>\n            <tr>\n                <th>Moneda</th>\n                <th>Monto</th>\n            </tr>\n            \"&Concat(UpdateIf(\n        AddColumns(Filter(\n                colDeclaredDeposits As DeclaredDeposits,\n                IsBlank(DeclaredDeposits.RelatedRecountedDeposit.'CH-Tbl-DepositsRecounting')\n            ),htmltablerow,\"\")\n        , IsBlank(RelatedRecountedDeposit.'CH-Tbl-DepositsRecounting')\n        ,{htmltablerow: \"<tr><td>\"&Currency&\"</td><td>\"&Text(CashAmount +  BACLocalCheckAmount +  OtherLocalCheckAmount,\"#,###.00\")&\"</td></tr>\"}),htmltablerow,\"\")&\"\n        </table>\n    </div>\"           \n    \n    });\n    \n);\n\n\nUpdateContext({varRequestDetails: varRequestDetails &\"</body></html>\"});\n\n\n\n\n\n\n\n\n\n\nIf(!IsEmpty(colValidacionesCierreTula),\nUpdateContext({varDialogConfirmarTerminarTula: true})\n,UpdateContext({varDialogConfirmarTerminarTula: true})\n);"
