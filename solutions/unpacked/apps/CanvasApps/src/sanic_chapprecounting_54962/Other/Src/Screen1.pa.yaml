              		neutralDark: "#201f1e",
              		black: "#000000",
              		white: "#ffffff"
              	}
              }
            Title: ="Confirmacion de terminacion de tula"
            Visible: =varDialogConfirmarTerminarTula
            Width: =Parent.Width
      - container ScreenSpinner:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.8)
            Height: =Parent.Height
            Visible: =!IsBlank(varScreenSpinnerMessage)
            Width: =Parent.Width
          Children:
            - Spinner1:
                Control: Spinner@1.4.6
                Properties:
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =Parent.Height
                  Label: =varScreenSpinnerMessage
                  LabelPosition: ='Spinner.LabelPosition'.Below
                  SpinnerSize: ='Spinner.SpinnerSize'.Huge
                  Width: =Parent.Width
            - Timer1:
                Control: Timer@2.1.0
                Properties:
                  AutoStart: =true && !IsBlank(varPendingApproval)
                  Duration: =5000
                  OnTimerEnd: |-
                    =If(
                        IsBlank(
                            LookUp(
                                'CH-Tbl-ApprovalRequests',
                                'Created By'.User = gvarUser.User &&
                                ApprovalStatus = Blank() && (RequestType = "Crear sesion de recuento" || RequestType = "Tula sin declaracion" || RequestType = "Tula con diferencia" || RequestType = "Tula recontada sin declaracion")
                            )
                        ),
                        Refresh('CH-Tbl-Bags');
                        UpdateContext(
                            {
                                varScreenSpinnerMessage: "",
                                varPendingApproval: Blank()
                            }
                        );Set(gvarSelectedTula, Blank())
                    )
                  OnTimerStart: =Refresh('CH-Tbl-Bags')
                  Repeat: =true
                  Start: =!IsBlank(varPendingApproval)
                  Visible: =false
                  X: =40
                  Y: =40
      - timer CheckSupervisorApproval:
          Control: Timer@2.1.0
          Properties:
            Duration: =5000
            OnTimerEnd: |
              =If(
                  IsBlank(
                      LookUp(
                          'CH-Tbl-Bags',
                          RecountingSession.'CH-Tbl-RecountingSession' = varRecountingSession.'CH-Tbl-RecountingSession' && BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Pendiente de revision por supervisor - recuento'
                      )
                  ),
                  UpdateContext({varScreenSpinnerMessage: ""})
              );
              //Notify("Esta corriendo");
            Repeat: =true
            Start: |-
              =//varScreenSpinnerMessage = "Esperando aprobacion del supervisor"
              false
            Visible: =false
            X: =320
            Y: =74
      - Container3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =false
            X: =60
            Y: =60
          Children:
            - btnCargarDatosTulaSeleccionada:
                Control: Button@0.0.45
                Properties:
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: "=UpdateContext({varScreenSpinnerMessage: \"Cargando datos de tula...\"});\r\nRefresh('CH-Tbl-DepositsRecountings');\r\nClearCollect(colDepositsRecounted, Filter('CH-Tbl-DepositsRecountings',BagID.'CH-Tbl-Bags' = gvarSelectedTula.'CH-Tbl-Bags'));\r\nReset('txtinp NumeroTula');\r\n    Clear(colRecountedMoneyDetails);\r\n    Clear(colChecks);\r\n    UpdateContext({varSelectedRecountedDeposit: Blank()});\r\n    Set(gvarSelectedDeclaredDeposit, Blank());\r\nClear(colSecurityBagSelectionState);\r\nClearCollect(\r\n    colRecountedMoneyDetails,\r\n    Defaults('CH-Tbl-CountedMoneyDetails')\r\n);\r\nClear(colRecountedMoneyDetails);\r\nForAll(\r\n    Filter(\r\n        colDefinedDenominations,\r\n        Currency = 'CH-Ch-Currency'.NIO\r\n    ) As Denomination,\r\n    Patch(\r\n        colRecountedMoneyDetails,\r\n        Defaults('CH-Tbl-CountedMoneyDetails'),\r\n        {\r\n            DenominationType: If(\r\n                Denomination.Type = 'Type (CH-Tbl-MoneyDenominations)'.Billete,\r\n                \"Billete\",\r\n                \"Moneda\"\r\n            ),\r\n            Quantity: 0,\r\n            Denomination: Denomination.Value\r\n        }\r\n    );\r\n    \r\n);\r\nClear(colRecountedMoneyDetails);\r\nClear(colDeclaredChecks);\r\nForAll(\r\n    LookUp(\r\n        'CH-Tbl-DeclaredBags',\r\n        BagID.'CH-Tbl-Bags' = gvarSelectedTula.'CH-Tbl-Bags'\r\n    ).'CH-Tbl-DeclaredDeposits' As DeclaredDeposit,\r\n    Collect(\r\n        colDeclaredChecks,\r\n        Filter(\r\n            'CH-Tbl-DeclaredChecks',\r\n            DeclaredDepositID.'CH-Tbl-DeclaredDeposits' = DeclaredDeposit.'CH-Tbl-DeclaredDeposits'\r\n        )\r\n    )\r\n);\r\nClearCollect(\r\n    colChecks,\r\n    AddColumns(Defaults('CH-Tbl-Checks'),Selected,true, OrderID, 0)\r\n);\r\nClear(colChecks);\r\nUpdateContext({varScreenSpinnerMessage: \"\"});"
