                                                    Properties:
                                                      BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                      BorderRadius: =10
                                                      LayoutMaxHeight: =
                                                      LayoutMaxWidth: =
                                                      OnSelect: "=UpdateContext({varUpdateConfirm: true});\nIf(\n    CountRows(\n        Filter(\n            'gal Checks'.AllItems,\n            (!IsBlank(RelatedDeclaredCheck) && CheckboxCanvas1.Checked)\n        )\n    ) > 0 && IsBlank(varSelectedRecountedDeposit.RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits'),\n    Notify(\n        \"Tienes seleccionado un cheque declarado. No puedes actualizar un recuento con cheques declarado sin antes enlazarlo.\",\n        NotificationType.Error\n    );\n    UpdateContext({varUpdateConfirm: false});\n    \n);\nIf(\n    CountRows(\n        Filter(\n            'gal Checks'.AllItems,\n            IsBlank(RelatedDeclaredCheck) && (IsBlank(Trim(TextInputCanvas1_1.Value)) || IsBlank(DropdownCanvas2.Selected.Value) || IsBlank(NumberInput1.Text))\n        )\n    ) > 0,\n    Notify(\n        \"Tiene un cheque con informacion incompleta.\",\n        NotificationType.Error\n    );\n    UpdateContext({varUpdateConfirm: false});\n    \n);\nIf(\n    (Sum(\n        'gal Billetes'.AllItems,\n        Value(lblTotal_1.Text)\n    ) + Sum(\n        'gal Monedas'.AllItems,\n        Value(lblTotal_2.Text)\n    ) + Sum(\n        Filter(\n            'gal Checks'.AllItems,\n            (!IsBlank(RelatedDeclaredCheck) && CheckboxCanvas1.Checked) || IsBlank(RelatedDeclaredCheck)\n        ),\n        Value(NumberInput1.Text)\n    )) <= 0,\n    Notify(\n        \"No hay ningun detalle que agregar.\",\n        NotificationType.Error\n    );\n    UpdateContext({varUpdateConfirm: false});\n    \n);\nIf(\n    varUpdateConfirm,\n    EditForm(formRecountedDepositUpdate);\n    Clear(colNewDeposit);\n    Patch(\n        colNewDeposit,\n        LookUp(\n            'CH-Tbl-DepositsRecountings',\n            'CH-Tbl-DepositsRecounting' = varSelectedRecountedDeposit.'CH-Tbl-DepositsRecounting'\n        ),\n        {\n            BagID: gvarSelectedTula,\n            Currency: DropdownCanvas1.Selected.Value,\n            BACLocalCheckAmount: Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    IsBlank(RelatedDeclaredCheck) && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'BAC Local'\n                ),\n                Value(NumberInput1.Text)\n            ) + Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    !IsBlank(RelatedDeclaredCheck) && CheckboxCanvas1.Checked && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'BAC Local'\n                ),\n                Value(NumberInput1.Text)\n            ),\n            OtherLocaCheckAmount: Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    IsBlank(RelatedDeclaredCheck) && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'Otros Local'\n                ),\n                Value(NumberInput1.Text)\n            ) + Sum(\n                Filter(\n                    'gal Checks'.AllItems,\n                    !IsBlank(RelatedDeclaredCheck) && CheckboxCanvas1.Checked && DropdownCanvas2.Selected.Value = 'CheckTypes (CH-Tbl-Checks)'.'Otros Local'\n                ),\n                Value(NumberInput1.Text)\n            ),\n            CashAmount: Value(Label6_55.Text)\n        }\n    );\n    Notify(\n        \"Actualizar deposito\",\n        NotificationType.Success\n    );\n    UpdateContext({varDialogConfirmarActualizarDeposito: true})\n);\n"
                                                      Text: ="Actualizar"
                                                      Visible: =(CountRows(colRecountedMoneyDetails)>0 && !IsBlank(varSelectedRecountedDeposit) && gvarSelectedTula.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero') && !IsBlank(varSelectedRecountedDeposit.'CH-Tbl-DepositsRecounting')
                                                - DropdownCanvas1:
                                                    Control: DropDown@0.0.45
                                                    Properties:
                                                      Appearance: ='DropdownCanvas.Appearance'.Outline
                                                      DefaultSelectedItems: =[If(IsBlankOrError(varSelectedRecountedDeposit.Currency) ,'CH-Ch-Currency'.NIO,varSelectedRecountedDeposit.Currency)]
                                                      Items: =['CH-Ch-Currency'.NIO,'CH-Ch-Currency'.USD,'CH-Ch-Currency'.EUR]
                                                      LayoutMaxHeight: =
                                                      LayoutMaxWidth: =
                                                      OnChange: "=UpdateContext({varCurrencyChangeAllow: true});\nIf(\n    !IsBlank(varSelectedRecountedDeposit.RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits'),\n    UpdateContext({varCurrencyChangeAllow: false});\n    Notify(\n        \"No puedes cambiar de moneda si el recuento esta enlazada con una declaracion\",\n        NotificationType.Warning\n    );\n    Reset(Self);\n    \n);\nIf(\n    varCurrencyChangeAllow,\n    If(\n        (Sum(\n            'gal Billetes'.AllItems,\n            Value(lblTotal_1.Text)\n        ) + Sum(\n            'gal Monedas'.AllItems,\n            Value(lblTotal_2.Text)\n        )) > 0 || CountRows(\n            Filter(\n                colChecks,\n                IsBlank(RelatedDeclaredCheck)\n            )\n        ) > 0,\n        UpdateContext({varDialogConfirmarCambioMoneda: true}),\n        Clear(colRecountedMoneyDetails);\n        ForAll(\n            Filter(\n                colDefinedDenominations,\n                Currency = Self.Selected.Value\n            ) As Denomination,\n            Patch(\n                colRecountedMoneyDetails,\n                Defaults('CH-Tbl-CountedMoneyDetails'),\n                {\n                    DenominationType: If(\n                        Denomination.Type = 'Type (CH-Tbl-MoneyDenominations)'.Billete,\n                        \"Billete\",\n                        \"Moneda\"\n                    ),\n                    Quantity: 0,\n                    Denomination: Denomination.Value\n                }\n            );\n        );\n        RemoveIf(\n            colChecks,\n            IsBlank(RelatedDeclaredCheck)\n        );\n        If(\n            Self.Selected.Value = varSelectedRecountedDeposit.Currency,\n            ClearCollect(\n                colRecounted,\n                varSelectedRecountedDeposit.'CH-Tbl-CountedMoneyDetails'\n            );\n            ForAll(\n                colRecounted As MoneyDetails,\n                RemoveIf(\n                    colRecountedMoneyDetails,\n                    DenominationType = MoneyDetails.DenominationType && Denomination = MoneyDetails.Denomination\n                );\n                Collect(\n                    colRecountedMoneyDetails,\n                    MoneyDetails\n                );\n            )\n        )\n    )\n)"
                                                      Visible: =CountRows(colRecountedMoneyDetails)>0 && gvarSelectedTula.BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero'
