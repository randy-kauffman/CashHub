                                    Width: =Parent.Width
                                  Children:
                                    - txtinp NumeroTula:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          BorderColor: =RGBA(219, 219, 219, 1)
                                          BorderThickness: =1
                                          Default: =
                                          FocusedBorderThickness: =1
                                          Height: =32
                                          Size: =10
                                          X: =(Parent.Width - Self.Width)/2
                                          Y: ='lbl MoneyBagSelecctionDialogSubTitle'.Y + 'lbl MoneyBagSelecctionDialogSubTitle'.Height + 20
                                    - btn IngresarTula:
                                        Control: Button@0.0.45
                                        Properties:
                                          DisplayMode: =If(IsBlank(Trim('txtinp NumeroTula'.Text)),DisplayMode.Disabled,DisplayMode.Edit)
                                          OnSelect: "=\nRefresh('CH-Tbl-Bags');\nRefresh('CH-Tbl-DeclaredBags');\nClearCollect(\n    colSecurityBagSelectionState,\n    {\n        ID: Trim('txtinp NumeroTula'.Text),\n        State: \"Init\",\n        ReceivedBag: {},\n        DeclaredBag: {}\n    }\n);\nUpdateContext({varScreenSpinnerMessage: \"Cargando...\"});\nUpdateContext({varSelectedDeclaredBag: Blank(), varSelectedReceiptBag: Blank()});\nConcurrent(\n//Inicio Concurrente\n//Obtener todas las bolsas recibidas en esclusa. \n    ClearCollect(\n        colMatchingReceivedBags,\n        Filter(\n            'CH-Tbl-Bags',\n            BagID = First(colSecurityBagSelectionState).ID && (BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa' || BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda' || BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero')\n        )\n    ),\n//Obtener bolsas declaradas con numero de bolsa igual a la escrita.\n    ClearCollect(\n        colMatchingDeclaredBags,\n        Filter(\n            'CH-Tbl-DeclaredBags',\n            BagNumber = First(colSecurityBagSelectionState).ID\n        )\n    );\n    ClearCollect(\n        colMatchingDeclaredBags,\n        Filter(\n            colMatchingDeclaredBags,\n            IsBlank(BagID)\n        )\n    );  \n//Fin concurrente\n);\n\n//Verificar bolsas recibidas en esclusa\nIf(\n    //Si no hay ninguna bolsa recibida, notificar que no hay y no hacer nada mas\n    CountRows(colMatchingReceivedBags) = 0,\n    Notify(\n        \"La bolsa no ha sido registrada en esclusa, no puede ser procesada.\",\n        NotificationType.Error\n    );\n    UpdateIf(\n        colSecurityBagSelectionState,\n        true,\n        {State: \"NoRecibioEsclusa\"}\n    );  \n);\n\n//Si hay mas de una sola bolsa, cruzar al status de seleccion de bolsa\nIf(\n    CountRows(colMatchingReceivedBags) > 1,\n    Notify(\"Se encontro mas de una tula registrada con este numero que aun no ha sido procesada, escoge la tula manualmente.\");\n    UpdateIf(\n        colSecurityBagSelectionState,\n        true,\n        {State: \"Recibido-Pendiente\"}\n    );\n    //UpdateContext({varSelectedReceiptBag: First(colMatchingReceivedBags)});\n    \n);\n\n//Si solo hay una bolsa, escoger esa bolsa y asignarla a la variable.\nIf(\n    CountRows(colMatchingReceivedBags) = 1,\n    If(\n        //Antes de asignarla, verifica que este en status de \"Almacenada en boveda\". \n        First(colMatchingReceivedBags).BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda',\n        Notify(\"Se ha encontrado una sola bolsa, se selecciona automaticamente.\");\n        UpdateIf(\n            colSecurityBagSelectionState,\n            true,\n            {ReceivedBag: First(colMatchingReceivedBags)}\n        );\n\n        Patch(\n            'CH-Tbl-RecountingSessionDetails',\n            Defaults('CH-Tbl-RecountingSessionDetails'),\n            {\n                RecountingSessionId: varRecountingSession,\n                BagId: LookUp('CH-Tbl-Bags', BagID = First(colSecurityBagSelectionState).ID)\n            \n            }\n        );\n        \n        UpdateContext({varSelectedReceiptBag: First(colMatchingReceivedBags)});\n        ,\n        //Si no esta en \"Almacenada en boveda\" significa que alguien mas tiene asignada esa bolsa.\n        Notify(\n            \"No se pudo seleccionar automaticamente la unica bolsa registrada que se encontro, favor seleccionela manualmente\",\n            NotificationType.Warning\n        );\n        UpdateIf(\n            colSecurityBagSelectionState,\n            true,\n            {State: \"Recibido-Pendiente\"}\n        );\n    )\n);\n\n//Verificar bolsas declaradas siempre y cuando no se tenga que seleccionar declarado\n//La unica forma que entre en este camino es que el \"state\" no haya sido modificado previamente por otra accion\n//La unica accion que no lo modifica es cuando encuentra una sola bolsa y la bolsa es asignable.\nIf(\n    First(colSecurityBagSelectionState).State = \"Init\",\n    //Verificar si hay declaraciones de bolsas con el numero de bolsa digitado.\n    If(\n        //Si no hay, mandar notificacion y mover a status \"SinDeclaracion\".\n        CountRows(colMatchingDeclaredBags) = 0,\n        Notify(\n            \"La bolsa no ha sido registrada por el cliente, favor confirmar si se desea proceder.\",\n            NotificationType.Error\n        );\n        UpdateIf(\n            colSecurityBagSelectionState,\n            true,\n            {State: \"SinDeclaracion\"}\n        );\n    );\n\n    //Si hay mas de una bolsa, mover a pantalla donde se pueda seleccionar la tula declarada.\n    If(\n        CountRows(colMatchingDeclaredBags) > 1,\n        Notify(\"Se encontro mas de una tula registrada por el cliente con este numero, escoge la tula manualmente.\");\n        UpdateIf(\n            colSecurityBagSelectionState,\n            true,\n            {State: \"Declarado-Pendiente\"}\n        );\n    );\nUpdateContext({varScreenSpinnerMessage: \"\"});\n    //Si hay una sola bolsa, seleccionarla.\n    If(\n        CountRows(colMatchingDeclaredBags) = 1,\n        UpdateContext({varScreenSpinnerMessage: \"Enlazando tulas...\"});\n        UpdateIf(\n            colSecurityBagSelectionState,\n            true,\n            {\n                DeclaredBag: First(colMatchingDeclaredBags),\n                State: \"Declarado-Seleccionado\"\n            }\n        );\n        UpdateContext({varSelectedDeclaredBag: First(colMatchingDeclaredBags)});\n\n        If(\n            //Verificar que si premiamente se habia abierto alguna bolsa de esta misma planilla en la sesion de recuento actual\n            /*!IsBlank(\n                LookUp(\n                    'CH-Tbl-Bags',\n                    ReceptionID.'CH-Tbl-Receptions' = varSelectedReceiptBag.ReceptionID.'CH-Tbl-Receptions' && RecountingSession.'CH-Tbl-RecountingSession' = varRecountingSession.'CH-Tbl-RecountingSession'\n                )\n            )*/\n            //A solicitud de negocio, se omite esta logica.\n            true,\n            Patch(\n                'CH-Tbl-Bags',\n                varSelectedReceiptBag,\n                {\n                    BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero',\n                    RecountingSession: varRecountingSession,\n                    BagDeclarationID: varSelectedDeclaredBag\n                }\n            );\n            Patch(\n                'CH-Tbl-DeclaredBags',\n                varSelectedDeclaredBag,\n                {BagID: varSelectedReceiptBag}\n            );\n            Refresh('CH-Tbl-Bags');\n            Refresh('CH-Tbl-DeclaredBags');\n            Set(\n                gvarSelectedTula,\n                LookUp(\n                    'CH-Tbl-Bags',\n                    'CH-Tbl-Bags' = varSelectedReceiptBag.'CH-Tbl-Bags'\n                )\n            );\n            Select(btnCargarDatosTulaSeleccionada);\n            ,\n            UpdateIf(\n                colSecurityBagSelectionState,\n                true,\n                {State: \"Confirmacion\"}\n            );\n        )\n    )\n);\nUpdateContext({varScreenSpinnerMessage: \"\"});"
                                          Text: ="Confirmar"
                                          X: =(Parent.Width - Self.Width) / 2
                                          Y: =(Parent.Height - Self.Height - 20)
                                    - lbl MoneyBagSelecctionDialogSubTitle:
