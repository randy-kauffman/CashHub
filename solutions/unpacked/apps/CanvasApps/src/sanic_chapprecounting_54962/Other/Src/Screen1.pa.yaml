                                                      OnSelect: "=ClearCollect(\n    colRecountedMoneyDetails,\n    Defaults('CH-Tbl-CountedMoneyDetails')\n);\nClear(colRecountedMoneyDetails);\nSet(varLimpiarAuto, true);\n\nUpdateContext({varSelectedRecountedDeposit: Defaults('CH-Tbl-DepositsRecountings')});\nForAll(\n    Filter(\n        colDefinedDenominations,\n        Currency = 'CH-Ch-Currency'.NIO\n    ) As Denomination,\n    Patch(\n        colRecountedMoneyDetails,\n        Defaults('CH-Tbl-CountedMoneyDetails'),\n        {\n            DenominationType: If(\n                Denomination.Type = 'Type (CH-Tbl-MoneyDenominations)'.Billete,\n                \"Billete\",\n                \"Moneda\"\n            ),\n            Quantity: 0,\n            Denomination: Denomination.Value\n        }\n    );\n    \n);"
