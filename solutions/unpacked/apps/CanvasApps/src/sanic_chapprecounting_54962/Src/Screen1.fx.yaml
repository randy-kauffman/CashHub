Screen1 As screen:
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |
        =
        Refresh('CH-Tbl-Bags');
        Refresh('CH-Tbl-ApprovalRequests');
        Refresh('CH-Tbl-RecountingSessions');
        NewForm(Form1);
        //Check if exist a current recounting session available.
        UpdateContext(
            {
                varRecountingSession: LookUp(
                    'CH-Tbl-RecountingSessions',
                    Cashier.User = gvarUser.User  && 'Created On' >= Today() && 'Created On' < DateAdd(
                        Today(),
                        1,
                        TimeUnit.Days
                    )
                )
            }
        );
        ClearCollect(
            colDefinedDenominations,
            Filter(
                'CH-Tbl-MoneyDenominations',
                Enabled = true
            )
        );
        If(
            IsBlank(
                LookUp(
                    'CH-Tbl-Bags',
                    RecountingSession.'CH-Tbl-RecountingSession' = varRecountingSession.'CH-Tbl-RecountingSession' && BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Pendiente de revision por supervisor - recuento'
                )
            ),
            UpdateContext({varScreenSpinnerMessage: ""})
        );
        //
        Clear(colSecurityBagSelectionState);
        //Revisar si hay aprobaciones pendientes
        
        If(
            !IsBlank(
                LookUp(
                    'CH-Tbl-ApprovalRequests',
                    'Created By'.User = gvarUser.User && ApprovalStatus = Blank() && (RequestType = "Crear sesion de recuento" || RequestType = "Tula sin declaracion" || RequestType = "Tula con diferencia" || RequestType = "Tula recontada sin declaracion")
                )
            ),
            UpdateContext(
                {
                    varScreenSpinnerMessage: "Esperando aprobacion del supervisor",
                    varPendingApproval: LookUp(
                        'CH-Tbl-ApprovalRequests',
                        'Created By'.User = gvarUser.User && ApprovalStatus = Blank() && (RequestType = "Crear sesion de recuento" || RequestType = "Tula sin declaracion" || RequestType = "Tula con diferencia" || RequestType = "Tula recontada sin declaracion")
                    )
                }
            );
            Set(
                gvarSelectedTula,
                Blank()
            ),
            UpdateContext({varPendingApproval: Blank()})
        );
        
        // CODIGO NUEVO: 17/06/2026
        // Obtener aprobación pendiente (UNA sola vez)
        UpdateContext({
            varPendingApproval:
                LookUp(
                    'CH-Tbl-ApprovalRequests',
                    'Created By'.User = gvarUser.User &&
                    ApprovalStatus = Blank() &&
                    (
                        RequestType = "Crear sesion de recuento" ||
                        RequestType = "Tula sin declaracion" ||
                        RequestType = "Tula con diferencia" ||
                        RequestType = "Tula recontada sin declaracion"
                    )
                )
        });
        
        // Mensaje del spinner
        UpdateContext({
            varScreenSpinnerMessage:
                If(
                    !IsBlank(varPendingApproval),
                    "Esperando aprobacion del supervisor",
                    ""
                )
        });
        
        // Limpiar tula si hay pendiente
        If(
            !IsBlank(varPendingApproval),
            Set(gvarSelectedTula, Blank())
        )

