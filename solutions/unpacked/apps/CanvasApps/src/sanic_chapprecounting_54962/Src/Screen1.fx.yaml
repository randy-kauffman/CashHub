    dialog_ConfirmarTerminarTula As Dialog:
        Buttons: |-
            =Table({Label: "Cancelar", ButtonType:'Button.ButtonType'.Standard, HasBorder: false }, {Label: "Continuar", ButtonType:'Button.ButtonType'.Primary, HasBorder: false })
        ChildTabPriority: =true
        ContentLanguage: =""
        DialogHeight: =Min(250 + CountRows(colValidacionesCierreTula)*30, 700)
        EnableChildFocus: =true
        Fill: =dialog_ConfirmarTerminarTula.OverlayColor
        Height: =Parent.Height
        OnButtonSelect: |
            =If(
                Self.SelectedButton.Label = "Continuar",
                If(CountRows(colValidacionesCierreTula)>0,
                Patch(
                    'CH-Tbl-Bags',
                    gvarSelectedTula,
                    {
                        TotalNIO: Sum(
                            Filter(
                                colRecountedDeposits,
                                Currency = 'CH-Ch-Currency'.NIO
                            ),
                            CashAmount + OtherLocaCheckAmount + BACLocalCheckAmount
                        )
                        ,TotalUSD: Sum(
                            Filter(
                                colRecountedDeposits,
                                Currency = 'CH-Ch-Currency'.USD
                            ),
                            CashAmount + OtherLocaCheckAmount + BACLocalCheckAmount
                        )
                        ,TotalEUR: Sum(
                            Filter(
                                colRecountedDeposits,
                                Currency = 'CH-Ch-Currency'.EUR
                            ),
                            CashAmount + OtherLocaCheckAmount + BACLocalCheckAmount
                        )
                        ,BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Pendiente de revision por supervisor - recuento'
                    }
                );
                Set(
                    gvarSelectedDeclaredDeposit,
                    Blank()
                );
                UpdateContext({varSelectedRecountedDeposit: Blank()});
                Patch(
                                'CH-Tbl-ApprovalRequests',
                                Defaults('CH-Tbl-ApprovalRequests'),
                                {
                                    RequestType: If(IsBlank(gvarSelectedTula.BagDeclarationID),"Tula recontada sin declaracion", "Tula con diferencia"),
                                    RequestDetails: varRequestDetails,
                                    RequestResources: "{" & Concatenate(
                                        """",
                                        "BagGUID",
                                        """",
                                        ":",
                                        """",
                                        gvarSelectedTula.'CH-Tbl-Bags',
                                        """"
                                    )  & "}"
                                }
                            );
                Clear(colDeclaredChecks);
                Clear(colChecks);
                Clear(colBagChecks);
                Clear(colRecountedMoneyDetails);
                Set(gvarSelectedDeclaredDeposit, Blank());
                Set(gvarSelectedTula, Blank());
                UpdateContext({varScreenSpinnerMessage: "Esperando aprobacion del supervisor..."});
                UpdateContext({varPendingApproval: Defaults('CH-Tbl-ApprovalRequests')});
                ,
                Patch(
                    'CH-Tbl-Bags',
                    gvarSelectedTula,
                    {
                        TotalNIO: Sum(
                            Filter(
                                colRecountedDeposits,
                                Currency = 'CH-Ch-Currency'.NIO
                            ),
                            CashAmount + OtherLocaCheckAmount + BACLocalCheckAmount
                        )
                        ,TotalUSD: Sum(
                            Filter(
                                colRecountedDeposits,
                                Currency = 'CH-Ch-Currency'.USD
                            ),
                            CashAmount + OtherLocaCheckAmount + BACLocalCheckAmount
                        )
                        ,TotalEUR: Sum(
                            Filter(
                                colRecountedDeposits,
                                Currency = 'CH-Ch-Currency'.EUR
                            ),
                            CashAmount + OtherLocaCheckAmount + BACLocalCheckAmount
                        )
                        ,BagStatus: 'BagStatus (CH-Tbl-Bags)'.Recontada
                    });
                    UpdateIf('CH-Tbl-Checks',RelatedReCounterDepositID.BagID.'CH-Tbl-Bags' = gvarSelectedTula.'CH-Tbl-Bags',{CheckStatus: 'CheckStatus (CH-Tbl-Checks)'.Recontado});
                    ForAll(colRecountedDeposits As Recounted,
            
                    Patch('CH-Tbl-Transactions', Defaults('CH-Tbl-Transactions'),
                    {
                        AccountNumber: Recounted.AccountNumber
                        ,Currency: Recounted.Currency
                        ,CashAmount: Recounted.CashAmount
                        ,BACLocalCheckAmount: Recounted.BACLocalCheckAmount
                        ,OtherLocalCheckAmount: Recounted.OtherLocaCheckAmount
                        ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.Deposito
                        ,RelatedDepositRecounting: Recounted
                        ,TransactionReference: Recounted.RelatedDeclaredDeposit.DepositReference
                        ,TransactionNumber: Recounted.RelatedDeclaredDeposit.TransactionNo
                        ,TransactionProcessingType: If(Recounted.BACLocalCheckAmount>0 || Recounted.OtherLocaCheckAmount>0,'TransactionProcessingType (CH-Tbl-Transactions)'.Manual, 'TransactionProcessingType (CH-Tbl-Transactions)'.Batch)
                    }
                    )
                );
                Set(gvarSelectedDeclaredDeposit, Blank());
                Set(gvarSelectedTula, Blank());
                Refresh('CH-Tbl-Bags');
                )
            );
            UpdateContext({varDialogConfirmarTerminarTula: false});
        OnCloseSelect: |-
            =UpdateContext({varDialogConfirmarTerminarTula: false});
        SubTitle: |-
            =If(CountRows(colValidacionesCierreTula)>0,"Se ha encontrado discrepancias dentro de la tula, se enviara una solicitud de revision al supervisor con el siguiente detalle: "&Char(10)&Char(10)&Concat(colValidacionesCierreTula,Validacion,Char(10))&Char(10)&Char(10)&"¿Desea continuar?", "No se encontro ninguna discrepancia en el recuento"&Char(10)&Char(10)&"¿Desea continuar?")
        Title: ="Confirmacion de terminacion de tula"
        Visible: =varDialogConfirmarTerminarTula
        Width: =Parent.Width
        ZIndex: =11

