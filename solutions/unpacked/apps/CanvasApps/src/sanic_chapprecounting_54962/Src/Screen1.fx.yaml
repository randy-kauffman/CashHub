    dialog_ConfirmarCambioMoneda As Dialog:
        Buttons: |-
            =Table({Label: "Cancelar", ButtonType:'Button.ButtonType'.Standard, HasBorder: false }, {Label: "Continuar", ButtonType:'Button.ButtonType'.Primary, HasBorder: false })
        DialogHeight: =220
        Fill: =dialog_ConfirmarCambioMoneda.OverlayColor
        Height: =Parent.Height
        OnButtonSelect: |
            =If(
                Self.SelectedButton.Label = "Continuar",
                UpdateContext({varScreenSpinnerMessage: "Cambiando moneda de recuento de deposito..."});
                Clear(colRecountedMoneyDetails);
                Clear(colRecountedMoneyDetails);
                ForAll(
                    Filter(
                        colDefinedDenominations,
                        Currency = DropdownCanvas1.Selected.Value
                    ) As Denomination,
                    Patch(
                        colRecountedMoneyDetails,
                        Defaults('CH-Tbl-CountedMoneyDetails'),
                        {
                            DenominationType: If(
                                Denomination.Type = 'Type (CH-Tbl-MoneyDenominations)'.Billete,
                                "Billete",
                                "Moneda"
                            ),
                            Quantity: 0,
                            Denomination: Denomination.Value
                        }
                    );
                );
                RemoveIf(
                    colChecks,
                    IsBlank(RelatedDeclaredCheck)
                );
                Reset('gal Checks');
                If(
                    varSelectedRecountedDeposit.Currency = DropdownCanvas1.Selected.Value,
                    ClearCollect(
                        colRecounted,
                        varSelectedRecountedDeposit.'CH-Tbl-CountedMoneyDetails'
                    );
                    ForAll(
                        colRecounted As MoneyDetails,
                        RemoveIf(
                            colRecountedMoneyDetails,
                            DenominationType = MoneyDetails.DenominationType && Denomination = MoneyDetails.Denomination
                        );
                        Collect(
                            colRecountedMoneyDetails,
                            MoneyDetails
                        );
                    )
                );
                Set(gvarSelectedDeclaredDeposit, Blank());
                UpdateContext({varScreenSpinnerMessage: ""})
            );
            UpdateContext({varDialogConfirmarCambioMoneda: false});
        OnCloseSelect: |-
            =UpdateContext({varDialogConfirmarCambioMoneda: false});
        SubTitle: ="Ya ha agregado detalles del recuento en algunas denominaciones, al cambiar la moneda se borrara todo el detalle del efectivo y cheques relacionados, ¿Desea continuar?"
        Title: ="Confirmacion de cambio de moneda"
        Visible: =varDialogConfirmarCambioMoneda
        Width: =Parent.Width
        ZIndex: =4

