                                formRecountedDepositNew As form.PowerApps_CoreControls_Form:
                                    AcceptsFocus: =false
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =App.Theme.Colors.Darker40
                                    DataSource: ='CH-Tbl-DepositsRecountings'
                                    FillPortions: =0
                                    Height: =1
                                    Item: =LookUp('CH-Tbl-DepositsRecountings','CH-Tbl-DepositsRecounting'= varSelectedRecountedDeposit.'CH-Tbl-DepositsRecounting')
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =1
                                    LayoutMinWidth: =1
                                    OnFailure: |-
                                        =UpdateContext({varScreenSpinnerMessage: ""})
                                    OnSuccess: |+
                                        =UpdateContext({varRecountedDeposit: Self.LastSubmit});
                                        Notify("Deposito creado");
                                        //Updating Cash details
                                        Patch(
                                                'CH-Tbl-DepositsRecountings',
                                                Self.LastSubmit,
                                                {
                                                    RelatedDeclaredDeposit: gvarSelectedDeclaredDeposit,
                                                    AccountNumber: gvarSelectedDeclaredDeposit.AccountNumber
                                                }
                                            );
                                            Patch(
                                                'CH-Tbl-DeclaredDeposits',
                                                gvarSelectedDeclaredDeposit,
                                                {RelatedRecountedDeposit: Self.LastSubmit}
                                            );
                                        Refresh('CH-Tbl-DeclaredDeposits');Refresh('CH-Tbl-DepositsRecountings');
                                        ForAll(
                                            Filter(
                                                colRecountedMoneyDetails,
                                                Quantity > 0
                                            ) As Money,
                                            Patch(
                                                'CH-Tbl-CountedMoneyDetails',
                                                Money,
                                                {
                                                    RelatedDepositRecountingID: varRecountedDeposit,
                                                    Denomination: Money.Denomination,
                                                    DenominationType: Money.DenominationType,
                                                    Quantity: Money.Quantity
                                                }
                                            );
                                            
                                        );
                                        //Update Cheques
                                        
                                        ForAll(
                                            DropColumns(
                                                Filter(
                                                    colChecks,
                                                    IsBlank(RelatedDeclaredCheck) || Selected
                                                ),
                                                Selected,
                                                OrderID
                                            ) As Check,
                                            Patch(
                                                'CH-Tbl-Checks',
                                                Check,
                                                {
                                                    RelatedReCounterDepositID: varRecountedDeposit,
                                                    RelatedDeclaredCheck: Check.RelatedDeclaredCheck,
                                                    CheckTypes: Check.CheckTypes,
                                                    CheckCurrency: Check.CheckCurrency,
                                                    CheckNumber: Check.CheckNumber,
                                                    CheckAmount: Check.CheckAmount
                                                }
                                            );
                                            
                                        );
                                        Clear(colChecks);
                                        Clear(colRecountedMoneyDetails);
                                        UpdateContext({varSelectedRecountedDeposit: Blank()});
                                        Clear(colDeletedChecks);
                                        Set(gvarSelectedDeclaredDeposit, Blank());
                                        Refresh('CH-Tbl-DepositsRecountings');
                                        Refresh('CH-Tbl-Checks');
                                        Refresh('CH-Tbl-DeclaredChecks');
                                        ClearCollect(colDepositsRecounted, Filter('CH-Tbl-DepositsRecountings',BagID.'CH-Tbl-Bags' = gvarSelectedTula.'CH-Tbl-Bags'));
                                        
                                        //UpdateContext({varSelectedRecountedDeposit: Self.LastSubmit});
                                        ResetForm(Self);
                                        NewForm(Self);
                                        UpdateContext({varScreenSpinnerMessage: ""});
                                        
                                        
                                        
