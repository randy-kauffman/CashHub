                            DisabledFill: =RGBA(244, 244, 244, 1)
                            FocusedBorderThickness: =1
                            Font: =App.Theme.Font
                            Height: =32
                            HoverBorderColor: =App.Theme.Colors.Darker40
                            HoverColor: =RGBA(0, 0, 0, 1)
                            HoverFill: =App.Theme.Colors.Lighter70
                            Size: =10
                            X: =(Parent.Width - Self.Width)/2
                            Y: ='lbl MoneyBagSelecctionDialogSubTitle'.Y + 'lbl MoneyBagSelecctionDialogSubTitle'.Height + 20
                            ZIndex: =2

                        "'btn IngresarTula' As Button":
                            BasePaletteColor: =
                            BorderColor: =
                            DisplayMode: =If(IsBlank(Trim('txtinp NumeroTula'.Text)),DisplayMode.Disabled,DisplayMode.Edit)
                            FontColor: =
                            Height: =32
                            OnSelect: |-
                                =
                                Refresh('CH-Tbl-Bags');
                                Refresh('CH-Tbl-DeclaredBags');
                                ClearCollect(
                                    colSecurityBagSelectionState,
                                    {
                                        ID: Trim('txtinp NumeroTula'.Text),
                                        State: "Init",
                                        ReceivedBag: {},
                                        DeclaredBag: {}
                                    }
                                );
                                UpdateContext({varScreenSpinnerMessage: "Cargando..."});
                                UpdateContext({varSelectedDeclaredBag: Blank(), varSelectedReceiptBag: Blank()});
                                Concurrent(
                                //Inicio Concurrente
                                //Obtener todas las bolsas recibidas en esclusa. 
                                    ClearCollect(
                                        colMatchingReceivedBags,
                                        Filter(
                                            'CH-Tbl-Bags',
                                            BagID = First(colSecurityBagSelectionState).ID && (BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Recibida en esclusa' || BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda' || BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero')
                                        )
                                    ),
                                //Obtener bolsas declaradas con numero de bolsa igual a la escrita.
                                    ClearCollect(
                                        colMatchingDeclaredBags,
                                        Filter(
                                            'CH-Tbl-DeclaredBags',
                                            BagNumber = First(colSecurityBagSelectionState).ID
                                        )
                                    );
                                    ClearCollect(
                                        colMatchingDeclaredBags,
                                        Filter(
                                            colMatchingDeclaredBags,
                                            IsBlank(BagID)
                                        )
                                    );  
                                //Fin concurrente
                                );
                                
                                //Verificar bolsas recibidas en esclusa
                                If(
                                    //Si no hay ninguna bolsa recibida, notificar que no hay y no hacer nada mas
                                    CountRows(colMatchingReceivedBags) = 0,
                                    Notify(
                                        "La bolsa no ha sido registrada en esclusa, no puede ser procesada.",
                                        NotificationType.Error
                                    );
                                    UpdateIf(
                                        colSecurityBagSelectionState,
                                        true,
                                        {State: "NoRecibioEsclusa"}
                                    );  
                                );
                                
                                //Si hay mas de una sola bolsa, cruzar al status de seleccion de bolsa
                                If(
                                    CountRows(colMatchingReceivedBags) > 1,
                                    Notify("Se encontro mas de una tula registrada con este numero que aun no ha sido procesada, escoge la tula manualmente.");
                                    UpdateIf(
                                        colSecurityBagSelectionState,
                                        true,
                                        {State: "Recibido-Pendiente"}
                                    );
                                    //UpdateContext({varSelectedReceiptBag: First(colMatchingReceivedBags)});
                                    
                                );
                                
                                //Si solo hay una bolsa, escoger esa bolsa y asignarla a la variable.
                                If(
                                    CountRows(colMatchingReceivedBags) = 1,
                                    If(
                                        //Antes de asignarla, verifica que este en status de "Almacenada en boveda". 
                                        First(colMatchingReceivedBags).BagStatus = 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda',
                                        Notify("Se ha encontrado una sola bolsa, se selecciona automaticamente.");
                                        UpdateIf(
                                            colSecurityBagSelectionState,
                                            true,
                                            {ReceivedBag: First(colMatchingReceivedBags)}
                                        );
                                
                                        Patch(
                                            'CH-Tbl-RecountingSessionDetails',
                                            Defaults('CH-Tbl-RecountingSessionDetails'),
                                            {
                                                RecountingSessionId: varRecountingSession,
                                                BagId: LookUp('CH-Tbl-Bags', BagID = First(colSecurityBagSelectionState).ID)
                                            
                                            }
                                        );
                                        
                                        UpdateContext({varSelectedReceiptBag: First(colMatchingReceivedBags)});
                                        ,
                                        //Si no esta en "Almacenada en boveda" significa que alguien mas tiene asignada esa bolsa.
                                        Notify(
                                            "No se pudo seleccionar automaticamente la unica bolsa registrada que se encontro, favor seleccionela manualmente",
                                            NotificationType.Warning
                                        );
                                        UpdateIf(
                                            colSecurityBagSelectionState,
                                            true,
                                            {State: "Recibido-Pendiente"}
                                        );
                                    )
                                );
                                
                                //Verificar bolsas declaradas siempre y cuando no se tenga que seleccionar declarado
                                //La unica forma que entre en este camino es que el "state" no haya sido modificado previamente por otra accion
                                //La unica accion que no lo modifica es cuando encuentra una sola bolsa y la bolsa es asignable.
                                If(
                                    First(colSecurityBagSelectionState).State = "Init",
                                    //Verificar si hay declaraciones de bolsas con el numero de bolsa digitado.
                                    If(
                                        //Si no hay, mandar notificacion y mover a status "SinDeclaracion".
                                        CountRows(colMatchingDeclaredBags) = 0,
                                        Notify(
                                            "La bolsa no ha sido registrada por el cliente, favor confirmar si se desea proceder.",
                                            NotificationType.Error
                                        );
                                        UpdateIf(
                                            colSecurityBagSelectionState,
                                            true,
                                            {State: "SinDeclaracion"}
                                        );
                                    );
                                
                                    //Si hay mas de una bolsa, mover a pantalla donde se pueda seleccionar la tula declarada.
                                    If(
                                        CountRows(colMatchingDeclaredBags) > 1,
                                        Notify("Se encontro mas de una tula registrada por el cliente con este numero, escoge la tula manualmente.");
                                        UpdateIf(
                                            colSecurityBagSelectionState,
                                            true,
                                            {State: "Declarado-Pendiente"}
                                        );
                                    );
                                UpdateContext({varScreenSpinnerMessage: ""});
                                    //Si hay una sola bolsa, seleccionarla.
                                    If(
                                        CountRows(colMatchingDeclaredBags) = 1,
                                        UpdateContext({varScreenSpinnerMessage: "Enlazando tulas..."});
                                        UpdateIf(
                                            colSecurityBagSelectionState,
                                            true,
                                            {
                                                DeclaredBag: First(colMatchingDeclaredBags),
                                                State: "Declarado-Seleccionado"
                                            }
                                        );
                                        UpdateContext({varSelectedDeclaredBag: First(colMatchingDeclaredBags)});
                                
                                        If(
                                            //Verificar que si premiamente se habia abierto alguna bolsa de esta misma planilla en la sesion de recuento actual
                                            /*!IsBlank(
                                                LookUp(
                                                    'CH-Tbl-Bags',
                                                    ReceptionID.'CH-Tbl-Receptions' = varSelectedReceiptBag.ReceptionID.'CH-Tbl-Receptions' && RecountingSession.'CH-Tbl-RecountingSession' = varRecountingSession.'CH-Tbl-RecountingSession'
                                                )
                                            )*/
                                            //A solicitud de negocio, se omite esta logica.
                                            true,
                                            Patch(
                                                'CH-Tbl-Bags',
                                                varSelectedReceiptBag,
                                                {
                                                    BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero',
                                                    RecountingSession: varRecountingSession,
                                                    BagDeclarationID: varSelectedDeclaredBag
                                                }
                                            );
                                            Patch(
                                                'CH-Tbl-DeclaredBags',
                                                varSelectedDeclaredBag,
                                                {BagID: varSelectedReceiptBag}
                                            );
                                            Refresh('CH-Tbl-Bags');
                                            Refresh('CH-Tbl-DeclaredBags');
                                            Set(
                                                gvarSelectedTula,
                                                LookUp(
                                                    'CH-Tbl-Bags',
                                                    'CH-Tbl-Bags' = varSelectedReceiptBag.'CH-Tbl-Bags'
                                                )
                                            );
                                            Select(btnCargarDatosTulaSeleccionada);
                                            ,
                                            UpdateIf(
                                                colSecurityBagSelectionState,
                                                true,
                                                {State: "Confirmacion"}
                                            );
                                        )
                                    )
                                );
                                UpdateContext({varScreenSpinnerMessage: ""});
                            Text: ="Confirmar"
                            Width: =96
                            X: =(Parent.Width - Self.Width) / 2
                            Y: =(Parent.Height - Self.Height - 20)
