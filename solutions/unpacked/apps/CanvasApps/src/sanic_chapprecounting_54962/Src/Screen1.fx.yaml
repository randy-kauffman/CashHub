                                        }
                                    </style>
                                </head>
                                <body>"&
                                "<h1>Tula: "&gvarSelectedTula.BagID&"</h1>"
                                });
                                
                                //Haya diferencia global entre lo declarado por bolsa vs lo recontado
                                If( 
                                    Value(Label6_14.Text)<>0 || Value(Label6_15.Text)<>0 || Value(Label6_16.Text)<>0 //Diferencia en NIO
                                    || Value(Label6_29.Text)<>0 || Value(Label6_30.Text)<>0 || Value(Label6_31.Text)<>0 //Diferencia en USD
                                    || Value(Label6_45.Text)<>0 || Value(Label6_46.Text)<>0 || Value(Label6_47.Text)<>0, //Diferencia en EUR
                                    Collect(
