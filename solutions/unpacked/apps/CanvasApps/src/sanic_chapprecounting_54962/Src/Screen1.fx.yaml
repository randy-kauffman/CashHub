                                    OnSelect: |-
                                        =UpdateContext({varScreenSpinnerMessage: "Cargando recuento de deposito..."});
                                        If(
                                            !IsBlank(varSelectedRecountedDeposit) && gvarSelectedTula.BagStatus <> 'BagStatus (CH-Tbl-Bags)'.Recontada,
                                            Notify(
                                                "No puedes seleccionar un deposito si tienes uno abierto.",
                                                NotificationType.Error
                                            ),
                                            UpdateContext({varSelectedRecountedDeposit: ThisItem});
                                            RemoveIf(
                                                colChecks,
                                                IsBlank(RelatedDeclaredCheck)
                                            );
                                            ClearCollect(colRecountedChecks, ThisItem.'CH-Tbl-Checks');
                                            ForAll(
                                                colRecountedChecks As RecountedCheck,
                                                If(
                                                    IsBlank(
                                                        LookUp(
                                                            colChecks,
                                                            'CH-Tbl-Checks' = RecountedCheck.'CH-Tbl-Checks'
                                                        )
                                                    ) && IsBlank(
                                                        LookUp(
                                                            Filter(colChecks, !IsBlank(RelatedDeclaredCheck.'CH-Tbl-DeclaredChecks')),
                                                            RelatedDeclaredCheck.'CH-Tbl-DeclaredChecks' = RecountedCheck.RelatedDeclaredCheck.'CH-Tbl-DeclaredChecks'
                                                        )
                                                    ),
                                                    Collect(
                                                        colChecks,
                                                        AddColumns(RecountedCheck,Selected,If(IsBlank(RecountedCheck.RelatedDeclaredCheck),false,true),OrderID,Max(Max(colChecks,OrderID)+1,0))
                                                    );
                                                )
                                            );
                                            Clear(colRecountedMoneyDetails);
                                            ForAll(
                                                Filter(
                                                    colDefinedDenominations,
                                                    Currency = ThisItem.Currency
                                                ) As Denomination,
                                                Patch(
                                                    colRecountedMoneyDetails,
                                                    Defaults('CH-Tbl-CountedMoneyDetails'),
                                                    {
                                                        DenominationType: If(
                                                            Denomination.Type = 'Type (CH-Tbl-MoneyDenominations)'.Billete,
                                                            "Billete",
                                                            "Moneda"
                                                        ),
                                                        Quantity: 0,
                                                        Denomination: Denomination.Value
                                                    }
                                                );
                                            );
                                            ClearCollect(colRecounted ,ThisItem.'CH-Tbl-CountedMoneyDetails');
                                            ForAll(
                                                colRecounted As MoneyDetails,
                                                RemoveIf(
                                                    colRecountedMoneyDetails,
                                                    DenominationType = MoneyDetails.DenominationType && Denomination = MoneyDetails.Denomination
                                                );
                                                Collect(
                                                    colRecountedMoneyDetails,
                                                    MoneyDetails
                                                );
                                            );
                                            If(!IsBlank(ThisItem.RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits'),
                                            Set(
                                                gvarSelectedDeclaredDeposit,
                                                ThisItem.RelatedDeclaredDeposit
                                            );
                                            ForAll(
                                                Filter(
                                                    colDeclaredChecks,
                                                    DeclaredDepositID.'CH-Tbl-DeclaredDeposits' = ThisItem.RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits'
                                                ) As DeclaredCheck,
                                                If(
                                                    IsBlank(
                                                        LookUp(
                                                            'CH-Tbl-Checks',
                                                            RelatedDeclaredCheck.'CH-Tbl-DeclaredChecks' = DeclaredCheck.'CH-Tbl-DeclaredChecks'
                                                        )
                                                    ),
                                                    Patch(
                                                        colChecks,
