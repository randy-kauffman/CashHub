                                                                <td>"&Text(Value(Label6_15.Text) + Value(Label6_16.Text),"#,###.00")&"</td>
                                                                <td>"&Text(Value(Label6_30.Text) + Value(Label6_31.Text),"#,###.00")&"</td>
                                                                <td>"&Text(Value(Label6_46.Text) + Value(Label6_47.Text),"#,###.00")&"</td>
                                                            </tr>
                                                        </table>
                                                    </div>"
                                    });
                                    
                                );
                                
                                //Haya diferencia por transaccion
                                Clear(colRecountedDepostiWithDifference);
                                ForAll(Filter(colRecountedDeposits, !IsBlank(RelatedDeclaredDeposit.'CH-Tbl-DeclaredDeposits')) As Recounted,
                                
                                If( Recounted.CashAmount <> Recounted.RelatedDeclaredDeposit.CashAmount || (Recounted.OtherLocaCheckAmount + Recounted.BACLocalCheckAmount) <> (Recounted.RelatedDeclaredDeposit.OtherLocalCheckAmount + Recounted.RelatedDeclaredDeposit.BACLocalCheckAmount ) ,
                                    Collect(
                                        colRecountedDepostiWithDifference,
