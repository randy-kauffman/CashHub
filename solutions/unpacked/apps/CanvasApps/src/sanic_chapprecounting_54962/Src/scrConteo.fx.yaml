    btnGuardarDepositoCon As button:
        BorderThickness: =0
        Color: =ThemeSurface
        DisabledBorderColor: =Color.Transparent
        DisabledColor: =ThemeInk3
        DisabledFill: =ThemeLineSoft
        DisplayMode: |-
            =If(
                gvarIdentidadOk && !ctxSoloLecturaCon && ctxHayDepositoCon,
                DisplayMode.Edit,
                DisplayMode.Disabled
            )
        Fill: =ThemeAccent
        FontWeight: =FontWeight.Semibold
        Height: =32
        HoverFill: =ThemeAccentDark
        OnSelect: |-
            =Select(btnVolcarGrillaCon);          // Bloque V — VOLCADO (§6.2), PRIMERA instruccion
            
            // ---- Validacion LOCAL, con guardas que HABLAN ----
            //   LAS CUATRO RAMAS DE ERROR BAJAN ctxSalirTrasGuardarCon: este OnSelect lo
            //   dispara tambien "Guardar y salir" (§13.1) con la bandera en true.
            //   Ya NO se valida el numero de cuenta: el cajero no lo escribe. Sale de
            //   la declaracion enlazada, o va vacio si no hay declaracion.
            //   Las guardas leen EN VIVO de las galerias, no de las colecciones.
            //   Select() es ASINCRONO: encola el volcado pero no lo espera, asi que
            //   en el PRIMER guardado de un deposito nuevo la coleccion todavia
            //   estaba vacia aca y saltaba "No hay nada que guardar" con el total
            //   en pantalla mostrando el monto. Al segundo intento andaba, porque
            //   ya habia aterrizado el volcado del primero.
            //   Lo de abajo (el Patch dentro de tmrGuardarCon, 50 ms despues) SI
            //   puede seguir leyendo las colecciones: para entonces el volcado ya
            //   corrio, que es exactamente para lo que ese timer existe.
            If(
                CountRows(
                    Filter(
                        galChequesCon.AllItems As C,
                        C.EsManual && (
                            IsBlank(Trim(C.inpNumChequeCon.Text)) ||
                            IsBlank(C.ddTipoChequeCon.Selected.Value) ||
                            Coalesce(Value(C.inpMontoChequeCon.Text), 0) <= 0
                        )
                    )
                ) > 0,
                    UpdateContext({ ctxSalirTrasGuardarCon: false });
                    Notify(
                        "Hay cheques manuales incompletos: cada uno necesita número, tipo y un monto mayor que cero.",
                        NotificationType.Error
                    ),
            
                //   El Format del control ataja el TECLEO, no un pegado. El numero de
                //   cheque va a sanic_checknumber, que tope 30 y es el que viaja al
                //   core: si entra basura, entra ahi.
                CountRows(
                    Filter(
                        galChequesCon.AllItems As C,
                        C.EsManual && (
                            !IsMatch(Trim(C.inpNumChequeCon.Text), "^[0-9]+$") ||
                            Len(Trim(C.inpNumChequeCon.Text)) > 30
                        )
                    )
                ) > 0,
                    UpdateContext({ ctxSalirTrasGuardarCon: false });
                    Notify(
                        "El número de cheque solo admite dígitos y hasta 30 caracteres.",
                        NotificationType.Error
                    ),
            
                Sum(galBilletesCon.AllItems As B, B.Denominacion * (B.Auto + Coalesce(Value(B.inpCantidadBilCon.Text), 0))) +
                Sum(galMonedasCon.AllItems As M, M.Denominacion * Coalesce(Value(M.inpCantidadMonCon.Text), 0)) +
                Sum(galChequesCon.AllItems As C, If(If(C.EsManual, true, C.chkChequeCon.Value), If(C.EsManual, Coalesce(Value(C.inpMontoChequeCon.Text), 0), C.Monto), 0)) <= 0,
                    UpdateContext({ ctxSalirTrasGuardarCon: false });
                    Notify("No hay nada que guardar en este depósito.", NotificationType.Error),
            
                // ---- Todo bien: se pinta el dialogo y el trabajo pesado corre un frame despues ----
                UpdateContext({ ctxDlgGuardandoCon: true, ctxGuardandoCon: true })
            )
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =ThemeAccentDark
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =9
        Text: ="Guardar depósito"
        Width: =140
        X: =shpCardCurCon.X + shpCardCurCon.Width - 16 - Self.Width
