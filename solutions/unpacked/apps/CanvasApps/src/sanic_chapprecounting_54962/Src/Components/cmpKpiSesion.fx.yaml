cmpKpiSesion As CanvasComponent:
    Cheques: =0
    Efectivo: =0
    Fill: =RGBA(0, 0, 0, 0)
    Height: =100
    Moneda: ="NIO"
    MonedaNombre: ="Córdobas"
    Simbolo: ="C$ "
    Total: =cmpKpiSesion.Efectivo + cmpKpiSesion.Cheques
    Width: =226
    X: =0
    Y: =0
    ZIndex: =1

    btnSupKpi As button:
        BorderColor: =ThemeLine
        BorderThickness: =1
        Color: =ThemeInk
        DisplayMode: =DisplayMode.View
        Fill: =ThemeSurface2
        Height: =Parent.Height
        HoverFill: =ThemeSurface2
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        PressedFill: =ThemeSurface2
        RadiusBottomLeft: =11
        RadiusBottomRight: =11
        RadiusTopLeft: =11
        RadiusTopRight: =11
        Size: =9
        Text: =""
        Width: =Parent.Width
        ZIndex: =1

    lblNombreKpi As label:
        Color: =ThemeInk3
        FontWeight: =FontWeight.Semibold
        Height: =14
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =7.88
        Text: =Upper(cmpKpiSesion.MonedaNombre)
        Width: =110
        Wrap: =false
        X: =12
        Y: =9
        ZIndex: =2

    lblCodigoKpi As label:
        Align: =Align.Right
        Color: =ThemeInk3
        FontWeight: =FontWeight.Semibold
        Height: =14
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =7.88
        Text: =Upper(cmpKpiSesion.Moneda)
        Width: =60
        Wrap: =false
        X: =Parent.Width - 12 - Self.Width
        Y: =9
        ZIndex: =3

    lblEfeLabKpi As label:
        Color: =ThemeInk2
        Height: =15
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =8.63
        Text: ="Efectivo"
        Width: =80
        Wrap: =false
        X: =12
        Y: =28
        ZIndex: =4

    lblEfeValKpi As label:
        Align: =Align.Right
        Color: =ThemeInk
        FontWeight: =FontWeight.Semibold
        Height: =15
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =8.63
        Text: =fxMonto(cmpKpiSesion.Efectivo, cmpKpiSesion.Simbolo)
        Width: =132
        Wrap: =false
        X: =Parent.Width - 12 - Self.Width
        Y: =lblEfeLabKpi.Y
        ZIndex: =5

    lblChqLabKpi As label:
        Color: =ThemeInk2
        Height: =15
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =8.63
        Text: ="Cheques"
        Width: =80
        Wrap: =false
        X: =12
        Y: =lblEfeLabKpi.Y + lblEfeLabKpi.Height
        ZIndex: =6

    lblChqValKpi As label:
        Align: =Align.Right
        Color: =ThemeInk
        FontWeight: =FontWeight.Semibold
        Height: =15
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =8.63
        Text: =fxMonto(cmpKpiSesion.Cheques, cmpKpiSesion.Simbolo)
        Width: =132
        Wrap: =false
        X: =lblEfeValKpi.X
        Y: =lblChqLabKpi.Y
        ZIndex: =7

    shpLineaKpi As rectangle:
        Fill: =ThemeLine
        Height: =1
        Width: =Parent.Width - 24
        X: =12
        Y: =lblChqLabKpi.Y + lblChqLabKpi.Height + 8
        ZIndex: =8

    lblTotLabKpi As label:
        Color: =ThemeInk3
        FontWeight: =FontWeight.Semibold
        Height: =25
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =7.88
        Text: ="TOTAL"
        Width: =70
        Wrap: =false
        X: =12
        Y: =shpLineaKpi.Y + 6
        ZIndex: =9

    lblTotValKpi As label:
        Align: =Align.Right
        Color: =ThemeInk
        FontWeight: =FontWeight.Bold
        Height: =26
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        Size: =11.25
        Text: =fxMonto(cmpKpiSesion.Total, cmpKpiSesion.Simbolo)
        Width: =Parent.Width - 94
        Wrap: =false
        X: =82
        Y: =shpLineaKpi.Y + 5
        ZIndex: =10

