                  - DatePickerCanvas1_1:
                      Control: DatePicker@0.0.46
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='DatePickerCanvas.Appearance'.FilledLighter
                        BorderRadius: =10
                        EndDate: =Today()
                        Height: =40
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnChange: |-
                          =ClearCollect(
                              colChecksR,
                              ShowColumns(
                                  AddColumns(
                                      Filter(
                                          'CH-Tbl-Checks',
                                          'Created On' >= DatePickerCanvas1_1.SelectedDate && 'Created On' < DateAdd(
                                              DatePickerCanvas1_1.SelectedDate,
                                              1,
                                              TimeUnit.Days
                                          )
                                      ),
                                      RecordCanSelect,
                                      If(
                                          CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado || CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido',
                                          true,
                                          false
                                      ),
                                      BagID,
                                      RelatedReCounterDepositID.BagID.BagID,
                                      Cliente,
                                      RelatedReCounterDepositID.BagID.ReceptionID.RemitentClient.Name
                                  ),
                                  CheckNumber,
                                  'Created By',
                                  'Created On',
                                  CheckAmount,
                                  CheckStatus,
                                  CheckCurrency,
                                  'Enviado el',
                                  'No recibido el',
                                  'CH-Tbl-Checks',
                                  RelatedReCounterDepositID,
                                  Cliente,
                                  BagID,
                                  RecordCanSelect
                              )
                          )
                        SelectedDate: =Today()
                        Width: =200
                  - ButtonCanvas2_1:
                      Control: Button@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(8, 222, 8, 1)
                        BorderRadius: =10
                        DisplayMode: =If(CountRows(FluentDetailsList1.SelectedItems)>0, DisplayMode.Edit,DisplayMode.Disabled)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |+
                          =UpdateContext({varScreenSpinnerMessage: "Actualizando..."});
                          ForAll(FluentDetailsList1.SelectedItems As Cheque,

                          Patch('CH-Tbl-Checks'
                          ,LookUp('CH-Tbl-Checks', sanic_chtblchecksid = Cheque.sanic_chtblchecksid)
                          ,{CheckStatus: 'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion'}
                          )
                          );

                          Refresh('CH-Tbl-Checks');

                          ClearCollect(colChecksR,ShowColumns(AddColumns(Filter(
                                  'CH-Tbl-Checks',
                                  'Created On' >= DatePickerCanvas1_1.SelectedDate && 'Created On' < DateAdd(
                                      DatePickerCanvas1_1.SelectedDate,
                                      1,
                                      TimeUnit.Days
                                  )
                              ),
                              RecordCanSelect,
                              If(
                                  CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado || CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido',
                                  true,
                                  false
                              ),BagID, RelatedReCounterDepositID.BagID.BagID, Cliente, RelatedReCounterDepositID.BagID.ReceptionID.RemitentClient.Name
                          ),CheckNumber,'Created By','Created On',CheckAmount,CheckStatus,CheckCurrency,'Enviado el','No recibido el','CH-Tbl-Checks',RelatedReCounterDepositID,Cliente,BagID,RecordCanSelect));

                          UpdateContext({varScreenSpinnerMessage: ""});

                        Text: ="Enviar a digitacion"
                        Width: =160
                  - btnReenviarDigitacion:
                      Control: Button@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(8, 222, 8, 1)
                        BorderRadius: =10
                        DisplayMode: =If(CountRows(Filter(FluentDetailsList1.SelectedItems, sanic_checkstatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido'))>0, DisplayMode.Edit,DisplayMode.Disabled)
                        Height: =32
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =UpdateContext({varScreenSpinnerMessage: "Reenviando..."});
                          UpdateContext({varChequesReenviados: CountRows(Filter(FluentDetailsList1.SelectedItems, sanic_checkstatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido'))});
                          ForAll(FluentDetailsList1.SelectedItems As Cheque,
                          If(Cheque.sanic_checkstatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido',
                          Patch('CH-Tbl-Checks'
                          ,LookUp('CH-Tbl-Checks', sanic_chtblchecksid = Cheque.sanic_chtblchecksid)
                          ,{CheckStatus: 'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion'}
                          )
                          )
                          );
                          Refresh('CH-Tbl-Checks');
                          ClearCollect(colChecksR,ShowColumns(AddColumns(Filter(
                                  'CH-Tbl-Checks',
                                  ('Created On' >= DatePickerCanvas1_1.SelectedDate && 'Created On' < DateAdd(
                                      DatePickerCanvas1_1.SelectedDate,
                                      1,
                                      TimeUnit.Days
                                  )) || CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado || CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido'
                              ),
                              RecordCanSelect,
                              If(
                                  CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado || CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido',
                                  true,
                                  false
                              ),BagID, RelatedReCounterDepositID.BagID.BagID, Cliente, RelatedReCounterDepositID.BagID.ReceptionID.RemitentClient.Name
                          ),CheckNumber,'Created By','Created On',CheckAmount,CheckStatus,CheckCurrency,'Enviado el','No recibido el','CH-Tbl-Checks',RelatedReCounterDepositID,Cliente,BagID,RecordCanSelect));
                          UpdateContext({varScreenSpinnerMessage: ""});
                          Notify("Se reenviaron " & varChequesReenviados & " cheque(s) a digitacion", NotificationType.Success)
                        Text: ="Reenviar a digitacion"
