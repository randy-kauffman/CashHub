                        Color: =RGBA(0, 0, 0, 1)
                        Height: =20
                        Icon: =Icon.CalendarBlank
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =20
                  - DatePickerCanvas1:
                      Control: DatePicker@0.0.46
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='DatePickerCanvas.Appearance'.FilledLighter
                        BorderRadius: =10
                        EndDate: =Today()
                        Height: =40
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        SelectedDate: =Today()
                        Width: =200
                  - Icon4:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(0, 0, 0, 1)
                        Height: =24
                        Icon: =Icon.People
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =24
                  - ComboboxCanvas1:
                      Control: ComboBox@0.0.51
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ComboboxCanvas.Appearance'.FilledLighter
                        Height: =40
                        InputTextPlaceholder: ="Todos los cajeros"
                        Items: |+
                          =With(
                              {
                                  _sessions:
                                      Filter(
                                          'CH-Tbl-RecountingSessions',
                                          'Created On' >= DatePickerCanvas1.SelectedDate &&
                                          'Created On' <  DateAdd(DatePickerCanvas1.SelectedDate, 1, TimeUnit.Days)
                                      )
                              },
                              ForAll(
                                  Distinct(_sessions, Cashier.User),
                                  {User: Value
                                  , FullName: LookUp(
                                      Choices([@'CH-Tbl-RecountingSessions'].Cashier),
                                      User = Value
                                  ).'Full Name'
                                  }
                              )
                          )
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =250
                      Children:
                        - FullName2:
                            Control: ComboBoxDataField@1.5.0
                            Variant: textualColumn
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="FullName"
                              FieldName: ="FullName"
                              FieldType: ="s"
                              Order: =1
                        - User2:
                            Control: ComboBoxDataField@1.5.0
                            Variant: textualColumn
                            IsLocked: true
                            Properties:
                              FieldDisplayName: ="User"
                              FieldName: ="User"
                              FieldType: ="g"
                              Order: =2
                  - ButtonCanvas2:
                      Control: Button@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderRadius: =10
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |
                          =UpdateContext({varScreenSpinnerMessage: "Actualizando..."});
                          ClearCollect(
                              colRecountingSessions,
                              ShowColumns(
                                  Filter(
                                      'CH-Tbl-RecountingSessions',
                                      'Created On' >= DatePickerCanvas1.SelectedDate && 'Created On' < DateAdd(
                                          DatePickerCanvas1.SelectedDate,
                                          1,
                                          TimeUnit.Days
                                      ) && (IsBlank(ComboboxCanvas1.Selected) || Cashier.User = ComboboxCanvas1.Selected.User) && Confirmed = true
                                  ),
                                  'CH-Tbl-Bags',
                                  'CH-Tbl-RecountingSession',
                                  'Created By',
                                  'Created On',
                                  'Modified By',
                                  'Modified On',
                                  SessionForciblyClosed,
                                  Name,
                                  ForcedClosureBy,
                                  CountingDesk,
                                  ConfirmedBy,
                                  Confirmed,
                                  Cashier
                              )
                          );
                          Clear(colRecountedBags);
                          ForAll(
                              colRecountingSessions As RS,
                              Collect(
                                  colRecountedBags,
                                  AddColumns(
                                      ShowColumns(
                                          Filter(
                                              'CH-Tbl-Bags',
                                              RecountingSession.'CH-Tbl-RecountingSession' = RS.sanic_chtblrecountingsessionid && BagStatus = 'BagStatus (CH-Tbl-Bags)'.Recontada
                                          ),
                                          'CH-Tbl-Bags',
                                          'CH-Tbl-DepositsRecountings',
                                          BagID,
                                          BagStatus,
                                          ReceptionID,
                                          RecountingSession,
                                          TotalUSD,
                                          TotalNIO,
                                          TotalEUR
                                      ),
                                      RecountedSessionGUID,
                                      sanic_RecountingSession.'CH-Tbl-RecountingSession'
                                  )
                              )
                          );
                          Clear(colRecounted);
                          ForAll(
                              colRecountedBags As RB,
                              Collect(
                                  colRecounted,
                                  AddColumns(
                                      ShowColumns(
                                          Filter(
                                              'CH-Tbl-DepositsRecountings',
                                              BagID.'CH-Tbl-Bags' = RB.sanic_chtblbagsid
                                          ),
                                          'CH-Tbl-Checks',
                                          'CH-Tbl-DepositsRecounting',
                                          BACLocalCheckAmount,
                                          BagID,
                                          CashAmount,
                                          Currency,
                                          OtherLocaCheckAmount,
                                          Total
                                      ),
                                      RelatedBagGUID,
                                      sanic_BagID.'CH-Tbl-Bags'
                                  )
                              )
                          );
                          Clear(colRecountedCheck);
                          ForAll(
                              colRecounted As Recounted,
                              Collect(
                                  colRecountedCheck,
                                  AddColumns(
                                      ShowColumns(
                                          Filter(
                                              'CH-Tbl-Checks',
                                              RelatedReCounterDepositID.'CH-Tbl-DepositsRecounting' = Recounted.sanic_chtbldepositsrecountingid
                                          ),
                                          'CH-Tbl-Checks',
                                          RelatedReCounterDepositID,
                                          CheckTypes,
                                          CheckStatus,
                                          CheckNumber,
                                          CheckCurrency,
                                          CheckAmount
                                      ),
                                      RelatedRecountedDepositGUID,
                                      sanic_RelatedReCounterDepositID.'CH-Tbl-DepositsRecounting'
                                  )
                              )
                          );
                          ClearCollect(
                              colR,
                              AddColumns(
                                  colRecounted,
                                  Checks,
                                  LookUp(
                                      GroupBy(
                                          colRecountedCheck,
                                          RelatedRecountedDepositGUID,
                                          RecountedDeposit
                                      ),
                                      RelatedRecountedDepositGUID = sanic_chtbldepositsrecountingid
                                  ).RecountedDeposit
                              )
                          );
                          ClearCollect(
                              colRB,
                              AddColumns(
                                  colRecountedBags,
                                  Deposits,
                                  LookUp(
                                      GroupBy(
                                          colR,
                                          RelatedBagGUID,
                                          Deposit
                                      ),
                                      RelatedBagGUID = sanic_chtblbagsid
                                  ).Deposit
                              )
                          );
                          ClearCollect(
                              colRS,
                              AddColumns(
                                  colRecountingSessions,
                                  Bags,
                                  LookUp(
                                      GroupBy(
                                          colRB,
                                          RecountedSessionGUID,
                                          RS
                                      ),
                                      RecountedSessionGUID = sanic_chtblrecountingsessionid
                                  ).RS
                              )
                          );
                          UpdateContext({varScreenSpinnerMessage: ""});
                        Text: ="Actualizar"
