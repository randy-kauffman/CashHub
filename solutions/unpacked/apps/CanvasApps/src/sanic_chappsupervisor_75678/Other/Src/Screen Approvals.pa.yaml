                        - Container1:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              X: =40
                              Y: =40
                            Children:
                              - Table1:
                                  Control: Table@1.0.278
                                  Properties:
                                    EnableRangeSelection: ='PowerAppsOneGrid.EnableRangeSelection'.Enable
                                    EnableSorting: ='PowerAppsOneGrid.EnableSorting'.Enable
                                    Height: =Parent.Height//If(Self.Y + 500 > Parent.Height, Parent.Height - Self.Y, 500)
                                    Items: |-
                                      =Search(
                                          AddColumns(
                                              If(Toggle1.Checked, Filter('CH-Tbl-ApprovalRequests',ApprovalStatus = Blank()), Filter('CH-Tbl-ApprovalRequests',ApprovalStatus <> Blank())),
                                              CreatedByFullname,
                                              'Created By'.'Full Name', FechaCreacion, 'Created On'
                                          ),
                                          Text(SearchInput1.Value),
                                          RequestType,
                                          CreatedByFullname,
                                          RequestDetails,
                                          RequestResources
                                      )
                                    OnSelect: |-
                                      =UpdateContext({ isItemSelected: true, newMode: false, CurrentItem:Table1.Selected });
                                      UpdateContext(
                                          {
                                              varStyleTagInitPosition: Find(
                                                  "<style>",
                                                  Table1.Selected.RequestDetails
                                              )
                                          }
                                      );
                                      UpdateContext(
                                          {
                                              varStyleTagEndPosition: Find(
                                                  "</style>",
                                                  Table1.Selected.RequestDetails,
                                                  varStyleTagInitPosition
                                              )
                                          }
                                      );

                                      If(!IsBlank(varStyleTagInitPosition),
                                      UpdateContext(
                                          {
                                              varStyleTags: Substitute(Substitute(Mid(
                                                  Table1.Selected.RequestDetails,
                                                  varStyleTagInitPosition,
                                                  varStyleTagEndPosition - varStyleTagInitPosition
                                              ),"<style>",""),"</style>","")
                                          }
                                      );
                                      Clear(colStyleTags);
                                      ForAll(
                                          Split(
                                              varStyleTags,
                                              "}"
                                          ) As StyleTag,
                                          Collect(
                                              colStyleTags,
                                              {
                                                  Element: First(
                                                      Split(
                                                          StyleTag.Value,
                                                          "{"
                                                      )
                                                  ).Value,
                                                  Style: Last(
                                                      Split(
                                                          StyleTag.Value,
                                                          "{"
                                                      )
                                                  ).Value
                                              }
                                          )
                                      );
                                      ClearCollect(
                                          colRequestDetails,
                                          {
                                              Body: Substitute(
                                                  Table1.Selected.RequestDetails,
                                                  Mid(
                                                      Table1.Selected.RequestDetails,
                                                      varStyleTagInitPosition,
                                                      varStyleTagEndPosition - varStyleTagInitPosition + 8
                                                  ),
                                                  ""
                                              )
                                          }
                                      );
                                      ForAll(
                                          colStyleTags As StyleTag,
                                          Collect(
                                              colRequestDetails,
                                              {
                                                  Body: Substitute(
                                                      Last(colRequestDetails).Body,
                                                      Trim(StyleTag.Element),
                                                      Trim(StyleTag.Element) & " style='" & Trim(StyleTag.Style) &"'"
                                                  )
                                              }
                                          )
                                      );
                                      UpdateContext({varRequestDetails: Last(colRequestDetails).Body});
                                      ,

                                      UpdateContext({varRequestDetails: Table1.Selected.RequestDetails});
                                      )
                                    ReflowBehavior: ='PowerAppsOneGrid.ReflowBehavior'.ListOnly
