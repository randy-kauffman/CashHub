                                          Text: ="Rechazar"
                                    - SubmitButton1:
                                        Control: Button@0.0.45
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          FontWeight: =FontWeight.Normal
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: "=UpdateContext({varExecuteApproveAction: false, varScreenSpinnerMessage: \"Actualizando...\"});\nSwitch(\n    Table1.Selected.RequestType,\n    \"Remapear tula\",\n    With(\n        {\n            BagGUID: GUID(ParseJSON(Table1.Selected.RequestResources).GUID),\n            ReceiptGUID: GUID(ParseJSON(Table1.Selected.RequestResources).ReceiptGUID),\n            BagPreviousState: LookUp(\n                Choices([@'CH-Tbl-Bags'].BagStatus),\n                Text(Value) = Text(ParseJSON(Table1.Selected.RequestResources).BagPreviousState)\n            )\n        },\n        Patch(\n            'CH-Tbl-Bags',\n            LookUp(\n                'CH-Tbl-Bags',\n                'CH-Tbl-Bags' = BagGUID\n            ),\n            {\n                ReceptionID: LookUp(\n                    'CH-Tbl-Receptions',\n                    'CH-Tbl-Receptions' = ReceiptGUID\n                ),\n                BagStatus: BagPreviousState.Value\n            }\n        );\n        UpdateContext({varExecuteApproveAction: true});\n    ),\n    \"Agregar tula\",\n    //Aprobar el alta: materializar la tula pendiente que Reception ya creo (por BagGUID)\n    With(\n        {\n            BagGUID: GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID),\n            NewBagID: Text(ParseJSON(Table1.Selected.RequestResources).BagID),\n            ReceptionBatchGUID: GUID(ParseJSON(Table1.Selected.RequestResources).ReceptionBatchGUID)\n        },\n        If(\n            !IsBlank(\n                LookUp(\n                    'CH-Tbl-Bags',\n                    ReceptionID.ReceptionBatch.'CH-Tbl-ReceptionBatch' = ReceptionBatchGUID && BagID = NewBagID && 'CH-Tbl-Bags' <> BagGUID\n                )\n            ),\n            Notify(\n                \"Este numero de tula ya se encuentra registrado en otra planilla en el mismo lote de recepcion\",\n                NotificationType.Error\n            ),\n            Patch(\n                'CH-Tbl-Bags',\n                LookUp(\n                    'CH-Tbl-Bags',\n                    'CH-Tbl-Bags' = BagGUID\n                ),\n                {\n                    BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda'\n                }\n            );\n            UpdateContext({varExecuteApproveAction: true});\n        )\n    );\n\n    ,\n    \"Eliminar tula\",\n    //Do nothing\n     With(\n        {BagGUID: GUID(ParseJSON(Table1.Selected.RequestResources).GUID)\n        },\n        Remove('CH-Tbl-Bags', LookUp('CH-Tbl-Bags','CH-Tbl-Bags'=BagGUID));\n        UpdateContext({varExecuteApproveAction: true});\n    )\n\n    ,\"Modificar numero de planilla\"\n    ,With(\n        {\n            ReceiptGUID: GUID(ParseJSON(Table1.Selected.RequestResources).ReceiptGUID),\n            Receipt: LookUp(\n                'CH-Tbl-Receptions',\n                'CH-Tbl-Receptions' = GUID(ParseJSON(Table1.Selected.RequestResources).ReceiptGUID)\n            ),\n            NewReceiptID: Text(ParseJSON(Table1.Selected.RequestResources).NewReceiptID),\n            ReceptionBatchGUID: LookUp(\n                'CH-Tbl-Receptions',\n                'CH-Tbl-Receptions' = GUID(ParseJSON(Table1.Selected.RequestResources).ReceiptGUID)\n            ).ReceptionBatch.'CH-Tbl-ReceptionBatch'\n        },\n        If(\n            !IsBlank(\n                LookUp(\n                    'CH-Tbl-Receptions',\n                     ReceptionBatch.'CH-Tbl-ReceptionBatch' = ReceptionBatchGUID && ReceiptID = NewReceiptID\n                )\n            ),\n            Notify(\n                \"Este numero de planilla ya se encuentra registrado en el mismo lote de recepcion\",\n                NotificationType.Error\n            ),\n            Patch(\n                'CH-Tbl-Receptions',\n                Receipt,\n                {\n                    ReceiptID: NewReceiptID\n                }\n            );\n            UpdateContext({varExecuteApproveAction: true});\n        )\n    );\n\n    ,\"Crear sesion de recuento\"\n    ,With(\n        {RecountingSessionGUID: GUID(ParseJSON(Table1.Selected.RequestResources).RecountingSessionGUID)\n        },\n        Patch(\n            'CH-Tbl-RecountingSessions',\n            LookUp(\n                'CH-Tbl-RecountingSessions',\n                'CH-Tbl-RecountingSession' = RecountingSessionGUID\n            ),\n            {\n                Confirmed: true\n                ,ConfirmedBy: gvarUser\n\n            }\n        );\n        UpdateContext({varExecuteApproveAction: true});\n    ),\n    \"Primera tula en planilla\",\n    \n    With(\n        {RecountingSessionRecord: LookUp(\n                'CH-Tbl-RecountingSessions',\n                'CH-Tbl-RecountingSession' = GUID(ParseJSON(Table1.Selected.RequestResources).RecountingSessionGUID)\n                ) ,\n        BagRecord: LookUp(\n                'CH-Tbl-Bags',\n                'CH-Tbl-Bags' = GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)\n            ),\n        DeclaredBagRecord: LookUp(\n                'CH-Tbl-DeclaredBags',\n                'CH-Tbl-DeclaredBags' = IfError(GUID(ParseJSON(Table1.Selected.RequestResources).DeclarationBagGUID),Blank())\n            )\n        },\n        Patch(\n            'CH-Tbl-Bags',\n            BagRecord,\n            {\n                BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero'\n                ,RecountingSession:  RecountingSessionRecord\n                ,BagDeclarationID: DeclaredBagRecord\n\n            }\n        );\n        Patch(\n            'CH-Tbl-DeclaredBags'\n            ,DeclaredBagRecord\n            ,{\n                BagID: BagRecord\n            }\n        );\n        UpdateContext({varExecuteApproveAction: true});\n    ),\n    \"Tula sin declaracion\",\n    \n    With(\n        {RecountingSessionRecord: LookUp(\n                'CH-Tbl-RecountingSessions',\n                'CH-Tbl-RecountingSession' = GUID(ParseJSON(Table1.Selected.RequestResources).RecountingSessionGUID)\n                ) ,\n        BagRecord: LookUp(\n                'CH-Tbl-Bags',\n                'CH-Tbl-Bags' = GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)\n            ),\n        DeclaredBagRecord: LookUp(\n                'CH-Tbl-DeclaredBags',\n                'CH-Tbl-DeclaredBags' = IfError(GUID(ParseJSON(Table1.Selected.RequestResources).DeclarationBagGUID),Blank())\n            )\n        },\n        Patch(\n            'CH-Tbl-Bags',\n            BagRecord,\n            {\n                BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Asignada a cajero'\n                ,RecountingSession:  RecountingSessionRecord\n                ,BagDeclarationID: DeclaredBagRecord\n\n            }\n        );\n\n        Patch(\n            'CH-Tbl-RecountingSessionDetails',\n            Defaults('CH-Tbl-RecountingSessionDetails'),\n            {\n                RecountingSessionId: RecountingSessionRecord,\n                BagId: BagRecord,\n                SupervisorId: gvarUser\n            }\n        );\n\n        UpdateContext({varExecuteApproveAction: true});\n    )\n    ,\"Tula con diferencia\",\n    With(\n        {\n        BagGUID: GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)\n        },\n        //Crear transacciones \n        \n        Clear(colTransacciones);\n        UpdateContext({varBagRecord: LookUp('CH-Tbl-Bags', 'CH-Tbl-Bags' = BagGUID)});\n        ClearCollect(colRecountedDepsoits, Filter('CH-Tbl-DepositsRecountings',BagID.'CH-Tbl-Bags' = BagGUID));\n        ClearCollect(colDeclaredDeposits, Filter('CH-Tbl-DeclaredDeposits', RelatedRecountedDeposit.BagID.'CH-Tbl-Bags' = BagGUID));\n        ClearCollect(colChecks, Filter('CH-Tbl-Checks', RelatedReCounterDepositID.BagID.'CH-Tbl-Bags' = BagGUID));\n        //Todas las transacciones enlazadas deberan de generar un sobrante o faltante si es que lo hay. \n        ForAll(Filter(colRecountedDepsoits,!IsBlank(RelatedDeclaredDeposit)) As Transaccion,\n            With({Diferencia: (Transaccion.CashAmount + Transaccion.OtherLocaCheckAmount + Transaccion.BACLocalCheckAmount) - (Transaccion.RelatedDeclaredDeposit.CashAmount + Transaccion.RelatedDeclaredDeposit.OtherLocalCheckAmount + Transaccion.RelatedDeclaredDeposit.BACLocalCheckAmount)},\n            \n                //Sobrante\n                If(Diferencia > 0,\n                    Collect(colTransacciones,\n                        {\n                            AccountNumber: Transaccion.RelatedDeclaredDeposit.AccountNumber\n                            ,CashAmount: Abs(Transaccion.CashAmount - Transaccion.RelatedDeclaredDeposit.CashAmount)\n                            ,BACLocalCheckAmount: Abs(Transaccion.BACLocalCheckAmount - Transaccion.RelatedDeclaredDeposit.BACLocalCheckAmount)\n                            ,OtherLocalCheckAmount: Abs(Transaccion.OtherLocaCheckAmount - Transaccion.RelatedDeclaredDeposit.OtherLocalCheckAmount)\n                            ,Currency: Transaccion.Currency\n                            ,TransactionReference: Concatenate(\"Sobrante tula \" , varBagRecord.BagID)\n                            ,RelatedDepositRecounting: Transaccion\n                            ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.Sobrante\n                            ,TransactionNumber: Transaccion.TransactionNumber\n                            ,TransactionProcessingType: 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual\n                        }\n                    )\n                    );\n\n                //Faltante\n                If(Diferencia < 0, \n                Collect(colTransacciones,\n                        {\n                            AccountNumber: Transaccion.RelatedDeclaredDeposit.AccountNumber\n                            ,CashAmount: Abs(Transaccion.CashAmount - Transaccion.RelatedDeclaredDeposit.CashAmount)\n                            ,BACLocalCheckAmount: Abs(Transaccion.BACLocalCheckAmount - Transaccion.RelatedDeclaredDeposit.BACLocalCheckAmount)\n                            ,OtherLocalCheckAmount: Abs(Transaccion.OtherLocaCheckAmount - Transaccion.RelatedDeclaredDeposit.OtherLocalCheckAmount)\n                            ,Currency: Transaccion.Currency\n                            ,TransactionReference: Concatenate(\"Faltante tula \" , varBagRecord.BagID)\n                            ,RelatedDepositRecounting: Transaccion\n                            ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.Faltante\n                            ,TransactionNumber: Transaccion.TransactionNumber\n                            ,TransactionProcessingType: 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual\n                            \n                        }\n                    )\n                );\n                );\n\n                //Anadir transaccion\n                Collect(colTransacciones,\n                        {\n                            AccountNumber: Transaccion.RelatedDeclaredDeposit.AccountNumber\n                            ,CashAmount: Transaccion.CashAmount\n                            ,BACLocalCheckAmount: Transaccion.BACLocalCheckAmount\n                            ,OtherLocalCheckAmount: Transaccion.OtherLocaCheckAmount\n                            ,Currency: Transaccion.Currency\n                            ,TransactionReference: Transaccion.RelatedDeclaredDeposit.DepositReference\n                            ,RelatedDepositRecounting: Transaccion\n                            ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.Deposito\n                            ,TransactionNumber: Transaccion.TransactionNumber\n                            ,TransactionProcessingType: If(Transaccion.BACLocalCheckAmount>0 || Transaccion.OtherLocaCheckAmount>0,'TransactionProcessingType (CH-Tbl-Transactions)'.Manual, 'TransactionProcessingType (CH-Tbl-Transactions)'.Batch)\n                           \n                        }\n                    )\n                \n            );\n\n            //Todas las transacciones declaradas se deberan acreditar y debitar\n            ForAll(Filter(colDeclaredDeposits, IsBlank(RelatedRecountedDeposit))  As Transaccion,\n                //Anadir transaccion\n                Collect(colTransacciones,\n                        {\n                            AccountNumber: Transaccion.AccountNumber\n                            ,CashAmount: Transaccion.CashAmount\n                            ,BACLocalCheckAmount: Transaccion.BACLocalCheckAmount\n                            ,OtherLocalCheckAmount: Transaccion.OtherLocalCheckAmount\n                            ,Currency: Transaccion.Currency\n                            ,TransactionReference: Concatenate(\"Faltante tula \" , varBagRecord.BagID)\n                            ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.Faltante\n                            ,TransactionNumber: Transaccion.TransactionNo\n                            ,TransactionProcessingType: 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual\n                            \n                        }\n                    );\n\n                Collect(colTransacciones,\n                        {\n                            AccountNumber: Transaccion.AccountNumber\n                            ,CashAmount: Transaccion.CashAmount\n                            ,BACLocalCheckAmount: Transaccion.BACLocalCheckAmount\n                            ,OtherLocalCheckAmount: Transaccion.OtherLocalCheckAmount\n                            ,Currency: Transaccion.Currency\n                            ,TransactionReference: Transaccion.DepositReference\n                            ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.Deposito\n                            ,TransactionNumber: Transaccion.TransactionNo\n                            ,TransactionProcessingType: 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual\n                            \n                        }\n                    )\n\n            );\n\n\n            //Todas las transacciones recontadas y no enlazadas se deben de crear\n            ForAll(Filter(colRecountedDepsoits, IsBlank(RelatedDeclaredDeposit))  As Transaccion,\n                //Anadir transaccion\n                Collect(colTransacciones,\n                        {\n                            \n                            CashAmount: Transaccion.CashAmount\n                            ,BACLocalCheckAmount: Transaccion.BACLocalCheckAmount\n                            ,OtherLocalCheckAmount: Transaccion.OtherLocaCheckAmount\n                            ,Currency: Transaccion.Currency\n                            ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.Deposito\n                            ,TransactionNumber: Transaccion.TransactionNumber\n                            ,TransactionProcessingType: 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual\n                            ,TransactionReference: Concatenate(\"Sobrante \" , varBagRecord.BagID)\n                            \n                        }\n                    );\n\n            )\n\n        );\n        ForAll(colTransacciones As Transaccion,\n        Patch(\n\n            'CH-Tbl-Transactions',\n            Defaults('CH-Tbl-Transactions'),\n            {\n                AccountNumber: Transaccion.AccountNumber\n                ,Currency: Transaccion.Currency\n                ,CashAmount: Transaccion.CashAmount\n                ,BACLocalCheckAmount: Transaccion.BACLocalCheckAmount\n                ,OtherLocalCheckAmount: Transaccion.OtherLocalCheckAmount\n                ,TransactionReference: Transaccion.TransactionReference\n                ,TransactionType: Transaccion.TransactionType\n                ,TransactionNumber: Transaccion.TransactionNumber\n                ,TransactionProcessingType: Transaccion.TransactionProcessingType\n                ,RelatedDepositRecounting: Transaccion.RelatedDepositRecounting\n            }\n        )\n        );\n        ForAll(colChecks As Check,\n        Patch('CH-Tbl-Checks', Check, {CheckStatus: 'CheckStatus (CH-Tbl-Checks)'.Recontado})\n        );\n        Patch('CH-Tbl-Bags', varBagRecord, {BagStatus: 'BagStatus (CH-Tbl-Bags)'.Recontada});\n\n        // Actualizar el detalle de la sesión a 'Cerrado con diferencias'\n        \n        Patch(\n            'CH-Tbl-RecountingSessionDetails',\n            LookUp(\n                'CH-Tbl-RecountingSessionDetails',\n                BagId.'CH-Tbl-Bags' = GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)\n            ),\n            {\n                RecountingSessionDetailStatus: 'ch-recountingDetailsStatus'.'Cerrado con diferencias'\n            }\n        );\n\n          Notify(\n                \"Diferencia\",\n                NotificationType.Success\n            );\n\n\n        UpdateContext({varExecuteApproveAction: true});,\n\n    \"Tula recontada sin declaracion\",\n    Notify(\"Entra\");\n    \n    With(\n        {RecountingSessionRecord: LookUp(\n                'CH-Tbl-RecountingSessions',\n                'CH-Tbl-RecountingSession' = GUID(ParseJSON(Table1.Selected.RequestResources).RecountingSessionGUID)\n                ) ,\n        BagRecord: LookUp(\n                'CH-Tbl-Bags',\n                'CH-Tbl-Bags' = GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)\n            ),\n        DeclaredBagRecord: LookUp(\n                'CH-Tbl-DeclaredBags',\n                'CH-Tbl-DeclaredBags' = IfError(GUID(ParseJSON(Table1.Selected.RequestResources).DeclarationBagGUID),Blank())\n            )\n        },\n        ClearCollect(colRecountedDepsoits, Filter('CH-Tbl-DepositsRecountings',BagID.'CH-Tbl-Bags' = GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)));\n        ForAll(colRecountedDepsoits As Transaccion,\n        Patch(\n\n            'CH-Tbl-Transactions',\n            Defaults('CH-Tbl-Transactions'),\n            {\n                AccountNumber: Transaccion.AccountNumber\n                ,Currency: Transaccion.Currency\n                ,CashAmount: Transaccion.CashAmount\n                ,BACLocalCheckAmount: Transaccion.BACLocalCheckAmount\n                ,OtherLocalCheckAmount: Transaccion.OtherLocaCheckAmount\n                ,TransactionReference: \"Recuento sin declaracion\"\n                ,TransactionType: 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion'\n                ,TransactionNumber: Transaccion.TransactionNumber\n                ,RelatedDepositRecounting: Transaccion\n                ,TransactionProcessingType: 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual\n            }\n        )\n        );\n        Patch('CH-Tbl-Bags', LookUp(\n                'CH-Tbl-Bags',\n                'CH-Tbl-Bags' = GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)), {BagStatus: 'BagStatus (CH-Tbl-Bags)'.Recontada});\n\n\n        // Actualizar el detalle de la sesión a 'Cerrado'\n     Patch(\n        'CH-Tbl-RecountingSessionDetails',\n        LookUp(\n            'CH-Tbl-RecountingSessionDetails',\n            BagId.'CH-Tbl-Bags' = GUID(ParseJSON(Table1.Selected.RequestResources).BagGUID)\n        ),\n        {\n            RecountingSessionDetailStatus: 'ch-recountingDetailsStatus'.Cerrado\n        }\n    );  \n\n        Notify(\n                \"Cerrado\",\n                NotificationType.Success\n            );\n\n        UpdateContext({varExecuteApproveAction: true});\n    ),\n    \"Editar tula\",\n    //Do nothing\n    With(\n        {\n            NewBagID: Text(ParseJSON(Table1.Selected.RequestResources).BagID),\n            BagGUID: GUID(ParseJSON(Table1.Selected.RequestResources).BagID),\n            ReceiptGUID: GUID(ParseJSON(Table1.Selected.RequestResources).ReceiptGUID),\n            Receipt: LookUp(\n                'CH-Tbl-Receptions',\n                'CH-Tbl-Receptions' = GUID(ParseJSON(Table1.Selected.RequestResources).ReceiptGUID)\n            ),\n            ReceptionBatchGUID: GUID(ParseJSON(Table1.Selected.RequestResources).ReceptionBatchGUID)\n        },\n        If(\n            !IsBlank(\n                LookUp(\n                    'CH-Tbl-Bags',\n                    ReceptionID.ReceptionBatch.'CH-Tbl-ReceptionBatch' = ReceptionBatchGUID && BagID = NewBagID\n                )\n            ),\n            Notify(\n                \"Este numero de tula ya se encuentra registrado en otra planilla en el mismo lote de recepcion\",\n                NotificationType.Error\n            ),\n            Patch(\n                'CH-Tbl-Bags',\n                LookUp('CH-Tbl-Bags', 'CH-Tbl-Bags' = BagGUID),\n                {\n                    Name: NewBagID,\n                    BagID: NewBagID\n                    ,BagStatus: 'BagStatus (CH-Tbl-Bags)'.'Almacenada en boveda'\n                }\n            );\n            UpdateContext({varExecuteApproveAction: true});\n        )\n    );\n    \n    \n);\nIf(\n    varExecuteApproveAction,\n    Patch(\n        'CH-Tbl-ApprovalRequests',\n        LookUp(\n            'CH-Tbl-ApprovalRequests',\n            'CH-Tbl-ApprovalRequest' = Table1.Selected.'CH-Tbl-ApprovalRequest'\n        ),\n        {\n            ApprovalStatus: 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado,\n            ResolutionDatetime: Now(),\n            SolvedBy: gvarUser\n        }\n    );\n    ResetForm(Form1);\n    UpdateContext(\n        {\n            newMode: false,\n            editMode: false,\n            CurrentItem: First(Table1.SelectedItems),\n            isItemSelected: false,\n            varScreenSpinnerMessage:Blank()\n        }\n    );\n    \n)"
                                          Text: ="Aprobar"
      - container ScreenSpinner:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.7)
            Height: =Parent.Height
            Visible: =!IsBlank(varScreenSpinnerMessage)
            Width: =Parent.Width
          Children:
            - Spinner1:
                Control: Spinner@1.4.6
                Properties:
                  Appearance: ='Spinner.Appearance'.Primary
                  BasePaletteColor: =RGBA(5, 102, 178, 1)
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =Parent.Height
                  Label: =varScreenSpinnerMessage
                  LabelPosition: ='Spinner.LabelPosition'.Below
                  SpinnerSize: ='Spinner.SpinnerSize'.Huge
                  Width: =Parent.Width
