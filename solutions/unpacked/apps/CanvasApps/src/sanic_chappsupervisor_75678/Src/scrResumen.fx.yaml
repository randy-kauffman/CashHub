                X: =cardDlgCierreRes.Width - 24 - 120 - 12 - 190
                Y: =cardDlgCierreRes.Height - 58
                ZIndex: =6

            btnDlgCieConfirmarRes As button:
                BorderThickness: =0
                Color: =ThemeSurface
                DisabledFill: =ThemeLine
                DisplayMode: |-
                    =If(
                        ctxCierreEnCursoRes || CountRows(Filter(colPrevueloRes, FrenaRes)) > 0,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                Fill: =ThemeDanger
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =38
                HoverColor: =ThemeSurface
                HoverFill: =ThemeDanger
                OnSelect: |-
                    =// El boton ya esta deshabilitado si hay frenos: esto es el segundo
                    // cinturon. El que manda igual es el guard del servidor —cerrar la
                    // sesion es un Update que se puede hacer por Web API—, asi que la
                    // app no decide, solo evita el viaje.
                    UpdateContext({ctxCierreEnCursoRes: true});
                    IfError(
                        UpdateContext({
                            ctxRespCierreRes: Environment.sanic_CHForceCloseRecountingSession(
                                {
                                    SessionId: Text(ctxSesCierreRes.'CH-Tbl-RecountingSession'),
                                    Reason: "Cierre forzado desde el resumen de operación"
                                }
                            )
                        }),
                        Notify("No se pudo cerrar la sesión: " & FirstError.Message, NotificationType.Error);
                        UpdateContext({ ctxRespCierreRes: Blank() })
                    );
                    If(
                        ctxRespCierreRes.Outcome = "Closed",
                        Notify(ctxRespCierreRes.Message, NotificationType.Success);
                        UpdateContext({ctxDlgCierreRes: false});
                        Select(btnActualizarRes),
                        !IsBlank(ctxRespCierreRes.Outcome),
                        Notify(ctxRespCierreRes.Message, NotificationType.Error)
                    );
                    UpdateContext({ctxCierreEnCursoRes: false})
                PressedColor: =ThemeSurface
                PressedFill: =ThemeDanger
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =10
                Text: =If(ctxCierreEnCursoRes, "Cerrando…", "Cerrar y liberar las tulas")
                Width: =190
                X: =cardDlgCierreRes.Width - 24 - 190
                Y: =cardDlgCierreRes.Height - 58
                ZIndex: =7

    cntCargandoRes As groupContainer.manualLayoutContainer:
        Fill: =RGBA(0, 0, 0, 0.35)
        Height: =Parent.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        Visible: =ctxCargandoRes
        Width: =Parent.Width
        ZIndex: =3

        lblCargandoRes As label:
            Align: =Align.Center
            BorderColor: =App.Theme.Colors.Darker40
            Color: |-
                =ColorValue("#FFFFFF")
            DisabledColor: =RGBA(166, 166, 166, 1)
            Font: =Font.'Segoe UI'
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: ="Actualizando..."
            Width: =cntCargandoRes.Width
            Y: =cntCargandoRes.Height / 2 - 20
            ZIndex: =1

