scrAprobaciones As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =ThemeAccent
    OnVisible: |-
        =UpdateContext(
            {
                ctxSegApr: "pendientes",
                ctxConfirmApr: "",
                ctxCargandoApr: false,
                ctxResueltaApr: false,
                ctxCargadoIdApr: GUID("00000000-0000-0000-0000-000000000000")
            }
        );
        Reset(inpBuscarApr);
        Reset(inpMotivoApr);
        Reset(galBandejaApr);
        Select(btnActualizarApr)

    cmpNavApr As cmpNav:
        Height: =Parent.Height

    cntBodyApr As groupContainer.horizontalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =14
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        PaddingBottom: =18
        PaddingLeft: =26
        PaddingRight: =26
        PaddingTop: =22
        Width: =Parent.Width - cmpNavApr.Width
        X: =cmpNavApr.Width
        ZIndex: =2

        cntTituloApr As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =52
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =3
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =52
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            ZIndex: =1

            lblTituloApr As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =26
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =26
                LayoutMinWidth: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =18
                Text: ="Aprobaciones"
                ZIndex: =1

            lblSubtituloApr As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                Height: =20
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =20
                LayoutMinWidth: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =10.5
                Text: ="Solicitudes que requieren tu firma. No podés aprobar lo que vos mismo solicitaste."
                ZIndex: =2

        cardFiltrosApr As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface
            FillPortions: =0
            Height: =74
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =74
            LayoutMinWidth: =16
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            ZIndex: =2

            segPendApr As button:
                BorderColor: =ThemeLine
                BorderThickness: =1
                Color: =If(ctxSegApr = "pendientes", ThemeAccentInk, ThemeInk2)
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =If(ctxSegApr = "pendientes", ThemeAccent, ThemeSurface2)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =34
                HoverBorderColor: =ThemeLine
                HoverFill: =Self.Fill
                OnSelect: |-
                    =Reset(inpMotivoApr);
                    UpdateContext({ctxSegApr: "pendientes", ctxConfirmApr: ""});
                    Reset(galBandejaApr);
                    Select(btnRecargarDetalleApr)
                PressedBorderColor: =ThemeLine
                PressedColor: =Self.Color
                PressedFill: =Self.Fill
                RadiusBottomLeft: =8
                RadiusBottomRight: =0
                RadiusTopLeft: =8
                RadiusTopRight: =0
                Size: =9.5
                Text: ="Pendientes  " & CountRows(Filter('CH-Tbl-ApprovalRequests', ApprovalStatus = Blank()))
                Width: =152
                X: =16
                Y: =20
                ZIndex: =1

            segHistApr As button:
                BorderColor: =ThemeLine
                BorderThickness: =1
                Color: =If(ctxSegApr = "historico", ThemeAccentInk, ThemeInk2)
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =If(ctxSegApr = "historico", ThemeAccent, ThemeSurface2)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =34
                HoverBorderColor: =ThemeLine
                HoverFill: =Self.Fill
                OnSelect: |-
                    =Reset(inpMotivoApr);
                    UpdateContext({ctxSegApr: "historico", ctxConfirmApr: ""});
                    Reset(galBandejaApr);
                    Select(btnRecargarDetalleApr)
                PressedBorderColor: =ThemeLine
                PressedColor: =Self.Color
                PressedFill: =Self.Fill
                RadiusBottomLeft: =0
                RadiusBottomRight: =8
                RadiusTopLeft: =0
                RadiusTopRight: =8
                Size: =9.5
                Text: ="Histórico"
                Width: =110
                X: =168
                Y: =20
                ZIndex: =2

            lblBuscarApr As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =14
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8.5
                Text: ="BUSCAR"
                Width: =120
                X: =298
                Y: =10
                ZIndex: =3

            inpBuscarApr As text:
                BorderColor: =ThemeLine
                Clear: =true
                Color: =ThemeInk
                Default: =""
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =ThemeSurface2
                FocusedBorderThickness: =2
                Font: =Font.'Segoe UI'
                Height: =34
                HintText: ="Tipo, número de solicitud o número de tula…"
                HoverBorderColor: =ThemeLine
                HoverColor: =ThemeInk
                HoverFill: =ThemeSurface2
                PaddingLeft: =30
                Size: =9.5
                Width: =cardFiltrosApr.Width - 640
                X: =298
                Y: =26
                ZIndex: =4

            icoBuscarApr As icon:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(244, 244, 244, 1)
                DisplayMode: =DisplayMode.View
                Height: =16
                Icon: =Icon.Search
                Width: =16
                X: =306
                Y: =35
                ZIndex: =5

            cirSyncApr As circle:
                BorderColor: =App.Theme.Colors.Darker40
                Fill: =ThemeAccent
                Height: =8
                Width: =8
                X: =cardFiltrosApr.Width - 320
                Y: =40
                ZIndex: =6

            lblSyncApr As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                Height: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8.5
                Text: |-
                    =If(IsBlank(ctxUltimaActApr), "Bandeja al día", "Actualizado " & Text(ctxUltimaActApr, "HH:mm:ss"))
                Width: =160
                X: =cardFiltrosApr.Width - 304
                Y: =32
                ZIndex: =7

            btnActualizarApr As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderThickness: =0
                Color: =ThemeAccentInk
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =ThemeAccent
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =36
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =ThemeAccentInk
                HoverFill: =ColorFade(ThemeAccent, -10%)
                OnSelect: |-
                    =Refresh('CH-Tbl-ApprovalRequests');
                    UpdateContext({ctxUltimaActApr: Now()});
                    Reset(galBandejaApr);
                    Select(btnRecargarDetalleApr)
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =ThemeAccentInk
                PressedFill: =ColorFade(ThemeAccent, -20%)
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =9.5
                Text: ="↻  Actualizar"
                Width: =124
                X: =cardFiltrosApr.Width - 140
                Y: =28
                ZIndex: =8

        cntMasterDetalleApr As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =If(scrAprobaciones.Width >= 1212, cntBodyApr.Height - 194, 1240)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =If(scrAprobaciones.Width >= 1212, cntBodyApr.Height - 194, 1240)
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            LayoutWrap: =true
            ZIndex: =3

            cardBandejaApr As groupContainer.manualLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =ThemeSurface
                FillPortions: =5
                Height: =If(scrAprobaciones.Width >= 1212, cntMasterDetalleApr.Height, 610)
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =380
                RadiusBottomLeft: =10
                RadiusBottomRight: =10
                RadiusTopLeft: =10
                RadiusTopRight: =10
                ZIndex: =1

                lblBandejaTituloApr As label:
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =18
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =10.5
                    Text: ="Bandeja de solicitudes"
                    Width: =7 * Len(Self.Text) + 8
                    X: =16
                    Y: =12
                    ZIndex: =1

                pilBandejaCountApr As button:
                    BorderColor: =ThemeLine
                    BorderThickness: =If(Self.Fill = ThemeSunk, 1, 0)
                    Color: =ThemeInk3
                    DisabledBorderColor: =RGBA(244, 244, 244, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    DisabledFill: =RGBA(244, 244, 244, 1)
                    DisplayMode: =DisplayMode.View
                    Fill: =ThemeSunk
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =22
                    HoverBorderColor: =Self.BorderColor
                    HoverFill: =Self.Fill
                    PaddingLeft: =0
                    PaddingRight: =0
                    PressedBorderColor: =Self.BorderColor
                    PressedColor: =Self.Color
                    PressedFill: =Self.Fill
                    Size: =9
                    Text: =CountRows(galBandejaApr.AllItems) & If(ctxSegApr = "pendientes", " pendientes", " resueltas")
                    Width: =12 + 7 * Len(Self.Text)
                    X: =lblBandejaTituloApr.X + lblBandejaTituloApr.Width + 10
                    Y: =11
                    ZIndex: =2

                shpLineaHeadApr As rectangle:
                    BorderColor: =App.Theme.Colors.Darker40
                    Fill: =ThemeLine
                    Height: =1
                    Width: =cardBandejaApr.Width
                    Y: =44
                    ZIndex: =3

                galBandejaApr As gallery.galleryVertical:
                    BorderColor: =App.Theme.Colors.Darker40
                    Height: =cardBandejaApr.Height - 45
                    Items: |-
                        =If(
                            ctxSegApr = "pendientes",
                            SortByColumns(
                                Filter(
                                    'CH-Tbl-ApprovalRequests',
                                    ApprovalStatus = Blank()
                                    && (
                                        StartsWith(RequestType, inpBuscarApr.Text)
                                        || StartsWith(Name, inpBuscarApr.Text)
                                        || StartsWith(BagNumber, inpBuscarApr.Text)
                                    )
                                ),
                                "createdon",
                                SortOrder.Descending
                            ),
                            SortByColumns(
                                Filter(
                                    'CH-Tbl-ApprovalRequests',
                                    ApprovalStatus <> Blank()
                                    && (
                                        StartsWith(RequestType, inpBuscarApr.Text)
                                        || StartsWith(Name, inpBuscarApr.Text)
                                        || StartsWith(BagNumber, inpBuscarApr.Text)
                                    )
                                ),
                                "createdon",
                                SortOrder.Descending
                            )
                        )
                    Layout: =Layout.Vertical
                    OnSelect: |-
                        =Reset(inpMotivoApr);
                        UpdateContext({ctxConfirmApr: ""});
                        Select(btnRecargarDetalleApr)
                    TemplateFill: =If(ThisItem.'CH-Tbl-ApprovalRequest' = galBandejaApr.Selected.'CH-Tbl-ApprovalRequest', ThemeAccentSoft, ThemeSurface)
                    TemplatePadding: =0
                    TemplateSize: =58
                    Width: =cardBandejaApr.Width
                    Y: =45
                    ZIndex: =4

                    btnFilaApr As button:
                        BorderColor: =App.Theme.Colors.Primary
                        BorderThickness: =0
                        Color: =ThemeInk
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =58
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =ThemeInk
                        HoverFill: =ThemeSurface2
                        OnSelect: =Select(Parent)
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =ThemeInk
                        PressedFill: =ThemeAccentSoft
                        Size: =10
                        Text: =""
                        Width: =galBandejaApr.Width
                        ZIndex: =1

                    lblFilaTipoApr As label:
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =ThemeInk
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =10.5
                        Text: =ThisItem.RequestType
                        Width: |-
                            =galBandejaApr.Width - 28
                            - If(ctxSegApr = "historico", 92, 0)
                            - If(scrAprobaciones.Width >= 1100, 116, 0)
                        X: =14
                        Y: =9
                        ZIndex: =2

                    lblFilaMetaApr As label:
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =ThemeInk3
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        Font: =Font.'Segoe UI'
                        Height: =18
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8.5
                        Text: =ThisItem.Name & "  ·  " & ThisItem.'Created By'.'Full Name'
                        Width: |-
                            =galBandejaApr.Width - 28
                            - If(ctxSegApr = "historico", 92, 0)
                            - If(scrAprobaciones.Width >= 1100, 116, 0)
                        X: =14
                        Y: =29
                        ZIndex: =3

                    pilFilaEstadoApr As button:
                        BorderColor: =ThemeLine
                        BorderThickness: =If(Self.Fill = ThemeSunk, 1, 0)
                        Color: =If(ThisItem.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado, ThemePos, ThemeDanger)
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        DisplayMode: =DisplayMode.View
                        Fill: =If(ThisItem.ApprovalStatus = 'ApprovalStatus (CH-Tbl-ApprovalRequests)'.Aprobado, ThemePosSoft, ThemeDangerSoft)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        HoverBorderColor: =Self.BorderColor
                        HoverFill: =Self.Fill
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
                        PaddingRight: =0
                        PressedBorderColor: =Self.BorderColor
                        PressedColor: =Self.Color
                        PressedFill: =Self.Fill
                        Size: =9
                        Text: =Text(ThisItem.ApprovalStatus)
                        Visible: =ctxSegApr = "historico" && !IsBlank(ThisItem.ApprovalStatus)
                        Width: =12 + 7 * Len(Self.Text)
                        X: =galBandejaApr.Width - If(scrAprobaciones.Width >= 1100, 130, 14) - Self.Width
                        Y: =18
                        ZIndex: =4

                    lblFilaCuandoApr As label:
                        Align: =Align.Right
                        BorderColor: =App.Theme.Colors.Darker40
                        Color: =ThemeInk3
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        Font: =Font.'Segoe UI'
                        Height: =18
                        OnSelect: =Select(Parent)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =8.5
                        Text: |-
                            =With(
                                { d: DateValue(ThisItem.'Created On') },
                                If(
                                    d = Today(), "hoy " & Text(ThisItem.'Created On', "HH:mm"),
                                    d = DateAdd(Today(), -1, TimeUnit.Days), "ayer " & Text(ThisItem.'Created On', "HH:mm"),
                                    Text(ThisItem.'Created On', FmtFechaCorta)
                                )
                            )
                        Visible: =scrAprobaciones.Width >= 1100
                        Width: =100
                        X: =galBandejaApr.Width - 116
                        Y: =20
                        ZIndex: =5

                    shpSepFilaApr As rectangle:
                        BorderColor: =App.Theme.Colors.Darker40
                        Fill: =ThemeLine
                        Height: =1
                        OnSelect: =Select(Parent)
                        Width: =galBandejaApr.Width
                        Y: =57
                        ZIndex: =6

                icoVacioBandejaApr As icon:
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk3
                    DisabledBorderColor: =RGBA(166, 166, 166, 1)
                    DisabledColor: =RGBA(244, 244, 244, 1)
                    Height: =32
                    Icon: =Icon.CheckBadge
                    Visible: =CountRows(galBandejaApr.AllItems) = 0 && !ctxCargandoApr
                    Width: =32
                    X: =cardBandejaApr.Width / 2 - 16
                    Y: =cardBandejaApr.Height / 2 - 60
                    ZIndex: =5

                lblVacioBandejaTitApr As label:
                    Align: =Align.Center
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =20
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =12
                    Text: =If(ctxSegApr = "pendientes", "No hay solicitudes pendientes", "No hay solicitudes resueltas con ese criterio")
                    Visible: =CountRows(galBandejaApr.AllItems) = 0 && !ctxCargandoApr
                    Width: =cardBandejaApr.Width - 40
                    X: =20
                    Y: =cardBandejaApr.Height / 2 - 18
                    ZIndex: =6

                lblVacioBandejaTxtApr As label:
                    Align: =Align.Center
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk3
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Font: =Font.'Segoe UI'
                    Height: =36
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =9.5
                    Text: =If(ctxSegApr = "pendientes", "Todo lo que requería tu firma ya fue resuelto.", "Probá con otro texto de búsqueda o volvé a Pendientes.")
                    Visible: =CountRows(galBandejaApr.AllItems) = 0 && !ctxCargandoApr
                    Width: =cardBandejaApr.Width - 40
                    X: =20
                    Y: =cardBandejaApr.Height / 2 + 4
                    ZIndex: =7

            cardDetalleApr As groupContainer.manualLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =ThemeSurface
                FillPortions: =4
                Height: =If(scrAprobaciones.Width >= 1212, cntMasterDetalleApr.Height, 610)
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =550
                RadiusBottomLeft: =10
                RadiusBottomRight: =10
                RadiusTopLeft: =10
                RadiusTopRight: =10
                ZIndex: =2

                cntDetStackApr As groupContainer.horizontalAutoLayoutContainer:
                    Height: =cardDetalleApr.Height
                    LayoutAlignItems: =LayoutAlignItems.Stretch
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGap: =12
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    LayoutMode: =LayoutMode.Auto
                    LayoutOverflowY: =LayoutOverflow.Scroll
                    PaddingBottom: =14
                    PaddingLeft: =16
                    PaddingRight: =16
                    PaddingTop: =14
                    Visible: =!IsBlank(galBandejaApr.Selected)
                    Width: =cardDetalleApr.Width
                    ZIndex: =1

                    cntDetCabeceraApr As groupContainer.manualLayoutContainer:
                        FillPortions: =0
                        Height: =54
                        LayoutGridColumnMinWidth: =0
                        LayoutGridColumns: =6
                        LayoutGridRowMinHeight: =0
                        LayoutGridRows: =6
                        LayoutMaxHeight: =0
                        LayoutMaxWidth: =0
                        LayoutMinHeight: =54
                        LayoutMinWidth: =16
                        ZIndex: =1

                        lblDetTituloApr As label:
                            BorderColor: =App.Theme.Colors.Darker40
                            Color: =ThemeInk
                            DisabledColor: =RGBA(166, 166, 166, 1)
                            Font: =Font.'Segoe UI'
                            FontWeight: =FontWeight.Semibold
                            Height: =24
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Size: =13
                            Text: |-
                                =galBandejaApr.Selected.RequestType
                                & If(
                                    !IsBlank(ctxBagApr),
                                    " — " & ctxBagApr.BagID,
                                    IsBlank(galBandejaApr.Selected.Name),
                                    "",
                                    " — " & galBandejaApr.Selected.Name
                                )
                            Width: =cntDetCabeceraApr.Width - 46
                            ZIndex: =1

                        lblDetSubApr As label:
                            BorderColor: =App.Theme.Colors.Darker40
                            Color: =ThemeInk3
                            DisabledColor: =RGBA(166, 166, 166, 1)
                            Font: =Font.'Segoe UI'
                            Height: =26
                            PaddingBottom: =0
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            Size: =9
                            Text: |-
                                ="Solicitada por " & galBandejaApr.Selected.'Created By'.'Full Name'
                                & If(IsBlank(ctxSesionApr.CountingDesk.Name), "", " (" & ctxSesionApr.CountingDesk.Name & ")")
                                & If(IsBlank(ctxSesionApr.Name), "", "  ·  sesión " & ctxSesionApr.Name)
                                & "  ·  " & Text(galBandejaApr.Selected.'Created On', FmtFecha)
                                & If(IsBlank(galBandejaApr.Selected.ApprovalStatus), "", "  ·  " & Text(galBandejaApr.Selected.ApprovalStatus))
                                & If(IsBlank(galBandejaApr.Selected.SolvedBy), "", " por " & galBandejaApr.Selected.SolvedBy.'Full Name')
                                & If(IsBlank(galBandejaApr.Selected.ResolutionDatetime), "", " el " & Text(galBandejaApr.Selected.ResolutionDatetime, FmtFecha))
                            Width: =cntDetCabeceraApr.Width - 46
                            Y: =26
                            ZIndex: =2

                    cntDetStaleApr As groupContainer.manualLayoutContainer:
                        BorderColor: =ThemeWarn
                        BorderThickness: =1
                        Fill: =ThemeWarnSoft
                        FillPortions: =0
