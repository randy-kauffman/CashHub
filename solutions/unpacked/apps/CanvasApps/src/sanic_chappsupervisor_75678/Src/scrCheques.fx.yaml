scrCheques As screen:
    Fill: =ThemeBg
    LoadingSpinnerColor: =ThemeAccent
    OnVisible: |-
        =UpdateContext({ctxStaleChq: false, ctxConfirmReenvChq: false, ctxEnviandoChq: false});
        Clear(colSelChq);                  // selección stale = doble envío (bug de la vieja)
        If(
            IsEmpty(colChequesChq),
            Select(btnActualizarChq)       // primera visita: carga sola
        );
        Reset(drpEstadoChq);
        Reset(galChequesChq)

    cmpNavChq As cmpNav:
        Height: =Parent.Height

    cntBodyChq As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =14
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        PaddingBottom: =18
        PaddingLeft: =26
        PaddingRight: =26
        PaddingTop: =22
        Width: =Parent.Width - cmpNavChq.Width
        X: =cmpNavChq.Width
        ZIndex: =2

        cntTituloChq As groupContainer.verticalAutoLayoutContainer:
            FillPortions: =0
            Height: =52
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =3
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =52
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            ZIndex: =1

            lblTituloChq As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =28
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =28
                LayoutMinWidth: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =18
                Text: ="Cheques"
                Width: =560
                ZIndex: =1

            lblSubtituloChq As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                Height: =20
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =20
                LayoutMinWidth: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =10.5
                Text: ="Entrega de cheques a digitación. Solo se pueden seleccionar los cheques recontados."
                Width: =560
                ZIndex: =2

        cardFiltrosChq As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface
            FillPortions: =0
            Height: =74
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =74
            LayoutMinWidth: =16
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            ZIndex: =2

            lblFecFiltroChq As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8.5
                Text: ="FECHA"
                Width: =200
                X: =16
                Y: =10
                ZIndex: =1

            dtFechaChq As modernDatePicker:
                Appearance: =Appearance.FilledDarker
                DefaultDate: =Today()
                Format: =DatePickerFormat.Short
                Height: =34
                OnChange: |-
                    =UpdateContext({ctxStaleChq: true});
                    Clear(colSelChq)
                Placeholder: ="Select a date"
                ValidationState: =ValidationState.None
                Width: =200
                X: =16
                Y: =30
                ZIndex: =2

            lblEstFiltroChq As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =16
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8.5
                Text: ="ESTADO"
                Width: =230
                X: =236
                Y: =10
                ZIndex: =3

            drpEstadoChq As dropdown:
                BorderColor: =ThemeLine
                BorderThickness: =1
                ChevronBackground: =ThemeSurface
                ChevronDisabledBackground: =RGBA(166, 166, 166, 1)
                ChevronDisabledFill: =RGBA(244, 244, 244, 1)
                ChevronFill: =ThemeInk2
                ChevronHoverBackground: =ThemeSurface2
                ChevronHoverFill: =ThemeAccent
                Color: =ThemeInk
                Default: ="Todos"
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =ThemeSurface
                Font: =Font.'Segoe UI'
                Height: =34
                HoverColor: =ThemeInk
                HoverFill: =ThemeSurface2
                Items: =["Pendientes de enviar", "Enviados", "No recibidos", "Todos"]
                OnChange: =Clear(colSelChq)
                PressedColor: =ThemeAccentInk
                PressedFill: =ThemeAccent
                SelectionColor: =ThemeAccentInk
                SelectionFill: =ThemeAccent
                Size: =10
                Width: =230
                X: =236
                Y: =30
                ZIndex: =4

            cirSyncChq As circle:
                BorderColor: =App.Theme.Colors.Darker40
                Fill: =ThemeAccent
                Height: =8
                Visible: =scrCheques.Width >= 1130
                Width: =8
                X: =cardFiltrosChq.Width - 320
                Y: =40
                ZIndex: =5

            lblSyncChq As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk3
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                Height: =20
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8.5
                Text: |-
                    =If(IsBlank(ctxUltimaActChq), "Sin actualizar", "Actualizado " & Text(ctxUltimaActChq, "HH:mm:ss"))
                Visible: =scrCheques.Width >= 1130
                Width: =160
                X: =cardFiltrosChq.Width - 304
                Y: =32
                ZIndex: =6

            btnActualizarChq As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderThickness: =0
                Color: =ThemeAccentInk
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =ThemeAccent
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =36
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =ThemeAccentInk
                HoverFill: =ColorFade(ThemeAccent, -10%)
                OnSelect: |-
                    =UpdateContext({ctxCargandoChq: true, ctxStaleChq: false});
                    Clear(colSelChq);
                    IfError(
                        // Ventana ACOTADA (fix del OR sin cota que truncaba a 500):
                        //   (a) TODO lo creado el día elegido, en cualquier estado, y
                        //   (b) el ARRASTRE: sólo lo que sigue pendiente de acción (Recontado / No
                        //       Recibido) de los últimos 30 días.
                        // Todo el predicado es delegable: comparaciones de fecha + igualdad de choice,
                        // combinadas con && / ||.
                        ClearCollect(colChequesChq,
                            Filter('CH-Tbl-Checks',
                                (
                                    'Created On' >= Coalesce(dtFechaChq.SelectedDate, Today())
                                    && 'Created On' < DateAdd(Coalesce(dtFechaChq.SelectedDate, Today()), 1, TimeUnit.Days)
                                )
                                ||
                                (
                                    (
                                        CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado
                                        || CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido'
                                    )
                                    && 'Created On' >= DateAdd(Coalesce(dtFechaChq.SelectedDate, Today()), -30, TimeUnit.Days)
                                    && 'Created On' < DateAdd(Coalesce(dtFechaChq.SelectedDate, Today()), 1, TimeUnit.Days)
                                )
                            )
                        );
                        UpdateContext({ctxUltimaActChq: Now()}),
                    
                        // rama de error del IfError
                        Notify("No se pudieron cargar los cheques: " & FirstError.Message, NotificationType.Error)
                    );
                    UpdateContext({ctxCargandoChq: false});
                    Reset(galChequesChq)
                PressedBorderColor: =App.Theme.Colors.Darker40
                PressedColor: =ThemeAccentInk
                PressedFill: =ColorFade(ThemeAccent, -20%)
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =10
                Text: ="↻  Actualizar"
                Width: =124
                X: =cardFiltrosChq.Width - 140
                Y: =28
                ZIndex: =7

        cntStaleChq As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeWarn
            BorderThickness: =1
            Fill: =ThemeWarnSoft
            FillPortions: =0
            Height: =40
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =40
            LayoutMinWidth: =16
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: =ctxStaleChq || CountRows(colChequesChq) >= 2000
            ZIndex: =3

            lblStaleChq As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeWarn
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =20
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =9
                Text: |-
                    =If(CountRows(colChequesChq) >= 2000,
                        "Se alcanzó el tope de 2000 filas: hay cheques cargados que no se ven. Acotá la fecha o filtrá por estado.",
                        "Cambiaste la fecha — los cheques de abajo corresponden a la selección anterior.")
                Width: =620
                X: =14
                Y: =10
                ZIndex: =1

            btnStaleChq As button:
                BorderColor: =ThemeWarn
                BorderThickness: =1
                Color: =ThemeWarn
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Fill: =RGBA(0, 0, 0, 0)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =26
                HoverBorderColor: =ThemeWarn
                HoverColor: =ThemeWarn
                HoverFill: =RGBA(0, 0, 0, 0)
                OnSelect: =Select(btnActualizarChq)
                PressedBorderColor: =ThemeWarn
                PressedColor: =ThemeWarn
                PressedFill: =RGBA(0, 0, 0, 0)
                RadiusBottomLeft: =6
                RadiusBottomRight: =6
                RadiusTopLeft: =6
                RadiusTopRight: =6
                Size: =9
                Text: ="Actualizar ahora"
                Visible: =ctxStaleChq
                Width: =136
                X: =cntStaleChq.Width - 150
                Y: =7
                ZIndex: =2

        cntKpisChq As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =If(scrCheques.Width < 1142, 204, 96)
            LayoutGap: =12
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =If(scrCheques.Width < 1142, 204, 96)
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            LayoutWrap: =true
            ZIndex: =4

            cmpKpiPorEnviarChq As cmpKpi:
                FillPortions: =1
                KpiLabel: ="POR ENVIAR"
                KpiPie: ="cheques recontados"
                KpiValor: =Text(CountRows(Filter(colChequesChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado)))
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =210
                OnKpiSelect: =false

            cmpKpiNioChq As cmpKpi:
                ChildTabPriority: =true
                ContentLanguage: =""
                EnableChildFocus: =true
                FillPortions: =1
                KpiAccent: =ThemeAccentMoney
                KpiCur: =SimboloNIO
                KpiLabel: ="MONTO · C$"
                KpiPie: |-
                    ="seleccionados: " & CountRows(Filter(colSelChq, CheckCurrency = 'CH-Ch-Currency'.NIO))
                KpiValor: |-
                    =Text(Coalesce(Sum(Filter(colChequesChq,
                        CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado
                        && CheckCurrency = 'CH-Ch-Currency'.NIO), CheckAmount), 0), FmtMoney)
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =210
                OnKpiSelect: =false
                Visible: =true

            cmpKpiUsdChq As cmpKpi:
                ChildTabPriority: =true
                ContentLanguage: =""
                EnableChildFocus: =true
                FillPortions: =1
                KpiAccent: =ThemeAccentMoney
                KpiCur: =SimboloUSD
                KpiLabel: ="MONTO · US$"
                KpiPie: |-
                    ="seleccionados: " & CountRows(Filter(colSelChq, CheckCurrency = 'CH-Ch-Currency'.USD))
                KpiValor: |-
                    =Text(Coalesce(Sum(Filter(colChequesChq,
                        CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado
                        && CheckCurrency = 'CH-Ch-Currency'.USD), CheckAmount), 0), FmtMoney)
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =210
                OnKpiSelect: =false
                Visible: =true

            cmpKpiNoRecChq As cmpKpi:
                ChildTabPriority: =true
                ContentLanguage: =""
                EnableChildFocus: =true
                FillPortions: =1
                KpiLabel: ="NO RECIBIDOS"
                KpiPie: ="para reenviar"
                KpiValor: =Text(CountRows(Filter(colChequesChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido')))
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinWidth: =210
                OnKpiSelect: =false
                Visible: =true

        cardChequesChq As groupContainer.manualLayoutContainer:
            BorderColor: =ThemeLine
            BorderThickness: =1
            DropShadow: =DropShadow.Light
            Fill: =ThemeSurface
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =300
            LayoutMinWidth: =16
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            ZIndex: =5

            lblChqTituloChq As label:
                BorderColor: =App.Theme.Colors.Darker40
                Color: =ThemeInk
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =20
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =10.5
                Text: ="Cheques del día y pendientes"
                Width: =200
                X: =16
                Y: =12
                ZIndex: =1

            pilSelCountChq As button:
                BorderColor: =ThemeLine
                BorderThickness: =0
                Color: =ThemeInk3
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                DisplayMode: =DisplayMode.View
                Fill: =ThemeSunk
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =22
                HoverBorderColor: =Self.BorderColor
                HoverFill: =Self.Fill
                PaddingLeft: =0
                PaddingRight: =0
                PressedBorderColor: =Self.BorderColor
                PressedColor: =Self.Color
                PressedFill: =Self.Fill
                Size: =9
                Text: =CountRows(colSelChq) & " seleccionado" & If(CountRows(colSelChq) = 1, "", "s")
                Visible: =scrCheques.Width >= 1100
                Width: =Len(Self.Text) * 7 + 12
                X: =220
                Y: =10
                ZIndex: =2

            btnReenviarChq As button:
                BorderColor: =ThemeLine
                BorderThickness: =1
                Color: =ThemeInk2
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                DisplayMode: |-
                    =If(CountRows(Filter(colChequesChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido')) = 0,
                        DisplayMode.Disabled,
                        DisplayMode.Edit)
                Fill: =ThemeSurface2
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =34
                HoverBorderColor: =ThemeLine
                HoverColor: =ThemeInk2
                HoverFill: =ThemeSunk
                OnSelect: |-
                    =UpdateContext({ctxConfirmReenvChq: true})
                PressedBorderColor: =ThemeLine
                PressedColor: =ThemeInk2
                PressedFill: =ThemeSunk
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =9.5
                Text: |-
                    =If(scrCheques.Width >= 1100,
                        "↩  Reenviar " & CountRows(Filter(colChequesChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido')) & " no recibidos",
                        "↩  " & CountRows(Filter(colChequesChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.'No Recibido')))
                Width: =If(scrCheques.Width >= 1100, 216, 150)
                X: =cardChequesChq.Width - 16 - If(scrCheques.Width >= 1100, 224, 160) - 8 - Self.Width
                Y: =8
                ZIndex: =8

            btnSelTodosChq As button:
                BorderColor: =ThemeLine
                BorderThickness: =1
                Color: =ThemeInk2
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                DisplayMode: |-
                    =If(
                        CountRows(Filter(galChequesChq.AllItems, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado)) = 0,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                Fill: =ThemeSurface
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =28
                HoverBorderColor: =ThemeLineStrong
                HoverColor: =ThemeInk
                HoverFill: =ThemeSurface2
                OnSelect: |-
                    =// NO envia: SELECCIONA. El envio ya era masivo —btnEnviarChq recorre
                    // todo lo seleccionado—; lo que se hacia de a uno era marcar.
                    //
                    // Se apoya en el mismo camino de siempre: llena colSelChq y deja que
                    // btnEnviarChq haga lo suyo. Un "enviar todo" aparte duplicaria la
                    // logica de envio, el reporte por cheque y el descarte de los que no
                    // estan en Recontado, y las dos copias se irian separando.
                    //
                    // Y conserva el paso de confirmacion: el boton de enviar sigue
                    // diciendo cuantos van ANTES de apretarlo.
                    With(
                        {
                            // DE LA GALERIA, no de la coleccion cruda: "los primeros"
                            // tiene que significar los primeros QUE SE VEN, con el
                            // filtro y el orden que el supervisor tiene puesto.
                            Enviables: FirstN(
                                Filter(
                                    galChequesChq.AllItems,
                                    CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado
                                ),
                                TopeEnvioChq
                            )
                        },
                        If(
                            // ya estaban marcados => el boton hace de "quitar"
                            CountRows(colSelChq) >= CountRows(Enviables) && CountRows(Enviables) > 0,
                            Clear(colSelChq),
                            ClearCollect(colSelChq, Enviables)
                        )
                    )
                PaddingLeft: =10
                PaddingRight: =10
                PressedBorderColor: =ThemeLineStrong
                PressedColor: =ThemeInk
                PressedFill: =ThemeSurface2
                RadiusBottomLeft: =6
                RadiusBottomRight: =6
                RadiusTopLeft: =6
                RadiusTopRight: =6
                Size: =9
                Text: |-
                    =With(
                        {
                            hay: CountRows(
                                Filter(galChequesChq.AllItems, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado)
                            )
                        },
                        With(
                            { n: Min(hay, TopeEnvioChq) },
                            If(
                                CountRows(colSelChq) >= n && n > 0,
                                "Quitar selección",
                                "Seleccionar " & n &
                                If(hay > TopeEnvioChq, " (de " & hay & ")", "") & " enviables"
                            )
                        )
                    )
                Tooltip: |-
                    ="Marca los primeros " & TopeEnvioChq & " cheques en estado Recontado, en el orden en que se ven. " &
                    "El tope existe porque una operación corta a los 2 minutos y el envío patchea de a un cheque: " &
                    "mandar más quedaría a medias sin que nadie sepa por dónde. Repetí la tanda hasta terminar."
                Width: =7 * Len(Self.Text) + 22
                X: =220 + If(pilSelCountChq.Visible, pilSelCountChq.Width + 10, 0)
                Y: =7
                ZIndex: =9

            btnEnviarChq As button:
                BorderColor: =App.Theme.Colors.Primary
                BorderThickness: =0
                Color: =ThemeAccentInk
                DisabledBorderColor: =RGBA(244, 244, 244, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                DisplayMode: =If(CountRows(colSelChq) = 0, DisplayMode.Disabled, DisplayMode.Edit)
                Fill: =ThemeAccent
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =34
                HoverBorderColor: =App.Theme.Colors.Darker10
                HoverColor: =ThemeAccentInk
                HoverFill: =ColorFade(ThemeAccent, -10%)
                OnSelect: |-
                    =UpdateContext({ctxCargandoChq: true, ctxEnviandoChq: true});
                    
                    // 1) CINTURÓN: aunque el icono sólo deja marcar Recontado, la colección pudo quedar
                    //    stale (otro supervisor envió el cheque hace 40 segundos). Sólo Recontado sale.
                    ClearCollect(colEnviarChq,
                        Filter(colSelChq, CheckStatus = 'CheckStatus (CH-Tbl-Checks)'.Recontado)
                    );
                    UpdateContext({ctxDescartadosChq: CountRows(colSelChq) - CountRows(colEnviarChq)});
                    
                    // 2) UN Patch por cheque, cada uno envuelto en su IfError: se cuentan éxitos y
                    //    fallos REALES (la vieja hacía ForAll(Patch(...)) sin IfError: fallos mudos).
                    //    IfError(Valor, Fallback, Default): con 3 argumentos, el último se devuelve
                    //    cuando NO hubo error.
                    ClearCollect(colEnvioResChq,
                        ForAll(colEnviarChq As C,
                            IfError(
                                Patch('CH-Tbl-Checks', C,
                                    { CheckStatus: 'CheckStatus (CH-Tbl-Checks)'.'Enviado a digitacion' }
                                ),
                                { OkChq: false, MsgChq: FirstError.Message },
                                { OkChq: true,  MsgChq: "" }
                            )
                        )
                    );
                    UpdateContext({
                        ctxEnviadosChq:   CountRows(Filter(colEnvioResChq, OkChq)),
                        ctxRechazadosChq: CountRows(Filter(colEnvioResChq, !OkChq))
                    });
                    
                    // 3) Los sellos ('Enviado el') los estampa el plugin server-side: hay que RELEER.
                    //    La recarga pasa por el ÚNICO camino de consulta — que además hace Clear(colSelChq).
                    Refresh('CH-Tbl-Checks');
                    Select(btnActualizarChq);
                    
                    // 4) Notificación HONESTA (la vieja no notificaba nada en Enviar)
                    Notify(
                        ctxEnviadosChq & " enviado(s) a digitación"
                        & If(ctxRechazadosChq > 0,
