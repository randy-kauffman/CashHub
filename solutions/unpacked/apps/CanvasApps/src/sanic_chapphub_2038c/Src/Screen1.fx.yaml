Screen1 As screen:
    Fill: =Color.White
    LoadingSpinnerColor: =App.Theme.Colors.Primary

    "Gallery1 As gallery.'BrowseLayout_Vertical_ThreeTextOneImageVariant_ver5.0'":
        BorderColor: =App.Theme.Colors.Darker40
        DelayItemLoading: =true
        Height: =Parent.Height - Self.Y
        Items: ='CH-Tbl-AppCatalogs'
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        ShowScrollbar: =false
        TemplatePadding: =0
        TemplateSize: =140
        Transition: =Transition.Pop
        Width: =Parent.Width
        WrapCount: =Trunc(Self.Width/300)
        X: =0.00
        Y: =Image2.Height
        ZIndex: =1

        Container1 As groupContainer.manualLayoutContainer:
            BorderColor: =RGBA(232, 232, 232, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.Semibold
            Height: =80
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.TemplateWidth * 80%
            X: =(Parent.TemplateWidth - Self.Width) / 2
            Y: =(Parent.TemplateHeight - Self.Height) / 2
            ZIndex: =1

            Image3 As image:
                BorderColor: =App.Theme.Colors.Darker40
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledFill: =RGBA(244, 244, 244, 1)
                Height: =64
                Image: =ThisItem.Icon
                OnSelect: =Launch(ThisItem.AppURL,{},LaunchTarget.Replace)
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Width: =64
                X: =8
                Y: =(Parent.Height - Self.Height) / 2
                ZIndex: =1

            Body1 As label:
                Align: =Align.Center
                Color: =RGBA(0, 0, 0, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =App.Theme.Font
                FontWeight: =FontWeight.Lighter
                Height: =Parent.Height - Self.Y - 5
                OnSelect: =
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =8
                Text: =ThisItem.Description
                VerticalAlign: =VerticalAlign.Top
                Width: =Title1.Width - 12
                X: =Title1.X
                Y: =Title1.Y + Title1.Height
                ZIndex: =2

            Title1 As label:
                Align: =Align.Center
                Color: =RGBA(50, 49, 48, 1)
                DisabledColor: =RGBA(166, 166, 166, 1)
                Font: =App.Theme.Font
                FontWeight: =If(ThisItem.IsSelected, FontWeight.Bold, FontWeight.Semibold)
                Height: =Self.Size * 1.8
                OnSelect: =
                PaddingBottom: =0
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                Size: =10
                Text: =ThisItem.'Display Name'
                VerticalAlign: =VerticalAlign.Top
                Width: =(Parent.Width - Self.X) - 20
                X: =Image3.Width + Image3.X + 20
                Y: =6
                ZIndex: =3

            NextArrow1 As icon:
                AccessibleLabel: =Self.Tooltip
                BorderColor: =App.Theme.Colors.Darker40
                Color: =RGBA(79, 90, 94, 1)
                DisabledBorderColor: =RGBA(166, 166, 166, 1)
                DisabledColor: =RGBA(244, 244, 244, 1)
                Height: =20
                Icon: =Icon.ChevronRight
                OnSelect: =Launch(ThisItem.AppURL,{},LaunchTarget.Replace)
                Tooltip: ="View item details"
                Width: =20
                X: =Parent.Width - Self.Width - 12
                Y: =(Parent.Height / 2) - (Self.Height / 2)
                ZIndex: =4

    Image2 As image:
        BorderColor: =App.Theme.Colors.Darker40
        DisabledBorderColor: =RGBA(166, 166, 166, 1)
        DisabledFill: =RGBA(244, 244, 244, 1)
        Height: =Parent.Width / 7.383783783783784
        Image: |-
            ="data:image/svg+xml,"
            &
            EncodeUrl("
            <svg xmlns='http://www.w3.org/2000/svg' role='img' aria-labelledby='title desc'
                 viewBox='0 0 1920 260'  width='100%' preserveAspectRatio='xMidYMid slice'>
              <title id='title'>CASH HUB</title>
              <desc id='desc'>Ilustración con bóveda, cinta transportadora, bolsas de dinero animadas y contadores.</desc>
            
              <!-- ====== THEME (ajusta colores aquí) ====== -->
              <style>
                :root{
                  --bg1:#0b2738; --bg2:#0e3a4a;
                  --accent:#2dd4bf; --accent2:#60a5fa; --accent3:#f59e0b;
                  --text:#e6f1f4; --muted:#9fb6c3;
                  --success:#22c55e; --warn:#f59e0b; --danger:#ef4444;
                  --belt:#0f2530; --beltEdge:#163341; --bag1:#1fa38a; --bag2:#0ea5e9; --bag3:#7c3aed;
                  --bill:#16a34a;   /* billetes               */
                  --coin:#f59e0b;   /* monedas                */
                  --stroke:rgba(255,255,255,.6);
                  --speed:12s;      /* velocidad recorrido    */
                  --drop:1.8s;      /* duración caída         */
                }
                text{font-family: 'Segoe UI', Roboto, Arial, sans-serif}
                .h1{font-weight:700; font-size:28px; letter-spacing:.3px; fill:var(--text)}
                .h2{font-weight:500; font-size:14px; fill:var(--muted)}
                .label{font-size:12px; fill:var(--muted)}
                .value{font-weight:700; font-size:20px; fill:var(--text)}
            
                /* Animations */
                @keyframes rotate360{from{transform:rotate(0)}to{transform:rotate(360deg)}}
                @keyframes moveBags{from{transform:translateX(-180px)}to{transform:translateX(2420px)}}
                @keyframes pulse{0%,100%{opacity:.55; transform:scale(1)}50%{opacity:1; transform:scale(1.08)}}
            
                .rotating{transform-box:fill-box; transform-origin:center; animation:rotate360 18s linear infinite}
                .bagMove{transform-box:fill-box; transform-origin:center; animation:moveBags 20s linear infinite}
                .pulse{transform-box:fill-box; transform-origin:center; animation:pulse 2.2s ease-in-out infinite}
                .delay1{animation-delay:.7s}.delay2{animation-delay:1.4s}.delay3{animation-delay:2.1s}
            
                    /* Billetes/monedas */
                .bill { fill: var(--bill); stroke: var(--stroke); stroke-width:1.5; rx:4; ry:4; }
                .bill-line { stroke: rgba(255,255,255,.55); stroke-width:1.5; }
                .coin { fill: var(--coin); stroke: #b45309; stroke-width:1.2; }
            
                    /* Caída de billetes/monedas (relativa a la bolsa) */
                .shower > g {
                  transform-box: fill-box;
                  transform-origin: center;
                  animation: fall var(--drop) ease-in infinite;
                }
                
                /* desfaces individuales con CSS variables */
                .shower > g { opacity: 0; }
                .shower > g:nth-child(1){ animation-delay: .2s; }
                .shower > g:nth-child(2){ animation-delay: .6s; }
                .shower > g:nth-child(3){ animation-delay: 1.0s; }
                .shower > g:nth-child(4){ animation-delay: 1.4s; }
                .shower > g:nth-child(5){ animation-delay: 1.8s; }
                .shower > g:nth-child(6){ animation-delay: 2.2s; }
                .shower > g:nth-child(7){ animation-delay: 2.6s; }
                .shower > g:nth-child(8){ animation-delay: 3.0s; }
            
                    @keyframes fall {
                  0%   { opacity:0; transform: translate(0,-6px) rotate(0deg); }
                  10%  { opacity:1; }
                  100% { opacity:0; transform: translate(0,120px) rotate(180deg); }
                }
            
                /* Accesibilidad: respeta reduce motion */
                @media (prefers-reduced-motion: reduce){
                  .rotating,.bagMove,.pulse{animation:none}
                  #treadAnim{display:none}
                }
            
              </style>
            
              <!-- ====== DEFS ====== -->
              <defs>
                <!-- Fondo -->
                <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
                  <stop offset='0' stop-color='var(--bg1)'/>
                  <stop offset='1' stop-color='var(--bg2)'/>
                </linearGradient>
            
                <!-- Brillo sutil -->
                <radialGradient id='glow' cx='65%' cy='30%' r='80%'>
                  <stop offset='0' stop-color='white' stop-opacity='.08'/>
                  <stop offset='1' stop-color='white' stop-opacity='0'/>
                </radialGradient>
            
                <!-- Patrón de la banda de la cinta -->
                <pattern id='tread' width='40' height='10' patternUnits='userSpaceOnUse'>
                  <rect x='0' y='0' width='40' height='10' fill='rgba(255,255,255,.05)'/>
                  <circle cx='8' cy='5' r='2' fill='rgba(255,255,255,.16)'/>
                  <circle cx='28' cy='5' r='2' fill='rgba(255,255,255,.16)'/>
                  <!-- Animación del patrón -->
                  <animate id='treadAnim' attributeName='patternTransform' type='translate'
                           from='0 0' to='40 0' dur='1.6s' repeatCount='indefinite'/>
                </pattern>
            
                <!-- Símbolo: Bolsa de dinero -->
