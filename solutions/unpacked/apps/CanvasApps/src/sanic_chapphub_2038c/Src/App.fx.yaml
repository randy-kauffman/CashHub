App As appinfo:
    BackEnabled: =true
    OnStart: |
        =ClearCollect(
            colCatalog,
            Filter('CH-Tbl-AppCatalogs', Enabled)
        );
        Set(gvarAccessError, false);
        Clear(colMyGroupIds);
        // 'AAD Group Id' admite varios GUIDs separados por ';' (máx. 255 caracteres = 6 grupos)
        With(
            {allIds: Concat(Filter(colCatalog, !IsBlank('AAD Group Id')), Substitute(Trim('AAD Group Id'), " ", "") & ";")},
            ClearCollect(colGroupIds, Distinct(Filter(Split(allIds, ";"), !IsBlank(Value)), Value))
        );
        // Una sola llamada a Graph resuelve la membresía (transitiva) contra todos los grupos del catálogo. Tope de checkMemberGroups: 20 grupos.
        If(
            !IsEmpty(colGroupIds),
            IfError(
                ClearCollect(
                    colMyGroupIds,
                    ForAll(
                        Table(
                            Office365Groups.HttpRequest(
                                "https://graph.microsoft.com/v1.0/me/checkMemberGroups",
                                "POST",
                                "{""groupIds"": [" & Concat(FirstN(colGroupIds, 20), """" & Value & """", ",") & "]}"
                            ).value
                        ),
                        {GroupId: Text(Value)}
                    )
                ),
                // Si Graph falla no bloqueamos el hub: se muestra todo con aviso; la autorización real la imponen las apps destino
                Set(gvarAccessError, true); Clear(colMyGroupIds)
            )
        );
        ClearCollect(
            colAppData,
            Filter(
                colCatalog,
                IsBlank('AAD Group Id') ||
                    gvarAccessError ||
                    CountRows(
                        Filter(
                            Split(Substitute(Trim('AAD Group Id'), " ", ""), ";"),
                            !IsBlank(Value) && Value in colMyGroupIds.GroupId
                        )
                    ) > 0
            )
        );
        Set(gvarLoaded, true);
        If(
            CountRows(colAppData) = 1 && !gvarAccessError,
            Launch(First(colAppData).AppURL, {}, LaunchTarget.Replace)
        );
    Theme: =PowerAppsTheme

    Host As hostControl.DefaultHostControlVariant:
        OnCancel: =false
        OnEdit: =false
        OnNew: =false
        OnSave: =false
        OnView: =false

