App:
  Properties:
    OnStart: |
      =ClearCollect(
          colCatalog,
          Filter('CH-Tbl-AppCatalogs', Enabled)
      );
      // Una fila de acceso = (app, grupo AAD). Sin filas para una app, la app es pública.
      ClearCollect(
          colAccess,
          ForAll(
              'CH-Tbl-AppCatalogAccesses' As row,
              {
                  AppId: row.'App Catalog'.'CH-Tbl-AppCatalog',
                  GroupId: Substitute(Trim(row.'AAD Group Id'), " ", "")
              }
          )
      );
      Set(gvarAccessError, false);
      Clear(colMyGroupIds);
      // Una sola llamada a Graph resuelve la membresía (transitiva) contra todos los grupos declarados. Tope de checkMemberGroups: 20 grupos.
      If(
          !IsEmpty(colAccess),
          IfError(
              ClearCollect(
                  colMyGroupIds,
                  ForAll(
                      Table(
                          Office365Groups.HttpRequest(
                              "https://graph.microsoft.com/v1.0/me/checkMemberGroups",
                              "POST",
                              "{""groupIds"": [" & Concat(FirstN(Distinct(colAccess, GroupId), 20), """" & Value & """", ",") & "]}"
                          ).value
                      ),
                      {GroupId: Text(Value)}
                  )
              ),
              // Si Graph falla no bloqueamos el hub: se muestra todo con aviso; la autorización real la imponen las apps destino
              Set(gvarAccessError, true); Clear(colMyGroupIds)
          )
      );
      ClearCollect(
          colAppData,
          Filter(
              colCatalog As app,
              IsEmpty(Filter(colAccess, AppId = app.'CH-Tbl-AppCatalog')) ||
                  gvarAccessError ||
                  CountRows(
                      Filter(
                          colAccess,
                          AppId = app.'CH-Tbl-AppCatalog' && GroupId in colMyGroupIds.GroupId
                      )
                  ) > 0
          )
      );
      Set(gvarLoaded, true);
      If(
          CountRows(colAppData) = 1 && !gvarAccessError,
          Launch(First(colAppData).AppURL, {}, LaunchTarget.Replace)
      )
    Theme: =PowerAppsTheme
