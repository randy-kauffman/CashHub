App:
  Properties:
    OnStart: |
      =ClearCollect(
          colAppData,
          Filter(
              Filter(
                  'CH-Tbl-AppCatalogs',
                  !IsBlank('AAD Group Id') && Enabled
              ),
              (!IsBlank(
                  LookUp(
                      Office365Groups.ListGroupMembers(Trim('AAD Group Id')).value,
                      userPrincipalName = User().Email
                  )
              ) )
          )
      );
      Collect(
          colAppData,
          Filter(
              'CH-Tbl-AppCatalogs',
              IsBlank('AAD Group Id') && Enabled
          )
      );
    Theme: =PowerAppsTheme
