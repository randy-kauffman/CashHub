            HtmlText: "=\"<svg xmlns='http://www.w3.org/2000/svg' role='img' aria-labelledby='title desc'\n     viewBox='0 0 1200 260' width='100%' preserveAspectRatio='xMidYMid slice'>\n  <title id='title'>CASH HUB</title>\n  <desc id='desc'>Ilustración con bóveda, cinta transportadora, bolsas de dinero animadas y contadores.</desc>\n\n  <!-- ====== THEME (ajusta colores aquí) ====== -->\n  <style>\n    :root{\n      --bg1:#0b2738; --bg2:#0e3a4a;\n      --accent:#2dd4bf; --accent2:#60a5fa; --accent3:#f59e0b;\n      --text:#e6f1f4; --muted:#9fb6c3;\n      --success:#22c55e; --warn:#f59e0b; --danger:#ef4444;\n      --belt:#0f2530; --beltEdge:#163341; --bag1:#1fa38a; --bag2:#0ea5e9; --bag3:#7c3aed;\n      --bill:#16a34a;   /* billetes               */\n      --coin:#f59e0b;   /* monedas                */\n      --stroke:rgba(255,255,255,.6);\n      --speed:12s;      /* velocidad recorrido    */\n      --drop:1.8s;      /* duración caída         */\n    }\n    text{font-family: 'Segoe UI', Roboto, Arial, sans-serif}\n    .h1{font-weight:700; font-size:28px; letter-spacing:.3px; fill:var(--text)}\n    .h2{font-weight:500; font-size:14px; fill:var(--muted)}\n    .label{font-size:12px; fill:var(--muted)}\n    .value{font-weight:700; font-size:20px; fill:var(--text)}\n\n    /* Animations */\n    @keyframes rotate360{from{transform:rotate(0)}to{transform:rotate(360deg)}}\n    @keyframes moveBags{from{transform:translateX(-180px)}to{transform:translateX(1740px)}}\n    @keyframes pulse{0%,100%{opacity:.55; transform:scale(1)}50%{opacity:1; transform:scale(1.08)}}\n\n    .rotating{transform-box:fill-box; transform-origin:center; animation:rotate360 18s linear infinite}\n    .bagMove{transform-box:fill-box; transform-origin:center; animation:moveBags 20s linear infinite}\n    .pulse{transform-box:fill-box; transform-origin:center; animation:pulse 2.2s ease-in-out infinite}\n    .delay1{animation-delay:.7s}.delay2{animation-delay:1.4s}.delay3{animation-delay:2.1s}\n\n        /* Billetes/monedas */\n    .bill { fill: var(--bill); stroke: var(--stroke); stroke-width:1.5; rx:4; ry:4; }\n    .bill-line { stroke: rgba(255,255,255,.55); stroke-width:1.5; }\n    .coin { fill: var(--coin); stroke: #b45309; stroke-width:1.2; }\n\n        /* Caída de billetes/monedas (relativa a la bolsa) */\n    .shower > g {\n      transform-box: fill-box;\n      transform-origin: center;\n      animation: fall var(--drop) ease-in infinite;\n    }\n    \n    /* desfaces individuales con CSS variables */\n    .shower > g { opacity: 0; }\n    .shower > g:nth-child(1){ animation-delay: .2s; }\n    .shower > g:nth-child(2){ animation-delay: .6s; }\n    .shower > g:nth-child(3){ animation-delay: 1.0s; }\n    .shower > g:nth-child(4){ animation-delay: 1.4s; }\n    .shower > g:nth-child(5){ animation-delay: 1.8s; }\n    .shower > g:nth-child(6){ animation-delay: 2.2s; }\n    .shower > g:nth-child(7){ animation-delay: 2.6s; }\n    .shower > g:nth-child(8){ animation-delay: 3.0s; }\n\n        @keyframes fall {\n      0%   { opacity:0; transform: translate(0,-6px) rotate(0deg); }\n      10%  { opacity:1; }\n      100% { opacity:0; transform: translate(0,120px) rotate(180deg); }\n    }\n\n    /* Accesibilidad: respeta reduce motion */\n    @media (prefers-reduced-motion: reduce){\n      .rotating,.bagMove,.pulse{animation:none}\n      #treadAnim{display:none}\n    }\n\n  </style>\n\n  <!-- ====== DEFS ====== -->\n  <defs>\n    <!-- Fondo -->\n    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>\n      <stop offset='0' stop-color='var(--bg1)'/>\n      <stop offset='1' stop-color='var(--bg2)'/>\n    </linearGradient>\n\n    <!-- Brillo sutil -->\n    <radialGradient id='glow' cx='65%' cy='30%' r='80%'>\n      <stop offset='0' stop-color='white' stop-opacity='.08'/>\n      <stop offset='1' stop-color='white' stop-opacity='0'/>\n    </radialGradient>\n\n    <!-- Patrón de la banda de la cinta -->\n    <pattern id='tread' width='40' height='10' patternUnits='userSpaceOnUse'>\n      <rect x='0' y='0' width='40' height='10' fill='rgba(255,255,255,.05)'/>\n      <circle cx='8' cy='5' r='2' fill='rgba(255,255,255,.16)'/>\n      <circle cx='28' cy='5' r='2' fill='rgba(255,255,255,.16)'/>\n      <!-- Animación del patrón -->\n      <animate id='treadAnim' attributeName='patternTransform' type='translate'\n               from='0 0' to='40 0' dur='1.6s' repeatCount='indefinite'/>\n    </pattern>\n\n    <!-- Símbolo: Bolsa de dinero -->\n    <symbol id='bag' viewBox='0 0 50 300'>\n      <!-- Sombra -->\n      <ellipse cx='60' cy='120' rx='36' ry='10' fill='black' opacity='.18'/>\n      <!-- Cuerpo -->\n      <path d='M38.14,21.15c-1.9-5.6-3.6-11.25-5.05-17c5.38-5.9,26.15-5.12,32.13-0.09l-5.53,13.15 c2.98-3.91,3.98-5.51,5.75-7.69c0.75,0.49,1.45,1.04,2.11,1.64c1.57,1.42,2.98,3,3.26,5.19c0.18,1.42-0.22,2.87-1.49,4.35 L56.63,35.48c-1.63-0.27-3.23-0.66-4.78-1.21c0.72-1.69,1.59-3.56,2.31-5.25L49.54,34c-4.81-1.02-8.69-0.41-12.29,1.5L24.37,20.05 c-0.76-0.92-1.11-1.84-1.11-2.76c0.01-3.73,5.57-6.96,8.5-8.18L38.14,21.15L38.14,21.15z M54.64,49.06l-2.51-11.49 c10.76,2,28.01,23.89,33.58,33.84c2.84,5.08,5.34,10.68,7.38,16.93c4.06,15.14,0.15,29.3-16.27,32.6 c-10.29,2.07-29.48,2.21-40.3,1.65c-11.63-0.6-29.64-0.58-34.34-12.53c-7.59-19.28,6.32-42.25,19-56.31 c1.67-1.85,3.39-3.57,5.18-5.17c4.61-4.06,9.59-8.87,15.52-10.88l-5.74,10.68l8.33-11.04h4.39L54.64,49.06L54.64,49.06z M49.29,58.49v2.03c2.15,0.23,4,0.67,5.54,1.33c1.54,0.67,2.88,1.67,4.03,3.02c0.91,1.03,1.61,2.09,2.1,3.17 c0.49,1.09,0.74,2.08,0.74,2.99c0,1.01-0.37,1.88-1.1,2.61c-0.74,0.73-1.63,1.1-2.68,1.1c-1.98,0-3.26-1.07-3.84-3.2 c-0.67-2.51-2.26-4.19-4.8-5.01v12.55c2.49,0.68,4.49,1.31,5.96,1.87c1.48,0.56,2.81,1.37,3.97,2.44c1.25,1.1,2.21,2.43,2.89,3.96 c0.67,1.54,1.01,3.22,1.01,5.05c0,2.29-0.53,4.44-1.62,6.43c-1.08,2.01-2.67,3.63-4.76,4.91c-2.1,1.27-4.58,2.02-7.46,2.25v2.05 c0,1.18-0.12,2.05-0.35,2.59c-0.23,0.54-0.73,0.81-1.52,0.81c-0.72,0-1.23-0.22-1.52-0.66c-0.29-0.44-0.43-1.13-0.43-2.06v-2.68 c-2.35-0.26-