cy='-6' r='4'/>\n        </g>\n        <!-- Billete 4 -->\n        <g>\n          <rect class='bill' x='-30' y='-8' width='26' height='14'/>\n          <line class='bill-line' x1='-26' y1='-4' x2='-8' y2='-4'/>\n        </g>\n        <!-- Moneda 4 -->\n        <g>\n          <circle class='coin' cx='-24' cy='-10' r='3.6'/>\n        </g>\n      </g>\n\n    </symbol>\n\n    <!-- Gradiente para bolsas (se sobreescribe por clase) -->\n    <linearGradient id='bagGrad' x1='0' y1='0' x2='0' y2='1'>\n      <stop offset='0' stop-color='#9b6a3e'/>\n      <stop offset='1' stop-color='#6f4a2c'/>\n    </linearGradient>\n\n    <!-- Símbolo: Bóveda -->\n    <symbol id='vault' viewBox='-60 -60 120 120'>\n      <circle r='56' fill='rgba(0,0,0,.25)'/>\n      <circle r='52' fill='#0b1f2b' stroke='rgba(255,255,255,.15)' stroke-width='2'/>\n      <g class='rotating'>\n        <circle r='30' fill='none' stroke='var(--accent2)' stroke-width='6' stroke-dasharray='12 10' stroke-linecap='round'/>\n        <!-- Pernos -->\n        <g fill='var(--accent)'>\n          <rect x='-4' y='-50' width='8' height='12' rx='2'/>\n          <rect x='-4' y='38' width='8' height='12' rx='2'/>\n          <rect x='-50' y='-4' width='12' height='8' rx='2'/>\n          <rect x='38' y='-4' width='12' height='8' rx='2'/>\n        </g>\n      </g>\n      <circle r='10' fill='var(--accent2)' stroke='white' stroke-width='2'/>\n    </symbol>\n\n    <!-- Clip para odómetros -->\n    <clipPath id='clipOdo'><rect x='0' y='0' width='28' height='28' rx='4'/></clipPath>\n  </defs>\n\n  <!-- ====== BACKGROUND ====== -->\n  <rect width='1200' height='260' fill='url(#bg)'/>\n  <ellipse cx='800' cy='40' rx='500' ry='160' fill='url(#glow)'/>\n\n  <!-- ====== HEADER TEXT ====== -->\n  <g transform='translate(120,64)'>\n    <text class='h1'>CASH HUB</text>\n    <!-- <text class='h2' y='26'>Recepción • Validación • Recuento • Conciliación</text> -->\n  </g>\n\n  <!-- ====== VAULT (izquierda) ====== -->\n  <g transform='translate(6