ComponentDefinitions:
  cmpEmpty:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Glifo:
        PropertyKind: Input
        DisplayName: Glifo
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Mensaje:
        PropertyKind: Input
        DisplayName: Mensaje
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Children:
      - lblMsgEmpty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ThemeInk3
            Font: =Font.'Open Sans'
            Height: =48
            Size: =9.38
            Text: =cmpEmpty.Mensaje
            Width: =Parent.Width*0.7
            X: =Parent.Width*0.15
            Y: =lblGlifoEmpty.Y + lblGlifoEmpty.Height + 8
      - lblGlifoEmpty:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =ThemeInk3
            Font: =Font.'Open Sans'
            Height: =36
            Size: =30
            Text: =cmpEmpty.Glifo
            Width: =Parent.Width
            Y: =Parent.Height/2 - 44
