Screens:
  scrMovimientos:
    Properties:
      Fill: =ThemeBg
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
      OnVisible: |-
        =// REFRESCAR ANTES DE LEER. Sin esto la galeria sirve el CACHE del cliente y una
        // transaccion creada hace cinco minutos —o un lote recien aplicado— simplemente no
        // aparece: la pantalla se ve bien y esta mintiendo. Todas las demas pantallas de la
        // app ya lo hacen; esta era la unica que no.
        Refresh('CH-Tbl-Transactions');
        UpdateContext({
            ctxDiaMov: Today(),
            ctxFiltroMov: "Todas",
            ctxCargandoMov: false,
            ctxUltimaActMov: Blank()
        });
        Set(gvarCajeroMov, Blank());
        Clear(colCuboMov);
        Clear(colDiasMov);
        Select(btnCargarCajerosMov)
    Children:
      - cmpHeaderMov:
          Control: CanvasComponent
          ComponentName: cmpHeader
          Properties:
            Activo: ="Movimientos"
            Height: =LayHeaderH
            OnCheques: =Navigate(scrCheques, ScreenTransition.None)
            OnCorte: =Navigate(scrCorte, ScreenTransition.None)
            OnLotes: =Navigate(scrLotes, ScreenTransition.None)
            OnManual: =Navigate(scrManual, ScreenTransition.None)
            OnMovimientos: =Select(btnCargarCuboMov)
            Subtitulo: ="Movimientos"
            Titulo: ="Digitación"
            Width: =Parent.Width
      - galCajerosMov:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ThemeLine
            Height: =Parent.Height - LayHeaderH
            Items: =colCajerosMov
            OnSelect: |-
              =// AL ELEGIR UN CAJERO SE SALTA A SU ULTIMO DIA CON MOVIMIENTOS. Antes se
              // quedaba en HOY, y un cajero cuyas transacciones son del 17/08 se veia
              // completamente vacio: la pantalla decia la verdad y aun asi dejaba al operador
              // sin saber donde mirar. Si el dia elegido ya tiene datos, no se toca.
              Set(gvarCajeroMov, ThisItem);
              Select(btnCargarCuboMov);
              If(IsEmpty(colCuboMov) && !IsEmpty(colDiasMov),
                  UpdateContext({ctxDiaMov: First(colDiasMov).fecha});
                  Reset(dtpDiaMov);
                  Select(btnCargarCuboMov)
              )
            TemplateSize: =56
            Width: =236
            Y: =LayHeaderH
          Children:
            - shpCajSelMov:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 255, 1)
                  Fill: |-
                    =If(!IsBlank(gvarCajeroMov) && ThisItem.cajero = gvarCajeroMov.cajero,
                        ThemeAccentSoft, ThemeSurface)
                  Height: =56
                  Width: =Parent.TemplateWidth
            - shpCajBarraMov:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 255, 1)
                  Fill: |-
                    =If(!IsBlank(gvarCajeroMov) && ThisItem.cajero = gvarCajeroMov.cajero,
                        ThemeAccent, Color.Transparent)
                  Height: =56
                  Width: =3
            - lblCajNombreMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =56
                  Size: =9.5
                  Text: |-
                    =// SOLO EL NOMBRE. La mesa se saco: la que devuelve el API es la mesa ACTUAL
                    // del cajero, y esta es una vista historica — poner la mesa de hoy al lado de
                    // los movimientos de otro dia es afirmar algo que no se sabe. Ademas hay
                    // cajeros con la mesa vacia. Lo que identifica al cajero es su nombre.
                    ThisItem.cajeroNombre
                  Width: =Parent.TemplateWidth - 24
                  X: =16
            - btnCajFilaMov:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderStyle: =BorderStyle.None
                  Color: =Color.Transparent
                  DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  Fill: =Color.Transparent
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Normal
                  Height: =56
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =Self.Color
                  HoverFill: =ThemeSurface2
                  OnSelect: =Select(Parent)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Color.Transparent
                  Size: =13
                  Text: =""
                  Width: =Parent.TemplateWidth
            - shpCajLineaMov:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 255, 1)
                  Fill: =ThemeLine
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =55
      - lblTituloMov:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =ThemeInk
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =26
            Size: =14
            Text: =Coalesce(gvarCajeroMov.cajeroNombre, "Elegí un cajero")
            Width: =520
            X: =256
            Y: =LayHeaderH + 16
      - lblSubtituloMov:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =ThemeInk2
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Open Sans'
            Height: =18
            Size: =9
            Text: |-
              =If(IsBlank(gvarCajeroMov), "Seleccioná un cajero del panel izquierdo.",
                  Text(Coalesce(Sum(colCuboMov, cantidad), 0)) & " transacciones el " & Text(ctxDiaMov, "dd/mm/yyyy"))
            Width: =520
            X: =256
            Y: =LayHeaderH + 42
      - dtpDiaMov:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =ThemeLine
            BorderStyle: =%BorderStyle.RESERVED%.Solid
            Color: =ThemeInk
            DateTimeZone: =%DateTimeZone.RESERVED%.Local
            DefaultDate: |-
              =// Sigue a la variable, no a Today(): cuando la pantalla salta sola al ultimo dia
              // con movimientos del cajero, el selector tiene que mostrar ESE dia. Clavado en
              // hoy diria una fecha y estaria mostrando otra.
              ctxDiaMov
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            DisabledColor: =RGBA(70, 68, 64, 1)
            DisabledFill: =Self.Fill
            DisplayMode: =%DisplayMode.RESERVED%.Edit
            Fill: =ThemeSurface
            Font: =%Font.RESERVED%.'Open Sans'
            FontWeight: =%FontWeight.RESERVED%.Normal
            Height: =32
            IconBackground: =RGBA(35, 31, 32, 1)
            IconFill: =RGBA(255, 255, 255, 1)
            OnChange: |-
              =// UN SOLO DIA. No hay "desde/hasta": el negocio revisa el cierre de una jornada,
              // y un rango largo ademas haria pesada la consulta sin agregar nada.
              UpdateContext({ctxDiaMov: dtpDiaMov.SelectedDate});
              Select(btnCargarCuboMov)
            StartOfWeek: =%StartOfWeek.RESERVED%.Sunday
            Width: =150
            X: =Parent.Width - 16 - 150
            Y: =LayHeaderH + 16
      - btnHoyMov:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ThemeLine
            BorderThickness: =1
            Color: =ThemeInk2
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =ThemeSurface
            Font: =Font.'Open Sans'
            Height: =32
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =ThemeSurface2
            OnSelect: |-
              =Reset(dtpDiaMov);
              UpdateContext({ctxDiaMov: Today()});
              Select(btnCargarCuboMov)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =7
            RadiusBottomRight: =7
            RadiusTopLeft: =7
            RadiusTopRight: =7
            Size: =9
            Text: ="Hoy"
            Width: =64
            X: =dtpDiaMov.X - 8 - Self.Width
            Y: =LayHeaderH + 16
      - galResumenMov:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Height: =108
            Items: |-
              =// EL RESUMEN SIGUE AL FILTRO. Se arma sobre el cubo (12 filas como mucho), asi
              // que cambiar de chip es instantaneo y no vuelve a consultar. Las tres monedas
              // se muestran SIEMPRE, aunque el filtro las deje en cero: que una desaparezca
              // haria dudar de si no hubo movimientos o si la pantalla se comio la fila.
              ForAll(
                  Table({ m: "COR", sim: SimboloNIO, nom: "Córdobas" },
                        { m: "USD", sim: SimboloUSD, nom: "Dólares" },
                        { m: "EUR", sim: SimboloEUR, nom: "Euros" }) As mon,
                  With(
                      { f: Filter(colCuboMov,
                              moneda = mon.m,
                              ctxFiltroMov = "Todas" || tipo = ctxFiltroMov || via = ctxFiltroMov) },
                      {
                          moneda:   mon.m,
                          simbolo:  mon.sim,
                          nombre:   mon.nom,
                          // EL FALTANTE RESTA. El signo viene del servidor (+1 / -1) para
                          // que la regla contable no viva en la pantalla. Sumar un faltante
                          // seria inflar el cierre del cajero justo con lo que le falta.
                          // Coalesce: Sum() sobre una tabla vacia devuelve BLANK, no cero, y
                          // Text(blank) es cadena vacia. Las tarjetas salian con el simbolo de
                          // la moneda y ningun numero — que se lee como "roto", no como "cero".
                          efectivo: Coalesce(Sum(f, efectivo * signo), 0),
                          cheques:  Coalesce(Sum(f, chequeBac * signo), 0) + Coalesce(Sum(f, chequeOtros * signo), 0),
                          total:    Coalesce(Sum(f, total * signo), 0),
                          cantidad: Coalesce(Sum(f, cantidad), 0)
                      }
                  )
              )
            LoadingSpinner: =LoadingSpinner.None
            ShowScrollbar: =false
            TemplateSize: =(Parent.Width - 256 - 16 - 24) / 3
            Width: =Parent.Width - 256 - 16
            X: =256
            Y: =LayHeaderH + 76
          Children:
            - shpMonCardMov:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =ThemeLine
                  BorderThickness: =1
                  Fill: =ThemeSurface
                  Height: =108
                  Width: =Parent.TemplateWidth - 12
            - lblMonNombreMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk3
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =16
                  Size: =8.25
                  Text: =Upper(ThisItem.nombre) & " · " & ThisItem.simbolo
                  Width: =Parent.TemplateWidth - 120
                  X: =16
                  Y: =12
            - lblMonCantMov:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk3
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =16
                  Size: =8.25
                  Text: =Text(ThisItem.cantidad) & " trn"
                  Width: =92
                  X: =Parent.TemplateWidth - 12 - 16 - 92
                  Y: =12
            - lblMonTotalMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =32
                  Size: =18
                  Text: =ThisItem.simbolo & " " & Text(ThisItem.total, FmtMoney)
                  Width: =Parent.TemplateWidth - 12 - 32
                  X: =16
                  Y: =30
            - lblMonEfeEtMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk3
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =14
                  Size: =7.5
                  Text: ="EFECTIVO"
                  Width: =(Parent.TemplateWidth - 12 - 32) / 2
                  X: =16
                  Y: =68
            - lblMonEfeMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =18
                  Size: =9.5
                  Text: =Text(ThisItem.efectivo, FmtMoney)
                  Width: =(Parent.TemplateWidth - 12 - 32) / 2
                  X: =16
                  Y: =82
            - lblMonChqEtMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk3
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =14
                  Size: =7.5
                  Text: ="CHEQUES"
                  Width: =(Parent.TemplateWidth - 12 - 32) / 2
                  X: =16 + (Parent.TemplateWidth - 12 - 32) / 2
                  Y: =68
            - lblMonChqMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =18
                  Size: =9.5
                  Text: =Text(ThisItem.cheques, FmtMoney)
                  Width: =(Parent.TemplateWidth - 12 - 32) / 2
                  X: =16 + (Parent.TemplateWidth - 12 - 32) / 2
                  Y: =82
      - galChipsMov:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Height: =32
            Items: |-
              =// UN FILTRO A LA VEZ, y por eso son excluyentes. No es solo simplicidad de UI:
              // cada opcion se traduce en un Filter DELEGABLE distinto sobre el datasource, y
              // combinarlos libremente obligaria a filtrar del lado del cliente — que topa en
              // 500 filas y mostraria un dia incompleto sin avisar.
              ForAll(
                  Table({ k: "Todas",           t: "Todas" },
                        { k: "Deposito",        t: "Depósitos" },
                        { k: "Faltante",        t: "Faltantes" },
                        { k: "Sobrante",        t: "Sobrantes" },
                        { k: "Sin declaracion", t: "Sin declaración" },
                        { k: "Lote",            t: "Por lote" },
                        { k: "Manual",          t: "Manuales" }) As c,
                  {
                      clave: c.k,
                      texto: c.t,
                      cant: Sum(
                          Filter(colCuboMov, c.k = "Todas" || tipo = c.k || via = c.k),
                          cantidad)
                  }
              )
            LoadingSpinner: =LoadingSpinner.None
            ShowScrollbar: =false
            TemplateSize: =136
            Width: =Parent.Width - 256 - 16
            X: =256
            Y: =LayHeaderH + 196
          Children:
            - btnChipMov:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =If(ThisItem.clave = ctxFiltroMov, ThemeInk, ThemeLine)
                  BorderThickness: =1
                  Color: =If(ThisItem.clave = ctxFiltroMov, ThemeSurface, ThemeInk2)
                  DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  Fill: =If(ThisItem.clave = ctxFiltroMov, ThemeInk, ThemeSurface)
                  Font: =Font.'Open Sans'
                  Height: =30
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =If(ThisItem.clave = ctxFiltroMov, ThemeSurface, ThemeInk)
                  HoverFill: =If(ThisItem.clave = ctxFiltroMov, ThemeInk, ThemeSurface2)
                  OnSelect: |-
                    =UpdateContext({ctxFiltroMov: ThisItem.clave})
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =15
                  RadiusBottomRight: =15
                  RadiusTopLeft: =15
                  RadiusTopRight: =15
                  Size: =8.25
                  Text: =ThisItem.texto & "  " & Text(ThisItem.cant)
                  Width: =128
      - shpTablaCabMov:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =ThemeLine
            BorderThickness: =1
            Fill: =ThemeSurface2
            Height: =32
            Width: =Parent.Width - 256 - 16
            X: =256
            Y: =LayHeaderH + 240
      - galMovMov:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =ThemeLine
            Height: =Parent.Height - LayHeaderH - 272 - 16
            Items: |-
              =// TODAS LAS DEL DIA, no las primeras 500. La galeria se ata DIRECTO al
              // datasource con un Filter delegable: Dataverse resuelve el filtro y la galeria
              // va trayendo mientras se scrollea. Si esto se armara con una coleccion, un dia
              // real —5.442 transacciones de un solo cajero— se cortaria en 500 sin avisar.
              //
              // Por eso el filtro de los chips es EXCLUYENTE y cada rama es un Filter completo
              // y delegable: mezclarlos obligaria a filtrar del lado del cliente y volveriamos
              // al tope de 500.
              SortByColumns(
                  Switch(ctxFiltroMov,
                      "Deposito",
                      Filter('CH-Tbl-Transactions',
                          Cajero.User = gvarCajeroMov.cajero,
                          'Created On' >= ctxDiaMov,
                          'Created On' < DateAdd(ctxDiaMov, 1, TimeUnit.Days),
                          TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito),
                      "Faltante",
                      Filter('CH-Tbl-Transactions',
                          Cajero.User = gvarCajeroMov.cajero,
                          'Created On' >= ctxDiaMov,
                          'Created On' < DateAdd(ctxDiaMov, 1, TimeUnit.Days),
                          TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Faltante),
                      "Sobrante",
                      Filter('CH-Tbl-Transactions',
                          Cajero.User = gvarCajeroMov.cajero,
                          'Created On' >= ctxDiaMov,
                          'Created On' < DateAdd(ctxDiaMov, 1, TimeUnit.Days),
                          TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Sobrante),
                      "Sin declaracion",
                      Filter('CH-Tbl-Transactions',
                          Cajero.User = gvarCajeroMov.cajero,
                          'Created On' >= ctxDiaMov,
                          'Created On' < DateAdd(ctxDiaMov, 1, TimeUnit.Days),
                          TransactionType = 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion'),
                      "Lote",
                      Filter('CH-Tbl-Transactions',
                          Cajero.User = gvarCajeroMov.cajero,
                          'Created On' >= ctxDiaMov,
                          'Created On' < DateAdd(ctxDiaMov, 1, TimeUnit.Days),
                          TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Batch),
                      "Manual",
                      Filter('CH-Tbl-Transactions',
                          Cajero.User = gvarCajeroMov.cajero,
                          'Created On' >= ctxDiaMov,
                          'Created On' < DateAdd(ctxDiaMov, 1, TimeUnit.Days),
                          TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual),
                      Filter('CH-Tbl-Transactions',
                          Cajero.User = gvarCajeroMov.cajero,
                          'Created On' >= ctxDiaMov,
                          'Created On' < DateAdd(ctxDiaMov, 1, TimeUnit.Days))
                  ),
                  "createdon", SortOrder.Descending)
            TemplateSize: =38
            Width: =Parent.Width - 256 - 16
            X: =256
            Y: =LayHeaderH + 272
          Children:
            - shpMovFilaMov:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 255, 1)
                  Fill: =ThemeSurface
                  Height: =38
                  Width: =Parent.TemplateWidth
            - lblMovIdMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =38
                  PaddingLeft: =12
                  Size: =8.25
                  Text: ="T-" & Right("0000000000" & ThisItem.TransactionID, 10)
                  Width: =Parent.TemplateWidth * 0.10
                  X: =Parent.TemplateWidth * 0.00
            - lblMovRefMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk2
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =38
                  Size: =8.25
                  Text: =Coalesce(ThisItem.TransactionReference, "—")
                  Width: =Parent.TemplateWidth * 0.12
                  X: =Parent.TemplateWidth * 0.10
            - lblMovTipoMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: |-
                    =Switch(Text(ThisItem.TransactionType),
                        "Sobrante", ThemeInfo,
                        "Faltante", ThemeDanger,
                        "Sin declaracion", ThemeWarn,
                        ThemeInk2)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Fill: |-
                    =// El estado se ve por la FORMA y el color, no solo por la palabra: un
                    // faltante y un sobrante tienen que saltar en una tabla de 5.000 filas.
                    Switch(Text(ThisItem.TransactionType),
                        "Sobrante", ThemeInfoSoft,
                        "Faltante", ThemeDangerSoft,
                        "Sin declaracion", ThemeWarnSoft,
                        ThemeLineSoft)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =7.5
                  Text: =Text(ThisItem.TransactionType)
                  Width: =Parent.TemplateWidth * 0.10
                  X: =Parent.TemplateWidth * 0.22
                  Y: =9
            - lblMovViaMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =If(IsBlank(ThisItem.'Transaction Batch'), ThemeInk2, ThemeOk)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  Size: =8.25
                  Text: |-
                    =// La VIA se lee del hecho —tener lote o no—, no del ruteo. Es la unica de
                    // las dos que no puede contradecir lo que realmente paso.
                    If(IsBlank(ThisItem.'Transaction Batch'),
                       "Manual",
                       "Lote " & ThisItem.'Transaction Batch'.Name)
                  Width: =Parent.TemplateWidth * 0.12
                  X: =Parent.TemplateWidth * 0.32
                  Y: =2
            - lblMovCuentaMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk2
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =38
                  Size: =8.25
                  Text: =Text(ThisItem.AccountNumber, "[$-en-US]000000000")
                  Width: =Parent.TemplateWidth * 0.08
                  X: =Parent.TemplateWidth * 0.44
            - lblMovMonMov:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =ThemeInk2
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =38
                  Size: =8.25
