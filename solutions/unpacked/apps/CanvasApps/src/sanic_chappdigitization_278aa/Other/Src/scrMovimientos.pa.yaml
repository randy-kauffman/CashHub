                  Height: =38
                  Size: =8.25
                  Text: =Text(ThisItem.BACLocalCheckAmount, FmtMoney)
                  Width: =Parent.TemplateWidth * 0.10
                  X: =Parent.TemplateWidth * 0.70
            - lblMovOtrMov:
