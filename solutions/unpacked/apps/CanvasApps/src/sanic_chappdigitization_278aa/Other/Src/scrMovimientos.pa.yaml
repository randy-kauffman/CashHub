              =// EL VACIO TIENE QUE SER UN CARTEL, NO UN CALLEJON. Que la fecha elegida no
              // tenga nada es una respuesta legitima; dejar al operador probando fechas a mano
              // hasta dar con la buena, no.
              !IsBlank(gvarCajeroMov) && IsEmpty(colCuboMov) && !IsEmpty(colDiasMov)
            Width: =420
