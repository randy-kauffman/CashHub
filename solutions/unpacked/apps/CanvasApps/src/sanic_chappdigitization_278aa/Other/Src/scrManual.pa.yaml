Screens:
  scrManual:
    Properties:
      Fill: =ThemeBg
      OnVisible: |-
        =UpdateContext({
            ctxSegManual: "Pendientes",
            ctxOrdenMan: "Fecha",
            ctxMotivoMan: "Todos",
            ctxErrorMan: Blank()
        });
        Select(btnCargarMan);
        Set(gvarCajeroMan, cmpRailMan.CajeroSel);
        Set(
            gvarTxMan,
            First(
                Sort(
                Filter(
                    'CH-Tbl-Transactions',
                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                        && BatchStatus = Blank()
                        && TransactionStatus = Blank()
                        && Cajero.User = gvarCajeroMan.cajero
                ),
                'Created On', SortOrder.Ascending
            )
            )
        );
        Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
        Reset(inpCampoChqBacMan); Reset(inpCampoChqOtrMan);
        Reset(inpCampoTotalMan);  Reset(inpCampoRefMan);
        SetFocus(inpFocoMan);
        Environment.sanic_CHWorkloadByCashier().Workload
    Children:
      - cmpHeaderMan:
          Control: CanvasComponent
          ComponentName: cmpHeader
          Properties:
            Activo: ="Manual"
            Height: =LayHeaderH
            OnCheques: =Navigate(scrCheques)
            OnCorte: =Navigate(scrCorte)
            OnLotes: =Navigate(scrLotes)
            OnManual: =false
            OnMovimientos: =Navigate(scrMovimientos, ScreenTransition.None)
            Subtitulo: ="Aplicación manual"
            Titulo: ="Digitación"
            Width: =Parent.Width
      - cntBodyMan:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - LayHeaderH
            Width: =Parent.Width
            Y: =LayHeaderH
          Children:
            - cmpRailMan:
                Control: CanvasComponent
                ComponentName: cmpRailCajeros
                Properties:
                  Datos: =AddColumns(DropColumns(colCajerosMan, pendientesManual), pendientesCorte, 0, totalNio, 0, totalUsd, 0, totalEur, 0)
                  Height: =Parent.Height
                  OnActualizar: =Select(btnCargarMan)
                  OnSeleccion: |-
                    =Set(gvarCajeroMan, cmpRailMan.CajeroSel);
                    UpdateContext({ctxSegManual: "Pendientes", ctxErrorMan: Blank()});
                    Set(
                        gvarTxMan,
                        First(
                            Sort(
                            Filter(
                                'CH-Tbl-Transactions',
                                TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                            ),
                            'Created On', SortOrder.Ascending
                        )
                        )
                    );
                    Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
                    Reset(inpCampoChqBacMan); Reset(inpCampoChqOtrMan);
                    Reset(inpCampoTotalMan);  Reset(inpCampoRefMan);
                    SetFocus(inpFocoMan)
                  Titulo: ="CAJEROS CON MANUALES"
                  Width: =LayRailW
            - cntMainMan:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =Color.Transparent
                  Height: =Parent.Height
                  Width: =Parent.Width - LayRailW
                  X: =LayRailW
                Children:
                  - cntListaCardMan:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =Parent.Height - LayGutter*2
                        RadiusBottomLeft: =LayCardR
                        RadiusBottomRight: =LayCardR
                        RadiusTopLeft: =LayCardR
                        RadiusTopRight: =LayCardR
                        Width: =(Parent.Width - LayGutter*2 - LayGap) * 0.6
                        X: =LayGutter
                        Y: =LayGutter
                      Children:
                        - cntSegMan:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =1
                              Fill: =ThemeSurface2
                              Height: =30
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Width: =210
                              X: =16
                              Y: =12
                            Children:
                              - btnSegAplicadasMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Color: =If(ctxSegManual = "Aplicadas", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxSegManual = "Aplicadas", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxSegManual = "Aplicadas", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxSegManual: "Aplicadas", ctxErrorMan: Blank()});
                                      Set(
                                          gvarTxMan,
                                          First(
                                              Sort(
                                                  Filter(
                                                      'CH-Tbl-Transactions',
                                                      TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                          && BatchStatus = Blank()
                                                          && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                                          && Cajero.User = gvarCajeroMan.cajero
                                                  ),
                                                  'Created On', SortOrder.Descending
                                              )
                                          )
                                      )
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Text: ="Aplicadas" & If(ctxSegManual = "Aplicadas", " (" & CountRows(galTxMan.AllItems) & ")", "")
                                    Width: =(Parent.Width - 6) / 2
                                    X: =btnSegPendientesMan.X + btnSegPendientesMan.Width
                                    Y: =3
                              - btnSegPendientesMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Color: =If(ctxSegManual = "Pendientes", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxSegManual = "Pendientes", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxSegManual = "Pendientes", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxSegManual: "Pendientes", ctxErrorMan: Blank()});
                                      Set(
                                          gvarTxMan,
                                          First(
                                              Sort(
                                              Filter(
                                                  'CH-Tbl-Transactions',
                                                  TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                      && BatchStatus = Blank()
                                                      && TransactionStatus = Blank()
                                                      && Cajero.User = gvarCajeroMan.cajero
                                              ),
                                              'Created On', SortOrder.Ascending
                                          )
                                          )
                                      );
                                      Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
                                      Reset(inpCampoChqBacMan); Reset(inpCampoChqOtrMan);
                                      Reset(inpCampoTotalMan);  Reset(inpCampoRefMan);
                                      SetFocus(inpFocoMan)
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Text: ="Pendientes" & If(ctxSegManual = "Pendientes", " (" & CountRows(galTxMan.AllItems) & ")", "")
                                    Width: =(Parent.Width - 6) / 2
                                    X: =3
                                    Y: =3
                        - lblOrdenMan:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              Height: =18
                              Text: |-
                                ="Orden: " & If(ctxSegManual = "Aplicadas", "Aplicada ↓", If(ctxOrdenMan = "Motivo", "Motivo", "Fecha"))
                              Width: =170
                              X: =Parent.Width - 16 - Self.Width
                              Y: =18
                        - shpGridHeadBgMan:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ThemeSurface2
                              Height: =30
                              Width: =Parent.Width
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                        - lblHdrRefMan:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="REFERENCIA"
                              Width: =Parent.Width*0.13
                              X: =Parent.Width*0.03
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                        - lblHdrDepMan:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="DEPÓSITO / CLIENTE"
                              Width: =Parent.Width*0.26
                              X: =Parent.Width*0.16
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                        - lblHdrCtaMan:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="CUENTA"
                              Width: =Parent.Width*0.13
                              X: =Parent.Width*0.43
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                        - lblHdrMontoMan:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="MONTO"
                              Width: =Parent.Width*0.12
                              X: =Parent.Width*0.57
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                        - btnHdrMotivoMan:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Align: =Align.Left
                              BorderThickness: =0
                              Color: =If(ctxOrdenMan = "Motivo", ThemeAccent, ThemeInk2)
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              OnSelect: |-
                                =UpdateContext({ctxOrdenMan: If(ctxOrdenMan = "Motivo", "Fecha", "Motivo")})
                              PaddingLeft: =0
                              Size: =7.5
                              Text: ="MOTIVO " & If(ctxOrdenMan = "Motivo", "▼", "")
                              Width: =Parent.Width*0.14
                              X: =Parent.Width*0.70
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                        - lblHdrEstadoMan:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: =If(ctxSegManual = "Aplicadas", "APLICADA", "ESTADO")
                              Width: =Parent.Width*0.14
                              X: =Parent.Width*0.84
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                        - shpGridLineaMan:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ThemeLine
                              Height: =1
                              Width: =Parent.Width
                              Y: =galMotivoMan.Y + galMotivoMan.Height + 10 + 30
                        - cmpEmptyListaMan:
                            Control: CanvasComponent
                            ComponentName: cmpEmpty
                            Properties:
                              Glifo: ="⛁"
                              Height: =galTxMan.Height
                              Mensaje: =If(ctxSegManual = "Aplicadas", "Sin transacciones aplicadas para este cajero.", "Sin manuales pendientes para este cajero.")
                              Visible: =CountRows(galTxMan.AllItems) = 0
                              Width: =Parent.Width
                              Y: =galTxMan.Y
                        - galTxMan:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Parent.Height - (shpGridLineaMan.Y + 1)
                              Items: |-
                                =// FILTRO POR MOTIVO, en pendientes y en aplicadas.
                                //
                                // EL SWITCH VA AFUERA DEL SORT, no adentro. La primera version era
                                // Sort(Switch(...)) y devolvia CERO filas: "Con cheques" mostraba la lista
                                // vacia aunque "Todos" estuviera lleno de filas con esa pildora. Cada rama
                                // es ahora un Sort(Filter(...)) completo — la misma forma que ya venia
                                // funcionando en esta galeria.
                                //
                                // EL MOTIVO NO ES UNA COLUMNA: se deduce, con PRIORIDAD
                                //   Rechazo core > Faltante > Sobrante > Sin declaracion > Sin cuenta > Con cheques > —
                                // y cada rama repite en negativo las condiciones de las de mayor rango, o
                                // "Sin cuenta" se llevaria los sobrantes: 93 de los 104 no tienen cuenta.
                                //
                                // El "tipo normal" se escribe (Deposito || Blank) y NUNCA con <>: en
                                // Dataverse un <> contra NULL descarta la fila, y hay 3.214 asientos viejos
                                // sin tipo que desapareceran del listado sin que nadie se entere.
                                If(
                                    ctxSegManual = "Aplicadas",
                                    Switch(
                                        ctxMotivoMan,
                                        "Rechazo core",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore <> Blank()
                                        ), 'Created On', SortOrder.Descending),
                                        "Faltantes",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Faltante
                                        ), 'Created On', SortOrder.Descending),
                                        "Sobrantes",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Sobrante
                                        ), 'Created On', SortOrder.Descending),
                                        "Sin declaracion",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion'
                                        ), 'Created On', SortOrder.Descending),
                                        "Sin cuenta",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                                || TransactionType = Blank())
                                            && AccountNumber = Blank()
                                        ), 'Created On', SortOrder.Descending),
                                        "Con cheques",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                                || TransactionType = Blank())
                                            && AccountNumber <> Blank()
                                            && !IsBlank(RelatedDepositRecounting) 
                                        ), 'Created On', SortOrder.Descending),
                                        "Sin motivo",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                                || TransactionType = Blank())
                                            && AccountNumber <> Blank()
                                            && IsBlank(RelatedDepositRecounting)
                                        ), 'Created On', SortOrder.Descending),
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                            && Cajero.User = gvarCajeroMan.cajero
                                        ), 'Created On', SortOrder.Descending)
                                    ),
                                    If(
                                        ctxOrdenMan = "Motivo" && ctxMotivoMan = "Todos",
                                        Sort(
                                            Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                        ),
                                            Switch(
                                                true,
                                                MotivoRechazoCore <> Blank(), 6,
                                                TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Faltante, 5,
                                                TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Sobrante, 4,
                                                TransactionType = 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion', 3,
                                                AccountNumber = Blank(), 2,
                                                !IsBlank(RelatedDepositRecounting), 1,
                                                0
                                            ),
                                            SortOrder.Descending
                                        ),
                                        Switch(
                                        ctxMotivoMan,
                                        "Rechazo core",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore <> Blank()
                                        ), 'Created On', SortOrder.Ascending),
                                        "Faltantes",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Faltante
                                        ), 'Created On', SortOrder.Ascending),
                                        "Sobrantes",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Sobrante
                                        ), 'Created On', SortOrder.Ascending),
                                        "Sin declaracion",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion'
                                        ), 'Created On', SortOrder.Ascending),
                                        "Sin cuenta",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                                || TransactionType = Blank())
                                            && AccountNumber = Blank()
                                        ), 'Created On', SortOrder.Ascending),
                                        "Con cheques",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                                || TransactionType = Blank())
                                            && AccountNumber <> Blank()
                                            && !IsBlank(RelatedDepositRecounting)
                                        ), 'Created On', SortOrder.Ascending),
                                        "Sin motivo",
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                            && MotivoRechazoCore = Blank()
                                            && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                                || TransactionType = Blank())
                                            && AccountNumber <> Blank()
                                            && !IsBlank(RelatedDepositRecounting)
                                        ), 'Created On', SortOrder.Ascending),
                                        Sort(Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                        ), 'Created On', SortOrder.Ascending)
                                    )
                                    )
                                )
                              OnSelect: |-
                                =Set(gvarTxMan, galTxMan.Selected);
                                UpdateContext({ctxErrorMan: Blank()});
                                Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
                                Reset(inpCampoChqBacMan); Reset(inpCampoChqOtrMan);
                                Reset(inpCampoTotalMan);  Reset(inpCampoRefMan);
                                If(ctxSegManual = "Pendientes", SetFocus(inpFocoMan))
                              TemplatePadding: =0
                              TemplateSize: =LayRowH
                              Width: =Parent.Width
                              Y: =shpGridLineaMan.Y + 1
                            Children:
                              - shpTxSelMan:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =If(!IsBlank(gvarTxMan) && ThisItem.'CH-Tbl-Transactions' = gvarTxMan.'CH-Tbl-Transactions', ThemeAccentSoft, Color.Transparent)
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                              - shpTxSelBarraMan:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeAccent
                                    Height: =Parent.TemplateHeight
                                    Visible: =!IsBlank(gvarTxMan) && ThisItem.'CH-Tbl-Transactions' = gvarTxMan.'CH-Tbl-Transactions'
                                    Width: =3
                              - btnTxFilaMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Fill: =Color.Transparent
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    HoverFill: =ThemeSurface2
                                    OnSelect: =Select(Parent)
                                    PressedFill: =ThemeAccentSoft
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                              - lblTxRefMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Text: =ThisItem.Name
                                    Width: =Parent.TemplateWidth*0.13
                                    X: =Parent.TemplateWidth*0.03
                              - lblTxDepMan:
                                  Control: Label@2.5.1
                                  Properties:
