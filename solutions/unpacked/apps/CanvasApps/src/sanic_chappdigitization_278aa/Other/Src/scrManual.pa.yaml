Screens:
  scrManual:
    Properties:
      Fill: =ThemeBg
      OnVisible: |-
        =UpdateContext({
            ctxSegManual: "Pendientes",
            ctxOrdenMan: "Fecha",
            ctxErrorMan: Blank()
        });
        Select(btnCargarMan);
        Set(gvarCajeroMan, cmpRailMan.CajeroSel);
        Set(
            gvarTxMan,
            First(
                Sort(
                Filter(
                    'CH-Tbl-Transactions',
                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                        && BatchStatus = Blank()
                        && TransactionStatus = Blank()
                        && Cajero.User = gvarCajeroMan.cajero
                ),
                'Created On', SortOrder.Ascending
            )
            )
        );
        Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan);
        Reset(inpCampoMontoMan);  Reset(inpCampoRefMan);
        SetFocus(inpCampoCuentaMan);
        Environment.sanic_CHWorkloadByCashier().Workload
    Children:
      - cmpHeaderMan:
          Control: CanvasComponent
          ComponentName: cmpHeader
          Properties:
            Activo: ="Manual"
            Height: =LayHeaderH
            OnCheques: =Navigate(scrCheques)
            OnCorte: =Navigate(scrCorte)
            OnLotes: =Navigate(scrLotes)
            OnManual: =false
            Subtitulo: ="Aplicación manual"
            Titulo: ="Digitación"
            Width: =Parent.Width
      - cntBodyMan:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =Parent.Height - LayHeaderH
            Width: =Parent.Width
            Y: =LayHeaderH
          Children:
            - cmpRailMan:
                Control: CanvasComponent
                ComponentName: cmpRailCajeros
                Properties:
                  Datos: =AddColumns(DropColumns(colCajerosMan, pendientesManual), pendientesCorte, 0, totalNio, 0, totalUsd, 0, totalEur, 0)
                  Height: =Parent.Height
                  OnActualizar: =Select(btnCargarMan)
                  OnSeleccion: |-
                    =Set(gvarCajeroMan, cmpRailMan.CajeroSel);
                    UpdateContext({ctxSegManual: "Pendientes", ctxErrorMan: Blank()});
                    Set(
                        gvarTxMan,
                        First(
                            Sort(
                            Filter(
                                'CH-Tbl-Transactions',
                                TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                            ),
                            'Created On', SortOrder.Ascending
                        )
                        )
                    );
                    Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan);
                    Reset(inpCampoMontoMan);  Reset(inpCampoRefMan);
                    SetFocus(inpCampoCuentaMan)
                  Titulo: ="CAJEROS CON MANUALES"
                  Width: =LayRailW
            - cntMainMan:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  Fill: =Color.Transparent
                  Height: =Parent.Height
                  Width: =Parent.Width - LayRailW
                  X: =LayRailW
                Children:
                  - cntListaCardMan:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =Parent.Height - LayGutter*2
                        RadiusBottomLeft: =LayCardR
                        RadiusBottomRight: =LayCardR
                        RadiusTopLeft: =LayCardR
                        RadiusTopRight: =LayCardR
                        Width: =(Parent.Width - LayGutter*2 - LayGap) * 0.6
                        X: =LayGutter
                        Y: =LayGutter
                      Children:
                        - cntSegMan:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =1
                              Fill: =ThemeSurface2
                              Height: =30
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Width: =210
                              X: =16
                              Y: =12
                            Children:
                              - btnSegAplicadasMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Color: =If(ctxSegManual = "Aplicadas", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxSegManual = "Aplicadas", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxSegManual = "Aplicadas", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxSegManual: "Aplicadas", ctxErrorMan: Blank()});
                                      Set(
                                          gvarTxMan,
                                          First(
                                              Sort(
                                                  Filter(
                                                      'CH-Tbl-Transactions',
                                                      TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                          && BatchStatus = Blank()
                                                          && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                                          && Cajero.User = gvarCajeroMan.cajero
                                                  ),
                                                  'Created On', SortOrder.Descending
                                              )
                                          )
                                      )
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Text: ="Aplicadas" & If(ctxSegManual = "Aplicadas", " (" & CountRows(galTxMan.AllItems) & ")", "")
                                    Width: =(Parent.Width - 6) / 2
                                    X: =btnSegPendientesMan.X + btnSegPendientesMan.Width
                                    Y: =3
                              - btnSegPendientesMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Color: =If(ctxSegManual = "Pendientes", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxSegManual = "Pendientes", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxSegManual = "Pendientes", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxSegManual: "Pendientes", ctxErrorMan: Blank()});
                                      Set(
                                          gvarTxMan,
                                          First(
                                              Sort(
                                              Filter(
                                                  'CH-Tbl-Transactions',
                                                  TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                      && BatchStatus = Blank()
                                                      && TransactionStatus = Blank()
                                                      && Cajero.User = gvarCajeroMan.cajero
                                              ),
                                              'Created On', SortOrder.Ascending
                                          )
                                          )
                                      );
                                      Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan);
                                      Reset(inpCampoMontoMan);  Reset(inpCampoRefMan);
                                      SetFocus(inpCampoCuentaMan)
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =9
                                    Text: ="Pendientes" & If(ctxSegManual = "Pendientes", " (" & CountRows(galTxMan.AllItems) & ")", "")
                                    Width: =(Parent.Width - 6) / 2
                                    X: =3
                                    Y: =3
                        - lblOrdenMan:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              Height: =18
                              Text: |-
                                ="Orden: " & If(ctxSegManual = "Aplicadas", "Aplicada ↓", If(ctxOrdenMan = "Motivo", "Motivo", "Fecha"))
                              Width: =170
                              X: =Parent.Width - 16 - Self.Width
                              Y: =18
                        - shpGridHeadBgMan:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ThemeSurface2
                              Height: =30
                              Width: =Parent.Width
                              Y: =cntSegMan.Y + cntSegMan.Height + 12
                        - lblHdrRefMan:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="REFERENCIA"
                              Width: =Parent.Width*0.13
                              X: =Parent.Width*0.03
                              Y: =cntSegMan.Y + cntSegMan.Height + 12
                        - lblHdrDepMan:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="DEPÓSITO / CLIENTE"
                              Width: =Parent.Width*0.26
                              X: =Parent.Width*0.16
                              Y: =cntSegMan.Y + cntSegMan.Height + 12
                        - lblHdrCtaMan:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="CUENTA"
                              Width: =Parent.Width*0.13
                              X: =Parent.Width*0.43
                              Y: =cntSegMan.Y + cntSegMan.Height + 12
                        - lblHdrMontoMan:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: ="MONTO"
                              Width: =Parent.Width*0.12
                              X: =Parent.Width*0.57
                              Y: =cntSegMan.Y + cntSegMan.Height + 12
                        - btnHdrMotivoMan:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Align: =Align.Left
                              BorderThickness: =0
                              Color: =If(ctxOrdenMan = "Motivo", ThemeAccent, ThemeInk2)
                              Fill: =Color.Transparent
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              OnSelect: |-
                                =UpdateContext({ctxOrdenMan: If(ctxOrdenMan = "Motivo", "Fecha", "Motivo")})
                              PaddingLeft: =0
                              Size: =7.5
                              Text: ="MOTIVO " & If(ctxOrdenMan = "Motivo", "▼", "")
                              Width: =Parent.Width*0.14
                              X: =Parent.Width*0.70
                              Y: =cntSegMan.Y + cntSegMan.Height + 12
                        - lblHdrEstadoMan:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              Size: =7.5
                              Text: =If(ctxSegManual = "Aplicadas", "APLICADA", "ESTADO")
                              Width: =Parent.Width*0.14
                              X: =Parent.Width*0.84
                              Y: =cntSegMan.Y + cntSegMan.Height + 12
                        - shpGridLineaMan:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =ThemeLine
                              Height: =1
                              Width: =Parent.Width
                              Y: =cntSegMan.Y + cntSegMan.Height + 12 + 30
                        - cmpEmptyListaMan:
                            Control: CanvasComponent
                            ComponentName: cmpEmpty
                            Properties:
                              Glifo: ="⛁"
                              Height: =galTxMan.Height
                              Mensaje: =If(ctxSegManual = "Aplicadas", "Sin transacciones aplicadas para este cajero.", "Sin manuales pendientes para este cajero.")
                              Visible: =CountRows(galTxMan.AllItems) = 0
                              Width: =Parent.Width
                              Y: =galTxMan.Y
                        - galTxMan:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Parent.Height - (shpGridLineaMan.Y + 1)
                              Items: |-
                                =If(
                                    ctxSegManual = "Aplicadas",
                                    // --- APLICADAS: más recientes primero ---
                                    Sort(
                                        Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                && BatchStatus = Blank()
                                                && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                                && Cajero.User = gvarCajeroMan.cajero
                                        ),
                                        'Created On', SortOrder.Descending
                                    ),
                                    // --- PENDIENTES ---
                                    If(
                                        ctxOrdenMan = "Motivo",
                                        Sort(
                                            Filter(
                                                'CH-Tbl-Transactions',
                                                TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                    && BatchStatus = Blank() && TransactionStatus = Blank()
                                                    && Cajero.User = gvarCajeroMan.cajero
                                            ),
                                            // rango de motivo (Rechazo core > Sin cuenta > Con cheques > —)
                                            Switch(
                                                true,
                                                !IsBlank(MotivoRechazoCore), 3,
                                                IsBlank(AccountNumber), 2,
                                                !IsBlank(RelatedDepositRecounting), 1,
                                                0
                                            ),
                                            SortOrder.Descending
                                        ),
                                        Sort(
                                            Filter(
                                                'CH-Tbl-Transactions',
                                                TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                    && BatchStatus = Blank() && TransactionStatus = Blank()
                                                    && Cajero.User = gvarCajeroMan.cajero
                                            ),
                                            'Created On', SortOrder.Ascending
                                        )
                                    )
                                )
                              OnSelect: |-
                                =Set(gvarTxMan, galTxMan.Selected);
                                UpdateContext({ctxErrorMan: Blank()});
                                Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan);
                                Reset(inpCampoMontoMan);  Reset(inpCampoRefMan);
                                If(ctxSegManual = "Pendientes", SetFocus(inpCampoCuentaMan))
                              TemplatePadding: =0
                              TemplateSize: =LayRowH
                              Width: =Parent.Width
                              Y: =shpGridLineaMan.Y + 1
                            Children:
                              - shpTxSelMan:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =If(!IsBlank(gvarTxMan) && ThisItem.'CH-Tbl-Transactions' = gvarTxMan.'CH-Tbl-Transactions', ThemeAccentSoft, Color.Transparent)
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                              - shpTxSelBarraMan:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeAccent
                                    Height: =Parent.TemplateHeight
                                    Visible: =!IsBlank(gvarTxMan) && ThisItem.'CH-Tbl-Transactions' = gvarTxMan.'CH-Tbl-Transactions'
                                    Width: =3
                              - btnTxFilaMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Fill: =Color.Transparent
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    HoverFill: =ThemeSurface2
                                    OnSelect: =Select(Parent)
                                    PressedFill: =ThemeAccentSoft
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                              - lblTxRefMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Text: =ThisItem.Name
                                    Width: =Parent.TemplateWidth*0.13
                                    X: =Parent.TemplateWidth*0.03
                              - lblTxDepMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Text: =Coalesce(ThisItem.RelatedDepositRecounting.Name, "—")
                                    Width: =Parent.TemplateWidth*0.26
                                    X: =Parent.TemplateWidth*0.16
                              - lblTxCtaMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =If(IsBlank(ThisItem.AccountNumber), ThemeInk3, ThemeInk)
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Text: =If(IsBlank(ThisItem.AccountNumber), "— sin cuenta —", Text(ThisItem.AccountNumber, "[$-en-US]0"))
                                    Width: =Parent.TemplateWidth*0.13
                                    X: =Parent.TemplateWidth*0.43
                              - lblTxMontoMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Text: =Text(ThisItem.Total, FmtMoney)
                                    Width: =Parent.TemplateWidth*0.12
                                    X: =Parent.TemplateWidth*0.57
                              - lblTxAplicadaMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Select(Parent)
                                    Text: =Text(ThisItem.'Modified On', FmtHora)
                                    Visible: =ctxSegManual = "Aplicadas"
                                    Width: =Parent.TemplateWidth*0.14
                                    X: =Parent.TemplateWidth*0.84
                              - shpTxFilaSepMan:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeLineSoft
                                    Height: =1
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - 1
                              - pilTxEstadoMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeLineSoft
                                    BorderThickness: =1
                                    Color: =ThemeInk3
                                    DisplayMode: =DisplayMode.View
                                    Fill: =ThemeLineSoft
                                    Font: =Font.'Open Sans'
                                    Height: =22
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =7.88
                                    Text: ="Pendiente"
                                    Visible: =ctxSegManual = "Pendientes"
                                    Width: =78
                                    X: =Parent.TemplateWidth*0.84
                                    Y: =(Parent.TemplateHeight-22)/2
                              - pilTxMotivoMan:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: |-
                                      =With(
                                          { m: Switch(true,
                                              !IsBlank(ThisItem.MotivoRechazoCore), "Rechazo core",
                                              IsBlank(ThisItem.AccountNumber),            "Sin cuenta",
                                              !IsBlank(ThisItem.RelatedDepositRecounting),"Con cheques",
                                              "—") },
                                          Switch(m,
                                              "Rechazo core", ThemeDanger,
                                              "Sin cuenta",   ThemeWarn,
                                              "Con cheques",  ThemeInfo,
                                              ThemeInk3)
                                      )
                                    DisplayMode: =DisplayMode.View
                                    Fill: |-
                                      =With(
                                          { m: Switch(true,
                                              !IsBlank(ThisItem.MotivoRechazoCore), "Rechazo core",
                                              IsBlank(ThisItem.AccountNumber),            "Sin cuenta",
                                              !IsBlank(ThisItem.RelatedDepositRecounting),"Con cheques",
                                              "—") },
                                          Switch(m,
                                              "Rechazo core", ThemeDangerSoft,
                                              "Sin cuenta",   ThemeWarnSoft,
                                              "Con cheques",  ThemeInfoSoft,
                                              ThemeLineSoft)
                                      )
                                    Font: =Font.'Open Sans'
                                    Height: =22
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =7.88
                                    Text: |-
                                      =Switch(
                                          true,
                                          !IsBlank(ThisItem.MotivoRechazoCore), "Rechazo core",
                                          IsBlank(ThisItem.AccountNumber),            "Sin cuenta",
                                          !IsBlank(ThisItem.RelatedDepositRecounting),"Con cheques",
                                          "—"
                                      )
                                    Width: =40 + 7*Len(Self.Text)
                                    X: =Parent.TemplateWidth*0.70
                                    Y: =(Parent.TemplateHeight-22)/2
                  - cntDetalleCardMan:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =Parent.Height - LayGutter*2
                        RadiusBottomLeft: =LayCardR
                        RadiusBottomRight: =LayCardR
                        RadiusTopLeft: =LayCardR
                        RadiusTopRight: =LayCardR
                        Width: =Parent.Width - cntDetalleCardMan.X - LayGutter
                        X: =cntListaCardMan.X + cntListaCardMan.Width + LayGap
                        Y: =LayGutter
                      Children:
                        - cntKbHintMan:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =ThemeInfoSoft
                              Height: =lblKbHintMan.Y + lblKbHintMan.Height + 9
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Visible: =ctxSegManual = "Pendientes" && IsBlank(ctxErrorMan) && !IsBlank(gvarTxMan)
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =shpDetLineaMan.Y + 14
                            Children:
                              - icoKbHintMan:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Color: =ThemeInfo
                                    Height: =16
                                    Icon: =Icon.Laptop
                                    Width: =16
                                    X: =13
                                    Y: =11
                              - lblKbHintMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ThemeInfo
                                    Font: =Font.'Open Sans'
                                    Size: =9
                                    Text: |-
                                      ="Copiá y tabulá: Cuenta → Tab → Moneda → … → Referencia → Tab → Enter aplica y pasa al siguiente."
                                    Width: =Parent.Width - 51
                                    X: =38
                                    Y: =9
                        - cntChequesHintMan:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =ThemeInfoSoft
                              Height: =lblChequesHintMan.Y + lblChequesHintMan.Height + 9
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Visible: =ctxSegManual = "Pendientes" && IsBlank(ctxErrorMan) && !IsBlank(gvarTxMan)
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =lblChequesSecMan.Y + lblChequesSecMan.Height + 8
                            Children:
                              - lblChequesHintMan:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =ThemeInfo
                                    Font: =Font.'Open Sans'
                                    Size: =9
                                    Text: ="Cotejá contra los cheques que tenés en mano antes de aplicar."
                                    Width: =Parent.Width - 51
                                    X: =38
                                    Y: =9
                              - icoChequesHintMan:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    Color: =ThemeInfo
                                    Height: =16
                                    Icon: =Icon.Information
                                    Width: =16
                                    X: =13
                                    Y: =11
                        - cmpEmptyChequesMan:
                            Control: CanvasComponent
                            ComponentName: cmpEmpty
                            Properties:
                              Glifo: ="—"
                              Height: =70
                              Mensaje: ="Esta transacción no tiene cheques asociados."
                              Visible: =ctxSegManual = "Pendientes" && IsBlank(ctxErrorMan) && !IsBlank(gvarTxMan) && CountRows(galChequesMan.AllItems) = 0
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =cntChequesHintMan.Y + cntChequesHintMan.Height + 8
                        - cntChequesGridMan:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =ThemeLine
                              BorderThickness: =1
                              Fill: =ThemeSurface
                              Height: =26 + Min(CountRows(galChequesMan.AllItems), 4) * 34 + 2
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Visible: =ctxSegManual = "Pendientes" && IsBlank(ctxErrorMan) && !IsBlank(gvarTxMan) && CountRows(galChequesMan.AllItems) > 0
                              Width: =Parent.Width - 32
                              X: =16
                              Y: =cntChequesHintMan.Y + cntChequesHintMan.Height + 8
                            Children:
                              - galChequesMan:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    Height: =Parent.Height - 27
                                    Items: |-
                                      =If(
