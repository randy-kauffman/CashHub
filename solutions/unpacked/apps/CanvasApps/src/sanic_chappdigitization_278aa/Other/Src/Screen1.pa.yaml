                Control: Button@0.0.45
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: |-
                    =UpdateContext({varScreenSpinnerLabel: "Creando corte..."});
                    IfError(
                        With({cut: 'CH-Flow-CreateCut'.Run()},
                            If(cut.assignedcount > 0,
                                Notify("Corte creado: lote " & cut.batchname & " con " & Text(cut.assignedcount) & " transacciones", NotificationType.Success),
                                Notify("No hay transacciones pendientes para el corte", NotificationType.Warning)
                            )
                        ),
                        Notify("Error al crear el corte: " & FirstError.Message, NotificationType.Error)
                    );
                    Refresh('CH-Tbl-Transactions');
                    Refresh('CH-Tbl-TransactionBatches');
                    UpdateContext({varScreenSpinnerLabel: ""})
