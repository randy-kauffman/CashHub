                  - inpPegarIbsLot:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =ThemeLine
                        Color: =RGBA(70, 68, 64, 1)
                        DisabledBorderColor: =ColorFade(Self.BorderColor, 40%)
                        DisabledColor: =ColorFade(Self.Color, 40%)
                        DisabledFill: =Self.Fill
                        Fill: =ThemeSurface
                        FocusedBorderThickness: =3
                        Font: =Font.'Open Sans'
                        Height: =104
                        HintText: ="Pegá acá el Resumen por Cuenta del IBS (Ctrl+V). Da igual si traés el encabezado, la columna Select, tabulaciones o espacios."
                        HoverBorderColor: =Self.Color
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        MaxLength: |-
                          =// SIN ESTO EL PEGADO SE CORTABA EN 100 CARACTERES. El control no
                          // declaraba MaxLength y heredaba el default de la plataforma: de un
                          // resumen de 500 cuentas (16.409 caracteres) entraban dos lineas, y el
                          // comparador reportaba 498 cuentas "no estan en el IBS" — cierto, y
                          // completamente enganoso. Un lote de 600 cuentas ronda los 20.000
                          // caracteres; se deja holgura de sobra en vez de ajustar al caso de hoy.
                          500000
                        Mode: =TextMode.MultiLine
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Width: =Parent.Width * 0.64 - 48
                        X: =Parent.Width * 0.36 + 24
                        Y: =104
                  - btnCompararLot:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderStyle: =BorderStyle.None
                        Color: =ThemeSurface
                        DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                        DisabledColor: |-
                          =// Sin esto el boton deshabilitado quedaba ILEGIBLE: hereda Color
                          // (ThemeSurface, blanco) sobre DisabledFill gris claro. Un boton que no
                          // se puede leer no comunica que esta deshabilitado, comunica que la
                          // pantalla esta rota.
                          ThemeInk3
                        DisabledFill: =ThemeLineSoft
                        DisplayMode: =If(ctxComparandoLot Or IsBlank(inpPegarIbsLot.Text), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =ThemeAccent
                        Font: =Font.'Open Sans'
                        Height: =32
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =Self.Color
                        OnSelect: |-
                          =// El aviso sale del RESULTADO, no del orden de las lineas: IfError
                          // envuelve solo la llamada y el veredicto se pinta con lo que devolvio
                          // el servidor. Mismo criterio que el resto de la pantalla.
                          UpdateContext({ctxComparandoLot: true});
                          IfError(
                              With(
                                  { r: Environment.sanic_CHBatchSummary({
                                      BatchId: gvarLote.TransactionBatches,
                                      PastedSummary: inpPegarIbsLot.Text }) },
                                  ClearCollect(colCompLot,
                                      ForAll(ParseJSON(r.Comparison) As c,
                                          {
                                              cuenta:    Text(c.cuenta),
                                              moneda:    Text(c.moneda),
                                              estado:    Text(c.estado),
                                              montoLote: Value(c.montoLote),
                                              montoCore: Value(c.montoCore),
                                              difMonto:  Value(c.difMonto),
                                              cantLote:  Value(c.cantLote),
                                              cantCore:  Value(c.cantCore)
                                          }));
                                  UpdateContext({
                                      ctxVeredictoLot: r.Outcome,
                                      ctxMensajeLot: r.Message
                                  })
                              ),
                              UpdateContext({ctxVeredictoLot: "error", ctxMensajeLot: FirstError.Message})
                          );
                          UpdateContext({ctxComparandoLot: false})
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: =If(ctxComparandoLot, "Comparando…", "Comparar con el IBS")
                        Width: =180
                        X: =Parent.Width - 24 - Self.Width
                        Y: =232
                  - lblVeredictoLot:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =Switch(ctxVeredictoLot, "coincide", ThemeOk, "difiere", ThemeDanger, ThemeWarn)
                        DisabledColor: =RGBA(186, 186, 186, 1)
                        Fill: =Switch(ctxVeredictoLot, "coincide", ThemeOkSoft, "difiere", ThemeDangerSoft, ThemeWarnSoft)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        PaddingLeft: =12
                        PaddingRight: =12
                        Size: =9
                        Text: =ctxMensajeLot
                        Visible: =!IsBlank(ctxVeredictoLot)
                        Width: =Parent.Width * 0.64 - 48 - 188
                        X: =Parent.Width * 0.36 + 24
                        Y: =232
