                              Text: =ThisItem.estado
                              Width: =Parent.TemplateWidth * 0.28
                              X: =Parent.TemplateWidth * 0.30
                              Y: =2
                        - lblCompDetalleLot:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =RGBA(0, 0, 0, 1)
