                  - lblPegadoContadorLot:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: |-
                          =// Se pone en alerta si el pegado quedo sospechosamente corto para la
                          // cantidad de cuentas del lote: es la senal temprana de un copiado
                          // incompleto, ANTES de comparar y confundirse con el resultado.
                          If(!IsBlank(inpPegarIbsLot.Text)
                             && CountRows(Split(inpPegarIbsLot.Text, Char(10))) < CountRows(colResumenLot),
                             ThemeWarn, ThemeInk3)
                        DisabledColor: =RGBA(186, 186, 186, 1)
