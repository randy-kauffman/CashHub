                                    Height: =16
                                    Size: =7.5
                                    Text: ="DEPÓSITO / CLIENTE"
                                    Width: =(Parent.Width - 2*16) * 2/5.6
                                    X: =lblGCol1Lot.X + lblGCol1Lot.Width
                                    Y: =8
