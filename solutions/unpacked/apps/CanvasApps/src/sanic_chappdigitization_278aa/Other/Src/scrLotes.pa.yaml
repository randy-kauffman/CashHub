                                    Color: =If(ctxFiltroEstadoLot = "Aplicados", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxFiltroEstadoLot = "Aplicados", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxFiltroEstadoLot = "Aplicados", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxFiltroEstadoLot: "Aplicados"});
                                      Set(gvarTxLot, Blank());
                                      Set(gvarLote, First(
                                          SortByColumns(
                                              Filter('CH-Tbl-TransactionBatches',
                                                  Cajero.User = gvarCajeroLot.cajero,
                                                  ( ctxFiltroEstadoLot = "Todos" )
                                                  || ( ctxFiltroEstadoLot = "Aplicados"
                                                       && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                                  || ( ctxFiltroEstadoLot = "Por aplicar"
                                                       && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                                        || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                                  ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                                  ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                              ),
                                              "createdon", SortOrder.Descending
                                          )
                                      ))
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Text: ="Aplicados"
                                    Width: =(Parent.Width - 6) / 3
                                    X: =btnSegPorAplicarLot.X + btnSegPorAplicarLot.Width
                                    Y: =3
                              - btnSegTodosLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderThickness: =0
                                    Color: =If(ctxFiltroEstadoLot = "Todos", ThemeAccent, ThemeInk2)
                                    Fill: =If(ctxFiltroEstadoLot = "Todos", ThemeSurface, Color.Transparent)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =If(ctxFiltroEstadoLot = "Todos", FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Parent.Height - 6
                                    OnSelect: |-
                                      =UpdateContext({ctxFiltroEstadoLot: "Todos"});
                                      Set(gvarTxLot, Blank());
                                      Set(gvarLote, First(
                                          SortByColumns(
                                              Filter('CH-Tbl-TransactionBatches',
                                                  Cajero.User = gvarCajeroLot.cajero,
                                                  ( ctxFiltroEstadoLot = "Todos" )
                                                  || ( ctxFiltroEstadoLot = "Aplicados"
                                                       && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                                  || ( ctxFiltroEstadoLot = "Por aplicar"
                                                       && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                            || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                                        || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                                  ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                                  ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                              ),
                                              "createdon", SortOrder.Descending
                                          )
                                      ))
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Text: ="Todos"
                                    Width: =(Parent.Width - 6) / 3
                                    X: =btnSegAplicadosLot.X + btnSegAplicadosLot.Width
                                    Y: =3
                        - inpBuscarLot:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =ThemeLine
                              Default: =
                              DelayOutput: =true
                              Font: =Font.'Open Sans'
                              Height: =32
                              HintText: ="⌕ N° de lote…"
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =cntSegEstadoLo.Y + cntSegEstadoLo.Height + 10
                        - tabFechaLot:
                            Control: ModernTabList@1.0.1
                            Properties:
                              Font: =Font.'Open Sans'
                              Height: =30
                              Items: =Table({Value:"Cualquier fecha"},{Value:"Hoy"},{Value:"Últimos 7 días"},{Value:"Este mes"})
                              OnChange: |-
                                =UpdateContext({ctxDesdeFechaLot:
                                    Switch(tabFechaLot.Selected.Value,
                                        "Hoy", Today(),
                                        "Últimos 7 días", DateAdd(Today(), -7, TimeUnit.Days),
                                        "Este mes", Date(Year(Today()), Month(Today()), 1),
                                        DateValue("1900-01-01"))});
                                Set(gvarTxLot, Blank());
                                Set(gvarLote, First(
                                    SortByColumns(
                                        Filter('CH-Tbl-TransactionBatches',
                                            Cajero.User = gvarCajeroLot.cajero,
                                            ( ctxFiltroEstadoLot = "Todos" )
                                            || ( ctxFiltroEstadoLot = "Aplicados"
                                                 && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                            || ( ctxFiltroEstadoLot = "Por aplicar"
                                                 && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                            ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                            ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                        ),
                                        "createdon", SortOrder.Descending
                                    )
                                ))
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =inpBuscarLot.Y + inpBuscarLot.Height + 8
                        - lblListaSubLot:
                            Control: Label@2.5.1
                            Properties:
                              Color: =ThemeInk3
                              Fill: =ThemeSurface2
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              PaddingLeft: =12
                              Size: =7.88
                              Text: =$"Lotes de {Coalesce(gvarCajeroLot.cajeroNombre, "—")}"
                              Width: =Parent.Width
                              Y: =tabFechaLot.Y + tabFechaLot.Height + 10
                        - galLotesLot:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Parent.Height - Self.Y - 8
                              Items: |-
                                =SortByColumns(
                                    Filter('CH-Tbl-TransactionBatches',
                                        Cajero.User = gvarCajeroLot.cajero,
                                        ( ctxFiltroEstadoLot = "Todos" )
                                        || ( ctxFiltroEstadoLot = "Aplicados"
                                             && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                        || ( ctxFiltroEstadoLot = "Por aplicar"
                                             && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                  || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                        ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                        ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                    ),
                                    "createdon", SortOrder.Descending
                                )
                              OnSelect: |-
                                =Set(gvarLote, ThisItem);
                                Set(gvarTxLot, Blank())
                              TemplateSize: =52
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =lblListaSubLot.Y + lblListaSubLot.Height
                            Children:
                              - shpLoteSelLot:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =If(ThisItem.TransactionBatches = gvarLote.TransactionBatches, ThemeAccentSoft, Color.Transparent)
                                    Height: =52
                                    Width: =Parent.TemplateWidth
                              - shpLoteSelBarraLot:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeAccent
                                    Height: =52
                                    Visible: =ThisItem.TransactionBatches = gvarLote.TransactionBatches
                                    Width: =3
                              - btnLoteFilaLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Fill: =Color.Transparent
                                    Height: =52
                                    HoverFill: =Color.Transparent
                                    OnSelect: =Select(Parent)
                                    PressedFill: =Color.Transparent
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                              - lblLoteNombreLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =Select(Parent)
                                    Text: =ThisItem.Name
                                    Width: =Parent.TemplateWidth - 110
                                    X: =13
                                    Y: =8
                              - lblLoteMetaLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =ThemeInk3
                                    Font: =Font.'Open Sans'
                                    Height: =16
                                    OnSelect: =Select(Parent)
                                    Text: =Text(ThisItem.'Created On', FmtFecha)
                                    Width: =Parent.TemplateWidth - 110
                                    X: =13
                                    Y: =30
                              - pilLoteEstadoLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Color: |-
                                      =Switch(ThisItem.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, ThemeWarn,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  ThemeOk, ThemeInfo)
                                    DisplayMode: =DisplayMode.View
                                    Fill: |-
                                      =Switch(ThisItem.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, ThemeWarnSoft,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  ThemeOkSoft, ThemeInfoSoft)
                                    Font: =Font.'Open Sans'
                                    Height: =22
                                    OnSelect: =Select(Parent)
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =7.88
                                    Text: |-
                                      =Switch(ThisItem.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Generado,  "Generado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, "Ingresado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto,  "Devuelto",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado,  "Aprobado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  "Aplicado", "—")
                                    Width: =84
                                    X: =Parent.TemplateWidth - 96
                                    Y: =15
                        - cmpEmptyListaLot:
                            Control: CanvasComponent
                            ComponentName: cmpEmpty
                            Properties:
                              Glifo: ="⛁"
                              Height: =galLotesLot.Height
                              Mensaje: ="Sin lotes para este filtro."
                              Visible: |-
                                =IsEmpty(
                                    SortByColumns(
                                        Filter('CH-Tbl-TransactionBatches',
                                            Cajero.User = gvarCajeroLot.cajero,
                                            ( ctxFiltroEstadoLot = "Todos" )
                                            || ( ctxFiltroEstadoLot = "Aplicados"
                                                 && BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado )
                                            || ( ctxFiltroEstadoLot = "Por aplicar"
                                                 && ( BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                                      || BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado ) ),
                                            ( IsBlank(inpBuscarLot.Text) || StartsWith(Name, inpBuscarLot.Text) ),
                                            ( tabFechaLot.Selected.Value = "Cualquier fecha" || 'Created On' >= ctxDesdeFechaLot )
                                        ),
                                        "createdon", SortOrder.Descending
                                    )
                                )
                              Width: =Parent.Width - 2*12
                              X: =12
                              Y: =galLotesLot.Y
                  - cntDetalleCardLot:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =ThemeLine
                        BorderThickness: =1
                        Fill: =ThemeSurface
                        Height: =Parent.Height - 2*LayGutter
                        RadiusBottomLeft: =LayCardR
                        RadiusBottomRight: =LayCardR
                        RadiusTopLeft: =LayCardR
                        RadiusTopRight: =LayCardR
                        Width: =Parent.Width - LayGutter - Self.X
                        X: =cntListaCardLot.X + cntListaCardLot.Width + LayGap
                        Y: =LayGutter
                      Children:
                        - cntDetHeadLot:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Color.Transparent
                              Height: =54
                              Visible: =!IsBlank(gvarLote)
                              Width: =Parent.Width
                            Children:
                              - lblDetTituloLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =22
                                    Size: =12
                                    Text: =$"Lote {gvarLote.Name}"
                                    Width: =Parent.Width - 130
                                    X: =16
                                    Y: =8
                              - lblDetSubLot:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =ThemeInk3
                                    Font: =Font.'Open Sans'
                                    Height: =16
                                    Size: =8.25
                                    Text: =$"{Coalesce(gvarCajeroLot.cajeroNombre, gvarLote.Cajero.'Full Name')} · generado {Text(gvarLote.'Created On', FmtFecha)}"
                                    Width: =Parent.Width - 130
                                    X: =16
                                    Y: =30
                              - cmpPilDetEstadoLot:
                                  Control: CanvasComponent
                                  ComponentName: cmpPildora
                                  Properties:
                                    Height: =22
                                    Texto: |-
                                      =Switch(gvarLote.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Generado,  "Generado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, "Ingresado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto,  "Devuelto",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aprobado,  "Aprobado",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  "Aplicado", "—")
                                    Tono: |-
                                      =Switch(gvarLote.BatchStatus,
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado, "warn",
                                          'BatchStatus (CH-Tbl-TransactionBatches)'.Aplicado,  "ok", "info")
                                    Width: =84
                                    X: =Parent.Width - 16 - Self.Width
                                    Y: =16
                              - shpDetHeadLineaLot:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeLine
                                    Height: =1
                                    Width: =Parent.Width
                                    Y: =Parent.Height - 1
                        - cntOpsLot:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Color.Transparent
                              Height: =48
                              Visible: =!IsBlank(gvarLote)
                              Width: =Parent.Width
                              Y: =cntDetHeadLot.Y + cntDetHeadLot.Height
                            Children:
                              - btnMarcarIngresadoLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeAccent
                                    BorderThickness: =1
                                    Color: =ThemeAccent
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =32
                                    HoverFill: =ThemeAccentSoft
                                    OnSelect: |-
                                      =// EL AVISO SALE DEL RESULTADO, NO DEL ORDEN DE LAS LINEAS. Antes el Notify
                                      // de exito vivia DENTRO del primer argumento de IfError, en la misma
                                      // cadena que el Patch. En una cadena de comportamiento el error del
                                      // primer paso NO corta lo que sigue, y el valor de la cadena termina
                                      // siendo el del ultimo paso —el Notify, que no falla—: IfError veia
                                      // "sin error", nunca corria el fallback, y el usuario leia que todo
                                      // habia salido bien mientras el servidor lo habia rechazado.
                                      //
                                      // Ahora IfError envuelve SOLO la escritura, y el exito se marca con
                                      // una bandera adentro del camino feliz.
                                      UpdateContext({ctxPasoOkLot: false});
                                      IfError(
                                          Patch('CH-Tbl-TransactionBatches', LookUp('CH-Tbl-TransactionBatches',TransactionBatches = gvarLote.TransactionBatches ),
                                              { BatchStatus: 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado });
                                          UpdateContext({ctxPasoOkLot: true}),
                                          Notify("No se pudo marcar Ingresado: " & FirstError.Message, NotificationType.Error)
                                      );
                                      If(ctxPasoOkLot,
                                          Set(gvarLote, LookUp('CH-Tbl-TransactionBatches',
                                              TransactionBatches = gvarLote.TransactionBatches));
                                          Notify("Lote marcado como Ingresado.", NotificationType.Success)
                                      )
                                    Size: =10
                                    Text: |-
                                      =// Desde Devuelto el mismo boton es la RECARGA: se corrigio y se
                                      // vuelve a presentar al IBS.
                                      If(gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto,
                                         "Volver a marcar Ingresado", "Marcar como Ingresado")
                                    Visible: |-
                                      =gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                      || gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                                    Width: =176
                                    X: =16
                                    Y: =8
                              - btnMarcarAplicadoLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeAccent
                                    BorderThickness: =1
                                    Color: =ThemeAccent
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =32
                                    HoverFill: =ThemeAccentSoft
                                    OnSelect: |-
                                      =UpdateContext({ctxDlgAplicadoLot: true})
                                    Size: =10
                                    Text: ="Marcar como Aplicado"
                                    Visible: |-
                                      =gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                      && Lower(Coalesce(gvarLote.'Ingresado por'.'Primary Email', "")) <> Lower(User().Email)
                                    Width: =176
                                    X: =16
                                    Y: =8
                              - btnDescargarCsvLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeAccent
                                    BorderThickness: =1
                                    Color: =ThemeAccent
                                    DisabledBorderColor: =Color.Transparent
                                    DisabledColor: =ThemeInk3
                                    DisabledFill: =ThemeLineSoft
                                    DisplayMode: =If(ctxDescargandoLot, DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =26
                                    OnSelect: |-
                                      =// EL CSV YA NO SE BAJA NAVEGANDO. Antes esto terminaba en
                                      // Download(".../sanic_csvcore/$value"), que es una navegacion del
                                      // navegador: Power Fx no puede ponerle un header Authorization, asi
                                      // que lo unico que la autenticaba era la cookie del org. Los usuarios
                                      // de negocio no la tienen y recibian un 401 mudo, fuera del alcance
                                      // del IfError.
                                      //
                                      // Ahora el contenido viene por el conector, que si va autenticado, y
                                      // el archivo lo arma el navegador. CH-Flow-DownloadData sigue
                                      // generando y ARCHIVANDO el CSV: la API lo lee, no lo regenera, para
                                      // que lo que se baja y lo que queda archivado sean el mismo archivo.
                                      UpdateContext({ctxDescargandoLot: true, ctxDlTokenLot: ""});
                                      IfError(
                                          With(
                                              { res: 'CH-Flow-DownloadData'.Run(gvarLote.TransactionBatches, gvarLote.Name) },
                                              With(
                                                  { archivo: Environment.sanic_CHGetBatchCsv({ BatchId: gvarLote.TransactionBatches }) },
                                                  UpdateContext({
                                                      ctxCsvLot: archivo.Csv,
                                                      ctxCsvNombreLot: archivo.FileName,
                                                      ctxCsvBytesLot: archivo.SizeBytes
                                                  });
                                                  UpdateContext({ ctxDlTokenLot: Text(Now(), "[$-en-US]yyyymmddhhmmssfff") })
                                              )
                                          ),
                                          Notify("No se pudo descargar el CSV: " & FirstError.Message, NotificationType.Error)
                                      );
                                      UpdateContext({ctxDescargandoLot: false})
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =8.25
                                    Text: =If(ctxDescargandoLot, "Generando CSV…", "Descargar CSV")
                                    Width: =118
                                    X: =Parent.Width - 16 - Self.Width
                                    Y: =11
                              - btnSacarLoteLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeDangerLine
                                    BorderThickness: =1
                                    Color: =ThemeDanger
                                    DisabledBorderColor: =Color.Transparent
                                    DisabledColor: =ThemeInk3
                                    DisabledFill: =ThemeLineSoft
                                    DisplayMode: =If(!IsBlank(gvarTxLot), DisplayMode.Edit, DisplayMode.Disabled)
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =26
                                    OnSelect: |-
                                      =Reset(inpMotivoLot);
                                      UpdateContext({ctxDlgSacarLot: true})
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =8.25
                                    Text: ="Sacar del lote"
                                    Visible: |-
                                      =// MIENTRAS ESTA EN EL IBS NO SE TOCA. Un lote 'Ingresado' esta en manos
                                      // del aprobador esperando veredicto: sacarle una transaccion por atras
                                      // dejaria el archivo que el tiene en pantalla diciendo una cosa y el lote
                                      // de CashHub diciendo otra. Si hay algo que corregir, el aprobador lo
                                      // DEVUELVE, y ahi si vuelve a ser editable.
                                      //
                                      // El servidor lo vuelve a exigir igual (TransactionGuard.CanRemoveFromCut):
                                      // esconder el boton es cortesia, no seguridad.
                                      gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Generado
                                      || gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Devuelto
                                    Width: =108
                                    X: =btnDescargarCsvLot.X - 8 - Self.Width
                                    Y: =11
                              - shpOpsLineaLot:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =ThemeLineSoft
                                    Height: =1
                                    Width: =Parent.Width
                                    Y: =Parent.Height - 1
                              - btnMarcarDevueltoLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeDangerLine
                                    BorderThickness: =1
                                    Color: =ThemeDanger
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =32
                                    HoverFill: =ThemeDangerSoft
                                    OnSelect: |-
                                      =UpdateContext({ctxDlgDevolverLot: true})
                                    Size: =10
                                    Text: ="Marcar como Devuelto"
                                    Visible: |-
                                      =// LAS DOS CARAS DEL MISMO VEREDICTO. El aprobador revisa la carga en
                                      // el IBS y o la aplica o la devuelve, asi que este boton aparece
                                      // exactamente cuando aparece "Marcar como Aplicado": con el lote
                                      // Ingresado y con alguien que NO sea quien lo subio.
                                      //
                                      // El servidor lo vuelve a exigir igual (segregacion de funciones en
                                      // TransactionGuard): esconder el boton es cortesia, no seguridad.
                                      gvarLote.BatchStatus = 'BatchStatus (CH-Tbl-TransactionBatches)'.Ingresado
                                      && Lower(Coalesce(gvarLote.'Ingresado por'.'Primary Email', "")) <> Lower(User().Email)
                                    Width: =176
                                    X: =btnMarcarAplicadoLot.X + btnMarcarAplicadoLot.Width + 8
                                    Y: =8
                              - btnAbrirResumenLot:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =ThemeLine
                                    BorderThickness: =1
                                    Color: =ThemeInk2
                                    DisabledBorderColor: =Color.Transparent
                                    DisabledColor: =ThemeInk3
                                    DisabledFill: =ThemeLineSoft
                                    DisplayMode: =If(ctxCargandoResumenLot, DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =ThemeSurface
                                    Font: =Font.'Open Sans'
                                    Height: =26
                                    OnSelect: |-
                                      =// Se abre LIMPIO: sin veredicto viejo ni texto pegado de otro lote.
                                      // Un resultado anterior sobreviviendo al cambio de lote seria una
                                      // mentira peor que no mostrar nada.
                                      UpdateContext({
                                          ctxCargandoResumenLot: true,
                                          ctxVeredictoLot: "",
                                          ctxMensajeLot: ""
                                      });
                                      Clear(colCompLot);
                                      Reset(inpPegarIbsLot);
                                      IfError(
                                          With(
                                              { r: Environment.sanic_CHBatchSummary({ BatchId: gvarLote.TransactionBatches }) },
                                              ClearCollect(colResumenLot,
                                                  ForAll(ParseJSON(r.Summary) As s,
                                                      {
                                                          cuenta:   Text(s.cuenta),
                                                          moneda:   Text(s.moneda),
                                                          monto:    Value(s.monto),
                                                          cantidad: Value(s.cantidad)
                                                      }));
                                              UpdateContext({ctxDlgResumenLot: true})
                                          ),
                                          Notify("No se pudo armar el resumen del lote: " & FirstError.Message, NotificationType.Error)
                                      );
                                      UpdateContext({ctxCargandoResumenLot: false})
                                    RadiusBottomLeft: =7
                                    RadiusBottomRight: =7
                                    RadiusTopLeft: =7
                                    RadiusTopRight: =7
                                    Size: =8.25
                                    Text: =If(ctxCargandoResumenLot, "Cargando…", "Resumen / Comparar IBS")
                                    Width: =178
                                    X: =btnDescargarCsvLot.X - 8 - Self.Width
                                    Y: =11
                        - cntProgresoLot:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =Color.Transparent
                              Height: =22
                              Visible: =ctxDescargandoLot
                              Width: =Parent.Width - 2*16
                              X: =16
