                              Text: =$"lote {Text(ThisItem.montoLote, FmtMoney)} ({ThisItem.cantLote})   ·   IBS {Text(ThisItem.montoCore, FmtMoney)} ({ThisItem.cantCore})"
                              Width: =Parent.TemplateWidth * 0.42
