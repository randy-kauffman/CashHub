    cntUserHdr As groupContainer.manualLayoutContainer:
        BorderColor: =ThemeLine
        BorderThickness: =1
        DropShadow: =DropShadow.Light
        Fill: =ThemeSurface2
        Height: =34
        LayoutGridColumnMinWidth: =0
