        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =17
        RadiusBottomRight: =17
        RadiusTopLeft: =17
        RadiusTopRight: =17
        Width: |-
            =// ANCHO FIJO, A PROPOSITO. Este contenedor arrastro dos versiones del mismo
            // error "The function - returned a non-finite number" sobre cntUserHdr.X:
            //
            //   1a) Width miraba a un hijo (lblUsuarioHdr) mientras X restaba Self.Width.
            //   1b) corregido eso, X SEGUIA dependiendo de Self.Width.
            //
            // Una geometria que se mide a si misma no tiene por que resolverse en el primer
            // render, y cuando no resuelve devuelve un no-finito. Se corta de raiz: el chip
            // mide 210 (38 del avatar + 160 del nombre + 12 de margen) y la etiqueta de
            // adentro recorta sola si el nombre es largo. Nada aca depende del contenido.
            210
        X: =IfError(Parent.Width - LayGutter - 210,300)
        Y: =(Parent.Height-34)/2
        ZIndex: =7

