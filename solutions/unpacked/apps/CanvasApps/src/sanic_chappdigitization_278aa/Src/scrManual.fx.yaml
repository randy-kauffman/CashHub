scrManual As screen:
    ContentLanguage: =""
    Fill: =ThemeBg
    LoadingSpinnerColor: =App.Theme.Colors.Primary
    OnVisible: |-
        =UpdateContext({
            ctxSegManual: "Pendientes",
            ctxOrdenMan: "Fecha",
            ctxMotivoMan: "Todos",
            ctxErrorMan: Blank()
        });
        Select(btnCargarMan);
        Set(gvarCajeroMan, cmpRailMan.CajeroSel);
        Set(
            gvarTxMan,
            First(
                Sort(
                Filter(
                    'CH-Tbl-Transactions',
                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                        && BatchStatus = Blank()
                        && TransactionStatus = Blank()
                        && Cajero.User = gvarCajeroMan.cajero
                ),
                'Created On', SortOrder.Ascending
            )
            )
        );
        Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
        Reset(inpCampoChqBacMan); Reset(inpCampoChqOtrMan);
        Reset(inpCampoTotalMan);  Reset(inpCampoRefMan);
        SetFocus(inpFocoMan);
        Environment.sanic_CHWorkloadByCashier().Workload

    cmpHeaderMan As cmpHeader:
        Activo: ="Manual"
        Height: =LayHeaderH
        OnCheques: =Navigate(scrCheques)
        OnCorte: =Navigate(scrCorte)
        OnLotes: =Navigate(scrLotes)
        OnManual: =false
        OnMovimientos: =Navigate(scrMovimientos, ScreenTransition.None)
        Subtitulo: ="Aplicación manual"
        Width: =Parent.Width
        ZIndex: =1

    cntBodyMan As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.Light
        Fill: =Color.Transparent
        Height: =Parent.Height - LayHeaderH
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Width: =Parent.Width
        Y: =LayHeaderH
        ZIndex: =2

        cmpRailMan As cmpRailCajeros:
            Datos: =AddColumns(DropColumns(colCajerosMan, pendientesManual), pendientesCorte, 0, totalNio, 0, totalUsd, 0, totalEur, 0)
            Height: =Parent.Height
            OnActualizar: =Select(btnCargarMan)
            OnSeleccion: |-
                =Set(gvarCajeroMan, cmpRailMan.CajeroSel);
                UpdateContext({ctxSegManual: "Pendientes", ctxErrorMan: Blank()});
                Set(
                    gvarTxMan,
                    First(
                        Sort(
                        Filter(
                            'CH-Tbl-Transactions',
                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                && BatchStatus = Blank()
                                && TransactionStatus = Blank()
                                && Cajero.User = gvarCajeroMan.cajero
                        ),
                        'Created On', SortOrder.Ascending
                    )
                    )
                );
                Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
                Reset(inpCampoChqBacMan); Reset(inpCampoChqOtrMan);
                Reset(inpCampoTotalMan);  Reset(inpCampoRefMan);
                SetFocus(inpFocoMan)
            Titulo: ="CAJEROS CON MANUALES"
            Width: =LayRailW
            ZIndex: =1

        cntMainMan As groupContainer.manualLayoutContainer:
            DropShadow: =DropShadow.Light
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Width: =Parent.Width - LayRailW
            X: =LayRailW
            ZIndex: =2

            cntListaCardMan As groupContainer.manualLayoutContainer:
                BorderColor: =ThemeLine
                BorderThickness: =1
                DropShadow: =DropShadow.Light
                Fill: =ThemeSurface
                Height: =Parent.Height - LayGutter*2
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                RadiusBottomLeft: =LayCardR
                RadiusBottomRight: =LayCardR
                RadiusTopLeft: =LayCardR
                RadiusTopRight: =LayCardR
                Width: =(Parent.Width - LayGutter*2 - LayGap) * 0.6
                X: =LayGutter
                Y: =LayGutter
                ZIndex: =1

                cntSegMan As groupContainer.manualLayoutContainer:
                    BorderColor: =ThemeLine
                    BorderThickness: =1
                    DropShadow: =DropShadow.Light
                    Fill: =ThemeSurface2
                    Height: =30
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    RadiusBottomLeft: =9
                    RadiusBottomRight: =9
                    RadiusTopLeft: =9
                    RadiusTopRight: =9
                    Width: =210
                    X: =16
                    Y: =12
                    ZIndex: =1

                    btnSegAplicadasMan As button:
                        BorderColor: =App.Theme.Colors.Primary
                        BorderStyle: =BorderStyle.None
                        Color: =If(ctxSegManual = "Aplicadas", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =If(ctxSegManual = "Aplicadas", ThemeSurface, Color.Transparent)
                        FontWeight: =If(ctxSegManual = "Aplicadas", FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.Height - 6
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: |-
                            =UpdateContext({ctxSegManual: "Aplicadas", ctxErrorMan: Blank()});
                            Set(
                                gvarTxMan,
                                First(
                                    Sort(
                                        Filter(
                                            'CH-Tbl-Transactions',
                                            TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                                && BatchStatus = Blank()
                                                && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                                && Cajero.User = gvarCajeroMan.cajero
                                        ),
                                        'Created On', SortOrder.Descending
                                    )
                                )
                            )
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =App.Theme.Colors.Darker40
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Aplicadas" & If(ctxSegManual = "Aplicadas", " (" & If(CountRows(galTxMan.AllItems) >= 2000, "2000+", Text(CountRows(galTxMan.AllItems))) & ")", "")
                        Width: =(Parent.Width - 6) / 2
                        X: =btnSegPendientesMan.X + btnSegPendientesMan.Width
                        Y: =3
                        ZIndex: =1

                    btnSegPendientesMan As button:
                        BorderColor: =App.Theme.Colors.Primary
                        BorderStyle: =BorderStyle.None
                        Color: =If(ctxSegManual = "Pendientes", ThemeAccent, ThemeInk2)
                        DisabledBorderColor: =RGBA(244, 244, 244, 1)
                        DisabledColor: =RGBA(166, 166, 166, 1)
                        DisabledFill: =RGBA(244, 244, 244, 1)
                        Fill: =If(ctxSegManual = "Pendientes", ThemeSurface, Color.Transparent)
                        FontWeight: =If(ctxSegManual = "Pendientes", FontWeight.Semibold, FontWeight.Normal)
                        Height: =Parent.Height - 6
                        HoverBorderColor: =App.Theme.Colors.Darker10
                        HoverColor: =App.Theme.Colors.PrimaryForeground
                        HoverFill: =App.Theme.Colors.Darker10
                        OnSelect: |-
                            =UpdateContext({ctxSegManual: "Pendientes", ctxErrorMan: Blank()});
                            Set(
                                gvarTxMan,
                                First(
                                    Sort(
                                    Filter(
                                        'CH-Tbl-Transactions',
                                        TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                            && BatchStatus = Blank()
                                            && TransactionStatus = Blank()
                                            && Cajero.User = gvarCajeroMan.cajero
                                    ),
                                    'Created On', SortOrder.Ascending
                                )
                                )
                            );
                            Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
                            Reset(inpCampoChqBacMan); Reset(inpCampoChqOtrMan);
                            Reset(inpCampoTotalMan);  Reset(inpCampoRefMan);
                            SetFocus(inpFocoMan)
                        PressedBorderColor: =App.Theme.Colors.Darker40
                        PressedColor: =Self.Color
                        PressedFill: =App.Theme.Colors.Darker40
                        RadiusBottomLeft: =7
                        RadiusBottomRight: =7
                        RadiusTopLeft: =7
                        RadiusTopRight: =7
                        Size: =9
                        Text: ="Pendientes" & If(ctxSegManual = "Pendientes", " (" & If(CountRows(galTxMan.AllItems) >= 2000, "2000+", Text(CountRows(galTxMan.AllItems))) & ")", "")
                        Width: =(Parent.Width - 6) / 2
                        X: =3
                        Y: =3
                        ZIndex: =2

                lblOrdenMan As label:
                    Align: =Align.Right
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =18
                    Size: =13
                    Text: |-
                        ="Orden: " & If(ctxSegManual = "Aplicadas", "Aplicada ↓", If(ctxOrdenMan = "Motivo", "Motivo", "Fecha"))
                    Width: =170
                    X: =Parent.Width - 16 - Self.Width
                    Y: =18
                    ZIndex: =2

                shpGridHeadBgMan As rectangle:
                    BorderColor: =App.Theme.Colors.Darker40
                    Fill: =ThemeSurface2
                    Height: =30
                    Width: =Parent.Width
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =3

                lblHdrRefMan As label:
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =30
                    Size: =7.5
                    Text: ="REFERENCIA"
                    Width: =Parent.Width*0.11
                    X: =Parent.Width*0.03
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =4

                lblHdrDepMan As label:
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =30
                    Size: =7.5
                    Text: ="DEPÓSITO / CLIENTE"
                    Width: =Parent.Width*0.20
                    X: =Parent.Width*0.15
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =5

                lblHdrCtaMan As label:
                    Align: =Align.Right
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =30
                    Size: =7.5
                    Text: ="CUENTA"
                    Width: =Parent.Width*0.11
                    X: =Parent.Width*0.36
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =6

                lblHdrMontoMan As label:
                    Align: =Align.Right
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =30
                    Size: =7.5
                    Text: ="MONTO"
                    Width: =Parent.Width*0.10
                    X: =Parent.Width*0.48
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =7

                lblHdrTipoMan As label:
                    Color: =ThemeInk3
                    FontWeight: =FontWeight.Semibold
                    Height: =30
                    Size: =7.5
                    Text: ="TIPO"
                    Width: =Parent.Width*0.10
                    X: =Parent.Width*0.60
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =7

                btnHdrMotivoMan As button:
                    Align: =Align.Left
                    BorderColor: =App.Theme.Colors.Primary
                    BorderThickness: =0
                    Color: =If(ctxOrdenMan = "Motivo", ThemeAccent, ThemeInk2)
                    DisabledBorderColor: =RGBA(244, 244, 244, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    DisabledFill: =RGBA(244, 244, 244, 1)
                    Fill: =Color.Transparent
                    FontWeight: =FontWeight.Bold
                    Height: =30
                    HoverBorderColor: =App.Theme.Colors.Darker10
                    HoverColor: =App.Theme.Colors.PrimaryForeground
                    HoverFill: =App.Theme.Colors.Darker10
                    OnSelect: |-
                        =UpdateContext({ctxOrdenMan: If(ctxOrdenMan = "Motivo", "Fecha", "Motivo")})
                    PaddingLeft: =0
                    PressedBorderColor: =App.Theme.Colors.Darker40
                    PressedColor: =Self.Color
                    PressedFill: =App.Theme.Colors.Darker40
                    Size: =7.5
                    Text: ="MOTIVO " & If(ctxOrdenMan = "Motivo", "▼", "")
                    Width: =Parent.Width*0.12
                    X: =Parent.Width*0.71
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =8

                lblHdrEstadoMan As label:
                    BorderColor: =App.Theme.Colors.Darker40
                    Color: =ThemeInk2
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =30
                    Size: =7.5
                    Text: =If(ctxSegManual = "Aplicadas", "APLICADA", "ESTADO")
                    Width: =Parent.Width*0.14
                    X: =Parent.Width*0.84
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10
                    ZIndex: =9

                shpGridLineaMan As rectangle:
                    BorderColor: =App.Theme.Colors.Darker40
                    Fill: =ThemeLine
                    Height: =1
                    Width: =Parent.Width
                    Y: =galMotivoMan.Y + galMotivoMan.Height + 10 + 30
                    ZIndex: =10

                cmpEmptyListaMan As cmpEmpty:
                    Glifo: ="⛁"
                    Height: =galTxMan.Height
                    Mensaje: =If(ctxSegManual = "Aplicadas", "Sin transacciones aplicadas para este cajero.", "Sin manuales pendientes para este cajero.")
                    Visible: =CountRows(galTxMan.AllItems) = 0
                    Width: =Parent.Width
                    Y: =galTxMan.Y
                    ZIndex: =11

                galTxMan As gallery.galleryVertical:
                    '#CopilotOverlayLabel': ="Filtered"
                    BorderColor: =App.Theme.Colors.Darker40
                    DelayItemLoading: =true
                    Height: =Parent.Height - (shpGridLineaMan.Y + 1)
                    Items: |-
                        =// FILTRO POR MOTIVO, en pendientes y en aplicadas.
                        //
                        // EL SWITCH VA AFUERA DEL SORT, no adentro. La primera version era
                        // Sort(Switch(...)) y devolvia CERO filas: "Con cheques" mostraba la lista
                        // vacia aunque "Todos" estuviera lleno de filas con esa pildora. Cada rama
                        // es ahora un Sort(Filter(...)) completo — la misma forma que ya venia
                        // funcionando en esta galeria.
                        //
                        // EL MOTIVO NO ES UNA COLUMNA: se deduce, con PRIORIDAD
                        //   Rechazo core > Faltante > Sobrante > Sin declaracion > Sin cuenta > Con cheques > —
                        // y cada rama repite en negativo las condiciones de las de mayor rango, o
                        // "Sin cuenta" se llevaria los sobrantes: 93 de los 104 no tienen cuenta.
                        //
                        // El "tipo normal" se escribe (Deposito || Blank) y NUNCA con <>: en
                        // Dataverse un <> contra NULL descarta la fila, y hay 3.214 asientos viejos
                        // sin tipo que desapareceran del listado sin que nadie se entere.
                        If(
                            ctxSegManual = "Aplicadas",
                            Switch(
                                ctxMotivoMan,
                                "Rechazo core",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore <> Blank()
                                ), 'Created On', SortOrder.Descending),
                                "Faltantes",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Faltante
                                ), 'Created On', SortOrder.Descending),
                                "Sobrantes",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Sobrante
                                ), 'Created On', SortOrder.Descending),
                                "Sin declaracion",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion'
                                ), 'Created On', SortOrder.Descending),
                                "Sin cuenta",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                        || TransactionType = Blank())
                                    && AccountNumber = Blank()
                                ), 'Created On', SortOrder.Descending),
                                "Con cheques",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                        || TransactionType = Blank())
                                    && AccountNumber <> Blank()
                                    && !IsBlank(RelatedDepositRecounting) 
                                ), 'Created On', SortOrder.Descending),
                                "Sin motivo",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                        || TransactionType = Blank())
                                    && AccountNumber <> Blank()
                                    && IsBlank(RelatedDepositRecounting)
                                ), 'Created On', SortOrder.Descending),
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = 'TransactionStatus (CH-Tbl-Transactions)'.Aplicada
                                    && Cajero.User = gvarCajeroMan.cajero
                                ), 'Created On', SortOrder.Descending)
                            ),
                            If(
                                ctxOrdenMan = "Motivo" && ctxMotivoMan = "Todos",
                                Sort(
                                    Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                ),
                                    Switch(
                                        true,
                                        MotivoRechazoCore <> Blank(), 6,
                                        TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Faltante, 5,
                                        TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Sobrante, 4,
                                        TransactionType = 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion', 3,
                                        AccountNumber = Blank(), 2,
                                        !IsBlank(RelatedDepositRecounting), 1,
                                        0
                                    ),
                                    SortOrder.Descending
                                ),
                                Switch(
                                ctxMotivoMan,
                                "Rechazo core",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore <> Blank()
                                ), 'Created On', SortOrder.Ascending),
                                "Faltantes",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Faltante
                                ), 'Created On', SortOrder.Ascending),
                                "Sobrantes",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Sobrante
                                ), 'Created On', SortOrder.Ascending),
                                "Sin declaracion",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && TransactionType = 'TransactionType (CH-Tbl-Transactions)'.'Sin declaracion'
                                ), 'Created On', SortOrder.Ascending),
                                "Sin cuenta",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                        || TransactionType = Blank())
                                    && AccountNumber = Blank()
                                ), 'Created On', SortOrder.Ascending),
                                "Con cheques",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                        || TransactionType = Blank())
                                    && AccountNumber <> Blank()
                                    && !IsBlank(RelatedDepositRecounting)
                                ), 'Created On', SortOrder.Ascending),
                                "Sin motivo",
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                    && MotivoRechazoCore = Blank()
                                    && (TransactionType = 'TransactionType (CH-Tbl-Transactions)'.Deposito
                                        || TransactionType = Blank())
                                    && AccountNumber <> Blank()
                                    && !IsBlank(RelatedDepositRecounting)
                                ), 'Created On', SortOrder.Ascending),
                                Sort(Filter(
                                    'CH-Tbl-Transactions',
                                    TransactionProcessingType = 'TransactionProcessingType (CH-Tbl-Transactions)'.Manual
                                    && BatchStatus = Blank()
                                    && TransactionStatus = Blank()
                                    && Cajero.User = gvarCajeroMan.cajero
                                ), 'Created On', SortOrder.Ascending)
                            )
                            )
                        )
                    Layout: =Layout.Vertical
                    LoadingSpinner: =LoadingSpinner.Data
                    OnSelect: |-
                        =Set(gvarTxMan, galTxMan.Selected);
                        UpdateContext({ctxErrorMan: Blank()});
                        Reset(inpCampoCuentaMan); Reset(inpCampoMonedaMan); Reset(inpCampoEfectivoMan);
