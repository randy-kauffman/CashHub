App As appinfo:
    BackEnabled: =true
    OnError: |-
        =Trace("CH-App-Digitization error no controlado: " & FirstError.Message, TraceSeverity.Error);
        Notify("Ocurrió un error inesperado: " & FirstError.Message, NotificationType.Error)
    Theme: =PowerAppsTheme

    Host As hostControl.DefaultHostControlVariant:
        OnCancel: =false
        OnEdit: =false
        OnNew: =false
        OnSave: =false
        OnView: =false

