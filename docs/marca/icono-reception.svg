<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-Reception</title>
  <desc id="descripcion">Una bolsa de efectivo con una flecha de entrada: la recepcion de tulas en la esclusa.</desc>

  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Flecha de entrada: la tula que se recibe -->
    <path d="M256 58 V140"/>
    <path d="M222 106 L256 142 L290 106"/>

    <!-- Cuerpo de la bolsa (tula), abierto por el cuello -->
    <path d="M205 250
             C150 262 128 330 150 384
             C172 432 340 432 362 384
             C384 330 362 262 307 250 Z"/>
    <!-- Cinto del cuello: el pliegue que ata la bolsa -->
    <path d="M198 252 Q256 278 314 252"/>
    <!-- Pliegues del cuello abierto -->
    <path d="M216 250 L208 216"/>
    <path d="M256 250 L256 210"/>
    <path d="M296 250 L304 216"/>

    <!-- Signo de dinero sobre la bolsa -->
    <path d="M256 300 V394"/>
    <path d="M286 322 C286 306 246 304 232 316
             C218 328 226 344 256 348
             C286 352 294 368 280 380
             C266 392 230 392 224 376"/>
  </g>
</svg>
