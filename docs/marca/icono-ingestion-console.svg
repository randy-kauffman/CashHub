<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-IngestionConsole</title>
  <desc id="descripcion">Sobre de correo cuyo borde inferior es una linea de latido: la ingesta de correos y su monitoreo.</desc>

  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Lados y techo del sobre. Queda abierto por abajo a proposito. -->
    <path d="M104 344 V196 L126 174 H386 L408 196 V344"/>
    <!-- Solapa -->
    <path d="M120 188 L256 284 L392 188"/>
    <!-- El latido cierra el sobre por abajo: no compite con un borde, ES el borde.
         Es el mismo latido que deja el barrido y que la consola muestra en su semaforo. -->
    <path d="M104 344 H168 L196 286 L232 398 L262 344 H408"/>
  </g>
</svg>
