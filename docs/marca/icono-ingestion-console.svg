<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-IngestionConsole</title>
  <desc id="descripcion">Sobre de correo con una linea de latido atravesandolo: la ingesta de correos y su monitoreo.</desc>

  <!-- Fondo: rojo institucional BAC -->
  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <!-- Cuerpo del sobre -->
  <rect x="96" y="150" width="320" height="212" rx="26"
        fill="none" stroke="#FFFFFF" stroke-width="26"/>

  <!-- Solapa: baja desde las esquinas superiores hasta el centro -->
  <path d="M110 172 L256 274 L402 172"
        fill="none" stroke="#FFFFFF" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Latido: cruza el sobre de lado a lado. Es el mismo latido que vigila el
       barrido y que la consola muestra en su semaforo de salud. -->
  <path d="M60 322 H150 L178 268 L214 376 L246 322 H452"
        fill="none" stroke="#C8102E" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 322 H150 L178 268 L214 376 L246 322 H452"
        fill="none" stroke="#FFFFFF" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
