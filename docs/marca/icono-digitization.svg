<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-Digitization</title>
  <desc id="descripcion">Un cheque con marca de verificacion y flecha de salida: el handshake de cheques y la subida de lotes al Core.</desc>

  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Flecha de salida: el lote que sube al Core (espejo de la entrada de Reception) -->
    <path d="M256 142 V60"/>
    <path d="M222 96 L256 60 L290 96"/>

    <!-- El cheque -->
    <rect x="118" y="230" width="276" height="164" rx="26"/>

    <!-- Marca de verificacion: el cheque recibido por el digitador -->
    <path d="M180 316 L232 360 L332 272"/>
  </g>
</svg>
