<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-Recounting</title>
  <desc id="descripcion">Un billete bajo una flecha circular: el recuento del efectivo de la tula, contado de nuevo en boveda.</desc>

  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Flecha circular: el "re" de recuento — se cuenta otra vez.
         Arco de 200 grados por arriba, con la cola abierta abajo a la izquierda. -->
    <path d="M173 172 A76 76 0 1 1 320 146"/>

    <!-- El billete: lo que se cuenta -->
    <rect x="96" y="256" width="320" height="184" rx="30"/>
    <!-- Valor al centro del billete -->
    <circle cx="256" cy="348" r="38"/>
  </g>

  <!-- Cabeza de la flecha: base mas ancha que el trazo para que lea como punta,
       no como banderin. Cierra el ciclo bajando recto. -->
  <path d="M320 208 L278 132 L362 132 Z" fill="#FFFFFF"/>
</svg>
