<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-Hub</title>
  <desc id="descripcion">Grilla de aplicaciones con una tila encendida: el portal que lanza el resto del ecosistema CashHub.</desc>

  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Tile superior derecha -->
    <rect x="289" y="121" width="132" height="132" rx="30"/>
    <!-- Tile inferior izquierda -->
    <rect x="91" y="319" width="132" height="132" rx="30"/>
    <!-- Tile inferior derecha -->
    <rect x="289" y="319" width="132" height="132" rx="30"/>
  </g>
  <!-- Tile superior izquierda: encendida (el hub, la puerta de entrada) -->
  <rect x="76" y="106" width="162" height="162" rx="36" fill="#FFFFFF"/>
</svg>
