<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-Configuration</title>
  <desc id="descripcion">Tres deslizadores: los parametros de CashHub que negocio ajusta sin tocar codigo.</desc>

  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="28"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Rieles -->
    <path d="M100 152 L412 152"/>
    <path d="M100 256 L412 256"/>
    <path d="M100 360 L412 360"/>
  </g>

  <!-- Perillas: circulo blanco con nucleo rojo, misma construccion que los nodos del Tracker -->
  <g fill="#FFFFFF">
    <circle cx="196" cy="152" r="42"/>
    <circle cx="330" cy="256" r="42"/>
    <circle cx="252" cy="360" r="42"/>
  </g>
  <g fill="#C8102E">
    <circle cx="196" cy="152" r="17"/>
    <circle cx="330" cy="256" r="17"/>
    <circle cx="252" cy="360" r="17"/>
  </g>
</svg>
