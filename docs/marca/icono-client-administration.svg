<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">CH-App-ClientAdministration</title>
  <desc id="descripcion">Una persona con una insignia de verificacion: la administracion de clientes y la aprobacion de sus cambios.</desc>

  <rect width="512" height="512" rx="112" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Cabeza del cliente -->
    <circle cx="176" cy="176" r="62"/>
    <!-- Hombros: domo ancho y bajo, abierto por abajo a proposito -->
    <path d="M58 356 A118 94 0 0 1 294 356"/>
  </g>

  <!-- Recorte: un respiro rojo separa la insignia del busto para que no se fundan -->
  <circle cx="392" cy="396" r="82" fill="#C8102E"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="30"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Insignia de verificacion: el cambio del cliente esta aprobado -->
    <circle cx="392" cy="396" r="70"/>
    <path d="M362 400 L384 420 L420 364"/>
  </g>
</svg>
